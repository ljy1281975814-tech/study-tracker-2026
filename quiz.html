  function goneHTML() {
    return masthead() + '<section class="shell"><div class="empty"><span class="empty-mark">∅</span>' +
      '<h3>这组题已经结束了</h3><p>回首页重新排一次，或者去错题本。</p>' +
      '<button class="hero-cta" data-act="go" data-arg="home">回首页</button></div></section>';
  }
  function resultHTML(q, p) {
    var r = currentRec();
    var ok = p.outcome === 'ok', bad = p.outcome === 'bad', fuzzy = p.outcome === 'fuzzy';
    var cls = ok ? ' result--ok' : bad ? ' result--bad' : fuzzy ? ' result--warn' : ' result--neutral';
    var mark = ok ? '✓' : bad ? '×' : fuzzy ? '!' : '·';
    var wasMastered = !!(r && r.mastered && r.last === TODAY && p.outcome);
    var title = ok ? (wasMastered ? '抽查通过' : '答对了') : bad ? '答错了' : fuzzy ? '算你对，但没把握' : '已揭晓，等你判分';
    var sub = '';
    if (p.restored) {
      sub = '本题今天已判过 · 本次不计分';
    } else if (isChoice(q)) {
      sub = '你的答案 ' + (p.sel.join('') || '—') + ' · 正确答案 ' + String(q.key || '') +
        (p.sel.length ? '' : ' · 未作答');
    } else if (q.bq) {
      var bh1 = blankHits(q, p.text || '');
      sub = (p.text ? '你写了 ' + p.text.length + ' 字' : '未写') + ' · 逐空命中 ' + bh1.got + '/' + bh1.total + '（按顺序精确匹配）';
    } else {
      var h = p.hits || kwHits(q, p.text);
      sub = (p.text ? '你写了 ' + p.text.length + ' 字' : '未写') + ' · 关键词命中 ' + h.hit + '/' + h.total;
    }
    var score = '';
    if (p.outcome && !p.practice) {
      var rDue = (r && r.due) || addDays(TODAY, 1);
      score = (r && r.mastered ? '抽查排期<br>' : '下次复习<br>') +
        '<b>' + relDue(rDue) + '</b><br>' + mdLabel(rDue);
    }
    var hitsHTML = '';
    if (!isChoice(q) && !q.bq && (q.kw || []).length) {
      var hh = p.hits || kwHits(q, p.text);
      hitsHTML = '<div class="hits">' + (q.kw || []).slice(0, 8).map(function (k) {
        var nk = normTxt(k), t = normTxt(p.text);
        var on = t && (t.indexOf(nk) >= 0 || (t.length >= 3 && nk.indexOf(t) >= 0));
        return '<span class="hit' + (on ? ' is-on' : '') + '">' + esc(clamp(k, 16)) + '</span>';
      }).join('') + '</div>';
    }
    var ansBlock;
    if (isChoice(q)) {
      ansBlock = '<div class="block-kicker">正确答案</div>' +
        '<div class="ans-choice"><span class="mono">' + String(q.key || '') + '</span>' +
        '<span>' + esc((q.opts[String(q.key || '')[0]] || '')) + '</span></div>' +
        '<p class="ans-text">' + highlight(q.ans, []) + '</p>';
    } else if (q.bq) {
      var bh2 = blankHits(q, p.text || '');
      ansBlock = '<div class="block-kicker">逐空核对（' + bh2.got + '/' + bh2.total + '）</div>' +
        '<div class="blank-check">' + bh2.list.map(function (m, i) {
          return '<div class="blank-row' + (m.on ? ' is-on' : '') + '">' +
            '<span class="blank-no">空 ' + (i + 1) + '</span>' +
            '<span class="blank-mine">你写：' + esc(m.mine || '—') + '</span>' +
            '<span class="blank-right">正确：' + esc(m.w) + '</span>' +
            '<span class="blank-flag">' + (m.on ? '✓' : '×') + '</span></div>';
        }).join('') + '</div>' +
        '<p class="ans-text" style="margin-top:10px">' + highlight(q.ans, []) + '</p>';
    } else {
      ansBlock = '<div class="block-kicker">' + (q.t === '填空' ? '原文 · 标红即踩分处' : '参考答案 · 标红即踩分术语') + '</div>' +
        '<p class="ans-text">' + highlight(q.ans, q.kw) + '</p>' + hitsHTML;
    }
    var jx = q.jx ? '<div class="jx">' +
      '<div class="block-kicker">本题解析</div>' +
      layer('破题思路', q.jx.po) + layer('正确项 / 踩分点', q.jx.ok) + layer('易错与陷阱', q.jx.bad) +
      '</div>' : '';
    var ch = CH[q.s + q.c] || {};
    var book = '<div class="locate"><span class="locate-mark"></span><div class="locate-body">' +
      '<div class="locate-k">回书定位</div>' +
      '<p>第' + q.c + '章 ' + esc(ch.name || '') + (q.kd ? ' · ' + esc(q.kd) : '') + '</p>' +
      '<p class="mono">' + (q.card ? ('背诵手册 卡 ' + q.card) : '综合题（跨卡）') +
      (ch.a ? '（本章卡 ' + ch.a + '–' + ch.b + '）' : '') + ' · ' + formLabel(q) + '</p>' +
      '<p class="mono">' + esc(ch.exam || '') + '</p></div></div>';
    var lockNote = '';
    if (p.restored && p.outcome) {
      lockNote = '<p class="lock-note">本题今天已经判过一次（' + mdLabel(TODAY) + '），不再重复计分；明天它会按排期回来。</p>';
    } else if (p.revisit && p.outcome) {
      lockNote = '<p class="lock-note">本题本次已判过，判定留在原地：同一天不会重复计分，也不改排期。</p>';
    } else if (p.practice) {
      lockNote = '<p class="lock-note">重做模式：只看对错与解析，<b>不计分、不改排期</b>。</p>';
    }
    var nogood = '';
    if (p.revealed && p.outcome && p.outcome !== 'fuzzy' && !p.restored && !p.practice) {
      nogood = '<button class="nogood" data-act="grade" data-arg="fuzzy">其实没把握 → 改按 1 天再排</button>';
    }
    var fixup = (p.revealed && q.bq && p.outcome === 'bad' && !p.restored && !p.practice)
      ? '<button class="nogood" data-act="grade" data-arg="ok">其实写对了 → 改判答对</button>' : '';
    return '<section class="result' + cls + '" id="resultCard">' +
      '<div class="result-top"><span class="result-mark">' + mark + '</span>' +
      '<div class="result-title"><b>' + title + '</b><span>' + sub + '</span></div>' +
      '<div class="result-score">' + score + '</div></div>' +
      '<div class="result-body">' + rollHTML(r, p) + lockNote + ansBlock + nogood + fixup + jx + book + '</div></section>';
  }
  function layer(k, v) {
    if (!v) return '';
    return '<div class="jx-layer"><div class="jx-k">' + k + '</div><p class="jx-p">' + esc(v) + '</p></div>';
  }
  function rollHTML(r, p) {
    if (!p.outcome) return '';
    if (p.practice) {
      return '<div class="roll"><div class="roll-h">重做 · 不计分</div>' +
        '<p class="roll-p">这题本次不改排期；' + (r && r.due ? '当前排期 ' + mdLabel(r.due) + '（' + relDue(r.due) + '）。' : '它还没进滚动。') + '</p></div>';
    }
    var step = p.outcome === 'ok' ? Math.min(r.streak || 1, STEP_LABEL.length) : 0;
    var label;
    if (p.outcome === 'ok') label = (r.mastered ? '抽查通过：' : '已进入滚动：') + relDue(r.due) + '复测';
    else if (p.outcome === 'fuzzy') label = '没把握：' + relDue(r.due) + '再看一遍';
    else label = '回到起点：' + relDue(r.due) + '再来';
    var steps = STEP_LABEL.map(function (t, i) {
      var on = (i + 1) <= step ? ' is-on' : '';
      return '<span class="roll-step' + on + '"><span class="roll-dot">' + (i + 1) + '</span>' + t + '</span>' +
        (i < STEP_LABEL.length - 1 ? '<i class="roll-line"></i>' : '');
    }).join('');
    var tip = p.outcome === 'ok'
      ? '答对一次进 3 天，再对 7 → 15 → 30 → 60 → 90 天；90 天后为结业抽查。'
      : '答错回 1 天；不用自己记日期，到期它会自己回来。';
    return '<div class="roll"><div class="roll-h">' + label + '</div>' +
      '<div class="roll-steps roll-steps--6">' + steps + '</div>' +
      '<p class="roll-p">' + tip + '</p></div>';
  }
  function quizBarHTML() {
    var q = currentQ();
    if (!q) return '';
    var p = ensurePending();
    var last = S.session.idx >= S.session.ids.length - 1;
    var prev = '<button class="bar-prev" data-act="prev"' + (S.session.idx === 0 ? ' disabled' : '') + '>上一题</button>';
    if (!p.revealed) {
      var autoJudge = isChoice(q) || !!q.bq;
      var label = isChoice(q) ? '提交答案' : (q.bq ? '提交并判分' : '显示参考答案');
      return '<div class="quiz-bar">' + prev + '<button class="bar-primary" data-act="' + (autoJudge ? 'submit' : 'reveal') + '"' +
        (isChoice(q) && !p.sel.length ? ' disabled' : '') + '>' + label + '</button></div>';
    }
    if (!p.outcome) {
      // 副标按「真实排期」算：当前 streak 决定这次「答对了」会排到几天后
      var okDays = nextIntervalFor(q, 'ok');
      var badDays = nextIntervalFor(q, 'bad');
      return '<div class="quiz-bar">' +
        '<button class="bar-grade bar-grade--bad" data-act="grade" data-arg="bad">没答对<span>' +
        (badDays === 1 ? '明天' : badDays + ' 天后') + '再来</span></button>' +
        '<button class="bar-grade bar-grade--ok" data-act="grade" data-arg="ok" data-days="' + okDays + '">答对了<span>' +
        (r_mastered(q) ? '抽查通过 · ' + MASTER_DAYS + ' 天后' : okDays + ' 天后复习') + '</span></button></div>';
    }
    if (p.restored) {
      return '<div class="quiz-bar">' + prev + '<button class="bar-primary" data-act="' + (last ? 'finish' : 'next') + '">' +
        (last ? '完成本次' : '下一题') + '</button></div>';
    }
    return '<div class="quiz-bar">' + prev + '<button class="bar-primary" data-act="' + (last ? 'finish' : 'next') + '">' +
      (last ? '完成本次' : '下一题') + '</button></div>';
  }
  function r_mastered(q) { var r = rec(q); return !!(r && r.mastered); }

      '<div class="stat-grid">' +

      cell('错题滚动中', wrongN, '') + cell('已掌握', masteredN, '') +

  function nextLockable() {
    var ls = openChapters().slice().sort(function (a, b) { return a.o - b.o; });

    var cand = BANK.chapters.filter(function (c) { return !isOpen(c.s, c.c); });
    if (!cand.length || !lastL) return null;
    // 优先同科目下一章，其次另一科目第 1 章

    var other = cand.filter(function (c) { return c.s !== lastL.s; }).sort(function (a, b) { return a.c - b.c; });
    return other[0] || null;
  }

        '</div></div>' +

    return '<div class="row"><span>' + k + '</span><b' + (red ? ' class="is-red"' : '') + '>' + v + '</b></div>';

  /* ---------------- 导出 / 导入 ---------------- */
  function exportPayload() {
    return {
      app: '347-quiz', v: 6, exportedAt: new Date().toISOString(), axis: progress.axis,
      bank: { total: META.total, learned: available().length, kp: learnedKpCount(), unique: queuePool().length, source: 'zyk.json' },
      progress: { q: progress.q, days: progress.days, unlocked: progress.unlocked, axis: progress.axis }
    };
  }
  function exportText() { return JSON.stringify(exportPayload(), null, 1); }

  function doImport() {
    var box = $('#importText');
    var errEl = $('#importError');
    var txt = (box && box.value || '').trim();
    var mode = 'merge';
    var radios = document.querySelectorAll('input[name="imp"]');
    for (var i = 0; i < radios.length; i++) if (radios[i].checked) mode = radios[i].value;
    function fail(m) { if (errEl) { errEl.hidden = false; errEl.textContent = m; } }
    if (!txt) return fail('还没有粘贴 JSON。');
    var data;
    try { data = JSON.parse(txt); } catch (e) { return fail('JSON 解析失败：' + e.message); }
    if (!data || typeof data !== 'object' || !data.progress || typeof data.progress.q !== 'object') {
      return fail('结构不对：需要找到 progress.q（本工具导出的 JSON 才有）。');
    }
    var srcD = data.progress.days || {};
    // 旧版按题 id 存，新版按考点 kp 存 → 一律先映射到 kp 再合并
    var srcQ = migrateQ(data.progress.q || {});
    var added = 0, updated = 0, skipped = 0, merged = 0;
    if (mode === 'replace') {
      progress.q = {}; progress.days = {}; progress.unlocked = data.progress.unlocked || [];
      progress.axis = (data.progress.axis === 'rand' || data.axis === 'rand') ? 'rand' : 'seq';
      S.order = progress.axis;
    }
    Object.keys(srcQ).forEach(function (k) {
      var b = srcQ[k], a = progress.q[k];
      if (!BY[k]) { skipped++; return; }
      if (!a) { progress.q[k] = b; added++; return; }
      var ta = a.lastAt || '', tb = b.lastAt || '';
      if (tb > ta || (!tb && ta && (b.last || '') > (a.last || ''))) {
        // 保留次数最多的那侧的累计次数（换设备合并时不丢次数）
        progress.q[k] = mergeRec(a, b);
        updated++;
      } else merged++;
    });
    Object.keys(srcD).forEach(function (k) {
      var a = progress.days[k], b = srcD[k];
      if (!a) { progress.days[k] = b; return; }
      progress.days[k] = {
        a: Math.max(a.a || 0, b.a || 0), c: Math.max(a.c || 0, b.c || 0), w: Math.max(a.w || 0, b.w || 0)
      };
    });
    saveProgress();
    closeSheet();
    toast('导入完成：新增 ' + added + '，更新 ' + updated + '，本机较新 ' + merged + '，跳过 ' + skipped);
    render();
  }

  /* ---------------- 会话动作 ---------------- */
  // 把「判定结果」顶到吸顶答题头下面：header 高度是活的，320/360 都不遮
  function scrollToResult() {
    var el = $('.result') || $('#resultCard');
    if (!el) return;
    var head = $('.quiz-head');
    var hh = head ? Math.round(head.getBoundingClientRect().height) : 62;
    var top = el.getBoundingClientRect().top + (window.pageYOffset || 0) - hh - 10;
    try { window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, Math.max(0, top)); }
  }
  function afterGradeScroll() { setTimeout(scrollToResult, 40); }

  function submitAnswer() {
    var q = currentQ(), p = ensurePending();
    if (!q || !p) return;
    if (p.restored) { toast('这张卡今天已经判过了，明天按排期回来。'); return; }
    if (p.revealed) return;
    if (isChoice(q) && !p.sel.length) { toast('先选一个选项。'); return; }
    if (q.bq && !String(p.text || '').trim()) { toast('先写下你想到的术语，再提交。'); return; }
    p.revealed = true;
    if (isChoice(q)) {
      // 选择题当场判：正确/错误立即落库，仍可改判「蒙对的」
      p.auto = checkChoice(q, p.sel);
      p.outcome = p.auto ? 'ok' : 'bad';
      if (p.practice) {
        p.graded = true;
        if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
      } else {
        var g = applyGrade(q, p.outcome, { text: '', sel: p.sel });
        if (g && g.locked) { p.restored = true; p.outcome = (rec(q) || {}).lastOutcome || 'ok'; }
        else {
          p.graded = true;
          if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
        }
      }
      p.hits = null;
    } else if (q.bq) {
      // 术语填空：全对=ok，中一部分=fuzzy，全错=bad（可改判）
      var bh0 = blankHits(q, p.text);
      p.auto = bh0.got === bh0.total;
      p.outcome = p.auto ? 'ok' : (bh0.got > 0 ? 'fuzzy' : 'bad');
      p.hits = { hit: bh0.got, total: bh0.total };
      if (p.practice) {
        p.graded = true;
        if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
      } else {
        var gb = applyGrade(q, p.outcome, { text: p.text });
        if (gb && gb.locked) { p.restored = true; p.outcome = (rec(q) || {}).lastOutcome || p.outcome; }
        else {
          p.graded = true;
          if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
        }
      }
    } else {
      p.hits = kwHits(q, p.text);
    }
    render();
    afterGradeScroll();
  }
  function grade(outcome) {
    var q = currentQ(), p = ensurePending();
    if (!q || !p || !p.revealed) return;
    if (p.restored) { toast('这张卡今天已经判过了，不重复计分。'); return; }
    if (p.outcome) {
      // 已判定：只允许一次「蒙对的，没把握」改判，走 1 天（并回退上一次的计数与天数）
      if (outcome === 'fuzzy' && p.outcome !== 'fuzzy' && !p.practice) {
        applyGrade(q, 'fuzzy', { regrade: true, text: p.text, sel: p.sel });
        if (S.session && p.outcome === 'ok') S.session.right = Math.max(0, S.session.right - 1);
        p.outcome = 'fuzzy';
        render(); afterGradeScroll(); toast('已改判：回 1 天、不进错题本，当天计数已回退。');
      }
      // v5：术语填空「其实写对了」→ 把 bad 改判 ok
      if (q.bq && outcome === 'ok' && p.outcome !== 'ok' && !p.practice) {
        applyGrade(q, 'ok', { regrade: true, text: p.text, sel: p.sel });
        p.outcome = 'ok';
        if (S.session) S.session.right = Math.min(S.session.answered, S.session.right + 1);
        render(); afterGradeScroll(); toast('已改判为答对，排期前移。');
      }
      return;
    }
    if (p.practice) {
      p.outcome = outcome; p.graded = true;
      if (S.session) { S.session.answered++; if (outcome === 'ok') S.session.right++; }
      render(); afterGradeScroll();
      return;
    }
    var g = applyGrade(q, outcome, { text: p.text, sel: p.sel });
    if (g && g.locked) {
      p.restored = true; p.outcome = (rec(q) || {}).lastOutcome || outcome;
      render(); afterGradeScroll(); toast('这张卡今天已经判过了，不重复计分。');
      return;
    }
    p.outcome = outcome;
    p.graded = true;
    if (S.session) { S.session.answered++; if (outcome === 'ok') S.session.right++; }
    render(); afterGradeScroll();
  }
  function nextQuestion() {
    if (!S.session) return;
    if (S.session.idx < S.session.ids.length - 1) {
      S.session.idx++; markRevisit(); render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else finishSession();
  }
  function finishSession() { go('done'); }
  function prevQuestion() {
    if (!S.session || S.session.idx === 0) return;
    S.session.idx--; markRevisit(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function go(view) {
    S.view = view; S.sheet = null;
    if (view !== 'quiz') S.session = view === 'done' ? S.session : null;
    if (view !== 'quiz') S.pend = {};
    render();
    try { history.replaceState(null, '', '#' + view); } catch (e) { }
    window.scrollTo(0, 0);
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var app = $('#app');

    else if (S.view === 'chapters') html = chaptersHTML();
    else if (S.view === 'quiz') html = quizHTML();
    else if (S.view === 'wrong') html = wrongHTML();
    else if (S.view === 'progress') html = progressHTML();
    else if (S.view === 'more') html = moreHTML();
    else if (S.view === 'terms') html = termsHTML();

    else if (S.view === 'done') html = doneHTML();
    app.innerHTML = html;

    if (S.view === 'quiz' && currentQ()) {

    } else if (S.view === 'home') {
      // 首屏只留一个按钮：首页不显示底部 tabbar，其余入口在首页下半屏
      document.body.classList.remove('has-bar', 'is-quiz', 'has-tabbar');
      $('#tabbar').hidden = true;
      $('#tabbar').innerHTML = '';
    } else {
      document.body.classList.remove('has-bar', 'is-quiz');
      document.body.classList.add('has-tabbar');

    var ov = $('#overlay');

      ov.innerHTML = sheetHTML();

    } else {

  }
  function bindImport() {
    var f = $('#importFile');
    if (!f) return;
    f.addEventListener('change', function () {
      var file = f.files && f.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        var box = $('#importText');
        if (box) box.value = String(rd.result || '');
        toast('已读入 ' + file.name + '，点「校验并导入」。');
      };
      rd.onerror = function () { toast('文件读失败，试试复制粘贴。'); };
      rd.readAsText(file, 'utf-8');
    });
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) {
      // 点遮罩关闭
      if (ev.target.id === 'overlay') closeSheet();
      return;
    }
    var act = t.dataset.act, arg = t.dataset.arg || '';
    switch (act) {
      case 'go': go(arg); break;
      case 'start':
        if (arg === 'daily') {
          var todo = todoItems(), ids = todo.map(function (q) { return q.id; });
          var full = false;
          if (!ids.length) { ids = allQueue().map(function (q) { return q.id; }); full = true; }
          if (!ids.length) { toast('题库为空。'); break; }
          startSession(ids, 'daily', (full ? '自由复习' : '待答') + ' · ' + axisLabel());
        }
        else if (arg === 'due') {
          var ids = dueItems().map(function (q) { return q.id; });
          if (!ids.length) { openSheet('sched'); break; }
          startSession(ids, 'due', '滚动复习 · 到期 ' + ids.length + ' 题');
        } else if (arg === 'wrong') go('wrong');
        break;
      case 'chapter':
        var parts = arg.split('|'), s = parts[0], c = +parts[1];
        var items = uniqContentList(orderList(chapterItems(s, c)));
        var ch = CH[s + c] || {};
        startSession(items.map(function (q) { return q.id; }), 'chapter', s + ' 第' + c + '章 ' + (ch.name || '') + ' · ' + axisLabel());
        break;
      case 'locked': toast('这章还没学：先上完 1v1 这节课，再到「进度 → 解锁下一章」。'); break;
      case 'pick': {
        var p = ensurePending(); if (!p || p.revealed || p.restored) break;
        var q = currentQ();
        if (isMulti(q)) {
          var i = p.sel.indexOf(arg);
          if (i >= 0) p.sel.splice(i, 1); else p.sel.push(arg);
        } else p.sel = [arg];
        render(); break;
      }
      case 'submit': submitAnswer(); break;
      case 'reveal': {
        var pp = ensurePending(); if (!pp) break;
        if (pp.restored) { toast('这张卡今天已经判过了。'); break; }
        pp.revealed = true; pp.hits = kwHits(currentQ(), pp.text); render();
        afterGradeScroll();
        break;
      }
      case 'grade': grade(arg); break;
      case 'next': nextQuestion(); break;
      case 'prev': prevQuestion(); break;
      case 'finish': finishSession(); break;
      case 'jump': {
        var j = +arg; if (S.session && j >= 0 && j < S.session.ids.length) {
          S.session.idx = j; closeSheet(); markRevisit(); render(); window.scrollTo(0, 0);
        } break;
      }
      case 'exit': if (S.session && S.session.answered) { startConfirmExit(); } else { go('home'); } break;
      case 'wrong-filter': S.wrong = arg; render(); break;
      case 'redo': {
        var rq = BY[arg];
        if (rq) startSession([rq.id], 'practice', '错题重做（不计分）· ' + rq.s + ' 第' + rq.c + '章');
        break;
      }
      case 'master': {
        var mq = BY[arg], rr = mq ? rec(mq) : null;
        if (mq && rr) {
          rr.mastered = true; rr.masteredAt = TODAY;
          rr.interval = MASTER_DAYS; rr.due = addDays(TODAY, MASTER_DAYS);
          saveProgress(); toast('已标掌握：' + MASTER_DAYS + ' 天后（' + mdLabel(rr.due) + '）会回来抽查。'); render();
        }
        break;
      }
      case 'unmaster': {
        var uq = BY[arg], ur = uq ? rec(uq) : null;
        if (uq && ur) {
          ur.mastered = false; ur.interval = 1; ur.due = addDays(TODAY, 1);
          saveProgress(); toast('已取消掌握：回到 1 天滚动，重新进错题本。'); render();
        }
        break;
      }
      case 'sheet': openSheet(arg); break;
      case 'close-sheet':
        // 点抽屉内部不关闭；只有遮罩本身或右上角关闭按钮才关
        if (ev.target.closest('.sheet') && !ev.target.closest('.sheet-close')) break;
        closeSheet(); break;
      case 'copy': copyText(exportText(), '已复制，去微信粘贴。'); break;
      case 'download': downloadExport(); break;
      case 'doimport': doImport(); break;
      case 'sheet-close-start': { closeSheet(); var sq = BY[arg]; if (sq) startSession([sq.id], 'due', '单题复习 · 卡 ' + (sq.card || '')); break; }
      case 'axis': {
        var av = arg || (S.order === 'rand' ? 'seq' : 'rand');
        setAxis(av); render();
        toast('顺序轴已切到：' + axisLabel() + '（待答 / 全量 / 章节 / 到期 / 错题 同步）');
        break;
      }
      case 'unlock': startUnlock(arg); break;
      case 'reset': startReset(t); break;
    }
  });
  document.addEventListener('click', function (ev) {
    if (ev.target.classList && ev.target.classList.contains('overlay')) closeSheet();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'recallText') {
      var p = ensurePending(); if (!p || p.restored) return;
      p.text = ev.target.value;
      var q = currentQ();
      var r = q ? rec(q) : null;
      if (r) { r.draft = p.text; saveProgress(); }
      var lab = ev.target.previousElementSibling;
      if (lab && lab.querySelector('span')) lab.querySelector('span').textContent = p.text ? p.text.length + ' 字' : '可留空';
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (S.view !== 'quiz' || S.sheet) return;
    var p = ensurePending(), q = currentQ();
    if (!q || !p) return;
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); if (!p.revealed) submitAnswer(); } return; }
    var k = ev.key.toUpperCase();
    if (!p.revealed && isChoice(q) && 'ABCD'.indexOf(k) >= 0) {
      if (q.opts[k]) { p.sel = [k]; render(); ev.preventDefault(); }
    } else if (k === 'ENTER') {
      if (!p.revealed) submitAnswer(); else if (!p.outcome) grade(p.auto === false ? 'bad' : 'ok'); else nextQuestion();
      ev.preventDefault();
    } else if (ev.key === 'ArrowLeft') { prevQuestion(); }
    else if (ev.key === 'ArrowRight') { nextQuestion(); }
    else if (!p.revealed && isChoice(q) && /^[1-4]$/.test(ev.key)) {
      var L = 'ABCD'[+ev.key - 1]; if (q.opts[L]) { p.sel = [L]; render(); ev.preventDefault(); }
    }
  });

  function todayChapterTitle() {

  }
  function openSheet(type) { S.sheet = { type: type }; render(); }

  function toast(msg) {

  function copyText(txt, ok) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(ok); } catch (e) { toast('复制失败，长按文本框手动复制。'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast(ok); }, fallback);
    } else fallback();
  }
  function downloadExport() {
    var blob = new Blob([exportText()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '347进度_' + TODAY + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function startUnlock(arg) {
    var p = arg.split('|'), s = p[0], c = +p[1];
    var ch = CH[s + c];
    if (!ch) return;
    if (!window.confirm('确认已上完 ' + s + ' 第' + c + '章「' + ch.name + '」？解锁后这 ' + ch.n + ' 题会进入每日队列。')) return;
    progress.unlocked.push(s + c);
    saveProgress(); toast('已解锁 ' + s + ' 第' + c + '章（' + ch.n + ' 题）'); render();
  }
  function startReset(btn) {
    if (!btn.dataset.confirm) {
      btn.dataset.confirm = '1';
      btn.classList.add('is-confirm');
      btn.textContent = '再点一次确认清空（不可恢复）';
      setTimeout(function () {
        if (!btn.dataset.confirm) return;
        delete btn.dataset.confirm; btn.classList.remove('is-confirm'); btn.textContent = '清空本机进度';
      }, 4000);
      return;
    }
    progress = blank(); progress.axis = 'seq'; S.order = 'seq'; S.session = null; S.pend = {};
    saveProgress(); toast('本机进度已清空（顺序轴回到正序）。'); render();
  }
  function startConfirmExit() {
    if (window.confirm('退出本次答题？已作答的记录都保留。')) { go('home'); }
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    loadProgress();
    var hash = (location.hash || '').replace('#', '');
    S.order = progress.axis === 'rand' ? 'rand' : 'seq';
    if (['home', 'chapters', 'wrong', 'progress', 'more', 'terms', 'selfcheck'].indexOf(hash) >= 0) S.view = hash;
    render();
    if (hash === 'quiz') S.view = 'home';
  }
  window.__v5r3 = {
    items: ITEMS, meta: META, terms: TERMS, termInfo: BANK.termInfo || {},
    queue: function () { return allQueue().map(function (q) { return q.id; }); },
    queuePool: function () { return queuePool().map(function (q) { return q.id; }); },
    todo: function () { return todoItems().map(function (q) { return q.id; }); },
    selfcheck: computeSelfCheck,
    blankHits: blankHits,
    goItem: function (id, mode) { startSession([id], mode === 'normal' ? 'normal' : 'practice', '探针 · 单题'); }
  };
  window.__v5r2 = window.__v5r3;
  boot();
})();
</script>
