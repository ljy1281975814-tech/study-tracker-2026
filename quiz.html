<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2efe7">
<meta name="description" content="347 专业课（普心/社心）答题系统：只放已学章；术语挖空 + 问答型；同题面合并；解析落到背诵手册卡号。">
<title>347 · 专业课答题 v5_r4 · 普心 / 社心</title>
<style>
:root{
    --paper:#f2efe7;
    --paper-2:#e8e2d5;
    --paper-3:#fbf8f0;
    --ink:#131210;
    --ink-2:#34312b;
    --muted:#575247;
    --line:#131210;
    --line-soft:#bdb5a5;
    --red:#c92a12;
    --red-deep:#a8200b;
    --red-soft:#f3e0da;
    --ok:#2f5d3a;
    --ok-deep:#24482d;
    --ok-bg:#e7ebdf;
    --warn:#8a5a12;
    --warn-bg:#f3ead7;
    --dark:#141310;
    --dark-2:#1d1b16;
    --dark-muted:#c9c2b4;
    --white:#fffdf7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:"SFMono-Regular","Cascadia Mono","Roboto Mono","DejaVu Sans Mono",Consolas,monospace;
    --max:620px;
    --gutter:clamp(16px,4.5vw,24px);
    --tap:44px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    scroll-behavior:smooth;
    background:var(--paper);
  }
  body{
    margin:0;
    min-width:0;
    overflow-x:hidden;
    overflow-x:clip;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.42;
    background-image:radial-gradient(rgba(19,18,16,.045) .55px,transparent .55px);
    background-size:4px 4px;
  }
  h1,h2,h3,h4,p,figure,blockquote,ul,ol{margin:0}
  ul,ol{padding:0;list-style:none}
  button,input,textarea,select{font:inherit;color:inherit}
  button{
    border:0;
    background:none;
    padding:0;
    cursor:pointer;
    text-align:left;
  }
  a{color:inherit;text-decoration:none}
  svg{display:block}
  img{max-width:100%}
  ::selection{background:var(--red);color:var(--white)}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}
  [hidden]{display:none!important}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
  .nowrap{white-space:nowrap}
  .icon{
    width:22px;
    height:22px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:square;
    stroke-linejoin:miter;
    overflow:visible;
  }
  body.sheet-open{overflow:hidden}
  .sr-only{
    position:absolute!important;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .skip{
    position:fixed;
    top:-90px;
    left:12px;
    z-index:200;
    display:flex;
    align-items:center;
    min-height:var(--tap);
    padding:12px 16px;
    background:var(--ink);
    color:var(--paper);
    font-size:15px;
    line-height:1.2;
    transition:top .16s ease;
  }
  .skip:focus{top:calc(12px + var(--safe-t))}

  /* ---------- frame ---------- */
  .frame{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  #app{
    flex:1 0 auto;
    width:100%;
    min-width:0;
  }
  .shell{
    width:100%;
    max-width:var(--max);
    margin-inline:auto;
    padding-left:max(var(--gutter),var(--safe-l));
    padding-right:max(var(--gutter),var(--safe-r));
  }
  .hero.shell,.page-head.shell,.quiz-wrap.shell,.done.shell,.home-foot.shell{
    padding-left:max(var(--gutter),var(--safe-l));
    padding-right:max(var(--gutter),var(--safe-r));
  }

  /* ---------- masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--ink);
    background:var(--paper);
    padding-top:var(--safe-t);
  }
  .masthead-in{
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
  }
  .brand-mark{
    width:36px;
    height:36px;
    flex:0 0 36px;
    display:grid;
    place-items:center;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
  }
  .brand-t{min-width:0}
  .brand-t b{
    display:block;
    font-size:15px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .brand-t small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.12em;
    white-space:nowrap;
  }
  .issue{
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
    font-size:12px;
    line-height:1.4;
    color:var(--muted);
  }
  .issue .issue-day{
    color:var(--ink);
    font-weight:700;
    font-size:13px;
  }
  .issue .issue-dot{
    width:4px;height:4px;
    background:var(--red);
    align-self:center;
  }

  /* ---------- home hero ---------- */
  .hero{
    position:relative;
    border-bottom:1px solid var(--ink);
    padding:18px 0 22px;
    animation:rise .52s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .hero::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:52px;height:4px;
    background:var(--red);
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    line-height:1.4;
    letter-spacing:.13em;
    font-weight:700;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    flex:0 0 7px;
    background:var(--red);
  }
  .hero-date{
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .countline{
    display:flex;
    align-items:flex-end;
    gap:10px;
    margin-top:14px;
    min-width:0;
  }
  .count-num{
    display:block;
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(92px,26vw,124px);
    font-weight:700;
    line-height:.78;
    letter-spacing:-.09em;
    font-variant-numeric:lining-nums tabular-nums;
  }
  .count-unit{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:7px;
    flex:0 0 auto;
  }
  .count-unit b{
    font-size:21px;
    line-height:.95;
    font-weight:700;
  }
  .count-unit span{
    color:var(--muted);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.06em;
    white-space:nowrap;
  }
  .hero-title{
    margin-top:14px;
    font-size:clamp(34px,10vw,44px);
    font-weight:700;
    line-height:1.08;
    letter-spacing:-.055em;
    max-width:9em;
    text-wrap:balance;
  }
  .hero-title span{
    position:relative;
    display:inline-block;
  }
  .hero-title span::after{
    content:"";
    position:absolute;
    left:0;right:0;
    bottom:.01em;
    height:.08em;
    background:var(--red);
  }
  .hero-lead{
    margin-top:12px;
    max-width:34em;
    color:var(--ink-2);
    font-size:15px;
    line-height:1.75;
    text-wrap:pretty;
  }
  .hero-lead b{color:var(--ink);font-weight:700}
  .hero-cta{
    display:flex;
    width:100%;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:54px;
    margin-top:16px;
    padding:12px 14px;
    border:1px solid var(--red);
    background:var(--red);
    color:var(--white);
    font-size:17px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.01em;
    transition:background .16s ease,border-color .16s ease,color .16s ease,transform .12s ease;
  }
  .hero-cta::after{
    content:"→";
    font-family:var(--mono);
    font-size:18px;
    line-height:1;
  }
  .hero-cta:active{transform:translateY(1px);background:var(--red-deep)}
  .hero-cta--dark{border-color:var(--ink);background:var(--ink)}
  .hero-cta--dark:active{background:var(--dark-2)}
  .hero-foot{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .hero-facts{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    margin-top:16px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .hero-fact{
    min-width:0;
    padding:9px 9px 9px 0;
  }
  .hero-fact + .hero-fact{
    padding-left:9px;
    border-left:1px solid var(--line-soft);
  }
  .hero-fact span{
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.03em;
  }
  .hero-fact b{
    display:block;
    margin-top:2px;
    font-size:16px;
    line-height:1.35;
    font-weight:700;
    overflow-wrap:anywhere;
  }

  /* ---------- advice ---------- */
  .advice{
    position:relative;
    margin-top:18px;
    padding:15px 15px 14px 17px;
    background:var(--paper-2);
    border-left:5px solid var(--red);
  }
  .advice-kicker{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    color:var(--red);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.1em;
  }
  .advice-kicker span{
    color:var(--muted);
    font-weight:400;
    letter-spacing:.02em;
  }
  .advice-title{
    margin-top:7px;
    font-size:23px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.035em;
    overflow-wrap:anywhere;
  }
  .advice p{
    margin-top:5px;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.6;
  }
  .advice p b{color:var(--ink);font-weight:700}
  .advice-order{
    margin-top:7px!important;
    padding-top:7px;
    border-top:1px solid rgba(19,18,16,.16);
    color:var(--muted)!important;
    font-size:11px!important;
    letter-spacing:.02em;
  }

  /* ---------- entries ---------- */
  .entries{
    margin-top:24px;
    border-top:2px solid var(--ink);
  }
  .entry{
    display:grid;
    grid-template-columns:30px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:70px;
    padding:14px 0;
    border-bottom:1px solid var(--line-soft);
    transition:background .16s ease;
  }
  .entry:active{background:rgba(19,18,16,.035)}
  .entry-num{
    align-self:start;
    padding-top:5px;
    color:var(--red);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.04em;
  }
  .entry-main{min-width:0;display:block}
  .entry-title{
    display:block;
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.035em;
  }
  .entry-desc{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
    overflow-wrap:anywhere;
  }
  .entry-desc b{color:var(--ink);font-weight:700}
  .entry-side{
    display:inline-flex;
    align-items:center;
    gap:3px;
    min-height:var(--tap);
    padding-left:6px;
    color:var(--ink);
    font-size:12px;
    line-height:1.35;
    white-space:nowrap;
  }
  .entry-side .icon{width:14px;height:14px;color:var(--red)}
  .entry-wrap{border-bottom:1px solid var(--line-soft)}
  .entry-wrap .entry{border-bottom:0}
  .entry-sub{
    display:flex;
    align-items:center;
    width:100%;
    min-height:var(--tap);
    padding:0 0 10px 40px;
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
    text-align:left;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .entry-sub:active{color:var(--ink)}
  .home-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:22px;
    padding:12px 0 24px;
    border-top:1px solid var(--line-soft);
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    letter-spacing:.04em;
  }
  .home-foot b{font-weight:600;color:var(--ink-2)}

  /* ---------- page head ---------- */
  .page-head{
    padding:22px 0 16px;
    border-bottom:1px solid var(--ink);
  }
  .page-head .eyebrow{color:var(--red)}
  .page-head h1{
    margin-top:10px;
    font-size:clamp(32px,9vw,40px);
    line-height:1.06;
    letter-spacing:-.055em;
    font-weight:700;
    text-wrap:balance;
  }
  .page-head p{
    margin-top:8px;
    max-width:34em;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    text-wrap:pretty;
  }
  .page-head p b{color:var(--ink);font-weight:700}

  /* ---------- chapters ---------- */
  .subject-block{margin-top:24px}
  .subject-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    padding-top:10px;
    border-top:2px solid var(--ink);
  }
  .subject-head h2{
    font-size:29px;
    line-height:1.1;
    letter-spacing:-.045em;
    font-weight:700;
  }
  .subject-head span{
    color:var(--muted);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.4;
    text-align:right;
    white-space:nowrap;
  }
  .chapter-list{border-top:1px solid var(--line-soft);margin-top:10px}
  .chapter-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) 18px;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:68px;
    padding:12px 0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
  }
  .chapter-row:active{background:rgba(19,18,16,.035)}
  .chapter-no{
    align-self:start;
    padding-top:3px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
  }
  .chapter-row--learned .chapter-no{color:var(--red)}
  .chapter-main{min-width:0;display:block}
  .chapter-title{
    display:flex;
    align-items:baseline;
    gap:7px;
    flex-wrap:wrap;
    font-size:19px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-.025em;
  }
  .chapter-title em{
    color:var(--muted);
    font-style:normal;
    font-family:var(--mono);
    font-size:10px;
    font-weight:400;
    letter-spacing:.02em;
  }
  .chapter-meta{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  }
  .chapter-meta b{color:var(--ink-2);font-weight:600}
  .chapter-bar{
    display:block;
    height:3px;
    margin-top:7px;
    background:var(--paper-2);
    overflow:hidden;
  }
  .chapter-bar i{
    display:block;
    height:100%;
    width:0;
    background:var(--red);
    transition:width .3s ease;
  }
  .chapter-go{
    color:var(--line-soft);
    display:grid;
    place-items:center;
    width:18px;height:44px;
  }
  .chapter-row .icon{width:15px;height:15px}
  .chapter-row--locked{
    opacity:.56;
    cursor:not-allowed;
  }
  .chapter-row--locked .chapter-go{color:var(--muted)}
  .chapter-row--locked .chapter-title{font-weight:600}
  .locked-details{margin-top:16px;border-top:1px solid var(--line-soft)}
  .locked-details summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:var(--tap);
    padding:10px 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    cursor:pointer;
    list-style:none;
  }
  .locked-details summary::-webkit-details-marker{display:none}
  .locked-details summary::after{
    content:"＋";
    font-family:var(--mono);
    color:var(--red);
    font-size:15px;
  }
  .locked-details[open] summary::after{content:"－"}
  .locked-list{border-top:1px solid var(--line-soft)}
  .locked-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink);
    text-align:left;
    opacity:.66;
  }
  .locked-row:active{background:var(--paper-2)}
  .locked-row .chapter-no{padding-top:0;font-size:11px}
  .locked-row .locked-title{display:block;min-width:0;font-size:14px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
  .locked-row .locked-count{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}
  .locked-row .locked-count .icon{width:10px;height:10px}
  .chapter-note{
    margin:18px 0 24px;
    padding:12px 14px;
    background:var(--paper-3);
    border-left:3px solid var(--line-soft);
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  .chapter-note b{color:var(--ink-2)}

  /* ---------- quiz ---------- */
  body.has-bar{padding-bottom:calc(78px + var(--safe-b))}
  .quiz-head{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(242,239,231,.97);
    border-bottom:1px solid var(--line-soft);
    padding-top:var(--safe-t);
    backdrop-filter:blur(8px);
  }
  .quiz-head-in{
    display:grid;
    grid-template-columns:44px minmax(0,1fr) 44px;
    align-items:center;
    gap:6px;
    min-height:58px;
  }
  .icon-btn{
    display:grid;
    place-items:center;
    width:var(--tap);
    height:var(--tap);
    min-width:var(--tap);
    min-height:var(--tap);
    color:var(--ink);
    transition:background .16s ease;
  }
  .icon-btn:active{background:var(--paper-2)}
  .icon-btn .icon{width:21px;height:21px}
  .quiz-head-title{min-width:0;text-align:center}
  .quiz-head-title b{
    display:block;
    font-size:14px;
    line-height:1.35;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .quiz-head-title span{
    display:block;
    margin-top:1px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.35;
    letter-spacing:.04em;
  }
  .progress-track{
    height:3px;
    background:var(--paper-2);
    overflow:hidden;
  }
  .progress-track i{
    display:block;
    height:100%;
    width:0;
    background:var(--red);
    transition:width .28s ease;
  }
  .quiz-wrap{
    padding:16px 0 26px;
  }
  .q-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-height:28px;
    padding-bottom:11px;
    border-bottom:1px solid var(--line-soft);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:2px 7px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:11px;
    line-height:1.4;
    font-weight:600;
    white-space:nowrap;
  }
  .chip--red{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .chip--ok{
    border-color:var(--ok);
    background:var(--ok-bg);
    color:var(--ok-deep);
  }
  .chip--plain{border-color:var(--ink);color:var(--ink)}
  .q-meta .q-subject{
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .q-meta .q-num{
    margin-left:auto;
    color:var(--muted);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.5;
    white-space:nowrap;
  }
  .q-stem{
    margin-top:14px;
    font-size:clamp(19px,5.1vw,22px);
    line-height:1.78;
    font-weight:500;
    letter-spacing:.005em;
    text-wrap:pretty;
    overflow-wrap:anywhere;
  }
  .q-stem strong{font-weight:800;color:var(--ink)}
  .blank{
    display:inline-block;
    width:2.5em;
    height:1.05em;
    margin:0 .12em;
    border-bottom:2px solid var(--red);
    vertical-align:-.08em;
  }
  .q-note{
    margin-top:10px;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
    letter-spacing:.01em;
  }

  /* ---------- options ---------- */
  .options{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .option{
    display:flex;
    align-items:flex-start;
    gap:11px;
    width:100%;
    min-height:52px;
    padding:12px 12px;
    border:1px solid var(--line-soft);
    background:var(--paper-3);
    color:var(--ink);
    text-align:left;
    transition:border-color .14s ease,background .14s ease,color .14s ease;
  }
  .option:active{background:var(--paper-2)}
  .option-key{
    display:grid;
    place-items:center;
    width:32px;height:32px;
    flex:0 0 32px;
    border:1px solid var(--line-soft);
    border-radius:50%;
    background:transparent;
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:13px;
    line-height:1;
    font-weight:700;
    transition:all .14s ease;
  }
  .option-text{
    flex:1 1 auto;
    min-width:0;
    padding-top:3px;
    font-size:15px;
    line-height:1.62;
    overflow-wrap:anywhere;
  }
  .option-text strong{font-weight:800}
  .option.is-selected{
    border-color:var(--red);
    background:var(--red-soft);
  }
  .option.is-selected .option-key{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .option.is-correct{
    border-color:var(--ok);
    background:var(--ok-bg);
  }
  .option.is-correct .option-key{
    border-color:var(--ok);
    background:var(--ok);
    color:var(--white);
  }
  .option.is-wrong{
    border-color:var(--red);
    background:var(--red-soft);
  }
  .option.is-wrong .option-key{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .option.is-dim{opacity:.58}
  .option[aria-disabled="true"]{cursor:default}
  .option-flag{
    align-self:center;
    margin-left:2px;
    color:var(--ok-deep);
    font-family:var(--mono);
    font-size:9px;
    line-height:1.3;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .option.is-wrong .option-flag{color:var(--red-deep)}

  /* ---------- recall ---------- */
  .recall{margin-top:16px}
  .recall label{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .recall label span{color:var(--line-soft);font-family:var(--mono);font-size:10px}
  .recall textarea{
    display:block;
    width:100%;
    min-height:86px;
    padding:11px 12px;
    border:1px solid var(--line-soft);
    border-radius:0;
    background:var(--paper-3);
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    resize:vertical;
    -webkit-appearance:none;
  }
  .recall textarea:focus{border-color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px var(--ink)}
  .recall textarea[readonly]{background:var(--paper-2);color:var(--ink-2)}
  .recall textarea::placeholder{color:#8b8578}
  .recall-hint{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
    line-height:1.6;
  }
  .recall-hint b{color:var(--ink-2);font-weight:600}

  /* ---------- result ---------- */
  .result{
    margin-top:18px;
    border:1px solid var(--line-soft);
    border-left:5px solid var(--ink);
    background:var(--paper-3);
    animation:reveal .3s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes reveal{from{opacity:.01;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .result--ok{border-left-color:var(--ok);background:var(--ok-bg)}
  .result--bad{border-left-color:var(--red);background:var(--red-soft)}
  .result--warn{border-left-color:var(--warn);background:var(--warn-bg)}
  .result--neutral{border-left-color:var(--ink);background:var(--paper-3)}
  .result-top{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    border-bottom:1px solid rgba(19,18,16,.18);
  }
  .result-mark{
    display:grid;
    place-items:center;
    width:34px;height:34px;
    border:1px solid currentColor;
    color:var(--ink);
    font-family:var(--mono);
    font-size:17px;
    line-height:1;
    font-weight:700;
  }
  .result--ok .result-mark{color:var(--ok-deep)}
  .result--bad .result-mark{color:var(--red-deep)}
  .result--warn .result-mark{color:var(--warn)}
  .result-title{min-width:0}
  .result-title b{
    display:block;
    font-size:16px;
    line-height:1.35;
    font-weight:700;
  }
  .result-title span{
    display:block;
    margin-top:2px;
    color:var(--ink-2);
    font-size:11px;
    line-height:1.5;
  }
  .result-score{
    align-self:start;
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.45;
    text-align:right;
    white-space:nowrap;
  }
  .result-body{padding:13px 13px 14px}
  .block-kicker{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--red);
    font-size:10px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.12em;
  }
  .block-kicker::before{
    content:"";
    width:6px;height:6px;
    background:var(--red);
  }
  .ans-block{margin-top:2px}
  .ans-choice{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:7px;
    font-size:15px;
    line-height:1.7;
    overflow-wrap:anywhere;
  }
  .ans-choice .mono{
    flex:0 0 auto;
    padding:1px 5px;
    border:1px solid var(--ok);
    color:var(--ok-deep);
    font-size:11px;
    line-height:1.5;
    font-weight:700;
  }
  .ans-tokens{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .ans-tokens li{
    display:grid;
    grid-template-columns:22px minmax(0,1fr);
    gap:8px;
    align-items:start;
    font-size:15px;
    line-height:1.68;
  }
  .ans-tokens li > .mono{
    padding-top:1px;
    color:var(--red);
    font-size:10px;
    line-height:1.9;
    font-weight:700;
  }
  .ans-text{
    margin-top:7px;
    font-size:15px;
    line-height:1.78;
    overflow-wrap:anywhere;
  }
  .ans-text strong{font-weight:800}
  .analysis{
    margin-top:13px;
    padding-top:11px;
    border-top:1px dashed var(--line-soft);
  }
  .analysis p{
    margin-top:6px;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.72;
    overflow-wrap:anywhere;
  }
  .analysis--brief p{color:var(--muted);font-size:12px}
  .locate{
    display:grid;
    grid-template-columns:9px minmax(0,1fr);
    gap:9px;
    margin-top:13px;
    padding-top:11px;
    border-top:1px solid var(--line-soft);
  }
  .locate-mark{
    width:9px;height:9px;
    margin-top:4px;
    background:var(--red);
  }
  .locate-body{min-width:0}
  .locate-k{
    color:var(--red);
    font-size:10px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.1em;
  }
  .locate-body p{
    margin-top:3px;
    font-size:13px;
    line-height:1.6;
    overflow-wrap:anywhere;
  }
  .locate-body p.mono{
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    letter-spacing:.03em;
  }
  .link-fuzzy{
    display:inline-flex;
    align-items:center;
    min-height:var(--tap);
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    text-decoration:underline;
    text-underline-offset:4px;
  }
  .link-fuzzy:active{color:var(--ink)}
  .res-note{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line-soft);
    color:var(--muted);
    font-size:11px;
    line-height:1.65;
  }

  /* ---------- quiz bar ---------- */
  .quiz-bar{
    position:fixed;
    left:50%;
    bottom:0;
    z-index:50;
    transform:translateX(-50%);
    width:min(100%,var(--max));
    display:flex;
    align-items:stretch;
    gap:8px;
    padding:9px max(var(--gutter),var(--safe-l)) calc(9px + var(--safe-b)) max(var(--gutter),var(--safe-r));
    background:rgba(242,239,231,.97);
    border-top:1px solid var(--ink);
    backdrop-filter:blur(10px);
  }
  .bar-prev{
    flex:0 0 88px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:8px 8px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.3;
    font-weight:600;
  }
  .bar-prev:disabled{opacity:.38;cursor:not-allowed}
  .bar-primary{
    flex:1 1 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:50px;
    padding:9px 12px;
    border:1px solid var(--red);
    background:var(--red);
    color:var(--white);
    font-size:16px;
    line-height:1.3;
    font-weight:700;
    transition:background .16s ease,border-color .16s ease;
  }
  .bar-primary::after{
    content:"→";
    font-family:var(--mono);
    font-size:16px;
    line-height:1;
  }
  .bar-primary:active{background:var(--red-deep);border-color:var(--red-deep)}
  .bar-primary:disabled{opacity:.42;cursor:not-allowed}
  .bar-primary--ink{background:var(--ink);border-color:var(--ink)}
  .bar-primary--ink:active{background:var(--dark-2)}
  .bar-grade{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    min-height:52px;
    padding:7px 8px;
    font-size:15px;
    line-height:1.25;
    font-weight:700;
  }
  .bar-grade span{
    font-family:var(--mono);
    font-size:9px;
    line-height:1.3;
    font-weight:400;
    letter-spacing:.04em;
    opacity:.8;
  }
  .bar-grade--bad{
    border:1px solid var(--red);
    background:var(--paper);
    color:var(--red-deep);
  }
  .bar-grade--bad:active{background:var(--red-soft)}
  .bar-grade--ok{
    border:1px solid var(--ok);
    background:var(--ok);
    color:var(--white);
  }
  .bar-grade--ok:active{background:var(--ok-deep)}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;
    left:50%;
    bottom:0;
    z-index:55;
    transform:translateX(-50%);
    width:min(100%,var(--max));
    background:rgba(242,239,231,.98);
    border-top:1px solid var(--ink);
    padding-bottom:var(--safe-b);
    backdrop-filter:blur(10px);
  }
  .tabbar-in{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .tab{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-height:58px;
    padding:7px 2px 6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.2;
    letter-spacing:.02em;
    text-align:center;
  }
  .tab .icon{width:21px;height:21px}
  .tab.is-active{color:var(--ink);font-weight:700}
  .tab.is-active .icon{color:var(--red)}
  .tab.is-active::before{
    content:"";
    position:absolute;
    top:0;left:24%;
    width:52%;height:2px;
    background:var(--red);
  }
  .tab:active{background:var(--paper-2)}
  body.has-tabbar{padding-bottom:calc(60px + var(--safe-b))}

  /* ---------- wrong book ---------- */
  .wrong-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-top:10px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-soft);
  }
  .wrong-head h2{
    font-size:25px;
    line-height:1.2;
    letter-spacing:-.04em;
    font-weight:700;
  }
  .wrong-head h2 em{
    color:var(--red);
    font-style:normal;
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0;
  }
  .wrong-head p{color:var(--muted);font-size:11px;line-height:1.5}
  .filters{
    display:flex;
    gap:6px;
    margin:12px 0 0;
    padding-bottom:2px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .filter{
    flex:0 0 auto;
    min-height:var(--tap);
    padding:8px 11px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:12px;
    line-height:1.3;
    font-weight:600;
    white-space:nowrap;
  }
  .filter.is-active{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }
  .wrong-list{margin-top:4px}
  .wrong-card{
    padding:14px 0 12px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .wrong-card + .wrong-card{border-top:0}
  .wrong-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
  }
  .wrong-meta .mono{font-size:9px}
  .wrong-stem{
    margin-top:7px;
    font-size:16px;
    line-height:1.65;
    font-weight:500;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .wrong-stem strong{font-weight:800}
  .wrong-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:9px;
  }
  .wrong-foot .wrong-stat{
    color:var(--muted);
    font-family:var(--mono);
    font-size:9px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .wrong-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:var(--tap);
    padding:8px 11px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:12px;
    line-height:1.3;
    font-weight:600;
    white-space:nowrap;
  }
  .mini-btn:active{background:var(--paper-2)}
  .mini-btn--red{border-color:var(--red);background:var(--red);color:var(--white)}
  .mini-btn--red:active{background:var(--red-deep)}
  .mini-btn--ghost{color:var(--muted)}
  .empty{
    margin:28px 0 10px;
    padding:22px 18px;
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
    background:var(--paper-3);
  }
  .empty .empty-mark{
    display:block;
    color:var(--red);
    font-family:var(--mono);
    font-size:28px;
    line-height:1;
    font-weight:700;
  }
  .empty h3{
    margin-top:9px;
    font-size:22px;
    line-height:1.3;
    letter-spacing:-.035em;
    font-weight:700;
  }
  .empty p{
    margin-top:6px;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .empty .hero-cta{margin-top:14px;min-height:50px;font-size:15px}

  /* ---------- progress ---------- */
  .acc-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    margin-top:14px;
    padding-bottom:15px;
    border-bottom:1px solid var(--ink);
  }
  .acc-num{
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(66px,18vw,88px);
    font-weight:700;
    line-height:.8;
    letter-spacing:-.075em;
  }
  .acc-num small{
    font-family:var(--mono);
    font-size:18px;
    font-weight:400;
    letter-spacing:0;
  }
  .acc-empty{
    color:var(--muted);
    font-family:var(--sans);
    font-size:30px;
    line-height:1.2;
    letter-spacing:-.03em;
    font-weight:700;
  }
  .acc-copy{text-align:right;padding-bottom:3px}
  .acc-copy b{display:block;font-size:13px;line-height:1.4;font-weight:700}
  .acc-copy span{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.5}
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--ink);
  }
  .stat-cell{
    padding:11px 10px 11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .stat-cell:nth-child(odd){border-right:1px solid var(--line-soft);padding-right:10px}
  .stat-cell:nth-child(even){padding-left:12px}
  .stat-cell:nth-last-child(-n+2){border-bottom:0}
  .stat-cell span{display:block;color:var(--muted);font-size:10px;line-height:1.4;letter-spacing:.04em}
  .stat-cell b{display:block;margin-top:2px;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.03em}
  .stat-cell b em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0}
  .panel{
    margin-top:20px;
    padding:14px;
    background:var(--paper-3);
    border:1px solid var(--line-soft);
  }
  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding-bottom:9px;
    border-bottom:1px solid var(--line-soft);
  }
  .panel-head h2{font-size:15px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
  .panel-head span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4;text-align:right}
  .week{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:5px;
    align-items:end;
    height:104px;
    padding-top:12px;
  }
  .day-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
  .day-bar{
    width:100%;
    max-width:26px;
    height:60px;
    background:transparent;
    border-bottom:1px solid var(--line-soft);
    position:relative;
    overflow:hidden;
  }
  .day-bar i{
    position:absolute;
    left:0;right:0;bottom:0;
    display:block;
    background:var(--red);
    height:0;
  }
  .day-col.is-today .day-bar{outline:1px solid var(--ink);outline-offset:1px}
  .day-count{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--muted)}
  .day-label{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--muted);white-space:nowrap}
  .day-col.is-today .day-label{color:var(--red);font-weight:700}
  .subj-row{
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .subj-row:last-child{border-bottom:0;padding-bottom:2px}
  .subj-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .subj-line b{font-size:14px;line-height:1.4;font-weight:700}
  .subj-line span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4;text-align:right}
  .subj-bar{height:3px;margin-top:6px;background:var(--paper-2);overflow:hidden}
  .subj-bar i{display:block;height:100%;background:var(--red)}
  .chapter-stat{
    display:grid;
    grid-template-columns:minmax(0,1fr) 74px;
    gap:10px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .chapter-stat:last-child{border-bottom:0;padding-bottom:0}
  .chapter-stat .cs-t{min-width:0}
  .chapter-stat b{display:block;font-size:12px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
  .chapter-stat span{display:block;color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.45}
  .chapter-stat .subj-bar{margin-top:4px}
  .data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .data-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:8px 8px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-size:13px;
    line-height:1.3;
    font-weight:700;
  }
  .data-btn--fill{background:var(--ink);color:var(--paper)}
  .data-btn:active{background:var(--paper-2)}
  .data-btn--fill:active{background:var(--dark-2)}
  .fine{
    margin-top:10px;
    color:var(--muted);
    font-size:10px;
    line-height:1.7;
  }
  .fine b{color:var(--ink-2);font-weight:600}
  .storage-ok{color:var(--ok-deep)}
  .storage-bad{color:var(--red)}
  .reset-zone{
    margin:18px 0 24px;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
  }
  .reset-btn{
    display:inline-flex;
    align-items:center;
    min-height:var(--tap);
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .reset-btn.is-confirm{color:var(--red);font-weight:700}

  /* ---------- done ---------- */
  .done{
    padding:34px 0 30px;
    text-align:center;
  }
  .done-stamp{
    display:inline-block;
    padding:6px 12px;
    border:2px solid var(--red);
    color:var(--red);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.2em;
    transform:rotate(-3deg);
  }
  .done-num{
    margin-top:16px;
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(84px,25vw,112px);
    font-weight:700;
    line-height:.8;
    letter-spacing:-.08em;
  }
  .done-unit{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
  .done h1{
    margin-top:12px;
    font-size:clamp(30px,8vw,38px);
    line-height:1.12;
    letter-spacing:-.05em;
    font-weight:700;
    text-wrap:balance;
  }
  .done p{
    margin-top:8px;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .done-stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    margin-top:18px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .done-stat{padding:10px 6px;border-right:1px solid var(--line-soft)}
  .done-stat:last-child{border-right:0}
  .done-stat b{display:block;font-size:22px;line-height:1.25;font-weight:700}
  .done-stat span{display:block;color:var(--muted);font-size:10px;line-height:1.4}
  .done-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .done-actions .hero-cta{margin-top:0}
  .done-ghost{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:9px 12px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:14px;
    line-height:1.3;
    font-weight:600;
  }
  .done-ghost:active{background:var(--paper-2)}

  /* ---------- sheet ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:90;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(19,18,16,.46);
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{from{opacity:.01}to{opacity:1}}
  .sheet{
    width:min(100%,var(--max));
    max-height:90dvh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--paper);
    border-top:2px solid var(--ink);
    padding:0 max(var(--gutter),var(--safe-l)) calc(18px + var(--safe-b)) max(var(--gutter),var(--safe-r));
    animation:sheetUp .24s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.01}to{transform:translateY(0);opacity:1}}
  .sheet-head{
    position:sticky;
    top:0;
    z-index:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:14px 0 11px;
    background:var(--paper);
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-head .eyebrow{font-size:10px}
  .sheet-head h2{
    margin-top:4px;
    font-size:25px;
    line-height:1.12;
    letter-spacing:-.045em;
    font-weight:700;
  }
  .sheet-close{
    display:grid;
    place-items:center;
    width:var(--tap);
    height:var(--tap);
    margin-top:-6px;
    margin-right:-8px;
    color:var(--ink);
  }
  .sheet-close .icon{width:20px;height:20px}
  .sheet-lead{
    margin-top:11px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(44px,1fr));
    gap:6px;
    margin-top:13px;
  }
  .card-cell{
    display:grid;
    place-items:center;
    min-height:44px;
    aspect-ratio:1;
    border:1px solid var(--line-soft);
    background:var(--paper-3);
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:11px;
    line-height:1;
  }
  .card-cell.is-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-deep)}
  .card-cell.is-bad{border-color:var(--red);background:var(--red-soft);color:var(--red-deep)}
  .card-cell.is-open{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .card-cell.is-current{outline:2px solid var(--red);outline-offset:1px;background:var(--ink);color:var(--paper)}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
  }
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{width:9px;height:9px;display:inline-block;border:1px solid var(--line-soft)}
  .legend .l-ok{background:var(--ok-bg);border-color:var(--ok)}
  .legend .l-bad{background:var(--red-soft);border-color:var(--red)}
  .legend .l-cur{background:var(--ink);border-color:var(--ink)}
  .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .sheet-actions .data-btn{min-height:48px}
  .schedule-group{margin-top:15px}
  .schedule-day{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .schedule-day b{font-size:13px;line-height:1.4;font-weight:700}
  .schedule-day span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4}
  .schedule-item{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:48px;
    padding:7px 0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
  }
  .schedule-item:active{background:var(--paper-2)}
  .schedule-item .mono{color:var(--red);font-size:9px;line-height:1.4}
  .schedule-item .s-stem{
    font-size:12px;
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .schedule-item .s-meta{color:var(--muted);font-family:var(--mono);font-size:8px;line-height:1.4;white-space:nowrap;text-align:right}
  .json-box{
    display:block;
    width:100%;
    min-height:170px;
    margin-top:11px;
    padding:10px 11px;
    border:1px solid var(--ink);
    border-radius:0;
    background:var(--paper-3);
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.55;
    resize:vertical;
    -webkit-appearance:none;
  }
  .json-box:focus{outline:2px solid var(--red);outline-offset:1px}
  .import-opts{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-top:10px;
  }
  .import-opts label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:var(--tap);
    color:var(--ink-2);
    font-size:12px;
    line-height:1.4;
    cursor:pointer;
  }
  .import-opts input{
    width:18px;height:18px;
    accent-color:var(--red);
    margin:0;
  }
  .import-error{
    margin-top:8px;
    padding:8px 10px;
    border-left:3px solid var(--red);
    background:var(--red-soft);
    color:var(--red-deep);
    font-size:12px;
    line-height:1.6;
  }
  .file-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
  }
  .file-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:var(--tap);
    padding:8px 10px;
    border:1px dashed var(--line-soft);
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
    cursor:pointer;
  }
  .file-btn:active{background:var(--paper-2)}
  .file-line .fine{margin-top:0;text-align:right}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;
    left:50%;
    bottom:calc(76px + var(--safe-b));
    z-index:120;
    transform:translate(-50%,10px);
    max-width:calc(100% - 32px);
    padding:10px 14px;
    background:var(--ink);
    color:var(--paper);
    font-size:12px;
    line-height:1.55;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
  }
  #toast.is-show{opacity:1;transform:translate(-50%,0)}
  body.has-bar #toast{bottom:calc(86px + var(--safe-b))}

  /* ---------- desktop ---------- */
  @media (min-width:768px){
    body{
      background:var(--paper-2);
      font-size:17px;
    }
    body::before{opacity:.3}
    .frame{
      max-width:var(--max);
      margin-inline:auto;
      background:var(--paper);
      border-left:1px solid var(--line-soft);
      border-right:1px solid var(--line-soft);
      box-shadow:0 0 0 1px rgba(19,18,16,.04);
    }
    .masthead-in{min-height:66px}
    .hero{padding-top:22px;padding-bottom:26px}
    .count-num{font-size:128px}
    .hero-title{font-size:46px}
    .hero-lead{font-size:16px}
    .quiz-head{position:sticky}
    .tabbar{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
    .quiz-bar{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
    #toast{max-width:420px}
    .option-text{font-size:16px}
    .q-stem{font-size:22px}
    .sheet{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  }

  @media (max-width:380px){
    :root{--gutter:15px}
    .brand-t small{display:none}
    .count-num{font-size:86px}
    .count-unit b{font-size:19px}
    .hero-title{font-size:33px}
    .hero-lead{font-size:14px}
    .hero-fact span{font-size:10px}
    .hero-fact b{font-size:15px}
    .advice-title{font-size:21px}
    .entry{grid-template-columns:26px minmax(0,1fr) auto;gap:8px}
    .entry-title{font-size:20px}
    .entry-side{font-size:11px}
    .subject-head h2{font-size:26px}
    .chapter-title{font-size:18px}
    .wrong-foot{align-items:flex-start;flex-direction:column;gap:6px}
    .wrong-actions{width:100%;justify-content:stretch}
    .wrong-actions .mini-btn{flex:1 1 0}
    .q-meta .q-num{display:none}
    .result-top{grid-template-columns:34px minmax(0,1fr);gap:8px}
    .result-score{grid-column:2;text-align:left;margin-top:-3px}
    .quiz-bar{gap:6px}
    .bar-prev{flex-basis:78px}
    .done h1{font-size:29px}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms!important;
      animation-iteration-count:1!important;
      transition-duration:.001ms!important;
    }
  }

/* ============ r2 追加组件（复用 r1 的纸感变量与版式） ============ */
.kw{
  background:var(--red-soft);
  box-shadow:inset 0 -2px 0 rgba(201,42,18,.55);
  color:var(--red-deep);
  font-weight:700;
  padding:0 .08em;
}
.qblank{
  display:inline-block;
  min-width:2.6em;
  height:1.02em;
  margin:0 .14em;
  border-bottom:2px solid var(--red);
  vertical-align:-.1em;
}
.qblank--long{min-width:4.2em}
/* 滚动排期 stepper */
.roll{
  margin-top:12px;
  padding:12px 12px 11px;
  border:1px solid var(--red);
  background:var(--paper-3);
}
.roll-h{
  display:flex;
  align-items:baseline;
  gap:7px;
  color:var(--red);
  font-size:12px;
  line-height:1.45;
  font-weight:700;
}
.roll-h::before{content:"↻";font-family:var(--mono);font-size:13px}
.roll-steps{
  display:grid;
  grid-template-columns:1fr 34px 1fr 34px 1fr;
  align-items:center;
  margin-top:11px;
}
.roll-step{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
  text-align:center;
}
.roll-dot{
  display:grid;
  place-items:center;
  width:24px;height:24px;
  border:1px solid var(--line-soft);
  border-radius:50%;
  font-family:var(--mono);
  font-size:11px;
  line-height:1;
  color:var(--muted);
  background:var(--paper);
}
.roll-step.is-on{color:var(--red);font-weight:700}
.roll-step.is-on .roll-dot{border-color:var(--red);background:var(--red);color:var(--white)}
.roll-step.is-done .roll-dot{border-color:var(--red);color:var(--red)}
.roll-line{height:1px;background:var(--line-soft)}
.roll-p{
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  text-align:center;
}
/* 解析分层 */
.jx{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
.jx-layer{margin-top:10px}
.jx-layer:first-child{margin-top:8px}
.jx-k{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--red);
  font-size:10px;
  line-height:1.4;
  font-weight:700;
  letter-spacing:.1em;
}
.jx-k::before{content:"";width:6px;height:6px;background:var(--red)}
.jx-p{
  margin-top:4px;
  color:var(--ink-2);
  font-size:13px;
  line-height:1.75;
  overflow-wrap:anywhere;
  text-wrap:pretty;
}
.jx-p b{color:var(--ink);font-weight:700}
/* 关键词命中 */
.hits{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}
.hit{
  display:inline-flex;
  align-items:center;
  gap:4px;
  max-width:100%;
  padding:2px 6px;
  border:1px solid var(--line-soft);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.hit.is-on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-deep)}
.hit::before{content:"○";font-family:var(--mono);font-size:9px}
.hit.is-on::before{content:"●"}
/* 错题本：你的答案 / 正确答案 */
.qa{
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  margin-top:7px;
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.6;
}
.qa b{color:var(--ink-2);font-weight:700}
.qa .qa-bad{color:var(--red-deep)}
.nogood{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  width:100%;
  margin-top:10px;
  border:1px dashed var(--warn);
  background:var(--warn-bg);
  color:var(--warn);
  font-size:12px;
  line-height:1.4;
  font-weight:600;
}
.nogood:active{background:#efe3c9}
/* 口径 / 差异 */
.scope{
  margin-top:16px;
  padding:12px 13px;
  border:1px solid var(--line-soft);
  border-left:3px solid var(--red);
  background:var(--paper-3);
}
.scope-h{
  font-size:11px;
  line-height:1.4;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--red);
}
.scope p{margin-top:5px;color:var(--ink-2);font-size:12px;line-height:1.7}
.scope p b{font-weight:700}
.scope-link{
  display:inline-flex;
  align-items:center;
  min-height:44px;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-decoration:underline;
  text-underline-offset:3px;
}
.rows{margin-top:10px;border-top:1px solid var(--line-soft)}
.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:baseline;
  padding:7px 0;
  border-bottom:1px solid var(--line-soft);
  font-size:12px;
  line-height:1.55;
}
.row span{min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.row b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
.row b.is-red{color:var(--red)}
.row-h{
  padding:9px 0 6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
  letter-spacing:.08em;
  border-bottom:1px solid var(--ink);
}
/* 章节行状态 */
.chip-lock{
  display:inline-flex;
  align-items:center;
  gap:3px;
  color:var(--muted);
  font-size:10px;
  font-family:var(--mono);
}
.mini-tag{
  display:inline-block;
  padding:1px 5px;
  border:1px solid var(--line-soft);
  color:var(--muted);
  font-size:10px;
  line-height:1.45;
  white-space:nowrap;
}
.mini-tag.is-red{border-color:var(--red);color:var(--red)}
.mini-tag.is-ok{border-color:var(--ok);color:var(--ok-deep)}
/* 答题页：题面旁注 */
.q-tip{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
  line-height:1.65;
}
.q-tip b{color:var(--ink-2)}
/* 已完成/未完成标记 */
.done-flag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--ok-deep);
  font-size:11px;
  font-weight:700;
}
@media (max-width:380px){
  .jx-p{font-size:12.5px}
  .roll-steps{grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1fr}
  .roll-step{font-size:9px}
}

.sheet-close{width:46px;height:46px}

/* ============ r3：判定可见性 / 幂等 / 二次回忆 / 抽查 ============ */
/* 1) 判定标题不被吸顶答题头盖住：scroll-margin 兜底 + JS 动态偏移 */
.result{scroll-margin-top:74px}
.quiz-head{scroll-margin-bottom:0}
/* 2) 题面任务提示（短标题的填空：卡标题本身不是问句，加一行说明） */
.q-kicker{
  display:block;
  margin:0 0 6px;
  color:var(--red);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.4;
  letter-spacing:.08em;
  text-transform:none;
}
/* 3) 同卡二次回忆 chip */
.chip--alt{
  border-color:var(--red);
  color:var(--red);
  background:var(--red-soft);
}
/* 4) 当天已判过的说明条 */
.lock-note{
  margin:10px 0 12px;
  padding:8px 10px;
  border:1px solid var(--line-soft);
  border-left:3px solid var(--ink);
  background:var(--paper-2);
  color:var(--ink-2);
  font-size:11px;
  line-height:1.65;
}
/* 5) 四级滚动 stepper（3 → 7 → 15 → 30） */
.roll-steps{
  grid-template-columns:1fr 16px 1fr 16px 1fr 16px 1fr;
  align-items:start;
}
.roll-step{padding:0 1px}
.roll-line{margin-top:12px}
/* 6) 题卡：见过但今天没判 */
.card-cell.is-seen{border-color:var(--line-soft);background:var(--paper-2);color:var(--muted)}
@media (max-width:340px){
  .roll-step{font-size:8.5px}
  .roll-dot{width:21px;height:21px;font-size:10px}
}

/* ================= v5 基础组件（v5_r2 复用） ================= */
.axis-line{
  display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:10px;
  padding:9px 12px;border:1px solid var(--line-soft);background:var(--paper-3);
  color:var(--ink-2);font-family:var(--mono);font-size:11.5px;line-height:1.5;letter-spacing:.04em;
  text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none;
}
.axis-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.axis-opt{
  display:flex;align-items:center;justify-content:center;
  min-height:46px;height:100%;padding:8px 6px;border:1px solid var(--line-soft);background:var(--paper-3);
  font-family:var(--mono);font-size:12px;line-height:1.4;color:var(--ink-2);cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.axis-opt.is-on{border-color:var(--ink);background:var(--ink);color:var(--white)}
.fold{margin-top:14px;border-top:1px solid var(--line-soft)}
.fold>summary{display:flex;align-items:center;gap:8px;min-height:48px;padding:11px 0;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"+";margin-left:auto;color:var(--red);font-weight:700;font-size:15px}
.fold[open]>summary::after{content:"−"}
.fold-body{padding-bottom:4px}
.qblank--num{position:relative;min-width:3.2em;vertical-align:baseline}
.qblank--num::before{content:attr(data-n);position:absolute;top:-.58em;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;line-height:1;color:var(--red)}
.q-stem--blank{word-break:break-word;overflow-wrap:anywhere}
.term-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:100%}
.term-chip{padding:3px 7px;border:1px solid var(--line-soft);background:var(--paper-3);
  font-size:11.5px;line-height:1.5;color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.term-chip.is-used{border-color:var(--red);color:var(--red-deep);background:var(--red-soft)}
.sc-row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);
  font-size:13px;line-height:1.65;max-width:100%}
.sc-row>span{flex:1 1 auto;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.sc-row>b{flex:0 0 auto;font-family:var(--mono);font-size:12.5px;text-align:right}
.sc-pass{color:var(--ok)}
.sc-fail{color:var(--red)}
@media (max-width:360px){
  .qblank--num{min-width:2.8em}
  .sc-row{font-size:12.5px}
}

/* ================= v5_r2 追加 ================= */
.hero--home{
  min-height:calc(100vh - 62px);
  min-height:calc(100svh - 62px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-top:0;
  padding-bottom:0;
}
.hero--home .countline{margin-top:0}
.hero--home .hero-lead{margin-top:16px;max-width:26em}
.hero--home .hero-cta{margin-top:22px}
.home-more{
  border-top:1px solid var(--ink);
  padding-top:18px;
  padding-bottom:34px;
}
.home-more-head{
  display:flex;align-items:center;gap:8px;
  padding-bottom:8px;
  color:var(--muted);
  font-family:var(--mono);
  font-size:11px;
  line-height:1.5;
  letter-spacing:.08em;
}
.home-more-head i{margin-left:auto;font-style:normal;color:var(--red);font-size:15px}
.home-more .entries{margin-top:0}

.q-blank{
  margin:14px 0 0;
  padding:14px 14px 16px;
  border:1px solid var(--line-soft);
  background:var(--paper-3);
  font-size:16.5px;
  line-height:2.05;
  letter-spacing:.01em;
  overflow-wrap:anywhere;
  word-break:break-word;
  max-width:100%;

.q-blank .qblank{min-width:3.4em}
.q-tip{
  margin:10px 0 0;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.7;
}
.q-tip b{color:var(--ink)}

.blank-check{
  margin-top:10px;
  border-top:1px solid var(--line-soft);
}
.blank-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;
  align-items:baseline;
  gap:7px;
  padding:9px 0;
  border-bottom:1px solid var(--line-soft);

  line-height:1.55;

.blank-no{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.blank-mine,.blank-right{min-width:0;overflow-wrap:anywhere}
.blank-mine{color:var(--ink-2)}
.blank-right{color:var(--ink);font-weight:700}

.blank-row.is-on .blank-right{color:var(--ok-deep)}

.roll-steps--6{
  display:flex;
  flex-wrap:wrap;
  gap:5px 2px;
  justify-content:space-between;
  margin-top:11px;
}
.roll-steps--6 .roll-step{
  flex:1 1 44px;
  min-width:44px;
  font-size:9.5px;
}
.roll-steps--6 .roll-line{display:none}

.term-chip{max-width:100%;overflow-wrap:anywhere}
.sc-row>b{border-left:1px solid var(--line-soft);padding-left:8px;max-width:52%;overflow-wrap:anywhere}

@media (max-width:360px){
  .hero--home .count-num{font-size:92px}
  .hero--home .hero-lead{font-size:14px}
  .q-blank{font-size:15.5px;line-height:2}
  .blank-row{grid-template-columns:auto minmax(0,1fr) auto;font-size:12px}
  .blank-right{grid-column:2/3}
  .blank-flag{grid-row:1;grid-column:3/4}
}

/* ================= v5_r4 覆盖 ================= */
.hero--home{
  min-height:calc(100vh - 62px);
  min-height:calc(100svh - 62px);
}
.home-more{margin-top:38px}
.home-more-link{
  display:flex;align-items:center;gap:8px;width:100%;min-height:46px;
  padding:8px 0;border-bottom:1px solid var(--line-soft);
  color:var(--ink);font-size:13.5px;line-height:1.6;text-decoration:none;
  overflow-wrap:anywhere;
}
.home-more-link span{margin-left:auto;color:var(--red);font-family:var(--mono);font-size:14px}
.term-chip i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:4px}

.sc-row>span{min-width:0}

  .home-more{margin-top:32px}
  .home-more-link{font-size:12.5px}
  .sc-row>b{max-width:54%}
}

心","c":10,"t":"填空","card":241,"kd":"考点八 情绪调节","stem":"情境理论中两种应对方向分别适用于什么情境？","ans":"以问题为中心的应对：面对问题情境，通过努力解决问题来降低情绪紧张，适用于可控情境。以情绪为中心的应对：采用行为或认知调节策略降低情绪压力，适用于不可控情境。","kw":["以问题为中心的应对","通过努力解决问题来降低情绪紧张"],"kp":"px-10-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-4","s":"普心","c":10,"t":"填空","card":242,"kd":"考点八 情绪调节","stem":"格罗斯过程理论中的认知重评与表达抑制有什么区别？","ans":"认知重评发生在情绪反应之前，从认知上改变对情绪事件的理解从而改变情绪体验，是一种有益方式，不消耗过多认知资源。表达抑制发生在情绪反应之后，调动自我控制能力抑制情绪表达，需要耗费较多认知资源，可能产生消极影响。","kw":["认知重评发生在情绪反应之前","从认知上改变对情绪事件的理解从而改变情绪体验"],"kp":"px-10-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-5","s":"普心","c":10,"t":"填空","card":243,"kd":"考点八 情绪调节","stem":"情绪的ABC理论是什么？","ans":"情绪的ABC理论由艾利斯提出：A是事件的前因，C是事情的后果，二者之间的桥梁B是信念，是对情境的评价与解释；同一情境下不同人的信念不同，导致不同结果。艾利斯据此创立了合理情绪疗法。","kw":["是对情境的评价与解释","同一情境下不同人的信念不同"],"kp":"px-10-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-6","s":"普心","c":10,"t":"填空","card":244,"kd":"考点八 情绪调节","stem":"情绪调节的六种策略分别是什么？","ans":"第一种回避和接近（面临不利情绪时离开当前情境）；第二种控制和修正（更积极的策略，通过改变情境中不利的情绪事件来控制情绪）；第三种注意转换（包括分心策略，将注意集中在与情绪无关的方面；和专注策略，将注意长时间集中在情境的某个方面）；第四种认知重评（通过改变对情绪事件的理解和评价来调节情绪，二岁以后出现，是一种有益方式）；第五种表达抑制；第六种合理宣泄（承认不良情绪并适当表达出来，分直接表达和间接表达）。","kw":["第一种回避和接近（面临不利情绪时离开当前情境"],"kp":"px-10-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-7","s":"普心","c":10,"t":"填空","card":245,"kd":"考点七 情绪智力","stem":"情绪智力的定义是什么？","ans":"情绪智力是监控、识别自己和他人情绪、评估和调节情绪、利用情绪促进思维的能力。","kw":["识别自己和他人情绪","利用情绪促进思维的能力"],"kp":"px-10-7","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-10-8","s":"普心","c":10,"t":"填空","card":246,"kd":"考点七 情绪智力","stem":"萨洛维和梅耶的四因素模型包括哪四种能力（从低到高）？","ans":"第一个情绪知觉和评价表达能力（最基本）；第二个情绪对思维的促进能力；第三个理解分析情绪、运用情绪知识的能力；第四个情绪自我调节能力。","kw":["第一个情绪知觉和评价表达能力（最基本","第二个情绪对思维的促进能力"],"kp":"px-10-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-9","s":"普心","c":10,"t":"填空","card":247,"kd":"考点六 情绪理论","stem":"詹姆斯—兰格理论（情绪的外周理论）是什么？如何评价？","ans":"强调情绪是自主神经系统活动的产物。詹姆斯认为情绪是对身体变化的知觉，先有机体的生理变化然后才有情绪（悲伤由哭泣而起，愤怒由打斗而至）；兰格认为情绪是内脏活动的结果，与血管变化关联很大。评价：该理论是第一个关于情绪的完整心理学理论，揭示了情绪与机体变化的直接关系，但忽视了中枢神经系统的调节控制作用。","kw":["强调情绪是自主神经系统活动的产物"],"kp":"px-10-9","bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-10-10","s":"普心","c":10,"t":"填空","card":248,"kd":"考点六 情绪理论","stem":"坎农—巴德学说（情绪的丘脑理论）是什么？如何评价？","ans":"认为情绪中心位于丘脑，外界刺激引起神经冲动传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向中枢机制，有积极意义。","kw":["认为情绪中心位于丘脑","外界刺激引起神经冲动传至丘脑"],"kp":"px-10-10","noteCut":1,"bt":"b","bp":"ans","bq":"认为情绪中心位于丘脑，外界刺激引起______传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向______，有积极意义。","bl":["神经冲动","中枢机制"],"bpos":[17,95],"bsrc":"认为情绪中心位于丘脑，外界刺激引起神经冲动传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向中枢机制，有积极意义。","nq":2},{"id":"px-10-11","s":"普心","c":10,"t":"填空","card":249,"kd":"考点六 情绪理论","stem":"阿诺德的评定—兴奋说是什么？","ans":"强调对刺激情境的评价是情绪产生的直接原因，同一刺激由于评估不同会引起不同情绪反应；情绪产生的基本过程是刺激情境—评估—情绪。阿诺德认为情绪的产生是大脑皮层和皮下组织协同活动的结果：外界刺激传入大脑皮层得到评估形成态度，再传至丘脑交感神经引发生理反应，生理反馈回大脑皮层与认知评价结合转化为情绪体验。","kw":["强调对刺激情境的评价是情绪产生的直接原因"],"kp":"px-10-11","bt":"b","bp":"ans","bq":"强调对刺激情境的评价是情绪产生的直接原因，同一刺激由于评估不同会引起不同情绪反应；情绪产生的基本过程是刺激情境—评估—情绪。阿诺德认为情绪的产生是大脑皮层和皮下组织协同活动的结果：外界刺激传入大脑皮层得到评估形成态度，再传至______交感神经引发生理反应，生理反馈回大脑皮层与认知评价结合转化为情绪体验。","bl":["丘脑"],"bpos":[112],"bsrc":"强调对刺激情境的评价是情绪产生的直接原因，同一刺激由于评估不同会引起不同情绪反应；情绪产生的基本过程是刺激情境—评估—情绪。阿诺德认为情绪的产生是大脑皮层和皮下组织协同活动的结果：外界刺激传入大脑皮层得到评估形成态度，再传至丘脑交感神经引发生理反应，生理反馈回大脑皮层与认知评价结合转化为情绪体验。","nq":1},{"id":"px-10-12","s":"普心","c":10,"t":"填空","card":250,"kd":"考点六 情绪理论","stem":"拉扎勒斯的认知评价理论包括哪三个评价层次？","ans":"认为情绪是人与环境相互作用的产物。初评价：确认刺激与自身是否有利害关系；次评价：调节和控制自己的反应行为，其中经验起重要作用；再评价：对行为有效性的反馈性评价，若无效则进行调整。该理论既承认情绪的生物因素，也承认个体经验和社会文化的影响。","kw":["认为情绪是人与环境相互作用的产物"],"kp":"px-10-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-13","s":"普心","c":10,"t":"填空","card":251,"kd":"考点六 情绪理论","stem":"沙赫特和辛格的激活归因情绪理论是什么？经典实验是什么？","ans":"认为情绪是生理唤醒、认知评价和环境刺激三个因素相互作用的结果，认知因素起关键作用。经典实验是肾上腺素注射实验：正确告知组知道自己会出现心悸、手抖等症状，将生理唤醒归因于药物，因此在愉快和愤怒情境中都较冷静；错误告知组和未告知组找不到生理唤醒的原因，便根据环境线索将其归因为某种情绪，表现出相应情绪反应。","kw":["认为情绪是生理唤醒","认知评价和环境刺激三个因素相互作用的结果"],"kp":"px-10-13","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-14","s":"普心","c":10,"t":"填空","card":252,"kd":"考点六 情绪理论","stem":"伊扎德的动机—分化理论是什么？","ans":"认为情绪是人格系统的核心动力；假定人的情绪系统由十一种基本情绪组成，每种基本情绪体验都有独特性，具有适应功能。情绪包含神经生理、表情和情绪体验三个子系统，三者相互作用和联结。人格由平衡系统、内驱力系统、情绪系统、知觉系统、认知系统和动作系统六个子系统组成，其中情绪系统处于核心地位。评价：该理论从生物进化观点深化了对情绪性质和功能的认识，但过分强调先天属性。","kw":["认为情绪是人格系统的核心动力","假定人的情绪系统由十一种基本情绪组成"],"kp":"px-10-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-15","s":"普心","c":10,"t":"填空","card":253,"kd":"考点五 表情","stem":"什么是表情？分为哪三种？","ans":"表情是情绪变化时的外部表现模式，是进化的产物和适应的手段。分三种：面部表情（通过眼部和颜面肌肉变化表现，艾克曼的研究发现不同面部部位对不同情绪表达最重要）；姿态表情（包括身体表情和手势表情）；语调表情（通过声音高低和响度表达）。","kw":["表情是情绪变化时的外部表现模式"],"kp":"px-10-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-16","s":"普心","c":10,"t":"填空","card":254,"kd":"考点三 情绪的分类","stem":"情绪按生物进化角度如何分类？","ans":"基本情绪是先天的、不学而能的，如快乐、愤怒、恐惧、悲哀；复合情绪由两种以上基本情绪混合而成。","kw":["基本情绪是先天的","复合情绪由两种以上基本情绪混合而成"],"kp":"px-10-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-17","s":"普心","c":10,"t":"填空","card":255,"kd":"考点三 情绪的分类","stem":"情绪按与行为趋近程度如何分类？","ans":"消极情绪与回避行行为相伴随；积极情绪与趋近为相伴随。","kw":[" 积极情绪与趋近"],"kp":"px-10-17","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-18","s":"普心","c":10,"t":"填空","card":256,"kd":"考点三 情绪的分类","stem":"三种情绪状态分别是什么？","ans":"心境是平静的、弥漫的、持久的情绪状态，不是关于某一事物的特定体验，而是以同样态度对待一切事物。激情是强烈的、爆发性的、短暂的情绪状态，由对个人有重大意义的事件引起，往往出现意识狭窄现象，认识活动范围缩小、理智分析能力受抑制。应激是对意外环境刺激做出的适应性反应。","kw":["不是关于某一事物的特定体验","而是以同样态度对待一切事物"],"kp":"px-10-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-19","s":"普心","c":10,"t":"填空","card":257,"kd":"考点三 情绪的分类","stem":"汉斯·塞里的适应性综合征包括哪三个阶段？","ans":"警觉阶段（机体进行适应性防御）；抵抗阶段（充分动员潜能应对突变）；衰竭阶段（适应能力用尽导致机体受损）。","kw":["警觉阶段（机体进行适应性防御","抵抗阶段（充分动员潜能应对突变"],"kp":"px-10-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-20","s":"普心","c":10,"t":"填空","card":258,"kd":"考点二 情绪的维度与两极性","stem":"情绪的四个基本维度是什么？","ans":"动力性（有增力和减力两极）；激动性；强度（有强与弱两极）；紧张度（有紧张和轻松两极）。","kw":["动力性","激动性","紧张度"],"kp":"px-10-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-21","s":"普心","c":10,"t":"填空","card":259,"kd":"考点二 情绪的维度与两极性","stem":"伊扎德的四维理论包括哪四个维度？","ans":"愉快度是主观体验的享乐色调；紧张度是情绪的生理激活水平；激动度是个体缺乏预料和准备的程度；确信度是个体胜任和承受情绪的程度。","kw":["愉快度是主观体验的享乐色调","紧张度是情绪的生理激活水平"],"kp":"px-10-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-22","s":"普心","c":10,"t":"填空","card":260,"kd":"考点二 情绪的维度与两极性","stem":"罗素的二维理论是什么？","ans":"提出两个维度：愉悦度（效价）在愉悦与非愉悦之间变化；唤醒度在平静与兴奋之间变化。他用环形结构模式说明情绪维度间的关系，比如快乐是中等唤醒度、高愉悦度的情绪体验。该理论在目前情绪维度研究领域中占主导地位。","kw":["在愉悦与非愉悦之间变化","唤醒度在平静与兴奋之间变化"],"kp":"px-10-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-23","s":"普心","c":10,"t":"填空","card":261,"kd":"考点一 情绪概述","stem":"情绪的定义是什么？","ans":"情绪是以主体的愿望和需要为中介的、对外界刺激的一种生理和心理反应","kw":["情绪"],"kp":"px-10-23","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-10-24","s":"普心","c":10,"t":"填空","card":262,"kd":"考点一 情绪概述","stem":"情绪的三个组成成分是什么？","ans":"主观体验（个体对不同情绪状态的自我感受，是情绪的核心成分）；外部表现即表情（包括面部、姿态和语调表情）；生理唤醒（情绪产生的生理反应，涉及自主神经系统）。","kw":["主观体验（个体对不同情绪状态的自我感受","是情绪的核心成分）；外部表现即表情（包括面部"],"kp":"px-10-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-25","s":"普心","c":10,"t":"填空","card":263,"kd":"考点一 情绪概述","stem":"情绪的四大功能是什么？","ans":"适应功能（情绪是人类早期赖以生存的手段，直接反映人的生存状况）；动机功能（情绪是动机系统的核心成分，能激励人的活动，对生理内驱力有放大信号的作用）；组织功能（积极情绪协调认知活动，消极情绪起破坏瓦解作用）；信号功能（情绪通过表情传递信息、沟通思想，表情比语言交流发生更早）。","kw":["适应功能（情绪是人类早期赖以生存的手段"],"kp":"px-10-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-26","s":"普心","c":10,"t":"填空","card":264,"kd":"次要卡","stem":"情绪调节有哪四个性质？","ans":"第一个，可以自主进行（自我调节），也可以由外部给予（外部调节）；第二个，可以有意识发生，也可以无意识进行；第三个，可以对情绪效价调节，也可以对情绪动力性特征调节；第四个，可以是稳定的特征性情绪调节，也可以是暂时的状态性情绪调节。","kw":["也可以由外部给予（外部调节"],"kp":"px-10-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-27","s":"普心","c":10,"t":"填空","card":265,"kd":"次要卡","stem":"第十章八个考点如何串记？","ans":"","kw":["三大成分是主观体验","外部表现和生理唤醒"],"kp":"px-10-27","noteCut":8,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-28","s":"普心","c":10,"t":"填空","card":266,"kd":"次要卡","stem":"情商EQ与戈尔曼的情绪胜任力模型是什么？","ans":"巴昂最先使用EQ概念。戈尔曼提出情绪胜任力模型包括四大项：自我察觉、自我管理、社会察觉、人际关系管理。","kw":["巴昂最先使用EQ概念"],"kp":"px-10-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-29","s":"普心","c":10,"t":"填空","card":267,"kd":"次要卡","stem":"什么是表情识别？什么是微表情？","ans":"表情识别是指从图像或视频中识别出特定情绪状态的过程；艾克曼开发了面部动作编码系统。此外还有微表情，是持续时间极短、未受意识控制的微小反应，可用于测谎实践。","kw":["表情识别是指从图像或视频中识别出特定情绪状态的过程"],"kp":"px-10-29","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-10-30","s":"普心","c":10,"t":"填空","card":268,"kd":"次要卡","stem":"情绪脑的两个系统分别是什么？（达尔格利什）","ans":"达尔格利什提出情绪脑概念，认为情绪的识别和控制主要依赖两个系统：腹侧系统包括杏仁核和脑岛等，负责情绪的识别和产生；背侧系统包括海马、扣带回等，负责情绪的调控。情绪的具身观认为情绪是包括大脑在内的整个身体的活动。","kw":["达尔格利什提出情绪脑概念","背侧系统包括海马","情绪的具身观认为情绪"],"kp":"px-10-30","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-31","s":"普心","c":10,"t":"填空","card":269,"kd":"次要卡","stem":"冯特的三维理论是什么？","ans":"冯特最早研究了情绪的维度，提出三个维度：愉快—不愉快、激动—平静、紧张—松弛；每一种具体情绪都分布在三个维度两极之间的不同位置。","kw":["冯特最早研究了情绪的维度","每一种具体情绪都分布在三个维度两极之间的不同位置"],"kp":"px-10-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-32","s":"普心","c":10,"t":"填空","card":270,"kd":"次要卡","stem":"施洛伯格与普拉切克的三维理论分别是什么？","ans":"施洛伯格通过面部表情研究建立了一个椭圆切面的三维模式图，认为情绪有三个维度：愉快—不愉快、注意—拒绝、激活水平。普拉切克用倒锥体模型说明情绪维度间的关系，提出三个维度：强度、相似性和两极性，并用该模型描述了八种原始情绪之间的相似性及对立性特征。","kw":["施洛伯格通过面部表情研究建立了一个椭圆切面的三维模式图"],"kp":"px-10-32","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-33","s":"普心","c":10,"t":"填空","card":271,"kd":"次要卡","stem":"盖布尔的情绪动机维度模型是什么？","ans":"盖布尔的情绪动机维度模型按动机方向分趋近和回避，按动机强度分大和小，将情绪分为高动机强度积极情绪、高动机强度消极情绪、低动机强度积极情绪和低动机强度消极情绪四类。","kw":["按动机方向分趋近和回避","按动机强度分大和小"],"kp":"px-10-33","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L239","s":"普心","c":10,"t":"简答","card":239,"kd":"考点八 情绪调节","stem":"情绪调节的定义是什么？","ans":"情绪调节是指个体对情绪体验、生理唤醒及表情进行监控、调整和修正以达到动态平衡的过程。","kw":["情绪调节"],"kp":"px-10-1","alt":1,"bt":"b","bp":"ans","bq":"情绪调节是指个体对情绪体验、______及表情进行监控、调整和修正以达到动态平衡的过程。","bl":["生理唤醒"],"bpos":[14],"bsrc":"情绪调节是指个体对情绪体验、生理唤醒及表情进行监控、调整和修正以达到动态平衡的过程。","nq":1},{"id":"px-10-L240","s":"普心","c":10,"t":"简答","card":240,"kd":"考点八 情绪调节","stem":"情绪调节的四种理论分别是什么？","ans":"防御机制理论（由精神分析学派提出，认为情绪是冲动的、具有破坏性，是精神问题出现的根源，情绪调节就是降低消极情绪体验的防御机制）；情境理论（认为情绪调节是为了让个体更好地适应环境）；过程理论（由格罗斯提出）；情绪的ABC理论（由艾利斯提出）。","kw":["防御机制理论","情境理论","过程理论","情绪的ABC理论"],"kp":"px-10-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L241","s":"普心","c":10,"t":"简答","card":241,"kd":"考点八 情绪调节","stem":"情境理论中两种应对方向分别适用于什么情境？","ans":"以问题为中心的应对：面对问题情境，通过努力解决问题来降低情绪紧张，适用于可控情境。以情绪为中心的应对：采用行为或认知调节策略降低情绪压力，适用于不可控情境。","kw":["以问题为中心的应对","以情绪为中心的应对"],"kp":"px-10-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L242","s":"普心","c":10,"t":"简答","card":242,"kd":"考点八 情绪调节","stem":"格罗斯过程理论中的认知重评与表达抑制有什么区别？","ans":"认知重评发生在情绪反应之前，从认知上改变对情绪事件的理解从而改变情绪体验，是一种有益方式，不消耗过多认知资源。表达抑制发生在情绪反应之后，调动自我控制能力抑制情绪表达，需要耗费较多认知资源，可能产生消极影响。","kw":["认知重评发生在情绪反应之前","表达抑制发生在情绪反应之后"],"kp":"px-10-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L243","s":"普心","c":10,"t":"简答","card":243,"kd":"考点八 情绪调节","stem":"情绪的ABC理论是什么？","ans":"情绪的ABC理论由艾利斯提出：A是事件的前因，C是事情的后果，二者之间的桥梁B是信念，是对情境的评价与解释；同一情境下不同人的信念不同，导致不同结果。艾利斯据此创立了合理情绪疗法。","kw":["由艾利斯提出：A","同一情境下不同人的信念不同","艾利斯据此创立了合理情绪疗法"],"kp":"px-10-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L245","s":"普心","c":10,"t":"简答","card":245,"kd":"考点七 情绪智力","stem":"情绪智力的定义是什么？","ans":"情绪智力是监控、识别自己和他人情绪、评估和调节情绪、利用情绪促进思维的能力。","kw":["情绪智力"],"kp":"px-10-7","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-10-L246","s":"普心","c":10,"t":"简答","card":246,"kd":"考点七 情绪智力","stem":"萨洛维和梅耶的四因素模型包括哪四种能力（从低到高）？","ans":"第一个情绪知觉和评价表达能力（最基本）；第二个情绪对思维的促进能力；第三个理解分析情绪、运用情绪知识的能力；第四个情绪自我调节能力。","kw":["第一个情绪知觉和评价表达能力","第二个情绪对思维的促进能力","第三个理解分析情绪","第四个情绪自我调节能力"],"kp":"px-10-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L247","s":"普心","c":10,"t":"简答","card":247,"kd":"考点六 情绪理论","stem":"詹姆斯—兰格理论（情绪的外周理论）是什么？如何评价？","ans":"强调情绪是自主神经系统活动的产物。詹姆斯认为情绪是对身体变化的知觉，先有机体的生理变化然后才有情绪（悲伤由哭泣而起，愤怒由打斗而至）；兰格认为情绪是内脏活动的结果，与血管变化关联很大。评价：该理论是第一个关于情绪的完整心理学理论，揭示了情绪与机体变化的直接关系，但忽视了中枢神经系统的调节控制作用。","kw":["强调情绪","詹姆斯认为情绪","兰格认为情绪","评价：该理论"],"kp":"px-10-9","alt":1,"bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-10-L248","s":"普心","c":10,"t":"简答","card":248,"kd":"考点六 情绪理论","stem":"坎农—巴德学说（情绪的丘脑理论）是什么？如何评价？","ans":"认为情绪中心位于丘脑，外界刺激引起神经冲动传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向中枢机制，有积极意义。","kw":["认为情绪中心位于丘脑","评价","两个理论绑人名记"],"kp":"px-10-10","alt":1,"noteCut":1,"bt":"b","bp":"ans","bq":"认为情绪中心位于丘脑，外界刺激引起______传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向______，有积极意义。","bl":["神经冲动","中枢机制"],"bpos":[17,95],"bsrc":"认为情绪中心位于丘脑，外界刺激引起神经冲动传至丘脑，由丘脑同时发出两路信号：一路向上传至大脑产生情绪主观体验，一路向下传至交感神经引起生理变化，两者同时发生。评价：该理论将情绪研究从外周推向中枢机制，有积极意义。","nq":2},{"id":"px-10-L250","s":"普心","c":10,"t":"简答","card":250,"kd":"考点六 情绪理论","stem":"拉扎勒斯的认知评价理论包括哪三个评价层次？","ans":"认为情绪是人与环境相互作用的产物。初评价：确认刺激与自身是否有利害关系；次评价：调节和控制自己的反应行为，其中经验起重要作用；再评价：对行为有效性的反馈性评价，若无效则进行调整。该理论既承认情绪的生物因素，也承认个体经验和社会文化的影响。","kw":["认为情绪","初评价：确认刺激与自身","次评价","再评价","该理论既承认情绪的生物因素"],"kp":"px-10-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L251","s":"普心","c":10,"t":"简答","card":251,"kd":"考点六 情绪理论","stem":"沙赫特和辛格的激活归因情绪理论是什么？经典实验是什么？","ans":"认为情绪是生理唤醒、认知评价和环境刺激三个因素相互作用的结果，认知因素起关键作用。经典实验是肾上腺素注射实验：正确告知组知道自己会出现心悸、手抖等症状，将生理唤醒归因于药物，因此在愉快和愤怒情境中都较冷静；错误告知组和未告知组找不到生理唤醒的原因，便根据环境线索将其归因为某种情绪，表现出相应情绪反应。","kw":["认为情绪","经典实验","三个理论绑人名记"],"kp":"px-10-13","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L252","s":"普心","c":10,"t":"简答","card":252,"kd":"考点六 情绪理论","stem":"伊扎德的动机—分化理论是什么？","ans":"认为情绪是人格系统的核心动力；假定人的情绪系统由十一种基本情绪组成，每种基本情绪体验都有独特性，具有适应功能。情绪包含神经生理、表情和情绪体验三个子系统，三者相互作用和联结。人格由平衡系统、内驱力系统、情绪系统、知觉系统、认知系统和动作系统六个子系统组成，其中情绪系统处于核心地位。评价：该理论从生物进化观点深化了对情绪性质和功能的认识，但过分强调先天属性。","kw":["认为情绪","情绪包含神经生理","人格由平衡系统","评价"],"kp":"px-10-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L257","s":"普心","c":10,"t":"简答","card":257,"kd":"考点三 情绪的分类","stem":"汉斯·塞里的适应性综合征包括哪三个阶段？","ans":"警觉阶段（机体进行适应性防御）；抵抗阶段（充分动员潜能应对突变）；衰竭阶段（适应能力用尽导致机体受损）。","kw":["警觉阶段","抵抗阶段","衰竭阶段"],"kp":"px-10-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L259","s":"普心","c":10,"t":"简答","card":259,"kd":"考点二 情绪的维度与两极性","stem":"伊扎德的四维理论包括哪四个维度？","ans":"愉快度是主观体验的享乐色调；紧张度是情绪的生理激活水平；激动度是个体缺乏预料和准备的程度；确信度是个体胜任和承受情绪的程度。","kw":["愉快度","紧张度","激动度","确信度"],"kp":"px-10-21","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L260","s":"普心","c":10,"t":"简答","card":260,"kd":"考点二 情绪的维度与两极性","stem":"罗素的二维理论是什么？","ans":"提出两个维度：愉悦度（效价）在愉悦与非愉悦之间变化；唤醒度在平静与兴奋之间变化。他用环形结构模式说明情绪维度间的关系，比如快乐是中等唤醒度、高愉悦度的情绪体验。该理论在目前情绪维度研究领域中占主导地位。","kw":["提出两个维度","唤醒度在平静与兴奋之间变化"],"kp":"px-10-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L261","s":"普心","c":10,"t":"简答","card":261,"kd":"考点一 情绪概述","stem":"情绪的定义是什么？","ans":"情绪是以主体的愿望和需要为中介的、对外界刺激的一种生理和心理反应","kw":["情绪"],"kp":"px-10-23","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-10-L262","s":"普心","c":10,"t":"简答","card":262,"kd":"考点一 情绪概述","stem":"情绪的三个组成成分是什么？","ans":"主观体验（个体对不同情绪状态的自我感受，是情绪的核心成分）；外部表现即表情（包括面部、姿态和语调表情）；生理唤醒（情绪产生的生理反应，涉及自主神经系统）。","kw":["主观体验","外部表现即表情","生理唤醒"],"kp":"px-10-24","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L263","s":"普心","c":10,"t":"简答","card":263,"kd":"考点一 情绪概述","stem":"情绪的四大功能是什么？","ans":"适应功能（情绪是人类早期赖以生存的手段，直接反映人的生存状况）；动机功能（情绪是动机系统的核心成分，能激励人的活动，对生理内驱力有放大信号的作用）；组织功能（积极情绪协调认知活动，消极情绪起破坏瓦解作用）；信号功能（情绪通过表情传递信息、沟通思想，表情比语言交流发生更早）。","kw":["适应功能","动机功能","组织功能","信号功能"],"kp":"px-10-25","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L266","s":"普心","c":10,"t":"简答","card":266,"kd":"次要卡","stem":"情商EQ与戈尔曼的情绪胜任力模型是什么？","ans":"巴昂最先使用EQ概念。戈尔曼提出情绪胜任力模型包括四大项：自我察觉、自我管理、社会察觉、人际关系管理。","kw":["巴昂最先使用EQ概念"],"kp":"px-10-28","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L268","s":"普心","c":10,"t":"简答","card":268,"kd":"次要卡","stem":"情绪脑的两个系统分别是什么？（达尔格利什）","ans":"达尔格利什提出情绪脑概念，认为情绪的识别和控制主要依赖两个系统：腹侧系统包括杏仁核和脑岛等，负责情绪的识别和产生；背侧系统包括海马、扣带回等，负责情绪的调控。情绪的具身观认为情绪是包括大脑在内的整个身体的活动。","kw":["达尔格利什提出情绪脑概念","背侧系统包括海马","情绪的具身观认为情绪"],"kp":"px-10-30","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L269","s":"普心","c":10,"t":"简答","card":269,"kd":"次要卡","stem":"冯特的三维理论是什么？","ans":"冯特最早研究了情绪的维度，提出三个维度：愉快—不愉快、激动—平静、紧张—松弛；每一种具体情绪都分布在三个维度两极之间的不同位置。","kw":["冯特最早研究了情绪的维度"],"kp":"px-10-31","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L270","s":"普心","c":10,"t":"简答","card":270,"kd":"次要卡","stem":"施洛伯格与普拉切克的三维理论分别是什么？","ans":"施洛伯格通过面部表情研究建立了一个椭圆切面的三维模式图，认为情绪有三个维度：愉快—不愉快、注意—拒绝、激活水平。普拉切克用倒锥体模型说明情绪维度间的关系，提出三个维度：强度、相似性和两极性，并用该模型描述了八种原始情绪之间的相似性及对立性特征。","kw":["施洛伯格通过面部表情研究建立…"],"kp":"px-10-32","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-10-L271","s":"普心","c":10,"t":"简答","card":271,"kd":"次要卡","stem":"盖布尔的情绪动机维度模型是什么？","ans":"盖布尔的情绪动机维度模型按动机方向分趋近和回避，按动机强度分大和小，将情绪分为高动机强度积极情绪、高动机强度消极情绪、低动机强度积极情绪和低动机强度消极情绪四类。","kw":["按动机方向分趋近和回避"],"kp":"px-10-33","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-1","s":"普心","c":11,"t":"填空","card":272,"kd":"考点五 影响智力的因素","stem":"遗传对智力的影响有多大？","ans":"智力受遗传因素影响，遗传率约60%到80%。遗传通过染色体上的基因决定性状的传递，不同特征受遗传影响大小不同，如身高的遗传率更高。研究表明血缘关系越近，智力水平的相关越高。","kw":["智力受遗传因素影响","遗传通过染色体上的基因决定性状的传递"],"kp":"px-11-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-2","s":"普心","c":11,"t":"填空","card":273,"kd":"考点五 影响智力的因素","stem":"环境和教育对智力的影响包括哪三个方面？","ans":"产前环境（母亲怀孕时的年龄、营养状况、药物使用等对胎儿智力发展有重要影响）；早期经验（四岁前神经系统迅速发展为智力提供物质基础，丰富的环境刺激有利于能力发展，营养不良和缺乏刺激会阻碍智力发展）；学校教育（有目的有计划有组织地传授知识和技能，对智力发展起主导作用）。","kw":["产前环境（母亲怀孕时的年龄","药物使用等对胎儿智力发展有重要影响"],"kp":"px-11-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-3","s":"普心","c":11,"t":"填空","card":274,"kd":"考点四 智力的发展与个体差异","stem":"智力发展的一般趋势是什么？","ans":"童年期和青少年期是智力发展非常重要的时期；从三四岁到十二三岁，智力发展与年龄几乎等速增长；智力在十八到二十五岁达到顶峰，不同智力成分达到顶峰时间不同；流体智力中年后下降，晶体智力一生中逐渐增长；成年期二十五到四十岁是智力最稳定的时期，常出现富有创造性的活动。","kw":["童年期和青少年期是智力发展非常重要的时期"],"kp":"px-11-3","bt":"b","bp":"ans","bq":"童年期和青少年期是智力发展非常重要的时期；从三四岁到十二三岁，智力发展与年龄几乎等速增长；智力在十八到二十五岁达到顶峰，不同智力成分达到顶峰时间不同；流体智力中年后下降，______一生中逐渐增长；成年期二十五到四十岁是智力最稳定的时期，常出现富有创造性的活动。","bl":["晶体智力"],"bpos":[85],"bsrc":"童年期和青少年期是智力发展非常重要的时期；从三四岁到十二三岁，智力发展与年龄几乎等速增长；智力在十八到二十五岁达到顶峰，不同智力成分达到顶峰时间不同；流体智力中年后下降，晶体智力一生中逐渐增长；成年期二十五到四十岁是智力最稳定
