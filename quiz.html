的时期，常出现富有创造性的活动。","nq":1},{"id":"px-11-4","s":"普心","c":11,"t":"填空","card":275,"kd":"考点四 智力的发展与个体差异","stem":"智力的水平差异表现在哪些方面？","ans":"智力在全人口中呈正态分布，有智力超常和智力落后。推孟将智商140以上的儿童称为天才儿童；伦祖利提出三圆圈超常儿童概念，认为超常儿童应具备中等以上智力、对任务的承诺和较高的创造力。","kw":["智力在全人口中呈正态分布","推孟将智商140以上的儿童称为天才儿童"],"kp":"px-11-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-5","s":"普心","c":11,"t":"填空","card":276,"kd":"考点四 智力的发展与个体差异","stem":"智力的结构差异和性别差异分别是什么？","ans":"结构差异：各能力成分组合方式不同。性别差异：女生言语能力普遍较好，男生在空间能力上更有优势。","kw":["各能力成分组合方式不同"],"kp":"px-11-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-6","s":"普心","c":11,"t":"填空","card":277,"kd":"考点三 智力的测量","stem":"比内—西蒙智力量表的地位是什么？","ans":"1905年编制，是第一个正式的智力量表，引入了心理年龄的概念（也称智力年龄），作为量化儿童智力水平的指标。","kw":["是第一个正式的智力量表","引入了心理年龄的概念（也称智力年龄"],"kp":"px-11-6","noteCut":1,"bt":"b","bp":"ans","bq":"1905年编制，是第一个正式的智力量表，引入了______的概念（也称智力年龄），作为量化儿童智力水平的指标。","bl":["心理年龄"],"bpos":[23],"bsrc":"1905年编制，是第一个正式的智力量表，引入了心理年龄的概念（也称智力年龄），作为量化儿童智力水平的指标。","nq":1},{"id":"px-11-7","s":"普心","c":11,"t":"填空","card":278,"kd":"考点三 智力的测量","stem":"斯坦福—比内量表的特点是什么？","ans":"斯坦福—比内量表的特点由推孟引入美国，采用比率智商，计算公式为心理年龄除以实际年龄，后改用离差智商。","kw":["由推孟引入美国","计算公式为心理年龄除以实际年龄"],"kp":"px-11-7","bt":"b","bp":"ans","bq":"斯坦福—比内量表的特点由推孟引入美国，采用______，计算公式为心理年龄除以实际年龄，后改用离差智商。","bl":["比率智商"],"bpos":[21],"bsrc":"斯坦福—比内量表的特点由推孟引入美国，采用比率智商，计算公式为心理年龄除以实际年龄，后改用离差智商。","nq":1},{"id":"px-11-8","s":"普心","c":11,"t":"填空","card":279,"kd":"考点三 智力的测量","stem":"韦克斯勒智力量表分为哪三种？","ans":"韦氏成人智力量表（适用于16岁以上）；韦氏儿童智力量表（适用于6到16岁）；韦氏学前和小学儿童量表（适用于4到6.5岁）。包括言语量表和操作量表，分别得到言语智商和操作智商。","kw":["韦氏成人智力量表（适用于16岁以上","韦氏儿童智力量表（适用于6到16岁"],"kp":"px-11-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-9","s":"普心","c":11,"t":"填空","card":280,"kd":"考点三 智力的测量","stem":"什么是离差智商？它解决了什么问题？","ans":"韦氏量表采用离差智商，以100为平均数、15为标准差，用个人分数在同龄人中的相对位置表示智力水平，克服了比率智商随年龄增长下降的弊端。","kw":["韦氏量表采用离差智商","用个人分数在同龄人中的相对位置表示智力水平"],"kp":"px-11-9","bt":"b","bp":"ans","bq":"韦氏量表采用离差智商，以100为平均数、15为______，用个人分数在同龄人中的相对位置表示智力水平，克服了______随年龄增长下降的弊端。","bl":["标准差","比率智商"],"bpos":[23,52],"bsrc":"韦氏量表采用离差智商，以100为平均数、15为标准差，用个人分数在同龄人中的相对位置表示智力水平，克服了比率智商随年龄增长下降的弊端。","nq":2},{"id":"px-11-10","s":"普心","c":11,"t":"填空","card":281,"kd":"考点二 智力的理论","stem":"斯皮尔曼的二因素论是什么？如何评价？","ans":"认为完成任何心智任务都有两种因素参与：一般因素（G，代表基本心理潜能，对任何智力任务都产生影响）和特殊因素（S，完成特定任务时所需）。斯皮尔曼是因素分析之父；该理论在当时鼓舞了智力落后教育，但过于强调G和S因素的对立。","kw":["认为完成任何心智任务都有两种因素参与"],"kp":"px-11-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-11","s":"普心","c":11,"t":"填空","card":282,"kd":"考点二 智力的理论","stem":"弗农的智力层次结构理论是什么？","ans":"在二因素论基础上提出，以一般因素为基础，分为大因素群、小因素群和特殊因素四个层次。","kw":["在二因素论基础上提出","以一般因素为基础"],"kp":"px-11-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-12","s":"普心","c":11,"t":"填空","card":283,"kd":"考点二 智力的理论","stem":"瑟斯顿的群因素论提出了哪七种基本心理能力？","ans":"语言理解、语词流畅、数字运算、空间关系、联想记忆、知觉速度和一般推理。他编制了基本心理能力测验，发现这些能力并不彼此独立，因此提出二阶因素概念。","kw":["知觉速度和一般推理","他编制了基本心理能力测验"],"kp":"px-11-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-13","s":"普心","c":11,"t":"填空","card":284,"kd":"考点二 智力的理论","stem":"吉尔福特的三维智力结构模型是什么？","ans":"智力包括三个维度：内容（智力活动的对象，包括视觉、听觉、符号、语意和行为）；操作（智力活动的过程，包括认知、记忆、发散思维、聚合思维和评价）；产物（智力操作的结果，包括单元、类别、关系、系统、转换和推断）。理论上可区分150种智力。该理论同时考虑内容、过程和结果，有助于发现优势和非优势能力，但过分强调技术脱离实践。","kw":["智力包括三个维度","该理论同时考虑内容"],"kp":"px-11-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-14","s":"普心","c":11,"t":"填空","card":285,"kd":"考点二 智力的理论","stem":"卡特尔和霍恩如何区分流体智力与晶体智力？","ans":"流体智力依赖先天禀赋，主要与神经系统生理机能有关，20岁达顶峰后随年龄增长降低，可用来编制文化公平测验。晶体智力依赖后天学习，通过掌握社会文化经验获得，25岁后速度平缓，一生中持续稳定发展。该理论对理解能力发展的多维性有重要意义，但部分割裂了两种智力之间的联系。","kw":["流体智力依赖先天禀赋","主要与神经系统生理机能有关"],"kp":"px-11-14","bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-11-15","s":"普心","c":11,"t":"填空","card":286,"kd":"考点二 智力的理论","stem":"加德纳的多元智力理论提出了哪八种智力？","ans":"语言智力（与布洛卡区有关）；逻辑数学智力（定位在大脑左半球）；空间智力（由右半球掌管）；音乐智力；运动智力（由运动皮层控制）；人际智力（与前额叶有关）；自知智力；自然智力。后来还假设了存在智力。该理论扩展了智力的内涵，对教学改革产生重大影响。","kw":["逻辑数学智力（定位在大脑左半球","后来还假设了存在智力"],"kp":"px-11-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-16","s":"普心","c":11,"t":"填空","card":287,"kd":"考点二 智力的理论","stem":"斯滕伯格的三元智力理论包括哪三个亚理论？","ans":"智力成分亚理论（监视智力活动的内在机制，包括元成分、操作成分和知识获得成分）；智力情境亚理论（表现为适应、塑造和选择新环境的能力）；智力经验亚理论（包括处理新任务和自动化加工的能力）。","kw":["智力成分亚理论（监视智力活动的内在机制","操作成分和知识获得成分"],"kp":"px-11-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-17","s":"普心","c":11,"t":"填空","card":288,"kd":"考点二 智力的理论","stem":"斯滕伯格的成功智力理论包括哪三个方面？","ans":"斯滕伯格的成功智力理论分析性智力用于解决问题；创造性智力用于创新发现；实践性智力用于解决实际生活问题，即街头智慧。三者协调平衡时最有效。该理论更具实用取向，能解释「第十名现象」等真实世界中的成功。","kw":["分析性智力用于解决问题","创造性智力用于创新发现"],"kp":"px-11-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-18","s":"普心","c":11,"t":"填空","card":289,"kd":"考点二 智力的理论","stem":"PASS模型包括哪三个认知系统？","ans":"达斯等建立在鲁利亚脑机能系统学说基础上：注意系统处于最底层，使大脑处于工作状态；信息加工系统处于中间层次，包括同时性加工和继时性加工；计划系统处于最高层，负责计划、监控、调节、评价。该模型以神经心理学为基础，实证性和可靠性较高，体现了脑科学对智力研究的影响。","kw":["达斯等建立在鲁利亚脑机能系统学说基础上"],"kp":"px-11-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-19","s":"普心","c":11,"t":"填空","card":290,"kd":"考点二 智力的理论","stem":"CHC模型将认知能力分为哪三个层级？","ans":"吸收卡特尔—霍恩和卡罗尔的成果：最高层代表最一般的智力水平；中间层是广泛能力，如流体、晶体智力；最底层包括约70个可直接测量的狭窄能力。该模型采用探索性与验证性因素分析相结合，目前被公认为描述人类智力的最佳层级模型。","kw":["吸收卡特尔—霍恩和卡罗尔的成果","最高层代表最一般的智力水平"],"kp":"px-11-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-20","s":"普心","c":11,"t":"填空","card":291,"kd":"考点一 概述","stem":"智力与能力的定义分别是什么？","ans":"智力是个体顺利完成某种活动所必须的各种认知能力的有机结合，是个人有目的地行动、合理思考、有效应付环境的综合能力；能力比智力概念更庞杂。","kw":["智力是个体顺利完成某种活动所必须的各种认知能力的有机结合"],"kp":"px-11-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-21","s":"普心","c":11,"t":"填空","card":292,"kd":"考点一 概述","stem":"能力倾向与成就分别指什么？","ans":"能力倾向即潜在能力，又分一般能力倾向（其核心是抽象推理能力）和特殊能力倾向（与特定专业活动密切相关）；成就是指通过经验学习获得的知识或技能。","kw":["能力倾向即潜在能力","又分一般能力倾向（其核心是抽象推理能力"],"kp":"px-11-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-22","s":"普心","c":11,"t":"填空","card":293,"kd":"考点一 概述","stem":"知识、技能与能力三者是什么关系？","ans":"三者相互联系又有区别：能力的发展依赖知识和技能的获得，但知识获得快而能力形成慢；不同人可能知识技能相同但能力不同；能力属于个性心理特征范畴，知识属于心理活动过程范畴，技能属于心理活动方式范畴。","kw":["三者相互联系又有区别","能力的发展依赖知识和技能的获得"],"kp":"px-11-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-23","s":"普心","c":11,"t":"填空","card":294,"kd":"次要卡","stem":"人的主观能动性对智力发展有什么作用？","ans":"个体自身的努力和积极运用能力对智力发展有重要作用；一个人越是积极地运用自身能力去解决各类问题，潜能就越有可能充分表现出来。","kw":["个体自身的努力和积极运用能力对智力发展有重要作用"],"kp":"px-11-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-24","s":"普心","c":11,"t":"填空","card":295,"kd":"次要卡","stem":"第十一章五个考点如何串记？","ans":"","kw":["智力是认知能力的有机结合","能力倾向分一般和特殊两种"],"kp":"px-11-24","noteCut":5,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-25","s":"普心","c":11,"t":"填空","card":296,"kd":"次要卡","stem":"智力测验的早期探索有哪些？","ans":"中国古代刘勰用左手画方、右手画圆考察注意分配；扬雄用言语和书法的速度判断智慧；高尔顿设计高尔顿哨和高尔顿棒，分别测定听觉和视觉辨别力来评估智力水平。","kw":["右手画圆考察注意分配","扬雄用言语和书法的速度判断智慧"],"kp":"px-11-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-26","s":"普心","c":11,"t":"填空","card":297,"kd":"次要卡","stem":"智力理论的发展脉络如何小结？","ans":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，PASS模型从脑机能系统出发，CHC模型成为当前公认的最佳模型。","kw":["心理测量取向的理论从斯皮尔曼二因素论开始"],"kp":"px-11-26","noteCut":1,"bt":"b","bp":"ans","bq":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，______从脑机能系统出发，______成为当前公认的最佳模型。","bl":["PASS模型","CHC模型"],"bpos":[137,152],"bsrc":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，PASS模型从脑机能系统出发，CHC模型成为当前公认的最佳模型。","nq":2},{"id":"px-11-27","s":"普心","c":11,"t":"填空","card":298,"kd":"次要卡","stem":"知识与技能分别如何分类？","ans":"知识分陈述性知识（关于是什么的知识）和程序性知识（关于如何做的知识）。技能按活动方式分操作技能（由外显机体运动实现，动作对象是物体）和心智技能（由内在智力操作实现，动作对象是观念）。","kw":["知识分陈述性知识（关于是什么的知识"],"kp":"px-11-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L275","s":"普心","c":11,"t":"简答","card":275,"kd":"考点四 智力的发展与个体差异","stem":"智力的水平差异表现在哪些方面？","ans":"智力在全人口中呈正态分布，有智力超常和智力落后。推孟将智商140以上的儿童称为天才儿童；伦祖利提出三圆圈超常儿童概念，认为超常儿童应具备中等以上智力、对任务的承诺和较高的创造力。","kw":["智力在全人口中呈正态分布","伦祖利提出三圆圈超常儿童概念"],"kp":"px-11-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L276","s":"普心","c":11,"t":"简答","card":276,"kd":"考点四 智力的发展与个体差异","stem":"智力的结构差异和性别差异分别是什么？","ans":"结构差异：各能力成分组合方式不同。性别差异：女生言语能力普遍较好，男生在空间能力上更有优势。","kw":["结构差异","性别差异"],"kp":"px-11-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L278","s":"普心","c":11,"t":"简答","card":278,"kd":"考点三 智力的测量","stem":"斯坦福—比内量表的特点是什么？","ans":"斯坦福—比内量表的特点由推孟引入美国，采用比率智商，计算公式为心理年龄除以实际年龄，后改用离差智商。","kw":["由推孟引入美国"],"kp":"px-11-7","alt":1,"bt":"b","bp":"ans","bq":"斯坦福—比内量表的特点由推孟引入美国，采用______，计算公式为心理年龄除以实际年龄，后改用离差智商。","bl":["比率智商"],"bpos":[21],"bsrc":"斯坦福—比内量表的特点由推孟引入美国，采用比率智商，计算公式为心理年龄除以实际年龄，后改用离差智商。","nq":1},{"id":"px-11-L281","s":"普心","c":11,"t":"简答","card":281,"kd":"考点二 智力的理论","stem":"斯皮尔曼的二因素论是什么？如何评价？","ans":"认为完成任何心智任务都有两种因素参与：一般因素（G，代表基本心理潜能，对任何智力任务都产生影响）和特殊因素（S，完成特定任务时所需）。斯皮尔曼是因素分析之父；该理论在当时鼓舞了智力落后教育，但过于强调G和S因素的对立。","kw":["斯皮尔曼"],"kp":"px-11-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L282","s":"普心","c":11,"t":"简答","card":282,"kd":"考点二 智力的理论","stem":"弗农的智力层次结构理论是什么？","ans":"在二因素论基础上提出，以一般因素为基础，分为大因素群、小因素群和特殊因素四个层次。","kw":["在二因素论基础上提出"],"kp":"px-11-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L283","s":"普心","c":11,"t":"简答","card":283,"kd":"考点二 智力的理论","stem":"瑟斯顿的群因素论提出了哪七种基本心理能力？","ans":"语言理解、语词流畅、数字运算、空间关系、联想记忆、知觉速度和一般推理。他编制了基本心理能力测验，发现这些能力并不彼此独立，因此提出二阶因素概念。","kw":["语言理解","他编制了基本心理能力测验"],"kp":"px-11-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L284","s":"普心","c":11,"t":"简答","card":284,"kd":"考点二 智力的理论","stem":"吉尔福特的三维智力结构模型是什么？","ans":"智力包括三个维度：内容（智力活动的对象，包括视觉、听觉、符号、语意和行为）；操作（智力活动的过程，包括认知、记忆、发散思维、聚合思维和评价）；产物（智力操作的结果，包括单元、类别、关系、系统、转换和推断）。理论上可区分150种智力。该理论同时考虑内容、过程和结果，有助于发现优势和非优势能力，但过分强调技术脱离实践。","kw":["智力包括三个维度","理论上可区分150种智力","该理论同时考虑内容"],"kp":"px-11-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L286","s":"普心","c":11,"t":"简答","card":286,"kd":"考点二 智力的理论","stem":"加德纳的多元智力理论提出了哪八种智力？","ans":"语言智力（与布洛卡区有关）；逻辑数学智力（定位在大脑左半球）；空间智力（由右半球掌管）；音乐智力；运动智力（由运动皮层控制）；人际智力（与前额叶有关）；自知智力；自然智力。后来还假设了存在智力。该理论扩展了智力的内涵，对教学改革产生重大影响。","kw":["语言智力","逻辑数学智力","空间智力","运动智力","人际智力","后来还假设了存在智力","该理论扩展了智力的内涵"],"kp":"px-11-15","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L287","s":"普心","c":11,"t":"简答","card":287,"kd":"考点二 智力的理论","stem":"斯滕伯格的三元智力理论包括哪三个亚理论？","ans":"智力成分亚理论（监视智力活动的内在机制，包括元成分、操作成分和知识获得成分）；智力情境亚理论（表现为适应、塑造和选择新环境的能力）；智力经验亚理论（包括处理新任务和自动化加工的能力）。","kw":["智力成分亚理论","智力情境亚理论","智力经验亚理论"],"kp":"px-11-16","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L288","s":"普心","c":11,"t":"简答","card":288,"kd":"考点二 智力的理论","stem":"斯滕伯格的成功智力理论包括哪三个方面？","ans":"斯滕伯格的成功智力理论分析性智力用于解决问题；创造性智力用于创新发现；实践性智力用于解决实际生活问题，即街头智慧。三者协调平衡时最有效。该理论更具实用取向，能解释「第十名现象」等真实世界中的成功。","kw":["分析性智力用于解决问题","创造性智力用于创新发现","三者协调平衡时最有效","该理论更具实用取向"],"kp":"px-11-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L289","s":"普心","c":11,"t":"简答","card":289,"kd":"考点二 智力的理论","stem":"PASS模型包括哪三个认知系统？","ans":"达斯等建立在鲁利亚脑机能系统学说基础上：注意系统处于最底层，使大脑处于工作状态；信息加工系统处于中间层次，包括同时性加工和继时性加工；计划系统处于最高层，负责计划、监控、调节、评价。该模型以神经心理学为基础，实证性和可靠性较高，体现了脑科学对智力研究的影响。","kw":["信息加工系统处于中间层次","计划系统处于最高层","该模型以神经心理学为基础"],"kp":"px-11-18","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L290","s":"普心","c":11,"t":"简答","card":290,"kd":"考点二 智力的理论","stem":"CHC模型将认知能力分为哪三个层级？","ans":"吸收卡特尔—霍恩和卡罗尔的成果：最高层代表最一般的智力水平；中间层是广泛能力，如流体、晶体智力；最底层包括约70个可直接测量的狭窄能力。该模型采用探索性与验证性因素分析相结合，目前被公认为描述人类智力的最佳层级模型。","kw":["中间层"],"kp":"px-11-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L291","s":"普心","c":11,"t":"简答","card":291,"kd":"考点一 概述","stem":"智力与能力的定义分别是什么？","ans":"智力是个体顺利完成某种活动所必须的各种认知能力的有机结合，是个人有目的地行动、合理思考、有效应付环境的综合能力；能力比智力概念更庞杂。","kw":["智力","能力比智力概念更庞杂"],"kp":"px-11-20","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-11-L297","s":"普心","c":11,"t":"简答","card":297,"kd":"次要卡","stem":"智力理论的发展脉络如何小结？","ans":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，PASS模型从脑机能系统出发，CHC模型成为当前公认的最佳模型。","kw":["新视角方面","所有理论绑人名记"],"kp":"px-11-26","alt":1,"noteCut":1,"bt":"b","bp":"ans","bq":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，______从脑机能系统出发，______成为当前公认的最佳模型。","bl":["PASS模型","CHC模型"],"bpos":[137,152],"bsrc":"心理测量取向的理论从斯皮尔曼二因素论开始，瑟斯顿提出七种因素，吉尔福特扩展到150种，卡特尔和霍恩区分了流体和晶体智力，弗农建立了层次结构，总体趋势是从单一因素走向多维结构。新视角方面，加德纳提出八种独立智力，斯滕伯格从成分、情境和经验三个角度理解智力并进一步提出成功智力，PASS模型从脑机能系统出发，CHC模型成为当前公认的最佳模型。","nq":2},{"id":"px-12-1","s":"普心","c":12,"t":"填空","card":299,"kd":"考点五 人格的成因","stem":"行为遗传学研究遗传对人格影响有哪三种方法？","ans":"家族研究（说明某种人格特征的遗传性，但无法分离环境因素）；双生子研究（同卵双生子人格相关最高，是研究遗传因素的最好方法）；收养研究（比较基因效应与环境效应）。此外分子遗传学从DNA水平研究特定基因对人格的影响。","kw":["家族研究（说明某种人格特征的遗传性","但无法分离环境因素"],"kp":"px-12-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-2","s":"普心","c":12,"t":"填空","card":300,"kd":"考点五 人格的成因","stem":"艾森克的唤醒理论与格雷的强化敏感性理论分别是什么？","ans":"艾森克认为内外倾与上行网状激活系统有关，内倾者基线唤醒水平更高。格雷提出强化敏感性理论，认为行为激活系统对奖励敏感，行为抑制系统对惩罚敏感。","kw":["艾森克认为内外倾与上行网状激活系统有关"],"kp":"px-12-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-3","s":"普心","c":12,"t":"填空","card":301,"kd":"考点五 人格的成因","stem":"克罗宁格的三维人格模型是什么？","ans":"认为新异性寻求、避免伤害和奖励依赖三种特质分别与多巴胺、5-羟色胺和去甲肾上腺素水平有关。","kw":["认为新异性寻求"],"kp":"px-12-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-4","s":"普心","c":12,"t":"填空","card":302,"kd":"考点五 人格的成因","stem":"后天环境对人格形成有哪些作用？","ans":"家庭是第一个主要场所，父母的教养方式和亲子关系质量对儿童人格形成有最重要影响。学校通过教师言传身教、师生关系和同伴关系影响人格发展，也是客观自我评价的重要场所。社会文化塑造了社会成员共同的人格特征，每个人受到其所在文化环境中大众传媒、社会风气和文化因素的影响。此外早期童年经验也对人格发展有重要影响。","kw":["家庭是第一个主要场所","父母的教养方式和亲子关系质量对儿童人格形成有最重要影响"],"kp":"px-12-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-5","s":"普心","c":12,"t":"填空","card":303,"kd":"考点五 人格的成因","stem":"自我因素在人格发展中起什么作用？","ans":"个体对自我、他人和情境的认知在人格发展中起统合作用。生物学因素是物质基础，后天环境是现实情境，自我因素是内部因素。","kw":["个体对自我","生物学因素"],"kp":"px-12-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-6","s":"普心","c":12,"t":"填空","card":304,"kd":"考点四 人格测评","stem":"什么是自陈量表？经典测验有哪些？优缺点是什么？","ans":"让被试依据实际情况对自己的人格特征进行评价。经典测验包括卡特尔16PF、艾森克EPQ、五因素NEO-PI、明尼苏达多项人格测验MMPI。优点是施测简单方便；缺点是易受被试有意无意表现影响。","kw":["经典测验包括卡特尔16PF","优点","缺点"],"kp":"px-12-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-7","s":"普心","c":12,"t":"填空","card":305,"kd":"考点四 人格测评","stem":"什么是投射测验？","ans":"以精神分析理论为依据，通过向被试呈现模棱两可的刺激材料，要求自由解释，使其在不知不觉中投射出动机和欲望。","kw":["以精神分析理论为依据","通过向被试呈现模棱两可的刺激材料"],"kp":"px-12-7","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-12-8","s":"普心","c":12,"t":"填空","card":306,"kd":"考点四 人格测评","stem":"经典投射测验有哪些？","ans":"罗夏克墨迹测验由十张墨迹图片组成，分析被试的反应推断无意识动机；主题统觉测验TAT由莫瑞编制，让被试根据图片编故事投射内心。","kw":["罗夏克墨迹测验由十张墨迹图片组成","分析被试的反应推断无意识动机"],"kp":"px-12-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-9","s":"普心","c":12,"t":"填空","card":307,"kd":"考点四 人格测评","stem":"投射测验的优缺点是什么？","ans":"优点是测量目的有掩蔽性，减少伪装可能；缺点是信效度偏低，费时费力。","kw":[" 减少伪装可能"],"kp":"px-12-9","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-10","s":"普心","c":12,"t":"填空","card":308,"kd":"考点三 人格理论","stem":"弗洛伊德的人格结构包括哪三部分？","ans":"本我遵循快乐原则，为活动提供力比多；自我遵循现实原则，负责决策执行；超我遵循道德原则，包括良心和自我理想。","kw":["本我遵循快乐原则","为活动提供力比多"],"kp":"px-12-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-11","s":"普心","c":12,"t":"填空","card":309,"kd":"考点三 人格理论","stem":"弗洛伊德的意识三层次（冰山比喻）是什么？","ans":"意识是露出水面的部分；前意识（老师表述为「可浮现到意识中」的部分）可以浮现到意识中；潜意识深藏原始冲动，是心理动力源泉。","kw":["意识是露出水面的部分","可以浮现到意识中"],"kp":"px-12-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-12","s":"普心","c":12,"t":"填空","card":310,"kd":"考点三 人格理论","stem":"弗洛伊德的人格发展五阶段是什么？","ans":"口唇期0到1岁，满足与否影响信任感；肛门期1到3岁，大小便训练影响性格；性器期3到6岁，需解决恋亲情结影响性别认同；潜伏期6到12岁，性冲动被压抑转向学习社交；两性期（生殖期）12到18岁，建立成熟关系。","kw":["满足与否影响信任感","大小便训练影响性格"],"kp":"px-12-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-13","s":"普心","c":12,"t":"填空","card":311,"kd":"考点三 人格理论","stem":"弗洛伊德提出的自我防御机制有哪些？作用是什么？","ans":"弗洛伊德提出的自我防御机制包括压抑（最常见）、投射、反向、否认、合理化及文饰作用、转移、抵消、升华等，用于减少本我与超我冲突产生的焦虑。评价：该理论拓宽了心理学领域，但过于强调潜意识且无法证伪。","kw":["合理化及文饰作用","用于减少本我与超我冲突产生的焦虑"],"kp":"px-12-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-14","s":"普心","c":12,"t":"填空","card":312,"kd":"考点三 人格理论","stem":"荣格的分析心理学有哪些核心观点？","ans":"人格分三个层次：自我是有意识的心智；个体潜意识含情结；集体潜意识含原型，包括人格面具、阴影、阿尼玛和阿尼姆斯、自性等。他还按两种态度（内倾、外倾）和四种功能（思维、情感、感觉、直觉）组合成八种人格类型。","kw":["自我是有意识的心智","个体潜意识含情结"],"kp":"px-12-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-15","s":"普心","c":12,"t":"填空","card":313,"kd":"考点三 人格理论","stem":"阿德勒的个体心理学有哪些核心观点？","ans":"追求优越是行为的根本动力；自卑与补偿是动力根源；社会兴趣是衡量心理健康的标准；创造性自我使人能主动建构生活风格。","kw":["追求优越是行为的根本动力","自卑与补偿是动力根源"],"kp":"px-12-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-16","s":"普心","c":12,"t":"填空","card":314,"kd":"考点三 人格理论","stem":"弗洛姆的社会精神分析理论把人格分为哪五种类型？","ans":"他从社会文化角度分析人格：接纳型（一切依赖他人）；剥削型（以强力获取所需）；囤积型（从储存中获得安全感）；市场型（把自己当作可出售的商品）；生产型（运用自身力量实现潜能，是人类发展的最佳状态）。","kw":["他从社会文化角度分析人格","囤积型（从储存中获得安全感"],"kp":"px-12-16","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-17","s":"普心","c":12,"t":"填空","card":315,"kd":"考点三 人格理论","stem":"马斯洛的自我实现论有哪些核心观点？","ans":"强调人运用所有潜能发展至极限；自我实现是在任何时刻实现个人潜能的过程；高峰体验是自我实现者的特征之一，是短暂豁达极乐的体验。","kw":["强调人运用所有潜能发展至极限","自我实现是在任何时刻实现个人潜能的过程"],"kp":"px-12-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-18","s":"普心","c":12,"t":"填空","card":316,"kd":"考点三 人格理论","stem":"罗杰斯的自我和谐人格观有哪些核心观点？","ans":"强调自我概念，分现实自我和理想自我，两者越接近心理健康程度越高；无条件的积极关注在婴幼儿时期最为重要；在此基础上提出来访者中心疗法。评价：人本主义强调自由意志与潜能，关注健康人格，但过分强调天赋潜能。","kw":["分现实自我和理想自我","两者越接近心理健康程度越高"],"kp":"px-12-18","bt":"b","bp":"ans","bq":"强调自我概念，分现实自我和______，两者越接近心理健康程度越高；无条件的积极关注在婴幼儿时期最为重要；在此基础上提出来访者中心疗法。评价：人本主义强调自由意志与潜能，关注健康人格，但过分强调天赋潜能。","bl":["理想自我"],"bpos":[13],"bsrc":"强调自我概念，分现实自我和理想自我，两者越接近心理健康程度越高；无条件的积极关注在婴幼儿时期最为重要；在此基础上提出来访者中心疗法。评价：人本主义强调自由意志与潜能，关注健康人格，但过分强调天赋潜能。","nq":1},{"id":"px-12-19","s":"普心","c":12,"t":"填空","card":317,"kd":"考点三 人格理论","stem":"班杜拉的社会学习理论包含哪些核心内容？","ans":"交互决定论认为个人内部因素、行为和环境三者相互作用。观察学习四个阶段：注意过程、保持过程、复制过程和动机过程；动机过程中存在三种强化：直接强化、替代性强化和自我强化。自我效能感是对自己能否完成某行为的主观判断，影响活动的选择和坚持性，四个来源是操作成败、替代经验、言语劝说和情绪唤起。该理论恢复了意识的地位。","kw":["交互决定论认为个人内部因素"],"kp":"px-12-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-20","s":"普心","c":12,"t":"填空","card":318,"kd":"考点三 人格理论","stem":"奥尔波特如何对特质进行分类？","ans":"首次对特质进行描述分类，分共同特质和个人特质；个人特质又分首要倾向（占绝对优势，如林黛玉的多愁善感）、中心倾向（构成5到10个重要特质，如清高、孤僻、聪慧）、次要倾向（在特殊情况下才表现）。他还提出健康人格6特征。","kw":["首次对特质进行描述分类","分共同特质和个人特质"],"kp":"px-12-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-21","s":"普心","c":12,"t":"填空","card":319,"kd":"考点三 人格理论","stem":"卡特尔的特质理论是什么？","ans":"用因素分析法区分表面特质和根源特质，提出16种相互独立的根源特质，并据此编制16PF问卷。","kw":["用因素分析法区分表面特质和根源特质"],"kp":"px-12-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-22","s":"普心","c":12,"t":"填空","card":320,"kd":"考点三 人格理论","stem":"艾森克的人格三维度模型是什么？","ans":"外倾—内倾（高分者开朗、冲动、善于社交；低分者安静、内省、不喜欢社交）；神经质—情绪稳定性（高分者高焦虑、喜怒无常；低分者稳重、温和、不易焦虑）；精神质—超我功能（高分者自我中心冷漠、具有攻击性；低分者温柔、善感、有同情心）。编制EPQ问卷。","kw":["神经质—情绪稳定性（高分者高焦虑","精神质—超我功能（高分者自我中心冷漠"],"kp":"px-12-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-23","s":"普心","c":12,"t":"填空","card":321,"kd":"考点三 人格理论","stem":"大五人格（五因素模型）包括哪五个因素？","ans":"麦克雷和科斯塔提出五因素模型，即OCEAN（老师读作OCENN）。开放性反映对不熟悉环境的探索性；尽责性反映目标导向的行为组织；外倾性反映人际交往密度和获得快乐的能力；宜人性反映与他人和睦相处的程度；神经质反映情绪调节能力和稳定性。每一类特质包含6个方面，是目前最流行的人格特质分类模型。","kw":["麦克雷和科斯塔提出五因素模型","开放性反映对不熟悉环境的探索性"],"kp":"px-12-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-24","s":"普心","c":12,"t":"填空","card":322,"kd":"考点二 人格结构","stem":"什么是气质？四种气质类型各有什么特点？","ans":"气质是个体生来就有的心理活动的动力性特征，受高级神经活动类型影响，无好坏之分。四种气质类型：胆汁质（精力旺盛但急躁冲动）；多血质；粘液质（安静专注但反应缓慢）；抑郁质（观察细致但多愁善感）。","kw":["气质是个体生来就有的心理活动的动力性特征"],"kp":"px-12-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-25","s":"普心","c":12,"t":"填空","card":323,"kd":"考点二 人格结构","stem":"巴甫洛夫的高级神经活动类型说如何对应气质？","ans":"兴奋型对应胆汁质；活泼型对应多血质；安静型对应粘液质；抑制型对应抑郁质。","kw":["兴奋型对应胆汁质","活泼型对应多血质"],"kp":"px-12-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-26","s":"普心","c":12,"t":"填空","card":324,"kd":"考点二 人格结构","stem":"什么是性格？性格的结构特征包括哪四个方面？","ans":"性格是个人对现实稳定的态度及相应行为方式，具有后天性，有好坏之分。结构特征包括：态度特征（在性格结构中具有核心意义）、意志特征、情绪特征、理智特征。","kw":["性格是个人对现实稳定的态度及相应行为方式"],"kp":"px-12-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-27","s":"普心","c":12,"t":"填空","card":325,"kd":"考点二 人格结构","stem":"性格类型如何划分？","ans":"性格类型按知情意何者占优分理智型、情绪型和意志型；按心理活动倾向分荣格的外倾型和内倾型。","kw":["按心理活动倾向分荣格的外倾型和内倾型"],"kp":"px-12-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-28","s":"普心","c":12,"t":"填空","card":326,"kd":"考点二 人格结构","stem":"气质与性格的关系是什么？","ans":"气质先天、可塑性小、无好坏之分；性格后天、可塑性大、有好坏之分；性格在一定程度上可以掩盖或改造气质。","kw":["气质先天","性格后天"],"kp":"px-12-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-29","s":"普心","c":12,"t":"填空","card":327,"kd":"考点二 人格结构","stem":"三种认知方式（认知风格）是什么？","ans":"三种认知方式也叫认知风格，是个人偏爱的信息加工方式，无好坏之分。主要类型：场独立性—场依存性（威特金用镶嵌图形测验测量）；冲动性—沉思性（卡根用匹配熟悉图形测验测量）；同时性—继时性。","kw":["是个人偏爱的信息加工方式","场独立性—场依存性（威特金用镶嵌图形测验测量"],"kp":"px-12-29","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-30","s":"普心","c":12,"t":"填空","card":328,"kd":"考点一 人格概述","stem":"人格的含义是什么？","ans":"人格是一个人稳定的心理特征与行为方式，是在遗传和环境相互作用下形成的独特的心理和行为特征的总和。","kw":["人格是一个人稳定的心理特征与行为方式"],"kp":"px-12-30","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-12-31","s":"普心","c":12,"t":"填空","card":329,"kd":"考点一 人格概述","stem":"人格的四个基本特征是什么？","ans":"整体性（人格是一种自我统一的心理特征组合，受自我意识调节）；稳定性（表现为跨情境的一致性和跨时间的持续性，即江山易改秉性难移，但也有可塑性）；独特性（人与人具有不同的气质性格，也有共同性，即群体人格）；社会性（人格在社会环境影响下形成和发展，是社会性与自然性的统一）。此外人格还有功能性，决定一个人的生活方式和活动效率。","kw":["整体性（人格是一种自我统一的心理特征组合，受自我意识调节"],"kp":"px-12-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-32","s":"普心","c":12,"t":"填空","card":330,"kd":"次要卡","stem":"第十二章五个考点如何串记？","ans":"","kw":["四个基本特征记关键词","四种气质类型的名称和特点背下来"],"kp":"px-12-32","noteCut":5,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-33","s":"普心","c":12,"t":"填空","card":331,"kd":"次要卡","stem":"人格测评还有哪些其他方法？","ans":"形容词列表法和、行为观察法Q分类法。","kw":[" 行为观察法"],"kp":"px-12-33","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-34","s":"普心","c":12,"t":"填空","card":332,"kd":"次要卡","stem":"类型理论中的T型人格与A/B型人格分别是什么？","ans":"T型人格好冒险爱刺激，T+型朝向积极健康，T-型具有破坏性质；A型人格性情急躁、成就欲高、易患冠心病；B型人格性情温和、喜欢慢步调。","kw":["T型人格好冒险爱刺激","T-型具有破坏性质；A型人格性情急躁"],"kp":"px-12-34","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-35","s":"普心","c":12,"t":"填空","card":333,"kd":"次要卡","stem":"人格理论的各大取向如何对比小结？","ans":"精神分析关注无意识动力：弗洛伊德强调本能和童年经验、荣格关注集体潜意识、阿德勒强调自卑与超越、弗洛姆从社会文化角度分析人格。人本主义关注人的潜能和自我实现：马斯洛和罗杰斯都相信人有积极成长的力量。社会学习理论强调环境、认知和行为的交互作用。特质理论从奥尔波特到卡特尔到艾森克再到五因素模型，从描述走向量化、从简单走向系统。各大理论视角不同并非互斥，而是从不同层面理解人格的复杂性。","kw":["精神分析关注无意识动力","弗洛伊德强调本能和童年经验"],"kp":"px-12-35","bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-12-36","s":"普心","c":12,"t":"填空","card":334,"kd":"次要卡","stem":"什么是自我控制系统？","ans":"自我控制系统是人格中的自我整合系统，包括自我认知、自我体验和自我调节，其中意志是一种核心的人格力量。","kw":["是人格中的自我整合系统"],"kp":"px-12-36","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-12-L299","s":"普心","c":12,"t":"简答","card":299,"kd":"考点五 人格的成因","stem":"行为遗传学研究遗传对人格影响有哪三种方法？","ans":"家族研究（说明某种人格特征的遗传性，但无法分离环境因素）；双生子研究（同卵双生子人格相关最高，是研究遗传因素的最好方法）；收养研究（比较基因效应与环境效应）。此外分子遗传学从DNA水平研究特定基因对人格的影响。","kw":["家族研究","双生子研究","收养研究"],"kp":"px-12-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L300","s":"普心","c":12,"t":"简答","card":300,"kd":"考点五 人格的成因","stem":"艾森克的唤醒理论与格雷的强化敏感性理论分别是什么？","ans":"艾森克认为内外倾与上行网状激活系统有关，内倾者基线唤醒水平更高。格雷提出强化敏感性理论，认为行为激活系统对奖励敏感，行为抑制系统对惩罚敏感。","kw":["格雷提出强化敏感性理论"],"kp":"px-12-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L301","s":"普心","c":12,"t":"简答","card":301,"kd":"考点五 人格的成因","stem":"克罗宁格的三维人格模型是什么？","ans":"认为新异性寻求、避免伤害和奖励依赖三种特质分别与多巴胺、5-羟色胺和去甲肾上腺素水平有关。","kw":["认为新异性寻求"],"kp":"px-12-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L303","s":"普心","c":12,"t":"简答","card":303,"kd":"考点五 人格的成因","stem":"自我因素在人格发展中起什么作用？","ans":"个体对自我、他人和情境的认知在人格发展中起统合作用。生物学因素是物质基础，后天环境是现实情境，自我因素是内部因素。","kw":["个体对自我","生物学因素"],"kp":"px-12-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L308","s":"普心","c":12,"t":"简答","card":308,"kd":"考点三 人格理论","stem":"弗洛伊德的人格结构包括哪三部分？","ans":"本我遵循快乐原则，为活动提供力比多；自我遵循现实原则，负责决策执行；超我遵循道德原则，包括良心和自我理想。","kw":["本我遵循快乐原则","自我遵循现实原则","超我遵循道德原则"],"kp":"px-12-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L310","s":"普心","c":12,"t":"简答","card":310,"kd":"考点三 人格理论","stem":"弗洛伊德的人格发展五阶段是什么？","ans":"口唇期0到1岁，满足与否影响信任感；肛门期1到3岁，大小便训练影响性格；性器期3到6岁，需解决恋亲情结影响性别认同；潜伏期6到12岁，性冲动被压抑转向学习社交；两性期（生殖期）12到18岁，建立成熟关系。","kw":["口唇期0到1岁","肛门期1到3岁","性器期3到6岁","潜伏期6到12岁"],"kp":"px-12-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L311","s":"普心","c":12,"t":"简答","card":311,"kd":"考点三 人格理论","stem":"弗洛伊德提出的自我防御机制有哪些？作用是什么？","ans":"弗洛伊德提出的自我防御机制包括压抑（最常见）、投射、反向、否认、合理化及文饰作用、转移、抵消、升华等，用于减少本我与超我冲突产生的焦虑。评价：该理论拓宽了心理学领域，但过于强调潜意识且无法证伪。","kw":["包括压抑","评价"],"kp":"px-12-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L314","s":"普心","c":12,"t":"简答","card":314,"kd":"考点三 人格理论","stem":"弗洛姆的社会精神分析理论把人格分为哪五种类型？","ans":"他从社会文化角度分析人格：接纳型（一切依赖他人）；剥削型（以强力获取所需）；囤积型（从储存中获得安全感）；市场型（把自己当作可出售的商品）；生产型（运用自身力量实现潜能，是人类发展的最佳状态）。","kw":["他从社会文化角度分析人格","四位人物绑人名记"],"kp":"px-12-16","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L317","s":"普心","c":12,"t":"简答","card":317,"kd":"考点三 人格理论","stem":"班杜拉的社会学习理论包含哪些核心内容？","ans":"交互决定论认为个人内部因素、行为和环境三者相互作用。观察学习四个阶段：注意过程、保持过程、复制过程和动机过程；动机过程中存在三种强化：直接强化、替代性强化和自我强化。自我效能感是对自己能否完成某行为的主观判断，影响活动的选择和坚持性，四个来源是操作成败、替代经验、言语劝说和情绪唤起。该理论恢复了意识的地位。","kw":["交互决定论认为个人内部因素","观察学习四个阶段","动机过程中存在三种强化","自我效能感","该理论恢复了意识的地位"],"kp":"px-12-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L319","s":"普心","c":12,"t":"简答","card":319,"kd":"考点三 人格理论","stem":"卡特尔的特质理论是什么？","ans":"用因素分析法区分表面特质和根源特质，提出16种相互独立的根源特质，并据此编制16PF问卷。","kw":["用因素分析法区分表面特质和根…"],"kp":"px-12-21","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L320","s":"普心","c":12,"t":"简答","card":320,"kd":"考点三 人格理论","stem":"艾森克的人格三维度模型是什么？","ans":"外倾—内倾（高分者开朗、冲动、善于社交；低分者安静、内省、不喜欢社交）；神经质—情绪稳定性（高分者高焦虑、喜怒无常；低分者稳重、温和、不易焦虑）；精神质—超我功能（高分者自我中心冷漠、具有攻击性；低分者温柔、善感、有同情心）。编制EPQ问卷。","kw":["外倾—内倾","低分者安静","神经质—情绪稳定性","低分者稳重","精神质—超我功能","低分者温柔","编制EPQ问卷"],"kp":"px-12-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L321","s":"普心","c":12,"t":"简答","card":321,"kd":"考点三 人格理论","stem":"大五人格（五因素模型）包括哪五个因素？","ans":"麦克雷和科斯塔提出五因素模型，即OCEAN（老师读作OCENN）。开放性反映对不熟悉环境的探索性；尽责性反映目标导向的行为组织；外倾性反映人际交往密度和获得快乐的能力；宜人性反映与他人和睦相处的程度；神经质反映情绪调节能力和稳定性。每一类特质包含6个方面，是目前最流行的人格特质分类模型。","kw":["麦克雷和科斯塔提出五因素模型","尽责性反映目标导向的行为组织","每一类特质包含6个方面，"],"kp":"px-12-23","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L322","s":"普心","c":12,"t":"简答","card":322,"kd":"考点二 人格结构","stem":"什么是气质？四种气质类型各有什么特点？","ans":"气质是个体生来就有的心理活动的动力性特征，受高级神经活动类型影响，无好坏之分。四种气质类型：胆汁质（精力旺盛但急躁冲动）；多血质；粘液质（安静专注但反应缓慢）；抑郁质（观察细致但多愁善感）。","kw":["气质","四种气质类型"],"kp":"px-12-24","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L323","s":"普心","c":12,"t":"简答","card":323,"kd":"考点二 人格结构","stem":"巴甫洛夫的高级神经活动类型说如何对应气质？","ans":"兴奋型对应胆汁质；活泼型对应多血质；安静型对应粘液质；抑制型对应抑郁质。","kw":["兴奋型对应胆汁质","活泼型对应多血质","安静型对应粘液质","抑制型对应抑郁质"],"kp":"px-12-25","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L324","s":"普心","c":12,"t":"简答","card":324,"kd":"考点二 人格结构","stem":"什么是性格？性格的结构特征包括哪四个方面？","ans":"性格是个人对现实稳定的态度及相应行为方式，具有后天性，有好坏之分。结构特征包括：态度特征（在性格结构中具有核心意义）、意志特征、情绪特征、理智特征。","kw":["性格","结构特征包括"],"kp":"px-12-26","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L325","s":"普心","c":12,"t":"简答","card":325,"kd":"考点二 人格结构","stem":"性格类型如何划分？","ans":"性格类型按知情意何者占优分理智型、情绪型和意志型；按心理活动倾向分荣格的外倾型和内倾型。","kw":["按知情意何者占优分理智型"],"kp":"px-12-27","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L331","s":"普心","c":12,"t":"简答","card":331,"kd":"次要卡","stem":"人格测评还有哪些其他方法？","ans":"行为观察法、形容词列表法和Q分类法。","kw":["行为观察法"],"kp":"px-12-33","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L332","s":"普心","c":12,"t":"简答","card":332,"kd":"次要卡","stem":"类型理论中的T型人格与A/B型人格分别是什么？","ans":"T型人格好冒险爱刺激，T+型朝向积极健康，T-型具有破坏性质；A型人格性情急躁、成就欲高、易患冠心病；B型人格性情温和、喜欢慢步调。","kw":["T型人格好冒险爱刺激","A型人格性情急躁","B型人格性情温和"],"kp":"px-12-34","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-12-L333","s":"普心","c":12,"t":"简答","card":333,"kd":"次要卡","stem":"人格理论的各大取向如何对比小结？","ans":"精神分析关注无意识动力：弗洛伊德强调本能和童年经验、荣格关注集体潜意识、阿德勒强调自卑与超越、弗洛姆从社会文化角度分析人格。人本主义关注人的潜能和自我实现：马斯洛和罗杰斯都相信人有积极成长的力量。社会学习理论强调环境、认知和行为的交互作用。特质理论从奥尔波特到卡特尔到艾森克再到五因素模型，从描述走向量化、从简单走向系统。各大理论视角不同并非互斥，而是从不同层面理解人格的复杂性。","kw":["精神分析关注无意识动力","社会学习理论强调环境","各大理论视角不同并非互斥，而"],"kp":"px-12-35","alt":1,"bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-12-L334","s":"普心","c":12,"t":"简答","card":334,"kd":"次要卡","stem":"什么是自我控制系统？","ans":"自我控制系统是人格中的自我整合系统，包括自我认知、自我体验和自我调节，其中意志是一种核心的人格力量。","kw":["是人格中的自我整合系统"],"kp":"px-12-36","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-13-1","s":"普心","c":13,"t":"填空","card":335,"kd":"考点三 学习理论","stem":"学习的联结理论的核心观点是什么？代表人物有哪三位？","ans":"强调学习是在刺激与反应之间建立联结。三位代表人物：巴甫洛夫、桑代克、斯金纳。","kw":["强调学习是在刺激与反应之间建立联结"],"kp":"px-13-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-2","s":"普心","c":13,"t":"填空","card":336,"kd":"考点三 学习理论","stem":"巴甫洛夫的经典条件作用及其规律有哪些？","ans":"通过食物与铃声多次配对，使中性刺激变为条件刺激，引起条件反应。规律包括：习得（条件刺激与无条件刺激在时间上结合）；消退（条件反射形成后得不到强化会逐渐消失，但会出现自发恢复）；泛化（相似刺激也会引起条件反应）；分化（区分不同刺激的能力）；二级条件作用（在已有条件反射基础上建立更复杂的条件反射）。","kw":["使中性刺激变为条件刺激","习得（条件刺激与无条件刺激在时间上结合"],"kp":"px-13-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-3","s":"普心","c":13,"t":"填空","card":337,"kd":"考点三 学习理论","stem":"桑代克的尝试错误学习提出了哪三大规律？","ans":"通过迷笼实验提出三大学习规律：准备律；练习律；效果律","kw":["通过迷笼实验提出三大学习规律"],"kp":"px-13-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-4","s":"普心","c":13,"t":"填空","card":338,"kd":"考点三 学习理论","stem":"斯金纳的操作性条件作用包括哪些内容？","ans":"通过斯金纳箱实验发现两种反应类型：应答性反应由刺激引发；操作性反应是机体自发行为。强化分两种：正强化是增加刺激时行为概率增加，负强化是减少刺激时行为概率增加。强化安排分连续强化和间隔强化，间隔强化又分固定时间（教材：固定时距）、固定比例（教材：固定比率）、变化时间（教材：变化时距）和变化比例（教材：变化比率）四种；其中变化比例（变化比率）强化反应建立快且持续性最强。","kw":["通过斯金纳箱实验发现两种反应类型","操作性反应是机体自发行为"],"kp":"px-13-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-5","s":"普心","c":13,"t":"填空","card":339,"kd":"考点三 学习理论","stem":"经典条件作用与操作性条件作用的主要区别是什么？","ans":"前者是被动的应答性反应，刺激在前反应在后；后者是主动的自发反应，反应在前刺激在后。","kw":["前者是被动的应答性反应","刺激在前反应在后；后者是主动的自发反应"],"kp":"px-13-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-6","s":"普心","c":13,"t":"填空","card":340,"kd":"考点三 学习理论","stem":"苛勒的顿悟理论是什么？","ans":"通过黑猩猩取香蕉实验发现学习不是试误，而是通过顿悟实现的；猩猩突然发现了箱子与香蕉之间的关系，在认知结构中重新组合已有经验找到了解决方法。顿悟学习学到的是手段与目的之间的认知关系，而非刺激反应的特定联结。","kw":["顿悟学习学到的"],"kp":"px-13-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-7","s":"普心","c":13,"t":"填空","card":341,"kd":"考点三 学习理论","stem":"托尔曼的认知学习理论提出了哪两个重要概念？","ans":"认知地图：关于局部环境的综合表象，包括方向、距离甚至时间关系；位置学习实验证明动物根据对情境的认知形成了认知地图。潜伏学习：实验表明强化不是学习所必需的，白鼠在没有食物强化的头十天同样进行了学习，只是效果没表现出来，一旦得到食物成绩就骤然上升；说明学习可以在没有强化的情况下发生，结果不一定体现在外显行为中。","kw":["关于局部环境的综合表象","距离甚至时间关系；位置学习实验证明动物根据对情境的认知形成了认知地图"],"kp":"px-13-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-8","s":"普心","c":13,"t":"填空","card":342,"kd":"考点三 学习理论","stem":"建构主义学习理论的两种取向是什么？","ans":"强调新旧经验之间的反复双向交互作用。分两种取向：个体建构主义（教材：个人建构主义／激进建构主义；老师此处亦读作“社会建构主义”，按教材更正）认为知识不是对现实的准确表征，学习是学生主动建构知识的过程，教学不是传递知识而是知识经验的转换；社会建构主义把学习置于社会文化背景中，维果茨基认为通过与他人共同参与活动，个体能内化新策略和新知识","kw":["分两种取向"],"kp":"px-13-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-9","s":"普心","c":13,"t":"填空","card":343,"kd":"考点二 学习的规律","stem":"学习进程有哪四个特点？","ans":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在高原现象，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","kw":["成绩随学习进程逐步提高","先快后慢（原因是开始时新鲜感强动机高"],"kp":"px-13-9","bt":"b","bp":"ans","bq":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在______，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","bl":["高原现象"],"bpos":[45],"bsrc":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在高原现象，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","nq":1},{"id":"px-13-10","s":"普心","c":13,"t":"填空","card":344,"kd":"考点二 学习的规律","stem":"提高学习效率的条件有哪些？","ans":"明确学习目标；灵活应用整体学习和分解学习；恰当安排学习时间，集中和分散结合；过度学习到150%效果最佳；加强反馈；发挥原有知识作用，发挥元认知作用；发挥情绪和动机作用。","kw":["灵活应用整体学习和分解学习","恰当安排学习时间，集中和分散结合"],"kp":"px-13-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-11","s":"普心","c":13,"t":"填空","card":345,"kd":"考点二 学习的规律","stem":"什么是学习迁移？按不同标准如何分类？","ans":"学习迁移是指一种情境中获得的知识技能影响另一种学习。按效果分正迁移（有积极影响）和负迁移（有消极影响）；按情境相似度分近迁移（情境相似）和远迁移（情境差异大）；按意识程度分有意迁移和无意迁移。","kw":["是指一种情境中获得的知识技能影响另一种学习"],"kp":"px-13-11","bt":"b","bp":"ans","bq":"学习迁移是指一种情境中获得的知识技能影响另一种学习。按效果分正迁移（有积极影响）和______（有消极影响）；按情境相似度分近迁移（情境相似）和______（情境差异大）；按意识程度分有意迁移和无意迁移。","bl":["负迁移","远迁移"],"bpos":[41,69],"bsrc":"学习迁移是指一种情境中获得的知识技能影响另一种学习。按效果分正迁移（有积极影响）和负迁移（有消极影响）；按情境相似度分近迁移（情境相似）和远迁移（情境差异大）；按意识程度分有意迁移和无意迁移。","nq":2},{"id":"px-13-12","s":"普心","c":13,"t":"填空","card":346,"kd":"考点二 学习的规律","stem":"促进学习迁移的方法有哪些？","ans":"第一，进行有意义的过度学习，在已掌握技能后继续练习可保证较大迁移；第二，掌握迁移和元认知策略，有意识地对知识进行抽象概括；第三，激发使用迁移策略的动机，主动寻找新旧情境的联系。","kw":["进行有意义的过度学习","在已掌握技能后继续练习可保证较大迁移"],"kp":"px-13-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-13","s":"普心","c":13,"t":"填空","card":347,"kd":"考点一 学习概述","stem":"学习的定义是什么？","ans":"学习是个体在一定情境下由于经验而产生的行为或行为潜能的比较持久的变化。","kw":["学习"],"kp":"px-13-13","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-13-14","s":"普心","c":13,"t":"填空","card":348,"kd":"考点一 学习概述","stem":"学习概念的三个含义是什么？","ans":"第一个，学习是由练习或经验引起的，不是由成熟或疲劳导致；第二个，学习以行为或行为潜能的改变为标志；第三个，学习引起的变化是相对持久的。","kw":["学习是由练习或经验引起的"],"kp":"px-13-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-15","s":"普心","c":13,"t":"填空","card":349,"kd":"考点一 学习概述","stem":"学习可以从哪四个角度分类？","ans":"按学习材料与原有知识的关系分意义学习和机械学习；按学习方式分接受学习和发现学习；","kw":["按学习材料与原有知识的关系分意义学习和机械学习"],"kp":"px-13-15","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-16","s":"普心","c":13,"t":"填空","card":350,"kd":"次要卡","stem":"以教师为中心的教学方法有哪两种？","ans":"直接教学（教师高控制力，创造结构化学习环境）和掌握性教学（给足够时间让所有学生掌握内容）。","kw":["创造结构化学习环境","和掌握性教学（给足够时间让所有学生掌握内容"],"kp":"px-13-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-17","s":"普心","c":13,"t":"填空","card":351,"kd":"次要卡","stem":"以学生为中心的教学方法有哪三种？","ans":"发现式教学（学生主动发现知识）；讲解式教学（学生以有意义方式整合新知识）；建构主义教学法（强调学习的情境性，创设认知学徒制）。","kw":["发现式教学（学生主动发现知识","讲解式教学（学生以有意义方式整合新知识"],"kp":"px-13-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-18","s":"普心","c":13,"t":"填空","card":352,"kd":"次要卡","stem":"第十三章四个考点如何串记？","ans":"","kw":["学习的概念记关键词","考点二学习的规律"],"kp":"px-13-18","noteCut":4,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-19","s":"普心","c":13,"t":"填空","card":353,"kd":"次要卡","stem":"学习理论的两大取向如何对比小结？","ans":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注认知地图和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","kw":["联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结"],"kp":"px-13-19","bt":"b","bp":"ans","bq":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注______和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","bl":["认知地图"],"bpos":[110],"bsrc":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注认知地图和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","nq":1},{"id":"px-13-20","s":"普心","c":13,"t":"填空","card":354,"kd":"次要卡","stem":"什么是认知学习？","ans":"认知学习是指以认知加工过程为对象的学习，分初级认知学习（如知觉学习）和高级认知学习（如语言学习）。","kw":["是指以认知加工过程为对象的学习，分初级认知学习（如知觉学习"],"kp":"px-13-20","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-13-21","s":"普心","c":13,"t":"填空","card":355,"kd":"次要卡","stem":"什么是动作技能学习？如何分类？","ans":"动作技能学习是指通过练习形成一系列稳定动作方式的过程。分类包括连续技能（如打字）和非连续技能（如投掷标枪）；封闭技能（如体操）和开放技能（如打篮球）；精细动作技能（如弹钢琴）和粗大动作技能（如跑步）。","kw":["是指通过练习形成一系列稳定动作方式的过程"],"kp":"px-13-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L335","s":"普心","c":13,"t":"简答","card":335,"kd":"考点三 学习理论","stem":"学习的联结理论的核心观点是什么？代表人物有哪三位？","ans":"强调学习是在刺激与反应之间建立联结。三位代表人物：巴甫洛夫、桑代克、斯金纳。","kw":["强调学习","三位代表人物"],"kp":"px-13-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L336","s":"普心","c":13,"t":"简答","card":336,"kd":"考点三 学习理论","stem":"巴甫洛夫的经典条件作用及其规律有哪些？","ans":"通过食物与铃声多次配对，使中性刺激变为条件刺激，引起条件反应。规律包括：习得（条件刺激与无条件刺激在时间上结合）；消退（条件反射形成后得不到强化会逐渐消失，但会出现自发恢复）；泛化（相似刺激也会引起条件反应）；分化（区分不同刺激的能力）；二级条件作用（在已有条件反射基础上建立更复杂的条件反射）。","kw":["通过食物与铃声多次配对","规律包括","二级条件作用"],"kp":"px-13-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L337","s":"普心","c":13,"t":"简答","card":337,"kd":"考点三 学习理论","stem":"桑代克的尝试错误学习提出了哪三大规律？","ans":"通过迷笼实验提出三大学习规律：准备律；练习律；效果律","kw":["通过迷笼实验提出三大学习规律"],"kp":"px-13-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L338","s":"普心","c":13,"t":"简答","card":338,"kd":"考点三 学习理论","stem":"斯金纳的操作性条件作用包括哪些内容？","ans":"通过斯金纳箱实验发现两种反应类型：应答性反应由刺激引发；操作性反应是机体自发行为。强化分两种：正强化是增加刺激时行为概率增加，负强化是减少刺激时行为概率增加。强化安排分连续强化和间隔强化，间隔强化又分固定时间（教材：固定时距）、固定比例（教材：固定比率）、变化时间（教材：变化时距）和变化比例（教材：变化比率）四种；其中变化比例（变化比率）强化反应建立快且持续性最强。","kw":["操作性反应","强化分两种：正强化","强化安排分连续强化和间隔强化","其中变化比例"],"kp":"px-13-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L339","s":"普心","c":13,"t":"简答","card":339,"kd":"考点三 学习理论","stem":"经典条件作用与操作性条件作用的主要区别是什么？","ans":"前者是被动的应答性反应，刺激在前反应在后；后者是主动的自发反应，反应在前刺激在后。","kw":["前者","后者"],"kp":"px-13-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L340","s":"普心","c":13,"t":"简答","card":340,"kd":"考点三 学习理论","stem":"苛勒的顿悟理论是什么？","ans":"通过黑猩猩取香蕉实验发现学习不是试误，而是通过顿悟实现的；猩猩突然发现了箱子与香蕉之间的关系，在认知结构中重新组合已有经验找到了解决方法。顿悟学习学到的是手段与目的之间的认知关系，而非刺激反应的特定联结。","kw":["顿悟学习学到的"],"kp":"px-13-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L341","s":"普心","c":13,"t":"简答","card":341,"kd":"考点三 学习理论","stem":"托尔曼的认知学习理论提出了哪两个重要概念？","ans":"认知地图：关于局部环境的综合表象，包括方向、距离甚至时间关系；位置学习实验证明动物根据对情境的认知形成了认知地图。潜伏学习：实验表明强化不是学习所必需的，白鼠在没有食物强化的头十天同样进行了学习，只是效果没表现出来，一旦得到食物成绩就骤然上升；说明学习可以在没有强化的情况下发生，结果不一定体现在外显行为中。","kw":["认知地图","潜伏学习：实验表明强化不"],"kp":"px-13-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L342","s":"普心","c":13,"t":"简答","card":342,"kd":"考点三 学习理论","stem":"建构主义学习理论的两种取向是什么？","ans":"强调新旧经验之间的反复双向交互作用。分两种取向：个体建构主义（教材：个人建构主义／激进建构主义；老师此处亦读作“社会建构主义”，按教材更正）认为知识不是对现实的准确表征，学习是学生主动建构知识的过程，教学不是传递知识而是知识经验的转换；社会建构主义把学习置于社会文化背景中，维果茨基认为通过与他人共同参与活动，个体能内化新策略和新知识","kw":["分两种取向"],"kp":"px-13-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L343","s":"普心","c":13,"t":"简答","card":343,"kd":"考点二 学习的规律","stem":"学习进程有哪四个特点？","ans":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在高原现象，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","kw":["第一，成绩随学习进程逐步提高…","第二，学习进程中存在高原现象…","第三，学习进程不均匀，呈波浪…","第四，存在个体差异。"],"kp":"px-13-9","alt":1,"bt":"b","bp":"ans","bq":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在______，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","bl":["高原现象"],"bpos":[45],"bsrc":"第一，成绩随学习进程逐步提高，先快后慢（原因是开始时新鲜感强动机高）；第二，学习进程中存在高原现象，即成绩暂时停滞，主要原因是旧知识或技能结构的限制；第三，学习进程不均匀，呈波浪式；第四，存在个体差异。","nq":1},{"id":"px-13-L344","s":"普心","c":13,"t":"简答","card":344,"kd":"考点二 学习的规律","stem":"提高学习效率的条件有哪些？","ans":"明确学习目标；灵活应用整体学习和分解学习；恰当安排学习时间，集中和分散结合；过度学习到150%效果最佳；加强反馈；发挥原有知识作用，发挥元认知作用；发挥情绪和动机作用。","kw":["明确学习目标","灵活应用整体学习和分解学习","恰当安排学习时间","过度学习到150%效果最佳","发挥原有知识作用","发挥情绪和动机作用"],"kp":"px-13-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L346","s":"普心","c":13,"t":"简答","card":346,"kd":"考点二 学习的规律","stem":"促进学习迁移的方法有哪些？","ans":"第一，进行有意义的过度学习，在已掌握技能后继续练习可保证较大迁移；第二，掌握迁移和元认知策略，有意识地对知识进行抽象概括；第三，激发使用迁移策略的动机，主动寻找新旧情境的联系。","kw":["第一，进行有意义的过度学习，…","第二，掌握迁移和元认知策略，…","第三，激发使用迁移策略的动机…"],"kp":"px-13-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L347","s":"普心","c":13,"t":"简答","card":347,"kd":"考点一 学习概述","stem":"学习的定义是什么？","ans":"学习是个体在一定情境下由于经验而产生的行为或行为潜能的比较持久的变化。","kw":["学习"],"kp":"px-13-13","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-13-L350","s":"普心","c":13,"t":"简答","card":350,"kd":"次要卡","stem":"以教师为中心的教学方法有哪两种？","ans":"直接教学（教师高控制力，创造结构化学习环境）和掌握性教学（给足够时间让所有学生掌握内容）。","kw":["直接教学"],"kp":"px-13-16","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L351","s":"普心","c":13,"t":"简答","card":351,"kd":"次要卡","stem":"以学生为中心的教学方法有哪三种？","ans":"发现式教学（学生主动发现知识）；讲解式教学（学生以有意义方式整合新知识）；建构主义教学法（强调学习的情境性，创设认知学徒制）。","kw":["发现式教学","讲解式教学","建构主义教学法"],"kp":"px-13-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-13-L353","s":"普心","c":13,"t":"简答","card":353,"kd":"次要卡","stem":"学习理论的两大取向如何对比小结？","ans":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注认知地图和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","kw":["两类理论并非互斥，而"],"kp":"px-13-19","alt":1,"bt":"b","bp":"ans","bq":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注______和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","bl":["认知地图"],"bpos":[110],"bsrc":"联结理论从巴甫洛夫到桑代克到斯金纳都强调刺激与反应的联结，但巴甫洛夫关注被动应答行为，桑代克关注试误过程，斯金纳关注操作行为和强化安排。认知理论从苛勒到托尔曼再到建构主义都强调学习中的认知过程，但苛勒关注顿悟、托尔曼关注认知地图和潜伏学习、建构主义关注新旧经验的相互作用。两类理论并非互斥，而是从不同角度解释了学习机制。","nq":1},{"id":"px-14-1","s":"普心","c":14,"t":"填空","card":356,"kd":"考点五 心理社会性发展","stem":"什么是依恋？哈罗的恒河猴实验证明了什么？","ans":"依恋是指人与人之间建立起的亲密关系。哈罗的恒河猴实验证明接触舒适是依恋的重要部分。","kw":["依恋是指人与人之间建立起的亲密关系"],"kp":"px-14-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-2","s":"普心","c":14,"t":"填空","card":357,"kd":"考点五 心理社会性发展","stem":"安斯沃斯提出的四种依恋类型分别是什么？","ans":"通过陌生情境测验提出：安全型——积极探索环境，母亲离开时不安但很快能平静；回避型——对母亲是否在场无所谓；抗拒型——紧挨母亲不主动探索，母亲回来时矛盾；混乱型——兼具抗拒型和回避型特征。","kw":["通过陌生情境测验提出","母亲离开时不安但很快能平静"],"kp":"px-14-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-3","s":"普心","c":14,"t":"填空","card":358,"kd":"考点五 心理社会性发展","stem":"皮亚杰的道德发展理论分为哪两个阶段？","ans":"皮亚杰用对偶故事法研究，认为道德发展分两个阶段：他律道德阶段（5到8岁，从行为结果判断）；自律道德阶段（8到12岁，从行为动机判断）。","kw":["皮亚杰用对偶故事法研究","认为道德发展分两个阶段"],"kp":"px-14-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-4","s":"普心","c":14,"t":"填空","card":359,"kd":"考点五 心理社会性发展","stem":"科尔伯格的道德发展三水平六阶段是什么？","ans":"用海因茨偷药故事提出三水平六阶段：前习俗道德水平包括服从和惩罚取向、工具性交换取向；习俗道德水平包括好孩子取向、社会秩序取向；后习俗道德水平包括社会契约取向、普遍伦理取向。","kw":["用海因茨偷药故事提出三水平六阶段","前习俗道德水平包括服从和惩罚取向"],"kp":"px-14-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-5","s":"普心","c":14,"t":"填空","card":360,"kd":"考点五 心理社会性发展","stem":"埃里克森的心理社会性发展理论的核心观点是什么？","ans":"强调社会文化因素对自我的影响，将人格发展分为八个阶段，每个阶段有一个核心冲突需要解决。","kw":["强调社会文化因素对自我的影响","将人格发展分为八个阶段"],"kp":"px-14-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-6","s":"普心","c":14,"t":"填空","card":361,"kd":"考点五 心理社会性发展","stem":"埃里克森八阶段的名称和对应年龄分别是什么？","ans":"出生到一岁——基本信任对不信任；一到三岁——自主对羞愧和怀疑；三到六岁——主动对内疚；六到十二岁——勤奋对自卑；十二到二十岁——自我同一性对角色混乱；二十到四十岁——亲密对孤独；四十到六十五岁——繁殖对停滞；六十五岁以上——自我整合对绝望。","kw":["出生到一岁——基本信任对不信任","一到三岁——自主对羞愧和怀疑；三到六岁——主动对内疚"],"kp":"px-14-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-7","s":"普心","c":14,"t":"填空","card":362,"kd":"考点四 高级认知能力的发展","stem":"语言发展分为哪三个时期？","ans":"前语言期（婴儿依次经历哭、咕咕和呀呀阶段）；单词句期（10到14个月说出第一个有意义的词，1岁半到2岁出现命名爆炸）；电报句期（开始组合简单句子）。","kw":["单词句期（10到14个月说出第一个有意义的词","电报句期（开始组合简单句子"],"kp":"px-14-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-8","s":"普心","c":14,"t":"填空","card":363,"kd":"考点四 高级认知能力的发展","stem":"语言发展的三种理论（观）分别是什么？","ans":"斯金纳的学习观认为语言是被教会的；乔姆斯基的先天观认为人有语言获得装置；交互作用观认为先天因素和后天环境共同决定。","kw":["斯金纳的学习观认为语言是被教会的","乔姆斯基的先天观认为人有语言获得装置"],"kp":"px-14-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-9","s":"普心","c":14,"t":"填空","card":364,"kd":"考点四 高级认知能力的发展","stem":"皮亚杰认为认知发展的本质是什么？","ans":"认知发展的本质是图式的发展；图式是组织化的动作或心理表征。发展经由组织和适应两种过程，适应包括同化（图式的量变）和顺应（图式的质变）。","kw":["认知发展的本质是图式的发展","图式是组织化的动作或心理表征"],"kp":"px-14-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-10","s":"普心","c":14,"t":"填空","card":365,"kd":"考点四 高级认知能力的发展","stem":"皮亚杰认知发展四阶段的名称和年龄特征是什么？","ans":"感知运动阶段（0到2岁）：靠感觉与动作认识世界，掌握客体永久性。前运算阶段（2到7岁）：能在心理上操作符号，但存在自我中心（以三山实验为证），尚未形成守恒概念。具体运算阶段（7到11或12岁）：获得了去中心化和可逆性，能完成守恒实验，但只能对具体事物进行运算。形式运算阶段（11或12岁以后）：可进行抽象符号运算和假设演绎推理。","kw":["靠感觉与动作认识世界"],"kp":"px-14-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-11","s":"普心","c":14,"t":"填空","card":366,"kd":"考点二 个体发展的主要研究方法","stem":"什么是横断研究设计？优缺点是什么？","ans":"在同一时间对不同年龄被试进行比较。优点是省时经济、信息量大；缺点是不连续，难确定因果关系，有同辈效应。","kw":["在同一时间对不同年龄被试进行比较","优点是省时经济"],"kp":"px-14-11","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-12","s":"普心","c":14,"t":"填空","card":367,"kd":"考点二 个体发展的主要研究方法","stem":"什么是纵向研究设计？优缺点是什么？","ans":"对同一对象长期追踪反复观测。优点是系统详尽、能探因果；缺点是耗时费力，易流失被试，有跨代效应（又称时代效应）。","kw":["对同一对象长期追踪反复观测","优点是系统详尽"],"kp":"px-14-12","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-13","s":"普心","c":14,"t":"填空","card":368,"kd":"考点二 个体发展的主要研究方法","stem":"什么是聚合交叉设计？","ans":"融合横断和纵向两种设计，兼具两者优点。","kw":[" 三种设计对比记关"],"kp":"px-14-13","noteCut":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-14","s":"普心","c":14,"t":"填空","card":369,"kd":"考点一 个体发展","stem":"关键期与敏感期有什么区别？","ans":"关键期是指生命中一段时期，如果个体不能获得某种经验，将失去发展与该经验相关功能的机会；劳伦兹的印刻现象证明了关键期的存在。敏感期是指某一心理特征发展对环境最敏感的时期，错过仍可发展但更困难。","kw":["关键期是指生命中一段时期","如果个体不能获得某种经验"],"kp":"px-14-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-15","s":"普心","c":14,"t":"填空","card":370,"kd":"考点一 个体发展","stem":"个体发展的领域与分期如何划分？","ans":"从横向分生理发展、认知发展和心理社会性发展；从纵向分八个阶段：产前期、婴儿期、童年早期、童年中期与晚期、青少年期、成年早期、成年中期和成年晚期。","kw":["从横向分生理发展","认知发展和心理社会性发展"],"kp":"px-14-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-16","s":"普心","c":14,"t":"填空","card":371,"kd":"次要卡","stem":"婴儿情绪发展的时间表是什么？","ans":"婴儿前六七个月表现出基本情绪，两岁半出现复合情绪及自我意识情绪。","kw":[" 两岁半出现复合情"],"kp":"px-14-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-17","s":"普心","c":14,"t":"填空","card":372,"kd":"次要卡","stem":"第十四章五个考点如何串记？","ans":"","kw":["关键期与敏感期区分记关键词","聚合交叉三种设计，优缺点记关键词"],"kp":"px-14-17","noteCut":5,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-18","s":"普心","c":14,"t":"填空","card":373,"kd":"次要卡","stem":"身体发展的基本规律是什么？","ans":"从产前期三个周期开始；婴儿期脑重发展迅速，二岁达成人75%；青少年期是身体发展又一高峰期。","kw":["从产前期三个周期开始","青少年期是身体发展又一高峰期"],"kp":"px-14-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-19","s":"普心","c":14,"t":"填空","card":374,"kd":"次要卡","stem":"动作发展的原则与里程碑是什么？","ans":"粗大运动遵循头尾原则和近远原则；精细运动方面，四到六个月婴儿的够物和抓握是重要里程碑。","kw":[" 四到六个月婴儿的"],"kp":"px-14-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-20","s":"普心","c":14,"t":"填空","card":375,"kd":"次要卡","stem":"感知觉发展的经典研究方法有哪些？","ans":"感知觉是认识世界最初的心理活动。经典研究方法包括习惯化与去习惯化法、违背预期范式、视觉偏好、视崖实验、高振幅吸吮技术和诱发电位法。","kw":["感知觉是认识世界最初的心理活动","经典研究方法包括习惯化与去习惯化法"],"kp":"px-14-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-21","s":"普心","c":14,"t":"填空","card":376,"kd":"次要卡","stem":"个体发展有哪些特征？","ans":"个体发展所指向的变化是相对持久的；有内在规律按顺序展开；是连续的；不仅包括成长也包括衰老。","kw":["个体发展所指向的变化是相对持久的；有内在规律按顺序展开"],"kp":"px-14-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-22","s":"普心","c":14,"t":"填空","card":377,"kd":"次要卡","stem":"遗传与环境在个体发展中如何起作用？","ans":"皮亚杰提出相互作用效应模型，认为遗传和环境相互影响；萨梅罗夫提出相互交易模型，主张两者相互影响，环境影响遗传起作用的方式，遗传影响环境起作用的方式。","kw":["皮亚杰提出相互作用效应模型","认为遗传和环境相互影响"],"kp":"px-14-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L357","s":"普心","c":14,"t":"简答","card":357,"kd":"考点五 心理社会性发展","stem":"安斯沃斯提出的四种依恋类型分别是什么？","ans":"通过陌生情境测验提出：安全型——积极探索环境，母亲离开时不安但很快能平静；回避型——对母亲是否在场无所谓；抗拒型——紧挨母亲不主动探索，母亲回来时矛盾；混乱型——兼具抗拒型和回避型特征。","kw":["通过陌生情境测验提出","回避型——对母亲","抗拒型——紧挨母亲不主动探索"],"kp":"px-14-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L358","s":"普心","c":14,"t":"简答","card":358,"kd":"考点五 心理社会性发展","stem":"皮亚杰的道德发展理论分为哪两个阶段？","ans":"皮亚杰用对偶故事法研究，认为道德发展分两个阶段：他律道德阶段（5到8岁，从行为结果判断）；自律道德阶段（8到12岁，从行为动机判断）。","kw":["皮亚杰用对偶故事法研究","自律道德阶段"],"kp":"px-14-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L359","s":"普心","c":14,"t":"简答","card":359,"kd":"考点五 心理社会性发展","stem":"科尔伯格的道德发展三水平六阶段是什么？","ans":"用海因茨偷药故事提出三水平六阶段：前习俗道德水平包括服从和惩罚取向、工具性交换取向；习俗道德水平包括好孩子取向、社会秩序取向；后习俗道德水平包括社会契约取向、普遍伦理取向。","kw":["习俗道德水平包括好孩子取向"],"kp":"px-14-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L360","s":"普心","c":14,"t":"简答","card":360,"kd":"考点五 心理社会性发展","stem":"埃里克森的心理社会性发展理论的核心观点是什么？","ans":"强调社会文化因素对自我的影响，将人格发展分为八个阶段，每个阶段有一个核心冲突需要解决。","kw":["强调社会文化因素对自我的影响"],"kp":"px-14-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L361","s":"普心","c":14,"t":"简答","card":361,"kd":"考点五 心理社会性发展","stem":"埃里克森八阶段的名称和对应年龄分别是什么？","ans":"出生到一岁——基本信任对不信任；一到三岁——自主对羞愧和怀疑；三到六岁——主动对内疚；六到十二岁——勤奋对自卑；十二到二十岁——自我同一性对角色混乱；二十到四十岁——亲密对孤独；四十到六十五岁——繁殖对停滞；六十五岁以上——自我整合对绝望。","kw":["一到三岁——自主对羞愧和怀疑","三到六岁——主动对内疚","六到十二岁——勤奋对自卑","二十到四十岁——亲密对孤独","四十到六十五岁——繁殖对停滞"],"kp":"px-14-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L363","s":"普心","c":14,"t":"简答","card":363,"kd":"考点四 高级认知能力的发展","stem":"语言发展的三种理论（观）分别是什么？","ans":"斯金纳的学习观认为语言是被教会的；乔姆斯基的先天观认为人有语言获得装置；交互作用观认为先天因素和后天环境共同决定。","kw":["斯金纳的学习观认为语言"],"kp":"px-14-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L365","s":"普心","c":14,"t":"简答","card":365,"kd":"考点四 高级认知能力的发展","stem":"皮亚杰认知发展四阶段的名称和年龄特征是什么？","ans":"感知运动阶段（0到2岁）：靠感觉与动作认识世界，掌握客体永久性。前运算阶段（2到7岁）：能在心理上操作符号，但存在自我中心（以三山实验为证），尚未形成守恒概念。具体运算阶段（7到11或12岁）：获得了去中心化和可逆性，能完成守恒实验，但只能对具体事物进行运算。形式运算阶段（11或12岁以后）：可进行抽象符号运算和假设演绎推理。","kw":["感知运动阶段","前运算阶段","具体运算阶段","形式运算阶段"],"kp":"px-14-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L366","s":"普心","c":14,"t":"简答","card":366,"kd":"考点二 个体发展的主要研究方法","stem":"什么是横断研究设计？优缺点是什么？","ans":"在同一时间对不同年龄被试进行比较。优点是省时经济、信息量大；缺点是不连续，难确定因果关系，有同辈效应。","kw":["优点","缺点"],"kp":"px-14-11","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-L367","s":"普心","c":14,"t":"简答","card":367,"kd":"考点二 个体发展的主要研究方法","stem":"什么是纵向研究设计？优缺点是什么？","ans":"对同一对象长期追踪反复观测。优点是系统详尽、能探因果；缺点是耗时费力，易流失被试，有跨代效应（又称时代效应）。","kw":["对同一对象长期追踪反复观测","优点","缺点"],"kp":"px-14-12","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-14-L369","s":"普心","c":14,"t":"简答","card":369,"kd":"考点一 个体发展","stem":"关键期与敏感期有什么区别？","ans":"关键期是指生命中一段时期，如果个体不能获得某种经验，将失去发展与该经验相关功能的机会；劳伦兹的印刻现象证明了关键期的存在。敏感期是指某一心理特征发展对环境最敏感的时期，错过仍可发展但更困难。","kw":["关键期","敏感期"],"kp":"px-14-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L373","s":"普心","c":14,"t":"简答","card":373,"kd":"次要卡","stem":"身体发展的基本规律是什么？","ans":"从产前期三个周期开始；婴儿期脑重发展迅速，二岁达成人75%；青少年期是身体发展又一高峰期。","kw":["从产前期三个周期开始","婴儿期脑重发展迅速","青少年期"],"kp":"px-14-18","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L374","s":"普心","c":14,"t":"简答","card":374,"kd":"次要卡","stem":"动作发展的原则与里程碑是什么？","ans":"粗大运动遵循头尾原则和近远原则；精细运动方面，四到六个月婴儿的够物和抓握是重要里程碑。","kw":["精细运动方面"],"kp":"px-14-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-14-L375","s":"普心","c":14,"t":"简答","card":375,"kd":"次要卡","stem":"感知觉发展的经典研究方法有哪些？","ans":"感知觉是认识世界最初的心理活动。经典研究方法包括习惯化与去习惯化法、违背预期范式、视觉偏好、视崖实验、高振幅吸吮技术和诱发电位法。","kw":["感知觉"],"kp":"px-14-20","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-1","s":"普心","c":15,"t":"填空","card":378,"kd":"考点三 社会影响与人的行为","stem":"什么是从众？阿希的实验发现了什么？从众的原因有哪些？","ans":"从众是指个人的观念与行为向多数人一致的方向变化。阿希的线段判断实验发现有33%以上的被试会从众。从众的原因：行为参照、偏离的恐惧和群体凝聚力。","kw":["从众是指个人的观念与行为向多数人一致的方向变化"],"kp":"px-15-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-2","s":"普心","c":15,"t":"填空","card":379,"kd":"考点三 社会影响与人的行为","stem":"什么是依从？三种依从策略分别是什么？","ans":"依从是指受他人请求而行动。三种策略：登门槛技术（先提小要求再提大要求）；留面子效应（先提大要求再提小要求）；低球技术low-ball，接受小要求后马上提出更大代价的要求","kw":["依从是指受他人请求而行动"],"kp":"px-15-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-3","s":"普心","c":15,"t":"填空","card":380,"kd":"考点三 社会影响与人的行为","stem":"什么是服从？服从的原因和影响服从的因素有哪些？","ans":"服从是指按照他人命令做出行为。服从的原因包括合法权力和责任转移。影响服从的因素包括他人支持、对行为后果的意识和个性因素。","kw":["服从是指按照他人命令做出行为","服从的原因包括合法权力和责任转移"],"kp":"px-15-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-4","s":"普心","c":15,"t":"填空","card":381,"kd":"考点三 社会影响与人的行为","stem":"社会助长与社会惰化分别指什么？","ans":"社会助长是有他人在场时行为效率提高，异性在场有性别助长作用。社会惰化是群体一起做事时个人付出比单独时偏少。头脑风暴是群体解决问题的特殊方法。","kw":["社会助长","社会惰化","头脑风暴"],"kp":"px-15-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-5","s":"普心","c":15,"t":"填空","card":382,"kd":"考点二 印象形成与行为归因","stem":"什么是印象形成？首因效应与近因效应分别指什么？","ans":"印象形成是指对他人进行主观归类理解的过程。首因效应是第一印象影响更大；近因效应是最近获得的信息影响更大。","kw":["印象形成是指对他人进行主观归类理解的过程"],"kp":"px-15-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-6","s":"普心","c":15,"t":"填空","card":383,"kd":"考点二 印象形成与行为归因","stem":"什么是印象管理？自我表现策略有哪些？","ans":"印象管理是指一个人以一定方式影响他人对自己的印象。刻板印象是对某一社会群体的概括认识。自我表现策略包括逢迎、恫吓、自我显示和恳求。","kw":["印象管理是指一个人以一定方式影响他人对自己的印象"],"kp":"px-15-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-7","s":"普心","c":15,"t":"填空","card":384,"kd":"考点二 印象形成与行为归因","stem":"什么是归因？凯利的归因共变模型需要哪三种信息？","ans":"归因是根据外部信息推测行为原因的过程。凯利的归因共变模型需要三种信息：特异性、共同性和一致性。影响归因的因素包括社会视角和自我价值保护倾向。","kw":["归因是根据外部信息推测行为原因的过程"],"kp":"px-15-7","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-15-8","s":"普心","c":15,"t":"填空","card":385,"kd":"考点二 印象形成与行为归因","stem":"什么是基本归因错误？","ans":"基本归因错误是指人们常把他人的行为归因于内在特质而忽视情境","kw":["基本归因错误"],"kp":"px-15-8","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-15-9","s":"普心","c":15,"t":"填空","card":386,"kd":"考点一 社会态度","stem":"社会态度的定义是什么？态度的三个构成成分是什么？","ans":"社会态度是指个体指向一定对象的评价性的持久反应倾向。态度的三个构成成分：认知成分、情感成分和行动成分。","kw":["社会态度是指个体指向一定对象的评价性的持久反应倾向"],"kp":"px-15-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-15-10","s":"普心","c":15,"t":"填空","card":387,"kd":"考点一 社会态度","stem":"态度形成受哪些因素影响？","ans":"经验的情绪后果、需要的满足、知识、家庭、参照群体和文化因素","kw":["经验的情绪后果"],"kp":"px-15-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-11","s":"普心","c":15,"t":"填空","card":388,"kd":"考点一 社会态度","stem":"态度与行为的关系如何？","ans":"态度作为心理准备状态，影响认知，有记忆过滤作用和激励作用。态度与行为的一致性遵循：总的态度预言总的行为，具体态度预言具体行为；测量时间间隔越短一致性越高。","kw":["态度作为心理准备状态","有记忆过滤作用和激励作用"],"kp":"px-15-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-12","s":"普心","c":15,"t":"填空","card":389,"kd":"考点一 社会态度","stem":"影响态度改变的因素有哪些？态度系统的自我防卫和改变途径是什么？","ans":"影响态度改变的因素包括宣传、说服者、信息本身、沟通方式和接收者四个变量。态度系统的自我防卫包括抗拒反应、心理惯性和保留面子。态度改变的途径有外部影响源、过度理由效应和行为模式变化。","kw":["影响态度改变的因素包括宣传","沟通方式和接收者四个变量"],"kp":"px-15-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-13","s":"普心","c":15,"t":"填空","card":390,"kd":"次要卡","stem":"第十五章三个考点如何串记？","ans":"","kw":["考点一社会态度","考点二印象形成与行为归因","考点三社会影响与人的行为"],"kp":"px-15-13","noteCut":3,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-15-14","s":"普心","c":15,"t":"填空","card":391,"kd":"次要卡","stem":"什么是睡眠者效应？","ans":"睡眠者效应是指低可信性传递者造成的态度改变量随时间推移而增加的现象。","kw":["睡眠者效应是指低可信性传递者造成的态度改变量随时间推移而增加的现象"],"kp":"px-15-14","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-16-1","s":"普心","c":16,"t":"填空","card":392,"kd":"考点五 爱情","stem":"爱情三角理论由谁提出？三个要素是什么？","ans":"斯腾伯格提出爱情三角理论，三个要素是亲密、激情和承诺。","kw":["斯腾伯格提出爱情三角理论","三个要素是亲密"],"kp":"px-16-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-2","s":"普心","c":16,"t":"填空","card":393,"kd":"考点四 助人与侵犯","stem":"助人行为的决策过程包括哪四个步骤？","ans":"注意事件、解释事件、确定责任和评价能力。","kw":["注意事件","确定责任和评价能力"],"kp":"px-16-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-3","s":"普心","c":16,"t":"填空","card":394,"kd":"考点四 助人与侵犯","stem":"什么是旁观者效应？原因有哪些？","ans":"他人在场会降低助人可能性。原因包括责任分散、情境不明确和评价恐惧。","kw":["他人在场会降低助人可能性","原因包括责任分散"],"kp":"px-16-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-4","s":"普心","c":16,"t":"填空","card":395,"kd":"考点四 助人与侵犯","stem":"侵犯行为的定义是什么？","ans":"侵犯行为指有意伤害他人且不为社会规范许可的行为。","kw":["侵犯行为指有意伤害他人且不为…"],"kp":"px-16-4","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-16-5","s":"普心","c":16,"t":"填空","card":396,"kd":"考点四 助人与侵犯","stem":"解释侵犯行为的三种理论分别是什么？","ans":"生物学理论认为侵犯源于本能、挫折；挫折—侵犯理论认为挫折导致侵犯；社会学习理论认为攻击是观察模仿习得的。","kw":["生物学理论认为侵犯源于本能","挫折—侵犯理论认为挫折导致侵犯"],"kp":"px-16-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-6","s":"普心","c":16,"t":"填空","card":397,"kd":"考点三 人际关系","stem":"人际关系的四个发展阶段是什么？","ans":"定向、情感探索、感情交流和稳定交往。","kw":["情感探索","感情交流和稳定交往"],"kp":"px-16-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-7","s":"普心","c":16,"t":"填空","card":398,"kd":"考点三 人际关系","stem":"建立和维系人际关系的原则有哪些？","ans":"真诚、交互、互利、自我价值保护和情境控制。","kw":["自我价值保护和情境控制"],"kp":"px-16-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-8","s":"普心","c":16,"t":"填空","card":399,"kd":"考点三 人际关系","stem":"影响人际吸引的因素有哪些？","ans":"个人特质如温暖、能力和外表吸引力；相似性、互补性、熟悉性（即曝光效应）、接近性","kw":["个人特质如温暖"],"kp":"px-16-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-9","s":"普心","c":16,"t":"填空","card":400,"kd":"考点二 人际沟通","stem":"什么是沟通？通过哪些方式实现？","ans":"人际关系是通过沟通来实现的；沟通就是人与人之间的信息交流过程，通过口语、书面语言和身体语言实现。","kw":["人际关系是通过沟通来实现的","沟通就是人与人之间的信息交流过程"],"kp":"px-16-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-10","s":"普心","c":16,"t":"填空","card":401,"kd":"考点二 人际沟通","stem":"人际空间距离反映了什么？","ans":"反映人际关系中彼此互相接纳的水平；距离的接近和情感的接纳水平成正比关系。","kw":["反映人际关系中彼此互相接纳的水平"],"kp":"px-16-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-11","s":"普心","c":16,"t":"填空","card":402,"kd":"考点二 人际沟通","stem":"人际距离分为哪四类？","ans":"亲密距离、个人距离、社交距离和公共距离。","kw":["亲密距离","社交距离和公共距离"],"kp":"px-16-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-12","s":"普心","c":16,"t":"填空","card":403,"kd":"考点一 人际交往","stem":"什么是人际交往？（动态角度与静态角度）","ans":"从动态角度看是指人与人之间的信息沟通和物质交换；从静态角度来说是指人与人之间通过动态的相互作用形成起来的情感联系。","kw":["从动态角度看是指人与人之间的信息沟通和物质交换"],"kp":"px-16-12","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-16-13","s":"普心","c":16,"t":"填空","card":404,"kd":"次要卡","stem":"爱的类型有哪些？","ans":"爱的类型包括情欲之爱、游戏之爱、友谊之爱、依附之爱、现实之爱和利他之爱。","kw":["包括情欲之爱"],"kp":"px-16-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-14","s":"普心","c":16,"t":"填空","card":405,"kd":"次要卡","stem":"第十六章（全书最后一章）主要考点有哪些？","ans":"主要关注人际距离四分类、影响人际吸引的因素、旁观者","kw":["主要关注人际距离四分类"],"kp":"px-16-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-15","s":"普心","c":16,"t":"填空","card":406,"kd":"次要卡","stem":"减少侵犯的方法有哪些？","ans":"宣泄、社会制约和提高道德水平。","kw":["社会制约和提高道德水平"],"kp":"px-16-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-16","s":"普心","c":16,"t":"填空","card":407,"kd":"次要卡","stem":"人际关系的破裂经历哪几个阶段？","ans":"分歧、收敛、冷漠、逃避和终止五个阶段。","kw":["分歧、收敛、冷漠、逃避和终止…"],"kp":"px-16-16","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-16-17","s":"普心","c":16,"t":"填空","card":408,"kd":"次要卡","stem":"个体对交往和独处的需要如何理解？","ans":"个体不仅有交往的需要，也有独处的需要；人的机体作为信息加工的综合系统，需要保持各种刺激的匹配和平衡。---","kw":["个体不仅有交往的需要","人的机体作为信息加工的综合系统"],"kp":"px-16-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-1","s":"普心","c":1,"t":"填空","card":1,"kd":"考点九 当代心理学的研究取向","stem":"生理心理学取向的核心主张是什么？","ans":"关心心理与行为的生物学基础，认为高级心理功能与脑功能密切相关；研究方法包括临床法、局部切除法、电刺激法、脑成像法等；认知神经科学属于这一取向，研究认知功能的脑机制。","kw":["关心心理与行为的生物学基础","认为高级心理功能与脑功能密切相关"],"kp":"px-1-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-2","s":"普心","c":1,"t":"填空","card":2,"kd":"考点九 当代心理学的研究取向","stem":"认知心理学取向的核心主张是什么？","ans":"把人看作信息加工者，能利用内在资源与环境相互作用；奈塞尔出版的《认知心理学》标志着现代认知心理学的诞生。","kw":["把人看作信息加工者","能利用内在资源与环境相互作用"],"kp":"px-1-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-3","s":"普心","c":1,"t":"填空","card":3,"kd":"考点九 当代心理学的研究取向","stem":"人本主义与积极心理学取向的核心主张是什么？","ans":"人本主义着重人格研究，认为人有自由意志和自我实现需要；积极心理学由塞利格曼提出，关注个体和团体的积极因素。","kw":["人本主义着重人格研究","认为人有自由意志和自我实现需要"],"kp":"px-1-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-4","s":"普心","c":1,"t":"填空","card":4,"kd":"考点八 重要心理学派别","stem":"构造主义的代表人物、观点和研究方法是什么？","ans":"奠基人是冯特，创始人是铁钦纳，研究对象是直接经验即意识。主要观点：心理学应该研究意识，直接经验分为感觉、意象和情感三种元素，所有复杂心理现象都由这些元素构成。研究方法是实验内省法。贡献：使心理学第一次脱离哲学有了学术身份。局限：把研究局限在意识元素分析上。","kw":["研究对象是直接经验即意识","心理学应该研究意识"],"kp":"px-1-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-5","s":"普心","c":1,"t":"填空","card":5,"kd":"考点八 重要心理学派别","stem":"机能主义的代表人物、观点和研究方法是什么？","ans":"代表人物是詹姆斯、杜威、安吉尔，研究对象是意识的作用和功能，探讨有机体如何适应环境。主要观点：以实用主义为哲学基础，意识不是元素的集合而是一个川流不息的过程，詹姆斯提出意识流的概念。研究方法既用内省又用实验。贡献：把心理学推广到教育、工业等领域。局限：理论和方法缺乏一致性。","kw":["代表人物是詹姆斯","研究对象是意识的作用和功能"],"kp":"px-1-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-6","s":"普心","c":1,"t":"填空","card":6,"kd":"考点八 重要心理学派别","stem":"格式塔心理学的代表人物和核心观点是什么？","ans":"代表人物是韦特海默、苛勒、考夫卡、勒温，研究对象是直接经验和行为。主要观点：强调心理作为一个整体，反对把意识分析为元素；核心观点包括突现论（整体不能还原为部分之和）、同形论（大脑按完形原理活动）、知觉的组织原则。研究方法：整体的观察法和实验现象学方法。贡献：反击了元素主义。局限：理论基础偏唯心。","kw":["代表人物是韦特海默","研究对象是直接经验和行为"],"kp":"px-1-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-7","s":"普心","c":1,"t":"填空","card":7,"kd":"考点八 重要心理学派别","stem":"行为主义的代表人物和核心观点是什么？","ans":"代表人物是华生、托尔曼、斯金纳、班杜拉，研究对象是行为。主要观点：反对研究意识，主张研究行为，主张环境决定论，认为行为由环境控制和决定；新行为主义提出了中介变量的概念。研究方法：实验法、观察法、条件反射法等。贡献：强化了心理学的自然科学特征。局限：早期生物学化倾向严重。","kw":["认为行为由环境控制和决定","新行为主义提出了中介变量的概念"],"kp":"px-1-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-8","s":"普心","c":1,"t":"填空","card":8,"kd":"考点八 重要心理学派别","stem":"精神分析的代表人物和核心观点是什么？","ans":"代表人物是弗洛伊德、荣格、阿德勒，研究对象是无意识现象。主要观点：人的行为根源于心灵深处的欲望或动机，欲望以无意识形式支配人，受到压抑导致精神疾病。研究方法：催眠疗法、自由联想、释梦等。贡献：开创了无意识研究领域。局限：非理性主义和生物学化倾向严重。","kw":["代表人物是弗洛伊德","研究对象是无意识现象"],"kp":"px-1-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-9","s":"普心","c":1,"t":"填空","card":9,"kd":"考点八 重要心理学派别","stem":"人本主义心理学的代表人物和核心观点是什么？","ans":"代表人物是马斯洛、罗杰斯，研究对象是健康的、自我实现的人的意识体验。主要观点：人本主义是心理学的第三势力，认为人的本质善良美好，有自由意志和自我实现的需要；马斯洛提出了需要层次理论，罗杰斯提出了来访者中心疗法。研究方法：以问题为中心来确定方法。贡献：从积极层面发掘人的潜能。局限：研究科学含量不高。","kw":["代表人物是马斯洛","研究对象是健康的"],"kp":"px-1-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-10","s":"普心","c":1,"t":"填空","card":10,"kd":"考点八 重要心理学派别","stem":"认知心理学的代表人物和核心观点是什么？","ans":"代表人物是奈塞尔、纽维尔、西蒙，研究对象是信息加工过程。主要观点：研究信息在加工系统中的传递、转换、储存和作用机制，致力揭开头脑「黑箱」内的活动。研究方法：反应时法、眼动技术、口语报告分析法、计算机模拟法。贡献：恢复了意识在心理学中的研究地位。局限：人机类比有局限，忽视了情感和人格等领域。","kw":["代表人物是奈塞尔","研究对象是信息加工过程"],"kp":"px-1-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-11","s":"普心","c":1,"t":"填空","card":11,"kd":"考点七 现代心理学产生的历史背景","stem":"科学心理学诞生的标志是什么？","ans":"1879年，冯特在莱比锡大学建立第一个心理学实验室，标志着心理学脱离哲学、走上独立发展道路。这个事件要重点掌握：1879年、冯特、莱比锡大学、第一个心理学实验室绑在一起记。","kw":["冯特在莱比锡大学建立第一个心理学实验室","标志着心理学脱离哲学"],"kp":"px-1-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-12","s":"普心","c":1,"t":"填空","card":12,"kd":"考点六 心理学的研究方法","stem":"什么是观察法？优缺点是什么？","ans":"观察法也叫自然观察法，是指在自然条件下对表现心理现象的外部活动进行有系统、有计划的观察，从而发现心理现象产生和发展的规律。适用条件有三种情况：对研究对象无法控制；控制条件可能影响行为出现；出于社会道德要求不能控制。优点是适用范围广、简便易行、能了解真实状况；缺点是难以重复观察、结果难以精确分析、结果容易受研究者兴趣和经验的影响。","kw":["是指在自然条件下对表现心理现象的外部活动进行有系统"],"kp":"px-1-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-13","s":"普心","c":1,"t":"填空","card":13,"kd":"考点六 心理学的研究方法","stem":"什么是实验法？它与观察法的最大区别是什么？","ans":"实验法是指在控制条件下对心理现象进行系统观察的方法，是科学心理学最高级的方法；实验法与观察法的最大区别在于研究者可以主动干预被试的活动。分为两种：实验室实验严格控制条件，有助于发现因果关系，但人为性强；自然实验在正常情境中进行，结果更接近实际，但控制不够严格。","kw":["是指在控制条件下对心理现象进行系统观察的方法"],"kp":"px-1-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-14","s":"普心","c":1,"t":"填空","card":14,"kd":"考点六 心理学的研究方法","stem":"什么是测验法？基本要求有哪些？","ans":"测验法是用一套标准化的问题来测量心理现象或心理品质的方法。基本要求有三个：信度是测验的可靠程度；效度是测验能有效测量所需心理品质；标准化指编制、施测和结果解释都要规范。分类上按内容分智力、成就、态度和人格测验等。优点是快速了解受测者、量化程度高；缺点是难以定性分析、灵活性较差。","kw":["是用一套标准化的问题来测量心理现象或心理品质的方法"],"kp":"px-1-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-15","s":"普心","c":1,"t":"填空","card":15,"kd":"考点六 心理学的研究方法","stem":"什么是个案法？优缺点是什么？","ans":"个案法是对某个人进行深入、详尽的观察和研究，过程中可能用到观察、实验、测验等方法。优点是可以收集丰富的个人资料；缺点在于结果可能只适合个别情况，推广时要谨慎。","kw":["是对某个人进行深入","详尽的观察和研究"],"kp":"px-1-15","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-1-16","s":"普心","c":1,"t":"填空","card":16,"kd":"考点六 心理学的研究方法","stem":"什么是调查法？优缺点是什么？","ans":"调查法是就某一问题要求被调查者自由表达意见或态度来分析群体心理倾向的方法，分问卷调查和访谈法。优点是省时省力，可同时收集较多资料；缺点是只能揭示相关关系不能揭示因果关系，受研究者主观影响大。","kw":["是就某一问题要求被调查者自由表达意见或态度来分析群体心理倾向的方法"],"kp":"px-1-16","noteCut":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-1-17","s":"普心","c":1,"t":"填空","card":17,"kd":"考点五 如何进行科学的心理学研究","stem":"心理学研究的五个环节是什么？","ans":"发现问题；提出研究假设；考虑研究设计和方法选定；收集数据和分析结果并得出结论；撰写和发表论文。","kw":["考虑研究设计和方法选定","收集数据和分析结果并得出结论"],"kp":"px-1-17","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-18","s":"普心","c":1,"t":"填空","card":18,"kd":"考点五 如何进行科学的心理学研究","stem":"因果关系与相关关系有什么区别？","ans":"实验法可以揭示因果关系，因为研究者严格控制自变量，因变量出现的变化可能由自变量引起。相关关系用相关系数表示，范围从负一到正一，正为正向相关，负为负向相关，但相关本身不能得出因果结论。比如冰淇淋销量和溺水人数高度相关，但两者都受夏天这个第三因素影响，谁也不是谁的原因。","kw":["实验法可以揭示因果关系","因为研究者严格控制自变量"],"kp":"px-1-18","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-19","s":"普心","c":1,"t":"填空","card":19,"kd":"考点二 心理学的基本任务","stem":"心理学的基本任务是什么？","ans":"描述、解释、预测和控制心理现象与行为。描述：收集和整理心理现象，对其进行科学分析和分类，把一种现象和另一种现象区别开来。解释：说明某种心理现象为什么会发生，受哪些因素影响，内在机制是什么。预测与控制：了解一个人的心理素质后，对他的行为做出有效预测，并帮助他更好地发展。","kw":["预测和控制心理现象与行为","收集和整理心理现象"],"kp":"px-1-19","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-20","s":"普心","c":1,"t":"填空","card":20,"kd":"考点一 心理学的研究对象","stem":"个体心理包括哪三个方面？","ans":"第一认知，也叫认知过程或信息加工过程，是指人获得知识或应用知识的过程，包括感觉、知觉、记忆、思维和语言等。第二动机和情绪，动机是指人的心理活动和外在行为在需要的推动下发生，情绪是指人在加工信息时形成对事物的态度、产生各种主观体验。第三心理特征，包括智力和人格，使个体的心理活动区别于他人。","kw":["也叫认知过程或信息加工过程","是指人获得知识或应用知识的过程"],"kp":"px-1-20","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-21","s":"普心","c":1,"t":"填空","card":21,"kd":"考点一 心理学的研究对象","stem":"心理与行为是什么关系？","ans":"行为是指机体的反应系统，由一系列反应动作和活动构成。行为不同于心理但又和心理密切联系，心理支配行为又通过行为表现出来；因为心理是内部的、看不见的，而行为是外显的、可以测量的，所以我们可以通过观察行为来研究心理活动。","kw":["行为是指机体的反应系统","由一系列反应动作和活动构成"],"kp":"px-1-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-22","s":"普心","c":1,"t":"填空","card":22,"kd":"考点一 心理学的研究对象","stem":"意识与无意识的定义分别是什么？","ans":"意识是一个连续体，一端是注意即清晰的意识，另一端即无意识；意识作为一种主观体验，是我们对自身或环境的主观觉知。无意识是人们在正常情况下觉察不到、也不能自觉调节和控制的心理现象。","kw":["意识是一个连续体","一端是注意即清晰的意识"],"kp":"px-1-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-23","s":"普心","c":1,"t":"填空","card":23,"kd":"考点一 心理学的研究对象","stem":"什么是团体心理？","ans":"团体心理是指在团体的共同生活条件和环境中形成、区别于其他团体的共同心理特征；团体心理与个体心理是共性与个性的关系。心理学的研究对象包括个体心理、行为、意识与无意识和团体心理四个方面。","kw":["是指在团体的共同生活条件和环境中形成"],"kp":"px-1-23","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-1-24","s":"普心","c":1,"t":"填空","card":24,"kd":"考点一 心理学的研究对象","stem":"心理学的定义是什么？","ans":"心理学是一门研究心理和行为的科学。","kw":["心理学"],"kp":"px-1-24","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-1-25","s":"普心","c":1,"t":"填空","card":25,"kd":"次要卡","stem":"进化心理学取向的核心主张是什么？","ans":"从生物进化的角度探讨各种心理现象的起源和本质，认为心理机制是在进化过程中被保留下来的适应性特征；注意其假设难以检验。","kw":["从生物进化的角度探讨各种心理现象的起源和本质"],"kp":"px-1-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-26","s":"普心","c":1,"t":"填空","card":26,"kd":"次要卡","stem":"第一章九个考点如何串记？","ans":"","kw":["考点一心理学的研究对象","团体心理四个方面"],"kp":"px-1-26","noteCut":9,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-27","s":"普心","c":1,"t":"填空","card":27,"kd":"次要卡","stem":"七个心理学派别如何对比串记？","ans":"构造主义研究意识元素；机能主义研究意识的功能；格式塔强调心理的整体性；行为主义只看行为不看意识；精神分析专注无意识；人本主义关注人的自我实现；认知心理学把大脑比作信息加工系统。其中构造主义和格式塔在「整体还是元素」上对立，行为主义和认知主义在「是否研究内部心理」上立场不同，注意对比着记。","kw":["构造主义研究意识元素","机能主义研究意识的功能"],"kp":"px-1-27","bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-1-28","s":"普心","c":1,"t":"填空","card":28,"kd":"次要卡","stem":"近代哲学思潮对心理学诞生有什么影响？","ans":"哲学是科学心理学的父亲，生理学是母亲。近代哲学包括法国的唯理论和英国的经验论：唯理论代表笛卡尔，只相信理性的真实性；经验论起源于霍布斯、奠基于洛克，认为一切知识来自经验。此外亚里士多德的《论灵魂》是历史上第一部阐述心理现象的著作，他把心理功能分为认知和动求功能。","kw":["哲学是科学心理学的父亲","近代哲学包括法国的唯理论和英国的经验论"],"kp":"px-1-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-29","s":"普心","c":1,"t":"填空","card":29,"kd":"次要卡","stem":"心理学研究中的伦理道德要求有哪些？","ans":"以人类为被试，要评估风险、签知情同意书、保护隐私、允许随时退出；以动物为被试，要确保舒适和人道待遇；还要遵守学术规范，杜绝学术欺诈。","kw":["要确保舒适和人道待遇","还要遵守学术规范，杜绝学术欺诈"],"kp":"px-1-29","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-30","s":"普心","c":1,"t":"填空","card":30,"kd":"次要卡","stem":"心理学是什么性质的学科？","ans":"心理学分两方面：自然科学性质和社会科学性质，综合来看是交叉学科。心理学研究心理的神经生物学基础，研究目标和手段与自然科学一样，所以具有自然科学性质；但人生活在社会环境中，心理发展离不开社会环境，所以又具有社会科学性质。因此心理学是一门交叉学科，或叫中间学科。","kw":["自然科学性质和社会科学性质","综合来看是交叉学科"],"kp":"px-1-30","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-31","s":"普心","c":1,"t":"填空","card":31,"kd":"次要卡","stem":"心理学有哪九个分支领域？","ans":"普通心理学（研究心理现象的最一般规律，是各分支学科的基础）；生理心理学（研究心理现象的生理机制）；发展心理学（研究心理的种系和个体发展，分比较心理学和毕生发展心理学）；教育心理学（研究教育过程中的心理现象）；医学心理学（研究心理因素在疾病诊疗中的作用）；健康心理学（研究身心因素对人类行为的影响，侧重健康维护）；工业心理学（研究劳动过程中人的心理特点）；军事心理学（研究军事人员选拔、培训、人际关系和士气等）；社会心理学（系统研究社会心理与行为）。","kw":["普通心理学（研究心理现象的最一般规律","是各分支学科的基础"],"kp":"px-1-31","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-32","s":"普心","c":1,"t":"填空","card":32,"kd":"次要卡","stem":"普通心理学全书16章分为哪三大部分？","ans":"前三章是基础（心理学的研究对象和方法、心理与行为的脑神经基础、意识和注意），帮大家建立对心理学的整体认识；第四章到第十二章是各个心理过程的专题（感觉、知觉、记忆、思维、语言、动机、情绪、智力、人格），这是全书的核心内容；最后四章是拓展与应用（学习、人生全程发展、社会态度与社会行为、人际交往）。学习时注意和研究方法中的相关内容联系起来。","kw":["前三章是基础（心理学的研究对象和方法"],"kp":"px-1-32","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L4","s":"普心","c":1,"t":"简答","card":4,"kd":"考点八 重要心理学派别","stem":"构造主义的代表人物、观点和研究方法是什么？","ans":"奠基人是冯特，创始人是铁钦纳，研究对象是直接经验即意识。主要观点：心理学应该研究意识，直接经验分为感觉、意象和情感三种元素，所有复杂心理现象都由这些元素构成。研究方法是实验内省法。贡献：使心理学第一次脱离哲学有了学术身份。局限：把研究局限在意识元素分析上。","kw":["奠基人","主要观点","研究方法","贡献","局限"],"kp":"px-1-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L5","s":"普心","c":1,"t":"简答","card":5,"kd":"考点八 重要心理学派别","stem":"机能主义的代表人物、观点和研究方法是什么？","ans":"代表人物是詹姆斯、杜威、安吉尔，研究对象是意识的作用和功能，探讨有机体如何适应环境。主要观点：以实用主义为哲学基础，意识不是元素的集合而是一个川流不息的过程，詹姆斯提出意识流的概念。研究方法既用内省又用实验。贡献：把心理学推广到教育、工业等领域。局限：理论和方法缺乏一致性。","kw":["代表人物","主要观点","研究方法既用内省又用实验","贡献","局限"],"kp":"px-1-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L13","s":"普心","c":1,"t":"简答","card":13,"kd":"考点六 心理学的研究方法","stem":"什么是实验法？它与观察法的最大区别是什么？","ans":"实验法是指在控制条件下对心理现象进行系统观察的方法，是科学心理学最高级的方法；实验法与观察法的最大区别在于研究者可以主动干预被试的活动。分为两种：实验室实验严格控制条件，有助于发现因果关系，但人为性强；自然实验在正常情境中进行，结果更接近实际，但控制不够严格。","kw":["分为两种","自然实验在正常情境中进行"],"kp":"px-1-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L17","s":"普心","c":1,"t":"简答","card":17,"kd":"考点五 如何进行科学的心理学研究","stem":"心理学研究的五个环节是什么？","ans":"发现问题；提出研究假设；考虑研究设计和方法选定；收集数据和分析结果并得出结论；撰写和发表论文。","kw":["提出研究假设","考虑研究设计和方法选定","收集数据和分析结果并得出结论","撰写和发表论文"],"kp":"px-1-17","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L18","s":"普心","c":1,"t":"简答","card":18,"kd":"考点五 如何进行科学的心理学研究","stem":"因果关系与相关关系有什么区别？","ans":"实验法可以揭示因果关系，因为研究者严格控制自变量，因变量出现的变化可能由自变量引起。相关关系用相关系数表示，范围从负一到正一，正为正向相关，负为负向相关，但相关本身不能得出因果结论。比如冰淇淋销量和溺水人数高度相关，但两者都受夏天这个第三因素影响，谁也不是谁的原因。","kw":["实验法可以揭示因果关系","相关关系用相关系数表示","要记住"],"kp":"px-1-18","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L22","s":"普心","c":1,"t":"简答","card":22,"kd":"考点一 心理学的研究对象","stem":"意识与无意识的定义分别是什么？","ans":"意识是一个连续体，一端是注意即清晰的意识，另一端即无意识；意识作为一种主观体验，是我们对自身或环境的主观觉知。无意识是人们在正常情况下觉察不到、也不能自觉调节和控制的心理现象。","kw":["意识","意识作为一种主观体验，","无意识"],"kp":"px-1-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-1-L24","s":"普心","c":1,"t":"简答","card":24,"kd":"考点一 心理学的研究对象","stem":"心理学的定义是什么？","ans":"心理学是一门研究心理和行为的科学。","kw":["心理学"],"kp":"px-1-24","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-1-L29","s":"普心","c":1,"t":"简答","card":29,"kd":"次要卡","stem":"心理学研究中的伦理道德要求有哪些？","ans":"以人类为被试，要评估风险、签知情同意书、保护隐私、允许随时退出；以动物为被试，要确保舒适和人道待遇；还要遵守学术规范，杜绝学术欺诈。","kw":["以人类为被试","以动物为被试","还要遵守学术规范"],"kp":"px-1-29","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-1","s":"普心","c":3,"t":"填空","card":33,"kd":"考点十二 注意的认知理论","stem":"布罗德本特的过滤器理论是什么？","ans":"基于双耳分听实验提出，认为神经系统加工信息容量有限，注意就像过滤器，按全或无的方式工作，只有部分信息能通过进入高级加工。","kw":["基于双耳分听实验提出","认为神经系统加工信息容量有限"],"jx":{"po":"设问「布罗德本特的过滤器理论是什么？」落在「考点十二 注意的认知理论」卡 33。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 34「特雷斯曼的衰减理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-2","s":"普心","c":3,"t":"填空","card":34,"kd":"考点十二 注意的认知理论","stem":"特雷斯曼的衰减理论是什么？","ans":"认为过滤器按衰减方式工作，未被注意的信息只是强度减弱而非完全消失；对人有重要意义的信息激活阈限低，容易被激活，能解释鸡尾酒会效应。","kw":["认为过滤器按衰减方式工作","未被注意的信息只是强度减弱而非完全消失"],"jx":{"po":"设问「特雷斯曼的衰减理论是什么？」落在「考点十二 注意的认知理论」卡 34。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-3","s":"普心","c":3,"t":"填空","card":35,"kd":"考点十二 注意的认知理论","stem":"后期选择理论是什么？能解释什么现象？","ans":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在知觉分析之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","kw":["由多伊奇夫妇提出","认为所有信息都得到了充分加工"],"jx":{"po":"设问「后期选择理论是什么？能解释什么现象？」落在「考点十二 注意的认知理论」卡 35。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-3","bt":"b","bp":"ans","bq":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在______之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","bl":["知觉分析"],"bpos":[40],"bsrc":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在知觉分析之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","nq":1},{"id":"px-3-4","s":"普心","c":3,"t":"填空","card":36,"kd":"考点十二 注意的认知理论","stem":"多阶段选择理论是什么？","ans":"多阶段选择理论由约翰斯顿和海因兹提出，认为注意的选择过程可发生在不同加工阶段，个体可根据任务需要主动控制早期或晚期选择。","kw":["由约翰斯顿和海因兹提出","认为注意的选择过程可发生在不同加工阶段"],"jx":{"po":"设问「多阶段选择理论是什么？」落在「考点十二 注意的认知理论」卡 36。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-5","s":"普心","c":3,"t":"填空","card":37,"kd":"考点十二 注意的认知理论","stem":"注意分配的两个理论分别是什么？","ans":"认知资源理论：由卡尼曼提出，把注意看作有限的认知资源，不同任务对资源需求不同，任务越复杂占用资源越多，可用总资源受个体唤醒水平调节。双加工理论：由谢夫林提出，分自动化加工和受意识控制的加工；自动化加工快速平行、不消耗资源，意识加工按顺序进行且消耗资源，大量练习后意识加工可以转变为自动化加工。","kw":["把注意看作有限的认知资源"],"jx":{"po":"设问「注意分配的两个理论分别是什么？」落在「考点十二 注意的认知理论」卡 37。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-6","s":"普心","c":3,"t":"填空","card":38,"kd":"考点十 注意的分类","stem":"什么是外源性注意（不随意注意）？影响因素有哪些？","ans":"外源性注意也叫不随意注意，由外部刺激引起，是被动、不费心神的注意，与自下而上加工有关。影响因素包括刺激物的特点如强度、新异性、运动变化等，也包括人的主观因素如需要、兴趣等。","kw":["外源性注意也叫不随意注意","与自下而上加工有关"],"jx":{"po":"设问「什么是外源性注意（不随意注意）？影响因素有哪些？」落在「考点十 注意的分类」卡 38。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『新异性』别写成「心意性」（考试写括号外的正确术语）。 同考点还有卡 39「什么是内源性注意（随意注意）？什么是随意」，两卡常被混问，注意别串。"},"kp":"px-3-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-7","s":"普心","c":3,"t":"填空","card":39,"kd":"考点十 注意的分类","stem":"什么是内源性注意（随意注意）？什么是随意后注意？","ans":"内源性注意也叫随意注意，由行为目标或意图引起，是主动、费心神的注意，与自上而下加工有关；影响因素包括活动目的和任务、兴趣、知识经验等。另外还有随意后注意，有目的但不需要意志努力，由有意注意发展而来，是创造性活动的必要条件。这三种注意的名称要区分清楚。","kw":["内源性注意也叫随意注意","由行为目标或意图引起"],"jx":{"po":"设问「什么是内源性注意（随意注意）？什么是随意后注意？」落在「考点十 注意的分类」卡 39。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 38「什么是外源性注意（不随意注意）？影响因素」，两卡常被混问，注意别串。"},"kp":"px-3-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-8","s":"普心","c":3,"t":"填空","card":40,"kd":"考点十 注意的分类","stem":"按信息加工中的功能分，注意分为哪三种？","ans":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和划消测验验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","kw":["从多种刺激中选择一种进行加工","常用双耳分听实验研究"],"jx":{"po":"设问「按信息加工中的功能分，注意分为哪三种？」落在「考点十 注意的分类」卡 40。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『启动和注意瞬脱』别写成「注意顺托」（考试写括号外的正确术语）。 同考点还有卡 38「什么是外源性注意（不随意注意）？影响因素」，两卡常被混问，注意别串。"},"kp":"px-3-8","bt":"b","bp":"ans","bq":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和______验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","bl":["划消测验"],"bpos":[78],"bsrc":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和划消测验验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","nq":1},{"id":"px-3-9","s":"普心","c":3,"t":"填空","card":41,"kd":"考点十 注意的分类","stem":"注意的品质有哪些？什么是注意广度？","ans":"注意的品质包括注意稳定、注意转移、注意分配和注意广度。注意广度是指一瞬间能知觉到的对象数量，受知觉对象特点和知识经验的影响。","kw":["注意的品质包括注意稳定"],"jx":{"po":"设问「注意的品质有哪些？什么是注意广度？」落在「考点十 注意的分类」卡 41。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 38「什么是外源性注意（不随意注意）？影响因素」，两卡常被混问，注意别串。"},"kp":"px-3-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-10","s":"普心","c":3,"t":"填空","card":42,"kd":"考点九 注意","stem":"注意的定义是什么？","ans":"注意是心理活动指向和聚焦于特定对象、同时忽略其他事物的心理现象。从信息加工角度看，注意是个体主动选择和处理特定信息、忽略无关信息的过程。注意不是独立的心理过程，而是一种认知性的心理倾向。","kw":["注意","从信息加工角度看，注意","注意不"],"jx":{"po":"设问「注意的定义是什么？」落在「考点九 注意」卡 42。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「注意」、「从信息加工角度看，注意」、「注意不」。先写术语，再展开。","bad":"同考点还有卡 43「注意有哪两个性质？哪三个功能？」，两卡常被混问，注意别串。"},"kp":"px-3-10","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-3-11","s":"普心","c":3,"t":"填空","card":43,"kd":"考点九 注意","stem":"注意有哪两个性质？哪三个功能？","ans":"两个性质：指向性和集中性。三个功能：选择功能（选取有意义刺激、避开无关刺激）；维持功能（使心理活动保持在特定对象上）；整合功能（对个别特征进行精细加工整合为完整物体）。","kw":["维持功能（使心理活动保持在特定对象上","整合功能（对个别特征进行精细加工整合为完整物体"],"jx":{"po":"设问「注意有哪两个性质？哪三个功能？」落在「考点九 注意」卡 43。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 42「注意的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-12","s":"普心","c":3,"t":"填空","card":44,"kd":"考点九 注意","stem":"注意与意识是什么关系？","ans":"注意不等同于意识，注意更主动且易控制，但两者密不可分；处于注意状态时意识内容更清晰。","kw":["注意不等同于意识"],"jx":{"po":"设问「注意与意识是什么关系？」落在「考点九 注意」卡 44。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 42「注意的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-13","s":"普心","c":3,"t":"填空","card":45,"kd":"考点六 催眠","stem":"解释催眠的两种理论分别是什么？","ans":"特殊状态理论：谢尔加德的意识分离理论认为，催眠状态下意识功能分离为两个层面，一个层面接受暗示，另一个层面即隐藏的观察者知道真实情况。非特殊状态理论：斯帕诺斯的角色扮演理论认为，被催眠者只是在扮演一种特殊的社会角色。","kw":["谢尔加德的意识分离理论认为","催眠状态下意识功能分离为两个层面"],"jx":{"po":"设问「解释催眠的两种理论分别是什么？」落在「考点六 催眠」卡 45。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『谢尔加德』别写成「」（考试写括号外的正确术语）。"},"kp":"px-3-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-14","s":"普心","c":3,"t":"填空","card":46,"kd":"考点四 梦","stem":"关于梦的三种观点分别是什么？","ans":"精神分析观点：弗洛伊德认为梦是潜意识愿望的反映，是通向潜意识的最可靠途径，分显梦和隐梦。生理学观点：霍布森提出激活—整合假设，认为梦是个体对脑的随机神经活动的主观解释。认知观点：梦担负一定的认知功能，对存储的知识进行检索、整合与巩固。","kw":["弗洛伊德认为梦是潜意识愿望的反映，是通向潜意识的最可靠途径"],"jx":{"po":"设问「关于梦的三种观点分别是什么？」落在「考点四 梦」卡 46。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『的知识进行检索』别写成「解锁」（考试写括号外的正确术语）。"},"kp":"px-3-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-15","s":"普心","c":3,"t":"填空","card":47,"kd":"考点三 睡眠","stem":"三种脑电波分别对应什么状态？","ans":"大脑处于清醒警觉状态时以β波为主，频率高波幅低；安静休息状态时以α波为主，频率低波幅高；睡眠状态时以δ波为主，更加低频高幅。","kw":["大脑处于清醒警觉状态时以β波为主","安静休息状态时以α波为主"],"jx":{"po":"设问「三种脑电波分别对应什么状态？」落在「考点三 睡眠」卡 47。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『眠状态时以δ波』别写成「Δ波」（考试写括号外的正确术语）。 同考点还有卡 48「非快速眼动睡眠分为哪四个阶段？」，两卡常被混问，注意别串。"},"kp":"px-3-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-16","s":"普心","c":3,"t":"填空","card":48,"kd":"考点三 睡眠","stem":"非快速眼动睡眠分为哪四个阶段？","ans":"第一阶段是浅睡，持续约十分钟，容易被惊醒，脑电为混合的低频低幅波；第二阶段出现睡眠锭，个体较难被唤醒，可缓解疲劳；第三阶段和第四阶段是深度睡眠，也叫慢波睡眠，脑电几乎完全为低频高幅的δ波，个体很难被唤醒，有时发生梦游、梦呓、尿床等。前四个阶段约九十分钟完成，之后由深入浅进入快速眼动睡眠。","kw":["脑电为混合的低频低幅波"],"jx":{"po":"设问「非快速眼动睡眠分为哪四个阶段？」落在「考点三 睡眠」卡 48。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『阶段出现睡眠锭』别写成「睡眠定」（考试写括号外的正确术语）。 同考点还有卡 47「三种脑电波分别对应什么状态？」，两卡常被混问，注意别串。"},"kp":"px-3-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-17","s":"普心","c":3,"t":"填空","card":49,"kd":"考点三 睡眠","stem":"快速眼动睡眠（REM）有什么特点？","ans":"通常伴随梦境出现，眼球快速运动，心率血压不规则，呼吸急促，但肌肉松软；脑电活动与清醒时相似，呈高频低幅。REM在睡眠后期持续时间越来越长，第一次约五到十分钟，最后一次可长达一小时；随年龄增长REM时间逐渐缩短；若剥夺REM睡眠后让人重新入睡，REM通常会反弹增加。","kw":["通常伴随梦境出现","脑电活动与清醒时相似"],"jx":{"po":"设问「快速眼动睡眠（REM）有什么特点？」落在「考点三 睡眠」卡 49。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 47「三种脑电波分别对应什么状态？」，两卡常被混问，注意别串。"},"kp":"px-3-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-18","s":"普心","c":3,"t":"填空","card":50,"kd":"考点一 意识概述","stem":"意识的定义是什么？有哪两个性质？","ans":"意识是我们对自身和外界环境事件的主观觉知，是一种高级心理功能，负责统合、管理和调控个体身心系统。两个性质：一是局限性，同一时间内可以进入意识的信息量有限；二是能动性，人可以有限度地超越外部信息内容，建构自己的意识。","kw":["意识是我们对自身和外界环境事件的主观觉知"],"jx":{"po":"设问「意识的定义是什么？有哪两个性质？」落在「考点一 意识概述」卡 50。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 51「意识的四大功能是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-18","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-3-19","s":"普心","c":3,"t":"填空","card":51,"kd":"考点一 意识概述","stem":"意识的四大功能是什么？","ans":"觉知（了解客观事物和自身的存在）；计划（心理和行为有目的性）；选择（接受有效刺激，过滤无关信息）；监控（监视和调节自身状态）。","kw":["觉知（了解客观事物和自身的存在"],"jx":{"po":"设问「意识的四大功能是什么？」落在「考点一 意识概述」卡 51。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 50「意识的定义是什么？有哪两个性质？」，两卡常被混问，注意别串。"},"kp":"px-3-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-20","s":"普心","c":3,"t":"填空","card":52,"kd":"考点一 意识概述","stem":"意识的两种理论分别是什么？有什么区别？","ans":"全局工作空间理论由巴尔斯提出，也叫剧场模型，强调意识是一个容量有限的全局工作空间，可以统合和连接各种认知过程。整合信息理论由托诺尼提出，认为意识经验来自大脑处理信息时产生的整合信息，具有高度整合性和高度分化性两个特征。区别：全局工作空间理论把意识比作剧场中的舞台，而整合信息理论认为意识产生于整个神经结构网络。","kw":["全局工作空间理论由巴尔斯提出","强调意识是一个容量有限的全局工作空间"],"jx":{"po":"设问「意识的两种理论分别是什么？有什么区别？」落在「考点一 意识概述」卡 52。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『也叫剧场模型』别写成「聚院模型」（考试写括号外的正确术语）。 同考点还有卡 50「意识的定义是什么？有哪两个性质？」，两卡常被混问，注意别串。"},"kp":"px-3-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-21","s":"普心","c":3,"t":"填空","card":53,"kd":"考点一 意识概述","stem":"无意识的常见现象有哪些？如何区分？","ans":"阈下知觉是指个体意识不到刺激的存在，但刺激仍能引起行为或生理反应。盲视由脑损伤引起，患者不能有意识地觉察视觉刺激，但仍能指出盲视野中的刺激。非注意视盲是注意被其他活动占用时，一些本来能意识到的刺激却没有被意识到，经典实验是传球计数实验。变化盲视指难以察觉物体或情境发生的变化。注意区分：阈下知觉中即使集中注意也意识不到刺激，非注意视盲中给予注意后就能觉察到。","kw":["阈下知觉是指个体意识不到刺激的存在","但刺激仍能引起行为或生理反应"],"jx":{"po":"设问「无意识的常见现象有哪些？如何区分？」落在「考点一 意识概述」卡 53。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『阈下知觉』别写成「遇下知觉」（考试写括号外的正确术语）。 同考点还有卡 50「意识的定义是什么？有哪两个性质？」，两卡常被混问，注意别串。"},"kp":"px-3-21","bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"px-3-22","s":"普心","c":3,"t":"填空","card":54,"kd":"次要卡","stem":"第三章十二个考点如何串记？","ans":"","kw":["四个功能记关键词","全局工作空间理论和整合信息理论背框架"],"jx":{"po":"设问「第三章十二个考点如何串记？」落在「次要卡」卡 54。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 55「注意的三个脑机制层次分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-22","noteCut":12,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-23","s":"普心","c":3,"t":"填空","card":55,"kd":"次要卡","stem":"注意的三个脑机制层次分别是什么？","ans":"脑干网状结构维持大脑一般性活动水平，保证大脑有效加工信号；边缘系统的前扣带回广泛参与注意认知活动，负责监控行为错误或冲突；大脑皮层是产生注意的最高级部位，主动调节行动和对信息进行选择。","kw":["脑干网状结构维持大脑一般性活动水平"],"jx":{"po":"设问「注意的三个脑机制层次分别是什么？」落在「次要卡」卡 55。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-24","s":"普心","c":3,"t":"填空","card":56,"kd":"次要卡","stem":"精神活性药物分为哪三类？长期服用有什么后果？","ans":"抑制剂使神经活动减弱，如酒精；兴奋剂加速中枢神经系统活动，如可卡因、尼古丁；致幻剂改变对外部世界的感知，如大麻。长期服用会产生耐受性、依赖性和药物成瘾。","kw":["抑制剂使神经活动减弱","兴奋剂加速中枢神经系统活动"],"jx":{"po":"设问「精神活性药物分为哪三类？长期服用有什么后果？」落在「次要卡」卡 56。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『致幻剂』别写成「置换剂」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-25","s":"普心","c":3,"t":"填空","card":57,"kd":"次要卡","stem":"冥想的概念和类型是什么？","ans":"冥想是通过身心调节提升自我觉察能力的方式，分专注式冥想和开放监控式冥想。正念冥想强调对当下体验的非评判性接受，其作用包括缓解疼痛、降低抑郁复发率、提升幸福感等。","kw":["冥想是通过身心调节提升自我觉察能力的方式"],"jx":{"po":"设问「冥想的概念和类
