s":"表象是事物不在面前时人们头脑中出现的关于事物的形象，是思维活动的感性支柱。三个特征：直观性（以具体形象出现，但比知觉形象暗淡模糊不稳定）；概括性（反映事物的大体轮廓和主要特征）；可操作性（可在头脑中对表象进行操作）。库珀的心理旋转实验表明，字母R旋转180度时反应时最长，证明了可操作性的存在。","kw":["表象是事物不在面前时人们头脑中出现的关于事物的形象"],"kp":"px-7-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-24","s":"普心","c":7,"t":"填空","card":174,"kd":"考点二 表象","stem":"佩维奥的双重编码理论是什么？","ans":"人脑中同时存在两种编码系统：语言符号系统负责处理语言信息；非语言符号系统即表象系统，负责处理形象信息。两个系统相互独立但存在相互作用，如果能对刺激采用两种方式编码则具有认知加工优势，比如对具体词的记忆效果优于抽象词。","kw":["人脑中同时存在两种编码系统","语言符号系统负责处理语言信息"],"kp":"px-7-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-25","s":"普心","c":7,"t":"填空","card":175,"kd":"考点一 思维概述","stem":"思维的定义是什么？","ans":"思维是借助表象、概念、语言等实现的，对客观事物概括的、间接的反应；能揭示事物的本质特征和内部联系，是认识的高级形式，也是认识过程的核心成分。","kw":["对客观事物概括的","能揭示事物的本质特征和内部联系"],"kp":"px-7-25","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-26","s":"普心","c":7,"t":"填空","card":176,"kd":"考点一 思维概述","stem":"思维有哪两个特征？","ans":"概括性（在大量感性材料基础上，把一类事物的共同特征和规律抽取出来加以概括，是概念形成的前提）；间接性（借助一定的媒介或已有知识经验对客观事物进行间接认识，由此可以超越感知觉的限制）。","kw":["概括性（在大量感性材料基础上","把一类事物的共同特征和规律抽取出来加以概括"],"kp":"px-7-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-27","s":"普心","c":7,"t":"填空","card":177,"kd":"考点一 思维概述","stem":"思维按凭借的心理表征分为哪三类？","ans":"直观动作思维凭借实际动作；形象思维凭借头脑中的形象；抽象思维凭借概念和判断推理，是思维的高级形式。","kw":["直观动作思维凭借实际动作","形象思维凭借头脑中的形象"],"kp":"px-7-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-28","s":"普心","c":7,"t":"填空","card":178,"kd":"考点一 思维概述","stem":"辐合思维与发散思维分别是什么？发散思维有哪些特点？","ans":"辐合思维是根据已知信息得出确定结论；发散思维是沿着不同方向思考产生多种方案，是创造性思维的主要成分。吉尔福特用不寻常用途测验来测量发散思维，其特点包括流畅性（单位时间内发散项目的数量）、变通性（发散项目的范围和维度）、独特性（提出超乎寻常的见解）。","kw":["辐合思维是根据已知信息得出确定结论","发散思维是沿着不同方向思考产生多种方案"],"kp":"px-7-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-29","s":"普心","c":7,"t":"填空","card":179,"kd":"考点一 思维概述","stem":"思维按创新程度分为哪两类？","ans":"常规性思维和创造性思维。","kw":[" 三种分类方式背框"],"kp":"px-7-29","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-30","s":"普心","c":7,"t":"填空","card":180,"kd":"次要卡","stem":"第七章九个考点如何串记？","ans":"","kw":["概括性和间接性两个特征","三种分类方式背框架"],"kp":"px-7-30","noteCut":9,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-31","s":"普心","c":7,"t":"填空","card":181,"kd":"次要卡","stem":"什么是问题？问题如何分类？","ans":"问题是指在给定状态与目标状态之间存在障碍、需要克服的任务情境。按明确程度分定义良好的问题（如几何证明题）和定义不良的问题（如怎样处理好人际关系）；按有无对手分对抗性问题和非对抗性问题；按相关知识程度分语义丰富的问题和语义贫乏的问题。","kw":["问题是指在给定状态与目标状态之间存在障碍"],"kp":"px-7-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-32","s":"普心","c":7,"t":"填空","card":182,"kd":"次要卡","stem":"什么是问题空间？","ans":"问题空间由纽厄尔和西蒙提出，是指问题解决者对问题一切可能的认识状态，包括对初始状态、目标状态以及如何转化的认识。","kw":["由纽厄尔和西蒙提出","是指问题解决者对问题一切可能的认识状态"],"kp":"px-7-32","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-33","s":"普心","c":7,"t":"填空","card":183,"kd":"次要卡","stem":"条件推理中的证实倾向是什么？","ans":"人们利用条件性命题进行推理，存在证实倾向，即倾向于证实假设而很少去证伪；沃森的四卡片选择作业证明了这一点，实验中只有约4%的被试做出了正确选择。","kw":["人们利用条件性命题进行推理","即倾向于证实假设而很少去证伪"],"kp":"px-7-33","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-34","s":"普心","c":7,"t":"填空","card":184,"kd":"次要卡","stem":"创造性的培养方式有哪些？","ans":"创造性的培养方式包括保护好奇心、激发求知欲、创设创造性思维形成的氛围、加强发散思维训练、陶冶创造性人格等。","kw":["创设创造性思维形成的氛围","加强发散思维训练、陶冶创造性人格等"],"kp":"px-7-34","bt":"b","bp":"ans","bq":"创造性的培养方式包括保护好奇心、激发求知欲、创设创造性思维形成的氛围、加强______训练、陶冶创造性人格等。","bl":["发散思维"],"bpos":[37],"bsrc":"创造性的培养方式包括保护好奇心、激发求知欲、创设创造性思维形成的氛围、加强发散思维训练、陶冶创造性人格等。","nq":1},{"id":"px-7-35","s":"普心","c":7,"t":"填空","card":185,"kd":"次要卡","stem":"表象如何分类？","ans":"表象按产生感觉通道分视觉表象、听觉表象等；按创造程度分记忆表象和想象表象（想象表象具有新颖性）。","kw":[" 按创造程度分记忆"],"kp":"px-7-35","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-36","s":"普心","c":7,"t":"填空","card":186,"kd":"次要卡","stem":"表象在思维中有什么作用？","ans":"表象为概念的形成提供了感性基础，同时有助于问题解决和推理。","kw":[" 同时有助于问题解"],"kp":"px-7-36","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-37","s":"普心","c":7,"t":"填空","card":187,"kd":"次要卡","stem":"思维的生理机制是什么？思维与感知觉记忆是什么关系？","ans":"思维与额叶、左侧颞叶和顶枕叶有关。感知觉是直接接收外界刺激形成感性认识；记忆是编码、存储、提取。","kw":["思维与额叶","感知觉","记忆"],"kp":"px-7-37","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L151","s":"普心","c":7,"t":"简答","card":151,"kd":"考点九 决策","stem":"古典决策理论的核心观点是什么？","ans":"建立在经济人假设基础上，认为决策者完全理性，追求个人利益最大化，选取最优方案。","kw":["建立在经济人假设基础上"],"kp":"px-7-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L152","s":"普心","c":7,"t":"简答","card":152,"kd":"考点九 决策","stem":"西蒙的行为决策理论是什么？","ans":"西蒙认为人的理性和认知能力有限，不可能找到所有备选方案，遵循满意性原则而非最优原则。","kw":["西蒙认为人的理性和认知能力有…"],"kp":"px-7-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L153","s":"普心","c":7,"t":"简答","card":153,"kd":"考点九 决策","stem":"期望效用理论由谁提出？核心观点是什么？","ans":"由冯·诺伊曼和摩根斯坦提出，用严格数学方法追求效用最大化。","kw":["由冯·诺伊曼和摩根斯坦提出"],"kp":"px-7-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L154","s":"普心","c":7,"t":"简答","card":154,"kd":"考点九 决策","stem":"卡尼曼的前景理论包括哪些核心观点？","ans":"认为不确定情况下人是非理性的：面临获得时风险规避，面临损失时风险偏好；人们对损失比对获得更敏感，即损失厌恶；相同信息的不同表述方式影响决策，即框架效应。","kw":["认为不确定情况下人","人们对损失比对获得更敏感"],"kp":"px-7-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L156","s":"普心","c":7,"t":"简答","card":156,"kd":"考点八 问题解决的影响因素","stem":"影响问题解决的十一个因素是什么？","ans":"第一个所选择的策略（不同策略效率不同）；第二个知识（专家在某一领域知识丰富、记忆存储信息量大且知识按层次结构组织，问题解决效率远高于新手）；第三个问题表征的方式（合理的表征促进问题解决）；第四个无谓的限制（受并不存在的限定条件影响，如九点连线图）；第五个定式；第六个顿悟（突然理解问题情境中的关系找到解决方法）；第七个功能固着；第八个动机（在适当限度内动机强度与解决问题效率成正比，太强或太弱都会降低效率）；第九个情绪（积极情绪促进，消极情绪如紧张惶恐阻碍）；第十个人际关系（团体内协作互助促进，互不信任阻碍）；第十一个无关信息（与问题无关的信息会妨碍解决）。","kw":["第一个所选择的策略","第二个知识","第三个问题表征的方式","第四个无谓的限制","第六个顿悟","第七个功能固着","第八个动机","第九个情绪","第十个人际关系","第十一个无关信息"],"kp":"px-7-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L158","s":"普心","c":7,"t":"简答","card":158,"kd":"考点八 问题解决的影响因素","stem":"什么是功能固着？邓克的盒子问题证明了什么？","ans":"功能固着指人们把某种功能赋予某种物体后不易摆脱固有观念。邓克的盒子问题证明蜡烛盒被看成容器后不易被当成烛台使用。这两个实验和概念的对应关系要重点掌握。","kw":["功能固着指人们把某种功能赋予…"],"kp":"px-7-8","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-L162","s":"普心","c":7,"t":"简答","card":162,"kd":"考点七 问题解决的策略","stem":"手段—目的分析法与爬山法的区别是什么？","ans":"前者可以暂时后退迂回，后者只能前进。三种策略的名称和区别要重点掌握。","kw":["前者可以暂时后退迂回"],"kp":"px-7-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L166","s":"普心","c":7,"t":"简答","card":166,"kd":"考点四 概念","stem":"概念形成分为哪三个阶段？","ans":"概念形成是指个体掌握概念的过程，一般用人工概念进行研究。三个阶段：抽象化；类化（归类相似属性或特征）；辨别（认识差异）。","kw":["概念形成","三个阶段"],"kp":"px-7-16","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L167","s":"普心","c":7,"t":"简答","card":167,"kd":"考点四 概念","stem":"概念形成的三个理论分别是什么？","ans":"赫尔的共同要素说（认为概念形成是把共同特征抽取出来）；布鲁纳的假设检验说（认为概念形成是不断提出假设和验证假设的过程）；茹什的原型理论（认为形成概念就是在头脑中形成原型，对解释自然概念有启发）。","kw":["赫尔的共同要素说","布鲁纳的假设检验说","茹什的原型理论"],"kp":"px-7-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L169","s":"普心","c":7,"t":"简答","card":169,"kd":"考点四 概念","stem":"概念组织的三个模型分别是什么？","ans":"层次网络模型（由柯林斯提出，概念以节点形式存储在概念网络中，层次越高抽象概括水平越高，提取概念是对网络的搜索过程）；激活扩散模型（由柯林斯在层次网络模型基础上改进，以语义相关性为基础组织概念网络，概念被加工时其意义激活会自动传递到相关概念，能解释语义启动效应）；特征表理论（由波纳提出，认为概念由定义特征和概念规则构成）。","kw":["层次网络模型","激活扩散模型","特征表理论"],"kp":"px-7-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L170","s":"普心","c":7,"t":"简答","card":170,"kd":"考点三 创造性","stem":"创造性的定义是什么？","ans":"创造性是指用新颖方式解决问题并产生新的、有社会价值产品的心理过程，是人类最高智慧的体现。","kw":["创造性"],"kp":"px-7-20","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-L171","s":"普心","c":7,"t":"简答","card":171,"kd":"考点三 创造性","stem":"创造性的心理成分包括哪四个方面？","ans":"第一想象（是对头脑中已有表象进行加工改造、形成新形象的过程，具有形象性和新颖性；想象分无意想象和有意想象，有意想象又分再造想象和创造想象；具体方式包括粘合、夸张、典型化、联想）；第二辐合思维与发散思维（发散思维是创造性的主要成分）；第三远距离联想能力（在相距很远的概念间看出关系的能力）；第四坚持性、自信心等非智力因素。","kw":["第一想象","想象分无意想象和有意想象","具体方式包括粘合","第二辐合思维与发散思维","第三远距离联想能力","第四坚持性"],"kp":"px-7-21","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L172","s":"普心","c":7,"t":"简答","card":172,"kd":"考点三 创造性","stem":"创造性的过程分为哪五个阶段？","ans":"定向阶段（对问题进行定义）；准备阶段（尽可能收集相关信息）；酝酿阶段（所有能想到的方案都无法解决，问题被移入无意识中继续思考）；顿悟阶段（思想火花的闪现，突然发现解决办法）；验证阶段（检验顿悟获得的方案）。","kw":["定向阶段","准备阶段","酝酿阶段","顿悟阶段","验证阶段"],"kp":"px-7-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L174","s":"普心","c":7,"t":"简答","card":174,"kd":"考点二 表象","stem":"佩维奥的双重编码理论是什么？","ans":"人脑中同时存在两种编码系统：语言符号系统负责处理语言信息；非语言符号系统即表象系统，负责处理形象信息。两个系统相互独立但存在相互作用，如果能对刺激采用两种方式编码则具有认知加工优势，比如对具体词的记忆效果优于抽象词。","kw":["人脑中同时存在两种编码系统","非语言符号系统即表象系统"],"kp":"px-7-24","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L175","s":"普心","c":7,"t":"简答","card":175,"kd":"考点一 思维概述","stem":"思维的定义是什么？","ans":"思维是借助表象、概念、语言等实现的，对客观事物概括的、间接的反应；能揭示事物的本质特征和内部联系，是认识的高级形式，也是认识过程的核心成分。","kw":["思维"],"kp":"px-7-25","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-L178","s":"普心","c":7,"t":"简答","card":178,"kd":"考点一 思维概述","stem":"辐合思维与发散思维分别是什么？发散思维有哪些特点？","ans":"辐合思维是根据已知信息得出确定结论；发散思维是沿着不同方向思考产生多种方案，是创造性思维的主要成分。吉尔福特用不寻常用途测验来测量发散思维，其特点包括流畅性（单位时间内发散项目的数量）、变通性（发散项目的范围和维度）、独特性（提出超乎寻常的见解）。","kw":["辐合思维","发散思维"],"kp":"px-7-28","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L183","s":"普心","c":7,"t":"简答","card":183,"kd":"次要卡","stem":"条件推理中的证实倾向是什么？","ans":"人们利用条件性命题进行推理，存在证实倾向，即倾向于证实假设而很少去证伪；沃森的四卡片选择作业证明了这一点，实验中只有约4%的被试做出了正确选择。","kw":["人们利用条件性命题进行推理"],"kp":"px-7-33","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-L187","s":"普心","c":7,"t":"简答","card":187,"kd":"次要卡","stem":"思维的生理机制是什么？思维与感知觉记忆是什么关系？","ans":"思维与额叶、左侧颞叶和顶枕叶有关。感知觉是直接接收外界刺激形成感性认识；记忆是编码、存储、提取。","kw":["思维与额叶","感知觉","记忆"],"kp":"px-7-37","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-1","s":"普心","c":8,"t":"填空","card":188,"kd":"考点五 双语的加工","stem":"克洛尔的修正层级模型是什么？","ans":"认为低熟练水平的二语者需要通过母语词汇的中介通达概念系统，高熟练水平可以直接通达。该模型能解释翻译任务中的不对称现象：将二语翻译成母语更快，基于形式加工；将母语翻译成二语较慢，基于语义加工。","kw":["认为低熟练水平的二语者需要通过母语词汇的中介通达概念系统"],"kp":"px-8-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-2","s":"普心","c":8,"t":"填空","card":189,"kd":"考点五 双语的加工","stem":"格林的抑制控制模型是什么？","ans":"认为双语者通过对非目标语言的抑制来避免跨语言竞争；熟练程度越高的语言作为非目标语时被抑制的程度越高，重新激活的难度也越大。双语转换范式是考察抑制控制机制的常用方法，不同语言转换时会产生转换代价，且转换代价具有不对称性。","kw":["认为双语者通过对非目标语言的抑制来避免跨语言竞争"],"kp":"px-8-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-3","s":"普心","c":8,"t":"填空","card":190,"kd":"考点四 书面语言的加工","stem":"什么是词汇识别？包括哪三个阶段？","ans":"词汇识别是指通过对词形的视觉感知通达词汇意义的过程，包括词形加工、形音转换和语义通达三个阶段。","kw":["是指通过对词形的视觉感知通达词汇意义的过程"],"kp":"px-8-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-4","s":"普心","c":8,"t":"填空","card":191,"kd":"考点四 书面语言的加工","stem":"阅读的双通路模型是什么？由谁提出？","ans":"阅读的双通路模型由柯尔哈特提出，认为符合发音规则的词通过形音对应规则读出，不规则词需要借助心理词典中的词条读出。","kw":["认为符合发音规则的词通过形音对应规则读出"],"kp":"px-8-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-5","s":"普心","c":8,"t":"填空","card":192,"kd":"考点四 书面语言的加工","stem":"什么是语义启动效应？词汇识别的影响因素有哪些？","ans":"语义启动效应是指启动词与目标词有语义关联使识别更快，是研究词汇识别的重要方法。影响因素包括词频和字频、笔画数、语义特征（即多义词比单一词更易识别）、习得年龄、语境等。","kw":["语义启动效应是指启动词与目标词有语义关联使识别更快"],"kp":"px-8-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-6","s":"普心","c":8,"t":"填空","card":193,"kd":"考点二 语言的神经基础","stem":"威尔尼克区的位置、功能和受损表现是什么？","ans":"位于左半球颞上回，是听觉性语言中枢，负责分辨语音、形成语义，与语言理解有关；受损会产生接收性失语症，病人话语流利但无意义。","kw":["位于左半球颞上回","是听觉性语言中枢"],"kp":"px-8-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-7","s":"普心","c":8,"t":"填空","card":194,"kd":"考点二 语言的神经基础","stem":"布洛卡区的位置、功能和受损表现是什么？","ans":"位于左半球额叶，是运动性语言中枢，负责产生发音程序；受损会产生运动性失语症，病人发音困难、说话缓慢，出现电报语。威尔尼克区和布洛卡区之间有弓形束连接。","kw":["是运动性语言中枢","负责产生发音程序"],"kp":"px-8-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-8","s":"普心","c":8,"t":"填空","card":195,"kd":"考点二 语言的神经基础","stem":"角回与艾克纳尔区的位置、功能和受损表现是什么？","ans":"角回位于顶枕叶交界处，是视觉性语言中枢，与单词的视觉记忆和视听觉跨通道联合有关，受损产生语义性失语症，不能理解书面语言。艾克纳尔区位于额中回后部，是书写性语言中枢，受损产生失写症，患者能听懂看懂但丧失书写能力。","kw":["角回位于顶枕叶交界处","是视觉性语言中枢，与单词的视觉记忆和视听觉跨通道联合有关"],"kp":"px-8-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-9","s":"普心","c":8,"t":"填空","card":196,"kd":"考点一 语言概述","stem":"语言的定义是什么？","ans":"语言是人类通过高度结构化的声音、文字或手势等构成的用于交流的符号系统。","kw":[" 文字或手势等构成"],"kp":"px-8-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-8-10","s":"普心","c":8,"t":"填空","card":197,"kd":"考点一 语言概述","stem":"语言有哪四个特征？","ans":"结构性（语言按一定规则组织）；指代性（可以指代具体或抽象的事物）；创造性（人类能用有限词语创造无限语句，是人类特有的能力）；社会性（语言是社会活动的产物）。","kw":["结构性（语言按一定规则组织","指代性（可以指代具体或抽象的事物"],"kp":"px-8-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-11","s":"普心","c":8,"t":"填空","card":198,"kd":"考点一 语言概述","stem":"语言的层次结构和组织规则是什么？","ans":"语言按层次结构组织：音位是最小语音单位；语素是最小音义结合单位；词是独立运用的最小单位；句子是表达的基本形式。组织规则包括语音规则、正字法规则和句法规则。","kw":["语言按层次结构组织"],"kp":"px-8-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-12","s":"普心","c":8,"t":"填空","card":199,"kd":"次要卡","stem":"双语者分为哪三种类型？","ans":"平衡双语者、早期双语者和晚期双语者；早期和晚期双语者都属于非平衡双语者。","kw":["早期双语者和晚期双语者","早期和晚期双语者都属于非平衡双语者"],"kp":"px-8-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-13","s":"普心","c":8,"t":"填空","card":200,"kd":"次要卡","stem":"第八章五个考点如何串记？","ans":"","kw":["语言的四个特征和层次结构记关键词，萨皮尔—沃尔夫假设了解即可"],"kp":"px-8-13","noteCut":5,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-14","s":"普心","c":8,"t":"填空","card":201,"kd":"次要卡","stem":"句子理解与语篇理解分别是什么？","ans":"句子理解是在词汇加工基础上通过句法分析和语义分析获得句子意义的过程。语篇理解是语言理解的最高水平，是在词汇和句子理解基础上运用推理整合等方式形成连贯心理表征的过程，包括三个层次的表征：字词水平的表层表征、语义水平的文本基础表征、语篇水平的情境模型；影响语篇理解的因素包括推理和图式策略。","kw":["句子理解是在词汇加工基础上通过句法分析和语义分析获得句子意义的过程"],"kp":"px-8-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-15","s":"普心","c":8,"t":"填空","card":202,"kd":"次要卡","stem":"什么是口语理解？麦格克效应说明了什么？","ans":"口语理解是指借助听觉输入的语音在头脑中建构意义的过程，包括语音识别、词汇识别等阶段；词汇识别涉及心理词典，是人脑中存储词条的一部词典。影响口语理解的因素包括信噪比、语境、视觉信息等。麦格克效应表明口语理解由视觉和听觉信息动态整合产生。","kw":["口语理解是指借助听觉输入的语音在头脑中建构意义的过程"],"kp":"px-8-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-16","s":"普心","c":8,"t":"填空","card":203,"kd":"次要卡","stem":"口语产生包括哪些过程？","ans":"口语产生是指通过发音器官把想法说出来的心理过程，是一个快速且高度压缩的过程。词汇产生包括计划过程和发音运动过程；计划过程分词条选择和音韵编码两个阶段，这两个阶段相互独立又交互激活；之后生成发音指令由大脑发送给发音运动系统执行。","kw":["是指通过发音器官把想法说出来…","计划过程分词条选择和音韵编码…","之后生成发音指令由大脑发送给…"],"kp":"px-8-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-17","s":"普心","c":8,"t":"填空","card":204,"kd":"次要卡","stem":"语言的定位观与脑网络观有什么区别？","ans":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和威尔尼克区，也涉及右半球部分脑区。","kw":["定位观认为四个语言中枢各自对…","语言加工不止局限于左半球的布…"],"kp":"px-8-17","bt":"b","bp":"ans","bq":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和______，也涉及右半球部分脑区。","bl":["威尔尼克区"],"bpos":[88],"bsrc":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和威尔尼克区，也涉及右半球部分脑区。","nq":1},{"id":"px-8-18","s":"普心","c":8,"t":"填空","card":205,"kd":"次要卡","stem":"萨皮尔—沃尔夫假设是什么？","ans":"也称语言相对论假设，认为语言决定了人们的思维和知觉世界的方式；极端的观点受到反对，修正后认为语言会影响而非决定人们的思维。","kw":["也称语言相对论假设","认为语言决定了人们的思维和知觉世界的方式"],"kp":"px-8-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L188","s":"普心","c":8,"t":"简答","card":188,"kd":"考点五 双语的加工","stem":"克洛尔的修正层级模型是什么？","ans":"认为低熟练水平的二语者需要通过母语词汇的中介通达概念系统，高熟练水平可以直接通达。该模型能解释翻译任务中的不对称现象：将二语翻译成母语更快，基于形式加工；将母语翻译成二语较慢，基于语义加工。","kw":["将母语翻译成二语较慢"],"kp":"px-8-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L189","s":"普心","c":8,"t":"简答","card":189,"kd":"考点五 双语的加工","stem":"格林的抑制控制模型是什么？","ans":"认为双语者通过对非目标语言的抑制来避免跨语言竞争；熟练程度越高的语言作为非目标语时被抑制的程度越高，重新激活的难度也越大。双语转换范式是考察抑制控制机制的常用方法，不同语言转换时会产生转换代价，且转换代价具有不对称性。","kw":["双语转换范式"],"kp":"px-8-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L190","s":"普心","c":8,"t":"简答","card":190,"kd":"考点四 书面语言的加工","stem":"什么是词汇识别？包括哪三个阶段？","ans":"词汇识别是指通过对词形的视觉感知通达词汇意义的过程，包括词形加工、形音转换和语义通达三个阶段。","kw":["是指通过对词形的视觉感知通达…"],"kp":"px-8-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L191","s":"普心","c":8,"t":"简答","card":191,"kd":"考点四 书面语言的加工","stem":"阅读的双通路模型是什么？由谁提出？","ans":"阅读的双通路模型由柯尔哈特提出，认为符合发音规则的词通过形音对应规则读出，不规则词需要借助心理词典中的词条读出。","kw":["由柯尔哈特提出"],"kp":"px-8-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L192","s":"普心","c":8,"t":"简答","card":192,"kd":"考点四 书面语言的加工","stem":"什么是语义启动效应？词汇识别的影响因素有哪些？","ans":"语义启动效应是指启动词与目标词有语义关联使识别更快，是研究词汇识别的重要方法。影响因素包括词频和字频、笔画数、语义特征（即多义词比单一词更易识别）、习得年龄、语境等。","kw":["语义启动效应","影响因素包括词频和字频"],"kp":"px-8-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L193","s":"普心","c":8,"t":"简答","card":193,"kd":"考点二 语言的神经基础","stem":"威尔尼克区的位置、功能和受损表现是什么？","ans":"位于左半球颞上回，是听觉性语言中枢，负责分辨语音、形成语义，与语言理解有关；受损会产生接收性失语症，病人话语流利但无意义。","kw":["位于左半球颞上回，","受损会产生接收性失语症"],"kp":"px-8-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L194","s":"普心","c":8,"t":"简答","card":194,"kd":"考点二 语言的神经基础","stem":"布洛卡区的位置、功能和受损表现是什么？","ans":"位于左半球额叶，是运动性语言中枢，负责产生发音程序；受损会产生运动性失语症，病人发音困难、说话缓慢，出现电报语。威尔尼克区和布洛卡区之间有弓形束连接。","kw":["位于左半球额叶，","受损会产生运动性失语症"],"kp":"px-8-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L195","s":"普心","c":8,"t":"简答","card":195,"kd":"考点二 语言的神经基础","stem":"角回与艾克纳尔区的位置、功能和受损表现是什么？","ans":"角回位于顶枕叶交界处，是视觉性语言中枢，与单词的视觉记忆和视听觉跨通道联合有关，受损产生语义性失语症，不能理解书面语言。艾克纳尔区位于额中回后部，是书写性语言中枢，受损产生失写症，患者能听懂看懂但丧失书写能力。","kw":["角回位于顶枕叶交界处，","艾克纳尔区位于额中回后部，"],"kp":"px-8-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L196","s":"普心","c":8,"t":"简答","card":196,"kd":"考点一 语言概述","stem":"语言的定义是什么？","ans":"语言是人类通过高度结构化的声音、文字或手势等构成的用于交流的符号系统。","kw":["语言"],"kp":"px-8-9","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-8-L198","s":"普心","c":8,"t":"简答","card":198,"kd":"考点一 语言概述","stem":"语言的层次结构和组织规则是什么？","ans":"语言按层次结构组织：音位是最小语音单位；语素是最小音义结合单位；词是独立运用的最小单位；句子是表达的基本形式。组织规则包括语音规则、正字法规则和句法规则。","kw":["语言按层次结构组织：音位","语素","词是独立运用的最小单位","句子","组织规则包括语音规则"],"kp":"px-8-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L199","s":"普心","c":8,"t":"简答","card":199,"kd":"次要卡","stem":"双语者分为哪三种类型？","ans":"平衡双语者、早期双语者和晚期双语者；早期和晚期双语者都属于非平衡双语者。","kw":["平衡双语者"],"kp":"px-8-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L202","s":"普心","c":8,"t":"简答","card":202,"kd":"次要卡","stem":"什么是口语理解？麦格克效应说明了什么？","ans":"口语理解是指借助听觉输入的语音在头脑中建构意义的过程，包括语音识别、词汇识别等阶段；词汇识别涉及心理词典，是人脑中存储词条的一部词典。影响口语理解的因素包括信噪比、语境、视觉信息等。麦格克效应表明口语理解由视觉和听觉信息动态整合产生。","kw":["口语理解","词汇识别涉及心理词典，","影响口语理解的因素包括信噪比"],"kp":"px-8-15","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-8-L204","s":"普心","c":8,"t":"简答","card":204,"kd":"次要卡","stem":"语言的定位观与脑网络观有什么区别？","ans":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和威尔尼克区，也涉及右半球部分脑区。","kw":["定位观认为四个语言中枢各自对…","语言加工不止局限于左半球的布…"],"kp":"px-8-17","alt":1,"bt":"b","bp":"ans","bq":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和______，也涉及右半球部分脑区。","bl":["威尔尼克区"],"bpos":[88],"bsrc":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和威尔尼克区，也涉及右半球部分脑区。","nq":1},{"id":"px-9-1","s":"普心","c":9,"t":"填空","card":206,"kd":"考点七 意志","stem":"意志的定义是什么？有哪三个基本特征？","ans":"意志是人为了一定目标、自觉组织行为并与克服困难相联系的心理过程。三个基本特征：预定目的是人与动物的本质区别，是意志行动的前提；随意运动是意志行动的基础，指在意识调节控制下具有一定目的要求的运动；克服困难是意志行动的核心与重要特征。","kw":["意志是人为了一定目标","自觉组织行为并与克服困难相联系的心理过程"],"kp":"px-9-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-2","s":"普心","c":9,"t":"填空","card":207,"kd":"考点七 意志","stem":"意志行动中的四种冲突类型是什么？","ans":"双趋冲突；双避冲突；趋避冲突；多重趋避冲突","kw":["多重趋避冲突"],"kp":"px-9-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-3","s":"普心","c":9,"t":"填空","card":208,"kd":"考点七 意志","stem":"意志行动的过程分为哪两个阶段？","ans":"采取决定阶段是开始阶段，包括选择目标、设定标准、制定计划、解决心理冲突、做出决策等环节。执行决定阶段是完成阶段，也是最重要环节，使内心追求的目标得以实现，需要具备三个条件：明确具体的行动目标和方式；具备主客观条件；行动有实现要求。","kw":["采取决定阶段是开始阶段"],"kp":"px-9-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-4","s":"普心","c":9,"t":"填空","card":209,"kd":"考点七 意志","stem":"意志的四种品质及其相反品质分别是什么？","ans":"独立性（自己做决定并负责，相反品质是易受暗示性或武断）；坚定性（坚持不懈、克服困难，相反品质是动摇性或刚愎执拗）；果断性（迅速辨明是非及时决定，相反品质是优柔寡断或鲁莽草率）；自制力（善于控制自我，相反品质是任性或怯懦）。","kw":["独立性（自己做决定并负责","相反品质是易受暗示性或武断"],"kp":"px-9-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-5","s":"普心","c":9,"t":"填空","card":210,"kd":"考点六 动机理论","stem":"本能论的三位代表人物各持什么观点？","ans":"麦独孤认为人类所有行为以十八种本能为基础，本能具有能量、行为和目标指向三个成分。弗洛伊德认为行为由生本能与死本能决定，本能驱力使人产生紧张状态，驱动人采取行动消除紧张。马斯洛认为人类的需要都是先天的，行为由自我实现的潜能决定。评价：本能论不能确切解释行为原因，有循环论证之嫌。","kw":["麦独孤认为人类所有行为以十八种本能为基础"],"kp":"px-9-5","bt":"b","bp":"ans","bq":"麦独孤认为人类所有行为以十八种本能为基础，本能具有能量、行为和目标指向三个成分。弗洛伊德认为行为由生本能与死本能决定，本能驱力使人产生紧张状态，驱动人采取行动消除紧张。马斯洛认为人类的需要都是先天的，行为由______的潜能决定。评价：本能论不能确切解释行为原因，有循环论证之嫌。","bl":["自我实现"],"bpos":[103],"bsrc":"麦独孤认为人类所有行为以十八种本能为基础，本能具有能量、行为和目标指向三个成分。弗洛伊德认为行为由生本能与死本能决定，本能驱力使人产生紧张状态，驱动人采取行动消除紧张。马斯洛认为人类的需要都是先天的，行为由自我实现的潜能决定。评价：本能论不能确切解释行为原因，有循环论证之嫌。","nq":1},{"id":"px-9-6","s":"普心","c":9,"t":"填空","card":211,"kd":"考点六 动机理论","stem":"伍德沃斯的驱力概念与赫尔的驱力降低理论是什么？","ans":"伍德沃斯提出驱力概念以代替本能，驱力是由生理需要产生的紧张状态，驱动个体以满足需要、消除紧张、恢复平衡。赫尔提出驱力降低理论，认为行为由习惯支配，驱力提供能量、习惯决定方向，用公式表示为行为潜能等于驱力乘以习惯强度。驱力分原始驱力（来自内部，不需习得）和获得性驱力（通过学习形成）。评价：该理论能解释部分生理行为，但难以解释复杂社会行为。","kw":["伍德沃斯提出驱力概念以代替本能","驱力是由生理需要产生的紧张状态"],"kp":"px-9-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-7","s":"普心","c":9,"t":"填空","card":212,"kd":"考点六 动机理论","stem":"什么是诱因理论？赫布和柏林的唤醒理论有哪三个原理？","ans":"斯彭斯针对驱力理论的不足提出诱因理论，认为诱因是能满足个体需要的外在因素，能激发和诱使个体朝向目标；诱因分积极诱因和消极诱因；赫尔后来将诱因纳入公式，修改为行为潜能等于驱力乘以习惯强度再乘以诱因。赫布和柏林提出唤醒理论，认为人维持最佳唤醒水平，包括三个原理：人们偏好最佳唤醒水平，刺激水平和偏好呈倒U型关系；简化原理，重复刺激使唤醒降低；个体经验影响偏好，经验丰富者偏好复杂刺激。","kw":["诱因分积极诱因和消极诱因","赫尔后来将诱因纳入公式","赫布和柏林提出唤醒理论","简化原理","个体经验影响偏好"],"kp":"px-9-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-8","s":"普心","c":9,"t":"填空","card":213,"kd":"考点六 动机理论","stem":"托尔曼的期待价值理论是什么？","ans":"在动物实验基础上提出，认为达到目标的期待是行为的决定因素；个体完成任务的动机由对成功可能性的期待和对任务所赋予的价值决定。","kw":["在动物实验基础上提出","认为达到目标的期待是行为的决定因素"],"kp":"px-9-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-9","s":"普心","c":9,"t":"填空","card":214,"kd":"考点六 动机理论","stem":"归因理论中海德、罗特、韦纳各提出了什么？","ans":"人们从行为结果寻求原因的过程。海德最早将原因分为内部和外部；罗特提出控制点概念，分内控型和外控型；韦纳提出三维度六因素的归因模型：三个维度是内外源、稳定性、可控性；六个因素是能力、努力、运气、工作难度、身心状态、外界环境。韦纳强调引导学生将成败归因于内部的、不稳定的和可控的原因。","kw":["人们从行为结果寻求原因的过程","海德最早将原因分为内部和外部"],"kp":"px-9-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-10","s":"普心","c":9,"t":"填空","card":215,"kd":"考点六 动机理论","stem":"自我决定理论认为人有哪三种基本心理需要？","ans":"德西和瑞安强调自我决定在行为选择中的作用，把动机分为无动机、外部动机和内部动机三种形式，三者是一个连续体；认为人有三种基本心理需要：自主需要（自我决定的需要）、能力需要（相信自己能胜任）、归属需要（与他人相联系获得关爱）。","kw":["德西和瑞安强调自我决定在行为选择中的作用"],"kp":"px-9-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-11","s":"普心","c":9,"t":"填空","card":216,"kd":"考点六 动机理论","stem":"班杜拉的自我效能理论包括哪些内容？","ans":"认为行为不仅受行为结果影响，还受自我效能感影响。对期待的两种分类：结果期待（对行为导致什么结果的推测）和效能期待即自我效能感（对自己实施某行为的能力的主观判断）。自我效能感的四个来源：个体成败经验（影响最大）、替代性经验（观察榜样）、言语劝说、生理和情绪状态。作用：决定对活动的选择和坚持性，影响活动时的情绪，影响对困难的态度，影响新行为的习得。","kw":["认为行为不仅受行为结果影响"],"kp":"px-9-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-12","s":"普心","c":9,"t":"填空","card":217,"kd":"考点六 动机理论","stem":"成就目标理论按评价标准分哪三种？基本类型分哪两种？","ans":"尼克尔斯和德韦克将成就目标引入动机领域。按评价标准分三种：任务标准（个体是否达到活动任务的要求）、自我标准（个体是否比以前做得更好）、他人标准（个体与其他人相比是否更好）。基本类型分掌握目标（关注掌握知识和提高能力，持能力增长观，选中等难度任务）和成绩目标（关注好名次好成绩，持能力实体观，选较难或较易任务）。掌握目标更能激发内在动机。","kw":["按评价标准分三种","基本类型分掌握目标","掌握目标更能激发内在动机"],"kp":"px-9-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-13","s":"普心","c":9,"t":"填空","card":218,"kd":"考点五 社会性动机","stem":"什么是成就动机？麦克莱兰提出的三个标准是什么？","ans":"成就动机是指人们希望从事有挑战性活动并取得优异成绩的动机。麦克莱兰认为成就行为要遵循三个标准：有卓越的社会目标；以独立方式完成；坚持不懈的努力。父母的教养方式会影响儿童成就动机的形成。","kw":["成就动机是指人们希望从事有挑战性活动并取得优异成绩的动机"],"kp":"px-9-13","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-9-14","s":"普心","c":9,"t":"填空","card":219,"kd":"考点五 社会性动机","stem":"阿特金森的成就动机理论是什么？","ans":"认为成就动机是期望成功和害怕失败之间情绪冲突的结果，由成就需要、成功可能性和成功诱因值共同决定。力求成功者行为目标定位是获得成功，倾向于选择中等难度任务；避免失败者行为目标定位是避免失败，倾向于选择容易或很难的任务。","kw":["认为成就动机是期望成功和害怕失败之间情绪冲突的结果"],"kp":"px-9-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-15","s":"普心","c":9,"t":"填空","card":220,"kd":"考点四 生理性动机","stem":"饥饿产生的原因有哪些？","ans":"第一个胃壁收缩，坎农的气球实验表明胃壁收缩可能与饥饿有关；第二个血糖下降，血糖浓度下降时饥饿感增强；第三个下丘脑控制，下丘脑背外侧是饥饿中枢，腹内侧是饱食中枢。进食障碍有神经性厌食症和贪食症。","kw":["坎农的气球实验表明胃壁收缩可能与饥饿有关"],"kp":"px-9-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-16","s":"普心","c":9,"t":"填空","card":221,"kd":"考点三 动机与行为","stem":"动机与行为的关系是什么？","ans":"个体的活动由动机体系推动，包括主导动机和从属动机；动机与行为的关系比较复杂。","kw":["个体的活动由动机体系推动","包括主导动机和从属动机"],"kp":"px-9-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-17","s":"普心","c":9,"t":"填空","card":222,"kd":"考点三 动机与行为","stem":"耶克斯—多德森定律的内容是什么？","ans":"动机强度与行为效率呈倒U形曲线关系，中等动机水平最有利于任务完成。具体来说：第一，各种活动都存在一个最佳动机水平，动机不足或过强都会降低效率；第二，动机的最佳水平随任务性质不同而改变，任务容易时最佳动机水平较高，任务难度增加使最佳动机水平逐渐下降，即困难任务需要较低动机水平。","kw":["动机强度与行为效率呈倒U形曲线关系","中等动机水平最有利于任务完成"],"kp":"px-9-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-18","s":"普心","c":9,"t":"填空","card":223,"kd":"考点二 动机与需要","stem":"什么是需要？需要有哪些特性？","ans":"需要是有机体内部某种缺乏或不平衡状态，是动机的产生基础和活动的基本动力。需要有四个特性：对象性、独特性、阶段性、社会性。","kw":["需要","需要有四个特性"],"kp":"px-9-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-19","s":"普心","c":9,"t":"填空","card":224,"kd":"考点二 动机与需要","stem":"需要按哪两个标准分类？","ans":"按起源分自然需要和社会需要；按指向对象分物质需要和精神需要。","kw":[" 按指向对象分物质"],"kp":"px-9-19","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-20","s":"普心","c":9,"t":"填空","card":225,"kd":"考点二 动机与需要","stem":"马斯洛的需要层次理论包括哪五个层次？","ans":"马斯洛从人类动机角度出发，将需要分为五个层次，从低到高依次是：生理需要（最基本最重要）；安全需要（保护自己免受伤害）；归属与爱的需要（与他人建立感情联系）；尊重的需要（自尊和受他人尊重）；自我实现需要（追求潜能实现）。","kw":["马斯洛从人类动机角度出发","将需要分为五个层次"],"kp":"px-9-20","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-21","s":"普心","c":9,"t":"填空","card":226,"kd":"考点二 动机与需要","stem":"低级需要与高级需要有什么区别？","ans":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能自我实现的人是极少数。","kw":["低级需要又称缺失需要","高级需要即生长需要"],"kp":"px-9-21","bt":"b","bp":"ans","bq":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能______的人是极少数。","bl":["自我实现"],"bpos":[69],"bsrc":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能自我实现的人是极少数。","nq":1},{"id":"px-9-22","s":"普心","c":9,"t":"填空","card":227,"kd":"考点一 动机概述","stem":"动机的定义是什么？","ans":"动机是激发和维持个体进行活动，并指引活动朝向某一目标的心理倾向或内部动力。","kw":[" 并指引活动朝向某"],"kp":"px-9-22","noteCut":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-9-23","s":"普心","c":9,"t":"填空","card":228,"kd":"考点一 动机概述","stem":"动机有哪三大功能？","ans":"激活功能（发动行为使个体由静止转向活动）；指向功能（将行为指向一定目标）；维持和调整功能（表现为对行为的坚持性）。","kw":["激活功能（发动行为使个体由静止转向活动"],"kp":"px-9-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-24","s":"普心","c":9,"t":"填空","card":229,"kd":"次要卡","stem":"第九章七个考点如何串记？","ans":"","kw":["动机的定义和三大功能（激活","考点二动机与需要"],"kp":"px-9-24","noteCut":6,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-25","s":"普心","c":9,"t":"填空","card":230,"kd":"次要卡","stem":"动机理论的发展脉络如何小结？","ans":"从本能论到驱力理论再到认知理论，动机理论从强调先天本能到强调外在诱因再到强调认知因素，认识在不断深化。","kw":[" 动机理论从强调先"],"kp":"px-9-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-26","s":"普心","c":9,"t":"填空","card":231,"kd":"次要卡","stem":"权力动机与交往动机分别是什么？","ans":"权力动机分个人化权力动机和社会化权力动机；交往动机是以交往需要为基础，希望与人来往得到关心。","kw":["交往动机"],"kp":"px-9-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-27","s":"普心","c":9,"t":"填空","card":232,"kd":"次要卡","stem":"兴趣如何分类？","ans":"兴趣分直接兴趣和间接兴趣、个体兴趣和情境兴趣。学习动机是推动人们积极学习的内部动力。","kw":["分直接兴趣和间接兴趣"],"kp":"px-9-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-28","s":"普心","c":9,"t":"填空","card":233,"kd":"次要卡","stem":"渴分为哪两种？","ans":"渴由体内水分不足引起，驱动力比饥饿更强；分为低血容量性渴和渗透性渴，均与下丘脑有关。","kw":["渴由体内水分不足引起","驱动力比饥饿更强；分为低血容量性渴和渗透性渴"],"kp":"px-9-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-29","s":"普心","c":9,"t":"填空","card":234,"kd":"次要卡","stem":"性动机有什么特点？","ans":"以性需要为基础，与性成熟和性激素有关；外界刺激和学习影响更大。","kw":["与性成熟和性激素有关"],"kp":"px-9-29","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-30","s":"普心","c":9,"t":"填空","card":235,"kd":"次要卡","stem":"什么是心流体验？","ans":"心流体验是指个人将精力完全投注在某种活动中达到忘我的状态，个体高度兴奋并具有充实感。","kw":["是指个人将精力完全投注在某种活动中达到忘我的状态"],"kp":"px-9-30","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-9-31","s":"普心","c":9,"t":"填空","card":236,"kd":"次要卡","stem":"如何评价马斯洛的需要层次理论？","ans":"马斯洛把需要看作有组织的系统，在教育管理等领域广泛应用；但认为需要源于先天本能，模糊了生物需要与社会需要的差异。","kw":["马斯洛把需要看作有组织的系统","在教育管理等领域广泛应用"],"kp":"px-9-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-32","s":"普心","c":9,"t":"填空","card":237,"kd":"次要卡","stem":"动机与活动的关系是什么？","ans":"动机通过活动表现与达成目的，包括心理活动和身体活动。","kw":[" 包括心理活动和身"],"kp":"px-9-32","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-33","s":"普心","c":9,"t":"填空","card":238,"kd":"次要卡","stem":"动机的神经机制涉及哪三个神经网络？","ans":"奖励回路负责奖赏处理；价值决策主要与眶额皮层和腹内侧前额叶皮层有关；目标导向控制涉及扣带回前部皮层和背外侧前额叶皮层。","kw":["奖励回路负责奖赏处理","价值决策主要与眶额皮层和腹内侧前额叶皮层有关"],"kp":"px-9-33","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L206","s":"普心","c":9,"t":"简答","card":206,"kd":"考点七 意志","stem":"意志的定义是什么？有哪三个基本特征？","ans":"意志是人为了一定目标、自觉组织行为并与克服困难相联系的心理过程。三个基本特征：预定目的是人与动物的本质区别，是意志行动的前提；随意运动是意志行动的基础，指在意识调节控制下具有一定目的要求的运动；克服困难是意志行动的核心与重要特征。","kw":["意志","三个基本特征：预定目的","随意运动","克服困难"],"kp":"px-9-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L207","s":"普心","c":9,"t":"简答","card":207,"kd":"考点七 意志","stem":"意志行动中的四种冲突类型是什么？","ans":"双趋冲突；双避冲突；趋避冲突；多重趋避冲突","kw":["多重趋避冲突"],"kp":"px-9-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L208","s":"普心","c":9,"t":"简答","card":208,"kd":"考点七 意志","stem":"意志行动的过程分为哪两个阶段？","ans":"采取决定阶段是开始阶段，包括选择目标、设定标准、制定计划、解决心理冲突、做出决策等环节。执行决定阶段是完成阶段，也是最重要环节，使内心追求的目标得以实现，需要具备三个条件：明确具体的行动目标和方式；具备主客观条件；行动有实现要求。","kw":["采取决定阶段","执行决定阶段","具备主客观条件","行动有实现要求"],"kp":"px-9-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L211","s":"普心","c":9,"t":"简答","card":211,"kd":"考点六 动机理论","stem":"伍德沃斯的驱力概念与赫尔的驱力降低理论是什么？","ans":"伍德沃斯提出驱力概念以代替本能，驱力是由生理需要产生的紧张状态，驱动个体以满足需要、消除紧张、恢复平衡。赫尔提出驱力降低理论，认为行为由习惯支配，驱力提供能量、习惯决定方向，用公式表示为行为潜能等于驱力乘以习惯强度。驱力分原始驱力（来自内部，不需习得）和获得性驱力（通过学习形成）。评价：该理论能解释部分生理行为，但难以解释复杂社会行为。","kw":["赫尔提出驱力降低理论","驱力分原始驱力","评价"],"kp":"px-9-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L212","s":"普心","c":9,"t":"简答","card":212,"kd":"考点六 动机理论","stem":"什么是诱因理论？赫布和柏林的唤醒理论有哪三个原理？","ans":"斯彭斯针对驱力理论的不足提出诱因理论，认为诱因是能满足个体需要的外在因素，能激发和诱使个体朝向目标；诱因分积极诱因和消极诱因；赫尔后来将诱因纳入公式，修改为行为潜能等于驱力乘以习惯强度再乘以诱因。赫布和柏林提出唤醒理论，认为人维持最佳唤醒水平，包括三个原理：人们偏好最佳唤醒水平，刺激水平和偏好呈倒U型关系；简化原理，重复刺激使唤醒降低；个体经验影响偏好，经验丰富者偏好复杂刺激。","kw":["诱因分积极诱因和消极诱因","赫尔后来将诱因纳入公式","赫布和柏林提出唤醒理论","简化原理","个体经验影响偏好"],"kp":"px-9-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L213","s":"普心","c":9,"t":"简答","card":213,"kd":"考点六 动机理论","stem":"托尔曼的期待价值理论是什么？","ans":"在动物实验基础上提出，认为达到目标的期待是行为的决定因素；个体完成任务的动机由对成功可能性的期待和对任务所赋予的价值决定。","kw":["在动物实验基础上提出"],"kp":"px-9-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L214","s":"普心","c":9,"t":"简答","card":214,"kd":"考点六 动机理论","stem":"归因理论中海德、罗特、韦纳各提出了什么？","ans":"人们从行为结果寻求原因的过程。海德最早将原因分为内部和外部；罗特提出控制点概念，分内控型和外控型；韦纳提出三维度六因素的归因模型：三个维度是内外源、稳定性、可控性；六个因素是能力、努力、运气、工作难度、身心状态、外界环境。韦纳强调引导学生将成败归因于内部的、不稳定的和可控的原因。","kw":["人们从行为结果寻求原因的过程","海德最早将原因分为内部和外部","罗特提出控制点概念","六个因素"],"kp":"px-9-9","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L215","s":"普心","c":9,"t":"简答","card":215,"kd":"考点六 动机理论","stem":"自我决定理论认为人有哪三种基本心理需要？","ans":"德西和瑞安强调自我决定在行为选择中的作用，把动机分为无动机、外部动机和内部动机三种形式，三者是一个连续体；认为人有三种基本心理需要：自主需要（自我决定的需要）、能力需要（相信自己能胜任）、归属需要（与他人相联系获得关爱）。","kw":["认为人有三种基本心理需要"],"kp":"px-9-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L216","s":"普心","c":9,"t":"简答","card":216,"kd":"考点六 动机理论","stem":"班杜拉的自我效能理论包括哪些内容？","ans":"认为行为不仅受行为结果影响，还受自我效能感影响。对期待的两种分类：结果期待（对行为导致什么结果的推测）和效能期待即自我效能感（对自己实施某行为的能力的主观判断）。自我效能感的四个来源：个体成败经验（影响最大）、替代性经验（观察榜样）、言语劝说、生理和情绪状态。作用：决定对活动的选择和坚持性，影响活动时的情绪，影响对困难的态度，影响新行为的习得。","kw":["认为行为不仅受行为结果影响","对期待的两种分类","自我效能感的四个来源","作用"],"kp":"px-9-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L217","s":"普心","c":9,"t":"简答","card":217,"kd":"考点六 动机理论","stem":"成就目标理论按评价标准分哪三种？基本类型分哪两种？","ans":"尼克尔斯和德韦克将成就目标引入动机领域。按评价标准分三种：任务标准（个体是否达到活动任务的要求）、自我标准（个体是否比以前做得更好）、他人标准（个体与其他人相比是否更好）。基本类型分掌握目标（关注掌握知识和提高能力，持能力增长观，选中等难度任务）和成绩目标（关注好名次好成绩，持能力实体观，选较难或较易任务）。掌握目标更能激发内在动机。","kw":["按评价标准分三种","基本类型分掌握目标","掌握目标更能激发内在动机"],"kp":"px-9-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L219","s":"普心","c":9,"t":"简答","card":219,"kd":"考点五 社会性动机","stem":"阿特金森的成就动机理论是什么？","ans":"认为成就动机是期望成功和害怕失败之间情绪冲突的结果，由成就需要、成功可能性和成功诱因值共同决定。力求成功者行为目标定位是获得成功，倾向于选择中等难度任务；避免失败者行为目标定位是避免失败，倾向于选择容易或很难的任务。","kw":["认为成就动机","力求成功者行为目标定位","避免失败者行为目标定位"],"kp":"px-9-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L220","s":"普心","c":9,"t":"简答","card":220,"kd":"考点四 生理性动机","stem":"饥饿产生的原因有哪些？","ans":"第一个胃壁收缩，坎农的气球实验表明胃壁收缩可能与饥饿有关；第二个血糖下降，血糖浓度下降时饥饿感增强；第三个下丘脑控制，下丘脑背外侧是饥饿中枢，腹内侧是饱食中枢。进食障碍有神经性厌食症和贪食症。","kw":["第一个胃壁收缩","第二个血糖下降","第三个下丘脑控制"],"kp":"px-9-15","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L225","s":"普心","c":9,"t":"简答","card":225,"kd":"考点二 动机与需要","stem":"马斯洛的需要层次理论包括哪五个层次？","ans":"马斯洛从人类动机角度出发，将需要分为五个层次，从低到高依次是：生理需要（最基本最重要）；安全需要（保护自己免受伤害）；归属与爱的需要（与他人建立感情联系）；尊重的需要（自尊和受他人尊重）；自我实现需要（追求潜能实现）。","kw":["马斯洛从人类动机角度出发","安全需要","归属与爱的需要","尊重的需要","自我实现需要"],"kp":"px-9-20","alt":1,"noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L226","s":"普心","c":9,"t":"简答","card":226,"kd":"考点二 动机与需要","stem":"低级需要与高级需要有什么区别？","ans":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能自我实现的人是极少数。","kw":["低级需要又称缺失需要","高级需要即生长需要"],"kp":"px-9-21","alt":1,"bt":"b","bp":"ans","bq":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能______的人是极少数。","bl":["自我实现"],"bpos":[69],"bsrc":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能自我实现的人是极少数。","nq":1},{"id":"px-9-L227","s":"普心","c":9,"t":"简答","card":227,"kd":"考点一 动机概述","stem":"动机的定义是什么？","ans":"动机是激发和维持个体进行活动，并指引活动朝向某一目标的心理倾向或内部动力","kw":["动机"],"kp":"px-9-22","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-9-L228","s":"普心","c":9,"t":"简答","card":228,"kd":"考点一 动机概述","stem":"动机有哪三大功能？","ans":"激活功能（发动行为使个体由静止转向活动）；指向功能（将行为指向一定目标）；维持和调整功能（表现为对行为的坚持性）。","kw":["激活功能","指向功能","维持和调整功能"],"kp":"px-9-23","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L230","s":"普心","c":9,"t":"简答","card":230,"kd":"次要卡","stem":"动机理论的发展脉络如何小结？","ans":"从本能论到驱力理论再到认知理论，动机理论从强调先天本能到强调外在诱因再到强调认知因素，认识在不断深化。","kw":["从本能论到驱力理论再到认知理…"],"kp":"px-9-25","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L234","s":"普心","c":9,"t":"简答","card":234,"kd":"次要卡","stem":"性动机有什么特点？","ans":"以性需要为基础，与性成熟和性激素有关；外界刺激和学习影响更大。","kw":["以性需要为基础","外界刺激和学习影响更大"],"kp":"px-9-29","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L236","s":"普心","c":9,"t":"简答","card":236,"kd":"次要卡","stem":"如何评价马斯洛的需要层次理论？","ans":"马斯洛把需要看作有组织的系统，在教育管理等领域广泛应用；但认为需要源于先天本能，模糊了生物需要与社会需要的差异。","kw":["马斯洛把需要看作有组织的系统","但认为需要源于先天本能"],"kp":"px-9-31","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-9-L238","s":"普心","c":9,"t":"简答","card":238,"kd":"次要卡","stem":"动机的神经机制涉及哪三个神经网络？","ans":"奖励回路负责奖赏处理；价值决策主要与眶额皮层和腹内侧前额叶皮层有关；目标导向控制涉及扣带回前部皮层和背外侧前额叶皮层。","kw":["奖励回路负责奖赏处理"],"kp":"px-9-33","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-1","s":"社心","c":10,"t":"填空","card":127,"kd":"考点一 人际吸引","stem":"人际吸引的定义","ans":"人际吸引是指人与人之间的相互接纳和喜欢，人需要和别人交往，并建立和保持良好的人际关系。","kw":["人际吸引是指人与人之间的相互接纳和喜欢"],"kp":"sx-10-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-10-2","s":"社心","c":10,"t":"填空","card":128,"kd":"考点一 人际吸引","stem":"人际吸引的三个基本原则","ans":"（1）强化原则：我们喜欢能给予我们奖赏的人，讨厌给我们惩罚的人；（2）社会交换：取决于交往时对成本和收益的评价，收益大于成本就继续交往；（3）联结原则：喜欢那些与美好经验联结在一起的人，厌恶那些与不愉快经验联结在一起的人。","kw":["我们喜欢能给予我们奖赏的人","讨厌给我们惩罚的人"],"kp":"sx-10-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-3","s":"社心","c":10,"t":"填空","card":129,"kd":"考点一 人际吸引","stem":"曝光效应（扎荣克提出）","ans":"人们对反复出现的人或事物容易产生好感。限制：一开始的态度是喜欢或中性时，接触越多越喜欢；一开始讨厌的话，接触越多反而越讨厌。","kw":["人们对反复出现的人或事物容易产生好感"],"kp":"sx-10-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-4","s":"社心","c":10,"t":"填空","card":130,"kd":"考点一 人际吸引","stem":"匹配现象","ans":"人们通常会接近在吸引力方面与自己大致匹配的人，即使不匹配也有其他品质补偿。","kw":["人们通常会接近在吸引力方面与自己大致匹配的人"],"kp":"sx-10-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-5","s":"社心","c":10,"t":"填空","card":131,"kd":"考点一 人际吸引","stem":"相似性与互补性对喜欢的作用","ans":"相似产生喜欢：某人的态度与我们越相似，我们就越喜欢他。不相似导致不喜欢，且不同态度对喜欢的抑制作用比相似态度对喜欢的促进作用更强。互补性在某些方面促进关系改进，但对立者并不相吸。","kw":["某人的态度与我们越相似","不相似导致不喜欢"],"kp":"sx-10-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-6","s":"社心","c":10,"t":"填空","card":132,"kd":"考点一 人际吸引","stem":"关系中的奖赏（吸引奖赏理论）","ans":"我们喜欢那些回报我们、或与我们得到的回报有关的人。接近性能带来奖赏，我们喜欢有吸引力的人是因为期望其有其他好品质，相似的观点带来回报和被认同感。","kw":["我们喜欢那些回报我们","或与我们得到的回报有关的人"],"kp":"sx-10-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-7","s":"社心","c":10,"t":"填空","card":133,"kd":"考点一 人际吸引","stem":"公平理论与关系满意度","ans":"按照公平理论，当交往双方的收益和成本之比大致相等时，关系中的幸福感最高。","kw":["当交往双方的收益和成本之比大致相等时"],"kp":"sx-10-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-8","s":"社心","c":10,"t":"填空","card":134,"kd":"考点二 爱情","stem":"斯滕伯格爱情三元理论：三个成分","ans":"（1）激情：情绪上的着迷，是动机性的，与生理唤起有关；（2）亲密：心理上喜欢的感觉，需要加强联系和给予支持，是情绪性的；（3）承诺：心理或口头的预期，是认知性的。","kw":["心理上喜欢的感觉","需要加强联系和给予支持"],"kp":"sx-10-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-9","s":"社心","c":10,"t":"填空","card":135,"kd":"考点二 爱情","stem":"斯滕伯格：爱情的七种形式","ans":"喜欢式（只有亲密）、空洞式（只有承诺）、迷恋式（只有激情）、浪漫式（激情+亲密）、伴侣式（亲密+承诺）、愚蠢式（激情+承诺）、完美式（三者皆有）。","kw":["喜欢式（只有亲密","空洞式（只有承诺"],"kp":"sx-10-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-L1","s":"社心","c":10,"t":"简答","card":127,"kd":"考点一 人际吸引","stem":"人际吸引的定义","ans":"人际吸引是指人与人之间的相互接纳和喜欢，人需要和别人交往，并建立和保持良好的人际关系。","kw":["人际吸引"],"kp":"sx-10-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-10-L2","s":"社心","c":10,"t":"简答","card":128,"kd":"考点一 人际吸引","stem":"人际吸引的三个基本原则","ans":"（1）强化原则：我们喜欢能给予我们奖赏的人，讨厌给我们惩罚的人；（2）社会交换：取决于交往时对成本和收益的评价，收益大于成本就继续交往；（3）联结原则：喜欢那些与美好经验联结在一起的人，厌恶那些与不愉快经验联结在一起的人。","kw":["（1）强化原则","（2）社会交换","（3）联结原则"],"kp":"sx-10-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-L3","s":"社心","c":10,"t":"简答","card":129,"kd":"考点一 人际吸引","stem":"曝光效应（扎荣克提出）","ans":"人们对反复出现的人或事物容易产生好感。限制：一开始的态度是喜欢或中性时，接触越多越喜欢；一开始讨厌的话，接触越多反而越讨厌。","kw":["限制：一开始的态度","一开始讨厌的话"],"kp":"sx-10-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-L6","s":"社心","c":10,"t":"简答","card":132,"kd":"考点一 人际吸引","stem":"关系中的奖赏（吸引奖赏理论）","ans":"我们喜欢那些回报我们、或与我们得到的回报有关的人。接近性能带来奖赏，我们喜欢有吸引力的人是因为期望其有其他好品质，相似的观点带来回报和被认同感。","kw":["我们喜欢那些回报我们","接近性能带来奖赏"],"kp":"sx-10-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-L7","s":"社心","c":10,"t":"简答","card":133,"kd":"考点一 人际吸引","stem":"公平理论与关系满意度","ans":"按照公平理论，当交往双方的收益和成本之比大致相等时，关系中的幸福感最高。","kw":["按照公平理论"],"kp":"sx-10-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-10-L8","s":"社心","c":10,"t":"简答","card":134,"kd":"考点二 爱情","stem":"斯滕伯格爱情三元理论：三个成分","ans":"（1）激情：情绪上的着迷，是动机性的，与生理唤起有关；（2）亲密：心理上喜欢的感觉，需要加强联系和给予支持，是情绪性的；（3）承诺：心理或口头的预期，是认知性的。","kw":["（1）激情","（2）亲密","（3）承诺"],"kp":"sx-10-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-1","s":"社心","c":11,"t":"填空","card":15,"kd":"考点一 亲社会行为的含义","stem":"亲社会行为的定义","ans":"人类的亲社会行为是指任何自发性地帮助他人、或者有意图地帮助他人的行为。","kw":["人类的亲社会行为是指任何自发性地帮助他人"],"kp":"sx-11-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-2","s":"社心","c":11,"t":"填空","card":16,"kd":"考点一 亲社会行为的含义","stem":"助人行为的定义","ans":"助人行为是指一切有利于他人的行为，包括期待回报的行为。","kw":["助人行为是指一切有利于他人的行为"],"kp":"sx-11-2","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-3","s":"社心","c":11,"t":"填空","card":17,"kd":"考点一 亲社会行为的含义","stem":"利他行为的定义","ans":"利他行为是指在毫无回报的期待下，个体表现出自愿帮助他人的行为。助人行为涵盖范围更广，利他行为是更高层次的不求回报的形式。","kw":["利他行为是指在毫无回报的期待下","个体表现出自愿帮助他人的行为"],"kp":"sx-11-3","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-4","s":"社心","c":11,"t":"填空","card":18,"kd":"考点二 帮助行为的理论","stem":"帮助行为的五种理论分别是哪五个？","ans":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与利他主义、学习理论。","kw":["社会交换理论","演化心理学理论"],"kp":"sx-11-4","bt":"b","bp":"ans","bq":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与______、学习理论。","bl":["利他主义"],"bpos":[29],"bsrc":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与利他主义、学习理论。","nq":1},{"id":"sx-11-5","s":"社心","c":11,"t":"填空","card":19,"kd":"考点二 帮助行为的理论","stem":"社会交换理论如何解释帮助行为？","ans":"该理论认为人们的许多行为源于对利益和成本的衡量，希望获得最大化收益和最小化付出。助人行为的收益包括得到赞扬、奖励和对未来回报的预期；成本包括时间、金钱和可能受到的责难。内部回报方面，帮助行为提升自我价值感。","kw":["该理论认为人们的许多行为源于对利益和成本的衡量"],"kp":"sx-11-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-6","s":"社心","c":11,"t":"填空","card":20,"kd":"考点二 帮助行为的理论","stem":"社会规范理论：驱动帮助行为的两种规范","ans":"（1）互惠规范：对那些曾帮助过我们的人应当施以帮助而不是伤害。（2）社会责任规范：应该帮助那些需要帮助的人而不考虑利益交换。归因影响帮助——把需要归因为不可控的困境就会帮助，归因为个人决定则不帮。","kw":["对那些曾帮助过我们的人应当施以帮助而不是伤害"],"kp":"sx-11-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-7","s":"社心","c":11,"t":"填空","card":21,"kd":"考点二 帮助行为的理论","stem":"演化心理学解释帮助行为的三个机制","ans":"（1）亲缘选择：偏袒与自己拥有共同基因的人；（2）互惠：对回报的期待增加帮助行为，在小而封闭的群体中效果最好；（3）群体选择：相互支持的利他群体在竞争中存活更久。","kw":["偏袒与自己拥有共同基因的人","对回报的期待增加帮助行为"],"kp":"sx-11-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-8","s":"社心","c":11,"t":"填空","card":22,"kd":"考点二 帮助行为的理论","stem":"巴特森的移情（共情）—利他主义假说","ans":"巴特森认为人们的动机有时是纯粹的利他主义，唯一目的就是帮助他人。当我们产生同理心时，会更多关注受害者的痛苦而非自己的不适。","kw":["巴特森认为人们的动机有时是纯粹的利他主义"],"kp":"sx-11-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-9","s":"社心","c":11,"t":"填空","card":23,"kd":"考点三 帮助行为的影响因素","stem":"旁观者效应的定义","ans":"其他人越多，帮助可能性越小、延迟时间越长，这种现象称为旁观者效应。","kw":["帮助可能性越小","这种现象称为旁观者效应"],"kp":"sx-11-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-10","s":"社心","c":11,"t":"填空","card":24,"kd":"考点三 帮助行为的影响因素","stem":"引起旁观者效应的三个原因","ans":"（1）责任分散：周围人越多，每个人分担的责任越少；（2）情境的不明确性：他人的行为影响个体对情境的定义；（3）评价恐惧：人们试图避免社会非难。","kw":["每个人分担的责任越少","他人的行为影响个体对情境的定义"],"kp":"sx-11-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-11","s":"社心","c":11,"t":"填空","card":25,"kd":"考点三 帮助行为的影响因素","stem":"帮助行为的影响因素：助人者特点（六个）","ans":"人格（社会赞许性需求高者更可能助人）、心情（心情好时更乐于帮助）、内疚感（内疚增加帮助，忏悔降低罪恶感反而减少帮助）、个人困扰与同情性关怀、宗教信仰、性别（男性在危险情境中更常伸出援手，女性在安全情境中更乐意帮忙）。","kw":["人格（社会赞许性需求高者更可能助人","心情（心情好时更乐于帮助"],"kp":"sx-11-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-12","s":"社心","c":11,"t":"填空","card":26,"kd":"考点三 帮助行为的影响因素","stem":"帮助行为的影响因素：求助者特点（三个）","ans":"（1）是否受到他人喜爱：长相漂亮的人更可能获得帮助；（2）是否值得帮助：生病晕倒的人比醉汉更容易得到帮助；（3）性别：安全情境中女性更愿意帮忙，危险情境中男性更多伸出援手。","kw":["是否受到他人喜爱","长相漂亮的人更可能获得帮助"],"kp":"sx-11-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-13","s":"社心","c":11,"t":"填空","card":27,"kd":"次要卡","stem":"增加帮助行为：减少模糊性、提高责任感","ans":"可以采取步骤减少紧急事件的模糊性、产生个人化诉求，从而增加旁观者的责任感。","kw":["可以采取步骤减少紧急事件的模糊性"],"kp":"sx-11-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-14","s":"社心","c":11,"t":"填空","card":28,"kd":"次要卡","stem":"内疚和对自我形象的关注如何增加帮助行为？","ans":"感到内疚的人会为了减轻内疚感并维护自我价值感而增加帮助行为；人们重视自己在公众面前的形象，贴上乐于助人的标签能强化助人的自我形象。","kw":["感到内疚的人会为了减轻内疚感并维护自我价值感而增加帮助行为"],"kp":"sx-11-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-15","s":"社心","c":11,"t":"填空","card":29,"kd":"次要卡","stem":"道德排除的定义","ans":"道德排除是指将某些人或动物排除于自己的道德关怀之外。利他主义社会化的第一步是扩展关心他人福利的界限（教化道德包容）。","kw":["道德排除是指将某些人或动物排除于自己的道德关怀之外"],"kp":"sx-11-15","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-16","s":"社心","c":11,"t":"填空","card":30,"kd":"次要卡","stem":"过度辩护效应","ans":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于利他主义动机，应给予恰到好处的反馈。","kw":["过度辩护效应指过度的反馈反而削弱内在动机"],"kp":"sx-11-16","bt":"b","bp":"ans","bq":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于______动机，应给予恰到好处的反馈。","bl":["利他主义"],"bpos":[38],"bsrc":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于利他主义动机，应给予恰到好处的反馈。","nq":1},{"id":"sx-11-17","s":"社心","c":11,"t":"填空","card":31,"kd":"次要卡","stem":"习得的利他主义","ans":"人们一旦了解旁观者在场会抑制帮助，就能更好应对这种社会压力，在群体情境下帮助的可能性增加。","kw":["人们一旦了解旁观者在场会抑制帮助"],"kp":"sx-11-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L1","s":"社心","c":11,"t":"简答","card":15,"kd":"考点一 亲社会行为的含义","stem":"亲社会行为的定义","ans":"人类的亲社会行为是指任何自发性地帮助他人、或者有意图地帮助他人的行为。","kw":["人类的亲社会行为"],"kp":"sx-11-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-L2","s":"社心","c":11,"t":"简答","card":16,"kd":"考点一 亲社会行为的含义","stem":"助人行为的定义","ans":"助人行为是指一切有利于他人的行为，包括期待回报的行为。","kw":["助人行为"],"kp":"sx-11-2","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-L3","s":"社心","c":11,"t":"简答","card":17,"kd":"考点一 亲社会行为的含义","stem":"利他行为的定义","ans":"利他行为是指在毫无回报的期待下，个体表现出自愿帮助他人的行为。助人行为涵盖范围更广，利他行为是更高层次的不求回报的形式。","kw":["利他行为","助人行为涵盖范围更广"],"kp":"sx-11-3","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-L4","s":"社心","c":11,"t":"简答","card":18,"kd":"考点二 帮助行为的理论","stem":"帮助行为的五种理论分别是哪五个？","ans":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与利他主义、学习理论。","kw":["社会交换理论"],"kp":"sx-11-4","alt":1,"bt":"b","bp":"ans","bq":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与______、学习理论。","bl":["利他主义"],"bpos":[29],"bsrc":"社会交换理论、社会规范理论、演化心理学理论、移情（共情）与利他主义、学习理论。","nq":1},{"id":"sx-11-L5","s":"社心","c":11,"t":"简答","card":19,"kd":"考点二 帮助行为的理论","stem":"社会交换理论如何解释帮助行为？","ans":"该理论认为人们的许多行为源于对利益和成本的衡量，希望获得最大化收益和最小化付出。助人行为的收益包括得到赞扬、奖励和对未来回报的预期；成本包括时间、金钱和可能受到的责难。内部回报方面，帮助行为提升自我价值感。","kw":["助人行为的收益包括得到赞扬","成本包括时间","内部回报方面"],"kp":"sx-11-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L6","s":"社心","c":11,"t":"简答","card":20,"kd":"考点二 帮助行为的理论","stem":"社会规范理论：驱动帮助行为的两种规范","ans":"（1）互惠规范：对那些曾帮助过我们的人应当施以帮助而不是伤害。（2）社会责任规范：应该帮助那些需要帮助的人而不考虑利益交换。归因影响帮助——把需要归因为不可控的困境就会帮助，归因为个人决定则不帮。","kw":["（1）互惠规范"],"kp":"sx-11-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L7","s":"社心","c":11,"t":"简答","card":21,"kd":"考点二 帮助行为的理论","stem":"演化心理学解释帮助行为的三个机制","ans":"（1）亲缘选择：偏袒与自己拥有共同基因的人；（2）互惠：对回报的期待增加帮助行为，在小而封闭的群体中效果最好；（3）群体选择：相互支持的利他群体在竞争中存活更久。","kw":["（1）亲缘选择","（2）互惠","（3）群体选择"],"kp":"sx-11-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L9","s":"社心","c":11,"t":"简答","card":23,"kd":"考点三 帮助行为的影响因素","stem":"旁观者效应的定义","ans":"其他人越多，帮助可能性越小、延迟时间越长，这种现象称为旁观者效应。","kw":["其他人越多"],"kp":"sx-11-9","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-L10","s":"社心","c":11,"t":"简答","card":24,"kd":"考点三 帮助行为的影响因素","stem":"引起旁观者效应的三个原因","ans":"（1）责任分散：周围人越多，每个人分担的责任越少；（2）情境的不明确性：他人的行为影响个体对情境的定义；（3）评价恐惧：人们试图避免社会非难。","kw":["（1）责任分散","（2）情境的不明确性","（3）评价恐惧"],"kp":"sx-11-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L11","s":"社心","c":11,"t":"简答","card":25,"kd":"考点三 帮助行为的影响因素","stem":"帮助行为的影响因素：助人者特点（六个）","ans":"人格（社会赞许性需求高者更可能助人）、心情（心情好时更乐于帮助）、内疚感（内疚增加帮助，忏悔降低罪恶感反而减少帮助）、个人困扰与同情性关怀、宗教信仰、性别（男性在危险情境中更常伸出援手，女性在安全情境中更乐意帮忙）。","kw":["人格（社会赞许性需求高者更可能助人","心情（心情好时更乐于帮助"],"kp":"sx-11-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L12","s":"社心","c":11,"t":"简答","card":26,"kd":"考点三 帮助行为的影响因素","stem":"帮助行为的影响因素：求助者特点（三个）","ans":"（1）是否受到他人喜爱：长相漂亮的人更可能获得帮助；（2）是否值得帮助：生病晕倒的人比醉汉更容易得到帮助；（3）性别：安全情境中女性更愿意帮忙，危险情境中男性更多伸出援手。","kw":["（1）是否受到他人喜爱","（2）是否值得帮助","（3）性别"],"kp":"sx-11-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-11-L15","s":"社心","c":11,"t":"简答","card":29,"kd":"次要卡","stem":"道德排除的定义","ans":"道德排除是指将某些人或动物排除于自己的道德关怀之外。利他主义社会化的第一步是扩展关心他人福利的界限（教化道德包容）。","kw":["道德排除","利他主义社会化的第一步"],"kp":"sx-11-15","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-11-L16","s":"社心","c":11,"t":"简答","card":30,"kd":"次要卡","stem":"过度辩护效应","ans":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于利他主义动机，应给予恰到好处的反馈。","kw":["在培养助人行为时"],"kp":"sx-11-16","alt":1,"bt":"b","bp":"ans","bq":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于______动机，应给予恰到好处的反馈。","bl":["利他主义"],"bpos":[38],"bsrc":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于利他主义动机，应给予恰到好处的反馈。","nq":1},{"id":"sx-3-1","s":"社心","c":3,"t":"单选","card":91,"kd":"考点一 社会知觉与判断","stem":"社会知觉的特性不包括（　）。","ans":"社会知觉是指人们加工、理解、识记和运用各种社会信息做出判断和决策的过程。社会知觉具有主观性、整体性、选择性和恒常性。","kw":["社会知觉","社会知觉具有主观性"],"opts":{"A":"主观性","B":"整体性","C":"选择性","D":"可逆性"}
