根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）…」","bad":"B 象征性法则看「与典型事物的相似程度」；C 基础比例看「总体中所占比例」；D 锚定与调整看「以数值为起点」。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-4","bt":"x"},{"id":"sx-3-5","s":"社心","c":3,"t":"单选","card":93,"kd":"考点一 社会知觉与判断","stem":"「根据事物与典型事物的相似程度来归类」是（　）。","ans":"便利法则（根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）、基础比例信息（按照总体中不同类别的成员所占比例做判断）、锚定与调整法则（以一个数值为起点调整，但调整往往不充分）。","kw":["便利法则"],"opts":{"A":"便利法则","B":"象征性（代表性）法则","C":"锚定与调整","D":"基础比例信息"},"key":"B","jx":{"po":"设问「「根据事物与典型事物的相似程度来归类」是（　）。」落在「考点一 社会知觉与判断」卡 93。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：象征性（代表性）法则。手册卡 93 原文：「便利法则（根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）…」","bad":"A 便利法则是「提取容易」；C 锚定是「起点数值」；D 基础比例是「总体比例」。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-5","bt":"x"},{"id":"sx-3-6","s":"社心","c":3,"t":"单选","card":93,"kd":"考点一 社会知觉与判断","stem":"「以一个数值为起点调整，但调整往往不充分」是（　）。","ans":"便利法则（根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）、基础比例信息（按照总体中不同类别的成员所占比例做判断）、锚定与调整法则（以一个数值为起点调整，但调整往往不充分）。","kw":["便利法则"],"opts":{"A":"便利法则","B":"象征性法则","C":"基础比例信息","D":"锚定与调整法则"},"key":"D","jx":{"po":"设问「「以一个数值为起点调整，但调整往往不充分」是（　）。」落在「考点一 社会知觉与判断」卡 93。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 D：锚定与调整法则。手册卡 93 原文：「便利法则（根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）…」","bad":"A、B 都是「容易、相似」类判断，C 是比例信息，三者都不含「起点＋调整」这层。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-6","bt":"x"},{"id":"sx-3-7","s":"社心","c":3,"t":"单选","card":94,"kd":"考点一 社会知觉与判断","stem":"首因效应适用于（　），近因效应适用于（　）。","ans":"首因效应：最初信息影响更大，适用于不熟悉的人。近因效应：新近信息影响更大，适用于熟人。","kw":["首因效应","近因效应"],"opts":{"A":"熟人不熟悉","B":"不熟悉／熟人","C":"两者均适用于熟人","D":"两者均适用于陌生人"},"key":"B","jx":{"po":"设问「首因效应适用于（　），近因效应适用于（　）。」落在「考点一 社会知觉与判断」卡 94。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：不熟悉／熟人。手册卡 94 原文：「首因效应：最初信息影响更大，适用于不熟悉的人。近因效应：新近信息影响更大，适用于熟人。」","bad":"A 把顺序写反；C、D 把两者说成同一适用对象，都错。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-7","bt":"x"},{"id":"sx-3-8","s":"社心","c":3,"t":"单选","card":95,"kd":"考点一 社会知觉与判断","stem":"「某一高分特质使其他评价普遍偏高」是（　）。","ans":"晕轮效应又称光环效应：某一高分特质使其他评价普遍偏高。正性偏差又称慈悲效应：对他人的正性评价超过负性评价。第五种是认知启发法——认知中喜欢走捷径。","kw":["晕轮效应又称光环效应","正性偏差又称慈悲效应","第五种"],"opts":{"A":"正性偏差","B":"晕轮效应","C":"首因效应","D":"认知启发法"},"key":"B","jx":{"po":"设问「「某一高分特质使其他评价普遍偏高」是（　）。」落在「考点一 社会知觉与判断」卡 95。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：晕轮效应。手册卡 95 原文：「晕轮效应又称光环效应：某一高分特质使其他评价普遍偏高。正性偏差又称慈悲效应：对他人的正性评价超过负性评价…」","bad":"A 正性偏差是「正性评价超过负性评价」；C 首因是「最初信息」；D 认知启发法是第五种偏差，讲走捷径。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-8","bt":"x"},{"id":"sx-3-9","s":"社心","c":3,"t":"单选","card":95,"kd":"考点一 社会知觉与判断","stem":"「对他人的正性评价超过负性评价」是（　）；又称（　）。","ans":"晕轮效应又称光环效应：某一高分特质使其他评价普遍偏高。正性偏差又称慈悲效应：对他人的正性评价超过负性评价。第五种是认知启发法——认知中喜欢走捷径。","kw":["晕轮效应又称光环效应","正性偏差又称慈悲效应","第五种"],"opts":{"A":"晕轮效应／光环效应","B":"正性偏差／慈悲效应","C":"首因效应／近因效应","D":"刻板印象／偏见"},"key":"B","jx":{"po":"设问「「对他人的正性评价超过负性评价」是（　）；又称（　）。」落在「考点一 社会知觉与判断」卡 95。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：正性偏差／慈悲效应。手册卡 95 原文：「晕轮效应又称光环效应：某一高分特质使其他评价普遍偏高。正性偏差又称慈悲效应：对他人的正性评价超过负性评价…」","bad":"A 晕轮是「一好百好」的扩散；C 首因、近因是信息出现顺序；D 刻板印象、偏见在第八章，不在本章。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-9","bt":"x"},{"id":"sx-3-10","s":"社心","c":3,"t":"单选","card":96,"kd":"考点一 社会知觉与判断","stem":"内隐社会认知的特性不包括（　）。","ans":"内隐社会认知的特性指过去经验潜在地影响当前行为和判断，个体意识不到。具有社会性、积淀性、无意识性和启动性。研究方法主要有反应时法、词干补笔法和投射法。","kw":["具有社会性","研究方法主要有反应时法"],"opts":{"A":"社会性","B":"积淀性","C":"无意识性","D":"逻辑性"},"key":"D","jx":{"po":"设问「内隐社会认知的特性不包括（　）。」落在「考点一 社会知觉与判断」卡 96。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 D：逻辑性。手册卡 96 原文：「指过去经验潜在地影响当前行为和判断，个体意识不到。具有社会性、积淀性、无意识性和启动性。研究方法主要有反应时法…」","bad":"A、B、C 都在四特性里；D「逻辑性」是外行词——内隐认知恰恰是意识不到、不走逻辑推理的。 同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-10","bt":"x"},{"id":"sx-3-11","s":"社心","c":3,"t":"填空","card":96,"kd":"考点一 社会知觉与判断","stem":"内隐社会认知","ans":"内隐社会认知的研究方法主要有：反应时法、词干补笔法、投射法。","kw":["反应时","词干补笔","投射"],"jx":{"po":"设问「内隐社会认知」落在「考点一 社会知觉与判断」卡 96。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-12","s":"社心","c":3,"t":"填空","card":97,"kd":"考点二 印象与印象形成","stem":"整体印象形成的三种模型","ans":"整体印象形成的三种模型：平均模型、累加模型、加权平均模型（最常用的是加权平均模型）。","kw":["平均","累加","加权平均","加权平均"],"jx":{"po":"设问「整体印象形成的三种模型」落在「考点二 印象与印象形成」卡 97。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 98「第一印象」，两卡常被混问，注意别串。"},"kp":"sx-3-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-13","s":"社心","c":3,"t":"填空","card":98,"kd":"考点二 印象与印象形成","stem":"第一印象","ans":"第一印象的核心是评价及喜欢或讨厌的程度。","kw":["评价"],"jx":{"po":"设问「第一印象」落在「考点二 印象与印象形成」卡 98。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 97「整体印象形成的三种模型」，两卡常被混问，注意别串。"},"kp":"sx-3-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-14","s":"社心","c":3,"t":"单选","card":97,"kd":"考点二 印象与印象形成","stem":"印象形成的三种模型中，最常用的是（　）。","ans":"平均模型（以简单平均的方式处理信息）、累加模型（以累加而非平均的方式整合信息）、加权平均模型（对较重要的特质给予更大的权重，这是最常用的模型）。","kw":["平均模型"],"opts":{"A":"平均模型","B":"累加模型","C":"加权平均模型","D":"加权累加模型"},"key":"C","jx":{"po":"设问「印象形成的三种模型中，最常用的是（　）。」落在「考点二 印象与印象形成」卡 97。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 C：加权平均模型。手册卡 97 原文：「平均模型（以简单平均的方式处理信息）、累加模型（以累加而非平均的方式整合信息）…」","bad":"A 平均、B 累加只是其中两种；D「加权累加」是编出来的名字，原文没有。 同考点还有卡 98「第一印象」，两卡常被混问，注意别串。"},"kp":"sx-3-14","bt":"x"},{"id":"sx-3-15","s":"社心","c":3,"t":"填空","card":100,"kd":"考点三 归因","stem":"归因的定义","ans":"归因的定义（原话）：归因是指人们推论他人的行为或态度之原因的过程。人们只在两种情况下归因：发生出乎意料的事，或发生令人不愉快的事。","kw":["推论","出乎意料","令人不愉快"],"jx":{"po":"设问「归因的定义」落在「考点三 归因」卡 100。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 101「基本归因错误（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-15","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-3-16","s":"社心","c":3,"t":"单选","card":101,"kd":"考点三 归因","stem":"基本归因错误指解释他人行为时（　）。","ans":"基本归因错误是指，当我们解释他人的行为时，时常会低估环境造成的影响，而高估个人的特质和态度所造成的影响。两个原因：一是视角和情境意识不同（行动者归因于环境，观察者归因于人格）；二是文化差异（个人主义文化倾向于内部归因，集体主义文化更强调环境的作用）。","kw":["基本归因错误","两个原因：一","二是文化差异"],"opts":{"A":"高估环境、低估个人特质","B":"低估环境、高估个人特质","C":"只看环境","D":"只看个人"},"key":"B","jx":{"po":"设问「基本归因错误指解释他人行为时（　）。」落在「考点三 归因」卡 101。答案按 2 层展开：基本归因错误是指；二是文化差异。漏一层就丢一档分。","ok":"正确项 B：低估环境、高估个人特质。手册卡 101 原文：「基本归因错误是指，当我们解释他人的行为时，时常会低估环境造成的影响，而高估个人的特质和态度所造成的影响…」","bad":"A 把方向说反（那是自我服务归因的倾向）；C、D 走极端，原文是「低估、高估」的对比而不是「只看」。 同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-16","bt":"x"},{"id":"sx-3-17","s":"社心","c":3,"t":"填空","card":101,"kd":"考点三 归因","stem":"基本归因错误","ans":"基本归因错误是指，当我们解释他人的行为时，时常会低估环境造成的影响，而高估个人的特质和态度所造成的影响。两个原因：一是视角和情境意识不同（行动者归因于环境，观察者归因于人格）；二是文化差异（个人主义文化倾向于内部归因，集体主义文化更强调环境的作用）。","kw":["基本归因错误","两个原因：一","二是文化差异"],"jx":{"po":"设问「基本归因错误」落在「考点三 归因」卡 101。答案按 2 层展开：基本归因错误是指；二是文化差异。漏一层就丢一档分。","ok":"踩分术语 3 个：「基本归因错误」、「两个原因：一」、「二是文化差异」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-18","s":"社心","c":3,"t":"填空","card":102,"kd":"考点三 归因","stem":"海德的归因理论","ans":"海德的归因理论：两种需求＝对周围环境的一贯性理解、控制环境的能力；原因分内因与外因；两个原则＝共变原则与排除原则。","kw":["一贯性","控制","内","外","共变","排除"],"jx":{"po":"设问「海德的归因理论」落在「考点三 归因」卡 102。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-19","s":"社心","c":3,"t":"填空","card":103,"kd":"考点三 归因","stem":"韦纳的归因理论：三维度六因素","ans":"三个维度：内外源（影响情绪体验）、稳定性（影响对未来成败的预期）、可控性（影响今后的行为）。六个因素：能力、努力、运气、工作难度、身心状态和其他外部因素。韦纳强调要引导学生将学业成败归因于内部的、不稳定的和可控的原因。","kw":["内外","情绪","稳定","预期","可控","行为","努力","工作难度"],"jx":{"po":"设问「韦纳的归因理论：三维度六因素」落在「考点三 归因」卡 103。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-20","s":"社心","c":3,"t":"填空","card":103,"kd":"考点三 归因","stem":"韦纳的归因训练建议：学业成败该归因于哪三类原因？","ans":"韦纳强调要引导学生把学业成败归因于内部的、不稳定的、可控的原因。","kw":["内部的","不稳定的","可控的"],"jx":{"po":"设问「韦纳的归因训练建议：学业成败该归因于哪三类原因？」落在「考点三 归因」卡 103。本题为问答型：不设空，按关键词自评。","ok":"","bad":""},"kp":"sx-3-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-21","s":"社心","c":3,"t":"单选","card":105,"kd":"考点三 归因","stem":"凯利三维归因的三个方面是（　）。","ans":"任何事件的原因可归于三个方面：行动者、刺激物和环境背景。归因需要三种信息：一致性信息、一贯性信息和独特性信息。三种组合：一致性、差异性、一贯性均高时归因于刺激物；一致性和差异性低、一贯性高时归因于行动者；一致性低、差异性高、一贯性低时归因于环境背景。凯利还提出了折扣原则——其他可能原因会削弱特定原因的作用。","kw":["任何事件的原因可归于三个方面","归因需要三种信息","三种组合","一致性和差异性低","一致性低"],"opts":{"A":"行动者／刺激物／环境背景","B":"内因／外因／共变","C":"一致性／一贯性／独特性","D":"能力／努力／运气"},"key":"A","jx":{"po":"设问「凯利三维归因的三个方面是（　）。」落在「考点三 归因」卡 105。答案按 3 层展开：任何事件的原因可归于三个方面；一致性和差异性低；一致性低。漏一层就丢一档分。","ok":"正确项 A：行动者／刺激物／环境背景。手册卡 105 原文：「任何事件的原因可归于三个方面：行动者、刺激物和环境背景。归因需要三种信息：一致性信息、一贯性信息和独特性信息…」","bad":"B 是海德的内外因＋共变原则；C 是凯利要的三种「信息」（一致性、一贯性、独特性），不是三个「方面」；D 是韦纳六因素里的一组。题干问「方面」，只能选 A。 同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-21","bt":"x"},{"id":"sx-3-22","s":"社心","c":3,"t":"填空","card":105,"kd":"考点三 归因","stem":"凯利的三维归因理论","ans":"任何事件的原因可归于三个方面：行动者、刺激物和环境背景。归因需要三种信息：一致性信息、一贯性信息和独特性信息。三种组合：一致性、差异性、一贯性均高时归因于刺激物；一致性和差异性低、一贯性高时归因于行动者；一致性低、差异性高、一贯性低时归因于环境背景。凯利还提出了折扣原则——其他可能原因会削弱特定原因的作用。","kw":["一致性","一贯性","独特性","刺激物","行动者","环境背景"],"jx":{"po":"设问「凯利的三维归因理论」落在「考点三 归因」卡 105。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-23","s":"社心","c":3,"t":"单选","card":106,"kd":"考点三 归因","stem":"琼斯和戴维斯的对应推论理论：归于内在特质需两个条件（　）。","ans":"该理论解释在什么条件下我们把事件归于他人的内在特质，需要两个条件：行为的非期望性与非顺从性，以及行为的自由选择性。","kw":["非期望性","非顺从性","自由选择性"],"opts":{"A":"行为的非期望性与非顺从性＋自由选择性","B":"一致性＋独特性","C":"内因＋外因","D":"稳定性＋可控性"},"key":"A","jx":{"po":"设问「琼斯和戴维斯的对应推论理论：归于内在特质需两个条件（　）。」落在「考点三 归因」卡 106。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 A：行为的非期望性与非顺从性＋自由选择性。手册卡 106 原文：「该理论解释在什么条件下我们把事件归于他人的内在特质，需要两个条件：行为的非期望性与非顺从性，以及行为的自由选择性。」","bad":"B 一致性、独特性是凯利的信息维度；C 内因、外因是海德；D 稳定性、可控性是韦纳的三维度。 同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-23","bt":"x"},{"id":"sx-3-24","s":"社心","c":3,"t":"填空","card":107,"kd":"考点四 社会判断","stem":"过度自信与验证性偏差","ans":"过度自信指尽管过去出过错，但对未来预期仍然乐观；验证性偏差指我们更愿意证实自己的观点，容易陷入思维固化。矫正方法：及时反馈，以及设想判断可能出错的原因。","kw":["乐观","证实","及时反馈"],"jx":{"po":"设问「过度自信与验证性偏差」落在「考点四 社会判断」卡 107。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 108「启发式判断：代表性启发式与易得性启发式」，两卡常被混问，注意别串。"},"kp":"sx-3-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-25","s":"社心","c":3,"t":"单选","card":108,"kd":"考点四 社会判断","stem":"「根据信息在记忆中提取的容易程度做判断」是（　）。","ans":"启发式判断指用最少的精力快速做出决策，是一种心理捷径。代表性启发式：将事物与典型类别比较。易得性启发式：根据信息在记忆中提取的容易程度做判断。","kw":["代表性启发式","易得性启发式"],"opts":{"A":"代表性启发式","B":"易得性启发式","C":"锚定与调整","D":"基础比例"},"key":"B","jx":{"po":"设问「「根据信息在记忆中提取的容易程度做判断」是（　）。」落在「考点四 社会判断」卡 108。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：易得性启发式。手册卡 108 原文：「启发式判断指用最少的精力快速做出决策，是一种心理捷径。代表性启发式：将事物与典型类别比较…」","bad":"A 代表性看相似度；C 锚定看起点；D 基础比例看总体比例。 同考点还有卡 107「过度自信与验证性偏差」，两卡常被混问，注意别串。"},"kp":"sx-3-25","bt":"x"},{"id":"sx-3-26","s":"社心","c":3,"t":"填空","card":109,"kd":"考点四 社会判断","stem":"概率性忽视","ans":"概率性忽视＝面对不确定问题时，忽视基础概率和普遍真理，过分在意当前发生的情况，为小概率事件忧心。","kw":["基础概率","当前发生的情况"],"jx":{"po":"设问「概率性忽视」落在「考点四 社会判断」卡 109。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 107「过度自信与验证性偏差」，两卡常被混问，注意别串。"},"kp":"sx-3-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-27","s":"社心","c":3,"t":"填空","card":110,"kd":"考点四 社会判断","stem":"反事实思维与错觉思维","ans":"反事实思维指对可能发生的事进行心理模拟。错觉思维包括：错觉相关（把随机事件联系起来）和控制错觉（高估自己对事物的控制力）。","kw":["相关","控制"],"jx":{"po":"设问「反事实思维与错觉思维」落在「考点四 社会判断」卡 110。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 107「过度自信与验证性偏差」，两卡常被混问，注意别串。"},"kp":"sx-3-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-28","s":"社心","c":3,"t":"填空","card":111,"kd":"考点四 社会判断","stem":"自我实现预言与行为确证","ans":"自我实现预言：我们的观念引导我们以证实自己的方式行动。行为确证：人们一旦形成错误信念，可能引发他人做出支持这些信念的行为。","kw":["观念","证实","他人"],"jx":{"po":"设问「自我实现预言与行为确证」落在「考点四 社会判断」卡 111。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 107「过度自信与验证性偏差」，两卡常被混问，注意别串。"},"kp":"sx-3-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-29","s":"社心","c":3,"t":"简答","card":91,"kd":"考点一 社会知觉与判断","stem":"写出社会知觉的定义，并列出它的四个特性。","ans":"社会知觉是指人们加工、理解、识记和运用各种社会信息做出判断和决策的过程。社会知觉具有主观性、整体性、选择性和恒常性。","kw":["社会知觉","社会知觉具有主观性"],"jx":{"po":"设问「写出社会知觉的定义，并列出它的四个特性。」落在「考点一 社会知觉与判断」卡 91。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「社会知觉」、「社会知觉具有主观性」。先写术语，再展开。","bad":"同考点还有卡 92「社会认知的两个基本假设」，两卡常被混问，注意别串。"},"kp":"sx-3-29","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-3-30","s":"社心","c":3,"t":"简答","card":93,"kd":"考点一 社会知觉与判断","stem":"列举社会认知的四个法则并各用一句话说明。","ans":"便利法则（根据信息进入脑海的容易程度做判断）、象征性法则又称代表性法则（根据事物与典型事物的相似程度来归类）、基础比例信息（按照总体中不同类别的成员所占比例做判断）、锚定与调整法则（以一个数值为起点调整，但调整往往不充分）。","kw":["便利法则"],"jx":{"po":"设问「列举社会认知的四个法则并各用一句话说明。」落在「考点一 社会知觉与判断」卡 93。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「便利法则」。先写术语，再展开。","bad":"同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-30","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-31","s":"社心","c":3,"t":"简答","card":94,"kd":"考点一 社会知觉与判断","stem":"列举五种社会知觉偏差（首因/近因/晕轮/正性偏差/认知启发法）并各说明适用情形。","ans":"首因效应：最初信息影响更大，适用于不熟悉的人。近因效应：新近信息影响更大，适用于熟人。","kw":["首因效应","近因效应"],"jx":{"po":"设问「列举五种社会知觉偏差（首因/近因/晕轮/正性偏差/认知启发法）并各说明适用情形。」落在「考点一 社会知觉与判断」卡 94。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「首因效应」、「近因效应」。先写术语，再展开。","bad":"同考点还有卡 91「社会知觉的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-32","s":"社心","c":3,"t":"简答","card":97,"kd":"考点二 印象与印象形成","stem":"整体印象形成的三种模型分别是什么？哪一个最常用？为什么？","ans":"平均模型（以简单平均的方式处理信息）、累加模型（以累加而非平均的方式整合信息）、加权平均模型（对较重要的特质给予更大的权重，这是最常用的模型）。","kw":["平均模型"],"jx":{"po":"设问「整体印象形成的三种模型分别是什么？哪一个最常用？为什么？」落在「考点二 印象与印象形成」卡 97。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「平均模型」。先写术语，再展开。","bad":"同考点还有卡 98「第一印象」，两卡常被混问，注意别串。"},"kp":"sx-3-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-33","s":"社心","c":3,"t":"简答","card":100,"kd":"考点三 归因","stem":"写出归因的定义与\"人们只在两种情况下归因\"。","ans":"归因是指人们推论他人的行为或态度之原因的过程。人们只在两种情况下归因：发生出乎意料的事，或发生令人不愉快的事。","kw":["归因","人们只在两种情况下归因"],"jx":{"po":"设问「写出归因的定义与\"人们只在两种情况下归因\"。」落在「考点三 归因」卡 100。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「归因」、「人们只在两种情况下归因」。先写术语，再展开。","bad":"同考点还有卡 101「基本归因错误（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-15","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-3-34","s":"社心","c":3,"t":"简答","card":101,"kd":"考点三 归因","stem":"写出基本归因错误的定义及其两个原因。","ans":"基本归因错误是指，当我们解释他人的行为时，时常会低估环境造成的影响，而高估个人的特质和态度所造成的影响。两个原因：一是视角和情境意识不同（行动者归因于环境，观察者归因于人格）；二是文化差异（个人主义文化倾向于内部归因，集体主义文化更强调环境的作用）。","kw":["基本归因错误","两个原因：一","二是文化差异"],"jx":{"po":"设问「写出基本归因错误的定义及其两个原因。」落在「考点三 归因」卡 101。答案按 2 层展开：基本归因错误是指；二是文化差异。漏一层就丢一档分。","ok":"踩分术语 3 个：「基本归因错误」、「两个原因：一」、「二是文化差异」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-35","s":"社心","c":3,"t":"简答","card":103,"kd":"考点三 归因","stem":"韦纳的归因理论：三个维度（各影响什么）＋六个因素；韦纳对教育的建议是什么？","ans":"三个维度：内外源（影响情绪体验）、稳定性（影响对未来成败的预期）、可控性（影响今后的行为）。六个因素：能力、努力、运气、工作难度、身心状态和其他外部因素。韦纳强调要引导学生将学业成败归因于内部的、不稳定的和可控的原因。","kw":["三个维度","六个因素"],"jx":{"po":"设问「韦纳的归因理论：三个维度（各影响什么）＋六个因素；韦纳对教育的建议是什么？」落在「考点三 归因」卡 103。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「三个维度」、「六个因素」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-36","s":"社心","c":3,"t":"简答","card":105,"kd":"考点三 归因","stem":"凯利的三维归因理论：三个方面＋三种信息＋三种组合对应的归因结果；什么是折扣原则？","ans":"任何事件的原因可归于三个方面：行动者、刺激物和环境背景。归因需要三种信息：一致性信息、一贯性信息和独特性信息。三种组合：一致性、差异性、一贯性均高时归因于刺激物；一致性和差异性低、一贯性高时归因于行动者；一致性低、差异性高、一贯性低时归因于环境背景。凯利还提出了折扣原则——其他可能原因会削弱特定原因的作用。","kw":["任何事件的原因可归于三个方面","归因需要三种信息","三种组合","一致性和差异性低","一致性低"],"jx":{"po":"设问「凯利的三维归因理论：三个方面＋三种信息＋三种组合对应的归因结果；什么是折扣原则？」落在「考点三 归因」卡 105。答案按 3 层展开：任何事件的原因可归于三个方面；一致性和差异性低；一致性低。漏一层就丢一档分。","ok":"踩分术语 5 个：「任何事件的原因可归于三个方面」、「归因需要三种信息」、「三种组合」、「一致性和差异性低」、「一致性低」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-37","s":"社心","c":3,"t":"简答","card":102,"kd":"考点三 归因","stem":"海德的归因理论要点（两种需求／内因外因／两个原则）。","ans":"海德认为人们有两种需求：对周围环境的一贯性理解，以及控制环境的能力。事件原因分为内因（情绪、态度、人格、能力）和外因（外界压力、天气、情境）。归因时使用两个原则：共变原则（原因与结果共同变化）和排除原则（内因或外因之一足以解释事件时排除另一原因）。","kw":["海德认为人们有两种需求","事件原因分为内因","归因时使用两个原则"],"jx":{"po":"设问「海德的归因理论要点（两种需求／内因外因／两个原则）。」落在「考点三 归因」卡 102。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「海德认为人们有两种需求」、「事件原因分为内因」、「归因时使用两个原则」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-18","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-38","s":"社心","c":3,"t":"简答","card":106,"kd":"考点三 归因","stem":"琼斯和戴维斯的对应推论理论：归于内在特质需要哪两个条件？","ans":"该理论解释在什么条件下我们把事件归于他人的内在特质，需要两个条件：行为的非期望性与非顺从性，以及行为的自由选择性。","kw":["非期望性","非顺从性","自由选择性"],"jx":{"po":"设问「琼斯和戴维斯的对应推论理论：归于内在特质需要哪两个条件？」落在「考点三 归因」卡 106。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"按整段原文作答；参考答案里的标红即踩分处。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-38","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-3-39","s":"社心","c":3,"t":"论述","card":0,"kd":"","stem":"试述归因理论的发展脉络（海德 → 韦纳 → 凯利 → 琼斯与戴维斯），并比较各理论关注点的差异；最后结合考研备考说明：如果一个人总把失败归因于\"我不行\"，会产生什么后果、应如何调整（要落到韦纳三维度）。","ans":"①海德：归因理论开创者——两种需求（一贯性理解＋控制环境）；内因/外因；共变原则与排除原则。②韦纳：三维度六因素——内外源（影响情绪体验）、稳定性（影响对未来成败的预期）、可控性（影响今后行为）；教育建议：归因于内部的、不稳定的、可控的原因（努力）。③凯利：三维归因——行动者刺激物环境背景；三种信息（一致性一贯性独特性）与三种组合；折扣原则。④琼斯与戴维斯：对应推论理论——解释\"何时把他人的行为归于内在特质\"：需非期望性与非顺从性＋自由选择性。⑤比较：海德＝奠基（内外因＋原则）；韦纳＝结果维度化＋动机/情绪后果（并直接指向教育）；凯利＝信息加工/统计式推断（何时归因于什么）；琼斯-戴维斯＝特质归因的条件（何时能推断人格）。→ 发展脉络：从\"分内外因\"到\"分维度+预测后果\"再到\"信息组合条件\"。⑥备考启示：总归因于\"我不行\"＝内部的、稳定的、不可控的归因 → 后果：预期未来仍失败（稳定）＋无力改变（不可控）＋羞耻/低落（内部）→ 易形成习得性无助、动机下降。调整：改为努力/方法（内部·不稳定·可控），用及时反馈校准（对应过度自信的矫正方法）。","kw":["①海德","共变原则与排除原则","②韦纳","教育建议","③凯利","三种信息","④琼斯与戴维斯","⑤比较","凯利＝信息加工/统计式推断","琼斯-戴维斯＝特质归因的条件"],"jx":{"po":"设问「试述归因理论的发展脉络（海德 → 韦纳 → 凯利 → 琼斯与戴维斯），并比较各理」落在「本章综合」（综合题，跨卡）。答案按 9 层展开：①海德；内因/外因；共变原则与排除原则；教育建议。漏一层就丢一档分。","ok":"踩分术语 10 个：「①海德」、「共变原则与排除原则」、「②韦纳」、「教育建议」、「③凯利」、「三种信息」。先写术语，再展开。","bad":"本题没有同音字坑、也无可混的邻卡：按参考答案原文背，术语写全即可。"},"kp":"sx-3-39","bt":"x"},{"id":"sx-3-40","s":"社心","c":3,"t":"案例","card":105,"kd":"考点三 归因","stem":"小周的同桌上课从不举手。小周判断：\"他性格就是内向、不爱表现。\"后来老师点名提问，同桌答得很好。 ①小周的判断体现了什么现象？用该现象的术语作答并写出其定义要点。 ②请用凯利的三维归因理论分析：要判断同桌\"不举手\"的原因，需要获取哪三种信息？若\"一致性低、差异性高、一贯性低\"，应归因于什么？ ③若要减少小周这类判断错误，请给出两条现实可行的做法。","ans":"任何事件的原因可归于三个方面：行动者、刺激物和环境背景。归因需要三种信息：一致性信息、一贯性信息和独特性信息。三种组合：一致性、差异性、一贯性均高时归因于刺激物；一致性和差异性低、一贯性高时归因于行动者；一致性低、差异性高、一贯性低时归因于环境背景。凯利还提出了折扣原则——其他可能原因会削弱特定原因的作用。","kw":["任何事件的原因可归于三个方面","归因需要三种信息","三种组合","一致性和差异性低","一致性低"],"jx":{"po":"设问「小周的同桌上课从不举手。小周判断：\"他性格就是内向、不爱表现。\"后来老师点名提问」落在「考点三 归因」卡 105。答案按 3 层展开：任何事件的原因可归于三个方面；一致性和差异性低；一致性低。漏一层就丢一档分。","ok":"踩分术语 5 个：「任何事件的原因可归于三个方面」、「归因需要三种信息」、「三种组合」、「一致性和差异性低」、「一致性低」。先写术语，再展开。","bad":"同考点还有卡 100「归因的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-3-22","alt":1,"bt":"x"},{"id":"sx-3-41","s":"社心","c":3,"t":"案例","card":109,"kd":"考点四 社会判断","stem":"某考生模拟考后只看\"我肯定考不上\"（忽视基础概率），并反复回想\"那道题要是当时选另一个就对\"。 ①分别指出这两句话涉及的两个概念（提示：概率性忽视／反事实思维）。 ②说明各自的认知机制，并各给一条矫正做法（提示：基础比例信息／及时反馈与设想出错原因）。","ans":"概率性忽视指人们在面对不确定的问题时，往往会忽视基础概率和普遍真理，过分在意当前发生的情况，为了小概率事件忧心，忽视高概率事件。","kw":["指人们在面对不确定的问题时"],"jx":{"po":"设问「某考生模拟考后只看\"我肯定考不上\"（忽视基础概率），并反复回想\"那道题要是当时选」落在「考点四 社会判断」卡 109。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「指人们在面对不确定的问题时」。先写术语，再展开。","bad":"同考点还有卡 107「过度自信与验证性偏差」，两卡常被混问，注意别串。"},"kp":"sx-3-26","alt":1,"bt":"x"},{"id":"sx-4-1","s":"社心","c":4,"t":"填空","card":50,"kd":"考点一 态度的概述及成分","stem":"态度的定义","ans":"态度是个体对某一特定事物、观念或他人稳固的、由认知、情感和行为倾向三个成分组成的心理倾向。分为外显态度（我们意识到的并易于报告的）和内隐态度（自然而然的、不受控制且往往无意识的）。","kw":["态度是个体对某一特定事物","观念或他人稳固的"],"kp":"sx-4-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-4-2","s":"社心","c":4,"t":"填空","card":51,"kd":"考点一 态度的概述及成分","stem":"态度的三个心理成分（考试重点）","ans":"（1）认知成分：人们对外界对象的心理印象，包括有关事实、知识和信念，是态度其余成分的基础；（2）情感成分：对态度对象肯定或否定的评价及由此引发的情绪情感，是态度的核心与关键；（3）行为倾向成分：对态度对象所预备采取的反应，具有准备性质，但不等于外显行为。","kw":["人们对外界对象的心理印象","是态度其余成分的基础"],"kp":"sx-4-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-3","s":"社心","c":4,"t":"填空","card":52,"kd":"考点一 态度的概述及成分","stem":"态度的四个心理功能","ans":"效用功能（也叫适应功能，使我们寻求酬赏和他人的赞许）、知识功能（帮助我们组织有关知识，使世界有意义）、自我保护功能（帮助我们应付情绪冲突和保护自尊）、价值表达功能（帮助人们表达自我概念中的核心价值）。","kw":["使我们寻求酬赏和他人的赞许","知识功能（帮助我们组织有关知识"],"kp":"sx-4-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-4","s":"社心","c":4,"t":"填空","card":53,"kd":"考点二 态度与行为的关系","stem":"态度在什么条件下能预测行为？","ans":"将影响态度和行为的其他因素最小化时、态度与行为存在具体相关时、强有力的态度能更好地预测行为。影响态度预测行为的因素包括态度的特殊性、水平、时间因素、自我意识、态度强度、态度的可接近性。","kw":["将影响态度和行为的其他因素最小化时"],"kp":"sx-4-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-5","s":"社心","c":4,"t":"填空","card":54,"kd":"考点二 态度与行为的关系","stem":"行为影响态度的表现","ans":"角色扮演会塑造态度（津巴多的监狱实验证明了这一点）；言语变成信念（当人们公开表达与自己内心不符的观点时）；登门槛现象（先请人帮一个小忙，再逐步提出更大的请求）；道德行为影响道德思维。","kw":["角色扮演会塑造态度（津巴多的监狱实验证明了这一点"],"kp":"sx-4-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-6","s":"社心","c":4,"t":"填空","card":55,"kd":"考点二 态度与行为的关系","stem":"行为影响态度的三种理论解释","ans":"（1）自我呈现理论：人们调整态度以使其与行为一致，属于印象管理；（2）认知失调理论：当行为与态度相反时感到紧张，通过调整态度来缓解紧张；（3）自我知觉理论：当态度不坚定时通过观察自己的行为来推断态度，其推论包括过度合理化效应。","kw":["人们调整态度以使其与行为一致","当行为与态度相反时感到紧张"],"kp":"sx-4-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-7","s":"社心","c":4,"t":"填空","card":56,"kd":"考点四 态度的改变及其理论","stem":"改变态度的四种方法","ans":"劝说宣传法（借助传播媒介影响人们）、角色扮演法（通过角色约束和影响来改变态度）、团体影响法（通过团体规范和准则影响态度）、活动参与法（引导人们参加与态度改变有关的活动）。","kw":["劝说宣传法（借助传播媒介影响人们","角色扮演法（通过角色约束和影响来改变态度"],"kp":"sx-4-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-8","s":"社心","c":4,"t":"填空","card":57,"kd":"考点四 态度的改变及其理论","stem":"海德的平衡理论（P-O-X模型）","ans":"海德从人际关系的协调性出发：P代表一个人，O代表另一个人，X代表一件事物。当P-O-X系统不平衡时会产生压力，促使系统向平衡过渡。态度改变遵循最少付出原则——哪个方向改变最少就改变哪里。","kw":["海德从人际关系的协调性出发","当P-O-X系统不平衡时会产生压力"],"kp":"sx-4-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-9","s":"社心","c":4,"t":"填空","card":58,"kd":"考点四 态度的改变及其理论","stem":"认知失调的定义","ans":"认知失调是指由于做了一项与态度不一致的行为而引发的不舒服的感觉。当人们的态度与行为不一致，且无法找到外部理由时，会引起心理紧张。","kw":["认知失调是指由于做了一项与态度不一致的行为而引发的不舒服的感觉"],"kp":"sx-4-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-4-10","s":"社心","c":4,"t":"填空","card":59,"kd":"考点四 态度的改变及其理论","stem":"减少认知失调的五种方法","ans":"改变态度、增加认知、改变认知的重要性、减少决定权、改变行为。支持认知失调的证据包括不充足理由、自由决定、努力与认知失调、决策后失调等。老师强调的一句：为某事付出的越多就越喜欢它，这一点在案例分析中经常用到。","kw":["改变认知的重要性","支持认知失调的证据包括不充足理由"],"kp":"sx-4-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-11","s":"社心","c":4,"t":"填空","card":60,"kd":"次要卡","stem":"霍夫兰：态度学习的三种机制","ans":"联结——把特定态度与事物联系在一起；强化——受到奖励有助于形成态度；模仿——通过模仿榜样人物的态度而形成。","kw":["联结——把特定态度与事物联系在一起","强化——受到奖励有助于形成态度"],"kp":"sx-4-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-12","s":"社心","c":4,"t":"填空","card":61,"kd":"次要卡","stem":"凯尔曼：态度形成的三个过程","ans":"服从——为避免惩罚或获得回报而采取一致行为；认同——从心理上认可榜样使态度一致；内化——把态度当作内在行为准则。","kw":["服从——为避免惩罚或获得回报而采取一致行为"],"kp":"sx-4-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-13","s":"社心","c":4,"t":"填空","card":62,"kd":"次要卡","stem":"计划行为理论","ans":"人类有意识的行为取决于态度、主观规范和控制感，态度由对行为结果的信念和评价决定。","kw":["人类有意识的行为取决于态度","主观规范和控制感"],"kp":"sx-4-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L1","s":"社心","c":4,"t":"简答","card":50,"kd":"考点一 态度的概述及成分","stem":"态度的定义","ans":"态度是个体对某一特定事物、观念或他人稳固的、由认知、情感和行为倾向三个成分组成的心理倾向。分为外显态度（我们意识到的并易于报告的）和内隐态度（自然而然的、不受控制且往往无意识的）。","kw":["态度","分为外显态度"],"kp":"sx-4-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-4-L2","s":"社心","c":4,"t":"简答","card":51,"kd":"考点一 态度的概述及成分","stem":"态度的三个心理成分（考试重点）","ans":"（1）认知成分：人们对外界对象的心理印象，包括有关事实、知识和信念，是态度其余成分的基础；（2）情感成分：对态度对象肯定或否定的评价及由此引发的情绪情感，是态度的核心与关键；（3）行为倾向成分：对态度对象所预备采取的反应，具有准备性质，但不等于外显行为。","kw":["（1）认知成分","（2）情感成分","（3）行为倾向成分"],"kp":"sx-4-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L3","s":"社心","c":4,"t":"简答","card":52,"kd":"考点一 态度的概述及成分","stem":"态度的四个心理功能","ans":"效用功能（也叫适应功能，使我们寻求酬赏和他人的赞许）、知识功能（帮助我们组织有关知识，使世界有意义）、自我保护功能（帮助我们应付情绪冲突和保护自尊）、价值表达功能（帮助人们表达自我概念中的核心价值）。","kw":["效用功能"],"kp":"sx-4-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L4","s":"社心","c":4,"t":"简答","card":53,"kd":"考点二 态度与行为的关系","stem":"态度在什么条件下能预测行为？","ans":"将影响态度和行为的其他因素最小化时、态度与行为存在具体相关时、强有力的态度能更好地预测行为。影响态度预测行为的因素包括态度的特殊性、水平、时间因素、自我意识、态度强度、态度的可接近性。","kw":["将影响态度和行为的其他因素最…"],"kp":"sx-4-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L5","s":"社心","c":4,"t":"简答","card":54,"kd":"考点二 态度与行为的关系","stem":"行为影响态度的表现","ans":"角色扮演会塑造态度（津巴多的监狱实验证明了这一点）；言语变成信念（当人们公开表达与自己内心不符的观点时）；登门槛现象（先请人帮一个小忙，再逐步提出更大的请求）；道德行为影响道德思维。","kw":["角色扮演会塑造态度","言语变成信念","登门槛现象","道德行为影响道德思维"],"kp":"sx-4-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L6","s":"社心","c":4,"t":"简答","card":55,"kd":"考点二 态度与行为的关系","stem":"行为影响态度的三种理论解释","ans":"（1）自我呈现理论：人们调整态度以使其与行为一致，属于印象管理；（2）认知失调理论：当行为与态度相反时感到紧张，通过调整态度来缓解紧张；（3）自我知觉理论：当态度不坚定时通过观察自己的行为来推断态度，其推论包括过度合理化效应。","kw":["（1）自我呈现理论","（2）认知失调理论","（3）自我知觉理论"],"kp":"sx-4-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L7","s":"社心","c":4,"t":"简答","card":56,"kd":"考点四 态度的改变及其理论","stem":"改变态度的四种方法","ans":"劝说宣传法（借助传播媒介影响人们）、角色扮演法（通过角色约束和影响来改变态度）、团体影响法（通过团体规范和准则影响态度）、活动参与法（引导人们参加与态度改变有关的活动）。","kw":["劝说宣传法"],"kp":"sx-4-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L8","s":"社心","c":4,"t":"简答","card":57,"kd":"考点四 态度的改变及其理论","stem":"海德的平衡理论（P-O-X模型）","ans":"海德从人际关系的协调性出发：P代表一个人，O代表另一个人，X代表一件事物。当P-O-X系统不平衡时会产生压力，促使系统向平衡过渡。态度改变遵循最少付出原则——哪个方向改变最少就改变哪里。","kw":["海德从人际关系的协调性出发"],"kp":"sx-4-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L9","s":"社心","c":4,"t":"简答","card":58,"kd":"考点四 态度的改变及其理论","stem":"认知失调的定义","ans":"认知失调是指由于做了一项与态度不一致的行为而引发的不舒服的感觉。当人们的态度与行为不一致，且无法找到外部理由时，会引起心理紧张。","kw":["认知失调","当人们的态度与行为不一致"],"kp":"sx-4-9","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-4-L10","s":"社心","c":4,"t":"简答","card":59,"kd":"考点四 态度的改变及其理论","stem":"减少认知失调的五种方法","ans":"改变态度、增加认知、改变认知的重要性、减少决定权、改变行为。支持认知失调的证据包括不充足理由、自由决定、努力与认知失调、决策后失调等。老师强调的一句：为某事付出的越多就越喜欢它，这一点在案例分析中经常用到。","kw":["改变态度","老师强调的一句"],"kp":"sx-4-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L11","s":"社心","c":4,"t":"简答","card":60,"kd":"次要卡","stem":"霍夫兰：态度学习的三种机制","ans":"联结——把特定态度与事物联系在一起；强化——受到奖励有助于形成态度；模仿——通过模仿榜样人物的态度而形成。","kw":["联结——把特定态度与事物联系…","强化——受到奖励有助于形成态…","模仿——通过模仿榜样人物的态…"],"kp":"sx-4-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-4-L13","s":"社心","c":4,"t":"简答","card":62,"kd":"次要卡","stem":"计划行为理论","ans":"人类有意识的行为取决于态度、主观规范和控制感，态度由对行为结果的信念和评价决定。","kw":["人类有意识的行为取决于态度"],"kp":"sx-4-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-1","s":"社心","c":5,"t":"填空","card":63,"kd":"考点一 从众","stem":"从众的定义","ans":"从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。","kw":["从众是指根据他人而做出的行为或信念的改变"],"kp":"sx-5-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-2","s":"社心","c":5,"t":"填空","card":64,"kd":"考点一 从众","stem":"谢里夫的规范形成研究","ans":"谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。","kw":["谢里夫利用似动现象这种视错觉考察了个体的易受暗示性"],"kp":"sx-5-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-3","s":"社心","c":5,"t":"填空","card":65,"kd":"考点一 从众","stem":"阿希的群体压力研究","ans":"阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。","kw":["阿希进行线条知觉判断实验","先让参与者听到其他人判断哪条线段与标准线段相等"],"kp":"sx-5-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-4","s":"社心","c":5,"t":"填空","card":66,"kd":"考点一 从众","stem":"从众的影响因素：情境与团体方面","ans":"情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。","kw":["模糊性是关键变量","当人们不确定正确反应时最容易从众"],"kp":"sx-5-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-5","s":"社心","c":5,"t":"填空","card":67,"kd":"考点一 从众","stem":"从众的影响因素：个人与文化方面","ans":"个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。","kw":["内在自我意识强的人不太会从众","公众自我意识强的人更容易从众"],"kp":"sx-5-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-6","s":"社心","c":5,"t":"填空","card":68,"kd":"次要卡","stem":"顺从的定义","ans":"顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。","kw":["顺从是指在他人的直接请求下","按照他人要求去做的倾向"],"kp":"sx-5-6","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-7","s":"社心","c":5,"t":"填空","card":69,"kd":"次要卡","stem":"顺从的三个影响因素","ans":"积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。","kw":["积极的情绪（情绪好的时候顺从可能性更大","互惠性（互惠规范强调对他人给予的恩惠予以回报"],"kp":"sx-5-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-8","s":"社心","c":5,"t":"填空","card":70,"kd":"次要卡","stem":"增加顺从的四种技巧","ans":"登门槛效应（先提小要求，满足后再提较大要求）、留面子效应（先提很大的要求，被拒后紧接着提小要求）、折扣技巧（先提很高的要求，在对方回应前赶紧打折扣或给予其他好处）、滚雪球又称低球效应（最初要求被接受后又提出新的较高要求）。","kw":["满足后再提较大要求","被拒后紧接着提小要求"],"kp":"sx-5-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-9","s":"社心","c":5,"t":"填空","card":71,"kd":"次要卡","stem":"服从的定义","ans":"服从是指在他人的直接命令之下做出某种行为的倾向。很多时候人们会服从地位高的他人或权威的命令。","kw":["服从是指在他人的直接命令之下做出某种行为的倾向"],"kp":"sx-5-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-10","s":"社心","c":5,"t":"填空","card":72,"kd":"次要卡","stem":"米尔格拉姆服从实验","ans":"参与者扮演老师，对隔壁房间扮演学生的实验助手实施电击，电压从15伏到450伏；电压升到150伏时学生开始求饶，随电压升高大喊大叫、哭着求放过；参与者犹豫时实验者会说「继续下去，你必须继续，没有其他办法」。在最理想条件下，有65%的成年男性完全服从命令，对无辜受害者实施具有伤害性的电击。","kw":["对隔壁房间扮演学生的实验助手实施电击"],"kp":"sx-5-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-11","s":"社心","c":5,"t":"填空","card":73,"kd":"次要卡","stem":"米尔格拉姆实验揭示的高服从率条件","ans":"权威与道德的冲突；正当的权威、近距离的命令者、遥远的受害者、以及没有反抗的榜样，这些条件共同导致了高服从率。","kw":["权威与道德的冲突","以及没有反抗的榜样"],"kp":"sx-5-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-12","s":"社心","c":5,"t":"填空","card":74,"kd":"次要卡","stem":"服从的四个影响因素","ans":"与受害者的情感距离（能看到他人痛苦时更可能产生同情心、减少伤害）、权威的接近性与正当性（权威在空间上接近且正当合理时服从率增加，不正当权威会激起反叛）、机构的权威性（有机构背景的权威更能发挥社会权力）、群体影响的释放效应（从众也可以是积极的，提高社会凝聚力）。","kw":["与受害者的情感距离（能看到他人痛苦时更可能产生同情心"],"kp":"sx-5-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-13","s":"社心","c":5,"t":"填空","card":75,"kd":"次要卡","stem":"从众、顺从、服从三者的区别","ans":"三者都是个体或群体受社会影响而行为向外在影响力靠拢的现象，核心区别在于压力源和行为动机不同：从众的影响源是个体感受群体压力下的自我跟从行为；顺从的影响源是有意对行为者施加直接或隐含的影响；服从的引发具有强制性，命令者与服从者之间有规定性的社会角色联系。","kw":["三者都是个体或群体受社会影响而行为向外在影响力靠拢的现象"],"kp":"sx-5-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L1","s":"社心","c":5,"t":"简答","card":63,"kd":"考点一 从众","stem":"从众的定义","ans":"从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。","kw":["从众","个人"],"kp":"sx-5-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-L2","s":"社心","c":5,"t":"简答","card":64,"kd":"考点一 从众","stem":"谢里夫的规范形成研究","ans":"谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。","kw":["当正确答案的规范形成后"],"kp":"sx-5-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L3","s":"社心","c":5,"t":"简答","card":65,"kd":"考点一 从众","stem":"阿希的群体压力研究","ans":"阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。","kw":["阿希进行线条知觉判断实验","当其他人一致给出错误答案时","当参与者中有人给出正确答案时"],"kp":"sx-5-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L4","s":"社心","c":5,"t":"简答","card":66,"kd":"考点一 从众","stem":"从众的影响因素：情境与团体方面","ans":"情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。","kw":["情境方面：模糊性","团体方面"],"kp":"sx-5-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L5","s":"社心","c":5,"t":"简答","card":67,"kd":"考点一 从众","stem":"从众的影响因素：个人与文化方面","ans":"个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。","kw":["个人方面","人们有时不从众","地位越低从众可能性越大","文化方面"],"kp":"sx-5-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L6","s":"社心","c":5,"t":"简答","card":68,"kd":"次要卡","stem":"顺从的定义","ans":"顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。","kw":["顺从","做顺从行为时"],"kp":"sx-5-6","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-L7","s":"社心","c":5,"t":"简答","card":69,"kd":"次要卡","stem":"顺从的三个影响因素","ans":"积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。","kw":["积极的情绪"],"kp":"sx-5-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L9","s":"社心","c":5,"t":"简答","card":71,"kd":"次要卡","stem":"服从的定义","ans":"服从是指在他人的直接命令之下做出某种行为的倾向。很多时候人们会服从地位高的他人或权威的命令。","kw":["服从"],"kp":"sx-5-9","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-5-L11","s":"社心","c":5,"t":"简答","card":73,"kd":"次要卡","stem":"米尔格拉姆实验揭示的高服从率条件","ans":"权威与道德的冲突；正当的权威、近距离的命令者、遥远的受害者、以及没有反抗的榜样，这些条件共同导致了高服从率。","kw":["权威与道德的冲突","正当的权威"],"kp":"sx-5-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L12","s":"社心","c":5,"t":"简答","card":74,"kd":"次要卡","stem":"服从的四个影响因素","ans":"与受害者的情感距离（能看到他人痛苦时更可能产生同情心、减少伤害）、权威的接近性与正当性（权威在空间上接近且正当合理时服从率增加，不正当权威会激起反叛）、机构的权威性（有机构背景的权威更能发挥社会权力）、群体影响的释放效应（从众也可以是积极的，提高社会凝聚力）。","kw":["与受害者的情感距离"],"kp":"sx-5-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L13","s":"社心","c":5,"t":"简答","card":75,"kd":"次要卡","stem":"从众、顺从、服从三者的区别","ans":"三者都是个体或群体受社会影响而行为向外在影响力靠拢的现象，核心区别在于压力源和行为动机不同：从众的影响源是个体感受群体压力下的自我跟从行为；顺从的影响源是有意对行为者施加直接或隐含的影响；服从的引发具有强制性，命令者与服从者之间有规定性的社会角色联系。","kw":["三者都","顺从的影响源","服从的引发具有强制性"],"kp":"sx-5-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-5-L3-A","s":"社心","c":5,"t":"论述","card":63,"kd":"考点一 从众","stem":"请用本章核心理论分析一个现实情境（自选或教师给定），要求：①点明所用理论（从本章：从众的定义；谢里夫的规范形成研究；阿希的群体压力研究中选）②按理论要点逐条对应情境 ③给出结论或建议。\n答题骨架：理论名称 → 要点（3–5 条）→ 情境对应 → 结论/建议（按点给分）","ans":"从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。","kw":["从众","个人"],"kp":"sx-5-1","alt":1,"bt":"x"},{"id":"sx-5-L3-B","s":"社心","c":5,"t":"案例","card":0,"kd":"","stem":"情境（北师 2026 方向科目真题）：某奶茶店开业搞「买一赠一」，并雇人在门口排队，同时发动顾客朋友圈转发、社媒晒照，门口天天排长队。\n（1）为什么排队那么多，路过的同学还会进店？（用社心理论解释）\n（2）假如你是老板，还有哪些更积极的活动方案？\n跨章调用要求（≥2–4 章）：从众（第 5 章）＋曝光效应（第 10 章）＋社会认知法则·便利法则/象征性法则（第 3 章）＋社会交换（＋社会认同、说服途径）。\n给分口径：分点作答（每点＝理论名 → 定义 → 对应材料）；至少 3 点，言之有理即可（方向科目口径·附录 B3）。\n答案结构：第（1）问＝多理论分点解释＋每点对应材料；第（2）问＝基于第（1）问的理论提出可执行方案（对应真题第二问·设计方案型）。\n-","ans":"- 从众的定义：从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。- 谢里夫的规范形成研究：谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。- 阿希的群体压力研究：阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。- 从众的影响因素：情境与团体方面：情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。- 从众的影响因素：个人与文化方面：个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。- 顺从的定义：顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。- 顺从的三个影响因素：积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。- 增加顺从的四种技巧：登门槛效应（先提小要求，满足后再提较大要求）、留面子效应（先提很大的要求，被拒后紧接着提小要求）、折扣技巧（先提很高的要求，在对方回应前赶紧打折扣或给予其他好处）、滚雪球又称低球效应（最初要求被接受后又提出新的较高要求）。","kw":["- 从众的定义","个人","- 谢里夫的规范形成研究","当正确答案的规范形成后","- 阿希的群体压力研究","当其他人一致给出错误答案时","当参与者中有人给出正确答案时","- 从众的影响因素","团体方面","人们有时不从众"],"kp":"sx-5-L3-B","bt":"x"},{"id":"sx-6-1","s":"社心","c":6,"t":"填空","card":136,"kd":"考点一 说服的途径","stem":"说服的定义","ans":"说服是一种有目的的沟通过程，通过传递符号化信息，试图改变他人的态度、信念或行为，使其与说服者的意图保持一致。","kw":["说服是一种有目的的沟通过程","通过传递符号化信息"],"kp":"sx-6-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-6-2","s":"社心","c":6,"t":"填空","card":137,"kd":"考点一 说服的途径","stem":"说服的中心路径","ans":"中心路径又称中心途径（2026北师真题答案用词为「中心途径/外周途径」，同义）。主要通过提供详细而逻辑的证据来说服对方接受观点，侧重论据的逻辑性和合理性。当人们积极主动、全面系统地思考问题时更容易接受中心路径说服；如果论据苍白无力，思维缜密的人会很快反驳。","kw":["中心路径又称中心途径（2026北师真题答案用词为「中心途径/外周途径"],"kp":"sx-6-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-3","s":"社心","c":6,"t":"填空","card":138,"kd":"考点一 说服的途径","stem":"说服的外周路径与两条路径的比较","ans":"外周路径又称外周途径。外周路径利用情感、塑造形象或激发认同感等方式使对方接受观点，不注重论据质量而关注外部线索（说服者的魅力、表达方式等），当人们心不在焉或没有主动思考信息时更容易被说服。比较：中心路径引起的态度变化比外周路径更持久（经过深思熟虑形成的认知更稳固）；外周路径简便直观，能迅速激发情感共鸣，但通常只能导致肤浅而短暂的态度改变。","kw":["外周路径又称外周途径","外周路径利用情感"],"kp":"sx-6-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-4","s":"社心","c":6,"t":"填空","card":139,"kd":"考点二 说服的要素","stem":"说服者的三个因素","ans":"专家资格（专业性和权威性）、可靠性（是否值得信任、是否坦诚）、受欢迎程度（外表魅力、是否可爱、与目标对象的相似性）。","kw":["专家资格（专业性和权威性","与目标对象的相似性"],"kp":"sx-6-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-5","s":"社心","c":6,"t":"填空","card":140,"kd":"考点二 说服的要素","stem":"说服信息的差距与恐惧唤醒","ans":"说服信息的差距：信息所提倡的态度与被说服者原有态度之间的差距在一定范围内越大，说服难度越大，超过一定限度人们会直接拒绝接受。信息唤醒的恐惧感：适度恐惧能增加态度改变的可能性，但恐惧超过某个限度人们会采取防御措施否认威胁的重要性，态度反而不发生改变。","kw":["信息所提倡的态度与被说服者原有态度之间的差距在一定范围内越大"],"kp":"sx-6-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-6","s":"社心","c":6,"t":"填空","card":141,"kd":"考点二 说服的要素","stem":"说服信息的呈现方式与呈现顺序","ans":"呈现方式：说服信息复杂时书面呈现效果最好（读者可以反复阅读），信息简单时视觉呈现效果最好、听觉次之、书面最差。呈现顺序：先呈现正面信息再呈现反面信息的效果优于先反后正，因为先呈现的信息会成为后续判断的锚定点。","kw":["说服信息复杂时书面呈现效果最好（读者可以反复阅读"],"kp":"sx-6-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-7","s":"社心","c":6,"t":"填空","card":142,"kd":"考点二 说服的要素","stem":"说服的渠道：主动参与 vs 被动接受","ans":"通过亲身经历和主动参与形成的态度更加自信稳定、更不容易改变；被动接受的说服效果随问题重要性的增加而降低，人们会逐渐产生怀疑和不信任。此外，面对面的互动比大众传媒更能打动人心。","kw":["通过亲身经历和主动参与形成的态度更加自信稳定"],"kp":"sx-6-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-8","s":"社心","c":6,"t":"填空","card":143,"kd":"考点二 说服的要素","stem":"被说服者的七个因素","ans":"人格特性（可说服性、智力水平、自尊高低，高自尊者不容易被说服）、心情（好心情更易接受说服性观点）、卷入程度（卷入越深态度越稳固越难改变）、动机水平、免疫力（过多预先说服会产生类似免疫的效果）、个体差异（认知需求、自我监控、年龄）、自我在说服中的角色。","kw":["高自尊者不容易被说服","心情（好心情更易接受说服性观点"],"kp":"sx-6-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-9","s":"社心","c":6,"t":"填空","card":144,"kd":"考点二 说服的要素","stem":"说服的情境因素","ans":"预先警告：提前告诉被说服者将收到与其立场矛盾的信息时，态度更难改变。分散注意：分散注意能减少抗拒，有利于态度改变。","kw":["提前告诉被说服者将收到与其立场矛盾的信息时"],"kp":"sx-6-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-L1","s":"社心","c":6,"t":"简答","card":136,"kd":"考点一 说服的途径","stem":"说服的定义","ans":"说服是一种有目的的沟通过程，通过传递符号化信息，试图改变他人的态度、信念或行为，使其与说服者的意图保持一致。","kw":["说服"],"kp":"sx-6-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-6-L2","s":"社心","c":6,"t":"简答","card":137,"kd":"考点一 说服的途径","stem":"说服的中心路径","ans":"中心路径又称中心途径（2026北师真题答案用词为「中心途径/外周途径」，同义）。主要通过提供详细而逻辑的证据来说服对方接受观点，侧重论据的逻辑性和合理性。当人们积极主动、全面系统地思考问题时更容易接受中心路径说服；如果论据苍白无力，思维缜密的人会很快反驳。","kw":["中心路径又称中心途径","当人们积极主动","如果论据苍白无力"],"kp":"sx-6-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-L3","s":"社心","c":6,"t":"简答","card":138,"kd":"考点一 说服的途径","stem":"说服的外周路径与两条路径的比较","ans":"外周路径又称外周途径。外周路径利用情感、塑造形象或激发认同感等方式使对方接受观点，不注重论据质量而关注外部线索（说服者的魅力、表达方式等），当人们心不在焉或没有主动思考信息时更容易被说服。比较：中心路径引起的态度变化比外周路径更持久（经过深思熟虑形成的认知更稳固）；外周路径简便直观，能迅速激发情感共鸣，但通常只能导致肤浅而短暂的态度改变。","kw":["外周路径又称外周途径","外周路径利用情感","比较","外周路径简便直观"],"kp":"sx-6-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-L4","s":"社心","c":6,"t":"简答","card":139,"kd":"考点二 说服的要素","stem":"说服者的三个因素","ans":"专家资格（专业性和权威性）、可靠性（是否值得信任、是否坦诚）、受欢迎程度（外表魅力、是否可爱、与目标对象的相似性）。","kw":["专家资格"],"kp":"sx-6-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-L8","s":"社心","c":6,"t":"简答","card":143,"kd":"考点二 说服的要素","stem":"被说服者的七个因素","ans":"人格特性（可说服性、智力水平、自尊高低，高自尊者不容易被说服）、心情（好心情更易接受说服性观点）、卷入程度（卷入越深态度越稳固越难改变）、动机水平、免疫力（过多预先说服会产生类似免疫的效果）、个体差异（认知需求、自我监控、年龄）、自我在说服中的角色。","kw":["人格特性"],"kp":"sx-6-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-6-L9","s":"社心","c":6,"t":"简答","card":144,"kd":"考点二 说服的要素","stem":"说服的情境因素","ans":"预先警告：提前告诉被说服者将收到与其立场矛盾的信息时，态度更难改变。分散注意：分散注意能减少抗拒，有利于态度改变。","kw":["预先警告","分散注意"],"kp":"sx-6-9","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-1","s":"社心","c":7,"t":"填空","card":32,"kd":"考点一 群体的概念","stem":"群体的定义（群体动力学家马文·肖）","ans":"两个或更多的人在较长时间里进行互动，并以某种方式相互影响。群体是为了实现某个特定目标，由两个或以上相互作用、相互依赖的个体组合而成的集合体。","kw":["两个或更多的人在较长时间里进行互动"],"kp":"sx-7-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-2","s":"社心","c":7,"t":"填空","card":33,"kd":"考点一 群体的概念","stem":"社会认同","ans":"群体成员把同一群体中的人看作自己人，而不是陌生人。这一观点（特纳）反映了社会心理学中社会认同的概念。","kw":["群体成员把同一群体中的人看作自己人"],"kp":"sx-7-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-3","s":"社心","c":7,"t":"填空","card":34,"kd":"考点二 社会助长和社会懈怠","stem":"社会助长的定义","ans":"社会助长作用是指他人在场有时能提高个体的作业成绩。经典实验：特里普利特发现自行车手在一起比赛时成绩比单独骑行时更好，儿童在一起绕渔用卷轴时比单独绕线快得多。","kw":["社会助长作用是指他人在场有时能提高个体的作业成绩"],"kp":"sx-7-3","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-4","s":"社心","c":7,"t":"填空","card":35,"kd":"考点二 社会助长和社会懈怠","stem":"扎荣克的唤醒理论：唤醒如何解释社会助长","ans":"唤醒能够增强任何优势反应的趋势。唤醒会提高简单任务的作业成绩（因为这些任务中优势反应往往是正确反应），同时会降低困难任务的作业成绩。","kw":["唤醒能够增强任何优势反应的趋势","唤醒会提高简单任务的作业成绩（因为这些任务中优势反应往往是正确反应"],"kp":"sx-7-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-5","s":"社心","c":7,"t":"填空","card":36,"kd":"考点二 社会助长和社会懈怠","stem":"他人在场引起唤醒的三个原因","ans":"（1）评价顾忌：如果人们认为在场的观察者正在评价自己，优势反应就会明显改善，但他人评价引发的自我关注也会干扰自动化行为；（2）分心：考虑共事者如何行动或观众如何反应时分心，注意他人与注意任务的冲突使认知系统负荷过重从而引起唤醒；（3）纯粹在场：即使没有评价顾忌或分心，他人的纯粹在场也会引发一定程度的唤醒。","kw":["如果人们认为在场的观察者正在评价自己"],"kp":"sx-7-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-6","s":"社心","c":7,"t":"填空","card":37,"kd":"考点二 社会助长和社会懈怠","stem":"社会懈怠的定义","ans":"社会懈怠是指当个体处于团体环境中时，其成绩没有被单独加以评价和激励，而是被看作一个总体时所引发的个体努力水平下降的现象。经典证据：林格曼发现选手在群体拔河中所付出的努力仅有个人单独努力总和的一半。","kw":["社会懈怠是指当个体处于团体环境中时"],"kp":"sx-7-6","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-7","s":"社心","c":7,"t":"填空","card":38,"kd":"考点二 社会助长和社会懈怠","stem":"搭便车效应：社会懈怠的产生原因","ans":"在利益群体内，某个成员努力付出成果后集团内所有人都可能得益，但成本由个人承担，个体倾向于采取搭便车的方式，最终损害群体利益。个体一旦消失在人群中不被注意，评价顾忌减小，社会懈怠就发生了。","kw":["某个成员努力付出成果后集团内所有人都可能得益"],"kp":"sx-7-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-8","s":"社心","c":7,"t":"填空","card":39,"kd":"考点二 社会助长和社会懈怠","stem":"克服社会懈怠的四种方法","ans":"一是让成员有更多参与感和责任感，采取激励措施提高认同感和凝聚力；二是成员之间有亲密交往、彼此是朋友时懈怠减少；三是任务具有挑战性和高吸引力时懈怠程度减弱；四是个体作业成绩可识别化。此外，集体主义文化下的社会懈怠不如个人主义文化下强烈。","kw":["一是让成员有更多参与感和责任感","采取激励措施提高认同感和凝聚力"],"kp":"sx-7-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-9","s":"社心","c":7,"t":"填空","card":40,"kd":"考点三 去个体化","stem":"去个体化的定义","ans":"去个体化是指在某些群体情境中，人们更可能抛弃道德约束，以致忘却了个人的身份，而顺从于群体规范。","kw":["去个体化是指在某些群体情境中","人们更可能抛弃道德约束"],"kp":"sx-7-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-10","s":"社心","c":7,"t":"填空","card":41,"kd":"考点三 去个体化","stem":"去个体化的三个影响因素","ans":"（1）群体规模：团伙规模越大，成员越容易失去自我意识，评价顾忌降到最低，人们把行为责任归因于情境而非自己；（2）匿名性：这是引起去个体化的关键因素，成员越隐匿越觉得不需要对行为负责，自我意识减弱、群体意识增强（互联网提供了类似匿名性）；（3）唤起和分心活动：看到别人和自己做同样的行为时会产生自我强化的愉悦感。","kw":["成员越容易失去自我意识","评价顾忌降到最低"],"kp":"sx-7-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-11","s":"社心","c":7,"t":"填空","card":42,"kd":"考点三 去个体化","stem":"自我觉察与去个体化的关系","ans":"自我觉察是去个体化的对立面。站在镜子或摄像机前的人更加自控，不太可能做出欺骗行为。","kw":["自我觉察是去个体化的对立面","站在镜子或摄像机前的人更加自控"],"kp":"sx-7-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-12","s":"社心","c":7,"t":"填空","card":43,"kd":"考点四 群体极化","stem":"群体极化的定义","ans":"群体极化是指群体讨论的过程通常可以强化群体成员的普遍倾向，使整个群体的意见偏向于某一极端方向。","kw":["群体极化是指群体讨论的过程通常可以强化群体成员的普遍倾向"],"kp":"sx-7-12","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-13","s":"社心","c":7,"t":"填空","card":44,"kd":"考点四 群体极化","stem":"群体极化的两种解释机制","ans":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","kw":["个体在接收和处理信息的过程中","由于接受了事实证据而改变自己的观念"],"kp":"sx-7-13","bt":"b","bp":"ans","bq":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在______中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","bl":["复述"],"bpos":[86],"bsrc":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","nq":1},{"id":"sx-7-14","s":"社心","c":7,"t":"填空","card":45,"kd":"考点四 群体极化","stem":"风险转移","ans":"在群体决策中，参与者受群体心理影响，做出的决策往往更加冒险。在讨论中人们趋于一致所得出的观点，往往比各自原来的观点平均值更倾向于冒险。","kw":["参与者受群体心理影响","做出的决策往往更加冒险"],"kp":"sx-7-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-15","s":"社心","c":7,"t":"填空","card":46,"kd":"考点五 群体思维","stem":"群体思维的定义","ans":"群体思维是指在群体决策中人们为了维护群体和睦而压制异议，过分强调群体一致性而忽视了对决策的深入分析。贾尼斯认为产生条件包括：友善的、凝聚力强的群体，对异议的相对排斥，从自己喜好出发做决策的支配型领导。","kw":["群体思维是指在群体决策中人们为了维护群体和睦而压制异议"],"kp":"sx-7-15","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-16","s":"社心","c":7,"t":"填空","card":47,"kd":"考点五 群体思维","stem":"群体思维的八条症状","ans":"无懈可击的错觉、群体道义毋庸置疑、合理化、对对手的刻板印象、从众压力、自我审查、一致统一的错觉、心理防御。这八条症状会阻止群体成员探寻相反信息和可能性，导致决策出现错误。","kw":["群体道义毋庸置疑","对对手的刻板印象"],"kp":"sx-7-16","bt":"b","bp":"ans","bq":"无懈可击的错觉、群体道义毋庸置疑、合理化、对对手的______、从众压力、自我审查、一致统一的错觉、心理防御。这八条症状会阻止群体成员探寻相反信息和可能性，导致决策出现错误。","bl":["刻板印象"],"bpos":[25],"bsrc":"无懈可击的错觉、群体道义毋庸置疑、合理化、对对手的刻板印象、从众压力、自我审查、一致统一的错觉、心理防御。这八条症状会阻止群体成员探寻相反信息和可能性，导致决策出现错误。","nq":1},{"id":"sx-7-17","s":"社心","c":7,"t":"填空","card":48,"kd":"考点五 群体思维","stem":"预防群体思维的五种方法","ans":"一是领导公正，不偏向任何立场，讨论开始时不让成员表明立场；二是鼓励批评性评价，设置一个真正的反对者；三是将群体划分成几个小组再重组表达不同意见；四是欢迎局外专家提出批评；五是在实施前召开第二次机会会议让大家畅所欲言。","kw":["讨论开始时不让成员表明立场","二是鼓励批评性评价"],"kp":"sx-7-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-18","s":"社心","c":7,"t":"填空","card":49,"kd":"次要卡","stem":"拥挤现象","ans":"庞大的观众群体所激起的唤醒状态会干扰熟练掌握的自动化行为。拥挤能增强唤醒状态，促进优势反应。","kw":["庞大的观众群体所激起的唤醒状态会干扰熟练掌握的自动化行为"],"kp":"sx-7-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L1","s":"社心","c":7,"t":"简答","card":32,"kd":"考点一 群体的概念","stem":"群体的定义（群体动力学家马文·肖）","ans":"两个或更多的人在较长时间里进行互动，并以某种方式相互影响。群体是为了实现某个特定目标，由两个或以上相互作用、相互依赖的个体组合而成的集合体。","kw":["群体"],"kp":"sx-7-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L3","s":"社心","c":7,"t":"简答","card":34,"kd":"考点二 社会助长和社会懈怠","stem":"社会助长的定义","ans":"社会助长作用是指他人在场有时能提高个体的作业成绩。经典实验：特里普利特发现自行车手在一起比赛时成绩比单独骑行时更好，儿童在一起绕渔用卷轴时比单独绕线快得多。","kw":["社会助长作用","经典实验"],"kp":"sx-7-3","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L4","s":"社心","c":7,"t":"简答","card":35,"kd":"考点二 社会助长和社会懈怠","stem":"扎荣克的唤醒理论：唤醒如何解释社会助长","ans":"唤醒能够增强任何优势反应的趋势。唤醒会提高简单任务的作业成绩（因为这些任务中优势反应往往是正确反应），同时会降低困难任务的作业成绩。","kw":["唤醒会提高简单任务的作业成绩"],"kp":"sx-7-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L5","s":"社心","c":7,"t":"简答","card":36,"kd":"考点二 社会助长和社会懈怠","stem":"他人在场引起唤醒的三个原因","ans":"（1）评价顾忌：如果人们认为在场的观察者正在评价自己，优势反应就会明显改善，但他人评价引发的自我关注也会干扰自动化行为；（2）分心：考虑共事者如何行动或观众如何反应时分心，注意他人与注意任务的冲突使认知系统负荷过重从而引起唤醒；（3）纯粹在场：即使没有评价顾忌或分心，他人的纯粹在场也会引发一定程度的唤醒。","kw":["（1）评价顾忌","（2）分心","（3）纯粹在场"],"kp":"sx-7-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L6","s":"社心","c":7,"t":"简答","card":37,"kd":"考点二 社会助长和社会懈怠","stem":"社会懈怠的定义","ans":"社会懈怠是指当个体处于团体环境中时，其成绩没有被单独加以评价和激励，而是被看作一个总体时所引发的个体努力水平下降的现象。经典证据：林格曼发现选手在群体拔河中所付出的努力仅有个人单独努力总和的一半。","kw":["社会懈怠","经典证据"],"kp":"sx-7-6","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L7","s":"社心","c":7,"t":"简答","card":38,"kd":"考点二 社会助长和社会懈怠","stem":"搭便车效应：社会懈怠的产生原因","ans":"在利益群体内，某个成员努力付出成果后集团内所有人都可能得益，但成本由个人承担，个体倾向于采取搭便车的方式，最终损害群体利益。个体一旦消失在人群中不被注意，评价顾忌减小，社会懈怠就发生了。","kw":["在利益群体内","个体一旦消失在人群中不被注意"],"kp":"sx-7-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L8","s":"社心","c":7,"t":"简答","card":39,"kd":"考点二 社会助长和社会懈怠","stem":"克服社会懈怠的四种方法","ans":"一是让成员有更多参与感和责任感，采取激励措施提高认同感和凝聚力；二是成员之间有亲密交往、彼此是朋友时懈怠减少；三是任务具有挑战性和高吸引力时懈怠程度减弱；四是个体作业成绩可识别化。此外，集体主义文化下的社会懈怠不如个人主义文化下强烈。","kw":["二是成员之间有亲密交往","四是个体作业成绩可识别化"],"kp":"sx-7-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L9","s":"社心","c":7,"t":"简答","card":40,"kd":"考点三 去个体化","stem":"去个体化的定义","ans":"去个体化是指在某些群体情境中，人们更可能抛弃道德约束，以致忘却了个人的身份，而顺从于群体规范。","kw":["去个体化"],"kp":"sx-7-9","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L10","s":"社心","c":7,"t":"简答","card":41,"kd":"考点三 去个体化","stem":"去个体化的三个影响因素","ans":"（1）群体规模：团伙规模越大，成员越容易失去自我意识，评价顾忌降到最低，人们把行为责任归因于情境而非自己；（2）匿名性：这是引起去个体化的关键因素，成员越隐匿越觉得不需要对行为负责，自我意识减弱、群体意识增强（互联网提供了类似匿名性）；（3）唤起和分心活动：看到别人和自己做同样的行为时会产生自我强化的愉悦感。","kw":["（1）群体规模","（2）匿名性","（3）唤起和分心活动"],"kp":"sx-7-10","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-7-L12","s":"社心","c":7,"t":"简答","card":43,"kd":"考点四 群体极化","stem":"群体极化的定义","ans":"群体极化是指群体讨论的过程通常可以强化群体成员的普遍倾向，使整个群体的意见偏向于某一极端方向。","kw":["群体极化"],"kp":"sx-7-12","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L13","s":"社心","c":7,"t":"简答","card":44,"kd":"考点四 群体极化","stem":"群体极化的两种解释机制","ans":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","kw":["（1）信息影响","讨论中积极参与比消极聆听更容…"],"kp":"sx-7-13","alt":1,"bt":"b","bp":"ans","bq":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在______中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","bl":["复述"],"bpos":[86],"bsrc":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","nq":1},{"id":"sx-7-L15","s":"社心","c":7,"t":"简答","card":46,"kd":"考点五 群体思维","stem":"群体思维的定义","ans":"群体思维是指在群体决策中人们为了维护群体和睦而压制异议，过分强调群体一致性而忽视了对决策的深入分析。贾尼斯认为产生条件包括：友善的、凝聚力强的群体，对异议的相对排斥，从自己喜好出发做决策的支配型领导。","kw":["群体思维","贾尼斯认为产生条件包括"],"kp":"sx-7-15","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-7-L17","s":"社心","c":7,"t":"简答","card":48,"kd":"考点五 群体思维","stem":"预防群体思维的五种方法","ans":"一是领导公正，不偏向任何立场，讨论开始时不让成员表明立场；二是鼓励批评性评价，设置一个真正的反对者；三是将群体划分成几个小组再重组表达不同意见；四是欢迎局外专家提出批评；五是在实施前召开第二次机会会议让大家畅所欲言。","kw":["一是领导公正","二是鼓励批评性评价","四是欢迎局外专家提出批评"],"kp":"sx-7-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-1","s":"社心","c":8,"t":"填空","card":76,"kd":"考点一 偏见与歧视概述","stem":"偏见的本质","ans":"偏见的本质是对某一对象或群体负面的预先判断。偏见是一种态度，由情感、行为倾向和信念结合而成，即态度的ABC理论。","kw":["偏见的本质是对某一对象或群体负面的预先判断"],"kp":"sx-8-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-2","s":"社心","c":8,"t":"填空","card":77,"kd":"考点一 偏见与歧视概述","stem":"偏见与歧视的区别","ans":"偏见是一种负面态度，歧视是一种负面行为，先有偏见后有歧视。刻板印象是指人们对某个群体或事物持有的固定、过于简化的看法，是一种概括性看法；负面评价是偏见的标志，通常源自刻板印象。","kw":["偏见是一种负面态度","歧视是一种负面行为"],"kp":"sx-8-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-3","s":"社心","c":8,"t":"填空","card":78,"kd":"考点一 偏见与歧视概述","stem":"双重态度系统","ans":"我们对同一个目标可以同时拥有外显态度和内隐态度，利用内隐联结测量可以证明这一点。在我们的意识之外，也会产生偏见和歧视。","kw":["我们对同一个目标可以同时拥有外显态度和内隐态度"],"kp":"sx-8-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-4","s":"社心","c":8,"t":"填空","card":79,"kd":"考点一 偏见与歧视概述","stem":"性别角色规范与性别刻板印象","ans":"性别角色规范指人们有关男女应该如何行为的观念；性别刻板印象指人们有关男女事实上如何行为的信念。规范带有约定性质，刻板印象是描述性的。","kw":["性别角色规范指人们有关男女应该如何行为的观念"],"kp":"sx-8-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-5","s":"社心","c":8,"t":"填空","card":80,"kd":"考点二 偏见的根源","stem":"偏见的三种根源","ans":"社会根源（社会不平等、社会化、社会制度）、动机根源（替罪羊理论、现实群体冲突理论、社会同一性理论、避免偏见的动机）、认知根源（类别化、归因）。","kw":["现实群体冲突理论","社会同一性理论"],"kp":"sx-8-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-6","s":"社心","c":8,"t":"填空","card":81,"kd":"考点二 偏见的根源","stem":"社会同一性理论（特纳和塔杰菲尔）","ans":"自我概念包含个人同一性和社会同一性。我们通过归类、认同和比较三个过程，将他人分成内群体和外群体，偏爱自己的群体。内群体偏差指仅仅被归入某一群体，也会增加对内群体的偏爱。自尊受威胁时，会诋毁外群体以恢复自尊。","kw":["自我概念包含个人同一性和社会同一性"],"kp":"sx-8-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-7","s":"社心","c":8,"t":"填空","card":82,"kd":"考点二 偏见的根源","stem":"替罪羊理论","ans":"当我们遭遇挫折，原因令人胆怯或未知时，会转移敌对方向，通过攻击转移来缓解焦虑。现实群体冲突理论则认为，一旦群体为稀缺资源竞争，就会出现偏见。","kw":["原因令人胆怯或未知时","通过攻击转移来缓解焦虑"],"kp":"sx-8-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-8","s":"社心","c":8,"t":"填空","card":83,"kd":"考点二 偏见的根源","stem":"外群体同质性效应","ans":"指人们倾向于认为外群体成员比内群体成员更固定、更刻板。独特的人或生动的事件，会吸引注意力并歪曲判断。","kw":["指人们倾向于认为外群体成员比内群体成员更固定"],"kp":"sx-8-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-9","s":"社心","c":8,"t":"填空","card":84,"kd":"考点二 偏见的根源","stem":"群体服务偏差与公正世界现象","ans":"群体服务偏差：对内群体成员给予善意理解，对外群体成员则从最坏角度设想。公正世界现象：人们倾向于认为所处的社会系统是公正的，事情本该如此。","kw":["对内群体成员给予善意理解","对外群体成员则从最坏角度设想"],"kp":"sx-8-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-10","s":"社心","c":8,"t":"填空","card":85,"kd":"次要卡","stem":"现代种族歧视（文化种族歧视）","ans":"指偏见态度或歧视行为隐藏在其他动机之下。","kw":["指偏见态度或歧视行为隐藏在其…"],"kp":"sx-8-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-11","s":"社心","c":8,"t":"填空","card":86,"kd":"次要卡","stem":"自身永存的刻板印象","ans":"偏见是一种预先判断，引导我们的注意和记忆。一旦把某项特征归入某一类别，记忆系统就会偏向与该类别相关联的特征；符合预期时先前的看法被验证，不符合预期时我们会以特殊情形为由开脱，还可以通过再分类和再分群来维护已有的刻板印象。","kw":["偏见是一种预先判断","引导我们的注意和记忆"],"kp":"sx-8-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-12","s":"社心","c":8,"t":"填空","card":87,"kd":"次要卡","stem":"刻板印象威胁","ans":"是指一种自我验证的忧虑——担心有人会依据负面刻板印象来评价自己的心理压力。这种压力从三方面破坏表现：压力方面（fMRI发现会减少与处理数学问题有关的大脑活动，增加情绪加工脑区活动）、自我监控方面（担心犯错影响注意力集中）、抑制方面（调整思维消耗认知资源），并干扰工作记忆。","kw":["是指一种自我验证的忧虑——担心有人会依据负面刻板印象来评价自己的心理压力"],"kp":"sx-8-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-13","s":"社心","c":8,"t":"填空","card":88,"kd":"次要卡","stem":"歧视的受害效应（阿尔波特《偏见的本质》列举15种）","ans":"归为两类：责怪自己（退缩、自我痛恨）和责怪外部原因（反击、怀疑、群体自豪感增强）。","kw":["和责怪外部原因（反击","群体自豪感增强"],"kp":"sx-8-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-14","s":"社心","c":8,"t":"填空","card":89,"kd":"次要卡","stem":"消除偏见的五种方法","ans":"社会化、受教育程度、直接接触、自我监控、认知和情绪训练。","kw":["受教育程度","认知和情绪训练"],"kp":"sx-8-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-15","s":"社心","c":8,"t":"填空","card":90,"kd":"次要卡","stem":"接触假设：直接接触减少偏见的条件","ans":"对立团体之间的直接接触能减少偏见，条件包括：地位平等、有亲密接触、团体内部有合作并有成功机会、团体内部有支持平等的规范。","kw":["对立团体之间的直接接触能减少偏见"],"kp":"sx-8-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L2","s":"社心","c":8,"t":"简答","card":77,"kd":"考点一 偏见与歧视概述","stem":"偏见与歧视的区别","ans":"偏见是一种负面态度，歧视是一种负面行为，先有偏见后有歧视。刻板印象是指人们对某个群体或事物持有的固定、过于简化的看法，是一种概括性看法；负面评价是偏见的标志，通常源自刻板印象。","kw":["偏见","刻板印象","负面评价"],"kp":"sx-8-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L3","s":"社心","c":8,"t":"简答","card":78,"kd":"考点一 偏见与歧视概述","stem":"双重态度系统","ans":"我们对同一个目标可以同时拥有外显态度和内隐态度，利用内隐联结测量可以证明这一点。在我们的意识之外，也会产生偏见和歧视。","kw":["在我们的意识之外"],"kp":"sx-8-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L4","s":"社心","c":8,"t":"简答","card":79,"kd":"考点一 偏见与歧视概述","stem":"性别角色规范与性别刻板印象","ans":"性别角色规范指人们有关男女应该如何行为的观念；性别刻板印象指人们有关男女事实上如何行为的信念。规范带有约定性质，刻板印象是描述性的。","kw":["规范带有约定性质，刻板印象"],"kp":"sx-8-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L6","s":"社心","c":8,"t":"简答","card":81,"kd":"考点二 偏见的根源","stem":"社会同一性理论（特纳和塔杰菲尔）","ans":"自我概念包含个人同一性和社会同一性。我们通过归类、认同和比较三个过程，将他人分成内群体和外群体，偏爱自己的群体。内群体偏差指仅仅被归入某一群体，也会增加对内群体的偏爱。自尊受威胁时，会诋毁外群体以恢复自尊。","kw":["我们通过归类","自尊受威胁时"],"kp":"sx-8-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L7","s":"社心","c":8,"t":"简答","card":82,"kd":"考点二 偏见的根源","stem":"替罪羊理论","ans":"当我们遭遇挫折，原因令人胆怯或未知时，会转移敌对方向，通过攻击转移来缓解焦虑。现实群体冲突理论则认为，一旦群体为稀缺资源竞争，就会出现偏见。","kw":["当我们遭遇挫折","现实群体冲突理论则认为"],"kp":"sx-8-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L8","s":"社心","c":8,"t":"简答","card":83,"kd":"考点二 偏见的根源","stem":"外群体同质性效应","ans":"指人们倾向于认为外群体成员比内群体成员更固定、更刻板。独特的人或生动的事件，会吸引注意力并歪曲判断。","kw":["独特的人或生动的事件"],"kp":"sx-8-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L13","s":"社心","c":8,"t":"简答","card":88,"kd":"次要卡","stem":"歧视的受害效应（阿尔波特《偏见的本质》列举15种）","ans":"归为两类：责怪自己（退缩、自我痛恨）和责怪外部原因（反击、怀疑、群体自豪感增强）。","kw":["归为两类"],"kp":"sx-8-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L14","s":"社心","c":8,"t":"简答","card":89,"kd":"次要卡","stem":"消除偏见的五种方法","ans":"社会化、受教育程度、直接接触、自我监控、认知和情绪训练。","kw":["社会化"],"kp":"sx-8-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-8-L15","s":"社心","c":8,"t":"简答","card":90,"kd":"次要卡","stem":"接触假设：直接接触减少偏见的条件","ans":"对立团体之间的直接接触能减少偏见，条件包括：地位平等、有亲密接触、团体内部有合作并有成功机会、团体内部有支持平等的规范。","kw":["对立团体之间的直接接触能减少…"],"kp":"sx-8-15","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-1","s":"社心","c":9,"t":"填空","card":1,"kd":"考点一 攻击的概念","stem":"攻击的定义","ans":"攻击是指意图伤害他人的身体行为或者言语行为。判断一个行为是否为攻击，关键在于意图是否以伤害为目的。","kw":["攻击是指意图伤害他人的身体行为或者言语行为"],"kp":"sx-9-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-9-2","s":"社心","c":9,"t":"填空","card":2,"kd":"考点一 攻击的概念","stem":"敌意性攻击与工具性攻击的区别","ans":"敌意性攻击由愤怒引起、以伤害为目的（如大多数谋杀），核心是愤怒驱动的情绪性反应；工具性攻击只是把伤害作为达到其他目的的一种手段（如大多数恐怖活动与战争），攻击本身不是目的。简记：敌意性攻击是为了伤害而伤害，工具性攻击是为了达成目的而伤害。","kw":["敌意性攻击由愤怒引起","核心是愤怒驱动的情绪性反应"],"kp":"sx-9-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-3","s":"社心","c":9,"t":"填空","card":3,"kd":"考点二 攻击的理论","stem":"解释攻击行为的三种理论","ans":"攻击的生物学理论、挫折—攻击理论、社会学习理论。","kw":["攻击的生物学理论","社会学习理论"],"kp":"sx-9-3","bt":"b","bp":"ans","bq":"攻击的生物学理论、______、社会学习理论。","bl":["挫折—攻击理论"],"bpos":[9],"bsrc":"攻击的生物学理论、挫折—攻击理论、社会学习理论。","nq":1},{"id":"sx-9-4","s":"社心","c":9,"t":"填空","card":4,"kd":"考点二 攻击的理论","stem":"攻击的生物学理论：四个方面","ans":"（1）本能论和演化心理学：弗洛伊德认为攻击根源于死本能，洛伦兹认为攻击更多是适应性的；（2）神经系统的影响：受杏仁核、下丘脑、脑干、纹状体等脑区调控，激活增加敌意、抑制则降低敌意；（3）基因的影响；（4）生物化学因素：酒精降低自我抑制能力，高睾酮与攻击直接相关。","kw":["本能论和演化心理学","弗洛伊德认为攻击根源于死本能"],"kp":"sx-9-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-5","s":"社心","c":9,"t":"填空","card":5,"kd":"考点二 攻击的理论","stem":"挫折—攻击理论的发展脉络","ans":"多拉德最早提出，认为挫折总会导致某种形式的攻击；米勒发现挫折也可以产生侵犯以外的结果；伯科维兹修正为：挫折不是侵犯的唯一原因，从挫折到侵犯还需要侵犯线索和武器效应的催化。贡献：使研究者从本能论跳出来关注外部条件。局限：对挫折究竟是外部条件还是内部状态阐述不足。","kw":["认为挫折总会导致某种形式的攻击","米勒发现挫折也可以产生侵犯以外的结果"],"kp":"sx-9-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-6","s":"社心","c":9,"t":"填空","card":6,"kd":"考点二 攻击的理论","stem":"相对剥夺与攻击","ans":"当个体与他人比较发现自己的地位较弱时产生挫折感，可以解释贫富差距大的国家犯罪率较高。事件能否引发侵犯，关键在于是否知觉到他人有意造成。","kw":["当个体与他人比较发现自己的地位较弱时产生挫折感"],"kp":"sx-9-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-7","s":"社心","c":9,"t":"填空","card":7,"kd":"考点二 攻击的理论","stem":"班杜拉：攻击的社会学习机制","ans":"人们学习攻击行为可以发生在亲身体验攻击后果时（攻击的回报），也可以发生在观察模仿他人行为时（观察学习）。家庭方面体罚的父母实际上在示范攻击；文化方面崇尚男子汉气概的社会使攻击合法化；大众媒体方面暴力和攻击性榜样会影响个体。","kw":["人们学习攻击行为可以发生在亲身体验攻击后果时（攻击的回报"],"kp":"sx-9-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-8","s":"社心","c":9,"t":"填空","card":8,"kd":"考点三 攻击的影响因素","stem":"攻击行为的影响因素：九大因素","ans":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、兴奋转移、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","kw":["社会赞许与模仿","其中媒体影响是老师点名的重点"],"kp":"sx-9-8","bt":"b","bp":"ans","bq":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、______、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","bl":["兴奋转移"],"bpos":[26],"bsrc":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、兴奋转移、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","nq":1},{"id":"sx-9-9","s":"社心","c":9,"t":"填空","card":9,"kd":"考点三 攻击的影响因素","stem":"武器效应（伯科维兹）","ans":"伯科维兹发现武器可以作为产生攻击行为的线索，枪支还拉大攻击者和受害者的心理距离。","kw":["伯科维兹发现武器可以作为产生攻击行为的线索"],"kp":"sx-9-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-10","s":"社心","c":9,"t":"填空","card":10,"kd":"考点三 攻击的影响因素","stem":"兴奋转移（齐尔曼）","ans":"由其他刺激诱发的情绪唤起，会转移到其他对象上，也可以解释侵犯行为。","kw":["由其他刺激诱发的情绪唤起","会转移到其他对象上"],"kp":"sx-9-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-11","s":"社心","c":9,"t":"填空","card":11,"kd":"考点三 攻击的影响因素","stem":"温度与攻击的关系","ans":"随气温升高侵犯性增加，但达到某一点后侵犯性反而减少。","kw":[" 但达到某一点后侵"],"kp":"sx-9-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-12","s":"社心","c":9,"t":"填空","card":12,"kd":"考点四 减少攻击行为","stem":"减少攻击行为的七种方法","ans":"利用惩罚；降低挫折与学习抑制；替代性攻击与宣泄；示范非侵犯行为；培养沟通与解决问题的技巧；培养同情心对抗去人性化；正确与真诚的道歉。","kw":["降低挫折与学习抑制","替代性攻击与宣泄"],"kp":"sx-9-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-13","s":"社心","c":9,"t":"填空","card":13,"kd":"考点四 减少攻击行为","stem":"惩罚减少攻击的有效条件","ans":"行为主义认为惩罚能减少侵犯冲动，但惩罚本身采用侵犯形式，是在示范侵犯行为，可能引发模仿。惩罚只在两个理想条件下有效——迅速和不可避免，但现实中很难实现。惩罚对控制不足侵犯型有用，对控制过分侵犯型作用不大。","kw":["行为主义认为惩罚能减少侵犯冲动","但惩罚本身采用侵犯形式"],"kp":"sx-9-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-14","s":"社心","c":9,"t":"填空","card":14,"kd":"考点四 减少攻击行为","stem":"替代性攻击与宣泄","ans":"替代性侵犯只对另一目标表现，侵犯的基本原则是目标与挫折来源越相似，侵犯冲动越强烈。宣泄只提供场合让受挫者发泄愤怒，可减少进一步侵犯。","kw":["替代性侵犯只对另一目标表现","侵犯的基本原则是目标与挫折来源越相似"],"kp":"sx-9-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L1","s":"社心","c":9,"t":"简答","card":1,"kd":"考点一 攻击的概念","stem":"攻击的定义","ans":"攻击是指意图伤害他人的身体行为或者言语行为。判断一个行为是否为攻击，关键在于意图是否以伤害为目的。","kw":["攻击","判断一个行为"],"kp":"sx-9-1","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"sx-9-L2","s":"社心","c":9,"t":"简答","card":2,"kd":"考点一 攻击的概念","stem":"敌意性攻击与工具性攻击的区别","ans":"敌意性攻击由愤怒引起、以伤害为目的（如大多数谋杀），核心是愤怒驱动的情绪性反应；工具性攻击只是把伤害作为达到其他目的的一种手段（如大多数恐怖活动与战争），攻击本身不是目的。简记：敌意性攻击是为了伤害而伤害，工具性攻击是为了达成目的而伤害。","kw":["敌意性攻击由愤怒引起","工具性攻击只","简记：敌意性攻击"],"kp":"sx-9-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L3","s":"社心","c":9,"t":"简答","card":3,"kd":"考点二 攻击的理论","stem":"解释攻击行为的三种理论","ans":"攻击的生物学理论、挫折—攻击理论、社会学习理论。","kw":["攻击的生物学理论"],"kp":"sx-9-3","alt":1,"bt":"b","bp":"ans","bq":"攻击的生物学理论、______、社会学习理论。","bl":["挫折—攻击理论"],"bpos":[9],"bsrc":"攻击的生物学理论、挫折—攻击理论、社会学习理论。","nq":1},{"id":"sx-9-L4","s":"社心","c":9,"t":"简答","card":4,"kd":"考点二 攻击的理论","stem":"攻击的生物学理论：四个方面","ans":"（1）本能论和演化心理学：弗洛伊德认为攻击根源于死本能，洛伦兹认为攻击更多是适应性的；（2）神经系统的影响：受杏仁核、下丘脑、脑干、纹状体等脑区调控，激活增加敌意、抑制则降低敌意；（3）基因的影响；（4）生物化学因素：酒精降低自我抑制能力，高睾酮与攻击直接相关。","kw":["（1）本能论和演化心理学","（2）神经系统的影响","（3）基因的影响","（4）生物化学因素"],"kp":"sx-9-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L5","s":"社心","c":9,"t":"简答","card":5,"kd":"考点二 攻击的理论","stem":"挫折—攻击理论的发展脉络","ans":"多拉德最早提出，认为挫折总会导致某种形式的攻击；米勒发现挫折也可以产生侵犯以外的结果；伯科维兹修正为：挫折不是侵犯的唯一原因，从挫折到侵犯还需要侵犯线索和武器效应的催化。贡献：使研究者从本能论跳出来关注外部条件。局限：对挫折究竟是外部条件还是内部状态阐述不足。","kw":["多拉德最早提出","伯科维兹修正为：挫折不","贡献","局限：对挫折究竟"],"kp":"sx-9-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L7","s":"社心","c":9,"t":"简答","card":7,"kd":"考点二 攻击的理论","stem":"班杜拉：攻击的社会学习机制","ans":"人们学习攻击行为可以发生在亲身体验攻击后果时（攻击的回报），也可以发生在观察模仿他人行为时（观察学习）。家庭方面体罚的父母实际上在示范攻击；文化方面崇尚男子汉气概的社会使攻击合法化；大众媒体方面暴力和攻击性榜样会影响个体。","kw":["人们学习攻击行为可以发生在亲…","文化方面崇尚男子汉气概的社会…","大众媒体方面暴力和攻击性榜样…"],"kp":"sx-9-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L8","s":"社心","c":9,"t":"简答","card":8,"kd":"考点三 攻击的影响因素","stem":"攻击行为的影响因素：九大因素","ans":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、兴奋转移、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","kw":["厌恶事件","其中媒体影响"],"kp":"sx-9-8","alt":1,"bt":"b","bp":"ans","bq":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、______、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","bl":["兴奋转移"],"bpos":[26],"bsrc":"厌恶事件、唤醒、攻击线索、媒体影响、群体影响、温度、兴奋转移、饮酒、社会赞许与模仿。其中媒体影响是老师点名的重点。","nq":1},{"id":"sx-9-L9","s":"社心","c":9,"t":"简答","card":9,"kd":"考点三 攻击的影响因素","stem":"武器效应（伯科维兹）","ans":"伯科维兹发现武器可以作为产生攻击行为的线索，枪支还拉大攻击者和受害者的心理距离。","kw":["伯科维兹发现武器可以作为产生…"],"kp":"sx-9-9","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L12","s":"社心","c":9,"t":"简答","card":12,"kd":"考点四 减少攻击行为","stem":"减少攻击行为的七种方法","ans":"利用惩罚；降低挫折与学习抑制；替代性攻击与宣泄；示范非侵犯行为；培养沟通与解决问题的技巧；培养同情心对抗去人性化；正确与真诚的道歉。","kw":["降低挫折与学习抑制","替代性攻击与宣泄","示范非侵犯行为","培养沟通与解决问题的技巧","培养同情心对抗去人性化","正确与真诚的道歉"],"kp":"sx-9-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-9-L13","s":"社心","c":9,"t":"简答","card":13,"kd":"考点四 减少攻击行为","stem":"惩罚减少攻击的有效条件","ans":"行为主义认为惩罚能减少侵犯冲动，但惩罚本身采用侵犯形式，是在示范侵犯行为，可能引发模仿。惩罚只在两个理想条件下有效——迅速和不可避免，但现实中很难实现。惩罚对控制不足侵犯型有用，对控制过分侵犯型作用不大。","kw":["惩罚对控制不足侵犯型有用"],"kp":"sx-9-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-1-1","s":"社心","c":1,"t":"单选","card":145,"kd":"考点一 研究对象","stem":"社会心理学是（　）的交叉学科。","ans":"社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科。和社会学相比，社心更侧重于用实验方法对个体进行研究；和人格心理学相比，社心对个体差异关注较少，更侧重于研究不同个体之间如何相互看待和彼此影响。","kw":["社会心理学","它是心理学和社会学的交叉学科","和社会学相比","和人格心理学相比"],"opts":{"A":"心理学与社会学","B":"心理学与人类学","C":"社会学与教育学","D":"心理学与哲学"},"key":"A","jx":{"po":"设问「社会心理学是（　）的交叉学科。」落在「考点一 研究对象」卡 145。答案按 2 层展开：社会心理学是一门研究人们如何看待他人；和人格心理学相比。漏一层就丢一档分。","ok":"正确项 A：心理学与社会学。手册卡 145 原文：「社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科…」","bad":"B、C、D 都不是教材说法；社心与人类学、教育学、哲学没有这层定义关系。 同考点还有卡 146「社会心理学的三个研究对象」，两卡常被混问，注意别串。"},"kp":"sx-1-1","bt":"x"},{"id":"sx-1-2","s":"社心","c":1,"t":"单选","card":145,"kd":"考点一 研究对象","stem":"与社会学相比，社会心理学更侧重（　）。","ans":"社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科。和社会学相比，社心更侧重于用实验方法对个体进行研究；和人格心理学相比，社心对个体差异关注较少，更侧重于研究不同个体之间如何相互看待和彼此影响。","kw":["社会心理学","它是心理学和社会学的交叉学科","和社会学相比","和人格心理学相比"],"opts":{"A":"群体与社会结构","B":"用实验方法研究个体","C":"社会制度变迁","D":"人口统计"},"key":"B","jx":{"po":"设问「与社会学相比，社会心理学更侧重（　）。」落在「考点一 研究对象」卡 145。答案按 2 层展开：社会心理学是一门研究人们如何看待他人；和人格心理学相比。漏一层就丢一档分。","ok":"正确项 B：用实验方法研究个体。手册卡 145 原文：「社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科…」","bad":"A 是社会学自己的关注点；C 制度变迁、D 人口统计更是社会学、人口学的活儿。 同考点还有卡 146「社会心理学的三个研究对象」，两卡常被混问，注意别串。"},"kp":"sx-1-2","bt":"x"},{"id":"sx-1-3","s":"社心","c":1,"t":"单选","card":145,"kd":"考点一 研究对象","stem":"与人格心理学相比，社会心理学（　）。","ans":"社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科。和社会学相比，社心更侧重于用实验方法对个体进行研究；和人格心理学相比，社心对个体差异关注较少，更侧重于研究不同个体之间如何相互看待和彼此影响。","kw":["社会心理学","它是心理学和社会学的交叉学科","和社会学相比","和人格心理学相比"],"opts":{"A":"更关注个体差异","B":"对个体差异关注较少，更侧重个体之间如何相互看待与影响","C":"完全不研究个体","D":"只研究变态行为"},"key":"B","jx":{"po":"设问「与人格心理学相比，社会心理学（　）。」落在「考点一 研究对象」卡 145。答案按 2 层展开：社会心理学是一门研究人们如何看待他人；和人格心理学相比。漏一层就丢一档分。","ok":"正确项 B：对个体差异关注较少，更侧重个体之间如何相互看待与影响。手册卡 145 原文：「社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科…」","bad":"A 说反了；C「完全不研究个体」、D「只研究变态」都是绝对化错误。 同考点还有卡 146「社会心理学的三个研究对象」，两卡常被混问，注意别串。"},"kp":"sx-1-3","bt":"x"},{"id":"sx-1-4","s":"社心","c":1,"t":"填空","card":146,"kd":"考点一 研究对象","stem":"社会心理学的三个研究对象","ans":"社会心理学的三个研究对象：社会思维、社会影响、社会行为。","kw":["思维","影响","行为"],"jx":{"po":"设问「社会心理学的三个研究对象」落在「考点一 研究对象」卡 146。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 145「社会心理学的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-1-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-1-5","s":"社心","c":1,"t":"填空","card":147,"kd":"考点二 研究内容","stem":"社会心理学的目标","ans":"社会心理学的目标：科学地描述、解释、预测、控制人的社会行为。","kw":["描述","解释","预测","控制"],"jx":{"po":"设问「社会心理学的目标」落在「考点二 研究内容」卡 147。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 148「社会心理学的四个研究层次」，两卡常被混问，注意别串。"},"kp":"sx-1-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-1-6","s":"社心","c":1,"t":"填空","card":148,"kd":"考点二 研究内容","stem":"社会心理学的四个研究层次分别是什么？","ans":"四个研究层次：个体过程、人际过程、群体过程、文化过程。","kw":["个体","人际","群体","文化"],"jx":{"po":"设问「社会心理学的四个研究层次分别是什么？」落在「考点二 研究内容」卡 148。本题为问答型：不设空，按关键词自评。","ok":"","bad":""},"kp":"sx-1-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-1-7","s":"社心","c":1,"t":"简答","card":145,"kd":"考点一 研究对象","stem":"写出社会心理学的定义，并说明它与社会学、人格心理学的区别。","ans":"社会心理学是一门研究人们如何看待他人、如何互相影响以及如何与他人互相关联的科学。它是心理学和社会学的交叉学科。和社会学相比，社心更侧重于用实验方法对个体进行研究；和人格心理学相比，社心对个体差异关注较少，更侧重于研究不同个体之间如何相互看待和彼此影响。","kw":["社会心理学","它是心理学和社会学的交叉学科","和社会学相比","和人格心理学相比"],"jx":{"po":"设问「写出社会心理学的定义，并说明它与社会学、人格心理学的区别。」落在「考点一 研究对象」卡 145。答案按 2 层展开：社会心理学是一门研究人们如何看待他人；和人格心理学相比。漏一层就丢一档分。","ok":"踩分术语 4 个：「社会心理学」、「它是心理学和社会学的交叉学科」、「和社会学相比」、「和人格心理学相比」。先写术语，再展开。","bad":"同考点还有卡 146「社会心理学的三个研究对象」，两卡常被混问，注意别串。"},"kp":"sx-1-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-1-8","s":"社心","c":1,"t":"简答","card":146,"kd":"考点一 研究对象","stem":"列举社会心理学的三个研究对象，各写出其包含内容。","ans":"社会思维（如何知觉自我和他人、信念、判断和态度）、社会影响（文化、从众、说服和群体）、社会行为（偏见、攻击、吸引力和帮助）。","kw":["社会思维"],"jx":{"po":"设问「列举社会心理学的三个研究对象，各写出其包含内容。」落在「考点一 研究对象」卡 146。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「社会思维」。先写术语，再展开。","bad":"同考点还有卡 145「社会心理学的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-1-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-2-1","s":"社心","c":2,"t":"单选","card":113,"kd":"考点一 自我概念","stem":"自我概念属于自我的（　）方面。","ans":"自我概念回答了「我是谁」这个问题，是自我的认知方面，即我们对自己各方面认识和信念的总和。","kw":["自我概念回答了「我"],"opts":{"A":"认知","B":"情感","C":"行为","D":"意志"},"key":"A","jx":{"po":"设问「自我概念属于自我的（　）方面。」落在「考点一 自我概念」卡 113。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 A：认知。手册卡 113 原文：「自我概念回答了「我是谁」这个问题，是自我的认知方面，即我们对自己各方面认识和信念的总和。」","bad":"B 情感＝自尊；C 行为＝自我控制、自我呈现；D「意志」不是自我的三分法之一。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-1","bt":"x"},{"id":"sx-2-2","s":"社心","c":2,"t":"单选","card":112,"kd":"考点一 自我概念","stem":"「高估别人对自己的关注程度」是（　）。","ans":"焦点效应又称聚光灯效应：指人们把自己看作一切的中心，高估别人对自己的关注程度。透明度错觉：指人们倾向于认为自身的情绪表现比实际情况更明显。","kw":["焦点效应又称聚光灯效应","透明度错觉"],"opts":{"A":"透明度错觉","B":"焦点效应","C":"虚假独特性","D":"自我妨碍"},"key":"B","jx":{"po":"设问「「高估别人对自己的关注程度」是（　）。」落在「考点一 自我概念」卡 112。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：焦点效应。手册卡 112 原文：「焦点效应又称聚光灯效应：指人们把自己看作一切的中心，高估别人对自己的关注程度…」","bad":"A 透明度错觉是「觉得别人看得到我的情绪」；C 虚假独特性是「觉得自己的优点独特」；D 自我妨碍是「给自己设障碍」。 同考点还有卡 113「自我概念的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-2-2","bt":"x"},{"id":"sx-2-3","s":"社心","c":2,"t":"单选","card":112,"kd":"考点一 自我概念","stem":"「认为自己的情绪表现比实际更明显」是（　）。","ans":"焦点效应又称聚光灯效应：指人们把自己看作一切的中心，高估别人对自己的关注程度。透明度错觉：指人们倾向于认为自身的情绪表现比实际情况更明显。","kw":["焦点效应又称聚光灯效应","透明度错觉"],"opts":{"A":"焦点效应","B":"透明度错觉","C":"虚假普遍性","D":"盲目乐观"},"key":"B","jx":{"po":"设问「「认为自己的情绪表现比实际更明显」是（　）。」落在「考点一 自我概念」卡 112。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：透明度错觉。手册卡 112 原文：「焦点效应又称聚光灯效应：指人们把自己看作一切的中心，高估别人对自己的关注程度…」","bad":"A 焦点效应是「被关注程度」；C 虚假普遍性是「大家都这样」；D 盲目乐观是「坏事轮不到我」。 同考点还有卡 113「自我概念的定义（老师原话：我们记这句）」，两卡常被混问，注意别串。"},"kp":"sx-2-3","bt":"x"},{"id":"sx-2-4","s":"社心","c":2,"t":"单选","card":114,"kd":"考点一 自我概念","stem":"可能自我的提出者是（　）。","ans":"自我图式：指用来组织和指引与自己有关信息的一套自我信念，强烈影响我们对社会信息的加工。可能自我（马库斯提出）：包括我们梦想中的样子和我们害怕成为的样子，能激发渴望的生活愿景，具有激励作用。","kw":["自我图式","可能自我"],"opts":{"A":"库利","B":"米德","C":"马库斯","D":"班杜拉"},"key":"C","jx":{"po":"设问「可能自我的提出者是（　）。」落在「考点一 自我概念」卡 114。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 C：马库斯。手册卡 114 原文：「自我图式：指用来组织和指引与自己有关信息的一套自我信念，强烈影响我们对社会信息的加工…」","bad":"A 库利是镜像自我（卡 115）；B 米德是符号互动、概化他人；D 班杜拉是自我效能（卡 116）。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-4","bt":"x"},{"id":"sx-2-5","s":"社心","c":2,"t":"单选","card":115,"kd":"考点一 自我概念","stem":"镜像自我的提出者是（　）。","ans":"库利提出，镜像自我指我们以别人怎么看我们为镜子认识自己；米德进一步指出，与我们自我概念有关的是我们想象中别人如何评价我们。","kw":["库利提出","米德进一步指出"],"opts":{"A":"库利","B":"马库斯","C":"罗特","D":"塞利格曼"},"key":"A","jx":{"po":"设问「镜像自我的提出者是（　）。」落在「考点一 自我概念」卡 115。答案按 2 层展开：库利提出；米德进一步指出。漏一层就丢一档分。","ok":"正确项 A：库利。手册卡 115 原文：「库利提出，镜像自我指我们以别人怎么看我们为镜子认识自己；米德进一步指出…」","bad":"B 马库斯是可能自我；C 罗特是控制点；D 塞利格曼是习得性无助。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-5","bt":"x"},{"id":"sx-2-6","s":"社心","c":2,"t":"单选","card":116,"kd":"考点一 自我概念","stem":"自我效能的提出者是（　）。","ans":"自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」。四个信息来源：直接经验（学习者的亲身经历影响最大）、替代经验（观察榜样行为获得间接经验）、言语说服（他人的劝告和解释）、情绪唤起。","kw":["与自尊的区别：自我效能","四个信息来源"],"opts":{"A":"罗特","B":"班杜拉","C":"塞利格曼","D":"特温奇"},"key":"B","jx":{"po":"设问「自我效能的提出者是（　）。」落在「考点一 自我概念」卡 116。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：班杜拉。手册卡 116 原文：「自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」…」","bad":"A 罗特是控制点；C 塞利格曼是习得性无助；D 特温奇与自我服务偏差相关，不在本卡。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-6","bt":"x"},{"id":"sx-2-7","s":"社心","c":2,"t":"单选","card":116,"kd":"考点一 自我概念","stem":"自我效能的信息来源中影响最大的是（　）。","ans":"自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」。四个信息来源：直接经验（学习者的亲身经历影响最大）、替代经验（观察榜样行为获得间接经验）、言语说服（他人的劝告和解释）、情绪唤起。","kw":["与自尊的区别：自我效能","四个信息来源"],"opts":{"A":"替代经验","B":"言语说服","C":"直接经验","D":"情绪唤起"},"key":"C","jx":{"po":"设问「自我效能的信息来源中影响最大的是（　）。」落在「考点一 自我概念」卡 116。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 C：直接经验。手册卡 116 原文：「自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」…」","bad":"A 替代经验、B 言语说服、D 情绪唤起都是来源，但影响力排序里直接经验最大。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-7","bt":"x"},{"id":"sx-2-8","s":"社心","c":2,"t":"单选","card":116,"kd":"考点一 自我概念","stem":"「我能做好这件事」指（　），「我喜欢我自己」指（　）。","ans":"自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」。四个信息来源：直接经验（学习者的亲身经历影响最大）、替代经验（观察榜样行为获得间接经验）、言语说服（他人的劝告和解释）、情绪唤起。","kw":["与自尊的区别：自我效能","四个信息来源"],"opts":{"A":"自尊／自我效能","B":"自我效能／自尊","C":"自我概念／自尊","D":"自我效能／自我概念"},"key":"B","jx":{"po":"设问「「我能做好这件事」指（　），「我喜欢我自己」指（　）。」落在「考点一 自我概念」卡 116。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 B：自我效能／自尊。手册卡 116 原文：「自我效能指一个人对自己有能力完成特定任务的信念。与自尊的区别：自我效能是「我能做好这件事」，自尊是「我喜欢我自己」…」","bad":"A 把两者对调；C、D 把自我概念（我是谁）混进来。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-8","bt":"x"},{"id":"sx-2-9","s":"社心","c":2,"t":"单选","card":117,"kd":"考点一 自我概念","stem":"控制点的提出者是（　）；习得性无助的提出者是（　）。","ans":"控制点由罗特提出，分内部控制点和外部控制点：内控者认为自己能掌控命运，外控者认为外部力量决定一切。习得性无助由塞利格曼提出：指经历了无法控制的不利事件后习得无助和被动，与自我效能感相对应。","kw":["控制点由罗特提出","习得性无助由塞利格曼提出"],"opts":{"A":"罗特／塞利格曼","B":"塞利格曼／罗特","C":"班杜拉／罗特","D":"罗特／班杜拉"},"key":"A","jx":{"po":"设问「控制点的提出者是（　）；习得性无助的提出者是（　）。」落在「考点一 自我概念」卡 117。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"正确项 A：罗特／塞利格曼。手册卡 117 原文：「控制点由罗特提出，分内部控制点和外部控制点：内控者认为自己能掌控命运，外控者认为外部力量决定一切…」","bad":"B 对调；C、D 把班杜拉（自我效能）拉进来。 同考点还有卡 112「焦点效应与透明度错觉」，两卡常被混问，注意别串。"},"kp":"sx-2-9","bt":"x"},{"id":"sx-2-10","s":"社心","c":2,"t":"单选","card":118,"kd":"考点一 自我概念","stem":"「通过设置障碍阻挠自己成功以保护自尊」是（　）。","ans":"自我妨碍是指人们通过设置障碍来阻挠自己获得成功，以保护自尊和公众形象，当失败可能使人看起来糟糕时就会采取这种方式。 ／关注点／公共成分／自我评价倾向）。","ans":"西方个人主义文化中身份独立，关注自身独特的内在特质。独立型自我强调个体稳定的内在品质；互依型自我注重与他人保持和谐的互动关系，拥有更多公共成分。在集体主义文化中，个人服从集体，个体喜欢自我批评，很少自我肯定。","kw":["西方个人主义文化中身份独立","在集体主义文化中"],"jx":{"po":"设问「独立型自我与互依型自我的差异（文化基础／关注点／公共成分／自我评价倾向）。」落在「考点三 自我与文化」卡 122。答案按 2 层展开：西方个人主义文化中身份独立；互依型自我注重与他人保持和谐的互动关系。漏一层就丢一档分。","ok":"踩分术语 2 个：「西方个人主义文化中身份独立」、「在集体主义文化中」。先写术语，再展开。","bad":"同考点还有卡 123「文化与自尊」，两卡常被混问，注意别串。"},"kp":"sx-2-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"sx-2-20","s":"社心","c":2,"t":"简答","card":125,"kd":"考点四 自我服务偏差","stem":"自我服务偏差的三种表现，各举一例。","ans":"高于平均水平效应（在多数主观和社会赞许性方面，大部分人都觉得自己比平均水平好；群体成员对自己贡献的评价之和总是超过百分之百）、盲目乐观（在没有充分理由时过分乐观看待事物，相信自己总能幸免于难；防御性悲观主义可以把我们从盲目乐观中拯救出来）、虚假普遍性和虚假独特性（虚假普遍性指高估别人对我们观点的赞成度以支持自己的立场，虚假独特性指把自己的才智和品德看成异于常人以完善自我形象）。","kw":["高于平均水平效应"],"jx":{"po":"设问「自我服务偏差的三种表现，各举一例。」落在「考点四 自我服务偏差」卡 125。答案按 3 层展开：高于平均水平效应；群体成员对自己贡献的评价之和总是超过百分之百）；防御性悲观主义可以把我们从盲目乐观中拯救出来）。漏一层就丢一档分。","ok":"踩分术语 1 个：「高于平均水平效应」。先写术语，再展开。","bad":"同考点还有卡 124「自我服务偏差的定义（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"sx-2-13","alt":1,"bt":"q","qt":"lun","qtRule":"题干要求评价/对比/举例且答案>=120字"},{"id":"sx-2-21","s":"社心","c":2,"t":"论述","card":0,"kd":"","stem":"（对应\"理论型考点\"）试述自我服务偏差的表现、机制及适应性价值与不良适应，并结合考研备考谈谈它对学习策略调整的启示。","ans":"①表现：高于平均水平效应盲目乐观虚假普遍性与虚假独特性（＋自我服务归因：成功归己、失败归外）②机制：维护自尊与自我形象＋认知吝啬（偏向省力且对己有利的解释）③适应性：抗抑郁、缓压、维持动机，积极自尊可缓解焦虑甚至消除对死亡的恐惧 ④不良适应：归因失真→不改方法；群体服务偏差引发群体不和 ⑤备考启示：用可控归因（方法/时间投入而非\"我笨/题偏\"）、用客观分数与他人反馈校准自我评估、警惕\"虚假普遍性\"（以为大家都不会）→ 把错题当提升信号。","kw":["①表现"],"jx":{"po":"设问「（对应\"理论型考点\"）试述自我服务偏差的表现、机制及适应性价值与不良适应，并结合」落在「本章综合」（综合题，跨卡）。答案按 2 层展开：①表现；群体服务偏差引发群体不和 ⑤备考启示。漏一层就丢一档分。","ok":"踩分术语 1 个：「①表现」。先写术语，再展开。","bad":"本题没有同音字坑、也无可混的邻卡：按参考答案原文背，术语写全即可。"},"kp":"sx-2-21","bt":"x"},{"id":"sx-2-22","s":"社心","c":2,"t":"案例","card":0,"kd":"","stem":"某同学一进教室就觉得「所有人都在看我」，演讲时认为「大家都看出我很慌」。指出涉及的两个概念，说明为何属认知偏差而非事实，并给一个能削弱该偏差的做法。 - L1 未达标（<80%）→ 只补错条（回看手册） - L2 未达标（<60%）→ 标红，当晚再复述一遍 - L3 未达标（<70%）→ 标红，周末重做 -","ans":"焦点效应（聚光灯效应）＋透明度错觉。属偏差：他人注意力远低于我们估计、且他人也在关注自己。削弱做法：做行为实验（事后问同学是否注意到）→ 用直接经验校正认知。","kw":["焦点效应","属偏差","削弱做法"],"jx":{"po":"设问「某同       for (var i = 0; i < used.length; i++) {
        var j = s.indexOf(used[i], pos);

  /* ---------------- 视图：章节 ---------------- */
  function chaptersHTML() {

  /* ---------------- 视图：答题 ---------------- */

    }
    var body;

      body = '<div class="options">' + ['A', 'B', 'C', 'D'].filter(function (k) { return q.opts[k]; }).map(function (k) {
        var cls = 'option';
        if (p.revealed) {
          var key = String(q.key || '');
          if (key.indexOf(k) >= 0) cls += ' is-correct';
          else if (p.sel.indexOf(k) >= 0) cls += ' is-wrong';
          else cls += ' is-dim';
        } else if (p.sel.indexOf(k) >= 0) cls += ' is-selected';
        var flag = '';
        if (p.revealed) {
          if (String(q.key || '').indexOf(k) >= 0) flag = '<span class="option-flag">正确</span>';

        }
        return '<button class="' + cls + '" data-act="pick" data-arg="' + k + '"' + (p.revealed ? ' aria-disabled="true"' : '') + '>' +
          '<span class="option-key">' + k + '</span><span class="option-text">' + esc(q.opts[k]) + '</span>' + flag + '</button>';
      }).join('') + '</div>';
    } else {
      var ph = isBlank
        ? ('按顺序写这 ' + q.nq + ' 个术语' + (q.nq > 1 ? '：空1、空2。' : '。'))
        : (q.qt === 'jie' ? '定义 + 出处（一句话即可）'
          : q.qt === 'lun' ? '框架 → 展开 → 一个例子 → 评价'
          : '分条写要点：1. … 2. …');
      var hint = isBlank
        ? '提交后逐空核对：<b>按顺序精确匹配</b>，全对＝答对；倒序、一个词顶两个空都不算对。'
        : (q.qt === 'jie'
          ? '名词解释判分口径：<b>定义准确</b>＋<b>能说出出处</b>即可，不要求展开。揭晓后会标出踩分关键词。'
          : q.qt === 'lun'
            ? '论述判分口径：<b>框架完整</b> → <b>要点展开</b> → <b>至少一例</b>。揭晓后会标出踩分关键词。'
            : '简答判分口径：<b>要点齐全</b>即可，分条写不加分也不扣分。揭晓后会标出踩分关键词。');
      body = '<div class="recall"><label>' + (isBlank ? '按顺序填这 ' + q.nq + ' 个术语' : '先默写，再揭晓') +
        ' <span>' + (p.text ? p.text.length + ' 字' : (isBlank ? '必填' : '可留空')) + '</span></label>' +
        '<textarea id="recallText" placeholder="' + ph + '"' +
        (p.restored ? ' readonly' : '') + '>' + esc(p.text) + '</textarea>' +
        '<p class="recall-hint">' + hint + '</p></div>';

    var result = p.revealed ? resultHTML(q, p) : '';
    return '<header class="quiz-head"><div class="quiz-head-in shell">' +
      '<button class="icon-btn" data-act="exit" aria-label="退出">' + icon('i-back') + '</button>' +
      '<div class="quiz-head-title"><b>' + esc(S.session.title) + '</b><span>第 ' + (i + 1) + '/' + n + ' 题</span></div>' +
      '<button class="icon-btn" data-act="sheet" data-arg="cards" aria-label="题卡">' + icon('i-grid') + '</button>' +
      '</div><div class="progress-track"><i style="width:' + prog + '%"></i></div></header>' +
      '<main class="quiz-wrap shell">' + meta + stem + extraQ + body + result + '</main>';
