型是什么？」落在「次要卡」卡 57。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-25","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-26","s":"普心","c":3,"t":"填空","card":58,"kd":"次要卡","stem":"什么是催眠？哪些人容易被催眠？","ans":"催眠是人为诱导产生的特殊意识状态，注意范围缩小，暗示性增强。催眠术兴起于18世纪奥地利医生麦斯麦。容易被催眠者的特征包括想象力丰富、注意容易集中、对催眠功能深信不疑等。","kw":["催眠是人为诱导产生的特殊意识状态"],"jx":{"po":"设问「什么是催眠？哪些人容易被催眠？」落在「次要卡」卡 58。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-27","s":"普心","c":3,"t":"填空","card":59,"kd":"次要卡","stem":"催眠有哪些功能？","ans":"催眠的功能包括减轻疼痛、治疗成瘾等。","kw":["包括减轻疼痛"],"jx":{"po":"设问「催眠有哪些功能？」落在「次要卡」卡 59。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-28","s":"普心","c":3,"t":"填空","card":60,"kd":"次要卡","stem":"失眠的原因和对策是什么？","ans":"失眠是入睡困难、睡眠不好的现象；原因包括压力和精神失调；对策有分析原因、药物治疗和非药物治疗。","kw":["原因包括压力和精神失调"],"jx":{"po":"设问「失眠的原因和对策是什么？」落在「次要卡」卡 60。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-29","s":"普心","c":3,"t":"填空","card":61,"kd":"次要卡","stem":"睡眠有哪些功能？","ans":"睡眠的功能包括功能恢复、自我保护、促进发育、巩固记忆和激发创造性思维。","kw":["包括功能恢复","巩固记忆和激发创造性思维"],"jx":{"po":"设问「睡眠有哪些功能？」落在「次要卡」卡 61。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-29","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-30","s":"普心","c":3,"t":"填空","card":62,"kd":"次要卡","stem":"生物节律的生理基础是什么？","ans":"视交叉上核位于下丘脑，与松果体活动有关；松果体分泌褪黑素，起镇静作用，促进睡眠。","kw":["与松果体活动有关","松果体分泌褪黑素"],"jx":{"po":"设问「生物节律的生理基础是什么？」落在「次要卡」卡 62。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『视交叉上核』别写成「视交叉上和」（考试写括号外的正确术语）。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-30","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L33","s":"普心","c":3,"t":"简答","card":33,"kd":"考点十二 注意的认知理论","stem":"布罗德本特的过滤器理论是什么？","ans":"基于双耳分听实验提出，认为神经系统加工信息容量有限，注意就像过滤器，按全或无的方式工作，只有部分信息能通过进入高级加工。","kw":["基于双耳分听实验提出"],"jx":{"po":"设问「布罗德本特的过滤器理论是什么？」落在「考点十二 注意的认知理论」卡 33。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「基于双耳分听实验提出」。先写术语，再展开。","bad":"同考点还有卡 34「特雷斯曼的衰减理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L34","s":"普心","c":3,"t":"简答","card":34,"kd":"考点十二 注意的认知理论","stem":"特雷斯曼的衰减理论是什么？","ans":"认为过滤器按衰减方式工作，未被注意的信息只是强度减弱而非完全消失；对人有重要意义的信息激活阈限低，容易被激活，能解释鸡尾酒会效应。","kw":["认为过滤器按衰减方式工作"],"jx":{"po":"设问「特雷斯曼的衰减理论是什么？」落在「考点十二 注意的认知理论」卡 34。答案按 2 层展开：认为过滤器按衰减方式工作；对人有重要意义的信息激活阈限低。漏一层就丢一档分。","ok":"踩分术语 1 个：「认为过滤器按衰减方式工作」。先写术语，再展开。","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L35","s":"普心","c":3,"t":"简答","card":35,"kd":"考点十二 注意的认知理论","stem":"后期选择理论是什么？能解释什么现象？","ans":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在知觉分析之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","kw":["由多伊奇夫妇提出"],"jx":{"po":"设问「后期选择理论是什么？能解释什么现象？」落在「考点十二 注意的认知理论」卡 35。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「由多伊奇夫妇提出」。先写术语，再展开。","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-3","alt":1,"bt":"b","bp":"ans","bq":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在______之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","bl":["知觉分析"],"bpos":[40],"bsrc":"后期选择理论由多伊奇夫妇提出，诺曼完善，认为所有信息都得到了充分加工，选择发生在知觉分析之后的反应阶段，只有相关刺激才会被选择性输出，能解释Stroop效应。","nq":1},{"id":"px-3-L36","s":"普心","c":3,"t":"简答","card":36,"kd":"考点十二 注意的认知理论","stem":"多阶段选择理论是什么？","ans":"多阶段选择理论由约翰斯顿和海因兹提出，认为注意的选择过程可发生在不同加工阶段，个体可根据任务需要主动控制早期或晚期选择。","kw":["由约翰斯顿和海因兹提出"],"jx":{"po":"设问「多阶段选择理论是什么？」落在「考点十二 注意的认知理论」卡 36。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「由约翰斯顿和海因兹提出」。先写术语，再展开。","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L37","s":"普心","c":3,"t":"简答","card":37,"kd":"考点十二 注意的认知理论","stem":"注意分配的两个理论分别是什么？","ans":"认知资源理论：由卡尼曼提出，把注意看作有限的认知资源，不同任务对资源需求不同，任务越复杂占用资源越多，可用总资源受个体唤醒水平调节。双加工理论：由谢夫林提出，分自动化加工和受意识控制的加工；自动化加工快速平行、不消耗资源，意识加工按顺序进行且消耗资源，大量练习后意识加工可以转变为自动化加工。","kw":["认知资源理论","双加工理论","自动化加工快速平行"],"jx":{"po":"设问「注意分配的两个理论分别是什么？」落在「考点十二 注意的认知理论」卡 37。答案按 2 层展开：认知资源理论；自动化加工快速平行。漏一层就丢一档分。","ok":"踩分术语 3 个：「认知资源理论」、「双加工理论」、「自动化加工快速平行」。先写术语，再展开。","bad":"同考点还有卡 33「布罗德本特的过滤器理论是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L38","s":"普心","c":3,"t":"简答","card":38,"kd":"考点十 注意的分类","stem":"什么是外源性注意（不随意注意）？影响因素有哪些？","ans":"外源性注意也叫不随意注意，由外部刺激引起，是被动、不费心神的注意，与自下而上加工有关。影响因素包括刺激物的特点如强度、新异性、运动变化等，也包括人的主观因素如需要、兴趣等。","kw":["外源性注意也叫不随意注意"],"jx":{"po":"设问「什么是外源性注意（不随意注意）？影响因素有哪些？」落在「考点十 注意的分类」卡 38。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「外源性注意也叫不随意注意」。先写术语，再展开。","bad":"同音字坑：『新异性』别写成「心意性」（考试写括号外的正确术语）。 同考点还有卡 39「什么是内源性注意（随意注意）？什么是随意」，两卡常被混问，注意别串。"},"kp":"px-3-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L40","s":"普心","c":3,"t":"简答","card":40,"kd":"考点十 注意的分类","stem":"按信息加工中的功能分，注意分为哪三种？","ans":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和划消测验验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","kw":["选择性注意","持续性注意","分配性注意"],"jx":{"po":"设问「按信息加工中的功能分，注意分为哪三种？」落在「考点十 注意的分类」卡 40。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「选择性注意」、「持续性注意」、「分配性注意」。先写术语，再展开。","bad":"同音字坑：『启动和注意瞬脱』别写成「注意顺托」（考试写括号外的正确术语）。 同考点还有卡 38「什么是外源性注意（不随意注意）？影响因素」，两卡常被混问，注意别串。"},"kp":"px-3-8","alt":1,"bt":"b","bp":"ans","bq":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和______验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","bl":["划消测验"],"bpos":[78],"bsrc":"选择性注意：从多种刺激中选择一种进行加工、忽略其他，常用双耳分听实验研究，相关现象有负启动和注意瞬脱。持续性注意：注意在一定时间内保持稳定，可通过警戒作业和划消测验验证，注意起伏和注意分散是相关现象。分配性注意：同时注意两种以上刺激，可通过双作业操作研究，受活动性质、复杂度、熟悉度和自动化程度影响。","nq":1},{"id":"px-3-L42","s":"普心","c":3,"t":"简答","card":42,"kd":"考点九 注意","stem":"注意的定义是什么？","ans":"注意是心理活动指向和聚焦于特定对象、同时忽略其他事物的心理现象。从信息加工角度看，注意是个体主动选择和处理特定信息、忽略无关信息的过程。注意不是独立的心理过程，而是一种认知性的心理倾向。","kw":["注意","从信息加工角度看，注意","注意不"],"jx":{"po":"设问「注意的定义是什么？」落在「考点九 注意」卡 42。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「注意」、「从信息加工角度看，注意」、「注意不」。先写术语，再展开。","bad":"同考点还有卡 43「注意有哪两个性质？哪三个功能？」，两卡常被混问，注意别串。"},"kp":"px-3-10","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-3-L43","s":"普心","c":3,"t":"简答","card":43,"kd":"考点九 注意","stem":"注意有哪两个性质？哪三个功能？","ans":"两个性质：指向性和集中性。三个功能：选择功能（选取有意义刺激、避开无关刺激）；维持功能（使心理活动保持在特定对象上）；整合功能（对个别特征进行精细加工整合为完整物体）。","kw":["两个性质","三个功能","维持功能","整合功能"],"jx":{"po":"设问「注意有哪两个性质？哪三个功能？」落在「考点九 注意」卡 43。答案按 3 层展开：两个性质；维持功能；整合功能。漏一层就丢一档分。","ok":"踩分术语 4 个：「两个性质」、「三个功能」、「维持功能」、「整合功能」。先写术语，再展开。","bad":"同考点还有卡 42「注意的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L45","s":"普心","c":3,"t":"简答","card":45,"kd":"考点六 催眠","stem":"解释催眠的两种理论分别是什么？","ans":"特殊状态理论：谢尔加德的意识分离理论认为，催眠状态下意识功能分离为两个层面，一个层面接受暗示，另一个层面即隐藏的观察者知道真实情况。非特殊状态理论：斯帕诺斯的角色扮演理论认为，被催眠者只是在扮演一种特殊的社会角色。","kw":["特殊状态理论","非特殊状态理论"],"jx":{"po":"设问「解释催眠的两种理论分别是什么？」落在「考点六 催眠」卡 45。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「特殊状态理论」、「非特殊状态理论」。先写术语，再展开。","bad":"同音字坑：『谢尔加德』别写成「」（考试写括号外的正确术语）。"},"kp":"px-3-13","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L48","s":"普心","c":3,"t":"简答","card":48,"kd":"考点三 睡眠","stem":"非快速眼动睡眠分为哪四个阶段？","ans":"第一阶段是浅睡，持续约十分钟，容易被惊醒，脑电为混合的低频低幅波；第二阶段出现睡眠锭，个体较难被唤醒，可缓解疲劳；第三阶段和第四阶段是深度睡眠，也叫慢波睡眠，脑电几乎完全为低频高幅的δ波，个体很难被唤醒，有时发生梦游、梦呓、尿床等。前四个阶段约九十分钟完成，之后由深入浅进入快速眼动睡眠。","kw":["第一阶段","第二阶段出现睡眠锭","第三阶段和第四阶段","前四个阶段约九十分钟完成"],"jx":{"po":"设问「非快速眼动睡眠分为哪四个阶段？」落在「考点三 睡眠」卡 48。答案按 3 层展开：第一阶段是浅睡；第二阶段出现睡眠锭；第三阶段和第四阶段是深度睡眠。漏一层就丢一档分。","ok":"踩分术语 4 个：「第一阶段」、「第二阶段出现睡眠锭」、「第三阶段和第四阶段」、「前四个阶段约九十分钟完成」。先写术语，再展开。","bad":"同音字坑：『阶段出现睡眠锭』别写成「睡眠定」（考试写括号外的正确术语）。 同考点还有卡 47「三种脑电波分别对应什么状态？」，两卡常被混问，注意别串。"},"kp":"px-3-16","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L49","s":"普心","c":3,"t":"简答","card":49,"kd":"考点三 睡眠","stem":"快速眼动睡眠（REM）有什么特点？","ans":"通常伴随梦境出现，眼球快速运动，心率血压不规则，呼吸急促，但肌肉松软；脑电活动与清醒时相似，呈高频低幅。REM在睡眠后期持续时间越来越长，第一次约五到十分钟，最后一次可长达一小时；随年龄增长REM时间逐渐缩短；若剥夺REM睡眠后让人重新入睡，REM通常会反弹增加。","kw":["通常伴随梦境出现","脑电活动与清醒时相似","随年龄增长REM时间逐渐缩短"],"jx":{"po":"设问「快速眼动睡眠（REM）有什么特点？」落在「考点三 睡眠」卡 49。答案按 4 层展开：通常伴随梦境出现；脑电活动与清醒时相似；随年龄增长REM时间逐渐缩短；若剥夺REM睡眠后让人重新入睡。漏一层就丢一档分。","ok":"踩分术语 3 个：「通常伴随梦境出现」、「脑电活动与清醒时相似」、「随年龄增长REM时间逐渐缩短」。先写术语，再展开。","bad":"同考点还有卡 47「三种脑电波分别对应什么状态？」，两卡常被混问，注意别串。"},"kp":"px-3-17","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L50","s":"普心","c":3,"t":"简答","card":50,"kd":"考点一 意识概述","stem":"意识的定义是什么？有哪两个性质？","ans":"意识是我们对自身和外界环境事件的主观觉知，是一种高级心理功能，负责统合、管理和调控个体身心系统。两个性质：一是局限性，同一时间内可以进入意识的信息量有限；二是能动性，人可以有限度地超越外部信息内容，建构自己的意识。","kw":["意识","两个性质：一","二是能动性"],"jx":{"po":"设问「意识的定义是什么？有哪两个性质？」落在「考点一 意识概述」卡 50。答案按 2 层展开：意识是我们对自身和外界环境事件的主观觉知；二是能动性。漏一层就丢一档分。","ok":"踩分术语 3 个：「意识」、「两个性质：一」、「二是能动性」。先写术语，再展开。","bad":"同考点还有卡 51「意识的四大功能是什么？」，两卡常被混问，注意别串。"},"kp":"px-3-18","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-3-L51","s":"普心","c":3,"t":"简答","card":51,"kd":"考点一 意识概述","stem":"意识的四大功能是什么？","ans":"觉知（了解客观事物和自身的存在）；计划（心理和行为有目的性）；选择（接受有效刺激，过滤无关信息）；监控（监视和调节自身状态）。","kw":["觉知","计划","选择","监控"],"jx":{"po":"设问「意识的四大功能是什么？」落在「考点一 意识概述」卡 51。答案按 4 层展开：觉知；计划；选择；监控。漏一层就丢一档分。","ok":"按整段原文作答；参考答案里的标红即踩分处。","bad":"同考点还有卡 50「意识的定义是什么？有哪两个性质？」，两卡常被混问，注意别串。"},"kp":"px-3-19","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L52","s":"普心","c":3,"t":"简答","card":52,"kd":"考点一 意识概述","stem":"意识的两种理论分别是什么？有什么区别？","ans":"全局工作空间理论由巴尔斯提出，也叫剧场模型，强调意识是一个容量有限的全局工作空间，可以统合和连接各种认知过程。整合信息理论由托诺尼提出，认为意识经验来自大脑处理信息时产生的整合信息，具有高度整合性和高度分化性两个特征。区别：全局工作空间理论把意识比作剧场中的舞台，而整合信息理论认为意识产生于整个神经结构网络。","kw":["全局工作空间理论由巴尔斯提出","整合信息理论由托诺尼提出","区别"],"jx":{"po":"设问「意识的两种理论分别是什么？有什么区别？」落在「考点一 意识概述」卡 52。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「全局工作空间理论由巴尔斯提出」、「整合信息理论由托诺尼提出」、「区别」。先写术语，再展开。","bad":"同音字坑：『也叫剧场模型』别写成「聚院模型」（考试写括号外的正确术语）。 同考点还有卡 50「意识的定义是什么？有哪两个性质？」，两卡常被混问，注意别串。"},"kp":"px-3-20","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L55","s":"普心","c":3,"t":"简答","card":55,"kd":"次要卡","stem":"注意的三个脑机制层次分别是什么？","ans":"脑干网状结构维持大脑一般性活动水平，保证大脑有效加工信号；边缘系统的前扣带回广泛参与注意认知活动，负责监控行为错误或冲突；大脑皮层是产生注意的最高级部位，主动调节行动和对信息进行选择。","kw":["大脑皮层"],"jx":{"po":"设问「注意的三个脑机制层次分别是什么？」落在「次要卡」卡 55。答案按 3 层展开：脑干网状结构维持大脑一般性活动水平；边缘系统的前扣带回广泛参与注意认知活动；大脑皮层是产生注意的最高级部位。漏一层就丢一档分。","ok":"踩分术语 1 个：「大脑皮层」。先写术语，再展开。","bad":"同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-23","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L57","s":"普心","c":3,"t":"简答","card":57,"kd":"次要卡","stem":"冥想的概念和类型是什么？","ans":"冥想是通过身心调节提升自我觉察能力的方式，分专注式冥想和开放监控式冥想。正念冥想强调对当下体验的非评判性接受，其作用包括缓解疼痛、降低抑郁复发率、提升幸福感等。","kw":["冥想"],"jx":{"po":"设问「冥想的概念和类型是什么？」落在「次要卡」卡 57。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「冥想」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-25","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L59","s":"普心","c":3,"t":"简答","card":59,"kd":"次要卡","stem":"催眠有哪些功能？","ans":"催眠的功能包括减轻疼痛、治疗成瘾等。","kw":["包括减轻疼痛"],"jx":{"po":"设问「催眠有哪些功能？」落在「次要卡」卡 59。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「包括减轻疼痛」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-27","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L60","s":"普心","c":3,"t":"简答","card":60,"kd":"次要卡","stem":"失眠的原因和对策是什么？","ans":"失眠是入睡困难、睡眠不好的现象；原因包括压力和精神失调；对策有分析原因、药物治疗和非药物治疗。","kw":["失眠","原因包括压力和精神失调","对策有分析原因"],"jx":{"po":"设问「失眠的原因和对策是什么？」落在「次要卡」卡 60。答案按 3 层展开：失眠是入睡困难；原因包括压力和精神失调；对策有分析原因。漏一层就丢一档分。","ok":"踩分术语 3 个：「失眠」、「原因包括压力和精神失调」、「对策有分析原因」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-28","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-3-L61","s":"普心","c":3,"t":"简答","card":61,"kd":"次要卡","stem":"睡眠有哪些功能？","ans":"睡眠的功能包括功能恢复、自我保护、促进发育、巩固记忆和激发创造性思维。","kw":["包括功能恢复"],"jx":{"po":"设问「睡眠有哪些功能？」落在「次要卡」卡 61。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「包括功能恢复」。先写术语，再展开。","bad":"同考点还有卡 54「第三章十二个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-3-29","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-1","s":"普心","c":4,"t":"填空","card":63,"kd":"考点九 躯体感觉","stem":"动觉与平衡觉分别是什么？","ans":"动觉也叫运动感觉，反映身体各部分的位置和运动，是随意运动的重要基础。平衡觉也叫静觉，由人体运动引起，感受器在内耳的前庭器官，包括反映旋转运动的半规管和反映直线加速的前庭。","kw":["动觉也叫运动感觉","反映身体各部分的位置和运动"],"jx":{"po":"设问「动觉与平衡觉分别是什么？」落在「考点九 躯体感觉」卡 63。本题为问答型：不设空，按关键词自评。","ok":"","bad":""},"kp":"px-4-1","bt":"b","bp":"ans","bq":"动觉也叫运动感觉，反映身体各部分的位置和运动，是随意运动的重要基础。平衡觉也叫静觉，由人体运动引起，感受器在内耳的______，包括反映旋转运动的______和反映直线加速的前庭。","bl":["前庭器官","半规管"],"bpos":[57,71],"bsrc":"动觉也叫运动感觉，反映身体各部分的位置和运动，是随意运动的重要基础。平衡觉也叫静觉，由人体运动引起，感受器在内耳的前庭器官，包括反映旋转运动的半规管和反映直线加速的前庭。","nq":2},{"id":"px-4-2","s":"普心","c":4,"t":"填空","card":64,"kd":"考点七 听觉的基本现象","stem":"解释音高的三种理论分别是什么？","ans":"位置理论（包括赫尔姆霍茨的共鸣理论和冯·贝凯西的行波理论，认为基底膜不同部位对不同频率声音起反应）；频率理论（拉瑟福德提出，认为基底膜按相同频率运动）；神经齐射理论（高频时多个毛细胞联合活动）","kw":["位置理论（包括赫尔姆霍茨的共鸣理论和冯·贝凯西的行波理论","认为基底膜不同部位对不同频率声音起反应"],"jx":{"po":"设问「解释音高的三种理论分别是什么？」落在「考点七 听觉的基本现象」卡 64。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『位置理论』别写成「冯贝克西」（考试写括号外的正确术语）。 同考点还有卡 65「音高理论的记忆规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-3","s":"普心","c":4,"t":"填空","card":65,"kd":"考点七 听觉的基本现象","stem":"音高理论的记忆规律是什么？","ans":"低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起作用；高于5000Hz用位置理论。","kw":["1000到5000Hz位置理论和神经齐射理论都起作用"],"jx":{"po":"设问「音高理论的记忆规律是什么？」落在「考点七 听觉的基本现象」卡 65。本题为术语挖空：只填术语，不要求整段默写。","ok":"","bad":"同考点还有卡 64「解释音高的三种理论分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-3","bt":"b","bp":"ans","bq":"低于1000Hz用频率理论；1000到5000Hz位置理论和______都起作用；高于5000Hz用位置理论。","bl":["神经齐射理论"],"bpos":[30],"bsrc":"低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起作用；高于5000Hz用位置理论。","nq":1},{"id":"px-4-4","s":"普心","c":4,"t":"填空","card":66,"kd":"考点六 听觉概述","stem":"听觉的适宜刺激和频率范围是什么？","ans":"听觉的适宜刺激是声波；人耳能接受的频率范围是20～20000赫兹，最敏感区域1000到4000赫兹；声音按波形分乐音和噪声。","kw":["听觉的适宜刺激是声波"],"jx":{"po":"设问「听觉的适宜刺激和频率范围是什么？」落在「考点六 听觉概述」卡 66。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『20000赫兹』别写成「口误说「20到2000赫兹」，两轮复听均如此，考试按教材写20000」（考试写括号外的正确术语）。 同考点还有卡 67「耳的构造与声音传导通路是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-5","s":"普心","c":4,"t":"填空","card":67,"kd":"考点六 听觉概述","stem":"耳的构造与声音传导通路是什么？","ans":"听觉器官是耳，分外耳、中耳、内耳。外耳收集声音；中耳有鼓膜和听小骨传导声音；内耳的耳蜗含有科蒂氏器和毛细胞，这是听觉的感受器；声音传导到大脑颞叶听觉皮层。","kw":["中耳有鼓膜和听小骨传导声音","这是听觉的感受器；声音传导到大脑颞叶听觉皮层"],"jx":{"po":"设问「耳的构造与声音传导通路是什么？」落在「考点六 听觉概述」卡 67。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『有鼓膜和听小骨』别写成「听小鼓」（考试写括号外的正确术语）。 同考点还有卡 66「听觉的适宜刺激和频率范围是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-5","bt":"b","bp":"ans","bq":"听觉器官是耳，分外耳、中耳、内耳。外耳收集声音；中耳有鼓膜和听小骨传导声音；内耳的耳蜗含有科蒂氏器和______，这是听觉的感受器；声音传导到大脑颞叶听觉皮层。","bl":["毛细胞"],"bpos":[50],"bsrc":"听觉器官是耳，分外耳、中耳、内耳。外耳收集声音；中耳有鼓膜和听小骨传导声音；内耳的耳蜗含有科蒂氏器和毛细胞，这是听觉的感受器；声音传导到大脑颞叶听觉皮层。","nq":1},{"id":"px-4-6","s":"普心","c":4,"t":"填空","card":68,"kd":"考点五 视觉中的空间和时间因素","stem":"什么是马赫带现象？","ans":"在明暗变化的边界上，亮区看到更亮的光带，暗区看到更暗的线条，这是侧抑制的结果","kw":["在明暗变化的边界上"],"jx":{"po":"设问「什么是马赫带现象？」落在「考点五 视觉中的空间和时间因素」卡 68。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『这是侧抑制』别写成「测抑制」（考试写括号外的正确术语）。 同考点还有卡 69「暗适应与明适应分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-6","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-7","s":"普心","c":4,"t":"填空","card":69,"kd":"考点五 视觉中的空间和时间因素","stem":"暗适应与明适应分别是什么？","ans":"暗适应是照明停止时视觉感受性提高，持续30到40分钟，早期由视杆和视锥共同完成，之后只有视杆起作用；明适应是照明开始时感受性下降，大概5分钟完成。","kw":["暗适应是照明停止时视觉感受性提高"],"jx":{"po":"设问「暗适应与明适应分别是什么？」落在「考点五 视觉中的空间和时间因素」卡 69。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『早期由视杆』别写成「视感」（考试写括号外的正确术语）。 同考点还有卡 68「什么是马赫带现象？」，两卡常被混问，注意别串。"},"kp":"px-4-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-8","s":"普心","c":4,"t":"填空","card":70,"kd":"考点五 视觉中的空间和时间因素","stem":"后像与闪光融合分别是什么？","ans":"后像分正后像和负后像；还有闪光融合现象，闪光融合临界频率是刚刚引起融合感觉的最小频率。","kw":[" 还有闪光融合现象"],"jx":{"po":"设问「后像与闪光融合分别是什么？」落在「考点五 视觉中的空间和时间因素」卡 70。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『后像』别写成「后相」（考试写括号外的正确术语）。 同考点还有卡 68「什么是马赫带现象？」，两卡常被混问，注意别串。"},"kp":"px-4-8","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-9","s":"普心","c":4,"t":"填空","card":71,"kd":"考点四 视觉的基本现象","stem":"什么是明度？什么是普肯耶现象？","ans":"明度是眼睛对明暗程度的感觉。普肯耶现象：当从昼视觉向夜视觉转变时，人眼对光谱最大感受性向短波方向移动，所以夜幕降临时蓝花比红花更亮。","kw":["明度是眼睛对明暗程度的感觉","当从昼视觉向夜视觉转变时"],"jx":{"po":"设问「什么是明度？什么是普肯耶现象？」落在「考点四 视觉的基本现象」卡 71。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 72「颜色有哪三个基本特性？」，两卡常被混问，注意别串。"},"kp":"px-4-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-10","s":"普心","c":4,"t":"填空","card":72,"kd":"考点四 视觉的基本现象","stem":"颜色有哪三个基本特性？","ans":"颜色是光波作用于人眼产生的视觉经验，有三个基本特性：色调取决于波长；明度取决于照明强度和反射系数；饱和度指颜色的纯杂程度。","kw":["颜色是光波作用于人眼产生的视觉经验"],"jx":{"po":"设问「颜色有哪三个基本特性？」落在「考点四 视觉的基本现象」卡 72。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 71「什么是明度？什么是普肯耶现象？」，两卡常被混问，注意别串。"},"kp":"px-4-10","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-11","s":"普心","c":4,"t":"填空","card":73,"kd":"考点四 视觉的基本现象","stem":"三种色觉理论分别是什么？","ans":"三色说（托马斯·杨和赫尔姆霍茨提出，认为视网膜有三种视锥细胞分别感知红绿蓝，但无法解释红绿色盲）；对立过程理论（黑林提出，假定视网膜存在红绿、黄蓝、白黑三对对立的颜色过程，可以解释负后像和颜色互补）；两阶段理论（认为颜色加工在感受阶段符合三色说、在传导阶段符合对立过程理论，把两者统一起来）。","kw":["三色说（托马斯·杨和赫尔姆霍茨提出","认为视网膜有三种视锥细胞分别感知红绿蓝"],"jx":{"po":"设问「三种色觉理论分别是什么？」落在「考点四 视觉的基本现象」卡 73。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『对立过程理论』别写成「黑灵」（考试写括号外的正确术语）。 同考点还有卡 71「什么是明度？什么是普肯耶现象？」，两卡常被混问，注意别串。"},"kp":"px-4-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-12","s":"普心","c":4,"t":"填空","card":74,"kd":"考点三 视觉","stem":"视觉刺激的关键数据有哪些？","ans":"视觉由光刺激产生，人类80%的信息来自视觉；可见光波长在380到780纳米之间；按波长从长到短为红橙黄绿蓝靛紫。","kw":["视觉由光刺激产生","按波长从长到短为红橙黄绿蓝靛紫"],"jx":{"po":"设问「视觉刺激的关键数据有哪些？」落在「考点三 视觉」卡 74。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『红橙黄绿蓝靛紫』别写成「蓝电子」（考试写括号外的正确术语）。 同考点还有卡 75「视觉的生理机制包括哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-13","s":"普心","c":4,"t":"填空","card":75,"kd":"考点三 视觉","stem":"视觉的生理机制包括哪些？","ans":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，视锥细胞分布在中央窝，昼视感受细节和颜色，视杆细胞分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","kw":["传导机制和中枢机制"],"jx":{"po":"设问「视觉的生理机制包括哪些？」落在「考点三 视觉」卡 75。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『昼视』别写成「皱视」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-13","bt":"b","bp":"ans","bq":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，______分布在中央窝，昼视感受细节和颜色，______分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","bl":["视锥细胞","视杆细胞"],"bpos":[51,72],"bsrc":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，视锥细胞分布在中央窝，昼视感受细节和颜色，视杆细胞分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","nq":2},{"id":"px-4-14","s":"普心","c":4,"t":"填空","card":76,"kd":"考点三 视觉","stem":"视觉系统有哪两条神经通路？","ans":"腹侧通路即what通路，负责物体识别；背侧通路即where通路，负责空间位置和运动识别。","kw":["负责物体识别"],"jx":{"po":"设问「视觉系统有哪两条神经通路？」落在「考点三 视觉」卡 76。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『腹侧』别写成「负测」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-15","s":"普心","c":4,"t":"填空","card":77,"kd":"考点二 感觉的测量","stem":"感受性与感觉阈限是什么关系？如何分类？","ans":"感受性是指人对适宜刺激的感觉能力，感觉阈限是能引起感觉的刺激量，两者成反比。分两类：绝对感受性对应绝对感觉阈限，指刚刚能引起感觉的最小刺激量；差别感受性对应差别感觉阈限，即最小可觉差。","kw":["感受性是指人对适宜刺激的感觉能力，感觉阈限是能引起感觉的刺激量"],"jx":{"po":"设问「感受性与感觉阈限是什么关系？如何分类？」落在「考点二 感觉的测量」卡 77。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 78「韦伯定律的内容是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-16","s":"普心","c":4,"t":"填空","card":78,"kd":"考点二 感觉的测量","stem":"韦伯定律的内容是什么？","ans":"差别感觉取决于刺激增量与原刺激量的比值，韦伯分数越低感受性越敏锐，但只适用于中等强度刺激。","kw":["差别感觉取决于刺激增量与原刺激量的比值"],"jx":{"po":"设问「韦伯定律的内容是什么？」落在「考点二 感觉的测量」卡 78。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『韦伯分数』别写成「尾搏分数」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-17","s":"普心","c":4,"t":"填空","card":79,"kd":"考点二 感觉的测量","stem":"费希纳的对数定律与斯蒂文斯的幂定律分别是什么？","ans":"对数定律由费希纳提出，认为刺激强度按几何级数增加时感觉强度按算术级数上升。幂定律由斯蒂文斯用数量估计法提出，心理量与刺激量的幂成正比。","kw":["对数定律由费希纳提出","认为刺激强度按几何级数增加时感觉强度按算术级数上升"],"jx":{"po":"设问「费希纳的对数定律与斯蒂文斯的幂定律分别是什么？」落在「考点二 感觉的测量」卡 79。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『数定律由费希纳』别写成「费西纳」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-18","s":"普心","c":4,"t":"填空","card":80,"kd":"考点二 感觉的测量","stem":"同一感受器内的三种感觉现象是什么？","ans":"感觉适应（刺激持续作用使感受性发生变化）；感觉对比；感觉后效。","kw":["感觉适应（刺激持续作用使感受性发生变化"],"jx":{"po":"设问「同一感受器内的三种感觉现象是什么？」落在「考点二 感觉的测量」卡 80。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『感觉对比』别写成「即时对比」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-19","s":"普心","c":4,"t":"填空","card":81,"kd":"考点一 感觉概述","stem":"感觉的定义是什么？","ans":"感觉是人脑对直接作用于感觉器官的客观事物的个别属性的反应","kw":["感觉"],"jx":{"po":"设问「感觉的定义是什么？」落在「考点一 感觉概述」卡 81。本题为问答型：不设空，按关键词自评。","ok":"踩分术语 1 个：「感觉」。先写术语，再展开。","bad":"同考点还有卡 82「感觉如何分类？近刺激与远刺激是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-19","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-20","s":"普心","c":4,"t":"填空","card":82,"kd":"考点一 感觉概述","stem":"感觉如何分类？近刺激与远刺激是什么？","ans":"感觉按刺激性质和感官性质分外部感觉和内部感觉：外部感觉接受外部刺激，如视觉、听觉；内部感觉也叫机体觉，如动觉、内脏感觉。另外考夫卡将刺激分为近刺激和远刺激：近刺激直接作用于感官且时刻变化，远刺激来自物体本身相对稳定。","kw":["按刺激性质和感官性质分外部感觉和内部感觉"],"jx":{"po":"设问「感觉如何分类？近刺激与远刺激是什么？」落在「考点一 感觉概述」卡 82。本题为术语挖空：只填术语，不要求整段默写。","ok":"","bad":"同音字坑：『感觉也叫机体觉』别写成「肌体觉」（考试写括号外的正确术语）。 同考点还有卡 81「感觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-4-20","bt":"b","bp":"ans","bq":"感觉按刺激性质和感官性质分外部感觉和内部感觉：外部感觉接受外部刺激，如视觉、听觉；内部感觉也叫机体觉，如______、内脏感觉。另外考夫卡将刺激分为近刺激和远刺激：近刺激直接作用于感官且时刻变化，远刺激来自物体本身相对稳定。","bl":["动觉"],"bpos":[52],"bsrc":"感觉按刺激性质和感官性质分外部感觉和内部感觉：外部感觉接受外部刺激，如视觉、听觉；内部感觉也叫机体觉，如动觉、内脏感觉。另外考夫卡将刺激分为近刺激和远刺激：近刺激直接作用于感官且时刻变化，远刺激来自物体本身相对稳定。","nq":1},{"id":"px-4-21","s":"普心","c":4,"t":"填空","card":83,"kd":"考点一 感觉概述","stem":"什么是感觉编码？有哪三种理论？","ans":"感觉编码是指外界能量必须经过感官的换能作用，转化为神经系统能接受的神经冲动。三种理论：缪勒的神经特殊能量学说认为每种感觉神经有其特殊能量；特异化理论认为不同感觉由不同神经元传递；模式理论认为编码由整组神经元的激活模式引起。","kw":["是指外界能量必须经过感官的换能作用","转化为神经系统能接受的神经冲动"],"jx":{"po":"设问「什么是感觉编码？有哪三种理论？」落在「考点一 感觉概述」卡 83。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『经过感官的换能』别写成「幻能」（考试写括号外的正确术语）。 同考点还有卡 81「感觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-4-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-22","s":"普心","c":4,"t":"填空","card":84,"kd":"次要卡","stem":"什么是触压觉？两点辨别阈限指什么？","ans":"触压觉分触觉和压觉，面部对压力最敏感。两点辨别阈限是指能分辨皮肤上两个点的最小距离，手指阈限最低。","kw":["触压觉分触觉和压觉","面部对压力最敏感"],"jx":{"po":"设问「什么是触压觉？两点辨别阈限指什么？」落在「次要卡」卡 84。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『两点辨别阈限』别写成「御线」（考试写括号外的正确术语）。 同考点还有卡 85「温度觉如何产生？感受器分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-22","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-23","s":"普心","c":4,"t":"填空","card":85,"kd":"次要卡","stem":"温度觉如何产生？感受器分别是什么？","ans":"皮肤表面温度叫生理零度，高于它产生温觉，感受器是罗夫尼氏小体；低于它产生冷觉，感受器是克劳斯氏球。","kw":["皮肤表面温度叫生理零度","感受器是罗夫尼氏小体"],"jx":{"po":"设问「温度觉如何产生？感受器分别是什么？」落在「次要卡」卡 85。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-24","s":"普心","c":4,"t":"填空","card":86,"kd":"次要卡","stem":"痛觉有什么特点？","ans":"痛觉由伤害性刺激引起，受心理因素影响，有保护机体的作用。","kw":["由伤害性刺激引起","有保护机体的作用"],"jx":{"po":"设问「痛觉有什么特点？」落在「次要卡」卡 86。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-25","s":"普心","c":4,"t":"填空","card":87,"kd":"次要卡","stem":"什么是内脏感觉？","ans":"又叫黑暗感觉，性质不确定，定位不准确","kw":["又叫黑暗感觉，性质不确定"],"jx":{"po":"设问「什么是内脏感觉？」落在「次要卡」卡 87。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-25","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-26","s":"普心","c":4,"t":"填空","card":88,"kd":"次要卡","stem":"第四章九个考点如何串记？","ans":"","kw":["感觉的定义原句背"],"jx":{"po":"设问「第四章九个考点如何串记？」落在「次要卡」卡 88。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『视锥』别写成「视追」（考试写括号外的正确术语）。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-26","noteCut":8,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-27","s":"普心","c":4,"t":"填空","card":89,"kd":"次要卡","stem":"嗅觉有什么特点？","ans":"嗅觉由有气味的气体物质引起，是人类唯一不通过丘脑而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","kw":["由有气味的气体物质引起","是人类唯一不通过丘脑而直接进入大脑的基本感觉"],"jx":{"po":"设问「嗅觉有什么特点？」落在「次要卡」卡 89。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『唯一不通过丘脑』别写成「秋脑」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-27","bt":"b","bp":"ans","bq":"嗅觉由有气味的气体物质引起，是人类唯一不通过______而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","bl":["丘脑"],"bpos":[22],"bsrc":"嗅觉由有气味的气体物质引起，是人类唯一不通过丘脑而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","nq":1},{"id":"px-4-28","s":"普心","c":4,"t":"填空","card":90,"kd":"次要卡","stem":"味觉的适宜刺激是什么？五种基本味道分别对应舌面什么部位？","ans":"味觉的适宜刺激是溶于水的化学物质，感受器是舌面上的味蕾。五种基本味道：苦（舌根）、酸（舌两侧）、咸（舌中）、甜（舌尖）、鲜。","kw":["味觉的适宜刺激是溶于水的化学物质，感受器是舌面上的味蕾"],"jx":{"po":"设问「味觉的适宜刺激是什么？五种基本味道分别对应舌面什么部位？」落在「次要卡」卡 90。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-28","bt":"b","bp":"ans","bq":"味觉的适宜刺激是溶于水的化学物质，______是舌面上的味蕾。五种基本味道：苦（舌根）、酸（舌两侧）、咸（舌中）、甜（舌尖）、鲜。","bl":["感受器"],"bpos":[17],"bsrc":"味觉的适宜刺激是溶于水的化学物质，感受器是舌面上的味蕾。五种基本味道：苦（舌根）、酸（舌两侧）、咸（舌中）、甜（舌尖）、鲜。","nq":1},{"id":"px-4-29","s":"普心","c":4,"t":"填空","card":91,"kd":"次要卡","stem":"音响、音色和声音掩蔽分别指什么？","ans":"音响也叫响度，由声波振幅决定，人耳听音范围0到130分贝；音色由声波波形决定；声音的掩蔽是指一个声音受其他声音干扰使听觉阈限上升，低频掩蔽音作用更大，掩蔽音强度越高作用越强。","kw":["音响也叫响度","音色由声波波形决定","声音的掩蔽是指一个声音受其他…"],"jx":{"po":"设问「音响、音色和声音掩蔽分别指什么？」落在「次要卡」卡 91。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『人耳听音』别写成「视仪」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-29","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-30","s":"普心","c":4,"t":"填空","card":92,"kd":"次要卡","stem":"什么是信号检测论？","ans":"信号检测论是数学方法，用于区分噪声和信号，能评价感受性和反应标准；被试的反应分为四种：击中、漏报、虚报、正确拒绝。","kw":["用于区分噪声和信号"],"jx":{"po":"设问「什么是信号检测论？」落在「次要卡」卡 92。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『被试』别写成「背诗」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-30","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-31","s":"普心","c":4,"t":"填空","card":93,"kd":"次要卡","stem":"不同感受器之间的相互作用有哪些？","ans":"不同感受器之间的相互作用包括联觉以及感觉的相互补偿","kw":["包括联觉以及感觉的相互补偿"],"jx":{"po":"设问「不同感受器之间的相互作用有哪些？」落在「次要卡」卡 93。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「包括联觉以及感觉的相互补偿」。先写术语，再展开。","bad":"同音字坑：『包括联觉』别写成「连绝，是一种感觉引起另一种感觉」（考试写括号外的正确术语）。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-31","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-32","s":"普心","c":4,"t":"填空","card":94,"kd":"次要卡","stem":"研究感觉有什么意义？","ans":"理论意义：感觉是一切较复杂认识活动的基础。应用价值：感觉是人脑获取信息的唯一途径，提供生存和安全信息。","kw":["感觉是一切较复杂认识活动的基础","感觉是人脑获取信息的唯一途径"],"jx":{"po":"设问「研究感觉有什么意义？」落在「次要卡」卡 94。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-32","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L64","s":"普心","c":4,"t":"简答","card":64,"kd":"考点七 听觉的基本现象","stem":"解释音高的三种理论分别是什么？","ans":"位置理论（包括赫尔姆霍茨的共鸣理论和冯·贝凯西的行波理论，认为基底膜不同部位对不同频率声音起反应）；频率理论（拉瑟福德提出，认为基底膜按相同频率运动）；神经齐射理论（高频时多个毛细胞联合活动）","kw":["位置理论","频率理论"],"jx":{"po":"设问「解释音高的三种理论分别是什么？」落在「考点七 听觉的基本现象」卡 64。答案按 3 层展开：位置理论；频率理论；神经齐射理论高频时多个毛细胞联合活动）。漏一层就丢一档分。","ok":"踩分术语 2 个：「位置理论」、「频率理论」。先写术语，再展开。","bad":"同音字坑：『位置理论』别写成「冯贝克西」（考试写括号外的正确术语）。 同考点还有卡 65「音高理论的记忆规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L65","s":"普心","c":4,"t":"简答","card":65,"kd":"考点七 听觉的基本现象","stem":"音高理论的记忆规律是什么？","ans":"低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起作用；高于5000Hz用位置理论。","kw":["低于1000Hz用频率理论","高于5000Hz用位置理论"],"jx":{"po":"设问「音高理论的记忆规律是什么？」落在「考点七 听觉的基本现象」卡 65。答案按 3 层展开：低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起…；高于5000Hz用位置理论。漏一层就丢一档分。","ok":"踩分术语 2 个：「低于1000Hz用频率理论」、「高于5000Hz用位置理论」。先写术语，再展开。","bad":"同考点还有卡 64「解释音高的三种理论分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-3","alt":1,"bt":"b","bp":"ans","bq":"低于1000Hz用频率理论；1000到5000Hz位置理论和______都起作用；高于5000Hz用位置理论。","bl":["神经齐射理论"],"bpos":[30],"bsrc":"低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起作用；高于5000Hz用位置理论。","nq":1},{"id":"px-4-L73","s":"普心","c":4,"t":"简答","card":73,"kd":"考点四 视觉的基本现象","stem":"三种色觉理论分别是什么？","ans":"三色说（托马斯·杨和赫尔姆霍茨提出，认为视网膜有三种视锥细胞分别感知红绿蓝，但无法解释红绿色盲）；对立过程理论（黑林提出，假定视网膜存在红绿、黄蓝、白黑三对对立的颜色过程，可以解释负后像和颜色互补）；两阶段理论（认为颜色加工在感受阶段符合三色说、在传导阶段符合对立过程理论，把两者统一起来）。","kw":["对立过程理论","两阶段理论"],"jx":{"po":"设问「三种色觉理论分别是什么？」落在「考点四 视觉的基本现象」卡 73。答案按 3 层展开：三色说；对立过程理论；两阶段理论。漏一层就丢一档分。","ok":"踩分术语 2 个：「对立过程理论」、「两阶段理论」。先写术语，再展开。","bad":"同音字坑：『对立过程理论』别写成「黑灵」（考试写括号外的正确术语）。 同考点还有卡 71「什么是明度？什么是普肯耶现象？」，两卡常被混问，注意别串。"},"kp":"px-4-11","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L75","s":"普心","c":4,"t":"简答","card":75,"kd":"考点三 视觉","stem":"视觉的生理机制包括哪些？","ans":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，视锥细胞分布在中央窝，昼视感受细节和颜色，视杆细胞分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","kw":["包括折光机制","折光机制由眼球完成","视网膜上有两种感光细胞"],"jx":{"po":"设问「视觉的生理机制包括哪些？」落在「考点三 视觉」卡 75。答案按 3 层展开：包括折光机制；视网膜上有两种感光细胞；视觉传导经三级神经元到大脑枕叶。漏一层就丢一档分。","ok":"踩分术语 3 个：「包括折光机制」、「折光机制由眼球完成」、「视网膜上有两种感光细胞」。先写术语，再展开。","bad":"同音字坑：『昼视』别写成「皱视」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-13","alt":1,"bt":"b","bp":"ans","bq":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，______分布在中央窝，昼视感受细节和颜色，______分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","bl":["视锥细胞","视杆细胞"],"bpos":[51,72],"bsrc":"视觉的生理机制包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，视锥细胞分布在中央窝，昼视感受细节和颜色，视杆细胞分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","nq":2},{"id":"px-4-L76","s":"普心","c":4,"t":"简答","card":76,"kd":"考点三 视觉","stem":"视觉系统有哪两条神经通路？","ans":"腹侧通路即what通路，负责物体识别；背侧通路即where通路，负责空间位置和运动识别。","kw":["腹侧通路即what通路","背侧通路即where通路"],"jx":{"po":"设问「视觉系统有哪两条神经通路？」落在「考点三 视觉」卡 76。答案按 2 层展开：腹侧通路即what通路；背侧通路即where通路。漏一层就丢一档分。","ok":"踩分术语 2 个：「腹侧通路即what通路」、「背侧通路即where通路」。先写术语，再展开。","bad":"同音字坑：『腹侧』别写成「负测」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L81","s":"普心","c":4,"t":"简答","card":81,"kd":"考点一 感觉概述","stem":"感觉的定义是什么？","ans":"感觉是人脑对直接作用于感觉器官的客观事物的个别属性的反应","kw":["感觉"],"jx":{"po":"设问「感觉的定义是什么？」落在「考点一 感觉概述」卡 81。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「感觉」。先写术语，再展开。","bad":"同考点还有卡 82「感觉如何分类？近刺激与远刺激是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-19","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-4-L83","s":"普心","c":4,"t":"简答","card":83,"kd":"考点一 感觉概述","stem":"什么是感觉编码？有哪三种理论？","ans":"感觉编码是指外界能量必须经过感官的换能作用，转化为神经系统能接受的神经冲动。三种理论：缪勒的神经特殊能量学说认为每种感觉神经有其特殊能量；特异化理论认为不同感觉由不同神经元传递；模式理论认为编码由整组神经元的激活模式引起。","kw":["三种理论"],"jx":{"po":"设问「什么是感觉编码？有哪三种理论？」落在「考点一 感觉概述」卡 83。答案按 3 层展开：是指外界能量必须经过感官的换能作用；特异化理论认为不同感觉由不同神经元传递；模式理论认为编码由整组神经元的激活模式引起。漏一层就丢一档分。","ok":"踩分术语 1 个：「三种理论」。先写术语，再展开。","bad":"同音字坑：『经过感官的换能』别写成「幻能」（考试写括号外的正确术语）。 同考点还有卡 81「感觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-4-21","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L86","s":"普心","c":4,"t":"简答","card":86,"kd":"次要卡","stem":"痛觉有什么特点？","ans":"痛觉由伤害性刺激引起，受心理因素影响，有保护机体的作用。","kw":["由伤害性刺激引起"],"jx":{"po":"设问「痛觉有什么特点？」落在「次要卡」卡 86。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「由伤害性刺激引起」。先写术语，再展开。","bad":"同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-24","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-4-L89","s":"普心","c":4,"t":"简答","card":89,"kd":"次要卡","stem":"嗅觉有什么特点？","ans":"嗅觉由有气味的气体物质引起，是人类唯一不通过丘脑而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","kw":["由有气味的气体物质引起，","感受器"],"jx":{"po":"设问「嗅觉有什么特点？」落在「次要卡」卡 89。答案按 2 层展开：由有气味的气体物质引起；感受器是鼻腔中的嗅细胞。漏一层就丢一档分。","ok":"踩分术语 2 个：「由有气味的气体物质引起，」、「感受器」。先写术语，再展开。","bad":"同音字坑：『唯一不通过丘脑』别写成「秋脑」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-27","alt":1,"bt":"b","bp":"ans","bq":"嗅觉由有气味的气体物质引起，是人类唯一不通过______而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","bl":["丘脑"],"bpos":[22],"bsrc":"嗅觉由有气味的气体物质引起，是人类唯一不通过丘脑而直接进入大脑的基本感觉；感受器是鼻腔中的嗅细胞。","nq":1},{"id":"px-4-L94","s":"普心","c":4,"t":"简答","card":94,"kd":"次要卡","stem":"研究感觉有什么意义？","ans":"理论意义：感觉是一切较复杂认识活动的基础。应用价值：感觉是人脑获取信息的唯一途径，提供生存和安全信息。","kw":["理论意义：感觉","应用价值：感觉"],"jx":{"po":"设问「研究感觉有什么意义？」落在「次要卡」卡 94。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「理论意义：感觉」、「应用价值：感觉」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-32","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-1","s":"普心","c":5,"t":"填空","card":95,"kd":"考点七 运动知觉","stem":"什么是真正运动知觉？","ans":"真正运动知觉是指物体按一定速度从一处向另一处做连续位移，或观察者朝向目标运动，直接依赖运动速度，太慢或太快都不能产生运动知觉；物体运动速度低于下阈限看不到运动，高于上阈限只能看到闪烁。","kw":["是指物体按一定速度从一处向另一处做连续位移"],"jx":{"po":"设问「什么是真正运动知觉？」落在「考点七 运动知觉」卡 95。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『速度低于下阈限』别写成「下预线」（考试写括号外的正确术语）。 同考点还有卡 96「什么是似动？有哪四种形式？」，两卡常被混问，注意别串。"},"kp":"px-5-1","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-5-2","s":"普心","c":5,"t":"填空","card":96,"kd":"考点七 运动知觉","stem":"什么是似动？有哪四种形式？","ans":"似动是指在一定条件下在静止物体间看到运动，或在没有连续位移的地方看到连续运动。四种形式：动景运动（即φ运动，由韦特海默最早发现，是电影和霓虹灯的原理，两个刺激按一定时空间隔相继呈现时看到连续运动）；诱发运动（一个物体的运动使相邻静止物体产生运动印象，比如彩云追月）；自主运动（暗室中注视静止亮点会看到光点动荡）；运动后效（注视运动物体后转向静止物体看到反向运动，也叫瀑布效应）。","kw":["四种形式","诱发运动","自主运动","运动后效"],"jx":{"po":"设问「什么是似动？有哪四种形式？」落在「考点七 运动知觉」卡 96。本题为问答型：不设空，按关键词自评。","ok":"踩分术语 4 个：「四种形式」、「诱发运动」、「自主运动」、「运动后效」。先写术语，再展开。","bad":"同音字坑：『动景运动』别写成「FY运动」（考试写括号外的正确术语）。 同考点还有卡 95「什么是真正运动知觉？」，两卡常被混问，注意别串。"},"kp":"px-5-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-3","s":"普心","c":5,"t":"填空","card":97,"kd":"考点六 时间知觉","stem":"时间知觉分为哪三种类型？","ans":"时序知觉（分辨前后顺序）；时距知觉；时点知觉","kw":["时序知觉","时点知觉"],"jx":{"po":"设问「时间知觉分为哪三种类型？」落在「考点六 时间知觉」卡 97。本题为问答型：不设空，按关键词自评。","ok":"踩分术语 2 个：「时序知觉」、「时点知觉」。先写术语，再展开。","bad":"同音字坑：『时距知觉』别写成「也记作时序知觉，估计持续时间，人对三秒左右的时间估计最准确」（考试写括号外的正确术语）。"},"kp":"px-5-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-4","s":"普心","c":5,"t":"填空","card":98,"kd":"考点五 空间知觉","stem":"格式塔心理学家提出的知觉组织原则有哪些？","ans":"形状知觉是视觉、触觉、动觉协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","kw":["动觉协同活动的结果","格式塔心理学家提出知觉组织原则包括"],"jx":{"po":"设问「格式塔心理学家提出的知觉组织原则有哪些？」落在「考点五 空间知觉」卡 98。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 99「深度知觉的三类线索分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-5-4","bt":"b","bp":"ans","bq":"形状知觉是视觉、触觉、______协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","bl":["动觉"],"bpos":[11],"bsrc":"形状知觉是视觉、触觉、动觉协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","nq":1},{"id":"px-5-5","s":"普心","c":5,"t":"填空","card":99,"kd":"考点五 空间知觉","stem":"深度知觉的三类线索分别是什么？","ans":"肌肉线索包括调节和辐合；单眼线索包括对象遮挡、线条透视、空气透视、相对高度、纹理梯度、运动视差、运动透视、相对大小、明暗阴影；双眼线索即双眼视差，是深度知觉的主要依赖线索，范围可达1300米。其中运动视差和运动透视要区分：运动视差强调方向与速度差异，运动透视强调速度差异。","kw":["肌肉线索包括调节和辐合"],"jx":{"po":"设问「深度知觉的三类线索分别是什么？」落在「考点五 空间知觉」卡 99。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『包括调节和辐合』别写成「符合」（考试写括号外的正确术语）。 同考点还有卡 98「格式塔心理学家提出的知觉组织原则有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-6","s":"普心","c":5,"t":"填空","card":100,"kd":"考点三 知觉的特性","stem":"什么是知觉的选择性？影响因素有哪些？","ans":"人在知觉时总是有选择地把少数事物当作对象，其他事物当作背景。影响因素包括注意和知觉主体。","kw":["人在知觉时总是有选择地把少数事物当作对象"],"jx":{"po":"设问「什么是知觉的选择性？影响因素有哪些？」落在「考点三 知觉的特性」卡 100。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 101「什么是知觉的整体性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-7","s":"普心","c":5,"t":"填空","card":101,"kd":"考点三 知觉的特性","stem":"什么是知觉的整体性？影响因素有哪些？","ans":"整体性也叫组织性，人的知觉系统有把个别属性和部分综合成整体的能力。影响因素包括刺激物的结构和个体的知识经验。内文通过大小字母判断实验发现了整体优先，个体对整体特征比局部特征更敏感。","kw":["整体性也叫组织性","人的知觉系统有把个别属性和部分综合成整体的能力"],"jx":{"po":"设问「什么是知觉的整体性？影响因素有哪些？」落在「考点三 知觉的特性」卡 101。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『内文』别写成「内温」（考试写括号外的正确术语）。 同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-7","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-8","s":"普心","c":5,"t":"填空","card":102,"kd":"考点三 知觉的特性","stem":"什么是知觉的理解性？影响因素有哪些？","ans":"人在知觉过程中以过去的知识经验为依据，对知觉对象做出解释。影响因素包括知识经验、语言指导等。","kw":["人在知觉过程中以过去的知识经验为依据"],"jx":{"po":"设问「什么是知觉的理解性？影响因素有哪些？」落在「考点三 知觉的特性」卡 102。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-9","s":"普心","c":5,"t":"填空","card":103,"kd":"考点三 知觉的特性","stem":"什么是知觉的恒常性？影响因素有哪些？","ans":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、明度和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","kw":["当知觉的客观条件在一定范围内改变时"],"jx":{"po":"设问「什么是知觉的恒常性？影响因素有哪些？」落在「考点三 知觉的特性」卡 103。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-9","noteCut":1,"bt":"b","bp":"ans","bq":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、______和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","bl":["明度"],"bpos":[35],"bsrc":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、明度和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","nq":1},{"id":"px-5-10","s":"普心","c":5,"t":"填空","card":104,"kd":"考点二 知觉的信息加工","stem":"什么是自下而上的加工？","ans":"自下而上的加工也叫数据驱动加工，是对感觉信息的加工，从外部刺激开始逐步形成知觉。","kw":["也叫数据驱动加工","是对感觉信息的加工"],"jx":{"po":"设问「什么是自下而上的加工？」落在「考点二 知觉的信息加工」卡 104。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 105「什么是自上而下的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-10","bt":"b","bp":"ans","bq":"自下而上的加工也叫数据驱动加工，是对______的加工，从外部刺激开始逐步形成知觉。","bl":["感觉信息"],"bpos":[18],"bsrc":"自下而上的加工也叫数据驱动加工，是对感觉信息的加工，从外部刺激开始逐步形成知觉。","nq":1},{"id":"px-5-11","s":"普心","c":5,"t":"填空","card":105,"kd":"考点二 知觉的信息加工","stem":"什么是自上而下的加工？","ans":"自上而下的加工也叫概念驱动加工，是对非感觉信息的加工，由知识、经验引导知觉。","kw":["也叫概念驱动加工","是对非感觉信息的加工"],"jx":{"po":"设问「什么是自上而下的加工？」落在「考点二 知觉的信息加工」卡 105。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 104「什么是自下而上的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-11","bt":"b","bp":"ans","bq":"自上而下的加工也叫概念驱动加工，是对非______的加工，由知识、经验引导知觉。","bl":["感觉信息"],"bpos":[19],"bsrc":"自上而下的加工也叫概念驱动加工，是对非感觉信息的加工，由知识、经验引导知觉。","nq":1},{"id":"px-5-12","s":"普心","c":5,"t":"填空","card":106,"kd":"考点二 知觉的信息加工","stem":"自下而上与自上而下两种加工如何交互？","ans":"通常情况下两种加工交互作用：当过去经验提供的非感觉信息多时，自上而下加工占优势；反之自下而上加工占优势。这两种方式要区分清楚。","kw":["通常情况下两种加工交互作用","当过去经验提供的非感觉信息多时"],"jx":{"po":"设问「自下而上与自上而下两种加工如何交互？」落在「考点二 知觉的信息加工」卡 106。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 104「什么是自下而上的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-12","bt":"b","bp":"ans","bq":"通常情况下两种加工交互作用：当过去经验提供的非______多时，自上而下加工占优势；反之自下而上加工占优势。这两种方式要区分清楚。","bl":["感觉信息"],"bpos":[23],"bsrc":"通常情况下两种加工交互作用：当过去经验提供的非感觉信息多时，自上而下加工占优势；反之自下而上加工占优势。这两种方式要区分清楚。","nq":1},{"id":"px-5-13","s":"普心","c":5,"t":"填空","card":107,"kd":"考点一 知觉概述","stem":"知觉的定义是什么？","ans":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。","kw":["知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识"],"jx":{"po":"设问「知觉的定义是什么？」落在「考点一 知觉概述」卡 107。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 108「感觉与知觉有什么相同点和区别？」，两卡常被混问，注意别串。"},"kp":"px-5-13","bt":"b","bp":"ans","bq":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对______进行解释并赋予其意义的过程。","bl":["感觉信息"],"bpos":[33],"bsrc":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。","nq":1},{"id":"px-5-14","s":"普心","c":5,"t":"填空","card":108,"kd":"考点一 知觉概述","stem":"感觉与知觉有什么相同点和区别？","ans":"相同点：都是对当前直接作用于感官的客观事物的反应。区别：感觉是对个别属性的反应，介于生理和心理之间，不需要或很少需要知识经验；知觉是对整体的反应，是纯粹的心理活动，需要知识经验的参与。感觉是知觉的前提和基础，知觉是感觉的深入和发展。这个关系要理解清楚。","kw":["都是对当前直接作用于感官的客观事物的反应"],"jx":{"po":"设问「感觉与知觉有什么相同点和区别？」落在「考点一 知觉概述」卡 108。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 107「知觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-5-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-15","s":"普心","c":5,"t":"填空","card":109,"kd":"次要卡","stem":"什么是错觉？错觉与幻觉有什么区别？","ans":"错觉是知觉不能正确表达外界事物特性而产生的歪曲。错觉不同于幻觉，是在一定条件下必然产生的正常现象。研究错觉的理论意义是有助于揭示正常知觉规律，实践意义是可以消除不利影响、利用错觉为生活服务。","kw":["错觉是知觉不能正确表达外界事物特性而产生的歪曲"],"jx":{"po":"设问「什么是错觉？错觉与幻觉有什么区别？」落在「次要卡」卡 109。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 110「大小错觉有哪六种？」，两卡常被混问，注意别串。"},"kp":"px-5-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-16","s":"普心","c":5,"t":"填空","card":110,"kd":"次要卡","stem":"大小错觉有哪六种？","ans":"缪勒—莱耶错觉，等长线段两端箭头向外比向内显得长；潘佐错觉（铁轨错觉），两条辐合线中间等长直线上面一条显长；垂直—水平错觉，垂直线比等长水平线显长；贾斯特罗错觉，等长曲线包含在下面的显长；多尔波也夫错觉，等大圆形在小圆包围中显大、在大圆包围中显小；月亮错觉，天边月亮显大、天顶显小。","kw":["等长线段两端箭头向外比向内显得长；潘佐错觉（铁轨错觉"],"jx":{"po":"设问「大小错觉有哪六种？」落在「次要卡」卡 110。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：「缪勒—莱耶错觉」别写成「老师口误」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-17","s":"普心","c":5,"t":"填空","card":111,"kd":"次要卡","stem":"形状和方向错觉、螺旋与运动错觉有哪些？","ans":"形状和方向错觉四种：佐尔拉错觉、冯特错觉、爱因斯坦错觉、波根多夫错觉。螺旋和运动错觉三种：弗雷泽螺旋、运动错觉、明暗错觉。","kw":["形状和方向错觉四种"],"jx":{"po":"设问「形状和方向错觉、螺旋与运动错觉有哪些？」落在「次要卡」卡 111。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『弗雷泽螺旋』别写成「弗雷泽罗旋」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-18","s":"普心","c":5,"t":"填空","card":112,"kd":"次要卡","stem":"解释错觉产生原因的三个方向是什么？","ans":"眼动说解释垂直水平错觉；移情说解释箭形错觉；透视说解释潘佐错觉。产生原因尚无统一解释。","kw":["眼动说解释垂直水平错觉"],"jx":{"po":"设问「解释错觉产生原因的三个方向是什么？」落在「次要卡」卡 112。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『眼动说』别写成「眼洞说」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-19","s":"普心","c":5,"t":"填空","card":113,"kd":"次要卡","stem":"第五章八个考点如何串记？","ans":"","kw":["知觉的定义原句背","感觉与知觉的关系要区分清楚"],"jx":{"po":"设问「第五章八个考点如何串记？」落在「次要卡」卡 113。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『运动和四种似动』别写成「四动」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-19","noteCut":8,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-20","s":"普心","c":5,"t":"填空","card":114,"kd":"次要卡","stem":"时间知觉的影响因素有哪些？","ans":"感觉通道性质影响精确性（听觉优于触觉优于视觉）；从事感兴趣的活动会觉得时间过得快；对时间越注意时间过得越慢；还受年龄和疾病等影响。","kw":["感觉通道性质影响精确性（听觉优于触觉优于视觉"],"jx":{"po":"设问「时间知觉的影响因素有哪些？」落在「次要卡」卡 114。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-21","s":"普心","c":5,"t":"填空","card":115,"kd":"次要卡","stem":"Tau效应与kappa效应分别是什么？","ans":"时间知觉和空间知觉存在交互作用：Tau效应是时间影响空间；kappa效应是空间影响时间。","kw":["时间知觉和空间知觉存在交互作用：Tau效应是时间影响空间"],"jx":{"po":"设问「Tau效应与kappa效应分别是什么？」落在「次要卡」卡 115。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『Tau效应』别写成「陶效应」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-22","s":"普心","c":5,"t":"填空","card":116,"kd":"次要卡","stem":"形状知觉有哪些理论？","ans":"特征分析理论（认为识别始于对原始特征的分析）；特雷斯曼的知觉特征整合理论（强调注意在特征整合中的作用）；成分识别理论（由比德曼提出，认为基于几何元件识别物体）；拓扑知觉理论（由陈霖提出，认为视觉系统对整体拓扑性质更敏感）。","kw":["特征分析理论（认为识别始于对原始特征的分析"],"jx":{"po":"设问「形状知觉有哪些理论？」落在「次要卡」卡 116。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『特雷斯曼』别写成「特瑞斯曼」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-23","s":"普心","c":5,"t":"填空","card":117,"kd":"次要卡","stem":"埃默特定律的内容是什么？","ans":"埃默特定律说明可根据视网膜成像大小与距离推测物体大小，距离不变时假设视像大小与物体大小成正比、与距离成反比。","kw":["埃默特定律说明可根据视网膜成像大小与距离推测物体大小"],"jx":{"po":"设问「埃默特定律的内容是什么？」落在「次要卡」卡 117。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『埃默特』别写成「埃莫特」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-24","s":"普心","c":5,"t":"填空","card":118,"kd":"次要卡","stem":"方位定向（知觉定位）依靠什么线索？","ans":"视觉定位借助参照物和多种感觉联合；听觉定位主要依靠双耳线索：时间差、强度差和相位差。还有一种听觉优势效应，指人听到的第一个声音决定对声音的定位，其他声音会受到抑制。","kw":["视觉定位借助参照物和多种感觉联合；听觉定位主要依靠双耳线索"],"jx":{"po":"设问「方位定向（知觉定位）依靠什么线索？」落在「次要卡」卡 118。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-25","s":"普心","c":5,"t":"填空","card":119,"kd":"次要卡","stem":"知觉有哪三种分类方式？","ans":"按起主导作用的感官分视知觉、听知觉等；按事物特性分空间知觉、时间知觉、运动知觉；按意识参与程度分阈上知觉和阈下知觉。","kw":["按起主导作用的感官分视知觉","按事物特性分空间知觉"],"jx":{"po":"设问「知觉有哪三种分类方式？」落在「次要卡」卡 119。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『知觉和阈下知觉』别写成「遇上知觉和遇下知觉」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-25","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-26","s":"普心","c":5,"t":"填空","card":120,"kd":"次要卡","stem":"知觉的作用包括哪些？","ans":"知觉的作用包括觉察、分辨和确认。","kw":["包括觉察","分辨和确认"],"jx":{"po":"设问「知觉的作用包括哪些？」落在「次要卡」卡 120。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L97","s":"普心","c":5,"t":"简答","card":97,"kd":"考点六 时间知觉","stem":"时间知觉分为哪三种类型？","ans":"时序知觉（分辨前后顺序）；时距知觉；时点知觉","kw":["时序知觉","时点知觉"],"jx":{"po":"设问「时间知觉分为哪三种类型？」落在「考点六 时间知觉」卡 97。答案按 3 层展开：时序知觉；时距知觉；时点知觉。漏一层就丢一档分。","ok":"踩分术语 2 个：「时序知觉」、「时点知觉」。先写术语，再展开。","bad":"同音字坑：『时距知觉』别写成「也记作时序知觉，估计持续时间，人对三秒左右的时间估计最准确」（考试写括号外的正确术语）。"},"kp":"px-5-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L98","s":"普心","c":5,"t":"简答","card":98,"kd":"考点五 空间知觉","stem":"格式塔心理学家提出的知觉组织原则有哪些？","ans":"形状知觉是视觉、触觉、动觉协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","kw":["形状知觉"],"jx":{"po":"设问「格式塔心理学家提出的知觉组织原则有哪些？」落在「考点五 空间知觉」卡 98。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「形状知觉」。先写术语，再展开。","bad":"同考点还有卡 99「深度知觉的三类线索分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-5-4","alt":1,"bt":"b","bp":"ans","bq":"形状知觉是视觉、触觉、______协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","bl":["动觉"],"bpos":[11],"bsrc":"形状知觉是视觉、触觉、动觉协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","nq":1},{"id":"px-5-L100","s":"普心","c":5,"t":"简答","card":100,"kd":"考点三 知觉的特性","stem":"什么是知觉的选择性？影响因素有哪些？","ans":"人在知觉时总是有选择地把少数事物当作对象，其他事物当作背景。影响因素包括注意和知觉主体。","kw":["人在知觉时总","影响因素包括注意和知觉主体"],"jx":{"po":"设问「什么是知觉的选择性？影响因素有哪些？」落在「考点三 知觉的特性」卡 100。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「人在知觉时总」、「影响因素包括注意和知觉主体」。先写术语，再展开。","bad":"同考点还有卡 101「什么是知觉的整体性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L101","s":"普心","c":5,"t":"简答","card":101,"kd":"考点三 知觉的特性","stem":"什么是知觉的整体性？影响因素有哪些？","ans":"整体性也叫组织性，人的知觉系统有把个别属性和部分综合成整体的能力。影响因素包括刺激物的结构和个体的知识经验。内文通过大小字母判断实验发现了整体优先，个体对整体特征比局部特征更敏感。","kw":["整体性也叫组织性"],"jx":{"po":"设问「什么是知觉的整体性？影响因素有哪些？」落在「考点三 知觉的特性」卡 101。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「整体性也叫组织性」。先写术语，再展开。","bad":"同音字坑：『内文』别写成「内温」（考试写括号外的正确术语）。 同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-7","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L102","s":"普心","c":5,"t":"简答","card":102,"kd":"考点三 知觉的特性","stem":"什么是知觉的理解性？影响因素有哪些？","ans":"人在知觉过程中以过去的知识经验为依据，对知觉对象做出解释。影响因素包括知识经验、语言指导等。","kw":["影响因素包括知识经验"],"jx":{"po":"设问「什么是知觉的理解性？影响因素有哪些？」落在「考点三 知觉的特性」卡 102。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「影响因素包括知识经验」。先写术语，再展开。","bad":"同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L103","s":"普心","c":5,"t":"简答","card":103,"kd":"考点三 知觉的特性","stem":"什么是知觉的恒常性？影响因素有哪些？","ans":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、明度和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","kw":["四个特性选择性"],"jx":{"po":"设问「什么是知觉的恒常性？影响因素有哪些？」落在「考点三 知觉的特性」卡 103。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「四个特性选择性」。先写术语，再展开。","bad":"同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-9","alt":1,"noteCut":1,"bt":"b","bp":"ans","bq":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、______和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","bl":["明度"],"bpos":[35],"bsrc":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、明度和颜色知觉中都存在。影响因素包括知识经验和视觉线索。","nq":1},{"id":"px-5-L107","s":"普心","c":5,"t":"简答","card":107,"kd":"考点一 知觉概述","stem":"知觉的定义是什么？","ans":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。","kw":["知觉"],"jx":{"po":"设问「知觉的定义是什么？」落在「考点一 知觉概述」卡 107。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「知觉」。先写术语，再展开。","bad":"同考点还有卡 108「感觉与知觉有什么相同点和区别？」，两卡常被混问，注意别串。"},"kp":"px-5-13","alt":1,"bt":"b","bp":"ans","bq":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对______进行解释并赋予其意义的过程。","bl":["感觉信息"],"bpos":[33],"bsrc":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。","nq":1},{"id":"px-5-L108","s":"普心","c":5,"t":"简答","card":108,"kd":"考点一 知觉概述","stem":"感觉与知觉有什么相同点和区别？","ans":"相同点：都是对当前直接作用于感官的客观事物的反应。区别：感觉是对个别属性的反应，介于生理和心理之间，不需要或很少需要知识经验；知觉是对整体的反应，是纯粹的心理活动，需要知识经验的参与。感觉是知觉的前提和基础，知觉是感觉的深入和发展。这个关系要理解清楚。","kw":["相同点：都","区别：感觉","知觉","感觉","这个关系要理解清楚"],"jx":{"po":"设问「感觉与知觉有什么相同点和区别？」落在「考点一 知觉概述」卡 108。答案按 2 层展开：相同点；知觉是对整体的反应。漏一层就丢一档分。","ok":"踩分术语 5 个：「相同点：都」、「区别：感觉」、「知觉」、「感觉」、「这个关系要理解清楚」。先写术语，再展开。","bad":"同考点还有卡 107「知觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-5-14","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L109","s":"普心","c":5,"t":"简答","card":109,"kd":"次要卡","stem":"什么是错觉？错觉与幻觉有什么区别？","ans":"错觉是知觉不能正确表达外界事物特性而产生的歪曲。错觉不同于幻觉，是在一定条件下必然产生的正常现象。研究错觉的理论意义是有助于揭示正常知觉规律，实践意义是可以消除不利影响、利用错觉为生活服务。","kw":["错觉","错觉不同于幻觉，","研究错觉的理论意义"],"jx":{"po":"设问「什么是错觉？错觉与幻觉有什么区别？」落在「次要卡」卡 109。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 3 个：「错觉」、「错觉不同于幻觉，」、「研究错觉的理论意义」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 110「大小错觉有哪六种？」，两卡常被混问，注意别串。"},"kp":"px-5-15","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L112","s":"普心","c":5,"t":"简答","card":112,"kd":"次要卡","stem":"解释错觉产生原因的三个方向是什么？","ans":"眼动说解释垂直水平错觉；移情说解释箭形错觉；透视说解释潘佐错觉。产生原因尚无统一解释。","kw":["眼动说解释垂直水平错觉","移情说解释箭形错觉","透视说解释潘佐错觉","产生原因尚无统一解释"],"jx":{"po":"设问「解释错觉产生原因的三个方向是什么？」落在「次要卡」卡 112。答案按 3 层展开：眼动说解释垂直水平错觉；移情说解释箭形错觉；透视说解释潘佐错觉。漏一层就丢一档分。","ok":"踩分术语 4 个：「眼动说解释垂直水平错觉」、「移情说解释箭形错觉」、「透视说解释潘佐错觉」、「产生原因尚无统一解释」。先写术语，再展开。","bad":"同音字坑：『眼动说』别写成「眼洞说」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-18","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L114","s":"普心","c":5,"t":"简答","card":114,"kd":"次要卡","stem":"时间知觉的影响因素有哪些？","ans":"感觉通道性质影响精确性（听觉优于触觉优于视觉）；从事感兴趣的活动会觉得时间过得快；对时间越注意时间过得越慢；还受年龄和疾病等影响。","kw":["感觉通道性质影响精确性","对时间越注意时间过得越慢","还受年龄和疾病等影响"],"jx":{"po":"设问「时间知觉的影响因素有哪些？」落在「次要卡」卡 114。答案按 4 层展开：感觉通道性质影响精确性；从事感兴趣的活动会觉得时间过得快；对时间越注意时间过得越慢；还受年龄和疾病等影响。漏一层就丢一档分。","ok":"踩分术语 3 个：「感觉通道性质影响精确性」、「对时间越注意时间过得越慢」、「还受年龄和疾病等影响」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-20","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L115","s":"普心","c":5,"t":"简答","card":115,"kd":"次要卡","stem":"Tau效应与kappa效应分别是什么？","ans":"时间知觉和空间知觉存在交互作用：Tau效应是时间影响空间；kappa效应是空间影响时间。","kw":["kappa效应"],"jx":{"po":"设问「Tau效应与kappa效应分别是什么？」落在「次要卡」卡 115。答案按 2 层展开：时间知觉和空间知觉存在交互作用；kappa效应是空间影响时间。漏一层就丢一档分。","ok":"踩分术语 1 个：「kappa效应」。先写术语，再展开。","bad":"同音字坑：『Tau效应』别写成「陶效应」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-21","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-5-L116","s":"普心","c":5,"t":"简答","card":116,"kd":"次要卡","stem":"形状知觉有哪些理论？","ans":"特征分析理论（认为识别始于对原始特征的分析）；特雷斯曼的知觉特征整合理论（强调注意在特征整合中的作用）；成分识别理论（由比德曼提出，认为基于几何元件识别物体）；拓扑知觉理论（由陈霖提出，认为视觉系统对整体拓扑性质更敏感）。","kw":["特征分析理论","特雷斯曼的知觉特征整合理论","成分识别理论","拓扑知觉理论"],"jx":{"po":"设问「形状知觉有哪些理论？」落在「次要卡」卡 116。答案按 4 层展开：特征分析理论；特雷斯曼的知觉特征整合理论；成分识别理论；拓扑知觉理论。漏一层就丢一档分。","ok":"踩分术语 4 个：「特征分析理论」、「特雷斯曼的知觉特征整合理论」、「成分识别理论」、「拓扑知觉理论」。先写术语，再展开。","bad":"同音字坑：『特雷斯曼』别写成「特瑞斯曼」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 109「什么是错觉？错觉与幻觉有什么区别？」，两卡常被混问，注意别串。"},"kp":"px-5-22","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-1","s":"普心","c":6,"t":"填空","card":121,"kd":"考点九 提高记忆效果的记忆策略","stem":"编码阶段可以用哪些策略提高记忆？","ans":"在清醒状态下集中注意进行深层次的意义加工；记忆加工水平理论告诉我们加工越深记忆效果越好；把记忆材料形象化、韵律化。","kw":["在清醒状态下集中注意进行深层次的意义加工"],"jx":{"po":"设问「编码阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 121。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 122「存储阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-2","s":"普心","c":6,"t":"填空","card":122,"kd":"考点九 提高记忆效果的记忆策略","stem":"存储阶段可以用哪些策略提高记忆？","ans":"及时经常复习；使用精细复述；分散复习优于集中复习；阅读与回忆交替进行；适当的过度学习。","kw":["分散复习优于集中复习"],"jx":{"po":"设问「存储阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 122。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 121「编码阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-3","s":"普心","c":6,"t":"填空","card":123,"kd":"考点九 提高记忆效果的记忆策略","stem":"提取阶段可以用哪些策略提高记忆？","ans":"利用编码特异性原则，提取时的情境与编码时越相似越有助于记忆；利用测试效应，进行回忆和再认等提取测试，比简单重复学习效果更好。","kw":["利用编码特异性原则","提取时的情境与编码时越相似越有助于记忆"],"jx":{"po":"设问「提取阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 123。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『进行回忆和再认』别写成「在任」（考试写括号外的正确术语）。 同考点还有卡 121「编码阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-4","s":"普心","c":6,"t":"填空","card":124,"kd":"考点八 遗忘","stem":"艾宾浩斯遗忘曲线的发现过程和规律是什么？","ans":"艾宾浩斯最早研究遗忘，用自己作被试，用节省法研究无意义音节，发现遗忘在学习之后立即开始，先快后慢，汇制成艾宾浩斯遗忘曲线。","kw":["用节省法研究无意义音节","发现遗忘在学习之后立即开始"],"jx":{"po":"设问「艾宾浩斯遗忘曲线的发现过程和规律是什么？」落在「考点八 遗忘」卡 124。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『艾宾浩斯』别写成「艾宾号斯」（考试写括号外的正确术语）。 同考点还有卡 125「遗忘的影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-6-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-5","s":"普心","c":6,"t":"填空","card":125,"kd":"考点八 遗忘","stem":"遗忘的影响因素有哪些？","ans":"第一，时间因素。第二，识记材料的性质与数量，形象、有意义、有韵律的材料比抽象、无意义、无韵律的材料遗忘得慢。第三，学习程度，过度学习150%时效果最佳。第四，系列位置效应。第五，识记者的态度等。","kw":["识记材料的性质与数量","有韵律的材料比抽象"],"jx":{"po":"设问「遗忘的影响因素有哪些？」落在「考点八 遗忘」卡 125。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-6","s":"普心","c":6,"t":"填空","card":126,"kd":"考点八 遗忘","stem":"什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？","ans":"最后呈现的材料回忆效果最好，叫近因效应；最先呈现的材料较易回忆，叫首因效应；中间部分最难回忆，因为它同时受到前摄抑制和倒摄抑制的影响。前摄抑制是先学材料干扰后学材料，倒摄抑制是后学材料干扰先学材料。要理解。","kw":["最后呈现的材料回忆效果最好","最先呈现的材料较易回忆"],"jx":{"po":"设问「什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？」落在「考点八 遗忘」卡 126。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『近因』别写成「静音」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-7","s":"普心","c":6,"t":"填空","card":127,"kd":"考点八 遗忘","stem":"四种遗忘理论分别是什么？","ans":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在感觉记忆和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，前摄抑制和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","kw":["认为记忆痕迹得不到强化就会逐渐减弱以至消退"],"jx":{"po":"设问「四种遗忘理论分别是什么？」落在「考点八 遗忘」卡 127。本题为术语挖空：只填术语，不要求整段默写。","ok":"","bad":"同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-7","noteCut":1,"bt":"b","bp":"ans","bq":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在______和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，______和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","bl":["感觉记忆","前摄抑制"],"bpos":[27,105],"bsrc":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在感觉记忆和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，前摄抑制和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","nq":2},{"id":"px-6-8","s":"普心","c":6,"t":"填空","card":128,"kd":"考点七 长时记忆","stem":"长时记忆的编码有什么特点？","ans":"长时记忆保持时间在一分钟以上，容量没有限制，主要编码方式是语义编码；另外还有形象编码，以表象代码存储具体事物信息。影响编码的因素包括觉醒状态和加工深度，加工越深记忆效果越好。","kw":["长时记忆保持时间在一分钟以上","主要编码方式是语义编码"],"jx":{"po":"设问「长时记忆的编码有什么特点？」落在「考点七 长时记忆」卡 128。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『方式是语义编码』别写成「语意编码」（考试写括号外的正确术语）。 同考点还有卡 129「长时记忆存储会发生哪些变化？」，两卡常被混问，注意别串。"},"kp":"px-6-8","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-9","s":"普心","c":6,"t":"填空","card":129,"kd":"考点七 长时记忆","stem":"长时记忆存储会发生哪些变化？","ans":"存储是一个动态过程，有量的变化和质的变化。量的方面，信息随时间推移逐渐减少，但存在记忆恢复现象：间隔一段时间后测得的保持量可能比立即测得的还多。质的方面，内容会变得更简略、概括，更完整、合理，或更夸张、突出。","kw":["存储是一个动态过程","有量的变化和质的变化"],"jx":{"po":"设问「长时记忆存储会发生哪些变化？」落在「考点七 长时记忆」卡 129。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-9","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-10","s":"普心","c":6,"t":"填空","card":130,"kd":"考点七 长时记忆","stem":"什么是错误记忆？研究错误记忆的常用范式是什么？","ans":"错误记忆是指人们对过去事件的报告与事实出现偏离；研究错误记忆的常用范式是DRM范式。","kw":["错误记忆是指人们对过去事件的报告与事实出现偏离"],"jx":{"po":"设问「什么是错误记忆？研究错误记忆的常用范式是什么？」落在「考点七 长时记忆」卡 130。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-10","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-6-11","s":"普心","c":6,"t":"填空","card":131,"kd":"考点七 长时记忆","stem":"长时记忆的两种提取形式是什么？","ans":"再认：事物再度呈现使人能认识，分熟悉感和回想两种形式。回忆：事物在头脑中重新出现，比再认困难。","kw":["事物再度呈现使人能认识"],"jx":{"po":"设问「长时记忆的两种提取形式是什么？」落在「考点七 长时记忆」卡 131。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『分熟悉感和回想』别写成「回响」（考试写括号外的正确术语）。 同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-11","noteCut":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-12","s":"普心","c":6,"t":"填空","card":132,"kd":"考点六 工作记忆","stem":"巴德利的工作记忆模型包括哪四个成分？","ans":"语音环路（用于存储和加工语音信息，分语音存储和发音复述两个部分）；视觉空间模板（用于存储和加工视觉与空间信息）；情景缓冲器（暂时存储和合并来自不同渠道的信息，被中央执行系统使用）；中央执行系统（是工作记忆的核心，一个注意资源有限的控制系统，负责协调其他三个成分的活动、分配注意资源）。","kw":["语音环路（用于存储和加工语音信息","分语音存储和发音复述两个部分"],"jx":{"po":"设问「巴德利的工作记忆模型包括哪四个成分？」落在「考点六 工作记忆」卡 132。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『语音环路』别写成「发音附数」（考试写括号外的正确术语）。"},"kp":"px-6-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-13","s":"普心","c":6,"t":"填空","card":133,"kd":"考点五 短时记忆","stem":"短时记忆的编码方式有哪些？相关实验是什么？","ans":"短时记忆保持时间约一分钟，主要编码方式为听觉编码（康拉德实验证明语音相似性影响回忆效果）；最初阶段是视觉编码（波斯纳实验证明同形字母反应更快）；另外还有语义编码。","kw":["短时记忆保持时间约一分钟"],"jx":{"po":"设问「短时记忆的编码方式有哪些？相关实验是什么？」落在「考点五 短时记忆」卡 133。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『阶段是视觉编码』别写成「同型」（考试写括号外的正确术语）。 同考点还有卡 134「短时记忆的容量是多少？什么是组块？」，两卡常被混问，注意别串。"},"kp":"px-6-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-14","s":"普心","c":6,"t":"填空","card":134,"kd":"考点五 短时记忆","stem":"短时记忆的容量是多少？什么是组块？","ans":"短时记忆容量有限，米勒研究发现约为7加减2个组块；组块是一个有意义的信息单元；组块化可以通过知识经验扩大每个组块的信息量，从而增加容量。","kw":["短时记忆容量有限","米勒研究发现约为7加减2个组块"],"jx":{"po":"设问「短时记忆的容量是多少？什么是组块？」落在「考点五 短时记忆」卡 134。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 133「短时记忆的编码方式有哪些？相关实验是什么」，两卡常被混问，注意别串。"},"kp":"px-6-14","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-6-15","s":"普心","c":6,"t":"填空","card":135,"kd":"考点五 短时记忆","stem":"复述分为哪两种？哪种更有效？","ans":"复述是保持信息的有效方法，分机械复述和精细复述；精细复述是最有效的方法。短时记忆的遗忘主要由干扰引起。","kw":["复述是保持信息的有效方法","分机械复述和精细复述"],"jx":{"po":"设问「复述分为哪两种？哪种更有效？」落在「考点五 短时记忆」卡 135。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『复述』别写成「复数」（考试写括号外的正确术语）。 同考点还有卡 133「短时记忆的编码方式有哪些？相关实验是什么」，两卡常被混问，注意别串。"},"kp":"px-6-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-16","s":"普心","c":6,"t":"填空","card":136,"kd":"考点四 感觉记忆","stem":"感觉记忆的定义是什么？","ans":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后感觉信息在极短时间内被保存下来的记忆。","kw":[" 是客观刺激停止作"],"jx":{"po":"设问「感觉记忆的定义是什么？」落在「考点四 感觉记忆」卡 136。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『登记或瞬时记忆』别写成「顺时记忆」（考试写括号外的正确术语）。 同考点还有卡 137「图像记忆与声像记忆分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-16","noteCut":1,"bt":"b","bp":"ans","bq":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后______在极短时间内被保存下来的记忆。","bl":["感觉信息"],"bpos":[26],"bsrc":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后感觉信息在极短时间内被保存下来的记忆。","nq":1},{"id":"px-6-17","s":"普心","c":6,"t":"填空","card":137,"kd":"考点四 感觉记忆","stem":"图像记忆与声像记忆分别是什么？","ans":"视觉的感觉记忆叫图像记忆，保持约一秒，斯伯林用部分报告法证明其存在；听觉的感觉记忆叫声像记忆或回声存储，保持五到十秒。","kw":["视觉的感觉记忆叫图像记忆","斯伯林用部分报告法证明其存在"],"jx":{"po":"设问「图像记忆与声像记忆分别是什么？」落在「考点四 感觉记忆」卡 137。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『记忆叫图像记忆』别写成「印象记忆」（考试写括号外的正确术语）。 同考点还有卡 136「感觉记忆的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-18","s":"普心","c":6,"t":"填空","card":138,"kd":"考点四 感觉记忆","stem":"感觉记忆有哪些特征？","ans":"具有鲜明的形象性；依据物理特征编码；容量较大，进入感觉器官的信息几乎都能被登记；受到注意的信息有机会进入短时记忆。","kw":["具有鲜明的形象性","依据物理特征编码；容量较大"],"jx":{"po":"设问「感觉记忆有哪些特征？」落在「考点四 感觉记忆」卡 138。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 136「感觉记忆的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-19","s":"普心","c":6,"t":"填空","card":139,"kd":"考点二 记忆的分类","stem":"按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？","ans":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为情景记忆和语义记忆，另外还分程序性记忆和陈述性记忆。","kw":["阿特金森和谢夫林提出了三级记忆模型说明三者的关系"],"jx":{"po":"设问「按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？」落在「考点二 记忆的分类」卡 139。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『特金森和谢夫林』别写成「谢佛林」（考试写括号外的正确术语）。 同考点还有卡 140「外显记忆与内隐记忆有哪五个区别？」，两卡常被混问，注意别串。"},"kp":"px-6-19","bt":"b","bp":"ans","bq":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为______和语义记忆，另外还分______和陈述性记忆。","bl":["情景记忆","程序性记忆"],"bpos":[88,102],"bsrc":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为情景记忆和语义记忆，另外还分程序性记忆和陈述性记忆。","nq":2},{"id":"px-6-20","s":"普心","c":6,"t":"填空","card":140,"kd":"考点二 记忆的分类","stem":"外显记忆与内隐记忆有哪五个区别？","ans":"加工深度影响外显但不影响内隐；保持时间上外显随间隔延长而减少但内隐不受影响；记忆负荷量影响外显但不影响内隐；干扰因素影响外显但内隐不易受干扰；感觉通道改变严重影响内隐但不影响外显。这五个区别理解意思即可（一内四外是核心）。","kw":["加工深度影响外显但不影响内隐","保持时间上外显随间隔延长而减少但内隐不受影响"],"jx":{"po":"设问「外显记忆与内隐记忆有哪五个区别？」落在「考点二 记忆的分类」卡 140。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 139「按信息保持时间长短记忆分为哪三类？三级记」，两卡常被混问，注意别串。"},"kp":"px-6-20","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-21","s":"普心","c":6,"t":"填空","card":141,"kd":"考点二 记忆的分类","stem":"按记忆的具体内容分为哪四类？","ans":"形象记忆、逻辑记忆、情绪记忆和动作记忆；逻辑记忆以语词为中介，是人类特有的","kw":["情绪记忆和动作记忆"],"jx":{"po":"设问「按记忆的具体内容分为哪四类？」落在「考点二 记忆的分类」卡 141。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 139「按信息保持时间长短记忆分为哪三类？三级记」，两卡常被混问，注意别串。"},"kp":"px-6-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-22","s":"普心","c":6,"t":"填空","card":142,"kd":"考点一 记忆概述","stem":"记忆的定义是什么？","ans":"记忆是在头脑中积累和保存个体经验的心理过程。用信息加工的术语来讲，就是人脑对外界输入的信息进行编码、存储和提取的过程。","kw":["记忆是在头脑中积累和保存个体经验的心理过程"],"jx":{"po":"设问「记忆的定义是什么？」落在「考点一 记忆概述」卡 142。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 143「编码、存储、提取分别对应什么？」，两卡常被混问，注意别串。"},"kp":"px-6-22","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-6-23","s":"普心","c":6,"t":"填空","card":143,"kd":"考点一 记忆概述","stem":"编码、存储、提取分别对应什么？","ans":"编码相当于「记」，存储是「记」和「忆」的中间环节，提取相当于「忆」。","kw":["编码相当于「记","的中间环节"],"jx":{"po":"设问「编码、存储、提取分别对应什么？」落在「考点一 记忆概述」卡 143。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 142「记忆的定义是什么？（老师原话：我们记这一」，两卡常被混问，注意别串。"},"kp":"px-6-23","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-24","s":"普心","c":6,"t":"填空","card":144,"kd":"考点一 记忆概述","stem":"传统观点把记忆分为哪三个阶段？","ans":"识记、保持、回忆和再认；识记是编码，保持是储存，回忆和再认是提取。信息加工角度和传统观点两个框架对照着背。","kw":["回忆和再认是提取","信息加工角度和传统观点两个框架对照着背"],"jx":{"po":"设问「传统观点把记忆分为哪三个阶段？」落在「考点一 记忆概述」卡 144。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 142「记忆的定义是什么？（老师原话：我们记这一」，两卡常被混问，注意别串。"},"kp":"px-6-24","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-25","s":"普心","c":6,"t":"填空","card":145,"kd":"次要卡","stem":"第六章九个考点如何串记？","ans":"","kw":["存储和提取三个阶段","考点二记忆的分类：三级记忆模型"],"jx":{"po":"设问「第六章九个考点如何串记？」落在「次要卡」卡 145。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 146「遗忘分为哪些类型？」，两卡常被混问，注意别串。"},"kp":"px-6-25","noteCut":8,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-26","s":"普心","c":6,"t":"填空","card":146,"kd":"次要卡","stem":"遗忘分为哪些类型？","ans":"遗忘分不完全遗忘和完全遗忘、临时性遗忘和永久性遗忘。","kw":["分不完全遗忘和完全遗忘"],"jx":{"po":"设问「遗忘分为哪些类型？」落在「次要卡」卡 146。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-26","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-27","s":"普心","c":6,"t":"填空","card":147,"kd":"次要卡","stem":"工作记忆与短时记忆有什么区别？","ans":"工作记忆由不同成分构成，比短时记忆更加主动，强调在复杂认知活动中的作用；短时记忆是单一成分，强调对信息的短时存储。","kw":["工作记忆由不同成分构成"],"jx":{"po":"设问「工作记忆与短时记忆有什么区别？」落在「次要卡」卡 147。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-27","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-28","s":"普心","c":6,"t":"填空","card":148,"kd":"次要卡","stem":"短时记忆的信息提取方式有哪些？","ans":"斯腾伯格用加法反应时研究发现三种提取方式：平行扫描、自动停止系列扫描和完全系列扫描；短时记忆的主要提取方式是完全系列扫描。","kw":["斯腾伯格用加法反应时研究发现三种提取方式"],"jx":{"po":"设问「短时记忆的信息提取方式有哪些？」落在「次要卡」卡 148。本题为问答型：不设空，按关键词自评。","ok":"","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-28","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-29","s":"普心","c":6,"t":"填空","card":149,"kd":"次要卡","stem":"记忆的脑机制包括哪些内容？","ans":"海马负责巩固记忆，帮助信息由短时记忆进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、工作记忆中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","kw":["海马负责巩固记忆","帮助信息由短时记忆进入长时记忆"],"jx":{"po":"设问「记忆的脑机制包括哪些内容？」落在「次要卡」卡 149。本题为术语挖空：只填术语，不要求整段默写。","ok":"","bad":"同音字坑：『引起顺行性遗忘』别写成「顺形性遗忘」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-29","bt":"b","bp":"ans","bq":"海马负责巩固记忆，帮助信息由______进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、______中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","bl":["短时记忆","工作记忆"],"bpos":[14,72],"bsrc":"海马负责巩固记忆，帮助信息由短时记忆进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、工作记忆中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","nq":2},{"id":"px-6-30","s":"普心","c":6,"t":"填空","card":150,"kd":"次要卡","stem":"按记忆内容在时间轴上的指向分为哪两类？","ans":"前瞻性记忆（对未来活动的记忆）和回溯性记忆（对过去事件的记忆）。","kw":["前瞻性记忆（对未来活动的记忆","和回溯性记忆（对过去事件的记忆"],"jx":{"po":"设问「按记忆内容在时间轴上的指向分为哪两类？」落在「次要卡」卡 150。本题为问答型：不设空，按关键词自评。","ok":"","bad":"同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-30","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L121","s":"普心","c":6,"t":"简答","card":121,"kd":"考点九 提高记忆效果的记忆策略","stem":"编码阶段可以用哪些策略提高记忆？","ans":"在清醒状态下集中注意进行深层次的意义加工；记忆加工水平理论告诉我们加工越深记忆效果越好；把记忆材料形象化、韵律化。","kw":["把记忆材料形象化"],"jx":{"po":"设问「编码阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 121。答案按 3 层展开：在清醒状态下集中注意进行深层次的意义加工；记忆加工水平理论告诉我们加工越深记忆效果越好；把记忆材料形象化。漏一层就丢一档分。","ok":"踩分术语 1 个：「把记忆材料形象化」。先写术语，再展开。","bad":"同考点还有卡 122「存储阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-1","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L122","s":"普心","c":6,"t":"简答","card":122,"kd":"考点九 提高记忆效果的记忆策略","stem":"存储阶段可以用哪些策略提高记忆？","ans":"及时经常复习；使用精细复述；分散复习优于集中复习；阅读与回忆交替进行；适当的过度学习。","kw":["及时经常复习","使用精细复述","分散复习优于集中复习","阅读与回忆交替进行","适当的过度学习"],"jx":{"po":"设问「存储阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 122。答案按 5 层展开：及时经常复习；使用精细复述；分散复习优于集中复习；阅读与回忆交替进行。漏一层就丢一档分。","ok":"踩分术语 5 个：「及时经常复习」、「使用精细复述」、「分散复习优于集中复习」、「阅读与回忆交替进行」、「适当的过度学习」。先写术语，再展开。","bad":"同考点还有卡 121「编码阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-2","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L123","s":"普心","c":6,"t":"简答","card":123,"kd":"考点九 提高记忆效果的记忆策略","stem":"提取阶段可以用哪些策略提高记忆？","ans":"利用编码特异性原则，提取时的情境与编码时越相似越有助于记忆；利用测试效应，进行回忆和再认等提取测试，比简单重复学习效果更好。","kw":["利用编码特异性原则","利用测试效应"],"jx":{"po":"设问「提取阶段可以用哪些策略提高记忆？」落在「考点九 提高记忆效果的记忆策略」卡 123。答案按 2 层展开：利用编码特异性原则；利用测试效应。漏一层就丢一档分。","ok":"踩分术语 2 个：「利用编码特异性原则」、「利用测试效应」。先写术语，再展开。","bad":"同音字坑：『进行回忆和再认』别写成「在任」（考试写括号外的正确术语）。 同考点还有卡 121「编码阶段可以用哪些策略提高记忆？」，两卡常被混问，注意别串。"},"kp":"px-6-3","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L124","s":"普心","c":6,"t":"简答","card":124,"kd":"考点八 遗忘","stem":"艾宾浩斯遗忘曲线的发现过程和规律是什么？","ans":"艾宾浩斯最早研究遗忘，用自己作被试，用节省法研究无意义音节，发现遗忘在学习之后立即开始，先快后慢，汇制成艾宾浩斯遗忘曲线。","kw":["艾宾浩斯最早研究遗忘"],"jx":{"po":"设问「艾宾浩斯遗忘曲线的发现过程和规律是什么？」落在「考点八 遗忘」卡 124。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「艾宾浩斯最早研究遗忘」。先写术语，再展开。","bad":"同音字坑：『艾宾浩斯』别写成「艾宾号斯」（考试写括号外的正确术语）。 同考点还有卡 125「遗忘的影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-6-4","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L125","s":"普心","c":6,"t":"简答","card":125,"kd":"考点八 遗忘","stem":"遗忘的影响因素有哪些？","ans":"第一，时间因素。第二，识记材料的性质与数量，形象、有意义、有韵律的材料比抽象、无意义、无韵律的材料遗忘得慢。第三，学习程度，过度学习150%时效果最佳。第四，系列位置效应。第五，识记者的态度等。","kw":["时间因素","性质与数量","学习程度"],"jx":{"po":"设问「遗忘的影响因素有哪些？」落在「考点八 遗忘」卡 125。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"按整段原文作答；参考答案里的标红即踩分处。","bad":"同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-5","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L126","s":"普心","c":6,"t":"简答","card":126,"kd":"考点八 遗忘","stem":"什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？","ans":"最后呈现的材料回忆效果最好，叫近因效应；最先呈现的材料较易回忆，叫首因效应；中间部分最难回忆，因为它同时受到前摄抑制和倒摄抑制的影响。前摄抑制是先学材料干扰后学材料，倒摄抑制是后学材料干扰先学材料。要理解。","kw":["最后呈现的材料回忆效果最好","最先呈现的材料较易回忆","中间部分最难回忆","前摄抑制"],"jx":{"po":"设问「什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？」落在「考点八 遗忘」卡 126。答案按 3 层展开：最后呈现的材料回忆效果最好；最先呈现的材料较易回忆；中间部分最难回忆。漏一层就丢一档分。","ok":"踩分术语 4 个：「最后呈现的材料回忆效果最好」、「最先呈现的材料较易回忆」、「中间部分最难回忆」、「前摄抑制」。先写术语，再展开。","bad":"同音字坑：『近因』别写成「静音」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-6","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L127","s":"普心","c":6,"t":"简答","card":127,"kd":"考点八 遗忘","stem":"四种遗忘理论分别是什么？","ans":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在感觉记忆和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，前摄抑制和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","kw":["衰退说","干扰说：认为遗忘","压抑说","这一说法考虑了个体的需要","提取失败说"],"jx":{"po":"设问「四种遗忘理论分别是什么？」落在「考点八 遗忘」卡 127。答案按 2 层展开：衰退说；这一说法考虑了个体的需要。漏一层就丢一档分。","ok":"踩分术语 5 个：「衰退说」、「干扰说：认为遗忘」、「压抑说」、「这一说法考虑了个体的需要」、「提取失败说」。先写术语，再展开。","bad":"同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-7","alt":1,"noteCut":1,"bt":"b","bp":"ans","bq":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在______和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，______和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","bl":["感觉记忆","前摄抑制"],"bpos":[27,105],"bsrc":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在感觉记忆和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，前摄抑制和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。","nq":2},{"id":"px-6-L128","s":"普心","c":6,"t":"简答","card":128,"kd":"考点七 长时记忆","stem":"长时记忆的编码有什么特点？","ans":"长时记忆保持时间在一分钟以上，容量没有限制，主要编码方式是语义编码；另外还有形象编码，以表象代码存储具体事物信息。影响编码的因素包括觉醒状态和加工深度，加工越深记忆效果越好。","kw":["长时记忆保持时间在一分钟以上","另外还有形象编码"],"jx":{"po":"设问「长时记忆的编码有什么特点？」落在「考点七 长时记忆」卡 128。答案按 2 层展开：长时记忆保持时间在一分钟以上；另外还有形象编码。漏一层就丢一档分。","ok":"踩分术语 2 个：「长时记忆保持时间在一分钟以上」、「另外还有形象编码」。先写术语，再展开。","bad":"同音字坑：『方式是语义编码』别写成「语意编码」（考试写括号外的正确术语）。 同考点还有卡 129「长时记忆存储会发生哪些变化？」，两卡常被混问，注意别串。"},"kp":"px-6-8","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L130","s":"普心","c":6,"t":"简答","card":130,"kd":"考点七 长时记忆","stem":"什么是错误记忆？研究错误记忆的常用范式是什么？","ans":"错误记忆是指人们对过去事件的报告与事实出现偏离；研究错误记忆的常用范式是DRM范式。","kw":["错误记忆","研究错误记忆的常用范式"],"jx":{"po":"设问「什么是错误记忆？研究错误记忆的常用范式是什么？」落在「考点七 长时记忆」卡 130。答案按 2 层展开：错误记忆是指人们对过去事件的报告与事实出现偏离；研究错误记忆的常用范式是DRM范式。漏一层就丢一档分。","ok":"踩分术语 2 个：「错误记忆」、「研究错误记忆的常用范式」。先写术语，再展开。","bad":"同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-10","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-6-L132","s":"普心","c":6,"t":"简答","card":132,"kd":"考点六 工作记忆","stem":"巴德利的工作记忆模型包括哪四个成分？","ans":"语音环路（用于存储和加工语音信息，分语音存储和发音复述两个部分）；视觉空间模板（用于存储和加工视觉与空间信息）；情景缓冲器（暂时存储和合并来自不同渠道的信息，被中央执行系统使用）；中央执行系统（是工作记忆的核心，一个注意资源有限的控制系统，负责协调其他三个成分的活动、分配注意资源）。","kw":["语音环路","视觉空间模板","情景缓冲器","中央执行系统"],"jx":{"po":"设问「巴德利的工作记忆模型包括哪四个成分？」落在「考点六 工作记忆」卡 132。答案按 4 层展开：语音环路；视觉空间模板；情景缓冲器；中央执行系统。漏一层就丢一档分。","ok":"踩分术语 4 个：「语音环路」、「视觉空间模板」、「情景缓冲器」、「中央执行系统」。先写术语，再展开。","bad":"同音字坑：『语音环路』别写成「发音附数」（考试写括号外的正确术语）。"},"kp":"px-6-12","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L136","s":"普心","c":6,"t":"简答","card":136,"kd":"考点四 感觉记忆","stem":"感觉记忆的定义是什么？","ans":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后感觉信息在极短时间内被保存下来的记忆。","kw":["感觉记忆","感觉登记","瞬时记忆","极短时间"],"jx":{"po":"设问「感觉记忆的定义是什么？」落在「考点四 感觉记忆」卡 136。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"按整段原文作答；参考答案里的标红即踩分处。","bad":"同音字坑：『登记或瞬时记忆』别写成「顺时记忆」（考试写括号外的正确术语）。 同考点还有卡 137「图像记忆与声像记忆分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-16","alt":1,"bt":"b","bp":"ans","bq":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后______在极短时间内被保存下来的记忆。","bl":["感觉信息"],"bpos":[26],"bsrc":"感觉记忆也叫感觉登记或瞬时记忆，是客观刺激停止作用后感觉信息在极短时间内被保存下来的记忆。","nq":1},{"id":"px-6-L139","s":"普心","c":6,"t":"简答","card":139,"kd":"考点二 记忆的分类","stem":"按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？","ans":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为情景记忆和语义记忆，另外还分程序性记忆和陈述性记忆。","kw":["分感觉记忆","对长时记忆"],"jx":{"po":"设问「按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？」落在「考点二 记忆的分类」卡 139。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「分感觉记忆」、「对长时记忆」。先写术语，再展开。","bad":"同音字坑：『特金森和谢夫林』别写成「谢佛林」（考试写括号外的正确术语）。 同考点还有卡 140「外显记忆与内隐记忆有哪五个区别？」，两卡常被混问，注意别串。"},"kp":"px-6-19","alt":1,"bt":"b","bp":"ans","bq":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为______和语义记忆，另外还分______和陈述性记忆。","bl":["情景记忆","程序性记忆"],"bpos":[88,102],"bsrc":"记忆分为感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为情景记忆和语义记忆，另外还分程序性记忆和陈述性记忆。","nq":2},{"id":"px-6-L140","s":"普心","c":6,"t":"简答","card":140,"kd":"考点二 记忆的分类","stem":"外显记忆与内隐记忆有哪五个区别？","ans":"加工深度影响外显但不影响内隐；保持时间上外显随间隔延长而减少但内隐不受影响；记忆负荷量影响外显但不影响内隐；干扰因素影响外显但内隐不易受干扰；感觉通道改变严重影响内隐但不影响外显。这五个区别理解意思即可（一内四外是核心）。","kw":["加工深度影响外显但不影响内隐","这五个区别理解意思即可"],"jx":{"po":"设问「外显记忆与内隐记忆有哪五个区别？」落在「考点二 记忆的分类」卡 140。答案按 5 层展开：加工深度影响外显但不影响内隐；保持时间上外显随间隔延长而减少但内隐不受影响；记忆负荷量影响外显但不影响内隐；干扰因素影响外显但内隐不易受干扰。漏一层就丢一档分。","ok":"踩分术语 2 个：「加工深度影响外显但不影响内隐」、「这五个区别理解意思即可」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 139「按信息保持时间长短记忆分为哪三类？三级记」，两卡常被混问，注意别串。"},"kp":"px-6-20","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L142","s":"普心","c":6,"t":"简答","card":142,"kd":"考点一 记忆概述","stem":"记忆的定义是什么？","ans":"记忆是在头脑中积累和保存个体经验的心理过程。用信息加工的术语来讲，就是人脑对外界输入的信息进行编码、存储和提取的过程。","kw":["记忆","用信息加工的术语来讲，就"],"jx":{"po":"设问「记忆的定义是什么？」落在「考点一 记忆概述」卡 142。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 2 个：「记忆」、「用信息加工的术语来讲，就」。先写术语，再展开。","bad":"同考点还有卡 143「编码、存储、提取分别对应什么？」，两卡常被混问，注意别串。"},"kp":"px-6-22","alt":1,"bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-6-L144","s":"普心","c":6,"t":"简答","card":144,"kd":"考点一 记忆概述","stem":"传统观点把记忆分为哪三个阶段？","ans":"识记、保持、回忆和再认；识记是编码，保持是储存，回忆和再认是提取。信息加工角度和传统观点两个框架对照着背。","kw":["识记"],"jx":{"po":"设问「传统观点把记忆分为哪三个阶段？」落在「考点一 记忆概述」卡 144。答案按 2 层展开：识记、保持、回忆和再认；识记是编码。漏一层就丢一档分。","ok":"踩分术语 1 个：「识记」。先写术语，再展开。","bad":"同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 142「记忆的定义是什么？（老师原话：我们记这一」，两卡常被混问，注意别串。"},"kp":"px-6-24","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L146","s":"普心","c":6,"t":"简答","card":146,"kd":"次要卡","stem":"遗忘分为哪些类型？","ans":"遗忘分不完全遗忘和完全遗忘、临时性遗忘和永久性遗忘。","kw":["分不完全遗忘和完全遗忘"],"jx":{"po":"设问「遗忘分为哪些类型？」落在「次要卡」卡 146。答案是一句定义/判断，先背主谓宾，再补修饰语。","ok":"踩分术语 1 个：「分不完全遗忘和完全遗忘」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-26","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L147","s":"普心","c":6,"t":"简答","card":147,"kd":"次要卡","stem":"工作记忆与短时记忆有什么区别？","ans":"工作记忆由不同成分构成，比短时记忆更加主动，强调在复杂认知活动中的作用；短时记忆是单一成分，强调对信息的短时存储。","kw":["工作记忆由不同成分构成","短时记忆"],"jx":{"po":"设问「工作记忆与短时记忆有什么区别？」落在「次要卡」卡 147。答案按 2 层展开：工作记忆由不同成分构成；短时记忆是单一成分。漏一层就丢一档分。","ok":"踩分术语 2 个：「工作记忆由不同成分构成」、「短时记忆」。先写术语，再展开。","bad":"手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-27","alt":1,"bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-6-L149","s":"普心","c":6,"t":"简答","card":149,"kd":"次要卡","stem":"记忆的脑机制包括哪些内容？","ans":"海马负责巩固记忆，帮助信息由短时记忆进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、工作记忆中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","kw":["海马负责巩固记忆","杏仁核与情绪记忆特别","前额叶在情景记忆","在生物化学层面"],"jx":{"po":"设问「记忆的脑机制包括哪些内容？」落在「次要卡」卡 149。答案按 3 层展开：海马负责巩固记忆；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆。漏一层就丢一档分。","ok":"踩分术语 4 个：「海马负责巩固记忆」、「杏仁核与情绪记忆特别」、「前额叶在情景记忆」、「在生物化学层面」。先写术语，再展开。","bad":"同音字坑：『引起顺行性遗忘』别写成「顺形性遗忘」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-29","alt":1,"bt":"b","bp":"ans","bq":"海马负责巩固记忆，帮助信息由______进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、______中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","bl":["短时记忆","工作记忆"],"bpos":[14,72],"bsrc":"海马负责巩固记忆，帮助信息由短时记忆进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、工作记忆中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","nq":2},{"id":"px-7-1","s":"普心","c":7,"t":"填空","card":151,"kd":"考点九 决策","stem":"古典决策理论的核心观点是什么？","ans":"建立在经济人假设基础上，认为决策者完全理性，追求个人利益最大化，选取最优方案。","kw":["认为决策者完全理性","追求个人利益最大化"],"kp":"px-7-1","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-2","s":"普心","c":7,"t":"填空","card":152,"kd":"考点九 决策","stem":"西蒙的行为决策理论是什么？","ans":"西蒙认为人的理性和认知能力有限，不可能找到所有备选方案，遵循满意性原则而非最优原则。","kw":["西蒙认为人的理性和认知能力有限","不可能找到所有备选方案"],"kp":"px-7-2","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-3","s":"普心","c":7,"t":"填空","card":153,"kd":"考点九 决策","stem":"期望效用理论由谁提出？核心观点是什么？","ans":"由冯·诺伊曼和摩根斯坦提出，用严格数学方法追求效用最大化。","kw":[" 用严格数学方法追"],"kp":"px-7-3","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-4","s":"普心","c":7,"t":"填空","card":154,"kd":"考点九 决策","stem":"卡尼曼的前景理论包括哪些核心观点？","ans":"认为不确定情况下人是非理性的：面临获得时风险规避，面临损失时风险偏好；人们对损失比对获得更敏感，即损失厌恶；相同信息的不同表述方式影响决策，即框架效应。","kw":["认为不确定情况下人是非理性的"],"kp":"px-7-4","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-5","s":"普心","c":7,"t":"填空","card":155,"kd":"考点九 决策","stem":"决策中的三种启发法策略分别是什么？","ans":"代表性启发法：根据事物代表某范畴的程度来判断，忽视基础概率，如认为长发男是艺术家。可得性启发法：根据事件在记忆中提取的难易程度来评估概率，如认为坐汽车比坐飞机更安全。锚定和调整启发法：最初估计值成为锚定，之后调整只是微调，如以商品原价为锚觉得打折后很划算。","kw":["根据事物代表某范畴的程度来判断"],"kp":"px-7-5","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-6","s":"普心","c":7,"t":"填空","card":156,"kd":"考点八 问题解决的影响因素","stem":"影响问题解决的十一个因素是什么？","ans":"第一个所选择的策略（不同策略效率不同）；第二个知识（专家在某一领域知识丰富、记忆存储信息量大且知识按层次结构组织，问题解决效率远高于新手）；第三个问题表征的方式（合理的表征促进问题解决）；第四个无谓的限制（受并不存在的限定条件影响，如九点连线图）；第五个定式；第六个顿悟（突然理解问题情境中的关系找到解决方法）；第七个功能固着；第八个动机（在适当限度内动机强度与解决问题效率成正比，太强或太弱都会降低效率）；第九个情绪（积极情绪促进，消极情绪如紧张惶恐阻碍）；第十个人际关系（团体内协作互助促进，互不信任阻碍）；第十一个无关信息（与问题无关的信息会妨碍解决）。","kw":["第一个所选择的策略（不同策略效率不同"],"kp":"px-7-6","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-7","s":"普心","c":7,"t":"填空","card":157,"kd":"考点八 问题解决的影响因素","stem":"什么是定式？陆钦斯的量杯实验证明了什么？","ans":"定式是重复先前的心理操作引起的准备状态，有积极作用也有消极作用。陆钦斯的量杯实验证明了定式的消极作用，即习惯用旧方法阻碍新方法的发现。","kw":["定式是重复先前的心理操作引起的准备状态"],"kp":"px-7-7","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-8","s":"普心","c":7,"t":"填空","card":158,"kd":"考点八 问题解决的影响因素","stem":"什么是功能固着？邓克的盒子问题证明了什么？","ans":"功能固着指人们把某种功能赋予某种物体后不易摆脱固有观念。邓克的盒子问题证明蜡烛盒被看成容器后不易被当成烛台使用。这两个实验和概念的对应关系要重点掌握。","kw":["功能固着指人们把某种功能赋予某种物体后不易摆脱固有观念"],"kp":"px-7-8","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-9","s":"普心","c":7,"t":"填空","card":159,"kd":"考点七 问题解决的策略","stem":"什么是算法？有什么优缺点？","ans":"算法是根据一定规则或程序逐步解决问题的方法，如公式和计算机程序；能保证问题解决，但费时费力，不适用于复杂问题。","kw":["是根据一定规则或程序逐步解决问题的方法"],"kp":"px-7-9","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-10","s":"普心","c":7,"t":"填空","card":160,"kd":"考点七 问题解决的策略","stem":"什么是启发法？有什么优缺点？","ans":"启发法是根据知识经验在问题空间内进行较少搜索，效率高但不能保证完全成功。","kw":["是根据知识经验在问题空间内进行较少搜索"],"kp":"px-7-10","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-11","s":"普心","c":7,"t":"填空","card":161,"kd":"考点七 问题解决的策略","stem":"三种常见的启发法策略分别是什么？","ans":"手段—目的分析法（将总目标分成若干子目标，通过实现子目标不断缩小与目标的差距，必要时可暂时扩大差距迂回前进，汉诺塔问题是典型）；逆向搜索法（从目标状态往回搜索到初始状态，适合只有少数通路的几何类问题）；爬山法（逐步缩短与目标的距离且只能前进）。","kw":["手段—目的分析法（将总目标分成若干子目标","通过实现子目标不断缩小与目标的差距"],"kp":"px-7-11","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-12","s":"普心","c":7,"t":"填空","card":162,"kd":"考点七 问题解决的策略","stem":"手段—目的分析法与爬山法的区别是什么？","ans":"前者可以暂时后退迂回，后者只能前进。三种策略的名称和区别要重点掌握。","kw":["前者可以暂时后退迂回","三种策略的名称和区别要重点掌握"],"kp":"px-7-12","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-13","s":"普心","c":7,"t":"填空","card":163,"kd":"考点五 推理","stem":"三段论推理错误的三种解释分别是什么？","ans":"气氛效应：伍德沃斯认为前提的逻辑量词产生了一种气氛，使人倾向接受包含同一逻辑量词的结论。换位理论：查普曼认为对前提的错误理解导致出错。心理模型理论：约翰逊—莱尔德认为推理是创建并检验心理模型的过程，所需模型越多越困难。","kw":["伍德沃斯认为前提的逻辑量词产生了一种气氛"],"kp":"px-7-13","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-14","s":"普心","c":7,"t":"填空","card":164,"kd":"考点四 概念","stem":"什么是概念？概念与词是什么关系？","ans":"概念是具有共同属性的一类事物的总称，包括内涵和外延两个方面；概念是思维活动的理性支柱，是解决问题的前提条件。概念的层级系统包括上位概念、基本水平的概念和下位概念，其中基本水平的概念最容易在头脑中激活。概念和词的关系：概念是词的思想内容，词是概念的语言形式。","kw":["概念是具有共同属性的一类事物的总称"],"kp":"px-7-14","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-15","s":"普心","c":7,"t":"填空","card":165,"kd":"考点四 概念","stem":"概念的种类如何划分？","ans":"概念的种类按反映事物属性的数量分三种：合取概念、析取概念、关系概念（根据事物间相互关系形成）。按形成自然性分自然概念和人工概念（人工概念常用于实验室研究）。按抽象概括程度分具体概念和抽象概念。","kw":["按反映事物属性的数量分三种"],"kp":"px-7-15","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-16","s":"普心","c":7,"t":"填空","card":166,"kd":"考点四 概念","stem":"概念形成分为哪三个阶段？","ans":"概念形成是指个体掌握概念的过程，一般用人工概念进行研究。三个阶段：抽象化；类化（归类相似属性或特征）；辨别（认识差异）。","kw":["概念形成是指个体掌握概念的过程","一般用人工概念进行研究"],"kp":"px-7-16","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-17","s":"普心","c":7,"t":"填空","card":167,"kd":"考点四 概念","stem":"概念形成的三个理论分别是什么？","ans":"赫尔的共同要素说（认为概念形成是把共同特征抽取出来）；布鲁纳的假设检验说（认为概念形成是不断提出假设和验证假设的过程）；茹什的原型理论（认为形成概念就是在头脑中形成原型，对解释自然概念有启发）。","kw":["赫尔的共同要素说（认为概念形成是把共同特征抽取出来"],"kp":"px-7-17","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-18","s":"普心","c":7,"t":"填空","card":168,"kd":"考点四 概念","stem":"布鲁纳提出的四种概念形成策略是什么？","ans":"保守性聚焦策略（每次只改变一个属性，最有效）；冒险性聚焦策略（同时改变两个以上属性）；同时性扫描策略（同时对多个部分假设进行检验）；继时性扫描策略。","kw":["保守性聚焦策略（每次只改变一个属性"],"kp":"px-7-18","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-19","s":"普心","c":7,"t":"填空","card":169,"kd":"考点四 概念","stem":"概念组织的三个模型分别是什么？","ans":"层次网络模型（由柯林斯提出，概念以节点形式存储在概念网络中，层次越高抽象概括水平越高，提取概念是对网络的搜索过程）；激活扩散模型（由柯林斯在层次网络模型基础上改进，以语义相关性为基础组织概念网络，概念被加工时其意义激活会自动传递到相关概念，能解释语义启动效应）；特征表理论（由波纳提出，认为概念由定义特征和概念规则构成）。","kw":["概念以节点形式存储在概念网络中","层次越高抽象概括水平越高"],"kp":"px-7-19","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-20","s":"普心","c":7,"t":"填空","card":170,"kd":"考点三 创造性","stem":"创造性的定义是什么？","ans":"创造性是指用新颖方式解决问题并产生新的、有社会价值产品的心理过程，是人类最高智慧的体现。","kw":["创造性是指用新颖方式解决问题并产生新的"],"kp":"px-7-20","bt":"q","qt":"jie","qtRule":"纯定义型提问且答案<=110字"},{"id":"px-7-21","s":"普心","c":7,"t":"填空","card":171,"kd":"考点三 创造性","stem":"创造性的心理成分包括哪四个方面？","ans":"第一想象（是对头脑中已有表象进行加工改造、形成新形象的过程，具有形象性和新颖性；想象分无意想象和有意想象，有意想象又分再造想象和创造想象；具体方式包括粘合、夸张、典型化、联想）；第二辐合思维与发散思维（发散思维是创造性的主要成分）；第三远距离联想能力（在相距很远的概念间看出关系的能力）；第四坚持性、自信心等非智力因素。","kw":["第一想象（是对头脑中已有表象进行加工改造","形成新形象的过程"],"kp":"px-7-21","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-22","s":"普心","c":7,"t":"填空","card":172,"kd":"考点三 创造性","stem":"创造性的过程分为哪五个阶段？","ans":"定向阶段（对问题进行定义）；准备阶段（尽可能收集相关信息）；酝酿阶段（所有能想到的方案都无法解决，问题被移入无意识中继续思考）；顿悟阶段（思想火花的闪现，突然发现解决办法）；验证阶段（检验顿悟获得的方案）。","kw":["准备阶段（尽可能收集相关信息","酝酿阶段（所有能想到的方案都无法解决"],"kp":"px-7-22","bt":"q","qt":"jian","qtRule":"其余分点作答"},{"id":"px-7-23","s":"普心","c":7,"t":"填空","card":173,"kd":"考点二 表象","stem":"什么是表象？表象有哪三个特征？","an
