<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>347备考看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:#f5f6f8; color:#1f2937; line-height:1.55; padding:0;
    -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:720px; margin:0 auto; padding:16px 14px 40px; }

  /* 顶部条 */
  .topbar {
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; flex-wrap:wrap; gap:6px;
  }
  .topbar h1 { font-size:22px; font-weight:700; }
  .topbar .meta { font-size:12px; color:#6b7280; }
  .topbar .countdown { font-size:28px; font-weight:700; color:#d93025; }
  .topbar .countdown small { font-size:14px; font-weight:400; color:#6b7280; }

  /* 卡片通用 */
  .card {
    background:#fff; border-radius:12px; padding:14px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px;
  }
  .card h2 {
    font-size:15px; font-weight:700; margin-bottom:10px;
    display:flex; align-items:center; gap:6px;
  }
  .card h2 .tag {
    font-size:11px; font-weight:400; color:#6b7280;
    background:#f3f4f6; border-radius:99px; padding:1px 8px;
  }

  /* 日期类型标签 */
  .daytype {
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:99px; margin-left:auto;
  }
  .daytype.holiday { background:#fef2f2; color:#d93025; }
  .daytype.weekend { background:#f0fdf4; color:#059669; }
  .daytype.workday { background:#eff6ff; color:#1d4ed8; }
  .daytype.special { background:#fefce8; color:#ca8a04; }

  /* 今日时间轴（核心） */
  .timeline { margin-top:4px; }
  .tl-block {
    display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #f3f4f6;
    align-items:flex-start; position:relative;
  }
  .tl-block:last-child { border-bottom:none; padding-bottom:0; }
  .tl-block.past { opacity:.45; }
  .tl-block.now { background:#fef2f2; border-radius:8px; padding:10px 8px; margin:0 -8px; }
  .tl-block.completed { opacity:.4; }
  .tl-block.completed .tl-task { text-decoration:line-through; }
  .tl-time {
    flex-shrink:0; width:52px; font-size:12px; font-weight:600;
    color:#6b7280; padding-top:2px;
  }
  .tl-content { flex:1; }
  .tl-task { font-size:14px; font-weight:600; color:#1f2937; }
  .tl-desc { font-size:12px; color:#6b7280; margin-top:1px; }
  .tl-tag {
    display:inline-block; font-size:10px; font-weight:500;
    padding:1px 5px; border-radius:4px; margin-top:4px;
  }
  .tl-tag.memory { background:#f3f4f6; color:#4b5563; }
  .tl-tag.understand { background:#fef2f2; color:#d93025; }
  .tl-tag.practice { background:#fff7ed; color:#ea580c; }
  .tl-tag.output { background:#eff6ff; color:#1d4ed8; }
  .tl-tag.rest { background:#f0fdf4; color:#059669; }
  .tl-tag.diff-low { background:#f0fdf4; color:#059669; border:1px solid #bbf7d0; }
  .tl-tag.diff-mid { background:#fff7ed; color:#ea580c; border:1px solid #fed7aa; }
  .tl-tag.diff-high { background:#fef2f2; color:#d93025; border:1px solid #fecaca; }

  /* 完成按钮 */
  .tl-actions {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    flex-shrink:0; padding-top:2px;
  }
  .btn-done {
    width:28px; height:28px; border-radius:50%; border:2px solid #e5e7eb;
    background:#fff; color:#9ca3af; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
  }
  .btn-done:hover { border-color:#059669; color:#059669; }
  .btn-done.completed { background:#059669; border-color:#059669; color:#fff; }
  .btn-skip {
    font-size:10px; color:#9ca3af; cursor:pointer; background:none; border:none;
  }
  .btn-skip:hover { color:#d93025; }

  /* 重排提示 */
  .replan-banner {
    background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
    padding:10px 12px; margin-top:10px; font-size:13px; color:#7f1d1d;
  }
  .replan-banner .replan-title { font-weight:700; margin-bottom:4px; }
  .replan-btn {
    background:#d93025; color:#fff; border:none; border-radius:6px;
    padding:6px 14px; font-size:13px; cursor:pointer; margin-top:6px;
  }
  .replan-btn:hover { background:#b91c1c; }

  /* 顺延清单 */
  .defer-list {
    background:#f9fafb; border-radius:8px; padding:10px 12px;
    margin-top:8px; font-size:12px; color:#374151;
  }
  .defer-list li { margin:4px 0; padding-left:16px; position:relative; }
  .defer-list li::before { content:"→"; position:absolute; left:0; color:#9ca3af; }
  .defer-reason { color:#6b7280; font-size:11px; }

  /* 科目三层进度 */
  .subj-card { margin-bottom:10px; }
  .subj-name {
    font-size:14px; font-weight:600; color:#1f2937;
    display:flex; justify-content:space-between; align-items:center;
  }
  .subj-name .st { font-weight:400; font-size:12px; color:#9ca3af; margin-left:6px; }
  .layer-row {
    display:flex; align-items:center; gap:8px; margin-top:6px;
  }
  .layer-label {
    font-size:11px; color:#6b7280; width:40px; flex-shrink:0;
  }
  .layer-bar-wrap {
    flex:1; height:6px; background:#e5e7eb; border-radius:3px;
    overflow:hidden;
  }
  .layer-bar { height:100%; border-radius:3px; transition:width .3s; }
  .layer-pct {
    font-size:11px; font-weight:600; color:#374151; width:36px;
    text-align:right; flex-shrink:0;
  }
  .layer-pct.missing { color:#9ca3af; font-weight:400; }
  .subj-source {
    font-size:11px; color:#9ca3af; margin-top:4px; padding-left:48px;
  }

  /* 折叠区 */
  details { margin-bottom:10px; }
  details > summary {
    font-size:13px; font-weight:600; color:#374151;
    cursor:pointer; padding:8px 0; list-style:none;
    display:flex; justify-content:space-between; align-items:center;
  }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"▸"; font-size:12px; color:#9ca3af; }
  details[open] > summary::after { content:"▾"; }
  .fold-inner { padding:4px 0 8px; }

  /* 日历模板卡片 */
  .cal-template { margin-bottom:8px; }
  .cal-template h4 {
    font-size:13px; font-weight:600; color:#374151; margin-bottom:4px;
  }
  .cal-template .tl-block { padding:6px 0; }
  .cal-template .tl-time { width:56px; }

  /* 四阶段图 */
  .stage-map {
    display:flex; gap:6px; margin-top:8px;
  }
  .stage-box {
    flex:1; border-radius:8px; padding:8px 6px; text-align:center;
    font-size:11px; border:1.5px solid transparent;
  }
  .stage-box.past { background:#f9fafb; color:#9ca3af; border-color:#e5e7eb; }
  .stage-box.now { background:#fef2f2; color:#d93025; border-color:#d93025; font-weight:700; }
  .stage-box.future { background:#f8f9fa; color:#6b7280; border-color:#e5e7eb; }
  .stage-box .s-date { font-size:10px; margin-top:2px; opacity:.8; }
  .stage-box .s-mark { font-size:10px; margin-top:2px; font-weight:700; }

  /* 关键节点 */
  .milestones { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .mstone {
    font-size:11px; padding:3px 8px; border-radius:99px;
    background:#f3f4f6; color:#6b7280;
  }
  .mstone.current { background:#fef2f2; color:#d93025; font-weight:600; }

  /* 汇报区 */
  .report-area {
    width:100%; min-height:60px; border:1px solid #e5e7eb;
    border-radius:8px; padding:8px; font-size:13px;
    font-family:inherit; resize:vertical;
  }
  .report-btn {
    background:#1d4ed8; color:#fff; border:none; border-radius:6px;
    padding:8px 16px; font-size:13px; cursor:pointer; margin-top:8px;
  }
  .report-btn:hover { background:#1e40af; }
  .report-hint { font-size:11px; color:#6b7280; margin-top:6px; }

  /* 难度档案表格 */
  .diff-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .diff-table th, .diff-table td { padding:6px 8px; text-align:left; border-bottom:1px solid #f3f4f6; }
  .diff-table th { color:#6b7280; font-weight:600; font-size:11px; }
  .diff-badge {
    display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px;
  }
  .diff-badge.low { background:#f0fdf4; color:#059669; }
  .diff-badge.mid { background:#fff7ed; color:#ea580c; }
  .diff-badge.high { background:#fef2f2; color:#d93025; }

  /* 底部 */
  .footer {
    margin-top:20px; font-size:11px; color:#9ca3af;
    text-align:center; line-height:1.6;
  }

  @media (max-width:400px) {
    .topbar h1 { font-size:18px; }
    .topbar .countdown { font-size:24px; }
    .card { padding:12px 14px; }
    .tl-actions { flex-direction:row; gap:8px; }
  }
</style>
</head>

<div class="wrap">

      每天汇报一次即可，不用逐个提交。例子：<span style="color:#6b7280;">"今天单词120刷完，社心第1讲听到45min，政治第3讲听完，其他没动"</span>
    </div>
    <div class="report-hint" id="report-hint"></div>
    <div id="report-result" style="margin-top:10px;font-size:12px;color:#374151;display:none;"></div>
  </div>

  <!-- 科目三层进度（JS 从 CONFIG 渲染） -->
  <div class="card" id="subjects-card"></div>

  <!-- 四阶段 + 关键节点（JS 从 CONFIG 渲染） -->
  <div class="card" id="roadmap-card"></div>

  <!-- 日历维度（折叠区，JS 从 CONFIG 渲染） -->
  <div class="card" id="calendar-card"></div>

  <!-- 难度档案折叠区（JS 从 CONFIG 渲染） -->
  <div class="card" id="difficulty-card"></div>

  <!-- 汇报极简说明 -->
  <div class="card" id="howto-card"></div>

  <div class="footer" id="page-footer"></div>

</div>

  return new Date(y, m - 1, d);
}

// 从 CONFIG 构建任务数据库
function buildTaskDB() {
  const db = {};
  Object.values(CONFIG.templates).forEach(tpl => {
    tpl.tasks.forEach(t => {
      if (!db[t.task]) {
        const diffTask = CONFIG.difficulty.tasks.find(dt => dt.task === t.task);
        db[t.task] = {
          type: t.type,
          diff: t.diff,
          resistance: diffTask ? diffTask.resistance : "中",
          movable: t.movable !== false,
          duration: 60
        };
      }
    });
  });
  return db;
}

// 模板引用（通用：按日期类型读取 CONFIG.templates）
function getTemplate(dayTypeKey) {
  if (dayTypeKey === "holiday") return CONFIG.templates.holiday;
  if (dayTypeKey === "weekend") return CONFIG.templates.weekend;

// ==================== 工具函数（通用）====================
function daysBetween(a, b) {
  const ms = 24 * 60 * 60 * 1000;
  return Math.round((b - a) / ms);
}

function parseTimeRange(str) {
  if (str === "通勤") return parseTimeRange(CONFIG.project.commuteRange);
  const parts = str.split(/[–\-]/);
  if (parts.length !== 2) return null;
  const [h1, m1] = parts[0].trim().split(":").map(Number);
  const [h2, m2] = parts[1].trim().split(":").map(Number);
  return { h1, m1, h2, m2 };
}

function timeToMinutes(h, m) { return h * 60 + m; }

function getBlockMinutes(block) {
  const t = parseTimeRange(block.time);
  if (!t) return 60;
  let end = timeToMinutes(t.h2, t.m2);
  let start = timeToMinutes(t.h1, t.m1);
  if (end < start) end += 24 * 60;
  return end - start;
}

function isBlockPast(block, nowH, nowM) {
  const t = parseTimeRange(block.time);
  if (!t) return false;
  const now = timeToMinutes(nowH, nowM);
  const end = timeToMinutes(t.h2, t.m2);
  return now > end;
}

function isBlockCurrent(block, nowH, nowM) {
  const t = parseTimeRange(block.time);
  if (!t) return false;
  const now = timeToMinutes(nowH, nowM);
  const start = timeToMinutes(t.h1, t.m1);
  const end = timeToMinutes(t.h2, t.m2);
  return now >= start && now <= end;
}

// 日期类型判定（通用：遍历 CONFIG.holidays）
function getDayType(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const w = date.getDay();
  // 假期判定
  for (const h of CONFIG.holidays) {
    const [sy, sm, sd] = h.start.split("-").map(Number);
    const [ey, em, ed] = h.end.split("-").map(Number);
    const start = new Date(sy, sm - 1, sd);
    const end = new Date(ey, em - 1, ed);
    const cur = new Date(y, m - 1, d);
    if (cur >= start && cur <= end) {
      const dayNum = Math.round((cur - start) / (24 * 60 * 60 * 1000)) + 1;
      const ht = CONFIG.dayTypes.find(d => d.key === "holiday");
      return { type: "holiday", label: h.name + " Day " + dayNum, avail: ht ? ht.avail : "≈8–10h" };
    }
  }
  // 周末 / 工作日（标签与可支配时长统一从 CONFIG.dayTypes 读取）
  const dtMap = {};
  CONFIG.dayTypes.forEach(d => { dtMap[d.key] = d; });
  if (w === 0 || w === 6) return { type: "weekend", label: dtMap.weekend.label, avail: dtMap.weekend.avail };
  return { type: "workday", label: dtMap.workday.label, avail: dtMap.workday.avail };
}

function renderSubjects() {
  const container = document.getElementById("subjects-card");
  if (!container) return;
  let html = '<h2>' + CONFIG.ui.progressTitle + ' <span class="tag">' + CONFIG.ui.progressTag + '</span></h2>';
  CONFIG.subjects.forEach(subj => {
    html += '<div class="subj-card">';
    html += '<div class="subj-name">' + subj.name + '<span class="st">' + subj.subtitle + '</span></div>';
    CONFIG.progressLayers.forEach(layer => {
      const layerData = subj.layers[layer.key];
      const pctText = layerData.missing ? "未记录" : (layerData.approx ? "≈" + layerData.pct + "%" : layerData.pct + "%");
      const barWidth = layerData.missing ? 0 : layerData.pct;
      const barColor = layerData.color;
      const missingClass = layerData.missing ? " missing" : "";
      html += '<div class="layer-row">';
      html += '<div class="layer-label">' + layer.label + '</div>';
      html += '<div class="layer-bar-wrap"><div class="layer-bar" style="width:' + barWidth + '%;background:' + barColor + ';"></div></div>';
      html += '<div class="layer-pct' + missingClass + '">' + pctText + '</div>';
      html += '</div>';
    });
    html += '<div class="subj-source">' + subj.source + '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function renderRoadmap() {
  const container = document.getElementById("roadmap-card");
  if (!container) return;

  // 计算各科实际完成度（基于 CONFIG.subjects 三层进度）
  let totalWeight = 0, totalDone = 0;
  let delayedSubjects = [];
  CONFIG.subjects.forEach(subj => {
    const w = { "社心": 80, "普心 / 心理学导论": 90, "研究方法": 80, "外语": 100, "政治": 100, "综合写作": 50 }[subj.name] || 50;
    let subjDone = 0, subjTotal = 0;
    CONFIG.progressLayers.forEach(layer => {
      const ld = subj.layers[layer.key];
      if (!ld.missing) {
        subjDone += ld.pct;
        subjTotal += 100;
      }
    });
    const subjPct = subjTotal > 0 ? Math.round(subjDone / subjTotal * 100) : 0;
    totalDone += subjPct * w;
    totalWeight += w;
    if (subj.name === "社心" && subj.layers.watch.pct < 30) delayedSubjects.push("社心");
    if (subj.name === "普心 / 心理学导论" && subj.layers.watch.pct < 85) delayedSubjects.push("普心收尾");
    if (subj.name === "研究方法" && subj.layers.watch.pct < 50) delayedSubjects.push("研方法刷题");
  });
  const overallPct = totalWeight > 0 ? Math.round(totalDone / totalWeight) : 0;

  let html = '<h2>' + CONFIG.ui.roadmapTitle + ' <span class="tag">' + CONFIG.ui.roadmapTag + '</span></h2>';
  html += '<div style="font-size:12px;color:#6b7280;margin-bottom:10px;">';
  html += '整体加权完成度：' + overallPct + '%（基于各科三层进度 · 无记录层不计入）';
  if (delayedSubjects.length > 0) {
    html += ' · <span style="color:#d93025;">延期预警：' + delayedSubjects.join("、") + '</span>';
  }
  html += '</div>';
  html += '<div class="stage-map">';
  CONFIG.stages.forEach(stage => {
    let actualMark = stage.mark;
    let extraCls = stage.status;
    if (stage.status === "now") {
      actualMark = "◀ 现在 · 实际 " + overallPct + "%";
      if (delayedSubjects.length > 0) {
        actualMark += " · <span style=\'color:#d93025\'>延期" + delayedSubjects.length + "项</span>";
        extraCls += " delayed";
      }
    }
    html += '<div class="stage-box ' + extraCls + '">';
    html += '<div>' + stage.key + ' · ' + stage.name + '</div>';
    html += '<div class="s-date">' + stage.dateRange + '</div>';
    html += '<div class="s-mark">' + actualMark + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="milestones">';
  CONFIG.milestones.forEach(ms => {
    const cls = ms.isCurrent ? 'mstone current' : 'mstone';
    html += '<span class="' + cls + '">' + ms.date + ' ' + ms.label + '</span>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function renderTimeline() {
  const container = document.getElementById("timeline-container");
  const now = new Date();
  const nowH = now.getHours();
  const nowM = now.getMinutes();
const dayInfo = getDayType(now);

  // 更新顶部信息（dateStr 先于时间线生成使用）
  const dateStr = now.getFullYear() + "-" + (now.getMonth() + 1).toString().padStart(2, "0") + "-" + now.getDate().toString().padStart(2, "0");
  const weekDays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  // 动态生成当日任务（基于真源实际进度）
  let plan = buildTimelineTasks(dayInfo.type, dateStr);
  currentPlan = plan;

  document.getElementById("date-meta").textContent = dateStr + " · " + weekDays[now.getDay()] + " · 动态重排";
  document.getElementById("countdown").innerHTML = daysBetween(now, EXAM_DATE) + "<small>" + CONFIG.ui.countdownLabel + "</small>";
  document.getElementById("page-title").textContent = CONFIG.project.name;
  document.getElementById("exam-label").textContent = CONFIG.project.subtitle + " " + CONFIG.project.examDate.slice(5).replace("-", "/");

  const badge = document.getElementById("daytype-badge");
  badge.textContent = dayInfo.label;
  badge.className = "daytype " + dayInfo.type;
  document.getElementById("avail-time").textContent = "今日可支配 " + dayInfo.avail;

  // 渲染时间轴
  let html = "";
  plan.forEach((block) => {
    const past = isBlockPast(block, nowH, nowM);
    const current = isBlockCurrent(block, nowH, nowM);
    const done = completedTasks.has(block.id);
    const skipped = skippedTasks.has(block.id);

    let cls = "tl-block";
    if (done || skipped) cls += " completed";
    else if (current) cls += " now";
    else if (past) cls += " past";

    let diffTag = "";
    if (block.diff === "低") diffTag = '<span class="tl-tag diff-low">低</span>';
    else if (block.diff === "中") diffTag = '<span class="tl-tag diff-mid">中</span>';
    else if (block.diff === "中高") diffTag = '<span class="tl-tag diff-mid">中高</span>';
    else if (block.diff === "高") diffTag = '<span class="tl-tag diff-high">高</span>';

    const typeInfo = CONFIG.taskTypes[block.type] || { label: block.type, cssClass: block.type };
    let statusIcon = done ? "✓" : (skipped ? "⊘" : "○");
    let btnCls = "btn-done" + (done ? " completed" : "");

    html += '<div class="' + cls + '" data-id="' + block.id + '">';
    html += '<div class="tl-time">' + block.time + '</div>';
    html += '<div class="tl-content">';
    html += '<div class="tl-task">' + block.task + (done ? " ✅" : "") + (skipped ? " ⊘ 已跳过" : "") + '</div>';
    if (block.desc) html += '<div class="tl-desc">' + block.desc + '</div>';
    html += '<span class="tl-tag ' + typeInfo.cssClass + '">' + typeInfo.label + '</span>';
    html += diffTag;
    html += '</div>';
    html += '<div class="tl-actions">';
    if (block.diff != null) {   // 无难度等级（留白/缓冲）块不可操作，语义见 CONFIG.templates
      html += '<button class="' + btnCls + '" onclick="toggleDone(\'' + block.id + '\')" title="标记完成">' + statusIcon + '</button>';
      if (!done && !skipped && !past) {
        html += '<button class="btn-skip" onclick="skipTask(\'' + block.id + '\')" title="跳过/顺延">顺延</button>';
      }
    }
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
  updateReplanBanner();
}

function toggleDone(id) {
  if (completedTasks.has(id)) completedTasks.delete(id);
  else { completedTasks.add(id); skippedTasks.delete(id); }
  renderTimeline();
}

function skipTask(id) {
  if (skippedTasks.has(id)) skippedTasks.delete(id);
  else { skippedTasks.add(id); completedTasks.delete(id); }
  renderTimeline();
}

function updateReplanBanner() {
  const area = document.getElementById("replan-area");
  const now = new Date();
  const nowH = now.getHours();
  const nowM = now.getMinutes();
  const nowMin = timeToMinutes(nowH, nowM);

  let done = 0, skip = 0, pending = 0;
  let pendingHigh = [];
  currentPlan.forEach(b => {
    if (completedTasks.has(b.id)) done++;
    else if (skippedTasks.has(b.id)) skip++;
    else {
      pending++;
      if (b.diff === "高" || b.diff === "中高") pendingHigh.push(b.task);
    }
  });

  // 22:00 后高难度告警
  if (nowMin >= timeToMinutes(22, 0) && pendingHigh.length > 0 && !isReplanned) {
    let html = '<div class="replan-banner">';
    html += '<div class="replan-title">⚠️ 高难度任务建议顺延</div>';
    html += '<div>当前 22:00 后，以下高难度任务不建议今晚硬排：</div>';
    html += '<ul class="defer-list">';
    pendingHigh.forEach(t => {
      html += '<li>' + t + '<span class="defer-reason"> · 难度高 + 时段已晚 → 建议顺延明日，且拆解为 3 步</span></li>';
    });
    html += '</ul>';
    html += '<button class="replan-btn" onclick="doReplan()">一键重排剩余任务</button>';
    html += '</div>';
    area.innerHTML = html;
    return;
  }

  if (isReplanned) {
    area.innerHTML = '<div style="font-size:12px;color:#059669;margin-top:8px;">✅ 已按难度重排，当前为优化后计划</div>';
    return;
  }

  if (done > 0 || skip > 0) {
    let html = '<div style="font-size:12px;color:#6b7280;margin-top:8px;">';
    html += "已完成 " + done + " 项 · 已跳 " + skip + " 项 · 待做 " + pending + " 项";
    if (pendingHigh.length > 0) html += " · 含高难度 " + pendingHigh.length + " 项";
    html += '</div>';
    area.innerHTML = html;
  } else {
    area.innerHTML = "";
  }
}

function doReplan() {
  // 日课不挪：模板任务自带 movable 属性（CONFIG.templates），引擎不持有固定 ID
  let movableBlocks = [];
  currentPlan.forEach(b => {
    if (b.movable !== false && TASK_DB[b.task]?.movable) {
      if (!completedTasks.has(b.id) && !skippedTasks.has(b.id)) movableBlocks.push(b);
    }
  });

  const diffOrder = { "高": 3, "中高": 2, "中": 1, "低": 0 };
  movableBlocks.sort((a, b) => (diffOrder[b.diff] || 0) - (diffOrder[a.diff] || 0));
  isReplanned = true;

  let html = '<div class="replan-banner">';
  html += '<div class="replan-title">✅ 已按难度重排</div>';
  html += '<div><strong>重排后顺序（剩余可移动任务）：</strong></div>';
  html += '<ul class="defer-list">';
  movableBlocks.forEach(b => {
    let reason = "";
    if (b.diff === "高") reason = " → 拆为3步，排明日上午大块";
    else if (b.diff === "中高") reason = " → 趁状态尚可优先完成";
    else if (b.diff === "中") reason = " → 精力高峰时段";
    html += '<li><strong>' + b.task + '</strong>（' + b.diff + '）' + reason + '</li>';
  });
  html += '</ul>';
  if (movableBlocks.length === 0) html += '<div style="margin-top:4px;">无剩余可移动任务，日课与留白保留。</div>';
  html += '</div>';

  document.getElementById("replan-area").innerHTML = html;
}
