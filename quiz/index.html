<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2efe7">
<meta name="description" content="347 专业课（普心/社心）答题系统：只放已学章，答后即判，解析落到背诵手册考点卡号，错题进 3/7 天滚动。">
<title>347 · 专业课答题 · 普心 / 社心</title>
<style>
:root{
    --paper:#f2efe7;
    --paper-2:#e8e2d5;
    --paper-3:#fbf8f0;
    --ink:#131210;
    --ink-2:#34312b;
    --muted:#575247;
    --line:#131210;
    --line-soft:#bdb5a5;
    --red:#c92a12;
    --red-deep:#a8200b;
    --red-soft:#f3e0da;
    --ok:#2f5d3a;
    --ok-deep:#24482d;
    --ok-bg:#e7ebdf;
    --warn:#8a5a12;
    --warn-bg:#f3ead7;
    --dark:#141310;
    --dark-2:#1d1b16;
    --dark-muted:#c9c2b4;
    --white:#fffdf7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:"SFMono-Regular","Cascadia Mono","Roboto Mono","DejaVu Sans Mono",Consolas,monospace;
    --max:620px;
    --gutter:clamp(16px,4.5vw,24px);
    --tap:44px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    scroll-behavior:smooth;
    background:var(--paper);
  }
  body{
    margin:0;
    min-width:0;
    overflow-x:hidden;
    overflow-x:clip;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.42;
    background-image:radial-gradient(rgba(19,18,16,.045) .55px,transparent .55px);
    background-size:4px 4px;
  }
  h1,h2,h3,h4,p,figure,blockquote,ul,ol{margin:0}
  ul,ol{padding:0;list-style:none}
  button,input,textarea,select{font:inherit;color:inherit}
  button{
    border:0;
    background:none;
    padding:0;
    cursor:pointer;
    text-align:left;
  }
  a{color:inherit;text-decoration:none}
  svg{display:block}
  img{max-width:100%}
  ::selection{background:var(--red);color:var(--white)}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}
  [hidden]{display:none!important}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
  .nowrap{white-space:nowrap}
  .icon{
    width:22px;
    height:22px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:square;
    stroke-linejoin:miter;
    overflow:visible;
  }
  body.sheet-open{overflow:hidden}
  .sr-only{
    position:absolute!important;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .skip{
    position:fixed;
    top:-90px;
    left:12px;
    z-index:200;
    display:flex;
    align-items:center;
    min-height:var(--tap);
    padding:12px 16px;
    background:var(--ink);
    color:var(--paper);
    font-size:15px;
    line-height:1.2;
    transition:top .16s ease;
  }
  .skip:focus{top:calc(12px + var(--safe-t))}

  /* ---------- frame ---------- */
  .frame{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  #app{
    flex:1 0 auto;
    width:100%;
    min-width:0;
  }
  .shell{
    width:100%;
    max-width:var(--max);
    margin-inline:auto;
    padding-left:max(var(--gutter),var(--safe-l));
    padding-right:max(var(--gutter),var(--safe-r));
  }
  .hero.shell,.page-head.shell,.quiz-wrap.shell,.done.shell,.home-foot.shell{
    padding-left:max(var(--gutter),var(--safe-l));
    padding-right:max(var(--gutter),var(--safe-r));
  }

  /* ---------- masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--ink);
    background:var(--paper);
    padding-top:var(--safe-t);
  }
  .masthead-in{
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
  }
  .brand-mark{
    width:36px;
    height:36px;
    flex:0 0 36px;
    display:grid;
    place-items:center;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
  }
  .brand-t{min-width:0}
  .brand-t b{
    display:block;
    font-size:15px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .brand-t small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.12em;
    white-space:nowrap;
  }
  .issue{
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
    font-size:12px;
    line-height:1.4;
    color:var(--muted);
  }
  .issue .issue-day{
    color:var(--ink);
    font-weight:700;
    font-size:13px;
  }
  .issue .issue-dot{
    width:4px;height:4px;
    background:var(--red);
    align-self:center;
  }

  /* ---------- home hero ---------- */
  .hero{
    position:relative;
    border-bottom:1px solid var(--ink);
    padding:18px 0 22px;
    animation:rise .52s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .hero::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:52px;height:4px;
    background:var(--red);
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    line-height:1.4;
    letter-spacing:.13em;
    font-weight:700;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    flex:0 0 7px;
    background:var(--red);
  }
  .hero-date{
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .countline{
    display:flex;
    align-items:flex-end;
    gap:10px;
    margin-top:14px;
    min-width:0;
  }
  .count-num{
    display:block;
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(92px,26vw,124px);
    font-weight:700;
    line-height:.78;
    letter-spacing:-.09em;
    font-variant-numeric:lining-nums tabular-nums;
  }
  .count-unit{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:7px;
    flex:0 0 auto;
  }
  .count-unit b{
    font-size:21px;
    line-height:.95;
    font-weight:700;
  }
  .count-unit span{
    color:var(--muted);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.06em;
    white-space:nowrap;
  }
  .hero-title{
    margin-top:14px;
    font-size:clamp(34px,10vw,44px);
    font-weight:700;
    line-height:1.08;
    letter-spacing:-.055em;
    max-width:9em;
    text-wrap:balance;
  }
  .hero-title span{
    position:relative;
    display:inline-block;
  }
  .hero-title span::after{
    content:"";
    position:absolute;
    left:0;right:0;
    bottom:.01em;
    height:.08em;
    background:var(--red);
  }
  .hero-lead{
    margin-top:12px;
    max-width:34em;
    color:var(--ink-2);
    font-size:15px;
    line-height:1.75;
    text-wrap:pretty;
  }
  .hero-lead b{color:var(--ink);font-weight:700}
  .hero-cta{
    display:flex;
    width:100%;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:54px;
    margin-top:16px;
    padding:12px 14px;
    border:1px solid var(--red);
    background:var(--red);
    color:var(--white);
    font-size:17px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.01em;
    transition:background .16s ease,border-color .16s ease,color .16s ease,transform .12s ease;
  }
  .hero-cta::after{
    content:"→";
    font-family:var(--mono);
    font-size:18px;
    line-height:1;
  }
  .hero-cta:active{transform:translateY(1px);background:var(--red-deep)}
  .hero-cta--dark{border-color:var(--ink);background:var(--ink)}
  .hero-cta--dark:active{background:var(--dark-2)}
  .hero-foot{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .hero-facts{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    margin-top:16px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .hero-fact{
    min-width:0;
    padding:9px 9px 9px 0;
  }
  .hero-fact + .hero-fact{
    padding-left:9px;
    border-left:1px solid var(--line-soft);
  }
  .hero-fact span{
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
    letter-spacing:.03em;
  }
  .hero-fact b{
    display:block;
    margin-top:2px;
    font-size:16px;
    line-height:1.35;
    font-weight:700;
    overflow-wrap:anywhere;
  }

  /* ---------- advice ---------- */
  .advice{
    position:relative;
    margin-top:18px;
    padding:15px 15px 14px 17px;
    background:var(--paper-2);
    border-left:5px solid var(--red);
  }
  .advice-kicker{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    color:var(--red);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.1em;
  }
  .advice-kicker span{
    color:var(--muted);
    font-weight:400;
    letter-spacing:.02em;
  }
  .advice-title{
    margin-top:7px;
    font-size:23px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.035em;
    overflow-wrap:anywhere;
  }
  .advice p{
    margin-top:5px;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.6;
  }
  .advice p b{color:var(--ink);font-weight:700}
  .advice-order{
    margin-top:7px!important;
    padding-top:7px;
    border-top:1px solid rgba(19,18,16,.16);
    color:var(--muted)!important;
    font-size:11px!important;
    letter-spacing:.02em;
  }

  /* ---------- entries ---------- */
  .entries{
    margin-top:24px;
    border-top:2px solid var(--ink);
  }
  .entry{
    display:grid;
    grid-template-columns:30px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:70px;
    padding:14px 0;
    border-bottom:1px solid var(--line-soft);
    transition:background .16s ease;
  }
  .entry:active{background:rgba(19,18,16,.035)}
  .entry-num{
    align-self:start;
    padding-top:5px;
    color:var(--red);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.04em;
  }
  .entry-main{min-width:0;display:block}
  .entry-title{
    display:block;
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.035em;
  }
  .entry-desc{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
    overflow-wrap:anywhere;
  }
  .entry-desc b{color:var(--ink);font-weight:700}
  .entry-side{
    display:inline-flex;
    align-items:center;
    gap:3px;
    min-height:var(--tap);
    padding-left:6px;
    color:var(--ink);
    font-size:12px;
    line-height:1.35;
    white-space:nowrap;
  }
  .entry-side .icon{width:14px;height:14px;color:var(--red)}
  .entry-wrap{border-bottom:1px solid var(--line-soft)}
  .entry-wrap .entry{border-bottom:0}
  .entry-sub{
    display:flex;
    align-items:center;
    width:100%;
    min-height:var(--tap);
    padding:0 0 10px 40px;
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
    text-align:left;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .entry-sub:active{color:var(--ink)}
  .home-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:22px;
    padding:12px 0 24px;
    border-top:1px solid var(--line-soft);
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    letter-spacing:.04em;
  }
  .home-foot b{font-weight:600;color:var(--ink-2)}

  /* ---------- page head ---------- */
  .page-head{
    padding:22px 0 16px;
    border-bottom:1px solid var(--ink);
  }
  .page-head .eyebrow{color:var(--red)}
  .page-head h1{
    margin-top:10px;
    font-size:clamp(32px,9vw,40px);
    line-height:1.06;
    letter-spacing:-.055em;
    font-weight:700;
    text-wrap:balance;
  }
  .page-head p{
    margin-top:8px;
    max-width:34em;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    text-wrap:pretty;
  }
  .page-head p b{color:var(--ink);font-weight:700}

  /* ---------- chapters ---------- */
  .subject-block{margin-top:24px}
  .subject-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    padding-top:10px;
    border-top:2px solid var(--ink);
  }
  .subject-head h2{
    font-size:29px;
    line-height:1.1;
    letter-spacing:-.045em;
    font-weight:700;
  }
  .subject-head span{
    color:var(--muted);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.4;
    text-align:right;
    white-space:nowrap;
  }
  .chapter-list{border-top:1px solid var(--line-soft);margin-top:10px}
  .chapter-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) 18px;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:68px;
    padding:12px 0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
  }
  .chapter-row:active{background:rgba(19,18,16,.035)}
  .chapter-no{
    align-self:start;
    padding-top:3px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
  }
  .chapter-row--learned .chapter-no{color:var(--red)}
  .chapter-main{min-width:0;display:block}
  .chapter-title{
    display:flex;
    align-items:baseline;
    gap:7px;
    flex-wrap:wrap;
    font-size:19px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-.025em;
  }
  .chapter-title em{
    color:var(--muted);
    font-style:normal;
    font-family:var(--mono);
    font-size:10px;
    font-weight:400;
    letter-spacing:.02em;
  }
  .chapter-meta{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  }
  .chapter-meta b{color:var(--ink-2);font-weight:600}
  .chapter-bar{
    display:block;
    height:3px;
    margin-top:7px;
    background:var(--paper-2);
    overflow:hidden;
  }
  .chapter-bar i{
    display:block;
    height:100%;
    width:0;
    background:var(--red);
    transition:width .3s ease;
  }
  .chapter-go{
    color:var(--line-soft);
    display:grid;
    place-items:center;
    width:18px;height:44px;
  }
  .chapter-row .icon{width:15px;height:15px}
  .chapter-row--locked{
    opacity:.56;
    cursor:not-allowed;
  }
  .chapter-row--locked .chapter-go{color:var(--muted)}
  .chapter-row--locked .chapter-title{font-weight:600}
  .locked-details{margin-top:16px;border-top:1px solid var(--line-soft)}
  .locked-details summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:var(--tap);
    padding:10px 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    cursor:pointer;
    list-style:none;
  }
  .locked-details summary::-webkit-details-marker{display:none}
  .locked-details summary::after{
    content:"＋";
    font-family:var(--mono);
    color:var(--red);
    font-size:15px;
  }
  .locked-details[open] summary::after{content:"－"}
  .locked-list{border-top:1px solid var(--line-soft)}
  .locked-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink);
    text-align:left;
    opacity:.66;
  }
  .locked-row:active{background:var(--paper-2)}
  .locked-row .chapter-no{padding-top:0;font-size:11px}
  .locked-row .locked-title{display:block;min-width:0;font-size:14px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
  .locked-row .locked-count{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}
  .locked-row .locked-count .icon{width:10px;height:10px}
  .chapter-note{
    margin:18px 0 24px;
    padding:12px 14px;
    background:var(--paper-3);
    border-left:3px solid var(--line-soft);
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  .chapter-note b{color:var(--ink-2)}

  /* ---------- quiz ---------- */
  body.has-bar{padding-bottom:calc(78px + var(--safe-b))}
  .quiz-head{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(242,239,231,.97);
    border-bottom:1px solid var(--line-soft);
    padding-top:var(--safe-t);
    backdrop-filter:blur(8px);
  }
  .quiz-head-in{
    display:grid;
    grid-template-columns:44px minmax(0,1fr) 44px;
    align-items:center;
    gap:6px;
    min-height:58px;
  }
  .icon-btn{
    display:grid;
    place-items:center;
    width:var(--tap);
    height:var(--tap);
    min-width:var(--tap);
    min-height:var(--tap);
    color:var(--ink);
    transition:background .16s ease;
  }
  .icon-btn:active{background:var(--paper-2)}
  .icon-btn .icon{width:21px;height:21px}
  .quiz-head-title{min-width:0;text-align:center}
  .quiz-head-title b{
    display:block;
    font-size:14px;
    line-height:1.35;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .quiz-head-title span{
    display:block;
    margin-top:1px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.35;
    letter-spacing:.04em;
  }
  .progress-track{
    height:3px;
    background:var(--paper-2);
    overflow:hidden;
  }
  .progress-track i{
    display:block;
    height:100%;
    width:0;
    background:var(--red);
    transition:width .28s ease;
  }
  .quiz-wrap{
    padding:16px 0 26px;
  }
  .q-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-height:28px;
    padding-bottom:11px;
    border-bottom:1px solid var(--line-soft);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:2px 7px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:11px;
    line-height:1.4;
    font-weight:600;
    white-space:nowrap;
  }
  .chip--red{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .chip--ok{
    border-color:var(--ok);
    background:var(--ok-bg);
    color:var(--ok-deep);
  }
  .chip--plain{border-color:var(--ink);color:var(--ink)}
  .q-meta .q-subject{
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .q-meta .q-num{
    margin-left:auto;
    color:var(--muted);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.5;
    white-space:nowrap;
  }
  .q-stem{
    margin-top:14px;
    font-size:clamp(19px,5.1vw,22px);
    line-height:1.78;
    font-weight:500;
    letter-spacing:.005em;
    text-wrap:pretty;
    overflow-wrap:anywhere;
  }
  .q-stem strong{font-weight:800;color:var(--ink)}
  .blank{
    display:inline-block;
    width:2.5em;
    height:1.05em;
    margin:0 .12em;
    border-bottom:2px solid var(--red);
    vertical-align:-.08em;
  }
  .q-note{
    margin-top:10px;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
    letter-spacing:.01em;
  }

  /* ---------- options ---------- */
  .options{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .option{
    display:flex;
    align-items:flex-start;
    gap:11px;
    width:100%;
    min-height:52px;
    padding:12px 12px;
    border:1px solid var(--line-soft);
    background:var(--paper-3);
    color:var(--ink);
    text-align:left;
    transition:border-color .14s ease,background .14s ease,color .14s ease;
  }
  .option:active{background:var(--paper-2)}
  .option-key{
    display:grid;
    place-items:center;
    width:32px;height:32px;
    flex:0 0 32px;
    border:1px solid var(--line-soft);
    border-radius:50%;
    background:transparent;
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:13px;
    line-height:1;
    font-weight:700;
    transition:all .14s ease;
  }
  .option-text{
    flex:1 1 auto;
    min-width:0;
    padding-top:3px;
    font-size:15px;
    line-height:1.62;
    overflow-wrap:anywhere;
  }
  .option-text strong{font-weight:800}
  .option.is-selected{
    border-color:var(--red);
    background:var(--red-soft);
  }
  .option.is-selected .option-key{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .option.is-correct{
    border-color:var(--ok);
    background:var(--ok-bg);
  }
  .option.is-correct .option-key{
    border-color:var(--ok);
    background:var(--ok);
    color:var(--white);
  }
  .option.is-wrong{
    border-color:var(--red);
    background:var(--red-soft);
  }
  .option.is-wrong .option-key{
    border-color:var(--red);
    background:var(--red);
    color:var(--white);
  }
  .option.is-dim{opacity:.58}
  .option[aria-disabled="true"]{cursor:default}
  .option-flag{
    align-self:center;
    margin-left:2px;
    color:var(--ok-deep);
    font-family:var(--mono);
    font-size:9px;
    line-height:1.3;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .option.is-wrong .option-flag{color:var(--red-deep)}

  /* ---------- recall ---------- */
  .recall{margin-top:16px}
  .recall label{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .recall label span{color:var(--line-soft);font-family:var(--mono);font-size:10px}
  .recall textarea{
    display:block;
    width:100%;
    min-height:86px;
    padding:11px 12px;
    border:1px solid var(--line-soft);
    border-radius:0;
    background:var(--paper-3);
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    resize:vertical;
    -webkit-appearance:none;
  }
  .recall textarea:focus{border-color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px var(--ink)}
  .recall textarea[readonly]{background:var(--paper-2);color:var(--ink-2)}
  .recall textarea::placeholder{color:#8b8578}
  .recall-hint{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
    line-height:1.6;
  }
  .recall-hint b{color:var(--ink-2);font-weight:600}

  /* ---------- result ---------- */
  .result{
    margin-top:18px;
    border:1px solid var(--line-soft);
    border-left:5px solid var(--ink);
    background:var(--paper-3);
    animation:reveal .3s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes reveal{from{opacity:.01;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .result--ok{border-left-color:var(--ok);background:var(--ok-bg)}
  .result--bad{border-left-color:var(--red);background:var(--red-soft)}
  .result--warn{border-left-color:var(--warn);background:var(--warn-bg)}
  .result--neutral{border-left-color:var(--ink);background:var(--paper-3)}
  .result-top{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    border-bottom:1px solid rgba(19,18,16,.18);
  }
  .result-mark{
    display:grid;
    place-items:center;
    width:34px;height:34px;
    border:1px solid currentColor;
    color:var(--ink);
    font-family:var(--mono);
    font-size:17px;
    line-height:1;
    font-weight:700;
  }
  .result--ok .result-mark{color:var(--ok-deep)}
  .result--bad .result-mark{color:var(--red-deep)}
  .result--warn .result-mark{color:var(--warn)}
  .result-title{min-width:0}
  .result-title b{
    display:block;
    font-size:16px;
    line-height:1.35;
    font-weight:700;
  }
  .result-title span{
    display:block;
    margin-top:2px;
    color:var(--ink-2);
    font-size:11px;
    line-height:1.5;
  }
  .result-score{
    align-self:start;
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:10px;
    line-height:1.45;
    text-align:right;
    white-space:nowrap;
  }
  .result-body{padding:13px 13px 14px}
  .block-kicker{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--red);
    font-size:10px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.12em;
  }
  .block-kicker::before{
    content:"";
    width:6px;height:6px;
    background:var(--red);
  }
  .ans-block{margin-top:2px}
  .ans-choice{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:7px;
    font-size:15px;
    line-height:1.7;
    overflow-wrap:anywhere;
  }
  .ans-choice .mono{
    flex:0 0 auto;
    padding:1px 5px;
    border:1px solid var(--ok);
    color:var(--ok-deep);
    font-size:11px;
    line-height:1.5;
    font-weight:700;
  }
  .ans-tokens{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .ans-tokens li{
    display:grid;
    grid-template-columns:22px minmax(0,1fr);
    gap:8px;
    align-items:start;
    font-size:15px;
    line-height:1.68;
  }
  .ans-tokens li > .mono{
    padding-top:1px;
    color:var(--red);
    font-size:10px;
    line-height:1.9;
    font-weight:700;
  }
  .ans-text{
    margin-top:7px;
    font-size:15px;
    line-height:1.78;
    overflow-wrap:anywhere;
  }
  .ans-text strong{font-weight:800}
  .analysis{
    margin-top:13px;
    padding-top:11px;
    border-top:1px dashed var(--line-soft);
  }
  .analysis p{
    margin-top:6px;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.72;
    overflow-wrap:anywhere;
  }
  .analysis--brief p{color:var(--muted);font-size:12px}
  .locate{
    display:grid;
    grid-template-columns:9px minmax(0,1fr);
    gap:9px;
    margin-top:13px;
    padding-top:11px;
    border-top:1px solid var(--line-soft);
  }
  .locate-mark{
    width:9px;height:9px;
    margin-top:4px;
    background:var(--red);
  }
  .locate-body{min-width:0}
  .locate-k{
    color:var(--red);
    font-size:10px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.1em;
  }
  .locate-body p{
    margin-top:3px;
    font-size:13px;
    line-height:1.6;
    overflow-wrap:anywhere;
  }
  .locate-body p.mono{
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    letter-spacing:.03em;
  }
  .link-fuzzy{
    display:inline-flex;
    align-items:center;
    min-height:var(--tap);
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    text-decoration:underline;
    text-underline-offset:4px;
  }
  .link-fuzzy:active{color:var(--ink)}
  .res-note{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line-soft);
    color:var(--muted);
    font-size:11px;
    line-height:1.65;
  }

  /* ---------- quiz bar ---------- */
  .quiz-bar{
    position:fixed;
    left:50%;
    bottom:0;
    z-index:50;
    transform:translateX(-50%);
    width:min(100%,var(--max));
    display:flex;
    align-items:stretch;
    gap:8px;
    padding:9px max(var(--gutter),var(--safe-l)) calc(9px + var(--safe-b)) max(var(--gutter),var(--safe-r));
    background:rgba(242,239,231,.97);
    border-top:1px solid var(--ink);
    backdrop-filter:blur(10px);
  }
  .bar-prev{
    flex:0 0 88px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:8px 8px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:13px;
    line-height:1.3;
    font-weight:600;
  }
  .bar-prev:disabled{opacity:.38;cursor:not-allowed}
  .bar-primary{
    flex:1 1 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:50px;
    padding:9px 12px;
    border:1px solid var(--red);
    background:var(--red);
    color:var(--white);
    font-size:16px;
    line-height:1.3;
    font-weight:700;
    transition:background .16s ease,border-color .16s ease;
  }
  .bar-primary::after{
    content:"→";
    font-family:var(--mono);
    font-size:16px;
    line-height:1;
  }
  .bar-primary:active{background:var(--red-deep);border-color:var(--red-deep)}
  .bar-primary:disabled{opacity:.42;cursor:not-allowed}
  .bar-primary--ink{background:var(--ink);border-color:var(--ink)}
  .bar-primary--ink:active{background:var(--dark-2)}
  .bar-grade{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    min-height:52px;
    padding:7px 8px;
    font-size:15px;
    line-height:1.25;
    font-weight:700;
  }
  .bar-grade span{
    font-family:var(--mono);
    font-size:9px;
    line-height:1.3;
    font-weight:400;
    letter-spacing:.04em;
    opacity:.8;
  }
  .bar-grade--bad{
    border:1px solid var(--red);
    background:var(--paper);
    color:var(--red-deep);
  }
  .bar-grade--bad:active{background:var(--red-soft)}
  .bar-grade--ok{
    border:1px solid var(--ok);
    background:var(--ok);
    color:var(--white);
  }
  .bar-grade--ok:active{background:var(--ok-deep)}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;
    left:50%;
    bottom:0;
    z-index:55;
    transform:translateX(-50%);
    width:min(100%,var(--max));
    background:rgba(242,239,231,.98);
    border-top:1px solid var(--ink);
    padding-bottom:var(--safe-b);
    backdrop-filter:blur(10px);
  }
  .tabbar-in{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .tab{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-height:58px;
    padding:7px 2px 6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.2;
    letter-spacing:.02em;
    text-align:center;
  }
  .tab .icon{width:21px;height:21px}
  .tab.is-active{color:var(--ink);font-weight:700}
  .tab.is-active .icon{color:var(--red)}
  .tab.is-active::before{
    content:"";
    position:absolute;
    top:0;left:24%;
    width:52%;height:2px;
    background:var(--red);
  }
  .tab:active{background:var(--paper-2)}
  body.has-tabbar{padding-bottom:calc(60px + var(--safe-b))}

  /* ---------- wrong book ---------- */
  .wrong-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-top:10px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-soft);
  }
  .wrong-head h2{
    font-size:25px;
    line-height:1.2;
    letter-spacing:-.04em;
    font-weight:700;
  }
  .wrong-head h2 em{
    color:var(--red);
    font-style:normal;
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0;
  }
  .wrong-head p{color:var(--muted);font-size:11px;line-height:1.5}
  .filters{
    display:flex;
    gap:6px;
    margin:12px 0 0;
    padding-bottom:2px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .filter{
    flex:0 0 auto;
    min-height:var(--tap);
    padding:8px 11px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:12px;
    line-height:1.3;
    font-weight:600;
    white-space:nowrap;
  }
  .filter.is-active{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }
  .wrong-list{margin-top:4px}
  .wrong-card{
    padding:14px 0 12px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .wrong-card + .wrong-card{border-top:0}
  .wrong-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
  }
  .wrong-meta .mono{font-size:9px}
  .wrong-stem{
    margin-top:7px;
    font-size:16px;
    line-height:1.65;
    font-weight:500;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .wrong-stem strong{font-weight:800}
  .wrong-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:9px;
  }
  .wrong-foot .wrong-stat{
    color:var(--muted);
    font-family:var(--mono);
    font-size:9px;
    line-height:1.5;
    letter-spacing:.02em;
  }
  .wrong-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:var(--tap);
    padding:8px 11px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:12px;
    line-height:1.3;
    font-weight:600;
    white-space:nowrap;
  }
  .mini-btn:active{background:var(--paper-2)}
  .mini-btn--red{border-color:var(--red);background:var(--red);color:var(--white)}
  .mini-btn--red:active{background:var(--red-deep)}
  .mini-btn--ghost{color:var(--muted)}
  .empty{
    margin:28px 0 10px;
    padding:22px 18px;
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
    background:var(--paper-3);
  }
  .empty .empty-mark{
    display:block;
    color:var(--red);
    font-family:var(--mono);
    font-size:28px;
    line-height:1;
    font-weight:700;
  }
  .empty h3{
    margin-top:9px;
    font-size:22px;
    line-height:1.3;
    letter-spacing:-.035em;
    font-weight:700;
  }
  .empty p{
    margin-top:6px;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .empty .hero-cta{margin-top:14px;min-height:50px;font-size:15px}

  /* ---------- progress ---------- */
  .acc-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    margin-top:14px;
    padding-bottom:15px;
    border-bottom:1px solid var(--ink);
  }
  .acc-num{
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(66px,18vw,88px);
    font-weight:700;
    line-height:.8;
    letter-spacing:-.075em;
  }
  .acc-num small{
    font-family:var(--mono);
    font-size:18px;
    font-weight:400;
    letter-spacing:0;
  }
  .acc-empty{
    color:var(--muted);
    font-family:var(--sans);
    font-size:30px;
    line-height:1.2;
    letter-spacing:-.03em;
    font-weight:700;
  }
  .acc-copy{text-align:right;padding-bottom:3px}
  .acc-copy b{display:block;font-size:13px;line-height:1.4;font-weight:700}
  .acc-copy span{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.5}
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--ink);
  }
  .stat-cell{
    padding:11px 10px 11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .stat-cell:nth-child(odd){border-right:1px solid var(--line-soft);padding-right:10px}
  .stat-cell:nth-child(even){padding-left:12px}
  .stat-cell:nth-last-child(-n+2){border-bottom:0}
  .stat-cell span{display:block;color:var(--muted);font-size:10px;line-height:1.4;letter-spacing:.04em}
  .stat-cell b{display:block;margin-top:2px;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.03em}
  .stat-cell b em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0}
  .panel{
    margin-top:20px;
    padding:14px;
    background:var(--paper-3);
    border:1px solid var(--line-soft);
  }
  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding-bottom:9px;
    border-bottom:1px solid var(--line-soft);
  }
  .panel-head h2{font-size:15px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
  .panel-head span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4;text-align:right}
  .week{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:5px;
    align-items:end;
    height:104px;
    padding-top:12px;
  }
  .day-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
  .day-bar{
    width:100%;
    max-width:26px;
    height:60px;
    background:transparent;
    border-bottom:1px solid var(--line-soft);
    position:relative;
    overflow:hidden;
  }
  .day-bar i{
    position:absolute;
    left:0;right:0;bottom:0;
    display:block;
    background:var(--red);
    height:0;
  }
  .day-col.is-today .day-bar{outline:1px solid var(--ink);outline-offset:1px}
  .day-count{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--muted)}
  .day-label{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--muted);white-space:nowrap}
  .day-col.is-today .day-label{color:var(--red);font-weight:700}
  .subj-row{
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .subj-row:last-child{border-bottom:0;padding-bottom:2px}
  .subj-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .subj-line b{font-size:14px;line-height:1.4;font-weight:700}
  .subj-line span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4;text-align:right}
  .subj-bar{height:3px;margin-top:6px;background:var(--paper-2);overflow:hidden}
  .subj-bar i{display:block;height:100%;background:var(--red)}
  .chapter-stat{
    display:grid;
    grid-template-columns:minmax(0,1fr) 74px;
    gap:10px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .chapter-stat:last-child{border-bottom:0;padding-bottom:0}
  .chapter-stat .cs-t{min-width:0}
  .chapter-stat b{display:block;font-size:12px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
  .chapter-stat span{display:block;color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.45}
  .chapter-stat .subj-bar{margin-top:4px}
  .data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .data-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:8px 8px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-size:13px;
    line-height:1.3;
    font-weight:700;
  }
  .data-btn--fill{background:var(--ink);color:var(--paper)}
  .data-btn:active{background:var(--paper-2)}
  .data-btn--fill:active{background:var(--dark-2)}
  .fine{
    margin-top:10px;
    color:var(--muted);
    font-size:10px;
    line-height:1.7;
  }
  .fine b{color:var(--ink-2);font-weight:600}
  .storage-ok{color:var(--ok-deep)}
  .storage-bad{color:var(--red)}
  .reset-zone{
    margin:18px 0 24px;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
  }
  .reset-btn{
    display:inline-flex;
    align-items:center;
    min-height:var(--tap);
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .reset-btn.is-confirm{color:var(--red);font-weight:700}

  /* ---------- done ---------- */
  .done{
    padding:34px 0 30px;
    text-align:center;
  }
  .done-stamp{
    display:inline-block;
    padding:6px 12px;
    border:2px solid var(--red);
    color:var(--red);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:.2em;
    transform:rotate(-3deg);
  }
  .done-num{
    margin-top:16px;
    color:var(--red);
    font-family:"Helvetica Neue",Arial,var(--sans);
    font-size:clamp(84px,25vw,112px);
    font-weight:700;
    line-height:.8;
    letter-spacing:-.08em;
  }
  .done-unit{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
  .done h1{
    margin-top:12px;
    font-size:clamp(30px,8vw,38px);
    line-height:1.12;
    letter-spacing:-.05em;
    font-weight:700;
    text-wrap:balance;
  }
  .done p{
    margin-top:8px;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .done-stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    margin-top:18px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--line-soft);
  }
  .done-stat{padding:10px 6px;border-right:1px solid var(--line-soft)}
  .done-stat:last-child{border-right:0}
  .done-stat b{display:block;font-size:22px;line-height:1.25;font-weight:700}
  .done-stat span{display:block;color:var(--muted);font-size:10px;line-height:1.4}
  .done-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .done-actions .hero-cta{margin-top:0}
  .done-ghost{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:9px 12px;
    border:1px solid var(--line-soft);
    background:transparent;
    color:var(--ink-2);
    font-size:14px;
    line-height:1.3;
    font-weight:600;
  }
  .done-ghost:active{background:var(--paper-2)}

  /* ---------- sheet ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:90;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(19,18,16,.46);
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{from{opacity:.01}to{opacity:1}}
  .sheet{
    width:min(100%,var(--max));
    max-height:90dvh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--paper);
    border-top:2px solid var(--ink);
    padding:0 max(var(--gutter),var(--safe-l)) calc(18px + var(--safe-b)) max(var(--gutter),var(--safe-r));
    animation:sheetUp .24s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.01}to{transform:translateY(0);opacity:1}}
  .sheet-head{
    position:sticky;
    top:0;
    z-index:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:14px 0 11px;
    background:var(--paper);
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-head .eyebrow{font-size:10px}
  .sheet-head h2{
    margin-top:4px;
    font-size:25px;
    line-height:1.12;
    letter-spacing:-.045em;
    font-weight:700;
  }
  .sheet-close{
    display:grid;
    place-items:center;
    width:var(--tap);
    height:var(--tap);
    margin-top:-6px;
    margin-right:-8px;
    color:var(--ink);
  }
  .sheet-close .icon{width:20px;height:20px}
  .sheet-lead{
    margin-top:11px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(44px,1fr));
    gap:6px;
    margin-top:13px;
  }
  .card-cell{
    display:grid;
    place-items:center;
    min-height:44px;
    aspect-ratio:1;
    border:1px solid var(--line-soft);
    background:var(--paper-3);
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:11px;
    line-height:1;
  }
  .card-cell.is-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-deep)}
  .card-cell.is-bad{border-color:var(--red);background:var(--red-soft);color:var(--red-deep)}
  .card-cell.is-open{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .card-cell.is-current{outline:2px solid var(--red);outline-offset:1px;background:var(--ink);color:var(--paper)}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
  }
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{width:9px;height:9px;display:inline-block;border:1px solid var(--line-soft)}
  .legend .l-ok{background:var(--ok-bg);border-color:var(--ok)}
  .legend .l-bad{background:var(--red-soft);border-color:var(--red)}
  .legend .l-cur{background:var(--ink);border-color:var(--ink)}
  .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .sheet-actions .data-btn{min-height:48px}
  .schedule-group{margin-top:15px}
  .schedule-day{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .schedule-day b{font-size:13px;line-height:1.4;font-weight:700}
  .schedule-day span{color:var(--muted);font-family:var(--mono);font-size:9px;line-height:1.4}
  .schedule-item{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:48px;
    padding:7px 0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
  }
  .schedule-item:active{background:var(--paper-2)}
  .schedule-item .mono{color:var(--red);font-size:9px;line-height:1.4}
  .schedule-item .s-stem{
    font-size:12px;
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .schedule-item .s-meta{color:var(--muted);font-family:var(--mono);font-size:8px;line-height:1.4;white-space:nowrap;text-align:right}
  .json-box{
    display:block;
    width:100%;
    min-height:170px;
    margin-top:11px;
    padding:10px 11px;
    border:1px solid var(--ink);
    border-radius:0;
    background:var(--paper-3);
    color:var(--ink-2);
    font-family:var(--mono);
    font-size:11px;
    line-height:1.55;
    resize:vertical;
    -webkit-appearance:none;
  }
  .json-box:focus{outline:2px solid var(--red);outline-offset:1px}
  .import-opts{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-top:10px;
  }
  .import-opts label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:var(--tap);
    color:var(--ink-2);
    font-size:12px;
    line-height:1.4;
    cursor:pointer;
  }
  .import-opts input{
    width:18px;height:18px;
    accent-color:var(--red);
    margin:0;
  }
  .import-error{
    margin-top:8px;
    padding:8px 10px;
    border-left:3px solid var(--red);
    background:var(--red-soft);
    color:var(--red-deep);
    font-size:12px;
    line-height:1.6;
  }
  .file-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
  }
  .file-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:var(--tap);
    padding:8px 10px;
    border:1px dashed var(--line-soft);
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
    cursor:pointer;
  }
  .file-btn:active{background:var(--paper-2)}
  .file-line .fine{margin-top:0;text-align:right}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;
    left:50%;
    bottom:calc(76px + var(--safe-b));
    z-index:120;
    transform:translate(-50%,10px);
    max-width:calc(100% - 32px);
    padding:10px 14px;
    background:var(--ink);
    color:var(--paper);
    font-size:12px;
    line-height:1.55;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
  }
  #toast.is-show{opacity:1;transform:translate(-50%,0)}
  body.has-bar #toast{bottom:calc(86px + var(--safe-b))}

  /* ---------- desktop ---------- */
  @media (min-width:768px){
    body{
      background:var(--paper-2);
      font-size:17px;
    }
    body::before{opacity:.3}
    .frame{
      max-width:var(--max);
      margin-inline:auto;
      background:var(--paper);
      border-left:1px solid var(--line-soft);
      border-right:1px solid var(--line-soft);
      box-shadow:0 0 0 1px rgba(19,18,16,.04);
    }
    .masthead-in{min-height:66px}
    .hero{padding-top:22px;padding-bottom:26px}
    .count-num{font-size:128px}
    .hero-title{font-size:46px}
    .hero-lead{font-size:16px}
    .quiz-head{position:sticky}
    .tabbar{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
    .quiz-bar{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
    #toast{max-width:420px}
    .option-text{font-size:16px}
    .q-stem{font-size:22px}
    .sheet{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  }

  @media (max-width:380px){
    :root{--gutter:15px}
    .brand-t small{display:none}
    .count-num{font-size:86px}
    .count-unit b{font-size:19px}
    .hero-title{font-size:33px}
    .hero-lead{font-size:14px}
    .hero-fact span{font-size:10px}
    .hero-fact b{font-size:15px}
    .advice-title{font-size:21px}
    .entry{grid-template-columns:26px minmax(0,1fr) auto;gap:8px}
    .entry-title{font-size:20px}
    .entry-side{font-size:11px}
    .subject-head h2{font-size:26px}
    .chapter-title{font-size:18px}
    .wrong-foot{align-items:flex-start;flex-direction:column;gap:6px}
    .wrong-actions{width:100%;justify-content:stretch}
    .wrong-actions .mini-btn{flex:1 1 0}
    .q-meta .q-num{display:none}
    .result-top{grid-template-columns:34px minmax(0,1fr);gap:8px}
    .result-score{grid-column:2;text-align:left;margin-top:-3px}
    .quiz-bar{gap:6px}
    .bar-prev{flex-basis:78px}
    .done h1{font-size:29px}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms!important;
      animation-iteration-count:1!important;
      transition-duration:.001ms!important;
    }
  }

/* ============ r2 追加组件（复用 r1 的纸感变量与版式） ============ */
.kw{
  background:var(--red-soft);
  box-shadow:inset 0 -2px 0 rgba(201,42,18,.55);
  color:var(--red-deep);
  font-weight:700;
  padding:0 .08em;
}
.qblank{
  display:inline-block;
  min-width:2.6em;
  height:1.02em;
  margin:0 .14em;
  border-bottom:2px solid var(--red);
  vertical-align:-.1em;
}
.qblank--long{min-width:4.2em}
/* 滚动排期 stepper */
.roll{
  margin-top:12px;
  padding:12px 12px 11px;
  border:1px solid var(--red);
  background:var(--paper-3);
}
.roll-h{
  display:flex;
  align-items:baseline;
  gap:7px;
  color:var(--red);
  font-size:12px;
  line-height:1.45;
  font-weight:700;
}
.roll-h::before{content:"↻";font-family:var(--mono);font-size:13px}
.roll-steps{
  display:grid;
  grid-template-columns:1fr 34px 1fr 34px 1fr;
  align-items:center;
  margin-top:11px;
}
.roll-step{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
  text-align:center;
}
.roll-dot{
  display:grid;
  place-items:center;
  width:24px;height:24px;
  border:1px solid var(--line-soft);
  border-radius:50%;
  font-family:var(--mono);
  font-size:11px;
  line-height:1;
  color:var(--muted);
  background:var(--paper);
}
.roll-step.is-on{color:var(--red);font-weight:700}
.roll-step.is-on .roll-dot{border-color:var(--red);background:var(--red);color:var(--white)}
.roll-step.is-done .roll-dot{border-color:var(--red);color:var(--red)}
.roll-line{height:1px;background:var(--line-soft)}
.roll-p{
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  text-align:center;
}
/* 解析分层 */
.jx{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
.jx-layer{margin-top:10px}
.jx-layer:first-child{margin-top:8px}
.jx-k{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--red);
  font-size:10px;
  line-height:1.4;
  font-weight:700;
  letter-spacing:.1em;
}
.jx-k::before{content:"";width:6px;height:6px;background:var(--red)}
.jx-p{
  margin-top:4px;
  color:var(--ink-2);
  font-size:13px;
  line-height:1.75;
  overflow-wrap:anywhere;
  text-wrap:pretty;
}
.jx-p b{color:var(--ink);font-weight:700}
/* 关键词命中 */
.hits{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}
.hit{
  display:inline-flex;
  align-items:center;
  gap:4px;
  max-width:100%;
  padding:2px 6px;
  border:1px solid var(--line-soft);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.hit.is-on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-deep)}
.hit::before{content:"○";font-family:var(--mono);font-size:9px}
.hit.is-on::before{content:"●"}
/* 错题本：你的答案 / 正确答案 */
.qa{
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  margin-top:7px;
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.6;
}
.qa b{color:var(--ink-2);font-weight:700}
.qa .qa-bad{color:var(--red-deep)}
.nogood{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  width:100%;
  margin-top:10px;
  border:1px dashed var(--warn);
  background:var(--warn-bg);
  color:var(--warn);
  font-size:12px;
  line-height:1.4;
  font-weight:600;
}
.nogood:active{background:#efe3c9}
/* 口径 / 差异 */
.scope{
  margin-top:16px;
  padding:12px 13px;
  border:1px solid var(--line-soft);
  border-left:3px solid var(--red);
  background:var(--paper-3);
}
.scope-h{
  font-size:11px;
  line-height:1.4;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--red);
}
.scope p{margin-top:5px;color:var(--ink-2);font-size:12px;line-height:1.7}
.scope p b{font-weight:700}
.scope-link{
  display:inline-flex;
  align-items:center;
  min-height:44px;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-decoration:underline;
  text-underline-offset:3px;
}
.rows{margin-top:10px;border-top:1px solid var(--line-soft)}
.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:baseline;
  padding:7px 0;
  border-bottom:1px solid var(--line-soft);
  font-size:12px;
  line-height:1.55;
}
.row span{min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.row b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
.row b.is-red{color:var(--red)}
.row-h{
  padding:9px 0 6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
  letter-spacing:.08em;
  border-bottom:1px solid var(--ink);
}
/* 章节行状态 */
.chip-lock{
  display:inline-flex;
  align-items:center;
  gap:3px;
  color:var(--muted);
  font-size:10px;
  font-family:var(--mono);
}
.mini-tag{
  display:inline-block;
  padding:1px 5px;
  border:1px solid var(--line-soft);
  color:var(--muted);
  font-size:10px;
  line-height:1.45;
  white-space:nowrap;
}
.mini-tag.is-red{border-color:var(--red);color:var(--red)}
.mini-tag.is-ok{border-color:var(--ok);color:var(--ok-deep)}
/* 答题页：题面旁注 */
.q-tip{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
  line-height:1.65;
}
.q-tip b{color:var(--ink-2)}
/* 已完成/未完成标记 */
.done-flag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--ok-deep);
  font-size:11px;
  font-weight:700;
}
@media (max-width:380px){
  .jx-p{font-size:12.5px}
  .roll-steps{grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1fr}
