B","id":"sx-5-L2","s":"社心","c":5,"t":"简答","card":2,"kd":"从众、顺从与服从","stem":"请写出／说明：谢里夫的规范形成研究（合书写要点，能写出关键词即可）","q":"请写出／说明：谢里夫的规范形成研究（合书写要点，能写出关键词即可）","ans":"谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L3","s":"社心","c":5,"t":"简答","card":3,"kd":"从众、顺从与服从","stem":"请写出／说明：阿希的群体压力研究（合书写要点，能写出关键词即可）","q":"请写出／说明：阿希的群体压力研究（合书写要点，能写出关键词即可）","ans":"阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L4","s":"社心","c":5,"t":"简答","card":4,"kd":"从众、顺从与服从","stem":"请写出／说明：从众的影响因素：情境与团体方面（合书写要点，能写出关键词即可）","q":"请写出／说明：从众的影响因素：情境与团体方面（合书写要点，能写出关键词即可）","ans":"情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L5","s":"社心","c":5,"t":"简答","card":5,"kd":"从众、顺从与服从","stem":"请写出／说明：从众的影响因素：个人与文化方面（合书写要点，能写出关键词即可）","q":"请写出／说明：从众的影响因素：个人与文化方面（合书写要点，能写出关键词即可）","ans":"个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L6","s":"社心","c":5,"t":"简答","card":6,"kd":"从众、顺从与服从","stem":"请写出／说明：顺从的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：顺从的定义（合书写要点，能写出关键词即可）","ans":"顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L7","s":"社心","c":5,"t":"简答","card":7,"kd":"从众、顺从与服从","stem":"请写出／说明：顺从的三个影响因素（合书写要点，能写出关键词即可）","q":"请写出／说明：顺从的三个影响因素（合书写要点，能写出关键词即可）","ans":"积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L9","s":"社心","c":5,"t":"简答","card":9,"kd":"从众、顺从与服从","stem":"请写出／说明：服从的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：服从的定义（合书写要点，能写出关键词即可）","ans":"服从是指在他人的直接命令之下做出某种行为的倾向。很多时候人们会服从地位高的他人或权威的命令。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L11","s":"社心","c":5,"t":"简答","card":11,"kd":"从众、顺从与服从","stem":"请写出／说明：米尔格拉姆实验揭示的高服从率条件（合书写要点，能写出关键词即可）","q":"请写出／说明：米尔格拉姆实验揭示的高服从率条件（合书写要点，能写出关键词即可）","ans":"权威与道德的冲突；正当的权威、近距离的命令者、遥远的受害者、以及没有反抗的榜样，这些条件共同导致了高服从率。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L12","s":"社心","c":5,"t":"简答","card":12,"kd":"从众、顺从与服从","stem":"请写出／说明：服从的四个影响因素（合书写要点，能写出关键词即可）","q":"请写出／说明：服从的四个影响因素（合书写要点，能写出关键词即可）","ans":"与受害者的情感距离（能看到他人痛苦时更可能产生同情心、减少伤害）、权威的接近性与正当性（权威在空间上接近且正当合理时服从率增加，不正当权威会激起反叛）、机构的权威性（有机构背景的权威更能发挥社会权力）、群体影响的释放效应（从众也可以是积极的，提高社会凝聚力）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L13","s":"社心","c":5,"t":"简答","card":13,"kd":"从众、顺从与服从","stem":"请写出／说明：从众、顺从、服从三者的区别（合书写要点，能写出关键词即可）","q":"请写出／说明：从众、顺从、服从三者的区别（合书写要点，能写出关键词即可）","ans":"三者都是个体或群体受社会影响而行为向外在影响力靠拢的现象，核心区别在于压力源和行为动机不同：从众的影响源是个体感受群体压力下的自我跟从行为；顺从的影响源是有意对行为者施加直接或隐含的影响；服从的引发具有强制性，命令者与服从者之间有规定性的社会角色联系。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L3-A","s":"社心","c":5,"t":"论述","card":3,"kd":"从众、顺从与服从","stem":"请用本章核心理论分析一个现实情境（自选或教师给定），要求：①点明所用理论（从本章：从众的定义（老师原话：我们记这句）；谢里夫的规范形成研究；阿希的群体压力研究 中选）②按理论要点逐条对应情境 ③给出结论或建议。\n答题骨架：理论名称 → 要点（3–5 条）→ 情境对应 → 结论/建议（按点给分）","q":"请用本章核心理论分析一个现实情境（自选或教师给定），要求：①点明所用理论（从本章：从众的定义（老师原话：我们记这句）；谢里夫的规范形成研究；阿希的群体压力研究 中选）②按理论要点逐条对应情境 ③给出结论或建议。\n答题骨架：理论名称 → 要点（3–5 条）→ 情境对应 → 结论/建议（按点给分）","ans":"- **从众的定义（老师原话：我们记这句）**：从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。\n- **谢里夫的规范形成研究**：谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。\n- **阿希的群体压力研究**：阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。\n- **从众的影响因素：情境与团体方面**：情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。\n- **从众的影响因素：个人与文化方面**：个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。\n- **顺从的定义**：顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。\n- **顺从的三个影响因素**：积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。\n- **增加顺从的四种技巧**：登门槛效应（先提小要求，满足后再提较大要求）、留面子效应（先提很大的要求，被拒后紧接着提小要求）、折扣技巧（先提很高的要求，在对方回应前赶紧打折扣或给予其他好处）、滚雪球又称低球效应（最初要求被接受后又提出新的较高要求）。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-5-L3-B","s":"社心","c":5,"t":"案例","card":3,"kd":"从众、顺从与服从","stem":"\n情境（北师 2026 方向科目真题）：某奶茶店开业搞「买一赠一」，并雇人在门口排队，同时发动顾客朋友圈转发、社媒晒照，门口天天排长队。\n（1）为什么排队那么多，路过的同学还会进店？（用社心理论解释）\n（2）假如你是老板，还有哪些更积极的活动方案？\n跨章调用要求（≥2–4 章）：从众（第 5 章）＋曝光效应（第 10 章）＋社会认知法则·便利法则/象征性法则（第 3 章）＋社会交换（＋社会认同、说服途径）。\n给分口径：分点作答（每点＝理论名 → 定义 → 对应材料）；至少 3 点，言之有理即可（方向科目口径·附录 B3）。\n答案结构：第（1）问＝多理论分点解释＋每点对应材料；第（2）问＝基于第（1）问的理论提出可执行方案（对应真题第二问·设计方案型）。\n- L1<80% → 只补错条（回看手册）；L2<60% → 标红，当晚再复述；L3<70% → 标红，周末重做\n- 5-L3-A 单章版：只用本章（从众），随时可做。\n- 5-L3-B 跨章真题版：调用第 3 章（社会认知法则）＋第 10 章（曝光效应）→ 需先学完：第 3、10 章；当前社心已学上界＝第 1–2 章（用户 2026-10-09 自报），未学到先不做/只做预习。","q":"\n情境（北师 2026 方向科目真题）：某奶茶店开业搞「买一赠一」，并雇人在门口排队，同时发动顾客朋友圈转发、社媒晒照，门口天天排长队。\n（1）为什么排队那么多，路过的同学还会进店？（用社心理论解释）\n（2）假如你是老板，还有哪些更积极的活动方案？\n跨章调用要求（≥2–4 章）：从众（第 5 章）＋曝光效应（第 10 章）＋社会认知法则·便利法则/象征性法则（第 3 章）＋社会交换（＋社会认同、说服途径）。\n给分口径：分点作答（每点＝理论名 → 定义 → 对应材料）；至少 3 点，言之有理即可（方向科目口径·附录 B3）。\n答案结构：第（1）问＝多理论分点解释＋每点对应材料；第（2）问＝基于第（1）问的理论提出可执行方案（对应真题第二问·设计方案型）。\n- L1<80% → 只补错条（回看手册）；L2<60% → 标红，当晚再复述；L3<70% → 标红，周末重做\n- 5-L3-A 单章版：只用本章（从众），随时可做。\n- 5-L3-B 跨章真题版：调用第 3 章（社会认知法则）＋第 10 章（曝光效应）→ 需先学完：第 3、10 章；当前社心已学上界＝第 1–2 章（用户 2026-10-09 自报），未学到先不做/只做预习。","ans":"- **从众的定义（老师原话：我们记这句）**：从众是指根据他人而做出的行为或信念的改变。个人是否从众的关键在于，当自己脱离群众时是否还能保持之前的观念和行为。\n- **谢里夫的规范形成研究**：谢里夫利用似动现象这种视错觉考察了个体的易受暗示性。他发现他人的判断会影响人们对光点移动距离的错觉估计；当正确答案的规范形成后，会持续很长一段时间并在一批批参与者中流传下来。说明在模糊情境中人们会依靠他人的判断来形成自己的标准，这种影响具有持久性。\n- **阿希的群体压力研究**：阿希进行线条知觉判断实验：先让参与者听到其他人判断哪条线段与标准线段相等，然后自己做出判断。当其他人一致给出错误答案时，有37%的参与者会从众；当参与者中有人给出正确答案时，从众率会大幅下降。\n- **从众的影响因素：情境与团体方面**：情境方面：模糊性是关键变量，当人们不确定正确反应时最容易从众。团体方面：（1）团体规模，规模越大压力越大，但超过三到四人后不一定增加从众；（2）团体凝聚力，凝聚力越大越容易从众；（3）团体社会支持，他人持有异议时会增强独立性。\n- **从众的影响因素：个人与文化方面**：个人方面：内在自我意识强的人不太会从众，公众自我意识强的人更容易从众；人们有时不从众是为了保持自身独特的自我同一性；心理抗拒理论认为自由受限时会采取对抗方式；地位越低从众可能性越大，承诺越大从众可能性越高。文化方面：集体主义国家的人们更容易受他人影响，在这些文化中从众是积极表现，在个人主义文化中从众往往含有消极意味。\n- **顺从的定义**：顺从是指在他人的直接请求下，按照他人要求去做的倾向。做顺从行为时，人们可能私下同意，也可能不同意他人的请求。\n- **顺从的三个影响因素**：积极的情绪（情绪好的时候顺从可能性更大）、互惠性（互惠规范强调对他人给予的恩惠予以回报）、合理原因（他人能给出合理解释时顺从可能性更大）。\n- **增加顺从的四种技巧**：登门槛效应（先提小要求，满足后再提较大要求）、留面子效应（先提很大的要求，被拒后紧接着提小要求）、折扣技巧（先提很高的要求，在对方回应前赶紧打折扣或给予其他好处）、滚雪球又称低球效应（最初要求被接受后又提出新的较高要求）。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-1","s":"社心","c":6,"t":"填空","card":1,"kd":"说服","stem":"[说服的定义] ______的沟通过程，______息，试图改变他人的态度、信念或行为，使其与说服者的意图保持一致。","q":"[说服的定义] ______的沟通过程，______息，试图改变他人的态度、信念或行为，使其与说服者的意图保持一致。","ans":"说服是一种有目的 ／ 通过传递符号化信","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-2","s":"社心","c":6,"t":"填空","card":2,"kd":"说服","stem":"[说服的中心路径] ______途径（2026 ______为「中心途径/外周途径」，同义）。主要通过提供详细而逻辑的证据来说服对方接受观点，侧重论据的逻辑性和合理性。当人们积极主动、全面系统地思考问题时更容易接受中心路径说服；如果论据苍白无力，思维缜密的人会很快反驳。","q":"[说服的中心路径] ______途径（2026 ______为「中心途径/外周途径」，同义）。主要通过提供详细而逻辑的证据来说服对方接受观点，侧重论据的逻辑性和合理性。当人们积极主动、全面系统地思考问题时更容易接受中心路径说服；如果论据苍白无力，思维缜密的人会很快反驳。","ans":"中心路径又称中心 ／ 北师真题答案用词","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-3","s":"社心","c":6,"t":"填空","card":3,"kd":"说服","stem":"[说服的外周路径与两条路径的比较] ______途径。______、塑造形象或激发认同感等方式使对方接受观点，不注重论据质量而关注外部线索（说服者的魅力、表达方式等），当人们心不在焉或没有主动思考信息时更容易被说服。比较：中心路径引起的态度变化比外周路径更持久（经过深思熟虑形成的认知更稳固）；外周路径简便直观，能迅速激发情感共鸣，但通常只能导致肤浅而短暂的态度改变。","q":"[说服的外周路径与两条路径的比较] ______途径。______、塑造形象或激发认同感等方式使对方接受观点，不注重论据质量而关注外部线索（说服者的魅力、表达方式等），当人们心不在焉或没有主动思考信息时更容易被说服。比较：中心路径引起的态度变化比外周路径更持久（经过深思熟虑形成的认知更稳固）；外周路径简便直观，能迅速激发情感共鸣，但通常只能导致肤浅而短暂的态度改变。","ans":"外周路径又称外周 ／ 外周路径利用情感","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-4","s":"社心","c":6,"t":"填空","card":4,"kd":"说服","stem":"[说服者的三个因素] 专家资格（______）、可靠性（是否值得信任、是否坦诚）、受欢迎程度（外表魅力、是否可爱、______性）。","q":"[说服者的三个因素] 专家资格（______）、可靠性（是否值得信任、是否坦诚）、受欢迎程度（外表魅力、是否可爱、______性）。","ans":"与目标对象的相似 ／ 专业性和权威性","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-5","s":"社心","c":6,"t":"填空","card":5,"kd":"说服","stem":"[说服信息的差距与恐惧唤醒] 说服信息的差距：____________度之间的差距在一定范围内越大，说服难度越大，超过一定限度人们会直接拒绝接受。信息唤醒的恐惧感：适度恐惧能增加态度改变的可能性，但恐惧超过某个限度人们会采取防御措施否认威胁的重要性，态度反而不发生改变。","q":"[说服信息的差距与恐惧唤醒] 说服信息的差距：____________度之间的差距在一定范围内越大，说服难度越大，超过一定限度人们会直接拒绝接受。信息唤醒的恐惧感：适度恐惧能增加态度改变的可能性，但恐惧超过某个限度人们会采取防御措施否认威胁的重要性，态度反而不发生改变。","ans":"信息所提倡的态度 ／ 与被说服者原有态","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-6","s":"社心","c":6,"t":"填空","card":6,"kd":"说服","stem":"[说服信息的呈现方式与呈现顺序] 呈现方式：______面呈现效果最好（______），信息简单时视觉呈现效果最好、听觉次之、书面最差。呈现顺序：先呈现正面信息再呈现反面信息的效果优于先反后正，因为先呈现的信息会成为后续判断的锚定点。","q":"[说服信息的呈现方式与呈现顺序] 呈现方式：______面呈现效果最好（______），信息简单时视觉呈现效果最好、听觉次之、书面最差。呈现顺序：先呈现正面信息再呈现反面信息的效果优于先反后正，因为先呈现的信息会成为后续判断的锚定点。","ans":"说服信息复杂时书 ／ 读者可以反复阅读","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-7","s":"社心","c":6,"t":"填空","card":7,"kd":"说服","stem":"[说服的渠道：主动参与 vs 被动接受] ____________更加自信稳定、更不容易改变；被动接受的说服效果随问题重要性的增加而降低，人们会逐渐产生怀疑和不信任。此外，面对面的互动比大众传媒更能打动人心。","q":"[说服的渠道：主动参与 vs 被动接受] ____________更加自信稳定、更不容易改变；被动接受的说服效果随问题重要性的增加而降低，人们会逐渐产生怀疑和不信任。此外，面对面的互动比大众传媒更能打动人心。","ans":"通过亲身经历和主 ／ 动参与形成的态度","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-8","s":"社心","c":6,"t":"填空","card":8,"kd":"说服","stem":"[被说服者的七个因素] 人格特性（可说服性、智力水平、自尊高低，______说服）、心情（______服性观点）、卷入程度（卷入越深态度越稳固越难改变）、动机水平、免疫力（过多预先说服会产生类似免疫的效果）、个体差异（认知需求、自我监控、年龄）、自我在说服中的角色。","q":"[被说服者的七个因素] 人格特性（可说服性、智力水平、自尊高低，______说服）、心情（______服性观点）、卷入程度（卷入越深态度越稳固越难改变）、动机水平、免疫力（过多预先说服会产生类似免疫的效果）、个体差异（认知需求、自我监控、年龄）、自我在说服中的角色。","ans":"高自尊者不容易被 ／ 好心情更易接受说","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-9","s":"社心","c":6,"t":"填空","card":9,"kd":"说服","stem":"[说服的情境因素] 预先警告：____________盾的信息时，态度更难改变。分散注意：分散注意能减少抗拒，有利于态度改变。","q":"[说服的情境因素] 预先警告：____________盾的信息时，态度更难改变。分散注意：分散注意能减少抗拒，有利于态度改变。","ans":"提前告诉被说服者 ／ 将收到与其立场矛","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L1","s":"社心","c":6,"t":"简答","card":1,"kd":"说服","stem":"请写出／说明：说服的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：说服的定义（合书写要点，能写出关键词即可）","ans":"说服是一种有目的的沟通过程，通过传递符号化信息，试图改变他人的态度、信念或行为，使其与说服者的意图保持一致。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L2","s":"社心","c":6,"t":"简答","card":2,"kd":"说服","stem":"请写出／说明：说服的中心路径（合书写要点，能写出关键词即可）","q":"请写出／说明：说服的中心路径（合书写要点，能写出关键词即可）","ans":"中心路径又称中心途径（2026 北师真题答案用词为「中心途径/外周途径」，同义）。主要通过提供详细而逻辑的证据来说服对方接受观点，侧重论据的逻辑性和合理性。当人们积极主动、全面系统地思考问题时更容易接受中心路径说服；如果论据苍白无力，思维缜密的人会很快反驳。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L3","s":"社心","c":6,"t":"简答","card":3,"kd":"说服","stem":"请写出／说明：说服的外周路径与两条路径的比较（合书写要点，能写出关键词即可）","q":"请写出／说明：说服的外周路径与两条路径的比较（合书写要点，能写出关键词即可）","ans":"外周路径又称外周途径。外周路径利用情感、塑造形象或激发认同感等方式使对方接受观点，不注重论据质量而关注外部线索（说服者的魅力、表达方式等），当人们心不在焉或没有主动思考信息时更容易被说服。比较：中心路径引起的态度变化比外周路径更持久（经过深思熟虑形成的认知更稳固）；外周路径简便直观，能迅速激发情感共鸣，但通常只能导致肤浅而短暂的态度改变。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L4","s":"社心","c":6,"t":"简答","card":4,"kd":"说服","stem":"请写出／说明：说服者的三个因素（合书写要点，能写出关键词即可）","q":"请写出／说明：说服者的三个因素（合书写要点，能写出关键词即可）","ans":"专家资格（专业性和权威性）、可靠性（是否值得信任、是否坦诚）、受欢迎程度（外表魅力、是否可爱、与目标对象的相似性）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L8","s":"社心","c":6,"t":"简答","card":8,"kd":"说服","stem":"请写出／说明：被说服者的七个因素（合书写要点，能写出关键词即可）","q":"请写出／说明：被说服者的七个因素（合书写要点，能写出关键词即可）","ans":"人格特性（可说服性、智力水平、自尊高低，高自尊者不容易被说服）、心情（好心情更易接受说服性观点）、卷入程度（卷入越深态度越稳固越难改变）、动机水平、免疫力（过多预先说服会产生类似免疫的效果）、个体差异（认知需求、自我监控、年龄）、自我在说服中的角色。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-6-L9","s":"社心","c":6,"t":"简答","card":9,"kd":"说服","stem":"请写出／说明：说服的情境因素（合书写要点，能写出关键词即可）","q":"请写出／说明：说服的情境因素（合书写要点，能写出关键词即可）","ans":"预先警告：提前告诉被说服者将收到与其立场矛盾的信息时，态度更难改变。分散注意：分散注意能减少抗拒，有利于态度改变。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-1","s":"社心","c":7,"t":"填空","card":1,"kd":"群体影响","stem":"[群体的定义（群体动力学家马文·肖）] ____________动，并以某种方式相互影响。群体是为了实现某个特定目标，由两个或以上相互作用、相互依赖的个体组合而成的集合体。","q":"[群体的定义（群体动 d":"sx-7-13","s":"社心","c":7,"t":"填空","card":13,"kd":"群体影响","stem":"[群体极化的两种解释机制] （1）信息影响：______信息的过程中，______据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","q":"[群体极化的两种解释机制] （1）信息影响：______信息的过程中，______据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","ans":"个体在接收和处理 ／ 由于接受了事实证","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-14","s":"社心","c":7,"t":"填空","card":14,"kd":"群体影响","stem":"[风险转移] 在群体决策中，______影响，______加冒险。在讨论中人们趋于一致所得出的观点，往往比各自原来的观点平均值更倾向于冒险。","q":"[风险转移] 在群体决策中，______影响，______加冒险。在讨论中人们趋于一致所得出的观点，往往比各自原来的观点平均值更倾向于冒险。","ans":"参与者受群体心理 ／ 做出的决策往往更","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-15","s":"社心","c":7,"t":"填空","card":15,"kd":"群体影响","stem":"[群体思维的定义] ____________维护群体和睦而压制异议，过分强调群体一致性而忽视了对决策的深入分析。贾尼斯认为产生条件包括：友善的、凝聚力强的群体，对异议的相对排斥，从自己喜好出发做决策的支配型领导。","q":"[群体思维的定义] ____________维护群体和睦而压制异议，过分强调群体一致性而忽视了对决策的深入分析。贾尼斯认为产生条件包括：友善的、凝聚力强的群体，对异议的相对排斥，从自己喜好出发做决策的支配型领导。","ans":"群体思维是指在群 ／ 体决策中人们为了","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-16","s":"社心","c":7,"t":"填空","card":16,"kd":"群体影响","stem":"[群体思维的八条症状] 无懈可击的错觉、______、合理化、______、从众压力、自我审查、一致统一的错觉、心理防御。这八条症状会阻止群体成员探寻相反信息和可能性，导致决策出现错误。","q":"[群体思维的八条症状] 无懈可击的错觉、______、合理化、______、从众压力、自我审查、一致统一的错觉、心理防御。这八条症状会阻止群体成员探寻相反信息和可能性，导致决策出现错误。","ans":"群体道义毋庸置疑 ／ 对对手的刻板印象","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-17","s":"社心","c":7,"t":"填空","card":17,"kd":"群体影响","stem":"[预防群体思维的五种方法] 一是领导公正，不偏向任何立场，______员表明立场；______价，设置一个真正的反对者；三是将群体划分成几个小组再重组表达不同意见；四是欢迎局外专家提出批评；五是在实施前召开第二次机会会议让大家畅所欲言。","q":"[预防群体思维的五种方法] 一是领导公正，不偏向任何立场，______员表明立场；______价，设置一个真正的反对者；三是将群体划分成几个小组再重组表达不同意见；四是欢迎局外专家提出批评；五是在实施前召开第二次机会会议让大家畅所欲言。","ans":"讨论开始时不让成 ／ 二是鼓励批评性评","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-18","s":"社心","c":7,"t":"填空","card":18,"kd":"群体影响","stem":"[拥挤现象] 价顾忌减小，社会懈怠就发生了。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L8","s":"社心","c":7,"t":"简答","card":8,"kd":"群体影响","stem":"请写出／说明：克服社会懈怠的四种方法（合书写要点，能写出关键词即可）","q":"请写出／说明：克服社会懈怠的四种方法（合书写要点，能写出关键词即可）","ans":"一是让成员有更多参与感和责任感，采取激励措施提高认同感和凝聚力；二是成员之间有亲密交往、彼此是朋友时懈怠减少；三是任务具有挑战性和高吸引力时懈怠程度减弱；四是个体作业成绩可识别化。此外，集体主义文化下的社会懈怠不如个人主义文化下强烈。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L9","s":"社心","c":7,"t":"简答","card":9,"kd":"群体影响","stem":"请写出／说明：去个体化的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：去个体化的定义（合书写要点，能写出关键词即可）","ans":"去个体化是指在某些群体情境中，人们更可能抛弃道德约束，以致忘却了个人的身份，而顺从于群体规范。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L10","s":"社心","c":7,"t":"简答","card":10,"kd":"群体影响","stem":"请写出／说明：去个体化的三个影响因素（合书写要点，能写出关键词即可）","q":"请写出／说明：去个体化的三个影响因素（合书写要点，能写出关键词即可）","ans":"（1）群体规模：团伙规模越大，成员越容易失去自我意识，评价顾忌降到最低，人们把行为责任归因于情境而非自己；（2）匿名性：这是引起去个体化的关键因素，成员越隐匿越觉得不需要对行为负责，自我意识减弱、群体意识增强（互联网提供了类似匿名性）；（3）唤起和分心活动：看到别人和自己做同样的行为时会产生自我强化的愉悦感。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L12","s":"社心","c":7,"t":"简答","card":12,"kd":"群体影响","stem":"请写出／说明：群体极化的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：群体极化的定义（合书写要点，能写出关键词即可）","ans":"群体极化是指群体讨论的过程通常可以强化群体成员的普遍倾向，使整个群体的意见偏向于某一极端方向。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L13","s":"社心","c":7,"t":"简答","card":13,"kd":"群体影响","stem":"请写出／说明：群体极化的两种解释机制（合书写要点，能写出关键词即可）","q":"请写出／说明：群体极化的两种解释机制（合书写要点，能写出关键词即可）","ans":"（1）信息影响：个体在接收和处理信息的过程中，由于接受了事实证据而改变自己的观念、态度和行为；讨论中积极参与比消极聆听更容易导致态度转变，成员对别人观点重复得越多就越可能在复述中认同这些观点。（2）规范影响：基于被他人接受或景仰的愿望而产生的影响，费斯廷格在社会比较理论中提出，当发现他人和自己持有相同观点时，为了使他人喜欢我们会把观点表达得更为强烈。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L15","s":"社心","c":7,"t":"简答","card":15,"kd":"群体影响","stem":"请写出／说明：群体思维的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：群体思维的定义（合书写要点，能写出关键词即可）","ans":"群体思维是指在群体决策中人们为了维护群体和睦而压制异议，过分强调群体一致性而忽视了对决策的深入分析。贾尼斯认为产生条件包括：友善的、凝聚力强的群体，对异议的相对排斥，从自己喜好出发做决策的支配型领导。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-7-L17","s":"社心","c":7,"t":"简答","card":17,"kd":"群体影响","stem":"请写出／说明：预防群体思维的五种方法（合书写要点，能写出关键词即可）","q":"请写出／说明：预防群体思维的五种方法（合书写要点，能写出关键词即可）","ans":"一是领导公正，不偏向任何立场，讨论开始时不让成员表明立场；二是鼓励批评性评价，设置一个真正的反对者；三是将群体划分成几个小组再重组表达不同意见；四是欢迎局外专家提出批评；五是在实施前召开第二次机会会议让大家畅所欲言。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-1","s":"社心","c":8,"t":"填空","card":1,"kd":"偏见与歧视","stem":"[偏见的本质（老师原话：我们记这句）] ____________的预先判断。偏见是一种态度，由情感、行为倾向和信念结合而成，即态度的ABC理论。","q":"[偏见的本质（老师原话：我们记这句）] ____________的预先判断。偏见是一种态度，由情感、行为倾向和信念结合而成，即态度的ABC理论。","ans":"偏见的本质是对某 ／ 一对象或群体负面","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-2","s":"社心","c":8,"t":"填空","card":2,"kd":"偏见与歧视","stem":"[偏见与歧视的区别] ______度，______为，先有偏见后有歧视。刻板印象是指人们对某个群体或事物持有的固定、过于简化的看法，是一种概括性看法；负面评价是偏见的标志，通常源自刻板印象。","q":"[偏见与歧视的区别] ______度，______为，先有偏见后有歧视。刻板印象是指人们对某个群体或事物持有的固定、过于简化的看法，是一种概括性看法；负面评价是偏见的标志，通常源自刻板印象。","ans":"偏见是一种负面态 ／ 歧视是一种负面行","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-3","s":"社心","c":8,"t":"填空","card":3,"kd":"偏见与歧视","stem":"[双重态度系统] ____________态度和内隐态度，利用内隐联结测量可以证明这一点。在我们的意识之外，也会产生偏见和歧视。","q":"[双重态度系统] ____________态度和内隐态度，利用内隐联结测量可以证明这一点。在我们的意识之外，也会产生偏见和歧视。","ans":"我们对同一个目标 ／ 可以同时拥有外显","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-4","s":"社心","c":8,"t":"填空","card":4,"kd":"偏见与歧视","stem":"[性别角色规范与性别刻板印象] ____________何行为的观念；性别刻板印象指人们有关男女事实上如何行为的信念。规范带有约定性质，刻板印象是描述性的。","q":"[性别角色规范与性别刻板印象] ____________何行为的观念；性别刻板印象指人们有关男女事实上如何行为的信念。规范带有约定性质，刻板印象是描述性的。","ans":"性别角色规范指人 ／ 们有关男女应该如","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-5","s":"社心","c":8,"t":"填空","card":5,"kd":"偏见与歧视","stem":"[偏见的三种根源] 社会根源（社会不平等、社会化、社会制度）、动机根源（替罪羊理论、______、______、避免偏见的动机）、认知根源（类别化、归因）。","q":"[偏见的三种根源] 社会根源（社会不平等、社会化、社会制度）、动机根源（替罪羊理论、______、______、避免偏见的动机）、认知根源（类别化、归因）。","ans":"现实群体冲突理论 ／ 社会同一性理论","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-8-6","s":"社心","c":8,"t":"填空","card":6,"kd":"偏见与歧视","stem":"[社会同一性理论（特纳和塔杰菲尔）] ____________性。我们通过归类、认同和比较三个过程，将他人分成内群体和外群体，偏爱自己的群体。内群体偏差指仅仅被归入某一群体，也会增加对内群体的偏 尊的\"阴暗面\"（四种情形）。","q":"写出自尊的定义（★老师原话），并列出自尊的\"阴暗面\"（四种情形）。","ans":"自尊＝个体认为自己有价值、有能力、值得受尊重和被关爱，是对自我的全面评价。阴暗面：①掺入自恋的高自尊（面临指责时易攻击批评者；特温奇：年轻一代更自恋）②低自尊（焦虑、孤独、抑郁）③安全型自尊（因内在特质感觉良好＝健康）④需指出「高自尊不全是好事」。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-2-18","s":"社心","c":2,"t":"简答","card":18,"kd":"自我","stem":"自尊确立的两条途径与提高自尊的五种方法。","q":"自尊确立的两条途径与提高自尊的五种方法。","ans":"途径：①控制环境的成功经验 ②他人的积极评价；方法：自我服务方式解释生活／自我妨碍找借口／使用防御机制／向下比较与补偿作用／转向擅长的活动。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-2-19","s":"社心","c":2,"t":"简答","card":19,"kd":"自我","stem":"独立型自我与互依型自我的差异（文化基础／关注点／公共成分／自我评价倾向）。","q":"独立型自我与互依型自我的差异（文化基础／关注点／公共成分／自我评价倾向）。","ans":"独立型（个人主义文化）：身份独立、关注自身独特内在特质；互依型（集体主义文化）：注重与他人和谐互动、公共成分更多、个体喜自我批评、少自我肯定。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-2-20","s":"社心","c":2,"t":"简答","card":20,"kd":"自我","stem":"自我服务偏差的三种表现，各举一例。","q":"自我服务偏差的三种表现，各举一例。","ans":"①高于平均水平效应（\"我比一般人开车稳\"；群体贡献评价之和 >100%）②盲目乐观（\"我肯定不会得病\"，防御性悲观可救）③虚假普遍性（高估别人赞同自己观点）／虚假独特性（把自己的才智品德看成异于常人）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-2-21","s":"社心","c":2,"t":"论述","card":21,"kd":"自我","stem":"（对应\"理论型考点\"）试述自我服务偏差的表现、机制及适应性价值与不良适应，并结合考研备考谈谈它对学习策略调整的启示。","q":"（对应\"理论型考点\"）试述自我服务偏差的表现、机制及适应性价值与不良适应，并结合考研备考谈谈它对学习策略调整的启示。","ans":"①表现：高于平均水平效应／盲目乐观／虚假普遍性与虚假独特性（＋自我服务归因：成功归己、失败归外）②机制：维护自尊与自我形象＋认知吝啬（偏向省力且对己有利的解释）③适应性：抗抑郁、缓压、维持动机，积极自尊可缓解焦虑甚至消除对死亡的恐惧 ④不良适应：归因失真→不改方法；群体服务偏差引发群体不和 ⑤备考启示：用可控归因（方法/时间投入而非\"我笨/题偏\"）、用客观分数与他人反馈校准自我评估、警惕\"虚假普遍性\"（以为大家都不会）→ 把错题当提升信号。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-2-22","s":"社心","c":2,"t":"案例","card":22,"kd":"自我","stem":"某同学一进教室就觉得「所有人都在看我」，演讲时认为「大家都看出我很慌」。指出涉及的两个概念，说明为何属认知偏差而非事实，并给一个能削弱该偏差的做法。 - L1 未达标（<80%）→ 只补错条（回看手册） - L2 未达标（<60%）→ 标红，当晚再复述一遍 - L3 未达标（<70%）→ 标红，周末重做 - 跨章题只调用已学章节；当前社心已学上界＝第 1–2 章（用户 2026-10-09 自报，见 `_handoff\\进度_当前.md`）。 - 调用未学章节的题 → 题面标注「需先学完：第 X 章」，降级为预习/延后做。 - 本章 L3 当前默认单章版（只用本章，随时可做）；跨章真题版待进度到位后启用。","q":"某同学一进教室就觉得「所有人都在看我」，演讲时认为「大家都看出我很慌」。指出涉及的两个概念，说明为何属认知偏差而非事实，并给一       if (!ek.length) return '本题关键词全部与题干重合（如「' + (raw[0] || '') + '」），不能作为踩分点；请对照下方原文自评是否写下定义主干。';
      return '有效踩分术语 ' + ek.length + ' 个（已剔除与题干重合的 ' + (raw.length - ek.length) + ' 个）：' +
        ek.slice(0, 6).map(function (k) { return '「' + k + '」'; }).join('、') + '。';
    }
    var ch = CH[q.s + q.c] || {};
    var book = '<div class="locate"><span class="locate-mark"></span><div class="locate-body">' +
      '<div class="locate-k">回书定位</div>' +
      '<p>第' + q.c + '章 ' + esc(ch.name || '') + (q.kd ? ' · ' + esc(q.kd) : '') + '</p>' +
      '<p class="mono">' + (q.card ? ('背诵手册 卡 ' + q.card) : '综合题（跨卡）') +
      (ch.a ? '（本章卡 ' + ch.a + '–' + ch.b + '）' : '') + ' · ' + (TYPE_LABEL[q.t] || q.t) + '</p>' +
      '<p class="mono">' + esc(ch.exam || '') + '</p></div></div>';
    var lockNote = '';
    if (p.restored && p.outcome) {
      lockNote = '<p class="lock-note">今天这张卡已经判过一次（' + mdLabel(TODAY) + '），不再重复计分；明天它会按排期回来。要再练就从错题本点「重做」（重做不计分）。</p>';
    } else if (p.revisit && p.outcome) {
      lockNote = '<p class="lock-note">本题本次已判过，判定留在原地：同一天不会重复计分，也不改排期。</p>';
    } else if (p.practice) {
      lockNote = '<p class="lock-note">重做模式：只看对错与解析，<b>不计分、不改排期</b>。真正要改排期，等它按日期回到今日队列。</p>';

      '<div class="result-score">' + score + '</div></div>' +

  function layer(k, v) {
    if (!v) return '';

  function rollHTML(r, p) {
    if (!p.outcome) return '';

      return '<div class="roll"><div class="roll-h">重做 · 不计分</div>' +
        '<p class="roll-p">这题本次不改排期；' + (r && r.due ? '当前排期 ' + mdLabel(r.due) + '（' + relDue(r.due) + '）。' : '它还没进滚动。') + '</p></div>';
    }
    var step = p.outcome === 'ok' ? Math.min(r.streak || 1, 4) : 0;

    else if (p.outcome === 'fuzzy') label = '没把握：' + relDue(r.due) + '再看一遍';
    else label = '回到起点：' + relDue(r.due) + '再来';

  function quizBarHTML() {
    var q = currentQ();

    var prev = '<button class="bar-prev" data-act="prev"' + (S.session.idx === 0 ? ' disabled' : '') + '>上一题</button>';

    }

      // 副标按「真实排期」算：当前 streak 决定这次「答对了」会排到几天后

        '<button class="bar-grade bar-grade--ok" data-act="grade" data-arg="ok" data-days="' + okDays + '">答对了<span>' +

  function r_mastered(q) { var r = rec(q); return !!(r && r.mastered); }

  /* ---------------- 视图：错题本 ---------------- */
  function wrongList() {
    var arr = reps(ITEMS.filter(function (q) {
      if (!isOpen(q.s, q.c)) return false;
      var r = rec(q); return r && (r.wrong || 0) > 0;
    }));
    if (S.wrong === 'open') arr = arr.filter(function (q) { return !rec(q).mastered; });
    if (S.wrong === 'done') arr = arr.filter(function (q) { return rec(q).mastered; });
    if (S.wrong === '普心' || S.wrong === '社心') arr = arr.filter(function (q) { return q.s === S.wrong; });
    return arr.sort(function (a, b) {
      var ra = rec(a) || {}, rb = rec(b) || {};
      if ((rb.wrong || 0) !== (ra.wrong || 0)) return rb.wrong - ra.wrong;
      return (ra.due || '') < (rb.due || '') ? -1 : 1;
    });
  }
  function wrongHTML() {
    var ws = wrongStats();
    var all = ws.all, open = ws.rolling.length, masteredN = ws.mastered.length;
    var list = wrongList();

      var k = q.s + ' 第' + q.c + '章 ' + (CH[q.s + q.c] || {}).name;
      (groups[k] = groups[k] || []).push(q);
    });
    var filters = [['open', '未掌握'], ['all', '全部'], ['普心', '普心'], ['社心', '社心'], ['done', '已掌握']];
    var body = list.length ? Object.keys(groups).map(function (k) {
      return '<div class="schedule-group"><div class="schedule-day"><b>' + esc(k) + '</b><span>' + groups[k].length + ' 道</span></div>' +
        groups[k].map(function (q) {
          var r = rec(q);
          var mine = isChoice(q) ? (r.lastSel || []).join('') : (r.draft ? clamp(r.draft, 12) : '—');
          var right = isChoice(q) ? String(q.key || '') : clamp((q.kw || []).join('、'), 20);
          return '<div class="wrong-card">' +
            '<div class="wrong-meta"><span class="mono">卡 ' + (q.card || '—') + '</span><span>' + (TYPE_LABEL[q.t] || q.t) + '</span>' +
            '<span>错 ' + r.wrong + ' 次</span><span>' + (r.mastered ? '已掌握 · 抽查' : '滚动中') + '</span>' +
            '<span>' + (r.due ? mdLabel(r.due) : '—') + '</span></div>' +
            '<div class="wrong-stem">' + esc(clamp(q.stem, 90)) + '</div>' +
            '<div class="qa"><span>你的答案 <b class="qa-bad">' + esc(mine || '—') + '</b></span>' +
            '<span>正确答案 <b>' + esc(right || '—') + '</b></span></div>' +
            '<div class="wrong-foot"><span class="wrong-stat">' + (r.last ? '上次 ' + mdLabel(r.last) : '') +
            (r.mastered ? ' · 30 天后抽查' : '') + '</span>' +
            '<div class="wrong-actions">' +
            '<button class="mini-btn mini-btn--ghost" data-act="sheet" data-arg="answer:' + q.id + '">解析</button>' +
            '<button class="mini-btn mini-btn--red" data-act="redo" data-arg="' + q.id + '">重做</button>' +
            (r.mastered

            '</div></div></div>';
        }).join('') + '</div>';
    }).join('') : '<div class="empty"><span class="empty-mark">00</span><h3>还没有错题</h3>' +
      '<p>答错自动进本，并按 1 天后回来。先去做今日队列。</p>' +
      '<button class="hero-cta" data-act="go" data-arg="home">回首页</button></div>';
    return masthead() + pageHead('错题本', '错题不是收藏<br>是滚动复习的账',
      '共 ' + all.length + ' 道错题：滚动中 ' + open + ' 道 · 已掌握 ' + masteredN + ' 道。标「已掌握」后 30 天再抽查，抽查没过自动打回滚动。') +
      '<section class="shell"><div class="filters">' + filters.map(function (f) {
        return '<button class="filter' + (S.wrong === f[0] ? ' is-active' : '') + '" data-act="wrong-filter" data-arg="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' + body + '</section>';
  }

  /* ---------------- 视图：进度 ---------------- */
  function progressHTML() {
    var kpAll = reps(available());
    var seen = kpAll.filter(isSeen);
    var ok = 0, bad = 0, fuzzy = 0;
    kpAll.forEach(function (q) { var r = rec(q); if (!r) return; ok += r.ok || 0; bad += r.bad || 0; fuzzy += r.fuzzy || 0; });
    var total = ok + bad + fuzzy;
    var acc = total ? Math.round(ok / total * 100) : null;
    var ws = wrongStats();
    var wrongN = ws.rolling.length, masteredN = ws.mastered.length;
    var dueN = realDueItems().length;
    // 7 天柱
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var k = addDays(TODAY, -i);
      var d = progress.days[k] || { a: 0, c: 0 };
      days.push({ k: k, a: d.a || 0, c: d.c || 0 });
    }
    var maxA = Math.max.apply(null, days.map(function (d) { return d.a; }).concat([1]));
    var week = '<div class="week">' + days.map(function (d) {
      var h = Math.round(d.a / maxA * 100);
      var t = d.k === TODAY ? ' is-today' : '';
      return '<div class="day-col' + t + '"><span class="day-count">' + (d.a || '') + '</span>' +
        '<span class="day-bar"><i style="height:' + h + '%"></i></span>' +
        '<span class="day-label">' + (d.k === TODAY ? '今天' : '周' + wdLabel(d.k)) + '</span></div>';
    }).join('') + '</div>';
    // 分科（按考点）
    var subj = ['普心', '社心'].map(function (s) {
      var list = kpAll.filter(function (q) { return q.s === s; });
      var sn = list.filter(isSeen).length;
      return '<div class="subj-row"><div class="subj-line"><b>' + s + '</b><span>' + sn + '/' + list.length + ' 考点</span></div>' +
        '<div class="subj-bar"><i style="width:' + pct(sn, list.length) + '%"></i></div></div>';
    }).join('');
    // 章节掌握
    var chStats = BANK.learned.slice().sort(function (a, b) { return a.o - b.o; }).map(function (l) {
      var kps = chapterKps(l.s, l.c);
      var sn = kps.filter(isSeen).length;
      var okc = kps.filter(function (q) { var r = rec(q); return r && r.ok; }).length;
      return '<div class="chapter-stat"><div class="cs-t"><b>' + l.s + ' 第' + l.c + '章 ' + esc(l.name) + '</b>' +
        '<span>' + sn + '/' + kps.length + ' 考点已答 · 答对 ' + okc + ' · 共 ' + chapterItems(l.s, l.c).length + ' 题</span>' +
        '<div class="subj-bar"><i style="width:' + pct(sn, kps.length) + '%"></i></div></div>' +
        '<span class="mono">' + pct(okc, kps.length) + '%<br>卡 ' + l.a + '–' + l.b + '</span></div>';
    }).join('');
    var nextLocked = nextLockable();
    var unlockBtn = ''  /* unlock-btn removed 2026-11-04: 未学章恒锁，不提供手动解锁 */;
    return masthead() + pageHead('进度', '做了多少<br>错在哪', '数据只存在这台设备的 localStorage；换设备用下面的导出 / 导入一段 JSON 搬过去。') +
      '<section class="shell">' +
      '<div class="acc-hero"><div><div class="acc-num">' + (acc == null ? '<span class="acc-empty">—</span>' : acc + '<small>%</small>') + '</div>' +
      '<p class="fine">正确率（按作答次数，含自评）</p></div>' +
      '<div class="acc-copy"><b>' + seen.length + '/' + kpAll.length + ' 考点见过</b><span>已答 ' + total + ' 次 · 到期 ' + dueN + '</span></div></div>' +
      '<div class="stat-grid">' +
      cell('已答次数', total, '') + cell('答对', ok, '') + cell('答错', bad, '') + cell('没把握', fuzzy, '') +
      cell('错题滚动中', wrongN, '') + cell('已掌握', masteredN, '') +
      '</div>' +
      '<div class="panel"><div class="panel-head"><h2>近 7 天</h2><span>每天作答次数</span></div>' + week + '</div>' +
      '<div class="panel"><div class="panel-head"><h2>分科</h2><span>已答 / 总考点</span></div>' + subj + '</div>' +
      '<div class="panel"><div class="panel-head"><h2>章节掌握</h2><span>已学 7 章 · 按考点</span></div>' + chStats + '</div>' +
      scopeHTML() +
      '<div class="panel"><div class="panel-head"><h2>进度备份</h2><span>手机 ↔ 电脑</span></div>' +
      '<div class="data-actions"><button class="data-btn" data-act="sheet" data-arg="export">导出进度</button>' +
      '<button class="data-btn data-btn--fill" data-act="sheet" data-arg="import">导入进度</button></div>' +
      (unlockBtn ? '<div class="data-actions" style="grid-template-columns:1fr">' + unlockBtn + '</div>' : '') +
      '<p class="fine">key：<b>' + KEY + '</b>（旧版 v2 记录会自动迁移）· 每次作答立即写入。清浏览器数据会丢，导出 JSON 是最稳的备份。</p></div>' +
      '<div class="reset-zone"><button class="reset-btn" data-act="reset">清空本机进度</button></div>' +
      '</section>';
  }
  function cell(label, v, unit) {

  function nextLockable() {
    var ls = BANK.learned.slice().sort(function (a, b) { return a.o - b.o; });
    var lastL = ls[ls.length - 1];
    var cand = BANK.chapters.filter(function (c) { return !isOpen(c.s, c.c); });
    if (!cand.length) return null;
    // 优先同科目下一章，其次另一科目第 1 章
    var same = cand.filter(function (c) { return c.s === lastL.s && c.c > lastL.c; }).sort(function (a, b) { return a.c - b.c; });
    if (same.length) return same[0];
    var other = cand.filter(function (c) { return c.s !== lastL.s; }).sort(function (a, b) { return a.c - b.c; });
    return other[0] || null;
  }

        '<textarea class="json-box" id="exportText" readonly>' + esc(exportText()) + '</textarea>' +

  /* ---------------- 导出 / 导入 ---------------- */
  function exportPayload() {
    return {
      app: '347-quiz', v: 3, exportedAt: new Date().toISOString(),
      bank: { total: META.total, learned: META.learned, kp: META.kp, source: 'zyk.json' },
      progress: { q: progress.q, days: progress.days, unlocked: progress.unlocked }
    };
  }
  function exportText() { return JSON.stringify(exportPayload(), null, 1); }

  function doImport() {
    var box = $('#importText');
    var errEl = $('#importError');
    var txt = (box && box.value || '').trim();
    var mode = 'merge';
    var radios = document.querySelectorAll('input[name="imp"]');
    for (var i = 0; i < radios.length; i++) if (radios[i].checked) mode = radios[i].value;
    function fail(m) { if (errEl) { errEl.hidden = false; errEl.textContent = m; } }
    if (!txt) return fail('还没有粘贴 JSON。');
    var data;
    try { data = JSON.parse(txt); } catch (e) { return fail('JSON 解析失败：' + e.message); }
    if (!data || typeof data !== 'object' || !data.progress || typeof data.progress.q !== 'object') {
      return fail('结构不对：需要找到 progress.q（本工具导出的 JSON 才有）。');
    }
    var srcD = data.progress.days || {};
    // 旧版按题 id 存，新版按考点 kp 存 → 一律先映射到 kp 再合并
    var srcQ = migrateQ(data.progress.q || {});
    var added = 0, updated = 0, skipped = 0, merged = 0;
    if (mode === 'replace') { progress.q = {}; progress.days = {}; progress.unlocked = data.progress.unlocked || []; }
    Object.keys(srcQ).forEach(function (k) {
      var b = srcQ[k], a = progress.q[k];
      if (!BY[k] && !KP_ITEMS[k]) { skipped++; return; }
      if (!a) { progress.q[k] = b; added++; return; }
      var ta = a.lastAt || '', tb = b.lastAt || '';
      if (tb > ta || (!tb && ta && (b.last || '') > (a.last || ''))) {
        // 保留次数最多的那侧的累计次数（换设备合并时不丢次数）
        progress.q[k] = mergeRec(a, b);
        updated++;
      } else merged++;
    });
    Object.keys(srcD).forEach(function (k) {
      var a = progress.days[k], b = srcD[k];
      if (!a) { progress.days[k] = b; return; }
      progress.days[k] = {
        a: Math.max(a.a || 0, b.a || 0), c: Math.max(a.c || 0, b.c || 0), w: Math.max(a.w || 0, b.w || 0)
      };
    });
    saveProgress();
    closeSheet();
    toast('导入完成：新增 ' + added + '，更新 ' + updated + '，本机较新 ' + merged + '，跳过 ' + skipped);
    render();
  }

  /* ---------------- 会话动作 ---------------- */
  // 把「判定结果」顶到吸顶答题头下面：header 高度是活的，320/360 都不遮
  function scrollToResult() {
    var el = $('.result') || $('#resultCard');
    if (!el) return;
    var head = $('.quiz-head');
    var hh = head ? Math.round(head.getBoundingClientRect().height) : 62;
    var top = el.getBoundingClientRect().top + (window.pageYOffset || 0) - hh - 10;
    try { window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, Math.max(0, top)); }
  }
  function afterGradeScroll() { setTimeout(scrollToResult, 40); }

  function submitAnswer() {
    var q = currentQ(), p = ensurePending();
    if (!q || !p) return;
    if (p.restored) { toast('这张卡今天已经判过了，明天按排期回来。'); return; }
    if (p.revealed) return;
    if (isChoice(q) && !p.sel.length) { toast('先选一个选项。'); return; }
    p.revealed = true;
    if (isChoice(q)) {
      // 选择题当场判：正确/错误立即落库，仍可改判「蒙对的」
      p.auto = checkChoice(q, p.sel);
      p.outcome = p.auto ? 'ok' : 'bad';
      if (p.practice) {
        p.graded = true;
        if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
      } else {
        var g = applyGrade(q, p.outcome, { text: '', sel: p.sel });
        if (g && g.locked) { p.restored = true; p.outcome = (rec(q) || {}).lastOutcome || 'ok'; }
        else {
          p.graded = true;
          if (S.session) { S.session.answered++; if (p.outcome === 'ok') S.session.right++; }
        }
      }
      p.hits = null;
    } else {
      p.hits = kwHits(q, p.text);
    }
    render();
    afterGradeScroll();
  }
  function grade(outcome) {
    var q = currentQ(), p = ensurePending();
    if (!q || !p || !p.revealed) return;
    if (p.restored) { toast('这张卡今天已经判过了，不重复计分。'); return; }
    if (p.outcome) {
      // 已判定：只允许一次「蒙对的，没把握」改判，走 1 天（并回退上一次的计数与天数）
      if (outcome === 'fuzzy' && p.outcome !== 'fuzzy' && !p.practice) {
        applyGrade(q, 'fuzzy', { regrade: true, text: p.text, sel: p.sel });
        if (S.session && p.outcome === 'ok') S.session.right = Math.max(0, S.session.right - 1);
        p.outcome = 'fuzzy';
        render(); afterGradeScroll(); toast('已改判：回 1 天、不进错题本，当天计数已回退。');
      }
      return;
    }
    if (p.practice) {
      p.outcome = outcome; p.graded = true;
      if (S.session) { S.session.answered++; if (outcome === 'ok') S.session.right++; }
      render(); afterGradeScroll();
      return;
    }
    var g = applyGrade(q, outcome, { text: p.text, sel: p.sel });
    if (g && g.locked) {
      p.restored = true; p.outcome = (rec(q) || {}).lastOutcome || outcome;
      render(); afterGradeScroll(); toast('这张卡今天已经判过了，不重复计分。');
      return;
    }
    p.outcome = outcome;
    p.graded = true;
    if (S.session) { S.session.answered++; if (outcome === 'ok') S.session.right++; }
    render(); afterGradeScroll();
  }
  function nextQuestion() {
    if (!S.session) return;
    if (S.session.idx < S.session.ids.length - 1) {
      S.session.idx++; markRevisit(); render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else finishSession();
  }
  function finishSession() { go('done'); }
  function prevQuestion() {
    if (!S.session || S.session.idx === 0) return;
    S.session.idx--; markRevisit(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function go(view) {
    S.view = view; S.sheet = null;
    if (view !== 'quiz') S.session = view === 'done' ? S.session : null;
    if (view !== 'quiz') S.pend = {};
    render();
    try { history.replaceState(null, '', '#' + view); } catch (e) { }
    window.scrollTo(0, 0);
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var app = $('#app');
    var html = '';
    if (S.view === 'home') html = homeHTML();
    else if (S.view === 'chapters') html = chaptersHTML();
    else if (S.view === 'quiz') html = quizHTML();
    else if (S.view === 'wrong') html = wrongHTML();
    else if (S.view === 'progress') html = progressHTML();
    else if (S.view === 'done') html = doneHTML();
    app.innerHTML = html;
    // 底部栏
    Array.prototype.slice.call(document.querySelectorAll('.quiz-bar')).forEach(function (el) { el.parentNode.removeChild(el); });
    if (S.view === 'quiz' && currentQ()) {
      app.insertAdjacentHTML('afterend', quizBarHTML());
      document.body.classList.add('has-bar', 'is-quiz');
      document.body.classList.remove('has-tabbar');
      $('#tabbar').hidden = true;
    } else {
      document.body.classList.remove('has-bar', 'is-quiz');
      document.body.classList.add('has-tabbar');
      $('#tabbar').hidden = false;
      $('#tabbar').innerHTML = tabbar(S.view);
    }
    // 抽屉
    var ov = $('#overlay');
    if (S.sheet) {
      ov.innerHTML = sheetHTML();
      ov.hidden = false;
      document.body.classList.add('sheet-open');
      if (S.sheet.type === 'import') bindImport();
    } else {
      ov.hidden = true; ov.innerHTML = '';
      document.body.classList.remove('sheet-open');
    }
    // 答题页保留草稿焦点之外不处理
  }
  function bindImport() {
    var f = $('#importFile');
    if (!f) return;
    f.addEventListener('change', function () {
      var file = f.files && f.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        var box = $('#importText');
        if (box) box.value = String(rd.result || '');
        toast('已读入 ' + file.name + '，点「校验并导入」。');
      };
      rd.onerror = function () { toast('文件读失败，试试复制粘贴。'); };
      rd.readAsText(file, 'utf-8');
    });
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) {
      // 点遮罩关闭
      if (ev.target.id === 'overlay') closeSheet();
      return;
    }
    var act = t.dataset.act, arg = t.dataset.arg || '';
    switch (act) {
      case 'go': go(arg); break;
      case 'start':
        if (arg === 'daily') startSession(todayQueue(), 'daily', todayChapterTitle());
        else if (arg === 'due') {
          var ids = dueItems().map(function (q) { return q.id; });
          if (!ids.length) { openSheet('sched'); break; }
          startSession(ids, 'due', '滚动复习 · 到期 ' + ids.length + ' 题');
        } else if (arg === 'wrong') go('wrong');
        break;
      case 'chapter':
        var parts = arg.split('|'), s = parts[0], c = +parts[1];
        var items = chapterItems(s, c);
        var ch = CH[s + c] || {};
        startSession(items.map(function (q) { return q.id; }), 'chapter', s + ' 第' + c + '章 ' + (ch.name || ''));
        break;
      case 'locked': toast('这章还没学：先上完 1v1 这节课，再到「进度 → 未学章锁定」。'); break;
      case 'pick': {
        var p = ensurePending(); if (!p || p.revealed || p.restored) break;
        var q = currentQ();
        if (isMulti(q)) {
          var i = p.sel.indexOf(arg);
          if (i >= 0) p.sel.splice(i, 1); else p.sel.push(arg);
        } else p.sel = [arg];
        render(); break;
      }
      case 'submit': submitAnswer(); break;
      case 'reveal': {
        var pp = ensurePending(); if (!pp) break;
        if (pp.restored) { toast('这张卡今天已经判过了。'); break; }
        pp.revealed = true; pp.hits = kwHits(currentQ(), pp.text); render();
        afterGradeScroll();
        break;
      }
      case 'grade': grade(arg); break;
      case 'next': nextQuestion(); break;
      case 'prev': prevQuestion(); break;
      case 'finish': finishSession(); break;
      case 'jump': {
        var j = +arg; if (S.session && j >= 0 && j < S.session.ids.length) {
          S.session.idx = j; closeSheet(); markRevisit(); render(); window.scrollTo(0, 0);
        } break;
      }
      case 'exit': if (S.session && S.session.answered) { startConfirmExit(); } else { go('home'); } break;
      case 'wrong-filter': S.wrong = arg; render(); break;
      case 'redo': {
        var rq = BY[arg];
        if (rq) startSession([rq.id], 'practice', '错题重做（不计分）· ' + rq.s + ' 第' + rq.c + '章');
        break;
      }
      case 'master': {
        var mq = BY[arg], rr = mq ? rec(mq) : null;
        if (mq && rr) {
          rr.mastered = true; rr.masteredAt = TODAY;
          rr.interval = MASTER_DAYS; rr.due = addDays(TODAY, MASTER_DAYS);
          saveProgress(); toast('已标掌握：' + MASTER_DAYS + ' 天后（' + mdLabel(rr.due) + '）会回来抽查。'); render();
        }
        break;
      }
      case 'unmaster': {
        var uq = BY[arg], ur = uq ? rec(uq) : null;
        if (uq && ur) {
          ur.mastered = false; ur.interval = 1; ur.due = addDays(TODAY, 1);
          saveProgress(); toast('已取消掌握：回到 1 天滚动，重新进错题本。'); render();
        }
        break;
      }
      case 'sheet': openSheet(arg); break;
      case 'close-sheet':
        // 点抽屉内部不关闭；只有遮罩本身或右上角关闭按钮才关
        if (ev.target.closest('.sheet') && !ev.target.closest('.sheet-close')) break;
        closeSheet(); break;
      case 'copy': copyText(exportText(), '已复制，去微信粘贴。'); break;
      case 'download': downloadExport(); break;
      case 'doimport': doImport(); break;
      case 'sheet-close-start': { closeSheet(); var sq = BY[arg]; if (sq) startSession([sq.id], 'due', '单题复习 · 卡 ' + (sq.card || '')); break; }
      case 'reset': startReset(t); break;
    }
  });
  document.addEventListener('click', function (ev) {
    if (ev.target.classList && ev.target.classList.contains('overlay')) closeSheet();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'recallText') {
      var p = ensurePending(); if (!p || p.restored) return;
      p.text = ev.target.value;
      var q = currentQ();
      var r = q ? rec(q) : null;
      if (r) { r.draft = p.text; saveProgress(); }
      var lab = ev.target.previousElementSibling;
      if (lab && lab.querySelector('span')) lab.querySelector('span').textContent = p.text ? p.text.length + ' 字' : '可留空';
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (S.view !== 'quiz' || S.sheet) return;
    var p = ensurePending(), q = currentQ();
    if (!q || !p) return;
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); if (!p.revealed) submitAnswer(); } return; }
    var k = ev.key.toUpperCase();
    if (!p.revealed && isChoice(q) && 'ABCD'.indexOf(k) >= 0) {
      if (q.opts[k]) { p.sel = [k]; render(); ev.preventDefault(); }
    } else if (k === 'ENTER') {
      if (!p.revealed) submitAnswer(); else if (!p.outcome) grade(p.auto === false ? 'bad' : 'ok'); else nextQuestion();
      ev.preventDefault();
    } else if (ev.key === 'ArrowLeft') { prevQuestion(); }
    else if (ev.key === 'ArrowRight') { nextQuestion(); }
    else if (!p.revealed && isChoice(q) && /^[1-4]$/.test(ev.key)) {
      var L = 'ABCD'[+ev.key - 1]; if (q.opts[L]) { p.sel = [L]; render(); ev.preventDefault(); }
    }
  });

  function todayChapterTitle() {
    var nc = nextChapter();
    return nc ? nc.l.s + ' 第' + nc.l.c + '章 ' + nc.l.name : '今日复习';
  }
  function openSheet(type) { S.sheet = { type: type }; render(); }
  function closeSheet() { S.sheet = null; render(); }
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.classList.add('is-show');
    clearTimeout(S.toastT);
    S.toastT = setTimeout(function () { el.classList.remove('is-show'); }, 2200);
  }
  function copyText(txt, ok) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(ok); } catch (e) { toast('复制失败，长按文本框手动复制。'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast(ok); }, fallback);
    } else fallback();
  }
  function downloadExport() {
    var blob = new Blob([exportText()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '347进度_' + TODAY + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function startUnlock(arg) {
    var p = arg.split('|'), s = p[0], c = +p[1];
    var ch = CH[s + c];
    if (!ch) return;
    if (!window.confirm('确认已上完 ' + s + ' 第' + c + '章「' + ch.name + '」？解锁后这 ' + ch.n + ' 题会进入每日队列。')) return;
    progress.unlocked.push(s + c);
    saveProgress(); toast('已解锁 ' + s + ' 第' + c + '章（' + ch.n + ' 题）'); render();
  }
  function startReset(btn) {
    if (!btn.dataset.confirm) {
      btn.dataset.confirm = '1';
      btn.classList.add('is-confirm');
      btn.textContent = '再点一次确认清空（不可恢复）';
      setTimeout(function () {
        if (!btn.dataset.confirm) return;
        delete btn.dataset.confirm; btn.classList.remove('is-confirm'); btn.textContent = '清空本机进度';
      }, 4000);
      return;
    }
    progress = blank(); saveProgress(); toast('本机进度已清空。'); render();
  }
  function startConfirmExit() {
    if (window.confirm('退出本次答题？已作答的记录都保留。')) { go('home'); }
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    loadProgress();
    var hash = (location.hash || '').replace('#', '');
    if (['home', 'chapters', 'wrong', 'progress'].indexOf(hash) >= 0) S.view = hash;
    render();
    if (hash === 'quiz') S.view = 'home';
  }
  boot();

  /* ROUND_UI_V2_20261111: 暴露 _setRound 到 window + 横幅只在首页显示 */
  window._setRound = _setRound;
  (function () {
    var el = document.getElementById('ROUND-BAND');
    if (!el) return;
    function _syncBand() {
      var h = (location.hash || '').replace('#', '');
      var isHome = (h === '' || h === 'home');
      el.style.display = isHome ? 'flex' : 'none';
      var lb = document.getElementById('ROUND-LABEL');
      if (lb) lb.textContent = roundLabel(ROUND_MODE);
    }
    _syncBand();
    window.addEventListener('hashchange', _syncBand);
  })();

  /* SELF_EVAL_20261111: 简答/论述/案例 不打字，看答案自评（用户：现在重点是记核心考点，作答后续开发） */
  (function () {
    var _origRender = null;
    function _curQ() { try { return (typeof currentQ === 'function') ? currentQ() : null; } catch (e) { return null; } }
    function _apply() {
      var q = _curQ();
      if (!q || !q.se) return;
      var ta = document.getElementById('recallText');
      if (!ta || ta.dataset.seDone === '1') return;
      ta.dataset.seDone = '1';
      ta.style.display = 'none';
      var hint = ta.nextElementSibling;
      var box = document.createElement('div');
      box.id = 'SE-BOX';
      box.style.cssText = 'margin:14px 0;padding:14px;border:1px dashed #fbbf24;border-radius:12px;background:#fffbeb;font-size:15px';
      box.innerHTML = '<b>再认自评</b><div style="color:#92400e;font-size:13px;margin:6px 0 10px">先在心里想一遍，再点按钮。不用打字。</div>' +
        '<button id="SE-YES" style="min-height:44px;padding:8px 16px;margin-right:10px;border:1px solid #86efac;background:#f0fdf4;border-radius:10px;font-size:15px;cursor:pointer">想出来了 ✓</button>' +
        '<button id="SE-NO" style="min-height:44px;padding:8px 16px;border:1px solid #fca5a5;background:#fef2f2;border-radius:10px;font-size:15px;cursor:pointer">没想起来 ✗</button>';
      ta.parentNode.insertBefore(box, ta);
      document.getElementById('SE-YES').onclick = function () { _judge(true); };
      document.getElementById('SE-NO').onclick = function () { _judge(false); };
    }
    function _judge(ok) {
      var box = document.getElementById('SE-BOX');
      if (box) box.innerHTML = '<b>' + (ok ? '✅ 记为会' : '❌ 记为不会，明天再来') + '</b><div style="font-size:13px;color:#6b7280;margin-top:6px">下面看答案核对（不计分，避免自评不诚实）</div>';
      try {
        var b = document.querySelector('[data-act="reveal"]') || document.querySelector('.bar-primary') || document.querySelector('button[id*="reveal"]');
        if (b) b.click();
      } catch (e) {}
    }
    function _tick() { setTimeout(_apply, 120); }
    window.addEventListener('hashchange', _tick);
    document.addEventListener('click', _tick, true);
    _tick();
  })();


  /* QUEUE_DIAG_20261112: 固定小条显示队列前 3 张卡号，答题页也可见 */
  try {
    (function () {
      function fill() {
        var el = document.getElementById('QUEUE-DIAG');
        if (!el) return;
        try {
          var ids = todayQueue() || [];
          var cs = ids.slice(0, 3).map(function (id) { var q = BY[id]; return q ? (q.card || '?') : '?'; });
          var f = ids[0] ? BY[ids[0]] : null;
          el.innerHTML = '<b>队列</b> ' + ids.length + ' 题 ｜首3卡: ' + cs.join(' / ') +
            (f ? ' ｜' + String(f.stem || '').slice(0, 14) : '') +
            ' ｜<span style="color:#93c5fd">v1112-0920</span>';
        } catch (e) {
          el.textContent = '队列诊断失败: ' + String(e).slice(0, 60);
        }
      }
      fill();
      setTimeout(fill, 500); setTimeout(fill, 1500);
      window.addEventListener('hashchange', function () { setTimeout(fill, 300); });
    })();
  } catch (e) {}

  /* ROUND_INIT_20261112: 首屏与 hashchange 时同步折叠状态 */
  try { (function(){ function s(){ try{ if (typeof window._syncRoundBand === 'function') window._syncRoundBand(); }catch(e){} } s(); setTimeout(s, 300); window.addEventListener('hashchange', function(){ setTimeout(s, 100); }); })(); } catch(e) {}
})();
</script>
