别是什么？","q":"动觉与平衡觉分别是什么？","ans":"动觉也叫运动感觉，反映身体各部分的位置和运动，是随意运动的重要基础。平衡觉也叫静觉，由人体运动引起，感受器在内耳的前庭器官，包括反映旋转运动的半规管和反映直线加速的前庭。","kw":["动觉也叫运动感觉","反映身体各部分的位置和运动"],"jx":{"po":"设问「动觉与平衡觉分别是什么？」落在「考点九 躯体感觉」卡 63。这是踩分题：核心 85 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「动觉也叫运动感觉」、「反映身体各部分的位置和运动」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。"},"kp":"px-4-1","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-2","s":"普心","c":4,"t":"填空","card":64,"kd":"考点七 听觉的基本现象","stem":"解释音高的三种理论分别是什么？","q":"解释音高的三种理论分别是什么？","ans":"位置理论（包括赫尔姆霍茨的共鸣理论和冯·贝凯西的行波理论，认为基底膜不同部位对不同频率声音起反应）；频率理论（拉瑟福德提出，认为基底膜按相同频率运动）；神经齐射理论高频时多个毛细胞联合活动）","kw":["位置理论（包括赫尔姆霍茨的共鸣理论和冯·贝凯西的行波理论","认为基底膜不同部位对不同频率声音起反应"],"jx":{"po":"设问「解释音高的三种理论分别是什么？」落在「考点七 听觉的基本现象」卡 64。这是踩分题：核心 95 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「位置理论（包括赫尔姆霍茨的共」、「认为基底膜不同部位对不同频率」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『位置理论』别写成「冯贝克西」（考试写括号外的正确术语）。 同考点还有卡 65「音高理论的记忆规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-2","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-3","s":"普心","c":4,"t":"填空","card":65,"kd":"考点七 听觉的基本现象","stem":"音高理论的记忆规律是什么？","q":"音高理论的记忆规律是什么？","ans":"低于1000Hz用频率理论；1000到5000Hz位置理论和神经齐射理论都起作用；高于5000Hz用位置理论。","kw":["1000到5000Hz位置理论和神经齐射理论都起作用"],"jx":{"po":"设问「音高理论的记忆规律是什么？」落在「考点七 听觉的基本现象」卡 65。这是踩分题：核心 55 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「1000到5000Hz位置理」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 64「解释音高的三种理论分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-3","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-4","s":"普心","c":4,"t":"填空","card":66,"kd":"考点六 听觉概述","stem":"听觉的适宜刺激和频率范围是什么？","q":"听觉的适宜刺激和频率范围是什么？","ans":"听觉的适宜刺激是声波；人耳能接受的频率范围是20～20000赫兹，最敏感区域1000到4000赫兹；声音按波形分乐音和噪声。","kw":["听觉的适宜刺激是声波"],"jx":{"po":"设问「听觉的适宜刺激和频率范围是什么？」落在「考点六 听觉概述」卡 66。这是踩分题：核心 62 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「听觉的适宜刺激是声波」、「人耳能接受的频率范围是20～」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『20000赫兹』别写成「口误说「20到2000赫兹」，两轮复听均如此，考试按教材写20000」（考试写括号外的正确术语）。 同考点还有卡 67「耳的构造与声音传导通路是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-4","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-5","s":"普心","c":4,"t":"填空","card":67,"kd":"考点六 听觉概述","stem":"耳的构造与声音传导通路是什么？","q":"耳的构造与声音传导通路是什么？","ans":"听觉器官是耳，分外耳、中耳、内耳。外耳收集声音；中耳有鼓膜和听小骨传导声音；内耳的耳蜗含有科蒂氏器和毛细胞，这是听觉的感受器；声音传导到大脑颞叶听觉皮层。","kw":["中耳有鼓膜和听小骨传导声音","这是听觉的感受器；声音传导到大脑颞叶听觉皮层"],"jx":{"po":"设问「耳的构造与声音传导通路是什么？」落在「考点六 听觉概述」卡 67。这是踩分题：核心 77 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「中耳有鼓膜和听小骨传导声音」、「这是听觉的感受器；声音传导到」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『有鼓膜和听小骨』别写成「听小鼓」（考试写括号外的正确术语）。 同考点还有卡 66「听觉的适宜刺激和频率范围是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-5","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-6","s":"普心","c":4,"t":"填空","card":68,"kd":"考点五 视觉中的空间和时间因素","stem":"什么是马赫带现象？","q":"什么是马赫带现象？","ans":"在明暗变化的边界上，亮区看到更亮的光带，暗区看到更暗的线条，这是侧抑制的结果","kw":["在明暗变化的边界上"],"jx":{"po":"设问「什么是马赫带现象？」落在「考点五 视觉中的空间和时间因素」卡 68。这是踩分题：核心 38 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「在明暗变化的边界上」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『这是侧抑制』别写成「测抑制」（考试写括号外的正确术语）。 同考点还有卡 69「暗适应与明适应分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-6","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-7","s":"普心","c":4,"t":"填空","card":69,"kd":"考点五 视觉中的空间和时间因素","stem":"暗适应与明适应分别是什么？","q":"暗适应与明适应分别是什么？","ans":"暗适应是照明停止时视觉感受性提高，持续30到40分钟，早期由视杆和视锥共同完成，之后只有视杆起作用；明适应是照明开始时感受性下降，大概5分钟完成。","kw":["暗适应是照明停止时视觉感受性提高"],"jx":{"po":"设问「暗适应与明适应分别是什么？」落在「考点五 视觉中的空间和时间因素」卡 69。这是踩分题：核心 73 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「暗适应是照明停止时视觉感受性」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『早期由视杆』别写成「视感」（考试写括号外的正确术语）。 同考点还有卡 68「什么是马赫带现象？」，两卡常被混问，注意别串。"},"kp":"px-4-7","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-8","s":"普心","c":4,"t":"填空","card":70,"kd":"考点五 视觉中的空间和时间因素","stem":"后像与闪光融合分别是什么？","q":"后像与闪光融合分别是什么？","ans":"后像分正后像和负后像； 还有闪光融合现象，闪光融合临界频率是刚刚引起融合感觉的最小频率。这些概念记关键词。","kw":[" 还有闪光融合现象"],"jx":{"po":"设问「后像与闪光融合分别是什么？」落在「考点五 视觉中的空间和时间因素」卡 70。这是踩分题：核心 53 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「分正后像和负后像 」、「 还有闪光融合现象」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『后像』别写成「后相」（考试写括号外的正确术语）。 同考点还有卡 68「什么是马赫带现象？」，两卡常被混问，注意别串。"},"kp":"px-4-8","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-9","s":"普心","c":4,"t":"填空","card":71,"kd":"考点四 视觉的基本现象","stem":"什么是明度？什么是普肯耶现象？","q":"什么是明度？什么是普肯耶现象？","ans":"明度是眼睛对明暗程度的感觉。普肯耶现象：当从昼视觉向夜视觉转变时，人眼对光谱最大感受性向短波方向移动，所以夜幕降临时蓝花比红花更亮。","kw":["明度是眼睛对明暗程度的感觉","当从昼视觉向夜视觉转变时"],"jx":{"po":"设问「什么是明度？什么是普肯耶现象？」落在「考点四 视觉的基本现象」卡 71。这是踩分题：核心 66 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「明度是眼睛对明暗程度的感觉」、「当从昼视觉向夜视觉转变时」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 72「颜色有哪三个基本特性？」，两卡常被混问，注意别串。"},"kp":"px-4-9","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-10","s":"普心","c":4,"t":"填空","card":72,"kd":"考点四 视觉的基本现象","stem":"颜色有哪三个基本特性？","q":"颜色有哪三个基本特性？","ans":"颜色是光波作用于人眼产生的视觉经验，有三个基本特性：色调取决于波长；明度取决于照明强度和反射系数；饱和度指颜色的纯杂程度。","kw":["颜色是光波作用于人眼产生的视觉经验"],"jx":{"po":"设问「颜色有哪三个基本特性？」落在「考点四 视觉的基本现象」卡 72。这是踩分题：核心 61 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「颜色是光波作用于人眼产生的视」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 71「什么是明度？什么是普肯耶现象？」，两卡常被混问，注意别串。"},"kp":"px-4-10","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-11","s":"普心","c":4,"t":"填空","card":73,"kd":"考点四 视觉的基本现象","stem":"三种色觉理论分别是什么？","q":"三种色觉理论分别是什么？","ans":"三色说（托马斯·杨和赫尔姆霍茨提出，认为视网膜有三种视锥细胞分别感知红绿蓝，但无法解释红绿色盲）；对立过程理论（黑林提出，假定视网膜存在红绿、黄蓝、白黑三对对立的颜色过程，可以解释负后像和颜色互补）；两阶段理论（认为颜色加工在感受阶段符合三色说、在传导阶段符合对立过程理论，把两者统一起来）。","kw":["三色说（托马斯·杨和赫尔姆霍茨提出","认为视网膜有三种视锥细胞分别感知红绿蓝"],"jx":{"po":"设问「三种色觉理论分别是什么？」落在「考点四 视觉的基本现象」卡 73。这是踩分题：核心 146 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「三色说（托马斯·杨和赫尔姆霍」、「认为视网膜有三种视锥细胞分别」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『对立过程理论』别写成「黑灵」（考试写括号外的正确术语）。 同考点还有卡 71「什么是明度？什么是普肯耶现象？」，两卡常被混问，注意别串。"},"kp":"px-4-11","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-4-12","s":"普心","c":4,"t":"填空","card":74,"kd":"考点三 视觉","stem":"视觉刺激的关键数据有哪些？","q":"视觉刺激的关键数据有哪些？","ans":"视觉由光刺激产生，人类80%的信息来自视觉；可见光波长在380到780纳米之间；按波长从长到短为红橙黄绿蓝靛紫。","kw":["视觉由光刺激产生","按波长从长到短为红橙黄绿蓝靛紫"],"jx":{"po":"设问「视觉刺激的关键数据有哪些？」落在「考点三 视觉」卡 74。这是踩分题：核心 56 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「视觉由光刺激产生」、「按波长从长到短为红橙黄绿蓝靛」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『红橙黄绿蓝靛紫』别写成「蓝电子」（考试写括号外的正确术语）。 同考点还有卡 75「视觉的生理机制包括哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-12","imp":"support"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-13","s":"普心","c":4,"t":"填空","card":75,"kd":"考点三 视觉","stem":"视觉的生理机制包括哪些？","q":"视觉的生理机制包括哪些？","ans":"包括折光机制、感光机制、传导机制和中枢机制。折光机制由眼球完成；视网膜上有两种感光细胞，视锥细胞分布在中央窝，昼视感受细节和颜色，视杆细胞分布在边缘，夜视感受明暗；视觉传导经三级神经元到大脑枕叶。","kw":["传导机制和中枢机制"],"jx":{"po":"设问「视觉的生理机制包括哪些？」落在「考点三 视觉」卡 75。这是踩分题：核心 98 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「传导机制和中枢机制」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『昼视』别写成「皱视」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-13","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-14","s":"普心","c":4,"t":"填空","card":76,"kd":"考点三 视觉","stem":"视觉系统有哪两条神经通路？","q":"视觉系统有哪两条神经通路？","ans":"腹侧通路即what通路，负责物体识别；背侧通路即where通路，负责空间位置和运动识别。","kw":["负责物体识别"],"jx":{"po":"设问「视觉系统有哪两条神经通路？」落在「考点三 视觉」卡 76。这是踩分题：核心 44 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「负责物体识别」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『腹侧』别写成「负测」（考试写括号外的正确术语）。 同考点还有卡 74「视觉刺激的关键数据有哪些？」，两卡常被混问，注意别串。"},"kp":"px-4-14","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-15","s":"普心","c":4,"t":"填空","card":77,"kd":"考点二 感觉的测量","stem":"感受性与感觉阈限是什么关系？如何分类？","q":"感受性与感觉阈限是什么关系？如何分类？","ans":"感受性是指人对适宜刺激的感觉能力，感觉阈限是能引起感觉的刺激量，两者成反比。分两类：绝对感受性对应绝对感觉阈限，指刚刚能引起感觉的最小刺激量；差别感受性对应差别感觉阈限，即最小可觉差。","kw":["感受性是指人对适宜刺激的感觉能力，感觉阈限是能引起感觉的刺激量"],"jx":{"po":"设问「感受性与感觉阈限是什么关系？如何分类？」落在「考点二 感觉的测量」卡 77。这是踩分题：核心 92 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「感受性是指人对适宜刺激的感觉」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 78「韦伯定律的内容是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-15","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-16","s":"普心","c":4,"t":"填空","card":78,"kd":"考点二 感觉的测量","stem":"韦伯定律的内容是什么？","q":"韦伯定律的内容是什么？","ans":"差别感觉取决于刺激增量与原刺激量的比值，韦伯分数越低感受性越敏锐，但只适用于中等强度刺激。","kw":["差别感觉取决于刺激增量与原刺激量的比值"],"jx":{"po":"设问「韦伯定律的内容是什么？」落在「考点二 感觉的测量」卡 78。这是踩分题：核心 45 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「差别感觉取决于刺激增量与原刺」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『韦伯分数』别写成「尾搏分数」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-16","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-17","s":"普心","c":4,"t":"填空","card":79,"kd":"考点二 感觉的测量","stem":"费希纳的对数定律与斯蒂文斯的幂定律分别是什么？","q":"费希纳的对数定律与斯蒂文斯的幂定律分别是什么？","ans":"对数定律由费希纳提出，认为刺激强度按几何级数增加时感觉强度按算术级数上升。幂定律由斯蒂文斯用数量估计法提出，心理量与刺激量的幂成正比。","kw":["对数定律由费希纳提出","认为刺激强度按几何级数增加时感觉强度按算术级数上升"],"jx":{"po":"设问「费希纳的对数定律与斯蒂文斯的幂定律分别是什么？」落在「考点二 感觉的测量」卡 79。这是踩分题：核心 67 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「对数定律由费希纳提出」、「认为刺激强度按几何级数增加时」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『数定律由费希纳』别写成「费西纳」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-17","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-18","s":"普心","c":4,"t":"填空","card":80,"kd":"考点二 感觉的测量","stem":"同一感受器内的三种感觉现象是什么？","q":"同一感受器内的三种感觉现象是什么？","ans":"感觉适应（刺激持续作用使感受性发生变化）；感觉对比；感觉后效。","kw":["感觉适应（刺激持续作用使感受性发生变化"],"jx":{"po":"设问「同一感受器内的三种感觉现象是什么？」落在「考点二 感觉的测量」卡 80。这是踩分题：核心 31 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「感觉适应（刺激持续作用使感受」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『感觉对比』别写成「即时对比」（考试写括号外的正确术语）。 同考点还有卡 77「感受性与感觉阈限是什么关系？如何分类？」，两卡常被混问，注意别串。"},"kp":"px-4-18","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-4-19","s":"普心","c":4,"t":"填空","card":81,"kd":"考点一 感觉概述","stem":"感觉的定义是什么？","q":"感觉的定义是什么？","ans":"感觉是人脑对直接作用于感觉器官的客观事物的个别属性的反应","kw":["人脑对直接作用于感觉器官","客观事物的个别属性"],"jx":{"po":"设问「感觉的定义是什么？」落在「考点一 感觉概述」卡 81。这是踩分题：核心 28 字、1 处空；先想得分点，再逐点写。","ok":"踩分术语 1 个：「感觉」。先写术语，再展开。","bad":"同考点还有卡 82「感觉如何分类？近刺激与远刺激是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-19","qt":"jie","imp":"core","_kwfix":"D0044_KWFIX_20261113"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-20","s":"普心","c":4,"t":"填空","card":82,"kd":"考点一 感觉概述","stem":"感觉如何分类？近刺激与远刺激是什么？","q":"感觉如何分类？近刺激与远刺激是什么？","ans":"按刺激性质和感官性质分外部感觉和内部感觉：外部感觉接受外部刺激，如视觉、听觉；内部感觉也叫机体觉，如动觉、内脏感觉。另外考夫卡将刺激分为近刺激和远刺激：近刺激直接作用于感官且时刻变化，远刺激来自物体本身相对稳定。","kw":["按刺激性质和感官性质分外部感觉和内部感觉"],"jx":{"po":"设问「感觉如何分类？近刺激与远刺激是什么？」落在「考点一 感觉概述」卡 82。这是踩分题：核心 106 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「按刺激性质和感官性质分外部感」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『感觉也叫机体觉』别写成「肌体觉」（考试写括号外的正确术语）。 同考点还有卡 81「感觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-4-20","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-4-21","s":"普心","c":4,"t":"填空","card":83,"kd":"考点一 感觉概述","stem":"什么是感觉编码？有哪三种理论？","q":"什么是感觉编码？有哪三种理论？","ans":"是指外界能量必须经过感官的换能作用，转化为神经系统能接受的神经冲动。三种理论：缪勒的神经特殊能量学说认为每种感觉神经有其特殊能量；特异化理论认为不同感觉由不同神经元传递；模式理论认为编码由整组神经元的激活模式引起。","kw":["是指外界能量必须经过感官的换能作用","转化为神经系统能接受的神经冲动"],"jx":{"po":"设问「什么是感觉编码？有哪三种理论？」落在「考点一 感觉概述」卡 83。这是踩分题：核心 107 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「是指外界能量必须经过感官的换」、「转化为神经系统能接受的神经冲」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『经过感官的换能』别写成「幻能」（考试写括号外的正确术语）。 同考点还有卡 81「感觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-4-21","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-4-22","s":"普心","c":4,"t":"填空","card":84,"kd":"次要卡","stem":"什么是触压觉？两点辨别阈限指什么？","q":"什么是触压觉？两点辨别阈限指什么？","ans":"触压觉分触觉和压觉，面部对压力最敏感。两点辨别阈限是指能分辨皮肤上两个点的最小距离，手指阈限最低。","kw":["触压觉分触觉和压觉","面部对压力最敏感"],"jx":{"po":"设问「什么是触压觉？两点辨别阈限指什么？」落在「次要卡」卡 84。这是踩分题：核心 49 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「触压觉分触觉和压觉」、「面部对压力最敏感」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『两点辨别阈限』别写成「御线」（考试写括号外的正确术语）。 同考点还有卡 85「温度觉如何产生？感受器分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-4-22","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-4-23","s":"普心","c":4,"t":"填空","card":85,"kd":"次要卡","stem":"温度觉如何产生？感受器分别是什么？","q":"温度觉如何产生？感受器分别是什么？","ans":"皮肤表面温度叫生理零度，高于它产生温觉，感受器是罗夫尼氏小体；低于它产生冷觉，感受器是克劳斯氏球。","kw":["皮肤表面温度叫生理零度","感受器是罗夫尼氏小体"],"jx":{"po":"设问「温度觉如何产生？感受器分别是什么？」落在「次要卡」卡 85。这是踩分题：核心 49 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「皮肤表面温度叫生理零度」、「感受器是罗夫尼氏小体」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-23","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-4-24","s":"普心","c":4,"t":"填空","card":86,"kd":"次要卡","stem": ":"研究感觉有什么意义？","q":"研究感觉有什么意义？","ans":"理论意义：感觉是一切较复杂认识活动的基础。应用价值：感觉是人脑获取信息的唯一途径，提供生存和安全信息。","kw":["感觉是一切较复杂认识活动的基础","感觉是人脑获取信息的唯一途径"],"jx":{"po":"设问「研究感觉有什么意义？」落在「次要卡」卡 94。这是踩分题：核心 51 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「感觉是一切较复杂认识活动的基」、「感觉是人脑获取信息的唯一途径」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 84「什么是触压觉？两点辨别阈限指什么？」，两卡常被混问，注意别串。"},"kp":"px-4-32","imp":"support"},{"fk":"","kaofa":"再现","tier":"B","id":"px-5-1","s":"普心","c":5,"t":"填空","card":95,"kd":"考点七 运动知觉","stem":"什么是真正运动知觉？","q":"什么是真正运动知觉？","ans":"是指物体按一定速度从一处向另一处做连续位移，或观察者朝向目标运动，直接依赖运动速度，太慢或太快都不能产生运动知觉；物体运动速度低于下阈限看不到运动，高于上阈限只能看到闪烁。","kw":["是指物体按一定速度从一处向另一处做连续位移"],"jx":{"po":"设问「什么是真正运动知觉？」落在「考点七 运动知觉」卡 95。这是踩分题：核心 86 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「是指物体按一定速度从一处向另」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『速度低于下阈限』别写成「下预线」（考试写括号外的正确术语）。 同考点还有卡 96「什么是似动？有哪四种形式？」，两卡常被混问，注意别串。"},"kp":"px-5-1","imp":"support"},{"fk":"","kaofa":"再现","tier":"B","id":"px-5-2","s":"普心","c":5,"t":"填空","card":96,"kd":"考点七 运动知觉","stem":"什么是似动？有哪四种形式？","q":"什么是似动？有哪四种形式？","ans":"是指在一定条件下在静止物体间看到运动，或在没有连续位移的地方看到连续运动。四种形式：动景运动（即φ运动，由韦特海默最早发现，是电影和霓虹灯的原理，两个刺激按一定时空间隔相继呈现时看到连续运动）；诱发运动（一个物体的运动使相邻静止物体产生运动印象，比如彩云追月）；自主运动（暗室中注视静止亮点会看到光点动荡）；运动后效（注视运动物体后转向静止物体看到反向运动，也叫瀑布效应）。","kw":["动景运动","诱发运动","自主运动","运动后效"],"jx":{"po":"设问「什么是似动？有哪四种形式？」落在「考点七 运动知觉」卡 96。这是踩分题：核心 187 字、4 处空；先想得分点，再逐点写。","ok":"踩分术语 4 个：「四种形式」、「诱发运动」、「自主运动」、「运动后效」。先写术语，再展开。","bad":"同音字坑：『动景运动』别写成「FY运动」（考试写括号外的正确术语）。 同考点还有卡 95「什么是真正运动知觉？」，两卡常被混问，注意别串。"},"kp":"px-5-2","imp":"support","_kwfix":"D0044_KWFIX_20261113"},{"fk":"是","kaofa":"再现","tier":"B","id":"px-5-3","s":"普心","c":5,"t":"填空","card":97,"kd":"考点六 时间知觉","stem":"时间知觉分为哪三种类型？","q":"时间知觉分为哪三种类型？","ans":"时序知觉（分辨前后顺序）；时距知觉；时点知觉（知道具体时间）","kw":["时序知觉","时点知觉"],"jx":{"po":"设问「时间知觉分为哪三种类型？」落在「考点六 时间知觉」卡 97。这是踩分题：核心 30 字、2 处空；先想得分点，再逐点写。","ok":"踩分术语 2 个：「时序知觉」、「时点知觉」。先写术语，再展开。","bad":"同音字坑：『时距知觉』别写成「也记作时序知觉，估计持续时间，人对三秒左右的时间估计最准确」（考试写括号外的正确术语）。"},"kp":"px-5-3","imp":"support"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-5-4","s":"普心","c":5,"t":"填空","card":98,"kd":"考点五 空间知觉","stem":"格式塔心理学家提出的知觉组织原则有哪些？","q":"格式塔心理学家提出的知觉组织原则有哪些？","ans":"形状知觉是视觉、触觉、动觉协同活动的结果。格式塔心理学家提出知觉组织原则包括：邻近性、相似性、对称性、良好连续、共同命运、封闭、线条朝向、简单性、均质连接性。","kw":["动觉协同活动的结果","格式塔心理学家提出知觉组织原则包括"],"jx":{"po":"设问「格式塔心理学家提出的知觉组织原则有哪些？」落在「考点五 空间知觉」卡 98。这是踩分题：核心 79 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「动觉协同活动的结果」、「格式塔心理学家提出知觉组织原」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 99「深度知觉的三类线索分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-5-4","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"B","id":"px-5-5","s":"普心","c":5,"t":"填空","card":99,"kd":"考点五 空间知觉","stem":"深度知觉的三类线索分别是什么？","q":"深度知觉的三类线索分别是什么？","ans":"肌肉线索包括调节和辐合；单眼线索包括对象遮挡、线条透视、空气透视、相对高度、纹理梯度、运动视差、运动透视、相对大小、明暗阴影；双眼线索即双眼视差，是深度知觉的主要依赖线索，范围可达1300米。其中运动视差和运动透视要区分：运动视差强调方向与速度差异，运动透视强调速度差异。","kw":["肌肉线索包括调节和辐合"],"jx":{"po":"设问「深度知觉的三类线索分别是什么？」落在「考点五 空间知觉」卡 99。这是踩分题：核心 136 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「肌肉线索包括调节和辐合」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『包括调节和辐合』别写成「符合」（考试写括号外的正确术语）。 同考点还有卡 98「格式塔心理学家提出的知觉组织原则有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-5","imp":"support"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-5-6","s":"普心","c":5,"t":"填空","card":100,"kd":"考点三 知觉的特性","stem":"什么是知觉的选择性？影响因素有哪些？","q":"什么是知觉的选择性？影响因素有哪些？","ans":"人在知觉时总是有选择地把少数事物当作对象，其他事物当作背景。影响因素包括注意和知觉主体。","kw":["人在知觉时总是有选择地把少数事物当作对象"],"jx":{"po":"设问「什么是知觉的选择性？影响因素有哪些？」落在「考点三 知觉的特性」卡 100。这是踩分题：核心 44 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「人在知觉时总是有选择地把少数」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 101「什么是知觉的整体性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-6","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-5-7","s":"普心","c":5,"t":"填空","card":101,"kd":"考点三 知觉的特性","stem":"什么是知觉的整体性？影响因素有哪些？","q":"什么是知觉的整体性？影响因素有哪些？","ans":"整体性也叫组织性，人的知觉系统有把个别属性和部分综合成整体的能力。影响因素包括刺激物的结构和个体的知识经验。内文通过大小字母判断实验发现了整体优先，个体对整体特征比局部特征更敏感。","kw":["整体性也叫组织性","人的知觉系统有把个别属性和部分综合成整体的能力"],"jx":{"po":"设问「什么是知觉的整体性？影响因素有哪些？」落在「考点三 知觉的特性」卡 101。这是踩分题：核心 90 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「整体性也叫组织性」、「人的知觉系统有把个别属性和部」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『内文』别写成「内温」（考试写括号外的正确术语）。 同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-7","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-5-8","s":"普心","c":5,"t":"填空","card":102,"kd":"考点三 知觉的特性","stem":"什么是知觉的理解性？影响因素有哪些？","q":"什么是知觉的理解性？影响因素有哪些？","ans":"人在知觉过程中以过去的知识经验为依据，对知觉对象做出解释。影响因素包括知识经验、语言指导等。","kw":["人在知觉过程中以过去的知识经验为依据"],"jx":{"po":"设问「什么是知觉的理解性？影响因素有哪些？」落在「考点三 知觉的特性」卡 102。这是踩分题：核心 46 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「人在知觉过程中以过去的知识经」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-8","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-5-9","s":"普心","c":5,"t":"填空","card":103,"kd":"考点三 知觉的特性","stem":"什么是知觉的恒常性？影响因素有哪些？","q":"什么是知觉的恒常性？影响因素有哪些？","ans":"当知觉的客观条件在一定范围内改变时，知觉印象保持稳定性，在形状、大小、明度和颜色知觉中都存在。影响因素包括知识经验和视觉线索。四个特性选择性、整体性、理解性、恒常性的名称背下来，各自能说出影响因素。","kw":["当知觉的客观条件在一定范围内改变时"],"jx":{"po":"设问「什么是知觉的恒常性？影响因素有哪些？」落在「考点三 知觉的特性」卡 103。这是踩分题：核心 99 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「当知觉的客观条件在一定范围内」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 100「什么是知觉的选择性？影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-5-9","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-5-10","s":"普心","c":5,"t":"填空","card":104,"kd":"考点二 知觉的信息加工","stem":"什么是自下而上的加工？","q":"什么是自下而上的加工？","ans":"也叫数据驱动加工，是对感觉信息的加工，从外部刺激开始逐步形成知觉。","kw":["也叫数据驱动加工","是对感觉信息的加工"],"jx":{"po":"设问「什么是自下而上的加工？」落在「考点二 知觉的信息加工」卡 104。这是踩分题：核心 33 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「也叫数据驱动加工」、「是对感觉信息的加工」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 105「什么是自上而下的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-10","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-5-11","s":"普心","c":5,"t":"填空","card":105,"kd":"考点二 知觉的信息加工","stem":"什么是自上而下的加工？","q":"什么是自上而下的加工？","ans":"也叫概念驱动加工，是对非感觉信息的加工，由知识、经验引导知觉。","kw":["也叫概念驱动加工","是对非感觉信息的加工"],"jx":{"po":"设问「什么是自上而下的加工？」落在「考点二 知觉的信息加工」卡 105。这是踩分题：核心 31 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「也叫概念驱动加工」、「是对非感觉信息的加工」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 104「什么是自下而上的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-11","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-5-12","s":"普心","c":5,"t":"填空","card":106,"kd":"考点二 知觉的信息加工","stem":"自下而上与自上而下两种加工如何交互？","q":"自下而上与自上而下两种加工如何交互？","ans":"通常情况下两种加工交互作用：当过去经验提供的非感觉信息多时，自上而下加工占优势；反之自下而上加工占优势。这两种方式要区分清楚。","kw":["通常情况下两种加工交互作用","当过去经验提供的非感觉信息多时"],"jx":{"po":"设问「自下而上与自上而下两种加工如何交互？」落在「考点二 知觉的信息加工」卡 106。这是踩分题：核心 63 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「通常情况下两种加工交互作用」、「当过去经验提供的非感觉信息多」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 104「什么是自下而上的加工？」，两卡常被混问，注意别串。"},"kp":"px-5-12","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-5-13","s":"普心","c":5,"t":"填空","card":107,"kd":"考点一 知觉概述","stem":"知觉的定义是什么？","q":"知觉的定义是什么？","ans":"知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。","kw":["知觉是客观事物直接作用于感官而在头脑中产生的对事物整体的认识"],"jx":{"po":"设问「知觉的定义是什么？」落在「考点一 知觉概述」卡 107。这是踩分题：核心 51 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「知觉是客观事物直接作用于感官」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 108「感觉与知觉有什么相同点和区别？」，两卡常被混问，注意别串。"},"kp":"px-5-13","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-5-14","s":"普心","c":5,"t":"填空","card":108,"kd":"考点一 知觉概述","stem":"感觉与知觉有什么相同点和区别？","q":"感觉与知觉有什么相同点和区别？","ans":"相同点：都是对当前直接作用于感官的客观事物的反应。区别：感觉是对个别属性的反应，介于生理和心理之间，不需要或很少需要知识经验；知觉是对整体的反应，是纯粹的心理活动，需要知识经验的参与。感觉是知觉的前提和基础，知觉是感觉的深入和发展。这个关系要理解清楚。","kw":["都是对当前直接作用于感官的客观事物的反应"],"jx":{"po":"设问「感觉与知觉有什么相同点和区别？」落在「考点一 知觉概述」卡 108。这是踩分题：核心 126 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「都是对当前直接作用于感官的客」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 107「知觉的定义是什么？（老师原话：我们记这句」，两卡常被混问，注意别串。"},"kp":"px-5-14","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-5-15","s":"普心","c":5,"t":"填空","card":109,"kd":"次要卡","stem":"什么是错觉？错觉与幻觉有什么区别？","q":"什么是错觉？错觉与幻觉有什么区别？","ans":"错觉是知觉不能正确表达外界事物特性而产生的歪曲。错觉不同于幻觉，是在一定条件下必然产生的正常现象。研究错觉的理论意义是有助于揭示正常知觉规律，实践意义是可以消除不利影响、利用错觉为生活服务。","kw":["错觉是知觉不能正确表达外界事物特性而产生的歪曲"],"jx":{"po":"设问「什么是错觉？错觉与幻觉有什么区别？」落在「次要卡」卡 109。这是踩分题：核心 95 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「错觉是 就是这几段：「用节省法研究无意义音节」、「发现遗忘在学习之后立即开始」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『艾宾浩斯』别写成「艾宾号斯」（考试写括号外的正确术语）。 同考点还有卡 125「遗忘的影响因素有哪些？」，两卡常被混问，注意别串。"},"kp":"px-6-4","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-5","s":"普心","c":6,"t":"填空","card":125,"kd":"考点八 遗忘","stem":"遗忘的影响因素有哪些？","q":"遗忘的影响因素有哪些？","ans":"第一，时间因素。第二，识记材料的性质与数量，形象、有意义、有韵律的材料比抽象、无意义、无韵律的材料遗忘得慢。第三，学习程度，过度学习150%时效果最佳。第四，系列位置效应。第五，识记者的态度等。","kw":["识记材料的性质与数量","有韵律的材料比抽象"],"jx":{"po":"设问「遗忘的影响因素有哪些？」落在「考点八 遗忘」卡 125。这是踩分题：核心 97 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「识记材料的性质与数量」、「有韵律的材料比抽象」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-5","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-6","s":"普心","c":6,"t":"填空","card":126,"kd":"考点八 遗忘","stem":"什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？","q":"什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？","ans":"最后呈现的材料回忆效果最好，叫近因效应；最先呈现的材料较易回忆，叫首因效应；中间部分最难回忆，因为它同时受到前摄抑制和倒摄抑制的影响。前摄抑制是先学材料干扰后学材料，倒摄抑制是后学材料干扰先学材料。要理解。","kw":["最后呈现的材料回忆效果最好","最先呈现的材料较易回忆"],"jx":{"po":"设问「什么是系列位置效应？前摄抑制与倒摄抑制分别是什么？」落在「考点八 遗忘」卡 126。这是踩分题：核心 103 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「最后呈现的材料回忆效果最好」、「最先呈现的材料较易回忆」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『近因』别写成「静音」（考试写括号外的正确术语）。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-6","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-7","s":"普心","c":6,"t":"填空","card":127,"kd":"考点八 遗忘","stem":"四种遗忘理论分别是什么？","q":"四种遗忘理论分别是什么？","ans":"衰退说：认为记忆痕迹得不到强化就会逐渐减弱以至消退，在感觉记忆和短时记忆中未经注意或重复的学习材料确实如此，但很难用实验证实。干扰说：认为遗忘是由于学习和回忆之间受到其他刺激的干扰，一旦干扰被排除记忆就能恢复，前摄抑制和倒摄抑制就是有力证据。压抑说：由弗洛伊德在临床治疗中首次发现，认为遗忘是由情绪或动机的压抑作用引起，那些令人痛苦或焦虑的记忆会被主动压抑到无意识中，压抑解除后记忆就能恢复；这一说法考虑了个体的需要、欲望和情绪在记忆中的作用，但很难用实验证实。提取失败说：认为存储在长时记忆中的信息不会丢失，遗忘只是因为提取时没有找到适当的线索，舌尖现象就是典型表现，通常是由语言信息的提取失败造成的。四个理论的名称和核心观点背下来。","kw":["认为记忆痕迹得不到强化就会逐渐减弱以至消退"],"jx":{"po":"设问「四种遗忘理论分别是什么？」落在「考点八 遗忘」卡 127。这是踩分题：核心 318 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「认为记忆痕迹得不到强化就会逐」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 124「艾宾浩斯遗忘曲线的发现过程和规律是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-7","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-8","s":"普心","c":6,"t":"填空","card":128,"kd":"考点七 长时记忆","stem":"长时记忆的编码有什么特点？","q":"长时记忆的编码有什么特点？","ans":"长时记忆保持时间在一分钟以上，容量没有限制，主要编码方式是语义编码；另外还有形象编码，以表象代码存储具体事物信息。影响编码的因素包括觉醒状态和加工深度，加工越深记忆效果越好。","kw":["长时记忆保持时间在一分钟以上","主要编码方式是语义编码"],"jx":{"po":"设问「长时记忆的编码有什么特点？」落在「考点七 长时记忆」卡 128。这是踩分题：核心 87 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「长时记忆保持时间在一分钟以上」、「主要编码方式是语义编码」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『方式是语义编码』别写成「语意编码」（考试写括号外的正确术语）。 同考点还有卡 129「长时记忆存储会发生哪些变化？」，两卡常被混问，注意别串。"},"kp":"px-6-8","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-9","s":"普心","c":6,"t":"填空","card":129,"kd":"考点七 长时记忆","stem":"长时记忆存储会发生哪些变化？","q":"长时记忆存储会发生哪些变化？","ans":"存储是一个动态过程，有量的变化和质的变化。量的方面，信息随时间推移逐渐减少，但存在记忆恢复现象：间隔一段时间后测得的保持量可能比立即测得的还多。质的方面，内容会变得更简略、概括，更完整、合理，或更夸张、突出。","kw":["存储是一个动态过程","有量的变化和质的变化"],"jx":{"po":"设问「长时记忆存储会发生哪些变化？」落在「考点七 长时记忆」卡 129。这是踩分题：核心 104 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「存储是一个动态过程」、「有量的变化和质的变化」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-9","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-10","s":"普心","c":6,"t":"填空","card":130,"kd":"考点七 长时记忆","stem":"什么是错误记忆？研究错误记忆的常用范式是什么？","q":"什么是错误记忆？研究错误记忆的常用范式是什么？","ans":"错误记忆是指人们对过去事件的报告与事实出现偏离；研究错误记忆的常用范式是DRM范式。","kw":["错误记忆是指人们对过去事件的报告与事实出现偏离"],"jx":{"po":"设问「什么是错误记忆？研究错误记忆的常用范式是什么？」落在「考点七 长时记忆」卡 130。这是踩分题：核心 42 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「错误记忆是指人们对过去事件的」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-10","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-11","s":"普心","c":6,"t":"填空","card":131,"kd":"考点七 长时记忆","stem":"长时记忆的两种提取形式是什么？","q":"长时记忆的两种提取形式是什么？","ans":"再认：事物再度呈现使人能认识，分熟悉感和回想两种形式。回忆：事物在头脑中重新出现，比再认困难。提取线索包括情境依存性记忆、状态依存性记忆、自我参照效应、闪光灯记忆等，这些概念名称记关键词。","kw":["事物再度呈现使人能认识"],"jx":{"po":"设问「长时记忆的两种提取形式是什么？」落在「考点七 长时记忆」卡 131。这是踩分题：核心 94 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「事物再度呈现使人能认识」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『分熟悉感和回想』别写成「回响」（考试写括号外的正确术语）。 同考点还有卡 128「长时记忆的编码有什么特点？」，两卡常被混问，注意别串。"},"kp":"px-6-11","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-12","s":"普心","c":6,"t":"填空","card":132,"kd":"考点六 工作记忆","stem":"巴德利的工作记忆模型包括哪四个成分？","q":"巴德利的工作记忆模型包括哪四个成分？","ans":"语音环路（用于存储和加工语音信息，分语音存储和发音复述两个部分）；视觉空间模板（用于存储和加工视觉与空间信息）；情景缓冲器（暂时存储和合并来自不同渠道的信息，被中央执行系统使用）；中央执行系统（是工作记忆的核心，一个注意资源有限的控制系统，负责协调其他三个成分的活动、分配注意资源）。","kw":["语音环路（用于存储和加工语音信息","分语音存储和发音复述两个部分"],"jx":{"po":"设问「巴德利的工作记忆模型包括哪四个成分？」落在「考点六 工作记忆」卡 132。这是踩分题：核心 142 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「语音环路（用于存储和加工语音」、「分语音存储和发音复述两个部分」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『语音环路』别写成「发音附数」（考试写括号外的正确术语）。"},"kp":"px-6-12","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-13","s":"普心","c":6,"t":"填空","card":133,"kd":"考点五 短时记忆","stem":"短时记忆的编码方式有哪些？相关实验是什么？","q":"短时记忆的编码方式有哪些？相关实验是什么？","ans":"短时记忆保持时间约一分钟，主要编码方式为听觉编码（康拉德实验证明语音相似性影响回忆效果）；最初阶段是视觉编码（波斯纳实验证明同形字母反应更快）；另外还有语义编码。","kw":["短时记忆保持时间约一分钟"],"jx":{"po":"设问「短时记忆的编码方式有哪些？相关实验是什么？」落在「考点五 短时记忆」卡 133。这是踩分题：核心 81 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「短时记忆保持时间约一分钟」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『阶段是视觉编码』别写成「同型」（考试写括号外的正确术语）。 同考点还有卡 134「短时记忆的容量是多少？什么是组块？」，两卡常被混问，注意别串。"},"kp":"px-6-13","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-14","s":"普心","c":6,"t":"填空","card":134,"kd":"考点五 短时记忆","stem":"短时记忆的容量是多少？什么是组块？","q":"短时记忆的容量是多少？什么是组块？","ans":"短时记忆容量有限，米勒研究发现约为7加减2个组块；组块是一个有意义的信息单元；组块化可以通过知识经验扩大每个组块的信息量，从而增加容量。","kw":["短时记忆容量有限","米勒研究发现约为7加减2个组块"],"jx":{"po":"设问「短时记忆的容量是多少？什么是组块？」落在「考点五 短时记忆」卡 134。这是踩分题：核心 68 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「短时记忆容量有限」、「米勒研究发现约为7加减2个组」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 133「短时记忆的编码方式有哪些？相关实验是什么」，两卡常被混问，注意别串。"},"kp":"px-6-14","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-15","s":"普心","c":6,"t":"填空","card":135,"kd":"考点五 短时记忆","stem":"复述分为哪两种？哪种更有效？","q":"复述分为哪两种？哪种更有效？","ans":"复述是保持信息的有效方法，分机械复述和精细复述；精细复述是最有效的方法。短时记忆的遗忘主要由干扰引起。","kw":["复述是保持信息的有效方法","分机械复述和精细复述"],"jx":{"po":"设问「复述分为哪两种？哪种更有效？」落在「考点五 短时记忆」卡 135。这是踩分题：核心 51 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「复述是保持信息的有效方法」、「分机械复述和精细复述」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『复述』别写成「复数」（考试写括号外的正确术语）。 同考点还有卡 133「短时记忆的编码方式有哪些？相关实验是什么」，两卡常被混问，注意别串。"},"kp":"px-6-15","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-16","s":"普心","c":6,"t":"填空","card":136,"kd":"考点四 感觉记忆","stem":"感觉记忆的定义是什么？","q":"感觉记忆的定义是什么？","ans":"感觉记忆也叫感觉登记或瞬时记忆， 是客观刺激停止作用后感觉信息在极短时间内被保存下来的记忆。原句背。","kw":[" 是客观刺激停止作"],"jx":{"po":"设问「感觉记忆的定义是什么？」落在「考点四 感觉记忆」卡 136。这是踩分题：核心 50 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「感觉记忆也叫感觉 」、「 是客观刺激停止作」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『登记或瞬时记忆』别写成「顺时记忆」（考试写括号外的正确术语）。 同考点还有卡 137「图像记忆与声像记忆分别是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-16","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-17","s":"普心","c":6,"t":"填空","card":137,"kd":"考点四 感觉记忆","stem":"图像记忆与声像记忆分别是什么？","q":"图像记忆与声像记忆分别是什么？","ans":"视觉的感觉记忆叫图像记忆，保持约一秒，斯伯林用部分报告法证明其存在；听觉的感觉记忆叫声像记忆或回声存储，保持五到十秒。","kw":["视觉的感觉记忆叫图像记忆","斯伯林用部分报告法证明其存在"],"jx":{"po":"设问「图像记忆与声像记忆分别是什么？」落在「考点四 感觉记忆」卡 137。这是踩分题：核心 59 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「视觉的感觉记忆叫图像记忆」、「斯伯林用部分报告法证明其存在」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『记忆叫图像记忆』别写成「印象记忆」（考试写括号外的正确术语）。 同考点还有卡 136「感觉记忆的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-17","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-18","s":"普心","c":6,"t":"填空","card":138,"kd":"考点四 感觉记忆","stem":"感觉记忆有哪些特征？","q":"感觉记忆有哪些特征？","ans":"具有鲜明的形象性；依据物理特征编码；容量较大，进入感觉器官的信息几乎都能被登记；受到注意的信息有机会进入短时记忆。","kw":["具有鲜明的形象性","依据物理特征编码；容量较大"],"jx":{"po":"设问「感觉记忆有哪些特征？」落在「考点四 感觉记忆」卡 138。这是踩分题：核心 57 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「具有鲜明的形象性」、「依据物理特征编码；容量较大」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 136「感觉记忆的定义是什么？」，两卡常被混问，注意别串。"},"kp":"px-6-18","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-19","s":"普心","c":6,"t":"填空","card":139,"kd":"考点二 记忆的分类","stem":"按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？","q":"按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？","ans":"分感觉记忆、短时记忆、长时记忆。阿特金森和谢夫林提出了三级记忆模型说明三者的关系：信息先进入感觉记忆，经过注意进入短时记忆，经过复述进入长时记忆。对长时记忆，图尔文又分为情景记忆和语义记忆，另外还分程序性记忆和陈述性记忆。","kw":["阿特金森和谢夫林提出了三级记忆模型说明三者的关系"],"jx":{"po":"设问「按信息保持时间长短记忆分为哪三类？三级记忆模型是什么？」落在「考点二 记忆的分类」卡 139。这是踩分题：核心 111 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「阿特金森和谢夫林提出了三级记」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『特金森和谢夫林』别写成「谢佛林」（考试写括号外的正确术语）。 同考点还有卡 140「外显记忆与内隐记忆有哪五个区别？」，两卡常被混问，注意别串。"},"kp":"px-6-19","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-20","s":"普心","c":6,"t":"填空","card":140,"kd":"考点二 记忆的分类","stem":"外显记忆与内隐记忆有哪五个区别？","q":"外显记忆与内隐记忆有哪五个区别？","ans":"加工深度影响外显但不影响内隐；保持时间上外显随间隔延长而减少但内隐不受影响；记忆负荷量影响外显但不影响内隐；干扰因素影响外显但内隐不易受干扰；感觉通道改变严重影响内隐但不影响外显。这五个区别理解意思即可（一内四外是核心）。","kw":["加工深度影响外显但不影响内隐","保持时间上外显随间隔延长而减少但内隐不受影响"],"jx":{"po":"设问「外显记忆与内隐记忆有哪五个区别？」落在「考点二 记忆的分类」卡 140。这是踩分题：核心 111 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「加工深度影响外显但不影响内隐」、「保持时间上外显随间隔延长而减」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 139「按信息保持时间长短记忆分为哪三类？三级记」，两卡常被混问，注意别串。"},"kp":"px-6-20","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-21","s":"普心","c":6,"t":"填空","card":141,"kd":"考点二 记忆的分类","stem":"按记忆的具体内容分为哪四类？","q":"按记忆的具体内容分为哪四类？","ans":"形象记忆、逻辑记忆、情绪记忆和动作记忆；逻辑记忆以语词为中介，是人类特有的","kw":["情绪记忆和动作记忆"],"jx":{"po":"设问「按记忆的具体内容分为哪四类？」落在「考点二 记忆的分类」卡 141。这是踩分题：核心 37 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「情绪记忆和动作记忆」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 139「按信息保持时间长短记忆分为哪三类？三级记」，两卡常被混问，注意别串。"},"kp":"px-6-21","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-22","s":"普心","c":6,"t":"填空","card":142,"kd":"考点一 记忆概述","stem":"记忆的定义是什么？","q":"记忆的定义是什么？","ans":"记忆是在头脑中积累和保存个体经验的心理过程。用信息加工的术语来讲，就是人脑对外界输入的信息进行编码、存储和提取的过程。","kw":["记忆是在头脑中积累和保存个体经验的心理过程"],"jx":{"po":"设问「记忆的定义是什么？」落在「考点一 记忆概述」卡 142。这是踩分题：核心 59 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「记忆是在头脑中积累和保存个体」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 143「编码、存储、提取分别对应什么？」，两卡常被混问，注意别串。"},"kp":"px-6-22","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-6-23","s":"普心","c":6,"t":"填空","card":143,"kd":"考点一 记忆概述","stem":"编码、存储、提取分别对应什么？","q":"编码、存储、提取分别对应什么？","ans":"编码相当于「记」，存储是「记」和「忆」的中间环节，提取相当于「忆」。","kw":["编码相当于「记","的中间环节"],"jx":{"po":"设问「编码、存储、提取分别对应什么？」落在「考点一 记忆概述」卡 143。这是踩分题：核心 34 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「编码相当于「记」、「的中间环节」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 142「记忆的定义是什么？（老师原话：我们记这一」，两卡常被混问，注意别串。"},"kp":"px-6-23","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-6-24","s":"普心","c":6,"t":"填空","card":144,"kd":"考点一 记忆概述","stem":"传统观点把记忆分为哪三个阶段？","q":"传统观点把记忆分为哪三个阶段？","ans":"识记、保持、回忆和再认；识记是编码，保持是储存，回忆和再认是提取。信息加工角度和传统观点两个框架对照着背。","kw":["回忆和再认是提取","信息加工角度和传统观点两个框架对照着背"],"jx":{"po":"设问「传统观点把记忆分为哪三个阶段？」落在「考点一 记忆概述」卡 144。这是踩分题：核心 53 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「回忆和再认是提取」、「信息加工角度和传统观点两个框」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『识记』别写成「实际」（考试写括号外的正确术语）。 同考点还有卡 142「记忆的定义是什么？（老师原话：我们记这一」，两卡常被混问，注意别串。"},"kp":"px-6-24","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-25","s":"普心","c":6,"t":"填空","card":145,"kd":"次要卡","stem":"第六章九个考点如何串记？","q":"第六章九个考点如何串记？","ans":"考点一记忆概述：编码、存储和提取三个阶段，定义原句背。考点二记忆的分类：三级记忆模型、外显内隐记忆的五个区别、按内容分的四种类型背框架。考点三记忆的生理机制：了解即可。考点四感觉记忆：图像记忆一秒、声像记忆五到十秒，斯伯林的部分报告法记关键词。考点五短时记忆：七加减二个组块，听觉编码为主，精细复述最有效。考点六工作记忆：四个成分的名称和功能背框架。考点七长时记忆：语义编码为主，记忆恢复现象，错误记忆的DRM范式记关键词。考点八遗忘：艾宾浩斯遗忘曲线先快后慢，系列位置效应和前摄倒摄抑制要理解，四种遗忘理论名称背下来。","kw":["存储和提取三个阶段","考点二记忆的分类：三级记忆模型"],"jx":{"po":"设问「第六章九个考点如何串记？」落在「次要卡」卡 145。这是踩分题：核心 260 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「存储和提取三个阶段」、「考点二记忆的分类：三级记忆模」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 146「遗忘分为哪些类型？」，两卡常被混问，注意别串。"},"kp":"px-6-25","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-26","s":"普心","c":6,"t":"填空","card":146,"kd":"次要卡","stem":"遗忘分为哪些类型？","q":"遗忘分为哪些类型？","ans":"分不完全遗忘和完全遗忘、临时性遗忘和永久性遗忘。","kw":["分不完全遗忘和完全遗忘"],"jx":{"po":"设问「遗忘分为哪些类型？」落在「次要卡」卡 146。这是踩分题：核心 24 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「分不完全遗忘和完全遗忘」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-26","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-27","s":"普心","c":6,"t":"填空","card":147,"kd":"次要卡","stem":"工作记忆与短时记忆有什么区别？","q":"工作记忆与短时记忆有什么区别？","ans":"工作记忆由不同成分构成，比短时记忆更加主动，强调在复杂认知活动中的作用；短时记忆是单一成分，强调对信息的短时存储。","kw":["工作记忆由不同成分构成"],"jx":{"po":"设问「工作记忆与短时记忆有什么区别？」落在「次要卡」卡 147。这是踩分题：核心 57 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「工作记忆由不同成分构成」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-27","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-28","s":"普心","c":6,"t":"填空","card":148,"kd":"次要卡","stem":"短时记忆的信息提取方式有哪些？","q":"短时记忆的信息提取方式有哪些？","ans":"斯腾伯格用加法反应时研究发现三种提取方式：平行扫描、自动停止系列扫描和完全系列扫描；短时记忆的主要提取方式是完全系列扫描。","kw":["斯腾伯格用加法反应时研究发现三种提取方式"],"jx":{"po":"设问「短时记忆的信息提取方式有哪些？」落在「次要卡」卡 148。这是踩分题：核心 61 字、1 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「斯腾伯格用加法反应时研究发现」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-28","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-29","s":"普心","c":6,"t":"填空","card":149,"kd":"次要卡","stem":"记忆的脑机制包括哪些内容？","q":"记忆的脑机制包括哪些内容？","ans":"海马负责巩固记忆，帮助信息由短时记忆进入长时记忆，受损会引起顺行性遗忘，即不能存储新信息；杏仁核与情绪记忆特别是消极情绪有关；前额叶在情景记忆、工作记忆中发挥重要作用。在生物化学层面，长时程增强机制是学习和记忆的神经基础。","kw":["海马负责巩固记忆","帮助信息由短时记忆进入长时记忆"],"jx":{"po":"设问「记忆的脑机制包括哪些内容？」落在「次要卡」卡 149。这是踩分题：核心 111 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「海马负责巩固记忆」、「帮助信息由短时记忆进入长时记」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同音字坑：『引起顺行性遗忘』别写成「顺形性遗忘」（考试写括号外的正确术语）。 手册标「了解即可」：低频，记名称+一个特征即可，不必逐字。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-29","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-6-30","s":"普心","c":6,"t":"填空","card":150,"kd":"次要卡","stem":"按记忆内容在时间轴上的指向分为哪两类？","q":"按记忆内容在时间轴上的指向分为哪两类？","ans":"前瞻性记忆（对未来活动的记忆）和回溯性记忆（对过去事件的记忆）。","kw":["前瞻性记忆（对未来活动的记忆","和回溯性记忆（对过去事件的记忆"],"jx":{"po":"设问「按记忆内容在时间轴上的指向分为哪两类？」落在「次要卡」卡 150。这是踩分题：核心 32 字、2 处空；先想得分点，再逐点写。","ok":"得分点就是这几段：「前瞻性记忆（对未来活动的记忆」、「和回溯性记忆（对过去事件的记」；一处不对就丢这一档。","bad":"只看得分点：意思对但术语不对，按 0 分算。 同考点还有卡 145「第六章九个考点如何串记？」，两卡常被混问，注意别串。"},"kp":"px-6-30","imp":"support"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-1","s":"普心","c":7,"t":"填空","card":151,"kd":"考点九 决策","stem":"古典决策理论的核心观点是什么？","q":"古典决策理论的核心观点是什么？","ans":"建立在经济人假设基础上，认为决策者完全理性，追求个人利益最大化，选取最优方案。","kw":["认为决策者完全理性","追求个人利益最大化"],"kp":"px-7-1","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-2","s":"普心","c":7,"t":"填空","card":152,"kd":"考点九 决策","stem":"西蒙的行为决策理论是什么？","q":"西蒙的行为决策理论是什么？","ans":"西蒙认为人的理性和认知能力有限，不可能找到所有备选方案，遵循满意性原则而非最优原则。","kw":["西蒙认为人的理性和认知能力有限","不可能找到所有备选方案"],"kp":"px-7-2","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-3","s":"普心","c":7,"t":"填空","card":153,"kd":"考点九 决策","stem":"期望效用理论由谁提出？核心观点是什么？","q":"期望效用理论由谁提出？核心观点是什么？","ans":"由冯·诺伊曼和摩根斯坦提出， 用严格数学方法追求效用最大化。","kw":[" 用严格数学方法追"],"kp":"px-7-3","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-4","s":"普心","c":7,"t":"填空","card":154,"kd":"考点九 决策","stem":"卡尼曼的前景理论包括哪些核心观点？","q":"卡尼曼的前景理论包括哪些核心观点？","ans":"认为不确定情况下人是非理性的：面临获得时风险规避，面临损失时风险偏好；人们对损失比对获得更敏感，即损失厌恶；相同信息的不同表述方式影响决策，即框架效应。","kw":["认为不确定情况下人是非理性的"],"kp":"px-7-4","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-5","s":"普心","c":7,"t":"填空","card":155,"kd":"考点九 决策","stem":"决策中的三种启发法策略分别是什么？","q":"决策中的三种启发法策略分别是什么？","ans":"代表性启发法：根据事物代表某范畴的程度来判断，忽视基础概率，如认为长发男是艺术家。可得性启发法：根据事件在记忆中提取的难易程度来评估概率，如认为坐汽车比坐飞机更安全。锚定和调整启发法：最初估计值成为锚定，之后调整只是微调，如以商品原价为锚觉得打折后很划算。","kw":["根据事物代表某范畴的程度来判断"],"kp":"px-7-5","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-6","s":"普心","c":7,"t":"填空","card":156,"kd":"考点八 问题解决的影响因素","stem":"影响问题解决的十一个因素是什么？","q":"影响问题解决的十一个因素是什么？","ans":"第一个所选择的策略（不同策略效率不同）；第二个知识（专家在某一领域知识丰富、记忆存储信息量大且知识按层次结构组织，问题解决效率远高于新手）；第三个问题表征的方式（合理的表征促进问题解决）；第四个无谓的限制（受并不存在的限定条件影响，如九点连线图）；第五个定式；第六个顿悟（突然理解问题情境中的关系找到解决方法）；第七个功能固着；第八个动机（在适当限度内动机强度与解决问题效率成正比，太强或太弱都会降低效率）；第九个情绪（积极情绪促进，消极情绪如紧张惶恐阻碍）；第十个人际关系（团体内协作互助促进，互不信任阻碍）；第十一个无关信息（与问题无关的信息会妨碍解决）。","kw":["第一个所选择的策略（不同策略效率不同"],"kp":"px-7-6","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-7","s":"普心","c":7,"t":"填空","card":157,"kd":"考点八 问题解决的影响因素","stem":"什么是定式？陆钦斯的量杯实验证明了什么？","q":"什么是定式？陆钦斯的量杯实验证明了什么？","ans":"定式是重复先前的心理操作引起的准备状态，有积极作用也有消极作用。陆钦斯的量杯实验证明了定式的消极作用，即习惯用旧方法阻碍新方法的发现。","kw":["定式是重复先前的心理操作引起的准备状态"],"kp":"px-7-7","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-8","s":"普心","c":7,"t":"填空","card":158,"kd":"考点八 问题解决的影响因素","stem":"什么是功能固着？邓克的盒子问题证明了什么？","q":"什么是功能固着？邓克的盒子问题证明了什么？","ans":"功能固着指人们把某种功能赋予某种物体后不易摆脱固有观念。邓克的盒子问题证明蜡烛盒被看成容器后不易被当成烛台使用。这两个实验和概念的对应关系要重点掌握。","kw":["功能固着指人们把某种功能赋予某种物体后不易摆脱固有观念"],"kp":"px-7-8","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-9","s":"普心","c":7,"t":"填空","card":159,"kd":"考点七 问题解决的策略","stem":"什么是算法？有什么优缺点？","q":"什么是算法？有什么优缺点？","ans":"是根据一定规则或程序逐步解决问题的方法，如公式和计算机程序；能保证问题解决，但费时费力，不适用于复杂问题。","kw":["是根据一定规则或程序逐步解决问题的方法"],"kp":"px-7-9","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-10","s":"普心","c":7,"t":"填空","card":160,"kd":"考点七 问题解决的策略","stem":"什么是启发法？有什么优缺点？","q":"什么是启发法？有什么优缺点？","ans":"是根据知识经验在问题空间内进行较少搜索，效率高但不能保证完全成功。","kw":["是根据知识经验在问题空间内进行较少搜索"],"kp":"px-7-10","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-11","s":"普心","c":7,"t":"填空","card":161,"kd":"考点七 问题解决的策略","stem":"三种常见的启发法策略分别是什么？","q":"三种常见的启发法策略分别是什么？","ans":"手段—目的分析法（将总目标分成若干子目标，通过实现子目标不断缩小与目标的差距，必要时可暂时扩大差距迂回前进，汉诺塔问题是典型）；逆向搜索法（从目标状态往回搜索到初始状态，适合只有少数通路的几何类问题）；爬山法（逐步缩短与目标的距离且只能前进）。","kw":["手段—目的分析法（将总目标分成若干子目标","通过实现子目标不断缩小与目标的差距"],"kp":"px-7-11","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-12","s":"普心","c":7,"t":"填空","card":162,"kd":"考点七 问题解决的策略","stem":"手段—目的分析法与爬山法的区别是什么？","q":"手段—目的分析法与爬山法的区别是什么？","ans":"前者可以暂时后退迂回，后者只能前进。三种策略的名称和区别要重点掌握。","kw":["前者可以暂时后退迂回","三种策略的名称和区别要重点掌握"],"kp":"px-7-12","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-13","s":"普心","c":7,"t":"填空","card":163,"kd":"考点五 推理","stem":"三段论推理错误的三种解释分别是什么？","q":"三段论推理错误的三种解释分别是什么？","ans":"气氛效应：伍德沃斯认为前提的逻辑量词产生了一种气氛，使人倾向接受包含同一逻辑量词的结论。换位理论：查普曼认为对前提的错误理解导致出错。心理模型理论：约翰逊—莱尔德认为推理是创建并检验心理模型的过程，所需模型越多越困难。","kw":["伍德沃斯认为前提的逻辑量词产生了一种气氛"],"kp":"px-7-13","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-14","s":"普心","c":7,"t":"填空","card":164,"kd":"考点四 概念","stem":"什么是概念？概念与词是什么关系？","q":"什么是概念？概念与词是什么关系？","ans":"概念是具有共同属性的一类事物的总称，包括内涵和外延两个方面；概念是思维活动的理性支柱，是解决问题的前提条件。概念的层级系统包括上位概念、基本水平的概念和下位概念，其中基本水平的概念最容易在头脑中激活。概念和词的关系：概念是词的思想内容，词是概念的语言形式。","kw":["概念是具有共同属性的一类事物的总称"],"kp":"px-7-14","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-15","s":"普心","c":7,"t":"填空","card":165,"kd":"考点四 概念","stem":"概念的种类如何划分？","q":"概念的种类如何划分？","ans":"按反映事物属性的数量分三种：合取概念、析取概念、关系概念（根据事物间相互关系形成）。按形成自然性分自然概念和人工概念（人工概念常用于实验室研究）。按抽象概括程度分具体概念和抽象概念。","kw":["按反映事物属性的数量分三种"],"kp":"px-7-15","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-16","s":"普心","c":7,"t":"填空","card":166,"kd":"考点四 概念","stem":"概念形成分为哪三个阶段？","q":"概念形成分为哪三个阶段？","ans":"概念形成是指个体掌握概念的过程，一般用人工概念进行研究。三个阶段：抽象化（了解事物的属性和特征）；类化（归类相似属性或特征）；辨别（认识差异）。","kw":["概念形成是指个体掌握概念的过程","一般用人工概念进行研究"],"kp":"px-7-16","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-17","s":"普心","c":7,"t":"填空","card":167,"kd":"考点四 概念","stem":"概念形成的三个理论分别是什么？","q":"概念形成的三个理论分别是什么？","ans":"赫尔的共同要素说（认为概念形成是把共同特征抽取出来）；布鲁纳的假设检验说（认为概念形成是不断提出假设和验证假设的过程）；茹什的原型理论（认为形成概念就是在头脑中形成原型，对解释自然概念有启发）。","kw":["赫尔的共同要素说（认为概念形成是把共同特征抽取出来"],"kp":"px-7-17","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-18","s":"普心","c":7,"t":"填空","card":168,"kd":"考点四 概念","stem":"布鲁纳提出的四种概念形成策略是什么？","q":"布鲁纳提出的四种概念形成策略是什么？","ans":"保守性聚焦策略（每次只改变一个属性，最有效）；冒险性聚焦策略（同时改变两个以上属性）；同时性扫描策略（同时对多个部分假设进行检验）；继时性扫描策略。","kw":["保守性聚焦策略（每次只改变一个属性"],"kp":"px-7-18","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-19","s":"普心","c":7,"t":"填空","card":169,"kd":"考点四 概念","stem":"概念组织的三个模型分别是什么？","q":"概念组织的三个模型分别是什么？","ans":"层次网络模型（由柯林斯提出，概念以节点形式存储在概念网络中，层次越高抽象概括水平越高，提取概念是对网络的搜索过程）；激活扩散模型（由柯林斯在层次网络模型基础上改进，以语义相关性为基础组织概念网络，概念被加工时其意义激活会自动传递到相关概念，能解释语义启动效应）；特征表理论（由波纳提出，认为概念由定义特征和概念规则构成）。","kw":["概念以节点形式存储在概念网络中","层次越高抽象概括水平越高"],"kp":"px-7-19","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-20","s":"普心","c":7,"t":"填空","card":170,"kd":"考点三 创造性","stem":"创造性的定义是什么？","q":"创造性的定义是什么？","ans":"创造性是指用新颖方式解决问题并产生新的、有社会价值产品的心理过程，是人类最高智慧的体现。","kw":["创造性是指用新颖方式解决问题并产生新的"],"kp":"px-7-20","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-21","s":"普心","c":7,"t":"填空","card":171,"kd":"考点三 创造性","stem":"创造性的心理成分包括哪四个方面？","q":"创造性的心理成分包括哪四个方面？","ans":"第一想象（是对头脑中已有表象进行加工改造、形成新形象的过程，具有形象性和新颖性；想象分无意想象和有意想象，有意想象又分再造想象和创造想象；具体方式包括粘合、夸张、典型化、联想）；第二辐合思维与发散思维（发散思维是创造性的主要成分）；第三远距离联想能力（在相距很远的概念间看出关系的能力）；第四坚持性、自信心等非智力因素。","kw":["第一想象（是对头脑中已有表象进行加工改造","形成新形象的过程"],"kp":"px-7-21","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-22","s":"普心","c":7,"t":"填空","card":172,"kd":"考点三 创造性","stem":"创造性的过程分为哪五个阶段？","q":"创造性的过程分为哪五个阶段？","ans":"定向阶段（对问题进行定义）；准备阶段（尽可能收集相关信息）；酝酿阶段（所有能想到的方案都无法解决，问题被移入无意识中继续思考）；顿悟阶段（思想火花的闪现，突然发现解决办法）；验证阶段（检验顿悟获得的方案）。","kw":["准备阶段（尽可能收集相关信息","酝酿阶段（所有能想到的方案都无法解决"],"kp":"px-7-22","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-23","s":"普心","c":7,"t":"填空","card":173,"kd":"考点二 表象","stem":"什么是表象？表象有哪三个特征？","q":"什么是表象？表象有哪三个特征？","ans":"表象是事物不在面前时人们头脑中出现的关于事物的形象，是思维活动的感性支柱。三个特征：直观性（以具体形象出现，但比知觉形象暗淡模糊不稳定）；概括性（反映事物的大体轮廓和主要特征）；可操作性（可在头脑中对表象进行操作）。库珀的心理旋转实验表明，字母R旋转180度时反应时最长，证明了可操作性的存在。","kw":["表象是事物不在面前时人们头脑中出现的关于事物的形象"],"kp":"px-7-23","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-24","s":"普心","c":7,"t":"填空","card":174,"kd":"考点二 表象","stem":"佩维奥的双重编码理论是什么？","q":"佩维奥的双重编码理论是什么？","ans":"人脑中同时存在两种编码系统：语言符号系统负责处理语言信息；非语言符号系统即表象系统，负责处理形象信息。两个系统相互独立但存在相互作用，如果能对刺激采用两种方式编码则具有认知加工优势，比如对具体词的记忆效果优于抽象词。","kw":["人脑中同时存在两种编码系统","语言符号系统负责处理语言信息"],"kp":"px-7-24","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-25","s":"普心","c":7,"t":"填空","card":175,"kd":"考点一 思维概述","stem":"思维的定义是什么？","q":"思维的定义是什么？","ans":"思维是借助表象、概念、语言等实现的，对客观事物概括的、间接的反应；能揭示事物的本质特征和内部联系，是认识的高级形式，也是认识过程的核心成分。","kw":["对客观事物概括的","能揭示事物的本质特征和内部联系"],"kp":"px-7-25","qt":"jie","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-26","s":"普心","c":7,"t":"填空","card":176,"kd":"考点一 思维概述","stem":"思维有哪两个特征？","q":"思维有哪两个特征？","ans":"概括性（在大量感性材料基础上，把一类事物的共同特征和规律抽取出来加以概括，是概念形成的前提）；间接性（借助一定的媒介或已有知识经验对客观事物进行间接认识，由此可以超越感知觉的限制）。","kw":["概括性（在大量感性材料基础上","把一类事物的共同特征和规律抽取出来加以概括"],"kp":"px-7-26","imp":"support"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-27","s":"普心","c":7,"t":"填空","card":177,"kd":"考点一 思维概述","stem":"思维按凭借的心理表征分为哪三类？","q":"思维按凭借的心理表征分为哪三类？","ans":"直观动作思维凭借实际动作；形象思维凭借头脑中的形象；抽象思维凭借概念和判断推理，是思维的高级形式。","kw":["直观动作思维凭借实际动作","形象思维凭借头脑中的形象"],"kp":"px-7-27","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-7-28","s":"普心","c":7,"t":"填空","card":178,"kd":"考点一 思维概述","stem":"辐合思维与发散思维分别是什么？发散思维有哪些特点？","q":"辐合思维与发散思维分别是什么？发散思维有哪些特点？","ans":"辐合思维是根据已知信息得出确定结论；发散思维是沿着不同方向思考产生多种方案，是创造性思维的主要成分。吉尔福特用不寻常用途测验来测量发散思维，其特点包括流畅性（单位时间内发散项目的数量）、变通性（发散项目的范围和维度）、独特性（提出超乎寻常的见解）。","kw":["辐合思维是根据已知信息得出确定结论","发散思维是沿着不同方向思考产生多种方案"],"kp":"px-7-28","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-7-29","s":"普心","c":7,"t":"填空","card":179,"kd":"考点一 思维概述","stem":"思维按创新程度分为哪两类？","q":"思维按创新程度分为哪两类？","ans":"常规性思维和创造性思维。 三种分类方式背框架。","kw":[" 三种分类方式背框"],"kp":"px-7-29","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-30","s":"普心","c":7,"t":"填空","card":180,"kd":"次要卡","stem":"第七章九个考点如何串记？","q":"第七章九个考点如何串记？","ans":"考点一思维概述：概括性和间接性两个特征，三种分类方式背框架。考点二表象：直观性、概括性、可操作性三个特征，双重编码理论记关键词，心理旋转实验记住库珀。考点三创造性：五个阶段的名称背下来，想象分无意和有意、再造和创造。考点四概念：共同要素说、假设检验说、原型理论三个形成理论，层次网络模型、激活扩散模型、特征表理论三个组织模型。考点五推理：气氛效应、换位理论、心理模型理论三种解释。考点六问题解决的概述：问题的分类和问题空间概念，了解即可。考点七问题解决的策略：算法和三种启发法的区别，手段—目的分析法和爬山法的区分要记牢。考点八问题解决的影响因素：十一个因素的名称背下来，定式对应陆钦斯量杯实验，功能固着对应邓克盒子问题。考点九决策：古典决策理论、行为决策理论、前景理论背框架，三种启发法策略记关键词和例子。","kw":["概括性和间接性两个特征","三种分类方式背框架"],"kp":"px-7-30","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-31","s":"普心","c":7,"t":"填空","card":181,"kd":"次要卡","stem":"什么是问题？问题如何分类？","q":"什么是问题？问题如何分类？","ans":"问题是指在给定状态与目标状态之间存在障碍、需要克服的任务情境。按明确程度分定义良好的问题（如几何证明题）和定义不良的问题（如怎样处理好人际关系）；按有无对手分对抗性问题和非对抗性问题；按相关知识程度分语义丰富的问题和语义贫乏的问题。（了解分类名称即可）","kw":["问题是指在给定状态与目标状态之间存在障碍"],"kp":"px-7-31","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-32","s":"普心","c":7,"t":"填空","card":182,"kd":"次要卡","stem":"什么是问题空间？","q":"什么是问题空间？","ans":"由纽厄尔和西蒙提出，是指问题解决者对问题一切可能的认识状态，包括对初始状态、目标状态以及如何转化的认识。（知道概念即可）","kw":["由纽厄尔和西蒙提出","是指问题解决者对问题一切可能的认识状态"],"kp":"px-7-32","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-33","s":"普心","c":7,"t":"填空","card":183,"kd":"次要卡","stem":"条件推理中的证实倾向是什么？","q":"条件推理中的证实倾向是什么？","ans":"人们利用条件性命题进行推理，存在证实倾向，即倾向于证实假设而很少去证伪；沃森的四卡片选择作业证明了这一点，实验中只有约4%的被试做出了正确选择。","kw":["人们利用条件性命题进行推理","即倾向于证实假设而很少去证伪"],"kp":"px-7-33","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-34","s":"普心","c":7,"t":"填空","card":184,"kd":"次要卡","stem":"创造性的培养方式有哪些？","q":"创造性的培养方式有哪些？","ans":"包括保护好奇心、激发求知欲、创设创造性思维形成的氛围、加强发散思维训练、陶冶创造性人格等。","kw":["创设创造性思维形成的氛围","加强发散思维训练、陶冶创造性人格等"],"kp":"px-7-34","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-35","s":"普心","c":7,"t":"填空","card":185,"kd":"次要卡","stem":"表象如何分类？","q":"表象如何分类？","ans":"按产生感觉通道分视觉表象、听觉表象等； 按创造程度分记忆表象和想象表象（想象表象具有新颖性）。","kw":[" 按创造程度分记忆"],"kp":"px-7-35","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-36","s":"普心","c":7,"t":"填空","card":186,"kd":"次要卡","stem":"表象在思维中有什么作用？","q":"表象在思维中有什么作用？","ans":"表象为概念的形成提供了感性基础， 同时有助于问题解决和推理。","kw":[" 同时有助于问题解"],"kp":"px-7-36","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-7-37","s":"普心","c":7,"t":"填空","card":187,"kd":"次要卡","stem":"思维的生理机制是什么？思维与感知觉记忆是什么关系？","q":"思维的生理机制是什么？思维与感知觉记忆是什么关系？","ans":"思维与额叶、左侧颞叶和顶枕叶有关。感知觉是直接接收外界刺激形成感性认识；记忆是编码、存储、提取。","kw":["思维与额叶、左侧颞叶和顶枕叶有关","记忆是编码、存储、提取"],"kp":"px-7-37","imp":"support","_kwfix":"D0044_KWFIX_20261113"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-1","s":"普心","c":8,"t":"填空","card":188,"kd":"考点五 双语的加工","stem":"克洛尔的修正层级模型是什么？","q":"克洛尔的修正层级模型是什么？","ans":"认为低熟练水平的二语者需要通过母语词汇的中介通达概念系统，高熟练水平可以直接通达。该模型能解释翻译任务中的不对称现象：将二语翻译成母语更快，基于形式加工；将母语翻译成二语较慢，基于语义加工。","kw":["认为低熟练水平的二语者需要通过母语词汇的中介通达概念系统"],"kp":"px-8-1","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-2","s":"普心","c":8,"t":"填空","card":189,"kd":"考点五 双语的加工","stem":"格林的抑制控制模型是什么？","q":"格林的抑制控制模型是什么？","ans":"认为双语者通过对非目标语言的抑制来避免跨语言竞争；熟练程度越高的语言作为非目标语时被抑制的程度越高，重新激活的难度也越大。双语转换范式是考察抑制控制机制的常用方法，不同语言转换时会产生转换代价，且转换代价具有不对称性。","kw":["认为双语者通过对非目标语言的抑制来避免跨语言竞争"],"kp":"px-8-2","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-3","s":"普心","c":8,"t":"填空","card":190,"kd":"考点四 书面语言的加工","stem":"什么是词汇识别？包括哪三个阶段？","q":"什么是词汇识别？包括哪三个阶段？","ans":"是指通过对词形的视觉感知通达词汇意义的过程，包括词形加工、形音转换和语义通达三个阶段。","kw":["是指通过对词形的视觉感知通达词汇意义的过程"],"kp":"px-8-3","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-4","s":"普心","c":8,"t":"填空","card":191,"kd":"考点四 书面语言的加工","stem":"阅读的双通路模型是什么？由谁提出？","q":"阅读的双通路模型是什么？由谁提出？","ans":"由柯尔哈特提出，认为符合发音规则的词通过形音对应规则读出，不规则词需要借助心理词典中的词条读出。","kw":["认为符合发音规则的词通过形音对应规则读出"],"kp":"px-8-4","imp":"support"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-5","s":"普心","c":8,"t":"填空","card":192,"kd":"考点四 书面语言的加工","stem":"什么是语义启动效应？词汇识别的影响因素有哪些？","q":"什么是语义启动效应？词汇识别的影响因素有哪些？","ans":"语义启动效应是指启动词与目标词有语义关联使识别更快，是研究词汇识别的重要方法。影响因素包括词频和字频、笔画数、语义特征（即多义词比单一词更易识别）、习得年龄、语境等。","kw":["语义启动效应是指启动词与目标词有语义关联使识别更快"],"kp":"px-8-5","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-6","s":"普心","c":8,"t":"填空","card":193,"kd":"考点二 语言的神经基础","stem":"威尔尼克区的位置、功能和受损表现是什么？","q":"威尔尼克区的位置、功能和受损表现是什么？","ans":"位于左半球颞上回，是听觉性语言中枢，负责分辨语音、形成语义，与语言理解有关；受损会产生接收性失语症，病人话语流利但无意义。","kw":["位于左半球颞上回","是听觉性语言中枢"],"kp":"px-8-6","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-7","s":"普心","c":8,"t":"填空","card":194,"kd":"考点二 语言的神经基础","stem":"布洛卡区的位置、功能和受损表现是什么？","q":"布洛卡区的位置、功能和受损表现是什么？","ans":"位于左半球额叶，是运动性语言中枢，负责产生发音程序；受损会产生运动性失语症，病人发音困难、说话缓慢，出现电报语。威尔尼克区和布洛卡区之间有弓形束连接。","kw":["是运动性语言中枢","负责产生发音程序"],"kp":"px-8-7","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-8","s":"普心","c":8,"t":"填空","card":195,"kd":"考点二 语言的神经基础","stem":"角回与艾克纳尔区的位置、功能和受损表现是什么？","q":"角回与艾克纳尔区的位置、功能和受损表现是什么？","ans":"角回位于顶枕叶交界处，是视觉性语言中枢，与单词的视觉记忆和视听觉跨通道联合有关，受损产生语义性失语症，不能理解书面语言。艾克纳尔区位于额中回后部，是书写性语言中枢，受损产生失写症，患者能听懂看懂但丧失书写能力。","kw":["角回位于顶枕叶交界处","是视觉性语言中枢，与单词的视觉记忆和视听觉跨通道联合有关"],"kp":"px-8-8","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-8-9","s":"普心","c":8,"t":"填空","card":196,"kd":"考点一 语言概述","stem":"语言的定义是什么？","q":"语言的定义是什么？","ans":"语言是人类通过高度结构化的声音、 文字或手势等构成的用于交流的符号系统。","kw":[" 文字或手势等构成"],"kp":"px-8-9","qt":"jie","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-8-10","s":"普心","c":8,"t":"填空","card":197,"kd":"考点一 语言概述","stem":"语言有哪四个特征？","q":"语言有哪四个特征？","ans":"结构性（语言按一定规则组织）；指代性（可以指代具体或抽象的事物）；创造性（人类能用有限词语创造无限语句，是人类特有的能力）；社会性（语言是社会活动的产物）。","kw":["结构性（语言按一定规则组织","指代性（可以指代具体或抽象的事物"],"kp":"px-8-10","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-8-11","s":"普心","c":8,"t":"填空","card":198,"kd":"考点一 语言概述","stem":"语言的层次结构和组织规则是什么？","q":"语言的层次结构和组织规则是什么？","ans":"语言按层次结构组织：音位是最小语音单位；语素是最小音义结合单位；词是独立运用的最小单位；句子是表达的基本形式。组织规则包括语音规则、正字法规则和句法规则。","kw":["语言按层次结构组织"],"kp":"px-8-11","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-12","s":"普心","c":8,"t":"填空","card":199,"kd":"次要卡","stem":"双语者分为哪三种类型？","q":"双语者分为哪三种类型？","ans":"平衡双语者、早期双语者和晚期双语者；早期和晚期双语者都属于非平衡双语者。","kw":["早期双语者和晚期双语者","早期和晚期双语者都属于非平衡双语者"],"kp":"px-8-12","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-13","s":"普心","c":8,"t":"填空","card":200,"kd":"次要卡","stem":"第八章五个考点如何串记？","q":"第八章五个考点如何串记？","ans":"考点一语言概述：语言的四个特征和层次结构记关键词，萨皮尔—沃尔夫假设了解即可。考点二语言的神经基础：威尔尼克区负责语言理解，布洛卡区负责语言产生，角回负责视听觉跨通道联合，艾克纳尔区负责书写，四个中枢的位置和功能背框架。考点三口头语言的加工：口语理解的影响因素和麦格克效应，了解即可。考点四书面语言的加工：词汇识别的三个阶段和语义启动效应记关键词。考点五双语的加工：修正层级模型和抑制控制模型记关键词。","kw":["语言的四个特征和层次结构记关键词，萨皮尔—沃尔夫假设了解即可"],"kp":"px-8-13","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-14","s":"普心","c":8,"t":"填空","card":201,"kd":"次要卡","stem":"句子理解与语篇理解分别是什么？","q":"句子理解与语篇理解分别是什么？","ans":"句子理解是在词汇加工基础上通过句法分析和语义分析获得句子意义的过程。语篇理解是语言理解的最高水平，是在词汇和句子理解基础上运用推理整合等方式形成连贯心理表征的过程，包括三个层次的表征：字词水平的表层表征、语义水平的文本基础表征、语篇水平的情境模型；影响语篇理解的因素包括推理和图式策略。","kw":["句子理解是在词汇加工基础上通过句法分析和语义分析获得句子意义的过程"],"kp":"px-8-14","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-15","s":"普心","c":8,"t":"填空","card":202,"kd":"次要卡","stem":"什么是口语理解？麦格克效应说明了什么？","q":"什么是口语理解？麦格克效应说明了什么？","ans":"口语理解是指借助听觉输入的语音在头脑中建构意义的过程，包括语音识别、词汇识别等阶段；词汇识别涉及心理词典，是人脑中存储词条的一部词典。影响口语理解的因素包括信噪比、语境、视觉信息等。麦格克效应表明口语理解由视觉和听觉信息动态整合产生。","kw":["口语理解是指借助听觉输入的语音在头脑中建构意义的过程"],"kp":"px-8-15","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-16","s":"普心","c":8,"t":"填空","card":203,"kd":"次要卡","stem":"口语产生包括哪些过程？","q":"口语产生包括哪些过程？","ans":"是指通过发音器官把想法说出来的心理过程，是一个快速且高度压缩的过程。词汇产生包括计划过程和发音运动过程；计划过程分词条选择和音韵编码两个阶段，这两个阶段相互独立又交互激活；之后生成发音指令由大脑发送给发音运动系统执行。","kw":["是指通过发音器官把想法说出来…","计划过程分词条选择和音韵编码…","之后生成发音指令由大脑发送给…"],"kp":"px-8-16","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-17","s":"普心","c":8,"t":"填空","card":204,"kd":"次要卡","stem":"语言的定位观与脑网络观有什么区别？","q":"语言的定位观与脑网络观有什么区别？","ans":"定位观认为四个语言中枢各自对应特定功能，此外左半球是语言功能的优势半球。脑网络观认为语言功能由多个脑区组成的脑网络实现，而非孤立的某个脑区；语言加工不止局限于左半球的布洛卡区和威尔尼克区，也涉及右半球部分脑区。","kw":["定位观认为四个语言中枢各自对…","语言加工不止局限于左半球的布…"],"kp":"px-8-17","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-8-18","s":"普心","c":8,"t":"填空","card":205,"kd":"次要卡","stem":"萨皮尔—沃尔夫假设是什么？","q":"萨皮尔—沃尔夫假设是什么？","ans":"也称语言相对论假设，认为语言决定了人们的思维和知觉世界的方式；极端的观点受到反对，修正后认为语言会影响而非决定人们的思维。（理解意思即可）","kw":["也称语言相对论假设","认为语言决定了人们的思维和知觉世界的方式"],"kp":"px-8-18","imp":"support"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-1","s":"普心","c":9,"t":"填空","card":206,"kd":"考点七 意志","stem":"意志的定义是什么？有哪三个基本特征？","q":"意志的定义是什么？有哪三个基本特征？","ans":"意志是人为了一定目标、自觉组织行为并与克服困难相联系的心理过程。三个基本特征：预定目的是人与动物的本质区别，是意志行动的前提；随意运动是意志行动的基础，指在意识调节控制下具有一定目的要求的运动；克服困难是意志行动的核心与重要特征。","kw":["意志是人为了一定目标","自觉组织行为并与克服困难相联系的心理过程"],"kp":"px-9-1","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-2","s":"普心","c":9,"t":"填空","card":207,"kd":"考点七 意志","stem":"意志行动中的四种冲突类型是什么？","q":"意志行动中的四种冲突类型是什么？","ans":"双趋冲突；双避冲突；趋避冲突；多重趋避冲突","kw":["多重趋避冲突"],"kp":"px-9-2","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-3","s":"普心","c":9,"t":"填空","card":208,"kd":"考点七 意志","stem":"意志行动的过程分为哪两个阶段？","q":"意志行动的过程分为哪两个阶段？","ans":"采取决定阶段是开始阶段，包括选择目标、设定标准、制定计划、解决心理冲突、做出决策等环节。执行决定阶段是完成阶段，也是最重要环节，使内心追求的目标得以实现，需要具备三个条件：明确具体的行动目标和方式；具备主客观条件；行动有实现要求。","kw":["采取决定阶段是开始阶段"],"kp":"px-9-3","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-4","s":"普心","c":9,"t":"填空","card":209,"kd":"考点七 意志","stem":"意志的四种品质及其相反品质分别是什么？","q":"意志的四种品质及其相反品质分别是什么？","ans":"独立性（自己做决定并负责，相反品质是易受暗示性或武断）；坚定性（坚持不懈、克服困难，相反品质是动摇性或刚愎执拗）；果断性（迅速辨明是非及时决定，相反品质是优柔寡断或鲁莽草率）；自制力（善于控制自我，相反品质是任性或怯懦）。","kw":["独立性（自己做决定并负责","相反品质是易受暗示性或武断"],"kp":"px-9-4","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-5","s":"普心","c":9,"t":"填空","card":210,"kd":"考点六 动机理论","stem":"本能论的三位代表人物各持什么观点？","q":"本能论的三位代表人物各持什么观点？","ans":"麦独孤认为人类所有行为以十八种本能为基础，本能具有能量、行为和目标指向三个成分。弗洛伊德认为行为由生本能与死本能决定，本能驱力使人产生紧张状态，驱动人采取行动消除紧张。马斯洛认为人类的需要都是先天的，行为由自我实现的潜能决定。评价：本能论不能确切解释行为原因，有循环论证之嫌。","kw":["麦独孤认为人类所有行为以十八种本能为基础"],"kp":"px-9-5","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-6","s":"普心","c":9,"t":"填空","card":211,"kd":"考点六 动机理论","stem":"伍德沃斯的驱力概念与赫尔的驱力降低理论是什么？","q":"伍德沃斯的驱力概念与赫尔的驱力降低理论是什么？","ans":"伍德沃斯提出驱力概念以代替本能，驱力是由生理需要产生的紧张状态，驱动个体以满足需要、消除紧张、恢复平衡。赫尔提出驱力降低理论，认为行为由习惯支配，驱力提供能量、习惯决定方向，用公式表示为行为潜能等于驱力乘以习惯强度。驱力分原始驱力（来自内部，不需习得）和获得性驱力（通过学习形成）。评价：该理论能解释部分生理行为，但难以解释复杂社会行为。","kw":["伍德沃斯提出驱力概念以代替本能","驱力是由生理需要产生的紧张状态"],"kp":"px-9-6","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-7","s":"普心","c":9,"t":"填空","card":212,"kd":"考点六 动机理论","stem":"什么是诱因理论？赫布和柏林的唤醒理论有哪三个原理？","q":"什么是诱因理论？赫布和柏林的唤醒理论有哪三个原理？","ans":"斯彭斯针对驱力理论的不足提出诱因理论，认为诱因是能满足个体需要的外在因素，能激发和诱使个体朝向目标；诱因分积极诱因和消极诱因；赫尔后来将诱因纳入公式，修改为行为潜能等于驱力乘以习惯强度再乘以诱因。赫布和柏林提出唤醒理论，认为人维持最佳唤醒水平，包括三个原理：人们偏好最佳唤醒水平，刺激水平和偏好呈倒U型关系；简化原理，重复刺激使唤醒降低；个体经验影响偏好，经验丰富者偏好复杂刺激。","kw":["诱因分积极诱因和消极诱因","赫尔后来将诱因纳入公式","赫布和柏林提出唤醒理论","简化原理","个体经验影响偏好"],"kp":"px-9-7","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-8","s":"普心","c":9,"t":"填空","card":213,"kd":"考点六 动机理论","stem":"托尔曼的期待价值理论是什么？","q":"托尔曼的期待价值理论是什么？","ans":"在动物实验基础上提出，认为达到目标的期待是行为的决定因素；个体完成任务的动机由对成功可能性的期待和对任务所赋予的价值决定。","kw":["在动物实验基础上提出","认为达到目标的期待是行为的决定因素"],"kp":"px-9-8","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-9","s":"普心","c":9,"t":"填空","card":214,"kd":"考点六 动机理论","stem":"归因理论中海德、罗特、韦纳各提出了什么？","q":"归因理论中海德、罗特、韦纳各提出了什么？","ans":"人们从行为结果寻求原因的过程。海德最早将原因分为内部和外部；罗特提出控制点概念，分内控型和外控型；韦纳提出三维度六因素的归因模型：三个维度是内外源、稳定性、可控性；六个因素是能力、努力、运气、工作难度、身心状态、外界环境。韦纳强调引导学生将成败归因于内部的、不稳定的和可控的原因。","kw":["人们从行为结果寻求原因的过程","海德最早将原因分为内部和外部"],"kp":"px-9-9","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-10","s":"普心","c":9,"t":"填空","card":215,"kd":"考点六 动机理论","stem":"自我决定理论认为人有哪三种基本心理需要？","q":"自我决定理论认为人有哪三种基本心理需要？","ans":"德西和瑞安强调自我决定在行为选择中的作用，把动机分为无动机、外部动机和内部动机三种形式，三者是一个连续体；认为人有三种基本心理需要：自主需要（自我决定的需要）、能力需要（相信自己能胜任）、归属需要（与他人相联系获得关爱）。","kw":["德西和瑞安强调自我决定在行为选择中的作用"],"kp":"px-9-10","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-11","s":"普心","c":9,"t":"填空","card":216,"kd":"考点六 动机理论","stem":"班杜拉的自我效能理论包括哪些内容？","q":"班杜拉的自我效能理论包括哪些内容？","ans":"认为行为不仅受行为结果影响，还受自我效能感影响。对期待的两种分类：结果期待（对行为导致什么结果的推测）和效能期待即自我效能感（对自己实施某行为的能力的主观判断）。自我效能感的四个来源：个体成败经验（影响最大）、替代性经验（观察榜样）、言语劝说、生理和情绪状态。作用：决定对活动的选择和坚持性，影响活动时的情绪，影响对困难的态度，影响新行为的习得。","kw":["认为行为不仅受行为结果影响"],"kp":"px-9-11","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-12","s":"普心","c":9,"t":"填空","card":217,"kd":"考点六 动机理论","stem":"成就目标理论按评价标准分哪三种？基本类型分哪两种？","q":"成就目标理论按评价标准分哪三种？基本类型分哪两种？","ans":"尼克尔斯和德韦克将成就目标引入动机领域。按评价标准分三种：任务标准（个体是否达到活动任务的要求）、自我标准（个体是否比以前做得更好）、他人标准（个体与其他人相比是否更好）。基本类型分掌握目标（关注掌握知识和提高能力，持能力增长观，选中等难度任务）和成绩目标（关注好名次好成绩，持能力实体观，选较难或较易任务）。掌握目标更能激发内在动机。","kw":["按评价标准分三种","基本类型分掌握目标","掌握目标更能激发内在动机"],"kp":"px-9-12","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-13","s":"普心","c":9,"t":"填空","card":218,"kd":"考点五 社会性动机","stem":"什么是成就动机？麦克莱兰提出的三个标准是什么？","q":"什么是成就动机？麦克莱兰提出的三个标准是什么？","ans":"成就动机是指人们希望从事有挑战性活动并取得优异成绩的动机。麦克莱兰认为成就行为要遵循三个标准：有卓越的社会目标；以独立方式完成；坚持不懈的努力。父母的教养方式会影响儿童成就动机的形成。","kw":["成就动机是指人们希望从事有挑战性活动并取得优异成绩的动机"],"kp":"px-9-13","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-14","s":"普心","c":9,"t":"填空","card":219,"kd":"考点五 社会性动机","stem":"阿特金森的成就动机理论是什么？","q":"阿特金森的成就动机理论是什么？","ans":"认为成就动机是期望成功和害怕失败之间情绪冲突的结果，由成就需要、成功可能性和成功诱因值共同决定。力求成功者行为目标定位是获得成功，倾向于选择中等难度任务；避免失败者行为目标定位是避免失败，倾向于选择容易或很难的任务。","kw":["认为成就动机是期望成功和害怕失败之间情绪冲突的结果"],"kp":"px-9-14","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-15","s":"普心","c":9,"t":"填空","card":220,"kd":"考点四 生理性动机","stem":"饥饿产生的原因有哪些？","q":"饥饿产生的原因有哪些？","ans":"第一个胃壁收缩，坎农的气球实验表明胃壁收缩可能与饥饿有关；第二个血糖下降，血糖浓度下降时饥饿感增强；第三个下丘脑控制，下丘脑背外侧是饥饿中枢，腹内侧是饱食中枢。进食障碍有神经性厌食症和贪食症。","kw":["坎农的气球实验表明胃壁收缩可能与饥饿有关"],"kp":"px-9-15","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-16","s":"普心","c":9,"t":"填空","card":221,"kd":"考点三 动机与行为","stem":"动机与行为的关系是什么？","q":"动机与行为的关系是什么？","ans":"个体的活动由动机体系推动，包括主导动机和从属动机；动机与行为的关系比较复杂。","kw":["个体的活动由动机体系推动","包括主导动机和从属动机"],"kp":"px-9-16","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-17","s":"普心","c":9,"t":"填空","card":222,"kd":"考点三 动机与行为","stem":"耶克斯—多德森定律的内容是什么？","q":"耶克斯—多德森定律的内容是什么？","ans":"动机强度与行为效率呈倒U形曲线关系，中等动机水平最有利于任务完成。具体来说：第一，各种活动都存在一个最佳动机水平，动机不足或过强都会降低效率；第二，动机的最佳水平随任务性质不同而改变，任务容易时最佳动机水平较高，任务难度增加使最佳动机水平逐渐下降，即困难任务需要较低动机水平。","kw":["动机强度与行为效率呈倒U形曲线关系","中等动机水平最有利于任务完成"],"kp":"px-9-17","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-18","s":"普心","c":9,"t":"填空","card":223,"kd":"考点二 动机与需要","stem":"什么是需要？需要有哪些特性？","q":"什么是需要？需要有哪些特性？","ans":"需要是有机体内部某种缺乏或不平衡状态，是动机的产生基础和活动的基本动力。需要有四个特性：对象性、独特性、阶段性、社会性。","kw":["需要有四个特性","对象性","独特性","阶段性","社会性"],"kp":"px-9-18","qt":"jian","imp":"core","_kwfix":"D0044_KWFIX_20261113"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-19","s":"普心","c":9,"t":"填空","card":224,"kd":"考点二 动机与需要","stem":"需要按哪两个标准分类？","q":"需要按哪两个标准分类？","ans":"按起源分自然需要和社会需要； 按指向对象分物质需要和精神需要。背框架。","kw":[" 按指向对象分物质"],"kp":"px-9-19","qt":"jian","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-20","s":"普心","c":9,"t":"填空","card":225,"kd":"考点二 动机与需要","stem":"马斯洛的需要层次理论包括哪五个层次？","q":"马斯洛的需要层次理论包括哪五个层次？","ans":"马斯洛从人类动机角度出发，将需要分为五个层次，从低到高依次是：生理需要（最基本最重要）；安全需要（保护自己免受伤害）；归属与爱的需要（与他人建立感情联系）；尊重的需要（自尊和受他人尊重）；自我实现需要（追求潜能实现）。五个层次的名称和顺序原句背下来。","kw":["马斯洛从人类动机角度出发","将需要分为五个层次"],"kp":"px-9-20","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-21","s":"普心","c":9,"t":"填空","card":226,"kd":"考点二 动机与需要","stem":"低级需要与高级需要有什么区别？","q":"低级需要与高级需要有什么区别？","ans":"低级需要又称缺失需要，直接关系生存，力量最强；高级需要即生长需要，使人健康长寿、产生幸福感。低级需要满足或部分满足后高级需要才可能出现，能自我实现的人是极少数。","kw":["低级需要又称缺失需要","高级需要即生长需要"],"kp":"px-9-21","qt":"jian","imp":"core"},{"fk":"","kaofa":"再现","tier":"A","id":"px-9-22","s":"普心","c":9,"t":"填空","card":227,"kd":"考点一 动机概述","stem":"动机的定义是什么？","q":"动机的定义是什么？","ans":"动机是激发和维持个体进行活动， 并指引活动朝向某一目标的心理倾向或内部动力。原句背。","kw":[" 并指引活动朝向某"],"kp":"px-9-22","qt":"jie","imp":"core"},{"fk":"是","kaofa":"再现","tier":"A","id":"px-9-23","s":"普心","c":9,"t":"填空","card":228,"kd":"考点一 动机概述","stem":"动机有哪三大功能？","q":"动机有哪三大功能？","ans":"激活功能（发动行为使个体由静止转向活动）；指向功能（将行为指向一定目标）；维持和调整功能（表现为对行为的坚持性）。","kw":["激活功能（发动行为使个体由静止转向活动"],"kp":"px-9-23","qt":"jian","imp":"core"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-24","s":"普心","c":9,"t":"填空","card":229,"kd":"次要卡","stem":"第九章七个考点如何串记？","q":"第九章七个考点如何串记？","ans":"考点一动机概述：动机的定义和三大功能（激活、指向、维持和调整）。考点二动机与需要：马斯洛五个需要层次从生理到自我实现，低级需要是缺失需要、高级需要是生长需要。考点三动机与行为：耶克斯—多德森定律，倒U型曲线，最佳动机水平随任务难度变化，要背熟。考点四生理性动机：饥饿的胃壁收缩、血糖下降和下丘脑控制机制。考点五社会性动机：成就动机中力求成功者选中等难度，避免失败者选易或难。考点六动机理论：本能论（麦独孤、弗洛伊德、马斯洛）、驱力理论（伍德沃斯、赫尔）、诱因理论（斯彭斯）、唤醒理论（赫布、柏林）、认知理论中的期待价值理论（托尔曼）、归因理论（韦纳三维度六因素）、自我决定理论（德西和瑞安三种需要）、自我效能理论（班杜拉四个来源）、成就目标理论（掌握目标与成绩目标），绑人名背框架。","kw":["动机的定义和三大功能（激活","考点二动机与需要"],"kp":"px-9-24","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-25","s":"普心","c":9,"t":"填空","card":230,"kd":"次要卡","stem":"动机理论的发展脉络如何小结？","q":"动机理论的发展脉络如何小结？","ans":"从本能论到驱力理论再到认知理论， 动机理论从强调先天本能到强调外在诱因再到强调认知因素，认识在不断深化。","kw":[" 动机理论从强调先"],"kp":"px-9-25","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-26","s":"普心","c":9,"t":"填空","card":231,"kd":"次要卡","stem":"权力动机与交往动机分别是什么？","q":"权力动机与交往动机分别是什么？","ans":"权力动机分个人化权力动机和社会化权力动机；交往动机是以交往需要为基础，希望与人来往得到关心。","kw":["个人化权力动机","社会化权力动机","以交往需要为基础"],"kp":"px-9-26","imp":"support","_kwfix":"D0044_KWFIX_20261113"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-27","s":"普心","c":9,"t":"填空","card":232,"kd":"次要卡","stem":"兴趣如何分类？","q":"兴趣如何分类？","ans":"分直接兴趣和间接兴趣、个体兴趣和情境兴趣。学习动机是推动人们积极学习的内部动力。","kw":["分直接兴趣和间接兴趣"],"kp":"px-9-27","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-28","s":"普心","c":9,"t":"填空","card":233,"kd":"次要卡","stem":"渴分为哪两种？","q":"渴分为哪两种？","ans":"渴由体内水分不足引起，驱动力比饥饿更强；分为低血容量性渴和渗透性渴，均与下丘脑有关。","kw":["渴由体内水分不足引起","驱动力比饥饿更强；分为低血容量性渴和渗透性渴"],"kp":"px-9-28","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-29","s":"普心","c":9,"t":"填空","card":234,"kd":"次要卡","stem":"性动机有什么特点？","q":"性动机有什么特点？","ans":"以性需要为基础，与性成熟和性激素有关；外界刺激和学习影响更大。","kw":["与性成熟和性激素有关"],"kp":"px-9-29","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-30","s":"普心","c":9,"t":"填空","card":235,"kd":"次要卡","stem":"什么是心流体验？","q":"什么是心流体验？","ans":"是指个人将精力完全投注在某种活动中达到忘我的状态，个体高度兴奋并具有充实感。","kw":["是指个人将精力完全投注在某种活动中达到忘我的状态"],"kp":"px-9-30","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-31","s":"普心","c":9,"t":"填空","card":236,"kd":"次要卡","stem":"如何评价马斯洛的需要层次理论？","q":"如何评价马斯洛的需要层次理论？","ans":"马斯洛把需要看作有组织的系统，在教育管理等领域广泛应用；但认为需要源于先天本能，模糊了生物需要与社会需要的差异。","kw":["马斯洛把需要看作有组织的系统","在教育管理等领域广泛应用"],"kp":"px-9-31","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-32","s":"普心","c":9,"t":"填空","card":237,"kd":"次要卡","stem":"动机与活动的关系是什么？","q":"动机与活动的关系是什么？","ans":"动机通过活动表现与达成目的， 包括心理活动和身体活动。","kw":[" 包括心理活动和身"],"kp":"px-9-32","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"px-9-33","s":"普心","c":9,"t":"填空","card":238,"kd":"次要卡","stem":"动机的神经机制涉及哪三个神经网络？","q":"动机的神经机制涉及哪三个神经网络？","ans":"奖励回路负责奖赏处理；价值决策主要与眶额皮层和腹内侧前额叶皮层有关；目标导向控制涉及扣带回前部皮层和背外侧前额叶皮层。","kw":["奖励回路负责奖赏处理","价值决策主要与眶额皮层和腹内侧前额叶皮层有关"],"kp":"px-9-33","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-1","s":"社心","c":10,"t":"填空","card":1,"kd":"人际吸引与亲密关系","stem":"[人际吸引的定义（老师原话：我们记这一句）] ____________和喜欢，人需要和别人交往，并建立和保持良好的人际关系。","q":"[人际吸引的定义（老师原话：我们记这一句）] ____________和喜欢，人需要和别人交往，并建立和保持良好的人际关系。","ans":"人际吸引是指人与 ／ 人之间的相互接纳","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-2","s":"社心","c":10,"t":"填空","card":2,"kd":"人际吸引与亲密关系","stem":"[人际吸引的三个基本原则] （1）强化原则：______们奖赏的人，______人；（2）社会交换：取决于交往时对成本和收益的评价，收益大于成本就继续交往；（3）联结原则：喜欢那些与美好经验联结在一起的人，厌恶那些与不愉快经验联结在一起的人。","q":"[人际吸引的三个基本原则] （1）强化原则：______们奖赏的人，______人；（2）社会交换：取决于交往时对成本和收益的评价，收益大于成本就继续交往；（3）联结原则：喜欢那些与美好经验联结在一起的人，厌恶那些与不愉快经验联结在一起的人。","ans":"我们喜欢能给予我 ／ 讨厌给我们惩罚的","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-3","s":"社心","c":10,"t":"填空","card":3,"kd":"人际吸引与亲密关系","stem":"[曝光效应（扎荣克提出）] ____________好感。限制：一开始的态度是喜欢或中性时，接触越多越喜欢；一开始讨厌的话，接触越多反而越讨厌。","q":"[曝光效应（扎荣克提出）] ____________好感。限制：一开始的态度是喜欢或中性时，接触越多越喜欢；一开始讨厌的话，接触越多反而越讨厌。","ans":"人们对反复出现的 ／ 人或事物容易产生","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-4","s":"社心","c":10,"t":"填空","card":4,"kd":"人际吸引与亲密关系","stem":"[匹配现象] ____________大致匹配的人，即使不匹配也有其他品质补偿。","q":"[匹配现象] ____________大致匹配的人，即使不匹配也有其他品质补偿。","ans":"人们通常会接近在 ／ 吸引力方面与自己","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-5","s":"社心","c":10,"t":"填空","card":5,"kd":"人际吸引与亲密关系","stem":"[相似性与互补性对喜欢的作用] 相似产生喜欢：______越相似，我们就越喜欢他。______，且不同态度对喜欢的抑制作用比相似态度对喜欢的促进作用更强。互补性在某些方面促进关系改进，但对立者并不相吸。","q":"[相似性与互补性对喜欢的作用] 相似产生喜欢：______越相似，我们就越喜欢他。______，且不同态度对喜欢的抑制作用比相似态度对喜欢的促进作用更强。互补性在某些方面促进关系改进，但对立者并不相吸。","ans":"某人的态度与我们 ／ 不相似导致不喜欢","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-10-6","s":"社心","c":10,"t":"填空","card":6, 的三个机制（合书写要点，能写出关键词即可）","ans":"（1）亲缘选择：偏袒与自己拥有共同基因的人；（2）互惠：对回报的期待增加帮助行为，在小而封闭的群体中效果最好；（3）群体选择：相互支持的利他群体在竞争中存活更久。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L9","s":"社心","c":11,"t":"简答","card":9,"kd":"帮助行为","stem":"请写出／说明：旁观者效应的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：旁观者效应的定义（合书写要点，能写出关键词即可）","ans":"其他人越多，帮助可能性越小、延迟时间越长，这种现象称为旁观者效应。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L10","s":"社心","c":11,"t":"简答","card":10,"kd":"帮助行为","stem":"请写出／说明：引起旁观者效应的三个原因（合书写要点，能写出关键词即可）","q":"请写出／说明：引起旁观者效应的三个原因（合书写要点，能写出关键词即可）","ans":"（1）责任分散：周围人越多，每个人分担的责任越少；（2）情境的不明确性：他人的行为影响个体对情境的定义；（3）评价恐惧：人们试图避免社会非难。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L11","s":"社心","c":11,"t":"简答","card":11,"kd":"帮助行为","stem":"请写出／说明：帮助行为的影响因素：助人者特点（六个）（合书写要点，能写出关键词即可）","q":"请写出／说明：帮助行为的影响因素：助人者特点（六个）（合书写要点，能写出关键词即可）","ans":"人格（社会赞许性需求高者更可能助人）、心情（心情好时更乐于帮助）、内疚感（内疚增加帮助，忏悔降低罪恶感反而减少帮助）、个人困扰与同情性关怀、宗教信仰、性别（男性在危险情境中更常伸出援手，女性在安全情境中更乐意帮忙）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L12","s":"社心","c":11,"t":"简答","card":12,"kd":"帮助行为","stem":"请写出／说明：帮助行为的影响因素：求助者特点（三个）（合书写要点，能写出关键词即可）","q":"请写出／说明：帮助行为的影响因素：求助者特点（三个）（合书写要点，能写出关键词即可）","ans":"（1）是否受到他人喜爱：长相漂亮的人更可能获得帮助；（2）是否值得帮助：生病晕倒的人比醉汉更容易得到帮助；（3）性别：安全情境中女性更愿意帮忙，危险情境中男性更多伸出援手。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L15","s":"社心","c":11,"t":"简答","card":15,"kd":"帮助行为","stem":"请写出／说明：道德排除的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：道德排除的定义（合书写要点，能写出关键词即可）","ans":"道德排除是指将某些人或动物排除于自己的道德关怀之外。利他主义社会化的第一步是扩展关心他人福利的界限（教化道德包容）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-11-L16","s":"社心","c":11,"t":"简答","card":16,"kd":"帮助行为","stem":"请写出／说明：过度辩护效应（合书写要点，能写出关键词即可）","q":"请写出／说明：过度辩护效应（合书写要点，能写出关键词即可）","ans":"过度辩护效应指过度的反馈反而削弱内在动机。在培养助人行为时，把帮助行为归因于利他主义动机，应给予恰到好处的反馈。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-1","s":"社心","c":3,"t":"单选","card":1,"kd":"社会知觉与判断","stem":"社会知觉的特性不包括（　）。","q":"社会知觉的特性不包括（　）。","ans":"可逆性（D）  ______ 和普遍真理，过分在意 ______，为小概率事件忧心。","ans":"基础概率；当前发生的情况","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-27","s":"社心","c":3,"t":"填空","card":27,"kd":"社会知觉与判断","stem":"错觉思维包括：错觉 ______（把随机事件联系起来）与 ______ 错觉（高估自己对事物的控制力）。","q":"错觉思维包括：错觉 ______（把随机事件联系起来）与 ______ 错觉（高估自己对事物的控制力）。","ans":"相关；控制","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-28","s":"社心","c":3,"t":"填空","card":28,"kd":"社会知觉与判断","stem":"自我实现预言：我们的 ______ 引导我们以 ______ 自己的方式行动；行为确证：人们一旦形成错误信念，可能引发 ______ 做出支持这些信念的行为。","q":"自我实现预言：我们的 ______ 引导我们以 ______ 自己的方式行动；行为确证：人们一旦形成错误信念，可能引发 ______ 做出支持这些信念的行为。","ans":"观念；证实；他人","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-29","s":"社心","c":3,"t":"简答","card":29,"kd":"社会知觉与判断","stem":"写出社会知觉的定义（★老师原话），并列出它的四个特性。","q":"写出社会知觉的定义（★老师原话），并列出它的四个特性。","ans":"社会知觉是**人们加工、理解、识记和运用各种社会信息做出判断和决策的过程**；特性：**主观性、整体性、选择性、恒常性**。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-30","s":"社心","c":3,"t":"简答","card":30,"kd":"社会知觉与判断","stem":"列举社会认知的四个法则并各用一句话说明。","q":"列举社会认知的四个法则并各用一句话说明。","ans":"①**便利法则**（按信息进入脑海的容易程度判断）②**象征性（代表性）法则**（按与典型事物的相似程度归类）③**基础比例信息**（按总体中各类别成员所占比例判断）④**锚定与调整法则**（以某数值为起点调整，但调整往往不充分）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-31","s":"社心","c":3,"t":"简答","card":31,"kd":"社会知觉与判断","stem":"列举五种社会知觉偏差（首因/近因/晕轮/正性偏差/认知启发法）并各说明适用情形。","q":"列举五种社会知觉偏差（首因/近因/晕轮/正性偏差/认知启发法）并各说明适用情形。","ans":"①**首因效应**（最初信息影响更大，适用不熟悉的人）②**近因效应**（新近信息影响更大，适用熟人）③**晕轮效应（光环效应）**（某一高分特质使其他评价普遍偏高）④**正性偏差（慈悲效应）**（正性评价超过负性评价）⑤**认知启发法**（认知中喜欢走捷径）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-32","s":"社心","c":3,"t":"简答","card":32,"kd":"社会知觉与判断","stem":"整体印象形成的三种模型分别是什么？哪一个最常用？为什么？","q":"整体印象形成的三种模型分别是什么？哪一个最常用？为什么？","ans":"**平均模型**（简单平均处理信息）／**累加模型**（累加而非平均整合）／**加权平均模型**（对重要特质给更大权重）→**最常用＝加权平均模型**（因现实中各特质重要性不同）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-33","s":"社心","c":3,"t":"简答","card":33,"kd":"社会知觉与判断","stem":"写出归因的定义（★老师原话）与\"人们只在两种情况下归因\"。","q":"写出归因的定义（★老师原话）与\"人们只在两种情况下归因\"。","ans":"归因＝**人们推论他人的行为或态度之原因的过程**；只在**①发生出乎意料的事 ②发生令人不愉快的事**时归因。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-34","s":"社心","c":3,"t":"简答","card":34,"kd":"社会知觉与判断","stem":"写出基本归因错误的定义（★老师原话）及其两个原因。","q":"写出基本归因错误的定义（★老师原话）及其两个原因。","ans":"基本归因错误＝**当我们解释他人的行为时，时常会低估环境造成的影响，而高估个人的特质和态度所造成的影响**；两原因：①**视角与情境意识不同**（行动者归因于环境、观察者归因于人格）②**文化差异**（个人主义文化倾向内部归因、集体主义更强调环境作用）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-35","s":"社心","c":3,"t":"简答","card":35,"kd":"社会知觉与判断","stem":"韦纳的归因理论：三个维度（各影响什么）＋六个因素；韦纳对教育的建议是什么？","q":"韦纳的归因理论：三个维度（各影响什么）＋六个因素；韦纳对教育的建议是什么？","ans":"三维度：**内外源**（影响**情绪体验**）／**稳定性**（影响对未来的**预期**）／**可控性**（影响今后的**行为**）；六因素：**能力、努力、运气、工作难度、身心状态、其他外部因素**；建议：引导学生把学业成败归因于**内部的、不稳定的、可控的**原因（如努力）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-36","s":"社心","c":3,"t":"简答","card":36,"kd":"社会知觉与判断","stem":"凯利的三维归因理论：三个方面＋三种信息＋三种组合对应的归因结果；什么是折扣原则？","q":"凯利的三维归因理论：三个方面＋三种信息＋三种组合对应的归因结果；什么是折扣原则？","ans":"三方面：**行动者／刺激物／环境背景**；三信息：**一致性／一贯性／独特性**；组合：**三者均高 → 刺激物**；**一致性与差异性低、一贯性高 → 行动者**；**一致性低、差异性高、一贯性低 → 环境背景**；**折扣原则**：其他可能原因会**削弱特定原因**的作用。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-37","s":"社心","c":3,"t":"简答","card":37,"kd":"社会知觉与判断","stem":"海德的归因理论要点（两种需求／内因外因／两个原则）。","q":"海德的归因理论要点（两种需求／内因外因／两个原则）。","ans":"两种需求：对周围环境的**一贯性理解**＋**控制环境**的能力；原因分**内因**（情绪、态度、人格、能力）与**外因**（外界压力、天气、情境）；两原则：**共变原则**（原因与结果共同变化）＋**排除原则**（内因或外因之一足以解释时排除另一原因）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-38","s":"社心","c":3,"t":"简答","card":38,"kd":"社会知觉与判断","stem":"琼斯和戴维斯的对应推论理论：归于内在特质需要哪两个条件？","q":"琼斯和戴维斯的对应推论理论：归于内在特质需要哪两个条件？","ans":"①行为的**非期望性与非顺从性** ②行为的**自由选择性**。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-39","s":"社心","c":3,"t":"论述","card":39,"kd":"社会知觉与判断","stem":"试述归因理论的发展脉络（海德 → 韦纳 → 凯利 → 琼斯与戴维斯），并比较各理论关注点的差异；最后结合考研备考说明：如果一个人总把失败归因于\"我不行\"，会产生什么后果、应如何调整（要落到韦纳三维度）。","q":"试述归因理论的发展脉络（海德 → 韦纳 → 凯利 → 琼斯与戴维斯），并比较各理论关注点的差异；最后结合考研备考说明：如果一个人总把失败归因于\"我不行\"，会产生什么后果、应如何调整（要落到韦纳三维度）。","ans":"①**海德**：**归因理论开创者**——两种需求（一贯性理解＋控制环境）；内因/外因；**共变原则**与**排除原则**。\n②**韦纳**：**三维度六因素**——**内外源**（影响情绪体验）、**稳定性**（影响对未来成败的预期）、**可控性**（影响今后行为）；**教育建议**：归因于**内部的、不稳定的、可控的**原因（努力）。\n③**凯利**：**三维归因**——行动者／刺激物／环境背景；**三种信息**（一致性／一贯性／独特性）与**三种组合**；**折扣原则**。\n④**琼斯与戴维斯**：**对应推论理论**——解释\"何时把他人的行为归于内在特质\"：需**非期望性与非顺从性**＋**自由选择性**。\n⑤**比较**：海德＝奠基（内外因＋原则）；韦纳＝**结果维度化＋动机/情绪后果**（并直接指向教育）；凯利＝**信息加工/统计式推断**（何时归因于什么）；琼斯-戴维斯＝**特质归因的条件**（何时能推断人格）。→ 发展脉络：**从\"分内外因\"到\"分维度+预测后果\"再到\"信息组合条件\"**。\n⑥**备考启示**：总归因于\"我不行\"＝**内部的、稳定的、不可控的**归因 → 后果：**预期未来仍失败（稳定）＋无力改变（不可控）＋羞耻/低落（内部）**→ 易形成**习得性无助**、动机下降。**调整**：改为**努力/方法（内部·不稳定·可控）**，用**及时反馈**校准（对应过度自信的矫正方法）。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-40","s":"社心","c":3,"t":"案例","card":40,"kd":"社会知觉与判断","stem":"小周的同桌上课从不举手。小周判断：\"他性格就是内向、不爱表现。\"后来老师点名提问，同桌答得很好。 ①小周的判断体现了什么现象？用该现象的术语作答并写出其定义要点。 ②请用凯利的三维归因理论分析：要判断同桌\"不举手\"的原因，需要获取哪三种信息？若\"一致性低、差异性高、一贯性低\"，应归因于什么？ ③若要减少小周这类判断错误，请给出两条现实可行的做法。","q":"小周的同桌上课从不举手。小周判断：\"他性格就是内向、不爱表现。\"后来老师点名提问，同桌答得很好。 ①小周的判断体现了什么现象？用该现象的术语作答并写出其定义要点。 ②请用凯利的三维归因理论分析：要判断同桌\"不举手\"的原因，需要获取哪三种信息？若\"一致性低、差异性高、一贯性低\"，应归因于什么？ ③若要减少小周这类判断错误，请给出两条现实可行的做法。","ans":"①**基本归因错误**：解释他人行为时**低估环境影响、高估个人特质与态度**的影响；两原因：视角与情境意识不同＋文化差异。\n②凯利：三方面＝**行动者（同桌）／刺激物（问题/课堂情境）／环境背景**；需三种信息＝**一致性**（其他人在同样情境是否也不举手）、**一贯性**（同桌在其他场合是否也不举手）、**独特性**（是否只对这门课/这个问题不举手）。\"**一致性低、差异性高、一贯性低 → 归因于环境背景**\"（即当时情境所致，而非其人格）。\n③做法：**多观察情境信息**（一致性/一贯性/独特性）、**换位视角**（行动者-观察者差异：想象自己在该情境会怎样）、**避免晕轮**（不以\"内向\"标签统摄全人）、**用及时反馈验证判断**（如直接询问）。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-3-41","s":"社心","c":3,"t":"案例","card":41,"kd":"社会知觉与判断","stem":"某考生模拟考后只看\"我肯定考不上\"（忽视基础概率），并反复回想\"那道题要是当时选另一个就对\"。 ①分别指出这两句话涉及的两个概念（提示：概率性忽视／反事实思维）。 ②说明各自的认知机制，并各给一条矫正做法（提示：基础比例信息／及时反馈与设想出错原因）。 L1<80% → 补错条；L2<60% → 标红当晚复述；L3<70% → 标红周末重做。 - 跨章题只调用已学章节；当前社心已学上界＝第 1–2 章（用户 2026-10-09 自报，见 `_handoff\\进度_当前.md`）。 - 调用未学章节的题 → 题面标注「需先学完：第 X 章」，降级为预习/延后做。 - 本章 L3 当前默认单章版（只用本章，随时可做）；跨章真题版待进度到位后启用。","q":"某考生模拟考后只看\"我肯定考不上\"（忽视基础概率），并反复回想\"那道题要是当时选另一个就对\"。 ①分别指出这两句话涉及的两个概念（提示：概率性忽视／反事实思维）。 ②说明各自的认知机制，并各给一条矫正做法（提示：基础比例信息／及时反馈与设想出错原因）。 L1<80% → 补错条；L2<60% → 标红当晚复述；L3<70% → 标红周末重做。 - 跨章题只调用已学章节；当前社心已学上界＝第 1–2 章（用户 2026-10-09 自报，见 `_handoff\\进度_当前.md`）。 - 调用未学章节的题 → 题面标注「需先学完：第 X 章」，降级为预习/延后做。 - 本章 L3 当前默认单章版（只用本章，随时可做）；跨章真题版待进度到位后启用。","ans":"①\"我肯定考不上\"＝**概率性忽视**（忽视**基础概率**，为小概率事件忧心）；\"要是当时选另一个就对\"＝**反事实思维**（对可能发生的事进行心理模拟）。\n②概率性忽视的机制：**易得性/代表性启发式**使当前情绪化信息权重过高 → 忽视总体录取率等**基础比例信息**；矫正：**回到基础比例**（用历年报录比/分数线做基线判断）。反事实思维的机制：**心理模拟**让人停留在\"如果…\"（并伴**控制错觉/错觉相关**的夸大）→ 消耗注意、放大自责；矫正：**及时反馈**＋**设想判断可能出错的原因**（验证性偏差的矫正法），把反思**转为可执行动作**（下一轮复习计划）。","imp":"later","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-1","s":"社心","c":4,"t":"填空","card":1,"kd":"态度及其改变","stem":"[态度的定义（老师原话：我们记这句）] ______特定事物、______、由认知、情感和行为倾向三个成分组成的心理倾向。分为外显态度（我们意识到的并易于报告的）和内隐态度（自然而然的、不受控制且往往无意识的）。","q":"[态度的定义（老师原话：我们记这句）] ______特定事物、______、由认知、情感和行为倾向三个成分组成的心理倾向。分为外显态度（我们意识到的并易于报告的）和内隐态度（自然而然的、不受控制且往往无意识的）。","ans":"态度是个体对某一 ／ 观念或他人稳固的","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-2","s":"社心","c":4,"t":"填空","card":2,"kd":"态度及其改变","stem":"[态度的三个心理成分（考试重点）] （1）认知成分：______心理印象，包括有关事实、知识和信念，______基础；（2）情感成分：对态度对象肯定或否定的评价及由此引发的情绪情感，是态度的核心与关键；（3）行为倾向成分：对态度对象所预备采取的反应，具有准备性质，但不等于外显行为。","q":"[态度的三个心理成分（考试重点）] （1）认知成分：______心理印象，包括有关事实、知识和信念，______基础；（2）情感成分：对态度对象肯定或否定的评价及由此引发的情绪情感，是态度的核心与关键；（3）行为倾向成分：对态度对象所预备采取的反应，具有准备性质，但不等于外显行为。","ans":"人们对外界对象的 ／ 是态度其余成分的","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-3","s":"社心","c":4,"t":"填空","card":3,"kd":"态度及其改变","stem":"[态度的四个心理功能] 效用功能（也叫适应功能，______他人的赞许）、知识功能（______知识，使世界有意义）、自我保护功能（帮助我们应付情绪冲突和保护自尊）、价值表达功能（帮助人们表达自我概念中的核心价值）。","q":"[态度的四个心理功能] 效用功能（也叫适应功能，______他人的赞许）、知识功能（______知识，使世界有意义）、自我保护功能（帮助我们应付情绪冲突和保护自尊）、价值表达功能（帮助人们表达自我概念中的核心价值）。","ans":"使我们寻求酬赏和 ／ 帮助我们组织有关","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-4","s":"社心","c":4,"t":"填空","card":4,"kd":"态度及其改变","stem":"[态度在什么条件下能预测行为？] ____________时、态度与行为存在具体相关时、强有力的态度能更好地预测行为。影响态度预测行为的因素包括态度的特殊性、水平、时间因素、自我意识、态度强度、态度的可接近性。","q":"[态度在什么条件下能预测行为？] ____________时、态度与行为存在具体相关时、强有力的态度能更好地预测行为。影响态度预测行为的因素包括态度的特殊性、水平、时间因素、自我意识、态度强度、态度的可接近性。","ans":"将影响态度和行为 ／ 的其他因素最小化","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-5","s":"社心","c":4,"t":"填空","card":5,"kd":"态度及其改变","stem":"[行为影响态度的表现] ______度（______证明了这一点）；言语变成信念（当人们公开表达与自己内心不符的观点时）；登门槛现象（先请人帮一个小忙，再逐步提出更大的请求）；道德行为影响道德思维。","q":"[行为影响态度的表现] ______度（______证明了这一点）；言语变成信念（当人们公开表达与自己内心不符的观点时）；登门槛现象（先请人帮一个小忙，再逐步提出更大的请求）；道德行为影响道德思维。","ans":"角色扮演会塑造态 ／ 津巴多的监狱实验","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-6","s":"社心","c":4,"t":"填空","card":6,"kd":"态度及其改变","stem":"[行为影响态度的三种理论解释] （1）自我呈现理论：______其与行为一致，属于印象管理；（2）认知失调理论：______时感到紧张，通过调整态度来缓解紧张；（3）自我知觉理论：当态度不坚定时通过观察自己的行为来推断态度，其推论包括过度合理化效应。","q":"[行为影响态度的三种理论解释] （1）自我呈现理论：______其与行为一致，属于印象管理；（2）认知失调理论：______时感到紧张，通过调整态度来缓解紧张；（3）自我知觉理论：当态度不坚定时通过观察自己的行为来推断态度，其推论包括过度合理化效应。","ans":"人们调整态度以使 ／ 当行为与态度相反","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-7","s":"社心","c":4,"t":"填空","card":7,"kd":"态度及其改变","stem":"[改变态度的四种方法] 劝说宣传法（______人们）、角色扮演法（______响来改变态度）、团体影响法（通过团体规范和准则影响态度）、活动参与法（引导人们参加与态度改变有关的活动）。","q":"[改变态度的四种方法] 劝说宣传法（______人们）、角色扮演法（______响来改变态度）、团体影响法（通过团体规范和准则影响态度）、活动参与法（引导人们参加与态度改变有关的活动）。","ans":"借助传播媒介影响 ／ 通过角色约束和影","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-8","s":"社心","c":4,"t":"填空","card":8,"kd":"态度及其改变","stem":"[海德的平衡理论（P-O-X模型）] ______协调性出发：P代表一个人，O代表另一个人，X代表一件事物。当P-O-X______生压力，促使系统向平衡过渡。态度改变遵循最少付出原则——哪个方向改变最少就改变哪里。","q":"[海德的平衡理论（P-O-X模型）] ______协调性出发：P代表一个人，O代表另一个人，X代表一件事物。当P-O-X______生压力，促使系统向平衡过渡。态度改变遵循最少付出原则——哪个方向改变最少就改变哪里。","ans":"海德从人际关系的 ／ 系统不平衡时会产","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-9","s":"社心","c":4,"t":"填空","card":9,"kd":"态度及其改变","stem":"[认知失调的定义] ____________一致的行为而引发的不舒服的感觉。当人们的态度与行为不一致，且无法找到外部理由时，会引起心理紧张。","q":"[认知失调的定义] ____________一致的行为而引发的不舒服的感觉。当人们的态度与行为不一致，且无法找到外部理由时，会引起心理紧张。","ans":"认知失调是指由于 ／ 做了一项与态度不","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-10","s":"社心","c":4,"t":"填空","card":10,"kd":"态度及其改变","stem":"[减少认知失调的五种方法] 改变态度、增加认知、______、减少决定权、改变行为。______据包括不充足理由、自由决定、努力与认知失调、决策后失调等。老师强调的一句：为某事付出的越多就越喜欢它，这一点在案例分析中经常用到。","q":"[减少认知失调的五种方法] 改变态度、增加认知、______、减少决定权、改变行为。______据包括不充足理由、自由决定、努力与认知失调、决策后失调等。老师强调的一句：为某事付出的越多就越喜欢它，这一点在案例分析中经常用到。","ans":"改变认知的重要性 ／ 支持认知失调的证","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-11","s":"社心","c":4,"t":"填空","card":11,"kd":"态度及其改变","stem":"[霍夫兰：态度学习的三种机制] 联结——______联系在一起；强化——______成态度；模仿——通过模仿榜样人物的态度而形成。","q":"[霍夫兰：态度学习的三种机制] 联结——______联系在一起；强化——______成态度；模仿——通过模仿榜样人物的态度而形成。","ans":"把特定态度与事物 ／ 受到奖励有助于形","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-12","s":"社心","c":4,"t":"填空","card":12,"kd":"态度及其改变","stem":"[凯尔曼：态度形成的三个过程] 服从——____________为；认同——从心理上认可榜样使态度一致；内化——把态度当作内在行为准则。","q":"[凯尔曼：态度形成的三个过程] 服从——____________为；认同——从心理上认可榜样使态度一致；内化——把态度当作内在行为准则。","ans":"为避免惩罚或获得 ／ 回报而采取一致行","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-13","s":"社心","c":4,"t":"填空","card":13,"kd":"态度及其改变","stem":"[计划行为理论] ______取决于态度、______，态度由对行为结果的信念和评价决定。","q":"[计划行为理论] ______取决于态度、______，态度由对行为结果的信念和评价决定。","ans":"人类有意识的行为 ／ 主观规范和控制感","imp":"support"},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L1","s":"社心","c":4,"t":"简答","card":1,"kd":"态度及其改变","stem":"请写出／说明：态度的定义（老师原话：我们记这句）（合书写要点，能写出关键词即可）","q":"请写出／说明：态度的定义（老师原话：我们记这句）（合书写要点，能写出关键词即可）","ans":"态度是个体对某一特定事物、观念或他人稳固的、由认知、情感和行为倾向三个成分组成的心理倾向。分为外显态度（我们意识到的并易于报告的）和内隐态度（自然而然的、不受控制且往往无意识的）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L2","s":"社心","c":4,"t":"简答","card":2,"kd":"态度及其改变","stem":"请写出／说明：态度的三个心理成分（考试重点）（合书写要点，能写出关键词即可）","q":"请写出／说明：态度的三个心理成分（考试重点）（合书写要点，能写出关键词即可）","ans":"（1）认知成分：人们对外界对象的心理印象，包括有关事实、知识和信念，是态度其余成分的基础；（2）情感成分：对态度对象肯定或否定的评价及由此引发的情绪情感，是态度的核心与关键；（3）行为倾向成分：对态度对象所预备采取的反应，具有准备性质，但不等于外显行为。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L3","s":"社心","c":4,"t":"简答","card":3,"kd":"态度及其改变","stem":"请写出／说明：态度的四个心理功能（合书写要点，能写出关键词即可）","q":"请写出／说明：态度的四个心理功能（合书写要点，能写出关键词即可）","ans":"效用功能（也叫适应功能，使我们寻求酬赏和他人的赞许）、知识功能（帮助我们组织有关知识，使世界有意义）、自我保护功能（帮助我们应付情绪冲突和保护自尊）、价值表达功能（帮助人们表达自我概念中的核心价值）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L4","s":"社心","c":4,"t":"简答","card":4,"kd":"态度及其改变","stem":"请写出／说明：态度在什么条件下能预测行为？（合书写要点，能写出关键词即可）","q":"请写出／说明：态度在什么条件下能预测行为？（合书写要点，能写出关键词即可）","ans":"将影响态度和行为的其他因素最小化时、态度与行为存在具体相关时、强有力的态度能更好地预测行为。影响态度预测行为的因素包括态度的特殊性、水平、时间因素、自我意识、态度强度、态度的可接近性。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L5","s":"社心","c":4,"t":"简答","card":5,"kd":"态度及其改变","stem":"请写出／说明：行为影响态度的表现（合书写要点，能写出关键词即可）","q":"请写出／说明：行为影响态度的表现（合书写要点，能写出关键词即可）","ans":"角色扮演会塑造态度（津巴多的监狱实验证明了这一点）；言语变成信念（当人们公开表达与自己内心不符的观点时）；登门槛现象（先请人帮一个小忙，再逐步提出更大的请求）；道德行为影响道德思维。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L6","s":"社心","c":4,"t":"简答","card":6,"kd":"态度及其改变","stem":"请写出／说明：行为影响态度的三种理论解释（合书写要点，能写出关键词即可）","q":"请写出／说明：行为影响态度的三种理论解释（合书写要点，能写出关键词即可）","ans":"（1）自我呈现理论：人们调整态度以使其与行为一致，属于印象管理；（2）认知失调理论：当行为与态度相反时感到紧张，通过调整态度来缓解紧张；（3）自我知觉理论：当态度不坚定时通过观察自己的行为来推断态度，其推论包括过度合理化效应。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L7","s":"社心","c":4,"t":"简答","card":7,"kd":"态度及其改变","stem":"请写出／说明：改变态度的四种方法（合书写要点，能写出关键词即可）","q":"请写出／说明：改变态度的四种方法（合书写要点，能写出关键词即可）","ans":"劝说宣传法（借助传播媒介影响人们）、角色扮演法（通过角色约束和影响来改变态度）、团体影响法（通过团体规范和准则影响态度）、活动参与法（引导人们参加与态度改变有关的活动）。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L8","s":"社心","c":4,"t":"简答","card":8,"kd":"态度及其改变","stem":"请写出／说明：海德的平衡理论（P-O-X模型）（合书写要点，能写出关键词即可）","q":"请写出／说明：海德的平衡理论（P-O-X模型）（合书写要点，能写出关键词即可）","ans":"海德从人际关系的协调性出发：P代表一个人，O代表另一个人，X代表一件事物。当P-O-X系统不平衡时会产生压力，促使系统向平衡过渡。态度改变遵循最少付出原则——哪个方向改变最少就改变哪里。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier":"B","id":"sx-4-L9","s":"社心","c":4,"t":"简答","card":9,"kd":"态度及其改变","stem":"请写出／说明：认知失调的定义（合书写要点，能写出关键词即可）","q":"请写出／说明：认知失调的定义（合书写要点，能写出关键词即可）","ans":"认知失调是指由于做了一项与态度不一致的行为而引发的不舒服的感觉。当人们的态度与行为不一致，且无法找到外部理由时，会引起心理紧张。","imp":"support","se":1},{"fk":"","kaofa":"再认","tier"
